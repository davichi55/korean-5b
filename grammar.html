 person who acts, in that person's own point of view."}],"practice":[{"q":"모른다 / 어깨를 으쓱하다","a":"그는 아무것도 모른다는 듯이 어깨를 으쓱했어요.","en":"He shrugged as if to say he knew nothing."},{"q":"괜찮다 / 웃어 보이다","a":"동생은 괜찮다는 듯이 웃어 보였어요.","en":"My younger brother smiled as if to say it was fine."},{"q":"빨리 오다 (명령) / 손짓하다","a":"엄마는 빨리 오라는 듯이 손짓했어요.","en":"Mom waved as if to say 'Come quickly'."},{"q":"나를 믿지 않다 / 쳐다보다","a":"친구는 나를 믿지 않는다는 듯이 쳐다봤어요.","en":"My friend looked at me as if to say he did not believe me."}],"hl":"[다라냐자]는 듯이","drill":[{"ko":"그는 이미 다 알고 있다는 듯이 고개를 끄덕였다.","en":"He nodded as if to say he already knew everything."},{"ko":"아이는 자기 잘못이 아니라는 듯이 시치미를 뗐다.","en":"The child pretended innocence as if it were not his fault."},{"ko":"아버지는 내가 왜 늦었냐는 듯이 시계를 가리켰다.","en":"My father pointed at his watch as if asking why I was late."},{"ko":"친구는 조금도 힘들지 않다는 듯이 계속 걸었다.","en":"My friend kept walking as if it were not hard at all."},{"ko":"팀장님은 할 만하다는 듯이 웃으며 일을 맡겼다.","en":"The team leader smiled and handed me the work as if to say it was doable."},{"ko":"그녀는 아무 일도 없었다는 듯이 출근했다.","en":"She went to work as if nothing had happened."},{"ko":"엄마는 어서 먹으라는 듯이 반찬을 내 앞으로 밀어 주었다.","en":"Mom pushed the side dishes toward me as if to say 'Eat up'."},{"ko":"점원은 다 팔렸다는 듯이 빈 상자를 가리켰다.","en":"The clerk pointed at the empty box as if to say everything was sold."},{"ko":"선생님은 이제 시작해도 좋다는 듯이 손을 흔들었다.","en":"The teacher waved a hand as if to say we could start now."},{"ko":"우리 고양이는 여기가 자기 자리라는 듯이 내 의자에 앉아 있었다.","en":"My cat sat on my chair as if to say this was its spot."}],"why":"A person's look or gesture is described, and the clause before 듯이 is an unspoken message that matches it ('as if to say ...'); a verb of gesture or expression follows.","hlShow":"[다라냐자]는 듯이"},{"id":"g5-4","ch":5,"part":"읽기 I","title":"V-기(가) 일쑤(이)다","star":0,"form":"동사 + -기(가) 일쑤이다","pattern":"V-기(가) 일쑤이다","rule":"좋지 않은 일을 자주, 습관처럼 한다는 뜻을 나타낸다.","meaning":"(Unfortunately) often does ...; tends to ... habitually. It describes something undesirable that happens again and again.","use":"V stem + -기(가) 일쑤이다: 지각하기 일쑤예요, 잃어버리기가 일쑤다. 일쑤 is a noun, so the sentence ends with -이다 (일쑤예요, 일쑤입니다, 일쑤였어요). It is used for bad or annoying habits (being late, forgetting, losing things, tripping, skipping meals). For neutral habits use 자주 or -곤 하다. The 가 can be dropped. Do not use it for good habits.","table":null,"examples":[{"ko":"요즘 야근이 많아서 아침을 거르기 일쑤예요.","en":"I work overtime a lot these days, so I often skip breakfast."},{"ko":"저는 덜렁대서 우산을 잃어버리기가 일쑤예요.","en":"I am so careless that I often lose my umbrella."},{"ko":"어릴 때 동생과 장난감 때문에 싸우기 일쑤였어요.","en":"When we were young I was always fighting with my brother over toys."}],"notes":[{"kind":"주의","ko":"좋지 않은 일에만 쓴다. 좋은 습관이나 그냥 자주 하는 일은 '자주', '-곤 하다'로 말한다.","en":"Use it only for undesirable things. For neutral or good habits, use 자주 or -곤 하다."},{"kind":"tip","ko":"'일쑤'는 명사라서 '일쑤이다(일쑤예요)'로 끝난다. '-기가 일쑤다'의 '가'는 생략할 수 있다.","en":"일쑤 is a noun, so the sentence ends in 일쑤이다 (일쑤예요, 일쑤였어요). The 가 in -기가 일쑤다 may be dropped."}],"practice":[{"q":"시험 기간 / 밤을 새우다","a":"시험 기간에는 밤을 새우기 일쑤예요.","en":"During exams I often stay up all night."},{"q":"늦잠을 자다 / 버스를 놓치다","a":"아침마다 늦잠을 자서 버스를 놓치기 일쑤예요.","en":"I oversleep every morning and often miss the bus."},{"q":"바쁘다 / 약속을 잊어버리다","a":"바쁠 때는 약속을 잊어버리기 일쑤였어요.","en":"When I was busy I would often forget appointments."},{"q":"아이들 / 뛰어다니다가 넘어지다","a":"아이들은 뛰어다니다가 넘어지기 일쑤예요.","en":"Children often fall down while running around."}],"hl":"기(?:가)? 일쑤","drill":[{"ko":"저는 월요일마다 지각하기 일쑤예요.","en":"I am often late every Monday."},{"ko":"우리 아버지는 열쇠를 어디에 뒀는지 잊어버리기 일쑤세요.","en":"My father often forgets where he put his keys."},{"ko":"피곤하면 수업 시간에 졸기 일쑤였어요.","en":"When I was tired I would often doze off in class."},{"ko":"형은 서두르다가 물건을 떨어뜨리기가 일쑤예요.","en":"My older brother often drops things when he rushes."},{"ko":"그는 말을 하다가 같은 이야기를 반복하기 일쑤다.","en":"He often repeats the same story while talking."},{"ko":"눈이 오는 날에는 길이 미끄러워서 넘어지기 일쑤예요.","en":"On snowy days the roads are slippery and people often fall."},{"ko":"퇴근이 늦어서 저녁을 거르기 일쑤입니다.","en":"I finish work late, so I often skip dinner."},{"ko":"어릴 때는 친구와 사소한 일로 싸우기 일쑤였어요.","en":"When I was little I often fought with friends over trivial things."},{"ko":"감기에 걸렸을 때는 약 먹는 것을 잊기 일쑤예요.","en":"When I have a cold I often forget to take my medicine."},{"ko":"휴대폰을 보면서 걷다가 전봇대에 부딪히기 일쑤다.","en":"He often bumps into a utility pole while walking and looking at his phone."}],"why":"A bad or annoying thing happens again and again, and the sentence ends in 일쑤; English 'tends to / keeps ...ing (unfortunately)' fits.","hlShow":"기(?:가)? 일쑤"},{"id":"g5-5","ch":5,"part":"읽기 II","title":"V-기란 ~","star":0,"form":"동사 + -기란","pattern":"V-기란 + 판단 (쉽지 않다 / 어렵다 / 힘들다 ...)","rule":"어떤 행동을 화제로 삼아 그것에 대한 설명이나 판단(주로 어렵다는 내용)을 말할 때 쓴다.","meaning":"As for doing ..., (it is ...). It takes an activity as the topic and then gives a judgement about it, usually that it is hard.","use":"V stem + -기란, a short form of -기라는 것은 (= -는 것은). The sentence then gives a judgement or explanation: 쉽지 않다, 어렵다, 힘들다, 보통 일이 아니다, 하늘의 별 따기이다. It is typical of essays, columns and thoughtful remarks, where the reader expects a truth about the difficulty of the activity. Use the plain verb stem; do not put -았/었- or -겠- before 기란. For nouns the matching form is N(이)란 (사랑이란 ...). A neutral predicate such as '좋다' sounds strange.","table":null,"examples":[{"ko":"낯선 나라에서 새 친구를 사귀기란 쉽지 않다.","en":"Making new friends in a foreign country is not easy."},{"ko":"요즘 서울에서 집을 구하기란 하늘의 별 따기예요.","en":"Finding a place to live in Seoul these days is next to impossible (like picking stars from the sky)."},{"ko":"아이를 낳고 일을 계속하기란 말처럼 쉬운 일이 아니에요.","en":"Continuing to work after having a baby is not as easy as it sounds."}],"notes":[{"kind":"tip","ko":"'-기란'은 '-기라는 것은'의 줄임말이다. 뒤에는 '쉽지 않다', '어렵다', '힘들다', '보통 일이 아니다'처럼 어려움을 말하는 표현이 자주 온다.","en":"-기란 is short for -기라는 것은. It is usually followed by an expression of difficulty such as 쉽지 않다, 어렵다, 힘들다, 보통 일이 아니다."},{"kind":"주의","ko":"명사에는 '-(이)란'(사랑이란), 동사에는 '-기란'을 쓴다. '-기는'은 비슷해 보이지만 '하기는 하지만'처럼 양보의 뜻이 있어서 다르다.","en":"Nouns take -(이)란 (사랑이란), verbs take -기란. -기는 looks similar but often carries a concession ('하기는 하지만 ...'), so it is not the same."}],"practice":[{"q":"요즘 / 취직하다 / 어렵다","a":"요즘 취직하기란 정말 어려워요.","en":"These days, getting a job is really hard."},{"q":"어른 / 새로운 언어를 배우다 / 쉽지 않다","a":"어른이 되어서 새로운 언어를 배우기란 쉽지 않아요.","en":"Learning a new language as an adult is not easy."},{"q":"외국에서 혼자 살다 / 힘들다","a":"외국에서 혼자 살기란 생각보다 힘들어요.","en":"Living alone abroad is harder than you think."},{"q":"다이어트를 계속하다 / 말처럼 쉽지 않다","a":"다이어트를 계속하기란 말처럼 쉽지 않아요.","en":"Keeping up a diet is not as easy as it sounds."}],"hl":"기란","drill":[{"ko":"퇴근 후에 운동하기란 쉽지 않아요.","en":"Exercising after work is not easy."},{"ko":"한국어로 자기 생각을 정확하게 말하기란 어려워요.","en":"Expressing your own thoughts accurately in Korean is hard."},{"ko":"저출산 문제를 해결하기란 간단한 일이 아니다.","en":"Solving the low birth rate problem is not a simple matter."},{"ko":"월급만으로 저축하기란 쉬운 일이 아니에요.","en":"Saving on a salary alone is not easy."},{"ko":"다른 사람의 마음을 이해하기란 생각보다 힘들다.","en":"Understanding another person's heart is harder than you think."},{"ko":"성격을 바꾸기란 불가능에 가깝다.","en":"Changing your personality is close to impossible."},{"ko":"바쁜 직장인이 책을 읽을 시간을 내기란 쉽지 않습니다.","en":"For a busy office worker, finding time to read is not easy."},{"ko":"아이를 혼자 키우기란 보통 일이 아니에요.","en":"Raising a child alone is no ordinary task."},{"ko":"낯선 사람에게 먼저 말을 걸기란 내성적인 사람에게는 어려운 일이다.","en":"Speaking first to a stranger is hard for an introverted person."},{"ko":"서울에서 주차할 곳을 찾기란 하늘의 별 따기예요.","en":"Finding a parking spot in Seoul is next to impossible."}],"why":"An activity is picked as the topic and immediately judged (hard, not easy, no ordinary task); 'as for ...ing, it is ...' fits, and the predicate usually names a difficulty.","hlShow":"기란"},{"id":"g6-1","ch":6,"part":"읽기 II","title":"A/V-다고 치다","star":1,"form":"형용사/동사/-이다 + -다고 치다 (간접화법 어미 + 치다)","pattern":"A/V-(ㄴ/는)다고 치다 (치자 / 쳐도 / 치더라도) + 반론","rule":"어떤 사실을 일단 그렇다고 인정하거나 가정하고, 뒤에서 그에 대한 반론이나 문제를 말할 때 쓴다.","meaning":"Let us say ...; suppose ... is true (for argument's sake). The speaker concedes a point and then raises an objection or a problem.","use":"It is the indirect-quote ending -다고 + 치다 ('regard as'): adjective -다고 치다, verb -(ㄴ/는)다고 치다, noun (이)라고 치다, past -았/었다고 치다. Typical frames are -다고 치자 (let's say), -다고 쳐도 / -다고 치더라도 (even if we suppose), followed by 그래도, 하지만, 그런데 or an objecting or negative clause. The speaker does not fully believe the premise, which is the difference from the plain conditional -(ㄴ/는)다면. Use it in discussion, debate and complaints.","table":{"head":["","형용사","동사","-이다"],"rows":[["현재","비싸다고 치다","간다고 치다","학생이라고 치다"],["부정","비싸지 않다고 치다","가지 않는다고 치다","학생이 아니라고 치다"],["과거","비쌌다고 치다","갔다고 치다","학생이었다고 치다"],["미래·추측","비쌀 거라고 치다","갈 거라고 치다","학생일 거라고 치다"]]},"examples":[{"ko":"조기 유학이 외국어 실력에 도움이 된다고 치자. 그래도 어린아이가 가족과 떨어져 사는 것이 괜찮을까요?","en":"Let's say early study abroad helps foreign-language ability. Even so, is it OK for a young child to live apart from the family?"},{"ko":"월급이 많다고 쳐도 일이 너무 힘들면 오래 다닐 수 없어요.","en":"Even if we say the salary is high, you cannot stay long if the work is too hard."},{"ko":"네 말이 맞다고 치더라도 먼저 사과는 해야지.","en":"Even supposing you are right, you should still apologise first."}],"notes":[{"kind":"tip","ko":"'-다고 치자'로 한 문장을 끝내고, 다음 문장에서 '그래도', '하지만'으로 반론하는 형태가 아주 흔하다.","en":"A very common pattern is to end one sentence with -다고 치자 and object in the next with 그래도 or 하지만."},{"kind":"주의","ko":"'-(ㄴ/는)다면'은 실제로 가능한 조건을 가정하지만, '-다고 치다'는 일단 인정하는 척할 뿐 완전히 믿지는 않는다.","en":"-(ㄴ/는)다면 supposes a real possible condition, but -다고 치다 only grants the point for now without fully believing it."}],"practice":[{"q":"MBTI가 정확하다 / 사람을 다 알 수는 없다","a":"MBTI가 정확하다고 쳐도 사람을 다 알 수는 없어요.","en":"Even if we say MBTI is accurate, you cannot know a person completely."},{"q":"값이 싸다 / 품질이 나쁘다","a":"값이 싸다고 쳐도 품질이 나쁘면 사지 않을 거예요.","en":"Even if the price is cheap, I will not buy it if the quality is bad."},{"q":"혼자 사는 게 편하다 / 외롭다","a":"혼자 사는 게 편하다고 쳐도 외로운 건 어쩔 수 없어요.","en":"Even if living alone is comfortable, loneliness cannot be helped."},{"q":"결혼하다 / 아이를 키우기 어렵다","a":"결혼한다고 치자. 그래도 아이를 키우기는 어렵잖아요.","en":"Let's say they marry. Even so, raising a child is hard, isn't it?"}],"hl":"(?:다|라)고 (?:치|쳐)","drill":[{"ko":"네가 바빴다고 쳐도 연락은 할 수 있었잖아.","en":"Even if you were busy, you could have contacted me."},{"ko":"정이 많은 것이 좋은 일이라고 치자. 하지만 지나친 간섭은 곤란해요.","en":"Let's say having a lot of jeong is good. But excessive meddling is a problem."},{"ko":"출산 장려금을 준다고 쳐도 집값이 이렇게 비싸면 아이를 낳기 어려워요.","en":"Even if they give childbirth incentives, it is hard to have a baby when house prices are this high."},{"ko":"그 사람이 실수를 했다고 치더라도 공개적으로 비난하는 것은 옳지 않아요.","en":"Even supposing he made a mistake, criticising him publicly is not right."},{"ko":"조기 유학이 도움이 된다고 치자. 비용은 어떻게 감당할 거예요?","en":"Let's say early study abroad helps. How will you cover the cost?"},{"ko":"내가 틀렸다고 치자. 그래도 네 태도는 잘못됐어.","en":"Let's say I was wrong. Even so, your attitude was wrong."},{"ko":"외향적인 사람이 더 유리하다고 쳐도 내성적인 사람의 장점도 많아요.","en":"Even if extroverts have the advantage, introverts also have many strengths."},{"ko":"시험이 쉬웠다고 쳐도 공부를 안 하면 합격하지 못해요.","en":"Even if the exam was easy, you cannot pass without studying."},{"ko":"그가 진심이라고 치더라도 그 방법은 적절하지 않았어요.","en":"Even supposing he was sincere, that method was not appropriate."},{"ko":"일이 재미있다고 쳐도 매일 야근을 하면 건강을 해칠 거예요.","en":"Even if the work is fun, working overtime every day will damage your health."}],"why":"The speaker grants a premise only for argument ('okay, suppose ...'), and an objection follows right after with 그래도, 하지만, or a negative or doubting clause.","hlShow":"(?:다|라)고 (?:치|쳐)"},{"id":"g6-2","ch":6,"part":"읽기 II","title":"A/V-다면 몰라도 ~","star":1,"form":"형용사/동사/-이다 + -다면 몰라도 (줄임: -(으)면 몰라도)","pattern":"A/V-(ㄴ/는)다면 몰라도 + 부정적인 결론","rule":"앞의 조건이라면 그럴 수도 있겠지만, 그렇지 않으면 뒤의 일은 어렵거나 말이 안 된다는 뜻을 나타낸다.","meaning":"If ... then maybe (I would understand), but otherwise not. An unlikely or exceptional condition is granted, and then the real conclusion is negative or doubtful: 'unless ..., it can't be so'.","use":"Attach -(ㄴ/는)다면 or the short form -(으)면 + 몰라도: 어린아이라면 몰라도 (a small child maybe), 눈이 많이 온다면 몰라도 (unless it snows heavily), 특별한 이유가 있다면 몰라도. Past: -았/었다면 몰라도. Nouns: N(이)라면 몰라도. The second clause is negative or doubtful: -(으)ㄹ 수 없다, -기 어렵다, 안 되다, -지 않다. The first clause is an exception that the speaker thinks unlikely, so the message is 'only in that case, but in the ordinary case no'. Do not confuse it with -(으)ㄴ/는지 몰라도 ('I do not know whether').","table":{"head":["","형용사","동사","-이다"],"rows":[["현재","어리다면 몰라도","간다면 몰라도","학생이라면 몰라도"],["과거","어렸다면 몰라도","갔다면 몰라도","학생이었다면 몰라도"],["줄임","어리면 몰라도","가면 몰라도","학생이면 몰라도"]]},"examples":[{"ko":"어린아이라면 몰라도 어른이 그런 말을 하면 곤란해요.","en":"A small child maybe, but it is awkward when an adult says something like that."},{"ko":"복권에 당첨된다면 몰라도 월급만으로 집을 사기는 어려워요.","en":"Unless you win the lottery, it is hard to buy a house on a salary alone."},{"ko":"처음 만난 사이라면 몰라도 오랜 친구한테까지 그렇게 말할 필요는 없잖아요.","en":"Maybe with someone you have just met, but there is no need to talk like that even to an old friend."}],"notes":[{"kind":"주의","ko":"뒤 문장은 부정적이거나 의심하는 내용이어야 한다. '-다면 몰라도' 뒤에 좋은 결과를 쓰면 어색하다.","en":"The second clause must be negative or doubtful. A positive conclusion after -다면 몰라도 sounds wrong."},{"kind":"tip","ko":"'-(으)면 몰라도'로 줄여서 말할 수 있다. 예: 한두 번이면 몰라도 매번 이러면 곤란해요.","en":"It can be shortened to -(으)면 몰라도: '한두 번이면 몰라도 매번 이러면 곤란해요' (once or twice is fine, but doing this every time is a problem)."}],"practice":[{"q":"특별한 이유가 있다 / 화를 낼 수 없다","a":"특별한 이유가 있다면 몰라도 그렇게 화를 낼 수는 없어요.","en":"Unless there is a special reason, you cannot get angry like that."},{"q":"부자이다 / 비싼 차를 사기 어렵다","a":"부자라면 몰라도 비싼 차를 사기는 어려워요.","en":"Maybe if you were rich, but buying an expensive car is hard."},{"q":"한두 번이다 / 매번 늦으면 곤란하다","a":"한두 번이라면 몰라도 매번 늦으면 곤란해요.","en":"Once or twice maybe, but being late every time is a problem."},{"q":"방학이다 / 평일에 여행을 가기 어렵다","a":"방학이라면 몰라도 평일에 여행을 가기는 어려워요.","en":"During vacation maybe, but it is hard to travel on weekdays."}],"hl":"면 몰라도","drill":[{"ko":"휴일이라면 몰라도 평일에 그렇게 오래 쉴 수는 없어요.","en":"On a holiday maybe, but you cannot rest that long on a weekday."},{"ko":"어린아이라면 몰라도 성인이 그런 일로 우는 건 이상해요.","en":"A small child maybe, but it is strange for an adult to cry over that."},{"ko":"한 번이라면 몰라도 같은 실수를 계속하면 안 됩니다.","en":"Once maybe, but you must not keep making the same mistake."},{"ko":"월급이 두 배로 오른다면 몰라도 지금 직장을 그만두기는 어려워요.","en":"Unless my salary doubles, it is hard to quit my current job."},{"ko":"외국에서 오래 살았다면 몰라도 한국에서만 자란 사람이 그렇게 말하긴 힘들어요.","en":"If he had lived abroad for long maybe, but someone raised only in Korea can hardly speak like that."},{"ko":"친한 친구라면 몰라도 처음 만난 사람에게 돈을 빌려 달라고 할 수는 없어요.","en":"With a close friend maybe, but you cannot ask someone you have just met to lend you money."},{"ko":"급한 일이 생겼다면 몰라도 이유 없이 약속을 취소하면 안 되죠.","en":"If something urgent came up maybe, but you must not cancel an appointment for no reason."},{"ko":"비가 많이 온다면 몰라도 이 정도 비에 행사를 취소하지는 않을 거예요.","en":"Unless it rains heavily, they will not cancel the event over this much rain."},{"ko":"부모님이 허락하신다면 몰라도 지금은 유학을 가기 어려워요.","en":"Unless my parents allow it, it is hard to study abroad now."},{"ko":"신입 사원이라면 몰라도 팀장이 그런 실수를 하면 안 되지요.","en":"A new employee maybe, but a team leader must not make that kind of mistake."}],"why":"The first clause is an unusual or exceptional condition, and the second clause denies or doubts the normal case (cannot, hard, must not); 'maybe if ..., but otherwise no' fits.","hlShow":"면 몰라도"},{"id":"g6-3","ch":6,"part":"읽기 I","title":"A/V-(으)ㄴ/는 가운데 ~","star":0,"form":"형용사 -(으)ㄴ / 동사 현재 -는 / 동사 과거 -(으)ㄴ·-던 / -인 + 가운데","pattern":"A/V-(으)ㄴ/는 가운데 + 일어난 일","rule":"앞의 상황이 계속되는 속에서 뒤의 일이 일어남을 나타낸다. 주로 뉴스나 글에서 쓴다.","meaning":"While ...; amid ...; in the midst of .... It sets up a background situation (news style), and the main event happens within it.","use":"Attach -(으)ㄴ to adjectives, -는 to present-tense verbs, -(으)ㄴ or -던 to finished or past events, and 인 to nouns, then 가운데: 어려운 가운데, 지켜보는 가운데, 마친 가운데, 학생인 가운데. The first clause is a continuing situation or atmosphere (관심이 쏠리는, 비가 오는, 어려운), and the second is the main event (열렸다, 발표했다). It is typical of news, reports and speeches. It is not for two actions done by one person at the same time (use -(으)면서 for that). 가운데에도 means 'even amid'. N 가운데 ('among N / in the middle') is a different usage.","table":{"head":["","형용사","동사","-이다"],"rows":[["현재","어려운 가운데","하는 가운데","학생인 가운데"],["과거","어려웠던 가운데","한 / 하던 가운데","학생이었던 가운데"],["부정","어렵지 않은 가운데","하지 않는 가운데","학생이 아닌 가운데"]]},"examples":[{"ko":"많은 시민들이 지켜보는 가운데 새 정책이 발표되었다.","en":"The new policy was announced with many citizens watching."},{"ko":"경제가 어려운 가운데에도 출산 지원금을 늘리기로 했다.","en":"Even amid economic difficulty, they decided to increase childbirth support."},{"ko":"비가 오는 가운데 마라톤 대회가 열렸다.","en":"The marathon was held in the rain."}],"notes":[{"kind":"주의","ko":"한 사람이 동시에 하는 두 행동에는 쓰지 않는다. 그럴 때는 '-(으)면서'를 쓴다. 예: 음악을 들으면서 걸어요.","en":"Do not use it for two actions done at once by one person; use -(으)면서 there: '음악을 들으면서 걸어요'."},{"kind":"tip","ko":"'N 가운데'는 '~ 중에서'(among)나 '한가운데'(middle)라는 다른 뜻으로도 쓰이고, '그런 가운데'는 '그런 상황 속에서'라는 뜻이다.","en":"'N 가운데' also means 'among N' or 'the middle'; '그런 가운데' means 'in that situation, meanwhile'."}],"practice":[{"q":"많은 사람이 기대하다 / 새 영화가 개봉하다","a":"많은 사람이 기대하는 가운데 새 영화가 개봉했다.","en":"The new movie opened amid high expectations."},{"q":"날씨가 춥다 / 행사가 열리다","a":"날씨가 추운 가운데 행사가 열렸다.","en":"The event was held in the cold weather."},{"q":"저출산 문제가 심각하다 / 대책을 발표하다","a":"저출산 문제가 심각한 가운데 정부가 새 대책을 발표했다.","en":"Amid the serious low birth rate problem, the government announced new measures."},{"q":"어려움이 계속되다 / 끝까지 노력하다","a":"어려움이 계속되는 가운데에도 팀원들은 끝까지 노력했다.","en":"Even amid continuing difficulties, the team members kept trying to the end."}],"hl":"(?:[간갠갼걘건겐견곈곤관괜괸굔군권궨귄균근긘긴깐깬꺈꺤껀껜껸꼔꼰꽌꽨꾄꾠꾼꿘꿴뀐뀬끈끤낀난낸냔냰넌넨년녠논놘놴뇐뇬눈눤뉀뉜뉸는늰닌단댄댠 ":0,"form":"동사 현재 -는 / 과거·형용사 -(으)ㄴ / 명사 -인 + 셈이다","pattern":"A/V-(으)ㄴ/는 셈이다","rule":"실제로는 다르지만 결과적으로 그렇다고 볼 수 있음을 나타낸다.","meaning":"It amounts to ...; it is as good as ...; in effect ...; you could say .... The speaker looks at the facts and concludes that the result is basically the same as something.","use":"Attach -는 (present verb), -(으)ㄴ (finished verb or adjective) or 인 (noun) + 셈이다: 받는 셈이다, 끝낸 셈이다, 싼 셈이다, 가족인 셈이다. It often follows 사실상, 결국, 거의 or a number or comparison (십 년을 살았으니 ...). 셈 means 'calculation', so the sentence adds up the facts and states the sum. Beware -(으)ㄹ 셈이다, which means 'intend to' (갈 셈이다 = I intend to go) and is a different grammar.","table":{"head":["","형용사","동사","-이다"],"rows":[["현재","싼 셈이다","하는 셈이다","학생인 셈이다"],["과거·완료","싼 셈이었다","한 셈이다","학생이었던 셈이다"],["의도 (다른 문법)","-","할 셈이다","-"]]},"examples":[{"ko":"이 가방은 세일 때 사서 반값에 산 셈이에요.","en":"I bought this bag on sale, so in effect I got it for half price."},{"ko":"한국에서 십 년을 살았으니 한국 사람이나 다름없는 셈이에요.","en":"I have lived in Korea for ten years, so I am practically Korean."},{"ko":"보고서를 거의 다 썼으니 일은 끝난 셈이에요.","en":"I have almost finished the report, so the work is as good as done."}],"notes":[{"kind":"주의","ko":"'-(으)ㄹ 셈이다'는 '~할 생각이다'라는 뜻으로 전혀 다른 문법이다. 예: 내일은 일찍 일어날 셈이에요.","en":"-(으)ㄹ 셈이다 means 'intend to' and is a different grammar: '내일은 일찍 일어날 셈이에요' (I intend to get up early tomorrow)."},{"kind":"tip","ko":"'-(으)ㄴ 셈 치고'는 '~한 것으로 생각하고'라는 뜻이다. 예: 속은 셈 치고 한번 해 보세요.","en":"'-(으)ㄴ 셈 치고' means 'treating it as if ...': '속은 셈 치고 한번 해 보세요' (try it once, as if you had been fooled)."}],"practice":[{"q":"열 시간이나 일하다 / 하루 종일","a":"열 시간이나 일했으니 하루 종일 일한 셈이에요.","en":"I worked ten hours, so I worked all day in effect."},{"q":"부모님과 같이 살다 / 독립하지 않다","a":"부모님과 같이 사니까 아직 독립하지 않은 셈이에요.","en":"I live with my parents, so I am basically not independent yet."},{"q":"한 과만 남다 / 5급을 거의 끝내다","a":"이제 한 과만 남았으니 5급을 거의 끝낸 셈이에요.","en":"Only one lesson is left, so I have practically finished level 5."},{"q":"친구에게 빌리다 / 공짜로 쓰다","a":"친구에게 밴뱐뱬번벤변볜본봔봰뵌뵨분붠붼뷘뷴븐븬빈빤뺀뺜뺸뻔뻰뼌뼨뽄뽠뽼뾘뾴뿐뿬쀈쀤쁀쁜쁸삔산샌샨섄선센션셴손솬쇈쇤숀순숸쉔쉰슌슨싄신싼쌘쌴썐썬쎈쎤쏀쏜쏸쐔쐰쑌쑨쒄쒠쒼쓘쓴씐씬안앤얀얜언엔연옌온완왠왼욘운원웬윈윤은읜인잔잰쟌쟨전젠젼졘존좐좬죈죤준줜줸쥔쥰즌즨진짠짼쨘쨴쩐쩬쪈쪤쫀쫜쫸쬔쬰쭌쭨쮄쮠쮼쯘쯴찐찬챈챤첀천첸쳔쳰촌촨쵄쵠쵼춘춴췐췬츈츤칀친칸캔캰컌컨켄켠켼콘콴쾐쾬쿈쿤퀀퀜퀸큔큰킌킨탄탠탼턘턴텐텬톈톤퇀퇜퇸툔툰퉌퉨튄튠튼틘틴판팬퍈퍤펀펜편폔폰퐌퐨푄푠푼풘풴퓐퓬픈픤핀한핸햔햰헌헨현혠혼환홴횐횬훈훤휀휜휸흔흰힌]) 셈(?:이|입)"},{"id":"g7-1","ch":7,"part":"읽기 I","title":"A/V-더니","star":1,"form":"Verb / adjective stem + -더니 (past: -았/었더니; N이다: N(이)더니)","pattern":"(다른 사람이) A/V-더니 + 다음 행동 / 변화 / 결과","rule":"예전에 직접 보거나 겪은 일(주로 다른 사람의 행동이나 상태)을 말하고, 그 일 뒤에 이어진 행동·변화·결과를 말할 때 쓴다.","meaning":"\"I saw that ~, and then ~.\" It links something the speaker observed earlier (usually about another person) to what followed: a next action, a changed present state, or a result.","use":"Attach -더니 to a verb or adjective stem (past: -았/었더니; with a noun: N(이)더니). The first clause is something the speaker saw earlier, usually about a third person or the weather; the second clause is what followed it: a next action, a change, or a result. The subject of both clauses is normally the same. When your own action is followed by a result you discovered, use -았/었더니 instead. Common partner: 그러더니 (\"and then\"). Typical mistake: using -더니 when the subject of the first clause is \"I\".","table":{"head":["Type","Form","Example"],"rows":[["Verb","stem + -더니","울다 → 울더니, 웃다 → 웃더니"],["Adjective","stem + -더니","덥다 → 덥더니, 춥다 → 춥더니"],["Noun + 이다","N(이)더니","학생이더니, 비더니"],["Own action → result","stem + -았/었더니","먹다 → 먹었더니, 말하다 → 말했더니"]]},"examples":[{"ko":"민수 씨가 선생님께 두 손으로 선물을 드리더니 고개를 숙여 인사했어요.","en":"Minsu handed the teacher a gift with both hands and then bowed to greet him."},{"ko":"어제까지 덥더니 오늘은 갑자기 쌀쌀해졌어요.","en":"It was hot until yesterday, but today it suddenly turned chilly."},{"ko":"낯선 나라에서 손짓으로 말했더니 사람들이 금방 알아들었어요.","en":"When I spoke with hand gestures in an unfamiliar country, people understood right away."}],"notes":[{"kind":"주의","ko":"-더니는 내가 직접 본 다른 사람의 행동에 써요. 내 행동 뒤에 나온 결과는 -았/었더니로 말해요. (약을 먹었더니 열이 내렸어요.)","en":"-더니 is for what you saw someone else do. For your own action followed by a result, use -았/었더니: 약을 먹었더니 열이 내렸어요 (\"I took the medicine and the fever went down\"). Do not say 약을 먹더니 for \"I\"."},{"kind":"tip","ko":"앞뒤 주어가 같고 내용이 대조될 때도 써요. (어제는 비가 오더니 오늘은 맑네요.) \"그러더니\"는 \"그리고 나서\"라는 뜻이에요.","en":"It also works for contrast when both clauses share the same subject (it rained yesterday, but it is clear today). 그러더니 means \"and then\"."}],"practice":[{"q":"Your brother: crying earlier → laughing now (울다 / 웃다)","a":"동생이 아까는 울더니 지금은 웃고 있어요.","en":"My brother was crying a while ago, but now he is laughing."},{"q":"A friend: reads a book → falls asleep (읽다 / 잠이 들다)","a":"친구가 책을 읽더니 곧 잠이 들었어요.","en":"My friend read a book and soon fell asleep."},{"q":"Yourself: took medicine → fever went down (-았/었더니)","a":"약을 먹었더니 열이 내렸어요.","en":"I took the medicine and the fever went down."},{"q":"Yourself: greeted first → the person smiled back (-았/었더니)","a":"제가 먼저 인사했더니 그분도 웃으면서 인사해 주셨어요.","en":"When I greeted first, that person smiled and greeted me back."}],"hl":"(았|었|였|했)?더니","drill":[{"ko":"아이가 아침에는 열이 나더니 저녁에는 괜찮아졌어요.","en":"The child had a fever in the morning, but was fine by the evening."},{"ko":"그 사람은 갑자기 고개를 끄덕이더니 웃기 시작했어요.","en":"That person suddenly nodded and began to smile."},{"ko":"요즘 날씨가 춥더니 결국 눈이 내리네요.","en":"It has been cold lately, and now it is finally snowing."},{"ko":"동생이 열심히 연습하더니 대회에서 일등을 했어요.","en":"My brother practised hard and then won first place at the contest."},{"ko":"어제는 비가 오더니 오늘은 하늘이 맑아요.","en":"It rained yesterday, but the sky is clear today."},{"ko":"친구가 한참 생각하더니 이렇게 말했어요.","en":"My friend thought for a long while and then said this."},{"ko":"손을 흔들었더니 그 사람도 손을 흔들어 주었어요.","en":"When I waved my hand, that person waved back."},{"ko":"밤새 공부했더니 머리가 아파요.","en":"I studied all night, so my head hurts."},{"ko":"선생님께서 칭찬해 주시더니 선물까지 주셨어요.","en":"The teacher praised us and even gave us a present."},{"ko":"눈을 마주쳤더니 그 사람이 얼굴을 돌렸어요.","en":"When our eyes met, that person turned their face away."}],"why":"Look for a past observation (usually of another person or the weather) followed by a related action, change or result; if the observer is \"I\" and it is my own action plus a result I found out, it becomes -았/었더니.","hlShow":"(았|었|였|했)?더니"},{"id":"g7-2","ch":7,"part":"읽기 II","title":"V-다시피 ~","star":1,"form":"Perception / knowledge verb stem + -다시피 (past: -았/었다시피; honorific: 보시다시피, 아시다시피)","pattern":"(보시)다시피 ~, …","rule":"듣는 사람도 이미 보았거나 알거나 들은 사실을 앞에 말하고, 그 뒤에 하고 싶은 말을 이어 갈 때 쓴다.","meaning":"\"As you can see / as you know / as you have heard, ~.\" The speaker points to something the listener also sees, knows or has heard, and then continues with the main statement.","use":"Attach -다시피 to verbs of seeing, knowing and hearing such as 보다, 알다, 듣다, 느끼다, 말하다, 예상하다: 보시다시피, 아시다시피, 들으셨다시피. For something that has already been said, use the past form -았/었다시피 (말씀드렸다시피). It normally opens the sentence and sounds fairly formal, so it is common in talks, presentations and announcements. Typical mistakes: using it for new information the listener does not know yet, or attaching it to verbs that have nothing to do with perception or knowledge.","table":{"head":["Verb","Plain","Honorific / past"],"rows":[["보다 (see)","보다시피","보시다시피"],["알다 (know)","알다시피","아시다시피"],["듣다 (hear)","듣다시피","들으셨다시피"],["말하다 (say)","말하다시피","말씀드렸다시피 / 말했다시피"]]},"examples":[{"ko":"보시다시피 한국에서는 어른께 물건을 드릴 때 두 손을 사용합니다.","en":"As you can see, in Korea people use both hands when giving something to an elder."},{"ko":"아시다시피 나라마다 인사하는 방법이 달라요.","en":"As you know, the way of greeting differs from country to country."},{"ko":"지난 시간에 말씀드렸다시피 내일은 몸짓 언어 발표가 있습니다.","en":"As I said in the last class, tomorrow we have the body-language presentation."}],"notes":[{"kind":"주의","ko":"-다시피는 보다, 알다, 듣다처럼 보고 아는 동사에 붙고, 듣는 사람도 이미 아는 사실에 써요. 상대가 모르는 새로운 정보에는 쓰지 않아요.","en":"-다시피 attaches to verbs of seeing, knowing and hearing and refers to a fact the listener already shares. It is not used for new information the listener does not know."},{"kind":"tip","ko":"\"-다시피 하다\"는 \"거의 ~하다\"라는 다른 뜻이에요. (밤을 새우다시피 했어요.)","en":"Do not confuse it with -다시피 하다, which means \"to do almost ~\": 밤을 새우다시피 했어요 = \"I almost stayed up all night\". That is a different grammar point."}],"practice":[{"q":"(you can see) The people in the photo are all smiling","a":"보시다시피 사진 속 사람들이 모두 웃고 있어요.","en":"As you can see, everyone in the photo is smiling."},{"q":"(you know) This week is exam week","a":"아시다시피 이번 주는 시험 기간이에요.","en":"As you know, this week is exam week."},{"q":"(you heard) There is no class tomorrow","a":"들으셨다시피 내일은 수업이 없습니다.","en":"As you heard, there is no class tomorrow."},{"q":"(you felt) It has become very cold lately","a":"느끼셨다시피 요즘 날씨가 많이 추워요.","en":"As you have felt, the weather has become very cold lately."}],"hl":"다시피","drill":[{"ko":"알다시피 우리 학교는 지하철역에서 가까워요.","en":"As you know, our school is close to the subway station."},{"ko":"보시다시피 이 방은 아주 작습니다.","en":"As you can see, this room is very small."},{"ko":"아시다시피 한국에서는 나이가 중요해요.","en":"As you know, age matters in Korea."},{"ko":"여러분이 들으셨다시피 회의는 다음 주로 미뤄졌습니다.","en":"As you heard, the meeting has been put off until next week."},{"ko":"예상했다시피 시험이 어려웠어요.","en":"As we expected, the exam was difficult."},{"ko":"앞에서 설명했다시피 이 표현은 어른께 쓰지 않아요.","en":"As I explained earlier, we do not use this expression with elders."},{"ko":"보다시피 저는 지금 많이 바빠요.","en":"As you can see, I am very busy right now."},{"ko":"다 아시다시피 몸짓의 뜻은 문화마다 다릅니다.","en":"As you all know, the meaning of gestures differs from culture to culture."},{"ko":"느끼셨다시피 이 방법은 조금 어렵습니다.","en":"As you have felt, this method is a little difficult."},{"ko":"배웠다시피 '선생님'은 높임말이에요.","en":"As we learned, 선생님 is an honorific word."}],"why":"Look for a speaker who points to something the listener can also see, knows or has heard (\"as you can see / as you know\") and then adds a statement, usually at the start of a formal sentence.","hlShow":"다시피"},{"id":"g7-3","ch":7,"part":"읽기 II","title":"A/V-아/어야지 A/V-아/어서는 안 된다","star":1,"form":"Verb / adjective + -아/어야지 (요) ; verb + -아/어서는 안 된다","pattern":"V-아/어야지(요) , V-아/어서는 안 된다","rule":"-아/어야지는 해야 하는 일을 당연한 듯이 말하거나 스스로 다짐할 때, -아/어서는 안 된다는 어떤 행동을 해서는 안 된다고 강하게 금지할 때 쓴다.","meaning":"-아/어야지 means \"you should ~ (of course)\" or \"I must ~\" as a firm reminder or resolution; -아/어서는 안 된다 means \"you must not ~\".","use":"-아/어야지(요) is added to a verb or adjective stem and says that something ought to be done; said to someone else it is a reminder or mild reproach, said to yourself it is a resolution (내일부터 운동해야지). -아/어서는 안 된다 is a stronger and more formal prohibition than -(으)면 안 되다 and is typical for rules, manners and morals. The two are often paired: \"you should do A, you must not do B\". Write 안 돼요 (not 안 되요) in the polite form.","table":{"head":["Verb / adjective","-아/어야지","-아/어서는 안 된다"],"rows":[["가다","가야지","가서는 안 된다"],["먹다","먹어야지","먹어서는 안 된다"],["하다","해야지","해서는 안 된다"],["좋다","좋아야지","좋아서는 안 된다"]]},"examples":[{"ko":"어른께 인사할 때는 고개를 숙여야지요.","en":"When you greet an elder, you should bow your head, of course."},{"ko":"어른 앞에서 다리를 꼬고 앉아서는 안 됩니다.","en":"You must not sit with your legs crossed in front of an elder."},{"ko":"다른 나라 문화를 존중해야지 무시해서는 안 돼요.","en":"You should respect other countries' cultures, not look down on them."}],"notes":[{"kind":"주의","ko":"-아/어서는 안 된다는 -(으)면 안 되다보다 더 강하고 격식 있는 말이에요. 예의, 규칙, 도덕에 자주 써요. 말할 때는 \"안 돼요\"라고 써요. (\"안 되요\"는 틀려요.)","en":"-아/어서는 안 된다 is stronger and more formal than -(으)면 안 되다 and is common for manners, rules and morals. The polite form is 안 돼요, never 안 되요."},{"kind":"tip","ko":"-아/어야지로 문장을 끝내면 상대에게는 \"당연히 ~해야 해요\"라는 말이고, 혼잣말로는 \"~해야겠다\"라는 다짐이에요.","en":"When a sentence simply ends in -아/어야지, it is a \"you should, of course\" reminder to someone else, or a resolution (\"I must ~\") when you talk to yourself."}],"practice":[{"q":"(should) Keep the appointment time","a":"약속 시간은 꼭 지켜야지요.","en":"You should definitely keep the appointment time, of course."},{"q":"(must not) Talk loudly in a cinema","a":"극장에서 크게 떠들어서는 안 돼요.","en":"You must not talk loudly in a cinema."},{"q":"(to yourself) Start exercising from tomorrow","a":"내일부터는 운동을 시작해야지.","en":"I should start exercising from tomorrow."},{"q":"(must not) Speak casually in front of elders","a":"어른 앞에서 반말해서는 안 됩니다.","en":"You must not speak casually in front of elders."}],"hl":"(아|어|여|해)?야지|(아|어|여|해)?서는(?= 안)","drill":[{"ko":"건강하려면 규칙적으로 운동을 해야지요.","en":"If you want to be healthy, you should of course exercise regularly."},{"ko":"시험 기간에는 일찍 자야지 밤을 새워서는 안 돼요.","en":"During exams you should sleep early, not stay up all night."},{"ko":"도서관에서 큰 소리로 전화를 받아서는 안 됩니다.","en":"You must not answer the phone loudly in a library."},{"ko":"이번 주말에는 방 청소를 해야지.","en":"I should clean my room this weekend."},{"ko":"처음 만난 사람에게 나이를 물어서는 안 되는 나라도 있어요.","en":"In some countries you must not ask the age of someone you have just met."},{"ko":"외국에 가면 그 나라 예절을 배워야지요.","en":"When you go abroad, you should of course learn that country's manners."},{"ko":"아무리 급해도 신호를 무시하고 길을 건너서는 안 됩니다.","en":"However urgent it is, you must not cross the road ignoring the signal."},{"ko":"약속을 했으면 지켜야지 안 지키면 어떻게 해요?","en":"If you made a promise, you have to keep it. What are you doing if you don't?"},{"ko":"남의 이야기를 함부로 믿어서는 안 돼요.","en":"You must not believe other people's stories carelessly."},{"ko":"선생님께는 두 손으로 선물을 드려야지요.","en":"You should give a present to the teacher with both hands, of course."}],"why":"Look for a statement about proper behaviour: an obligation you stress (\"of course you should\") points to -아/어야지, and a rule or manner that forbids an act points to -아/어서는 안 된다.","hlShow":"(아|어|여|해)?야지|(아|어|여|해)?서는(?= 안)"},{"id":"g7-4","ch":7,"part":"읽기 I","title":"N(이)라고 ~ / N하고 ~","star":0,"form":"Noun + 이라고 (after a consonant) / 라고 (after a vowel) + 부르다·하다·말하다; quoted word or sound + 하고","pattern":"N을/를 'N'(이)라고 부르다 / '소리' 하고 말하다","rule":"사람이나 물건을 무엇이라고 부르는지 말하거나, 어떤 말이나 소리를 그대로 인용할 때 쓴다.","meaning":"\"To call someone or something N\" and \"to quote a word or sound directly\". N(이)라고 gives the name, form of address or term; N 하고 repeats the word or sound as it was said.","use":"Use N이라고 after a noun with a final consonant and N라고 after a noun without one, followed by 부르다, 하다 or 말하다. It tells how a person or thing is called: a name, a form of address, a term. N 하고 is a direct quote: it follows a word or sound in quotation marks and is written with a space ('엄마!' 하고 소리치다). Note that this 하고 is not the 하고 that means \"and / with\".","table":{"head":["Form","Used when","Example"],"rows":[["N이라고","N ends in a consonant","'선배님'이라고 불러요"],["N라고","N ends in a vowel","'대니'라고 불러요"],["\"…\" 하고","repeating a word or sound as spoken","'엄마!' 하고 소리치다"]]},"examples":[{"ko":"한국에서는 선배를 '선배님'이라고 불러요.","en":"In Korea people call an older schoolmate or colleague '선배님'."},{"ko":"친구들은 저를 '대니'라고 불러요.","en":"My friends call me 'Danny'."},{"ko":"아이가 \"엄마!\" 하고 소리치며 달려왔어요.","en":"The child ran over shouting \"Mom!\""}],"notes":[{"kind":"주의","ko":"받침이 있으면 '이라고', 없으면 '라고'를 써요. 이 '하고'는 '친구하고'의 하고와 달라요. 인용하는 말이나 소리 뒤에 띄어 써요.","en":"Use 이라고 after a final consonant and 라고 after a vowel. This 하고 is not the 하고 of 친구하고 (\"with / and\"): it comes after a quoted word or sound and is written with a space."},{"kind":"tip","ko":"이름이나 용어를 설명할 때는 '하다'나 '부르다'와 같이 써요. (이것을 한국어로 '손짓'이라고 해요.)","en":"When you explain a name or a term, pair it with 하다 or 부르다: 이것을 한국어로 '손짓'이라고 해요 means \"In Korean this is called 손짓\"."}],"practice":[{"q":"Your friends call you 민지","a":"친구들은 저를 '민지'라고 불러요.","en":"My friends call me 'Minji'."},{"q":"A woman calls her older sister 언니","a":"한국에서는 여자가 손위 여자 형제를 '언니'라고 불러요.","en":"In Korea a woman calls her older sister '언니'."},{"q":"This is called 손짓 in Korean","a":"이것을 한국어로 '손짓'이라고 해요.","en":"In Korean this is called '손짓'."},{"q":"The child shouts \"Dad!\" and runs over (하고)","a":"아이가 '아빠!' 하고 소리치며 뛰어왔어요.","en":"The child ran over shouting \"Dad!\""}],"hl":"이?라고|하고(?= [불말소인외])","drill":[{"ko":"우리는 선생님을 '선생님'이라고 부르고 이름은 부르지 않아요.","en":"We call the teacher '선생님' and do not use his name."},{"ko":"사람들이 저를 '미나'라고 부르기 시작했어요.","en":"People started to call me 'Mina'."},{"ko":"한국에서는 시어머니를 '어머님'이라고 불러요.","en":"In Korea people call their mother-in-law '어머님'."},{"ko":"이 그림을 '풍속화'라고 해요.","en":"This kind of painting is called 'genre painting'."},{"ko":"이런 인사를 '목례'라고 합니다.","en":"This kind of greeting is called a 'nod bow'."},{"ko":"아기가 '엄마' 하고 말했어요.","en":"The baby said \"Mama\"."},{"ko":"그는 큰 소리로 '여보세요' 하고 불렀어요.","en":"He called out loudly, \"Hello?\""},{"ko":"친구가 '안녕!' 하고 인사하며 손을 흔들었어요.","en":"My friend greeted me with \"Hi!\" and waved."},{"ko":"외국 사람들은 보통 저를 '미스터 킴'이라고 불러요.","en":"Foreigners usually call me 'Mr. Kim'."},{"ko":"엄지를 올리는 몸짓을 '최고'라고 해요.","en":"The thumbs-up gesture means 'the best'."}],"why":"Look for a name, nickname, term or sound that is mentioned and then called, named or said: use N(이)라고 for names and terms with 부르다/하다, and 하고 right after a quoted word or sound.","hlShow":"이?라고|하고(?= [불말소인외])"},{"id":"g7-5","ch":7,"part":"읽기 I","title":"N(이)란","star":0,"form":"Noun + 이란 (after a consonant) / 란 (after a vowel)","pattern":"N(이)란 ~(이)다 / ~는 것이다","rule":"어떤 말의 뜻을 설명하거나 그것에 대한 일반적인 생각을 말할 때 쓴다. \"N(이)라는 것은\"을 줄인 말이다.","meaning":"\"N, that is ~ / what N means is ~.\" It takes N as the topic in order to define it or give a general comment about it.","use":"Use N이란 after a final consonant and N란 after a vowel. It is the short form of N(이)라는 것은 and is followed by an explanation of N. The sentence typically ends in ~(이)다, ~는 것이다 or ~(이)라고 할 수 있다. It is common in essays, presentations and lessons. Do not use it for a particular person or event; there you use plain 은/는.","table":{"head":["N ends in","Form","Example"],"rows":[["vowel","N란","언어란, 문화란"],["consonant","N이란","호칭이란, 예술이란"],["full form","N(이)라는 것은 → N(이)란","사랑이라는 것은 → 사랑이란"]]},"examples":[{"ko":"몸짓 언어란 말 대신 몸으로 마음을 전하는 방법이에요.","en":"Body language is a way of conveying your feelings with your body instead of words."},{"ko":"호칭이란 사람을 부를 때 쓰는 말이에요.","en":"A form of address is the word you use when you call a person."},{"ko":"예의란 상대방을 존중하는 마음에서 나오는 거예요.","en":"Manners come from a heart that respects the other person."}],"notes":[{"kind":"주의","ko":"N(이)란은 \"무엇은 무엇이다\"라고 정의하거나 일반적인 생각을 말할 때 써요. 한 사람이나 한 가지 일에는 쓰지 않아요. (민수 씨란 학생이에요: 틀림)","en":"N(이)란 is for defining something or stating a general view. It is not used for one particular person or event: 민수 씨란 학생이에요 is wrong, so use 민수 씨는 학생이에요."},{"kind":"tip","ko":"글, 발표, 수업에서 자주 써요. 문장 끝은 \"~(이)다\", \"~는 것이다\", \"~(이)라고 할 수 있다\"가 많아요. \"사랑이란?\"처럼 질문으로 시작하기도 해요.","en":"It is common in writing, presentations and lessons. Sentences usually end in ~(이)다, ~는 것이다 or ~(이)라고 할 수 있다, and it can open a question such as 사랑이란? (\"What is love?\")."}],"practice":[{"q":"Define 우정: the heart that trusts each other between friends","a":"우정이란 친구 사이에 서로 믿는 마음이에요.","en":"Friendship is the heart with which friends trust each other."},{"q":"Define 문화: the way of life a society shares","a":"문화란 한 사회가 함께 가진 생활 방식이에요.","en":"Culture is the way of life that a society shares."},{"q":"Define 미술 치료: healing the mind by drawing","a":"미술 치료란 그림을 그리면서 마음을 치료하는 방법이에요.","en":"Art therapy is a method of healing the mind while drawing."},{"q":"Define 인사: words or acts that convey feelings when you meet","a":"인사란 사람을 만났을 때 마음을 전하는 말이나 행동이에요.","en":"A greeting is a word or act that conveys your feelings when you meet someone."}],"hl":"이?란","drill":[{"ko":"언어란 생각을 나누는 도구입니다.","en":"Language is a tool for sharing thoughts."},{"ko":"행복이란 작은 일에 감사하는 마음이라고 생각해요.","en":"I think happiness is a heart that is thankful for small things."},{"ko":"친구란 어려울 때 곁에 있어 주는 사람이에요.","en":"A friend is a person who stays beside you in hard times."},{"ko":"예술이란 사람의 마음을 표현하는 활동입니다.","en":"Art is an activity that expresses the human heart."},{"ko":"존댓말이란 어른께 쓰는 높임말이에요.","en":"Honorific speech is the respectful speech you use with elders."},{"ko":"가족이란 무엇일까요?","en":"What is a family, I wonder?"},{"ko":"몸짓이란 몸으로 하는 모든 움직임을 말해요.","en":"Gestures mean every movement made with the body."},{"ko":"풍속화란 그 시대 사람들의 생활을 그린 그림이에요.","en":"Genre painting is a picture that shows the daily life of people of that era."},{"ko":"시간이란 지나가면 다시 돌아오지 않는 것입니다.","en":"Time is something that does not come back once it has passed."},{"ko":"사랑이란 말로 다 설명하기 어려운 마음이에요.","en":"Love is a feeling that is hard to explain fully in words."}],"why":"Look for a noun at the start that is about to be explained, followed by a definition ending in ~(이)다 or ~는 것이다: the speaker is defining N in general, not describing one event.","hlShow":"이?란"},{"id":"g8-1","ch":8,"part":"읽기 I","title":"A/V-네요","star":0,"form":"Verb / adjective stem + -네요 (past: -았/었네요; guess: -겠네요; N이다: N(이)네요)","pattern":"A/V-네요","rule":"지금 막 보거나 알게 된 사실에 대해 놀라움이나 감탄을 부드럽게 말할 때 쓴다.","meaning":"\"Oh, ~ / Look, ~ / I see, ~.\" It voices surprise, admiration or a new realisation in the moment, here used for what one notices in a painting.","use":"Attach -네요 to a verb or adjective stem (past: -았/었네요; inference: -겠네요; with a noun: N(이)네요). Use it only for something you have just seen, heard or found out; the feeling of \"I notice it now\" is the point. It is a soft, conversational way to comment on a scene or react to someone. Typical mistakes: using it for something you have known for a long time, or for your own plans.","table":{"head":["Type","Form","Example"],"rows":[["Verb","stem + -네요","웃다 → 웃네요, 먹다 → 먹네요"],["Adjective","stem + -네요","크다 → 크네요, 화려하다 → 화려하네요"],["Noun + 이다","N(이)네요","그림이네요, 화가네요"],["Past","-았/었네요","끝났네요, 예뻤네요"],["Inference","-겠네요","힘들겠네요"]]},"examples":[{"ko":"이 그림은 색이 정말 화려하네요.","en":"The colours of this painting are really gorgeous!"},{"ko":"그림 속 아이들이 모두 웃고 있네요.","en":"Look, the children in the picture are all laughing."},{"ko":"와, 이 그림은 사백 년 전에 그려졌네요.","en":"Wow, this painting was painted four hundred years ago!"}],"notes":[{"kind":"주의","ko":"-네요는 지금 막 보거나 알게 된 일에 써요. 이미 알고 있던 일이나 내 계획에는 쓰지 않아요. (\"내일 가네요\"로 \"내일 갈 거예요\"를 말할 수 없어요.)","en":"-네요 is for something you have just noticed or found out. Do not use it for things you already knew or for your own plans: 내일 가네요 cannot mean \"I will go tomorrow\"."},{"kind":"tip","ko":"놀람이나 감탄을 부드럽게 말할 때 좋아요. 그림을 설명할 때는 눈에 들어오는 것을 말해 보세요. (강아지가 있네요.) \"-군요\"보다 대화체에 가까워요.","en":"It is a soft way to show surprise or admiration. When you describe a picture, use it for whatever catches your eye: 강아지가 있네요 (\"There is a puppy!\"). It is more conversational than -군요."}],"practice":[{"q":"You notice the painting's colours are bright (밝다)","a":"그림 색이 정말 밝네요.","en":"The colours of the painting are really bright!"},{"q":"You notice a puppy under the tree (있다)","a":"나무 아래에 강아지가 있네요.","en":"Oh, there is a puppy under the tree."},{"q":"You notice it is already lunchtime (되다, past)","a":"벌써 점심시간이 되었네요.","en":"It has already become lunchtime."},{"q":"You notice the painter is a woman (N이다)","a":"이 그림을 그린 사람이 여자 화가네요.","en":"The person who painted this is a woman painter!"}],"hl":"(았|었|였|했|겠)?네요","drill":[{"ko":"이 전시회는 그림이 아주 많네요.","en":"This exhibition has a lot of paintings."},{"ko":"사진보다 실제 그림이 훨씬 크네요.","en":"The real painting is much bigger than the photo."},{"ko":"사람들이 모두 한복을 입고 있네요.","en":"Everyone is wearing hanbok."},{"ko":"이 그림 속 날씨는 정말 맑네요.","en":"The weather in this painting is really clear."},{"ko":"어느새 비가 그쳤네요.","en":"The rain has stopped before I knew it."},{"ko":"이 그림은 우리나라 화가가 그린 거네요.","en":"So this painting was painted by a painter from our country."},{"ko":"한국어를 정말 잘하시네요.","en":"You speak Korean really well!"},{"ko":"이 그림을 완성하려면 시간이 많이 걸리겠네요.","en":"It must take a lot of time to finish this painting."},{"ko":"그림 속 두 사람은 아주 친해 보이네요.","en":"The two people in the picture look very close."},{"ko":"벌써 열두 시가 넘었네요.","en":"It is already past twelve."}],"why":"Look for a reaction to something the speaker has only just noticed, often with an exclamation such as 와, 어, 벌써 or 정말 in the same breath.","hlShow":"(았|었|였|했|겠)?네요"},{"id":"g8-2","ch":8,"part":"읽기 II","title":"N치고 ~ / N치고는 ~","star":1,"form":"Noun + 치고 / 치고는 (no change for final consonant)","pattern":"N치고 ~지 않은 N이 없다 / N치고는 ~","rule":"N치고는 그 부류에서 보통 기대하는 것과 다른 결과를 말할 때 쓰고, N치고 뒤에 부정을 써서 예외 없이 그렇다는 뜻을 나타낼 때 쓴다.","meaning":"N치고 + negative: \"there is hardly any N that does not ~\" (no exception within the group). N치고는: \"for an N, ~\" (an exception to what you would expect).","use":"Add 치고 or 치고는 directly to a noun; it makes no difference whether the noun ends in a consonant. N치고 says that within that group almost everyone is the same, and it is usually followed by a negative (없다, -지 않다, 못하다) whose overall effect is a strong positive. N치고는 uses N as a standard and then gives a result that differs from what you would expect of that group, e.g. \"for a beginner, he draws very well\".","table":{"head":["Point","N치고","N치고는"],"rows":[["Meaning","no exception within the group","for an N (against expectation)"],["Usually followed by","a negative: 없다, -지 않다, 못하다","a positive or negative evaluation"],["Example","화가치고 그림을 싫어하는 사람은 없어요","초보자치고는 아주 잘 그려요"]]},"examples":[{"ko":"예술가치고 감수성이 풍부하지 않은 사람은 없어요.","en":"There is no artist who is not rich in sensitivity."},{"ko":"한국에 온 지 석 달밖에 안 된 사람치고는 한국어를 아주 잘해요.","en":"For someone who has been in Korea only three months, he speaks Korean very well."},{"ko":"한국 사람치고 김치를 안 먹는 사람은 거의 없어요.","en":"Hardly any Korean does not eat kimchi."}],"notes":[{"kind":"주의","ko":"N치고는 뒤에 오는 말이 N에 대해 기대하는 것과 달라요. (초보자치고는 잘 그려요.) N치고 뒤에는 \"없다, 않다, 못하다\" 같은 부정이 자주 와서 \"예외 없이 그렇다\"는 뜻이 돼요.","en":"What follows N치고는 differs from what you expect of an N (a beginner who draws well; warm weather for winter). After N치고 a negative such as 없다 is common and the meaning is \"without exception\"."},{"kind":"tip","ko":"말할 때는 \"치고는\"을 \"치곤\"으로 줄여서 자주 써요. (겨울치곤 따뜻해요.)","en":"In speech 치고는 is often shortened to 치곤: 겨울치곤 따뜻해요 (\"It is warm for winter\")."}],"practice":[{"q":"(치고) Hardly any Korean fails to eat kimchi (한국 사람 / 김치를 안 먹다)","a":"한국 사람치고 김치를 안 먹는 사람은 거의 없어요.","en":"Hardly any Korean does not eat kimchi."},{"q":"(치고는) For a beginner, he draws very well (초보자)","a":"초보자치고는 그림을 아주 잘 그려요.","en":"For a beginner, he draws very well."},{"q":"(치고는) It is very warm for winter (겨울)","a":"겨울치고는 날씨가 아주 따뜻해요.","en":"The weather is very warm for winter."},{"q":"(치고) No painter dislikes pictures (화가 / 그림을 싫어하다)","a":"화가치고 그림을 싫어하는 사람은 없을 거예요.","en":"There is probably no painter who dislikes pictures."}],"hl":"치고(는)?","drill":[{"ko":"유명한 화가치고 어린 시절부터 그림을 좋아하지 않은 사람이 없어요.","en":"Every famous painter has loved pictures since childhood."},{"ko":"어린이치고는 생각이 아주 깊어요.","en":"For a child, he thinks very deeply."},{"ko":"외국인치고는 발음이 정말 정확하네요.","en":"For a foreigner, your pronunciation is really accurate."},{"ko":"학생치고 시험을 좋아하는 사람은 없을 거예요.","en":"There is probably no student who likes exams."},{"ko":"이 식당은 값이 싼 곳치고는 음식 맛이 좋아요.","en":"For a cheap restaurant, the food tastes good."},{"ko":"한국 사람치고 이 노래를 모르는 사람은 없어요.","en":"There is no Korean who does not know this song."},{"ko":"예순 살치고는 아주 건강해 보이세요.","en":"For someone in their sixties, you look very healthy."},{"ko":"여행을 좋아하는 사람치고 사진을 안 찍는 사람은 없어요.","en":"There is no one who loves travel and does not take photos."},{"ko":"이 그림은 초보자가 그린 그림치고는 정말 훌륭해요.","en":"For a painting by a beginner, this is really excellent."},{"ko":"비싼 옷치고는 품질이 별로예요.","en":"For an expensive piece of clothing, the quality is not great."}],"why":"Look for a category noun (예술가, 초보자, 겨울) used as a standard: 치고 plus a negative meaning \"no exception\", or 치고는 when the result is surprising for that category.","hlShow":"치고(는)?"},{"id":"g8-3","ch":8,"part":"읽기 II","title":"이중 부정","star":1,"form":"N이/가 아닐 수 없다 ; V-지 않을 수(가) 없다 ; V-지 않으면 안 되다 ; V-(으)ㄹ 수 없는 것이 없다","pattern":"N이/가 아닐 수 없다 / V-지 않을 수 없다 / V-지 않으면 안 되다 / V-(으)ㄹ 수 없는 것이 없다","rule":"부정을 두 번 겹쳐 써서 긍정의 뜻을 더 강하게 나타낸다.","meaning":"A double negative: two negatives together give a stronger positive. \"It can only be N\", \"I can't help but ~\", \"I must ~\", \"There is nothing that cannot be ~\".","use":"Four common frames: N이/가 아닐 수 없다 (it can only be N), V-지 않을 수(가) 없다 (cannot help but ~), V-지 않으면 안 되다 (must ~), V-(으)ㄹ 수 없는 것이 없다 (there is nothing one cannot ~, i.e. one can do everything). They sound strong and formal and are typical of writing, reviews and presentations; in daily talk 꼭 ~아/어야 해요 is more natural. Two negatives add up to a positive, so do not read them literally as \"cannot\".","table":{"head":["Positive form","Double-negative form","Example"],"rows":[["N이다 (emphasis)","N이/가 아닐 수 없다","걸작이다 → 걸작이 아닐 수 없다"],["V하게 되다 / V하다 (cannot help)","V-지 않을 수(가) 없다","감동하다 → 감동하지 않을 수 없다"],["V-아/어야 하다","V-지 않으면 안 되다","그려야 하다 → 그리지 않으면 안 된다"],["다 V-(으)ㄹ 수 있다","V-(으)ㄹ 수 없는 것이 없다","다 그릴 수 있다 → 그릴 수 없는 것이 없다"]]},"examples":[{"ko":"이 그림은 한국 풍속화의 걸작이 아닐 수 없어요.","en":"This painting can only be called a masterpiece of Korean genre painting."},{"ko":"이렇게 아름다운 그림을 보면 감동하지 않을 수 없어요.","en":"When you see such a beautiful picture, you cannot help but be moved."},{"ko":"미술 치료를 받는 동안에는 매일 그림을 그리지 않으면 안 돼요.","en":"During art therapy you have to draw every day."}],"notes":[{"kind":"주의","ko":"이중 부정은 글이나 발표처럼 격식 있는 말에서 자주 써요. 일상 대화에서는 \"꼭 ~아/어야 해요\"가 더 자연스러워요. 부정이 두 번이라서 뜻은 긍정이에요.","en":"Double negatives are common in formal speech and writing such as essays, reviews and presentations. In daily conversation 꼭 ~아/어야 해요 sounds more natural. Two negatives make a positive meaning."},{"kind":"tip","ko":"\"-지 않을 수 없다\"는 \"어쩔 수 없이 ~하게 되다\", \"-지 않으면 안 되다\"는 \"반드시 ~해야 하다\"에 가까워요. 말할 때는 \"안 돼요\"로 써요.","en":"-지 않을 수 없다 is close to \"cannot help ~ing\" and -지 않으면 안 되다 to \"must ~\". In the polite form write 안 돼요."}],"practice":[{"q":"(N이/가 아닐 수 없다) This work is a masterpiece (걸작)","a":"이 작품은 걸작이 아닐 수 없어요.","en":"This work can only be called a masterpiece."},{"q":"(-지 않을 수 없다) I could not help laughing at the picture","a":"그 그림을 보고 웃지 않을 수 없었어요.","en":"I could not help laughing when I saw that picture."},{"q":"(-지 않으면 안 되다) I must hand in the report by tomorrow","a":"보고서를 내일까지 내지 않으면 안 돼요.","en":"I have to hand in the report by tomorrow."},{"q":"(-(으)ㄹ 수 없는 것이 없다) There is nothing this painter cannot draw","a":"이 화가가 그릴 수 없는 것이 없어요.","en":"There is nothing this painter cannot draw."}],"hl":"아닐 수가? 없|않을 수가? 없|않으면 안|수 없는 것이 없","drill":[{"ko":"그 풍경은 아름답다고 하지 않을 수 없어요.","en":"You cannot help but say that the scenery is beautiful."},{"ko":"오늘은 중요한 시험이 있어서 일찍 일어나지 않으면 안 돼요.","en":"There is an important exam today, so I have to get up early."},{"ko":"그 화가의 솜씨는 천재가 아닐 수 없습니다.","en":"That painter's skill can only be called genius."},{"ko":"이야기를 듣고 눈물을 흘리지 않을 수 없었어요.","en":"I could not help shedding tears when I heard the story."},{"ko":"이 컴퓨터로는 만들 수 없는 것이 없어요.","en":"There is nothing you cannot make with this computer."},{"ko":"건강을 위해서는 운동을 하지 않으면 안 됩니다.","en":"For your health you must exercise."},{"ko":"이 그림은 한국 미술의 자랑이 아닐 수 없어요.","en":"This painting can only be called the pride of Korean art."},{"ko":"그의 노력을 보면 칭찬하지 않을 수가 없어요.","en":"When you see his effort, you cannot help but praise him."},{"ko":"어머니의 사랑은 세상에서 가장 큰 사랑이 아닐 수 없다.","en":"A mother's love can only be the greatest love in the world."},{"ko":"우리 할머니는 만들 수 없는 것이 없을 정도로 요리를 잘하세요.","en":"My grandmother cooks so well that there is nothing she cannot make."}],"why":"Look for a strong, emphatic judgement or necessity phrased with two negatives in a row (아닐 수 없다, 않을 수 없다, 않으면 안 되다): the speaker means \"definitely / cannot help / must\".","hlShow":"아닐 수가? 없|않을 수가? 없|않으면 안|수 없는 것이 없"},{"id":"g8-4","ch":8,"part":"읽기 II","title":"V-는 데 ~","star":1,"form":"Verb stem + -는 데 (ㄹ-verbs drop ㄹ: 만들다 → 만드는 데)","pattern":"V-는 데 + 도움이 되다 / 필요하다 / 시간이 걸리다 / 돈이 들다 / 자신이 있다","rule":"동사 뒤에 붙여 \"그 일을 하는 일, 그럴 때\"라는 뜻을 만들고, 도움·필요·시간·비용·자신 같은 말을 이어 쓴다.","meaning":"\"In / for doing ~\". -는 데 turns a verb into a noun phrase (the act or situation of doing ~), followed by words like 도움이 되다, 필요하다, 시간이 걸리다 or 자신이 있다.","use":"Add -는 데 to a verb stem (verbs ending in ㄹ drop the ㄹ: 만들다 → 만드는 데). Here 데 is a dependent noun meaning \"the matter / the situation\", so it is written with a space and may take the particle 에: 하는 데(에). Typical partners: 도움이 되다/주다, 필요하다, 시간이 걸리다, 돈이 들다, 좋다, 효과가 있다, 자신이 있다, 익숙하다, 서투르다. Do not confuse it with the connective ending -는데 (written together, \"and / but\").","table":{"head":["Verb","Form","Example"],"rows":[["읽다","읽는 데","책을 읽는 데 한 주가 걸렸어요"],["가다","가는 데","학교에 가는 데 삼십 분 걸려요"],["만들다 (ㄹ drops)","만드는 데","한복을 만드는 데 두 달이 걸렸어요"],["배우다","배우는 데","한국어를 배우는 데 도움이 돼요"]]},"examples":[{"ko":"미술 치료는 마음을 편하게 하는 데 도움이 돼요.","en":"Art therapy helps to put the mind at ease."},{"ko":"이 큰 그림을 완성하는 데 사 년이 걸렸대요.","en":"I heard it took four years to complete this large painting."},{"ko":"저는 그림을 설명하는 데 자신이 있어요.","en":"I am confident when it comes to explaining paintings."}],"notes":[{"kind":"주의","ko":"-는 데의 \"데\"는 띄어 써요. 붙여 쓰는 \"-는데\"는 문장을 잇는 어미(\"~는데 …\")라서 다른 문법이에요.","en":"In -는 데 the word 데 is written with a space. The attached -는데 is a sentence-connecting ending (\"..., but / and ...\"), a different grammar point."},{"kind":"tip","ko":"-는 데 뒤에는 \"도움이 되다, 필요하다, 시간이 걸리다, 돈이 들다, 자신이 있다, 효과가 있다\"처럼 정해진 표현이 많이 와요. 덩어리로 외우면 좋아요.","en":"-는 데 is usually followed by fixed expressions such as 도움이 되다, 필요하다, 시간이 걸리다, 돈이 들다, 자신이 있다, 효과가 있다. Learn them as chunks."}],"practice":[{"q":"(시간이 걸리다) Learning Korean takes a lot of time","a":"한국어를 배우는 데 시간이 많이 걸려요.","en":"It takes a lot of time to learn Korean."},{"q":"(도움이 되다) Music helps to calm the mind (마음을 안정시키다)","a":"음악은 마음을 안정시키는 데 도움이 돼요.","en":"Music helps to calm the mind."},{"q":"(돈이 들다) Painting costs a lot of money","a":"그림을 그리는 데 돈이 많이 들어요.","en":"Painting costs a lot of money."},{"q":"(자신이 있다) I am confident at cooking","a":"저는 요리를 하는 데 자신이 있어요.","en":"I am confident at cooking."}],"hl":"는 데","drill":[{"ko":"이 책은 한국 문화를 이해하는 데 도움이 됩니다.","en":"This book helps in understanding Korean culture."},{"ko":"학교까지 가는 데 삼십 분 걸려요.","en":"It takes thirty minutes to get to school."},{"ko":"한복을 만드는 데 두 달이 걸렸어요.","en":"Making the hanbok took two months."},{"ko":"이 그림을 그리는 데 어떤 재료가 필요해요?","en":"What materials are needed to paint this picture?"},{"ko":"김치를 담그는 데 시간이 많이 걸려요.","en":"Making kimchi takes a lot of time."},{"ko":"운동은 건강을 지키는 데 아주 중요해요.","en":"Exercise is very important for keeping healthy."},{"ko":"한국어로 발표하는 데 아직 자신이 없어요.","en":"I am still not confident presenting in Korean."},{"ko":"여행을 가는 데 돈이 많이 들었어요.","en":"Going on the trip cost a lot of money."},{"ko":"이 약은 감기를 낫게 하는 데 효과가 있어요.","en":"This medicine is effective in curing colds."},{"ko":"새 휴대폰을 사는 데 얼마나 필요해요?","en":"How much do you need to buy a new phone?"}],"why":"Look for a verb phrase (\"in doing ~\") followed by a comment about help, need, time, money, confidence or effect: -는 데 packages the action as a thing that is being evaluated.","hlShow":"는 데"}]};
const TR = {"zh":{"g1-1":{"meaning":"某件事差一点就发生了，但最终没有发生。多用于险些发生的、通常是不好的事情。","use":"词干以元音结尾加 -ㄹ，以辅音结尾加 -을（넘어지다→넘어질，먹다→먹을；ㄹ词干保留ㄹ：울다→울），再接 뻔했다。因为事情并没有真的发生，几乎总是用过去时（뻔했어요/뻔했다）。多搭配意外或尴尬的动词（넘어지다、늦다、울다、놓치다）。句首加 하마터면（差点儿）语气更强。常见错误：用于真的发生了的事，或用现在时（넘어질 뻔해요）。","ex":["下雨天我在楼梯上滑了一下，差点摔倒。","我没有提前订电影票，差点看不成电影。","结局太感人了，我在电影院差点哭出来。"],"notes":["因为事情没有发生，通常用过去时 -(으)ㄹ 뻔했다。像 넘어질 뻔해요 这样的现在时听起来不对。","在前面加 하마터면（差点儿）会更强调“险些出事”。多用于坏事，也可以用于错失的机会（우승할 뻔했어요“差点夺冠”）。"]},"g1-2":{"meaning":"也许是因为……：说话人对原因只是推测，并不确定，然后说出自己注意到的结果。","use":"接在普通的 -아/어서 形式后（좋아서、먹어서、피곤해서；名词用 이라서/라서），再加 그런지，后面说出自己注意到的结果。原因只是猜测；如果原因很确定，就直接用 -아/어서。后句是陈述自己感受到或注意到的事（졸리다、사람이 많다），不能是命令或建议。常与 오늘따라、왠지 一起出现。常见错误：用于已确定的原因，或后句用命令。","ex":["也许是因为昨天睡得晚，我今天一整天都很困。","也许是因为周末，电影院里人真多啊。","也许是因为歌好听，对口型视频越来越火了。"],"notes":["그런지 后面要说自己注意到的事实，不用命令或共动句。（✗ 피곤해서 그런지 일찍 주무세요）","如果原因很确定，直接用 -아/어서 或 -(으)니까。그런지 带有“也许就是因为这个吧？”的感觉。"]},"g1-3":{"meaning":"越……越……。前面事情的程度加深，后面的程度也随之加深（或发生变化）。","use":"词干以元音或ㄹ结尾加 -ㄹ수록（보다→볼수록，만들다→만들수록），以辅音结尾加 -을수록（먹다→먹을수록，좋다→좋을수록）。前面的 -(으)면 可有可无，只起强调作用，并重复同一个动词（보면 볼수록、알면 알수록）。后句常出现 더（更）。-(으)ㄹ수록 前不能加过去时 -았/었-。常见错误：前句加 -았/었-，或用于只发生一次的事。","ex":["这部电影越看越有魅力。","对口型越练越熟练。","歌词越读越觉得意味深长。"],"notes":["-(으)ㄹ수록 前不加 -았/었-（✗ 많았을수록）。也不用于只发生一次的事。","后句常加“더”：알수록 더 재미있어요。重复同一个动词，如 보면 볼수록，可以起强调作用。"]},"g1-4":{"meaning":"与其……不如……（更准确地说是……）。放下前一个行为或说法，选择更好或更准确的后者。","use":"直接接在动词词干后（쉬다→쉬기보다，사다→사기보다），加 는 可加强对比。形容词也可以用（슬프기보다）。后句说明说话人更偏向的做法或更准确的描述，常与 -는 편이다、-는 게 낫다/좋다、오히려（反而）连用。常见错误：在 기 前加过去时（✗ 쉬었기보다），或比较不相干的两件事。","ex":["周末我比起在家休息，更喜欢见朋友。","这部电影与其说悲伤，不如说是一个温暖的故事。","考试前，比起只背题目，理解更重要。"],"notes":["通常更好或更准确的一方放在后面。-기보다 前不加过去时 -았/었-（✗ 쉬었기보다）。","和“오히려”或“-는 편이다”连用很自然：슬프기보다 오히려 따뜻한 이야기예요。名词用“N보다는”。"]},"g1-5":{"meaning":"既然……，那就……。前句是已确定的事实，后句说明由此得出的当然结果或应该做的事。","use":"动词用 -는 이상，形容词和已完成的动作用 -(으)ㄴ 이상（약속한 이상），名词用 인 이상。后句表示义务、决心或理所当然的结论（-아/어야 하다、-(으)ㄹ 수밖에 없다、-겠다），不是单纯的事实。与 -(으)니까 相比，语气更坚定、更正式。常见错误：以单纯的过去事实结尾（✗ 약속한 이상 갔어요）。","ex":["既然住在韩国，就得努力学韩语。","既然答应了，就是下雨也得去啊。","既然已经决定了，现在就不能改了。"],"notes":["后句应是义务、决心或当然的结果。以单纯的过去事实结尾会显得别扭（✗ 약속한 이상 갔어요）。","-(으)니까 是轻松的“因为”，而 -는 이상 有“既然如此就没办法了”的坚定感，适合正式的说话和写作。"]},"g2-1":{"meaning":"不可能……。说话人强烈相信某件事不可能是真的或不可能发生。","use":"词干加 -(으)ㄹ（가다→갈，먹다→먹을，살다→살）再接 리가 없다；过去时用 -았/었을 리가 없다；名词用 일 리가 없다。리 是名词，意为“理由、可能性”，因此也会出现 리는 없다 和 리(가) 있어요?（“怎么可能？”）。这是说话人凭对人或情况的了解而产生的强烈确信，并非核实过的事实。常见错误：用于自己的计划，或后接命令。","ex":["他不可能说谎。我认识他很久了。","青蛙不可能听妈妈的话。他总是反着来嘛。","他到昨天都还很健康，不可能突然生病。"],"notes":["名词用“일 리가 없다”（✗ 거짓말 리가 없다 → ○ 거짓말일 리가 없다）。已经过去的事用 -았/었을 리가 없다。","对话中常用反问“리가 있어요?”（怎么可能？）或“-ㄹ 리가 없는데…”。"]},"g2-2":{"meaning":"由于发生了意想不到的事，出现了（通常是不好的）结果。整件事已经是过去。","use":"接在动词词干后（넘어지다→넘어지는 바람에，오다→오는 바람에）。时态只在句末表现，所以即使是过去的事，前句也保持 -는（✗ 비가 왔는 바람에）。原因是说话人没有选择的意外之事，结果通常是负面的（늦다、못 하다、놓치다、망치다）。后句不能是命令或建议。不与形容词连用。常见错误：用 -았/었는 바람에，或把有意的行为当原因。","ex":["突然下雨，所以没能去野餐。","弟弟打碎了杯子，地板上全是水。","手机没电了，所以没能拍完对口型视频。"],"notes":["时态只用在句末（✗ 비가 왔는 바람에 → ○ 비가 오는 바람에 소풍을 못 갔어요）。后面不能接命令或共动句。","-는 바람에 带有“倒霉地变成了这样”的感觉。好结果用 -덕분에，一般原因用 -아/어서。"]},"g2-3":{"meaning":"假装……。把不是事实的事装成事实的样子去做。","use":"动词用 -는 척하다（자다→자는 척하다；알다→아는 척하다，모르다→모르는 척하다），形容词用 -(으)ㄴ 척하다（아프다→아픈 척하다），名词用 N인 척하다。假装已经做过用 V-(으)ㄴ 척하다（이미 먹은 척하다）。整句的时态加在 하다 上（척했다）。-는 체하다 意思相同，척 更口语。常见错误：形容词用 -는（✗ 아프는 척하다）。","ex":["弟弟假装生病，没去上学。","民秀明明知道这件事，却假装不知道。","青蛙假装听妈妈的话，然后又反着做。"],"notes":["알다、모르다、있다、없다 用 -는 척（아는 척、모르는 척、있는 척）。只有形容词用 -(으)ㄴ 척（아픈 척、괜찮은 척）。","因为是装成不真实的样子，语气可能略带负面。-는 체하다 意思相同；척 更口语。"]},"g2-4":{"meaning":"敷衍地做某事，让人说不清到底做了没有。","use":"在动词词干后接 -는 둥 마는 둥，前后用同一个动词（먹다→먹는 둥 마는 둥，듣다→듣는 둥 마는 둥），后面接 하다 或其他动词：먹는 둥 마는 둥 하고 나왔어요。多用过去时，表示因困倦、匆忙或担心而不专心、不用心。常见动词：먹다、듣다、자다、하다、보다。常见错误：使用两个不同的动词（那是另一个句型 -는 둥 -는 둥），或用于形容词。","ex":["早上晚了，饭没怎么吃就出门了。","太困了，课听得马马虎虎。","因为担心，昨晚几乎没睡。"],"notes":["要重复同一个动词：듣는 둥 마는 둥。用两个不同的动词则是另一个句型（-는 둥 -는 둥）。","마는 来自 말다（停止）。带有“没有好好做”的不满或遗憾，所以通常伴随原因（졸려서、바빠서）。"]},"g2-5":{"meaning":"讲故事的结尾（-다고 합니다 的缩略）。像讲民间故事或对孩子、听众讲述时，亲切又有趣地转述事情。","use":"形式：形容词 -답니다，没有收音的动词 -ㄴ답니다，有收音的动词 -는답니다（ㄹ 动词去掉 ㄹ：살다→산답니다），名词 (이)랍니다，过去 -았/었답니다。用于童话，或向听众（父母、导游、播音员）介绍有趣的事。语气亲切、略带俏皮，不用于中性的报道。直接对孩子说时用 -단다/-란다。常见错误：用于说话人自己的意见或亲身经历。","ex":["很久很久以前，住着善良的兴夫和贪心的游夫。","兄妹俩升到天上，变成了太阳和月亮。","那个村子里至今还流传着青蛙的故事。"],"notes":["无收音动词用 -ㄴ답니다（간답니다），有收音用 -는답니다（먹는답니다），形容词用 -답니다（착하답니다），이다 变为 (이)랍니다。以 ㄹ 结尾的动词去掉 ㄹ（산답니다）。","直接对孩子说时用 -단다/-란다：옛날에 호랑이가 살았단다。童话书的最后几句常出现。"]},"g3-1":{"meaning":"委婉的推测：我想……／大概……。常用来温和地纠正或反驳对方的话或想法。","use":"元音或ㄹ结尾的词干加 -ㄹ걸요，辅音结尾加 -을걸요；过去 -았/었을걸요；名词 일걸요。与亲近的朋友说话时可省略 요（-(으)ㄹ걸）。这是口语，只表示猜测，不用于已确认的事实或说话人自己的计划。常用来回应别人的想法（아니에요, ~ -(으)ㄹ걸요），加 아마 语气更柔和。常见错误：用于正式书面语，用于自己的计划（✗ 저는 내일 갈걸요），或用于疑问句。","ex":["现在出发的话，路上大概会很堵。","那部电影大概已经结束了。现在去也看不到了。","金老师现在大概不在办公室。"],"notes":["-(으)ㄹ걸요 只是猜测，不用于自己的计划。另外，“-(으)ㄹ걸 그랬다”是表示后悔的另一个句型。","可以用“아니에요, 주말이라서 사람이 많을걸요”（不是的，周末大概人很多）来温和地反对。加 아마 更委婉。"]},"g3-2":{"meaning":"并不是说……就一定……。前句是常见的想法，后句否定“理所当然”的结论。","use":"先构成引用形式 -다고 해서（形容词 -다고，动词 -ㄴ/는다고，名词 (이)라고；过去 -았/었다고），最后以 -(으)ㄴ/는 것은 아니다 结尾（口语 건 아니에요）。前句是一般的想法（비싸다고 해서……），结尾的意思是“不一定”，不是“绝对不”。해서 可以省略。加上 반드시/꼭/항상/다 很自然。常见错误：把它当成完全否定，或在前句放一个没人相信的规则。","ex":["价格贵不一定意味着质量好。","网上的信息并不都是真的。","唱歌好不一定对口型也好。"],"notes":["结尾用“-(으)ㄴ/는 것은 아니다”（口语“-는 건 아니에요”）。不是完全否定，而是“不一定如此”。","名词用 N(이)라고 해서，过去用 -았/었다고 해서。해서 可以省略，说成“-다고 -는 건 아니다”。"]},"g3-3":{"meaning":"事先做好某事，并把结果保持下去以备后用。","use":"词干末音节是 ㅏ/ㅗ 的加 -아 두다，其他加 -어 두다（사다→사 두다，적다→적어 두다，준비하다→준비해 두다）。用于提前准备（예매해 두다）或让状态保持原样（창문을 열어 두다“让窗户开着”）。需要结果能留下来的动词：사다、적다、켜다、열다、예약하다。不用于没有持续结果的动词或形容词（✗ 학교에 가 두다）。두었다 常缩写为 뒀다。与 -아/어 놓다 几乎相同，后者更口语。","ex":["考试前，请把重要的单词记在笔记本上。","我提前订好了电影票。","到朋友来之前，我一直开着灯。"],"notes":["只用于结果会留下来的动作，不用于移动或状态词（✗ 학교에 가 두다，✗ 예뻐 두다）。","与 -아/어 놓다 几乎相同。有“提前准备”和“保持原样”两种意思，过去式 두었다 常缩写为 뒀다。"]},"g3-4":{"meaning":"根据是否……／怎样……而不同。后句的结果随前句内容的不同而不同。","use":"动词接 -느냐에 따라（먹느냐에 따라），形容词接 -(으)냐에 따라（크냐에 따라、어려우냐에 따라），名词接 (이)냐에 따라。常与疑问词（누가、어떻게、얼마나、무엇을）搭配。后句说明会不同或发生变化：달라지다、다르다、바뀌다、결정되다。서 可省略。常见错误：用表示“如果”的 -(으)면，或在没有变化时以固定结果结尾。","ex":["同一首歌，谁来唱，感觉也不一样。","大脑的能力会因使用方式而不同。","睡多久不同，记忆力也可能不同。"],"notes":["后句需要表示结果会变化的词，如 달라지다/다르다/바뀌다/결정되다。结果固定时不能用。","名词可以简化为“N에 따라(서)”：사람에 따라 달라요。与疑问词（누가、어떻게、얼마나）搭配很自然。"]},"g3-5":{"meaning":"靠自己的力量克服困难，最终做成了某件难事。","use":"词干末音节是 ㅏ/ㅗ 的加 -아 내다，其他加 -어 내다（참다→참아 내다，이기다→이겨 내다，하다→해 내다）。表示靠自己的力量完成艰难或漫长的事，所以适合表示忍耐和成就的动词（참다、이기다、견디다、찾다、해결하다、만들다）。多用过去或完成形（참아 냈어요），常与 끝까지、드디어 搭配。不用于容易的动作（✗ 밥을 먹어 냈어요）或形容词。","ex":["那个学生把艰苦的训练坚持到了最后。","我们队自己解决了难题。","兴夫战胜了贫穷，过上了幸福的生活。"],"notes":["只用于有困难和努力的事。用于容易的事会显得别扭（✗ 밥을 먹어 냈어요）。","有很多固定搭配：이겨 내다、참아 내다、견뎌 내다、해 내다、찾아 내다、알아 내다。与 끝까지、드디어、결국 很搭。"]},"g4-1":{"meaning":"达到……的程度；……到……的地步。前句说明状态或动作，后句用具体的结果或形象来表现它有多强烈。","use":"元音词干加 -ㄹ，辅音词干加 -을（词干以 ㄹ 结尾时保持原样：울 정도로）；过去用 -았/었을 정도로。后句多为具体或夸张的结果（눈물이 날、믿기 어려울、숨이 막힐），常见于讲述和抱怨。句尾可用 -(으)ㄹ 정도이다。常见错误：把它当作原因（“因为”）；정도로 表示程度而不是理由，后句是状态或事件，不用命令句或共动句。","ex":["调查结果令人惊讶，难以置信。","韩国人很重感情，对刚认识的人甚至会请吃饭。","昨天累得一躺下就睡着了。"],"notes":["정도로 表示程度而不是原因，所以不能换成 -아/어서（“因为”）。后句也很少用命令句或建议句。","句尾用 -(으)ㄹ 정도이다，如「눈물이 날 정도예요」（到了要流泪的程度）。「죽을 정도로 힘들다」是常用的夸张说法。"]},"g4-2":{"meaning":"只做……（别的什么都不做）；只是……。说话人强调只有这一个动作或状态，常带有抱怨或对比的语气。","use":"在动词或形容词词干后加 -기만，再用活用的 하다 结尾：먹기만 해요、좋기만 하다、놀기만 했어요。后面常接对比：듣기만 하고 말은 안 해요（只听不说）、예쁘기만 하고 쓸모가 없어요。与 N만 V 比较：책만 읽어요 限定的是对象（只读书），而 읽기만 하다 限定的是整个动作（只是读，什么也不做）。不要和 -기만 하면（“只要……就”）混淆。","ex":["现在的孩子只是上补习班，没有时间和朋友玩。","弟弟一回家就只会打游戏，让我很担心。","那家餐厅只是价格贵，味道一般。"],"notes":["「책만 읽어요」限定对象（只读书）；「책을 읽기만 해요」限定动作（只是读，别的都不做）。","后面可用 -고、-(으)ㄴ/는데、-지 않다 接对比：「보기만 하고 사지는 않아요」（只看不买）。"]},"g4-3":{"meaning":"某事 / 某人 / 某处 / 总有一天：不清楚或不具体说明是什么、谁、哪里、什么时候。왠지 的意思是“不知为什么”。","use":"这些都是疑问词加 -인가 的缩略形式：무엇인가 → 뭔가（书面语 무언가）、누구인가 → 누군가、어디인가 → 어딘가、언제인가 → 언젠가、왜인지 → 왠지。用于陈述句，放在动词或形容词前面：뭔가 이상해요（有点奇怪）、누군가 왔어요（有人来了）。助词可以省略：뭔가를、누군가가、어딘가에서。언젠가 可指过去（“曾经”）也可指将来（“总有一天”）。왠지 搭配说不清楚的感觉：왠지 불안해요。","ex":["最近想开始一个新的爱好。","听到有人叫我的名字，我回头看了看。","毕业以后总有一天想在韩国工作。"],"notes":["正确拼写是 왠지（왜 + 인지），웬지 是错的。（웬일、웬만하면 才用 웬。）","「어딘가 이상하다」意思是“说不出哪里怪”，用来描述说不清的感觉。뭔가 이상하다 也一样。"]},"g4-4":{"meaning":"通过……；借由……（书面体）。前句是达成后句结果的手段或方法。","use":"元音词干加 -ㅁ，辅音词干加 -음，再接 으로써：하다 → 함으로써，읽다 → 읽음으로써。ㄹ 词干把 ㄹ 换成 ㅁ：알다 → 앎으로써。多见于议论文、新闻、演讲和报告，后句常是 -(으)ㄹ 수 있다、높이다、줄이다、해결하다 之类的结果。口语里改用 -아/어서 或 -(으)면。不要把 으로써（手段）和 으로서（身份，如 학생으로서）或 -(으)므로（“因为”）混淆。","ex":["政府打算通过发放生育补助金来解决低生育率问题。","通过倾听彼此的故事，我们可以积累起“情”。","他通过每天运动恢复了健康。"],"notes":["으로써 表示手段（칼로써 자르다，“用刀切”）；으로서 表示身份（학생으로서，“作为学生”）。把它们混用是很常见的错误。","这是正式书面语。口语里用 -아/어서 或 -(으)면 更自然：「운동을 해서 건강해졌어요」。"]},"g5-1":{"meaning":"和 N 一样（多/大/厉害）；达到 N 的程度。表示某事物在大小、数量或程度上与 N 相当。","use":"만큼 直接接在名词后，不空格：나만큼、서울만큼、아이를 키우는 일만큼。后面通常是表示程度的形容词或动词：나만큼 키가 크다（和我一样高）。表示“不如……”时用否定：나만큼 크지 않다 / 못하다。接在动词或形容词的定语形后时，만큼 是依存名词，要空格，意思是“与……相应的程度”：노력한 만큼、먹을 만큼。比较：N처럼（像 N，方式相似）、N보다（比 N 更……）、N만（只有 N）。","ex":["像韩国人这样重感情的人也很少见。","我不像哥哥那样内向。","没有什么工作比养育孩子更有价值了。"],"notes":["接在动词或形容词后面时要空格：노력한 만큼、먹을 만큼（“与……相应”）。只有接在名词后才连写。","不要和 만（“只”）混淆：형만 커요 = 只有哥哥高；형만큼 커요 = 和哥哥一样高。보다（“比”）表示差异，만큼 表示相等。"]},"g5-2":{"meaning":"做……的必要 / 机会 / 计划 / 预定 / 可能性。动词的 -(으)ㄹ 形式修饰后面的名词。","use":"动词词干 + -ㄹ/-을 + 名词，后面通常接 이/가 있다·없다 或 -이다：갈 필요가 없다（没必要去）、말할 기회가 생겼다、떠날 계획이다、출발할 예정입니다、비가 올 가능성이 높다。계획 是自己打算做的事；예정 是已经确定的日程，语气较正式（通知、新闻）。가능성 与 있다/없다/높다/낮다 搭配。필요 常用否定：-(으)ㄹ 필요가 없다 = “没有必要……”。形容词也能接 가능성（비쌀 가능성）。","ex":["就连父母之间，对是否有必要让孩子早早出国留学也意见不一。","我计划明年读研究生。","这个周末下雨的可能性很大。"],"notes":["계획 是自己决定要做的事，예정 是已经定好的日程，所以通知和新闻里常用 예정。","-(으)ㄹ 필요가 없다 是“没有必要……”，和 -지 않아도 되다 相近。가능성 与 있다、없다、높다、낮다 搭配。"]},"g5-3":{"meaning":"像在说……似的；好像在表示……。不用嘴说，而是用表情或动作来表现自己的想法。","use":"由间接引用的词尾 + 는 듯이 构成：形容词 -다는，动词 -(ㄴ/는)다는，名词 (이)라는，疑问 -(느)냐는，共动 -자는，命令 -(으)라는。过去用 -았/었다는 듯이，将来/推测用 -(으)ㄹ 거라는 듯이。后句是该人的动作或表情（고개를 끄덕이다、어깨를 으쓱하다、쳐다보다、웃다），常与 마치 一起用。不要和不需要引用的 -(으)ㄴ/는 듯이（“好像”）混淆：비가 올 듯이 흐려요。","ex":["孩子点了点头，好像在说我说的他全听懂了。","他笑着打招呼，仿佛什么事都没发生过。","朋友看着我，像是在问“你怎么现在才来”。"],"notes":["-다는 듯이 是“像在说那样”行动；普通的 -(으)ㄴ/는 듯이 只是“好像”：비가 올 듯이 흐려요（天阴得像要下雨）。","加上 마치 更生动：「마치 다 안다는 듯이」。前面的话是做动作的人心里没说出口的话，从那个人的角度来写。"]},"g5-4":{"meaning":"（不好的事）常常……；总是……。描述反复发生的不理想的事。","use":"动词词干 + -기(가) 일쑤이다：지각하기 일쑤예요、잃어버리기가 일쑤다。일쑤 是名词，所以句子以 -이다 结尾（일쑤예요、일쑤입니다、일쑤였어요）。用于不好或令人烦恼的习惯（迟到、忘记、丢东西、摔倒、不吃饭）。中性的习惯用 자주 或 -곤 하다。가 可以省略。不用于好的习惯。","ex":["最近经常加班，所以常常不吃早饭。","我很马虎，经常把伞弄丢。","小时候我常常为了玩具和弟弟吵架。"],"notes":["只用于不好的事。好习惯或中性的常做之事用 자주、-곤 하다。","일쑤 是名词，所以以 일쑤이다（일쑤예요）结尾。-기가 일쑤다 里的 가 可以省略。"]},"g5-5":{"meaning":"所谓做……（是……）。把某个行为作为话题，对它做出说明或判断，多半是“很难”。","use":"动词词干 + -기란，是 -기라는 것은（= -는 것은）的缩略。后面接判断或说明：쉽지 않다、어렵다、힘들다、보통 일이 아니다、하늘의 별 따기이다。多见于议论文、专栏和感慨式的话，读者期待听到关于该行为之难的道理。用动词基本词干，不在 기란 前加 -았/었- 或 -겠-。名词对应的形式是 N(이)란（사랑이란 ...）。后面接“좋다”这类中性谓语会显得奇怪。","ex":["在陌生的国家交新朋友并不容易。","如今在首尔找房子简直比登天还难。","生了孩子后继续工作，并不像说的那么容易。"],"notes":["-기란 是 -기라는 것은 的缩略，后面常接表示困难的说法，如 쉽지 않다、어렵다、힘들다、보통 일이 아니다。","名词用 -(이)란（사랑이란），动词用 -기란。-기는 看似相近，但常带让步意味（「하기는 하지만 ...」），并不相同。"]},"g6-1":{"meaning":"就算……吧；假设……是对的（为了讨论）。说话人先承认一点，然后提出反驳或指出问题。","use":"由间接引用的词尾 -다고 + 치다（“当作、算作”）构成：形容词 -다고 치다，动词 -(ㄴ/는)다고 치다，名词 (이)라고 치다，过去 -았/었다고 치다。常见搭配是 -다고 치자（就算……吧）、-다고 쳐도 / -다고 치더라도（即使算……），后面接 그래도、하지만、그런데 或表示反驳、否定的句子。说话人并不完全相信这个前提，这是它与一般条件句 -(ㄴ/는)다면 的区别。多用于讨论、辩论和抱怨。","ex":["就算早期留学对外语能力有帮助吧。即使这样，让年幼的孩子离开家人生活真的没问题吗？","就算工资很高，要是工作太辛苦也做不长久。","就算你说得对，也应该先道歉吧。"],"notes":["很常见的用法是用「-다고 치자」结束一句话，下一句用「그래도」「하지만」反驳。","-(ㄴ/는)다면 是假设真实可能的条件，而 -다고 치다 只是暂且承认，并不完全相信。"]},"g6-2":{"meaning":"如果是……的话也许可以，但否则就不行。先承认一个不太可能的特殊条件，然后得出真正的否定或怀疑的结论：“除非……，否则不可能”。","use":"接 -(ㄴ/는)다면 或缩略形式 -(으)면 + 몰라도：어린아이라면 몰라도（小孩子的话还行）、눈이 많이 온다면 몰라도（除非下大雪）、특별한 이유가 있다면 몰라도。过去用 -았/었다면 몰라도，名词用 N(이)라면 몰라도。后句是否定或怀疑的内容：-(으)ㄹ 수 없다、-기 어렵다、안 되다、-지 않다。前句是说话人认为不太可能的例外，意思是“只有那种情况才行，普通情况下不行”。不要和 -(으)ㄴ/는지 몰라도（“不知道是否”）混淆。","ex":["小孩子也就罢了，大人说那种话就让人为难了。","除非中了彩票，否则光靠工资买房很难。","刚认识的人也就罢了，对老朋友也没必要那样说话吧。"],"notes":["后句必须是否定或怀疑的内容。-다면 몰라도 后面接好的结果会很别扭。","可以缩略为 -(으)면 몰라도：「한두 번이면 몰라도 매번 이러면 곤란해요」（一两次还行，每次都这样就麻烦了）。"]},"g6-3":{"meaning":"在……之中；在……的情况下；趁着……。先交代一个背景情况（新闻文体），主要事件发生在这个背景之中。","use":"形容词接 -(으)ㄴ，现在时动词接 -는，过去或完成的动词接 -(으)ㄴ / -던，名词接 인，再接 가운데：어려운 가운데、지켜보는 가운데、마친 가운데、학생인 가운데。前句是持续的情况或气氛（관심이 쏠리는、비가 오는、어려운），后句是主要事件（열렸다、발표했다）。多见于新闻、报告和演讲。不用于同一个人同时做两个动作（那种情况用 -(으)면서）。가운데에도 表示“即使在……之中”。N 가운데（“在 N 之中 / 中间”）是另一种用法。","ex":["在许多市民的注视下，新政策发布了。","即使在经济困难的情况下，也决定增加生育补助金。","在下雨的情况下，马拉松比赛照常举行。"],"notes":["不用于一个人同时做的两个动作，那种情况用 -(으)면서：「음악을 들으면서 걸어요」。","「N 가운데」还有“在 N 之中”或“正中间”的其他意思；「그런 가운데」表示“在那种情况下”。"]},"g6-4":{"meaning":"相当于……；等于……；可以说是……。说话人看着事实，得出结论：结果基本上和某种情况一样。","use":"现在时动词接 -는，完成的动词或形容词接 -(으)ㄴ，名词接 인，再接 셈이다：받는 셈이다、끝낸 셈이다、싼 셈이다、가족인 셈이다。常出现在 사실상、결국、거의 或数字、比较之后（십 년을 살았으니 ...）。셈 是“计算”的意思，所以这个句子是把事实加起来说出总和。注意 -(으)ㄹ 셈이다 是“打算……”的意思（갈 셈이다 = 打算去），是另一个语法。","ex":["这个包是打折时买的，等于是半价买的。","我在韩国住了十年，等于是个韩国人了。","报告已经写得差不多了，工作等于完成了。"],"notes":["-(으)ㄹ 셈이다 是“打算……”的意思，完全是另一个语法：「내일은 일찍 일어날 셈이에요」（我打算明天早点起床）。","「-(으)ㄴ 셈 치고」意思是“就当作……”：「속은 셈 치고 한번 해 보세요」（就当被骗一次，试试看吧）。"]},"g7-1":{"meaning":"说话人回想起以前亲眼看到的事（多为他人的行为或某种状态），并接着说明由此引出的后续行动、现状变化或结果。意思是“……之后，(就)……”。","use":"接在动词/形容词词干后（过去式用 -았/었더니；名词用 N(이)더니）。前句是说话人以前亲眼看到的情况，主语通常是第三人称（或天气），后句是随后发生的行动、变化或结果，两句的主语通常相同。说话人自己的行为引出了某个结果时，要用 -았/었더니。常见搭配：그러더니（然后就）。常见错误：前句主语是“我”时仍用 -더니。","ex":["民秀用双手把礼物递给老师，然后低头行礼。","到昨天为止一直很热，今天突然变冷了。","在陌生的国家用手势说话，人们马上就听懂了。"],"notes":["-더니 用于亲眼看到的他人的行为。自己的行为引出的结果要用 -았/었더니：약을 먹었더니 열이 내렸어요（吃了药，烧就退了）。不能说“我”+ 약을 먹더니。","前后句主语相同、内容形成对比时也可使用（昨天下雨，今天却放晴了）。그러더니 = “然后就”。"]},"g7-2":{"meaning":"“正如您所见／所知／所听到的那样……”。先提出听话人也已经看到、知道或听说过的事实，再继续往下说。","use":"接在 보다、알다、듣다、느끼다、말하다、예상하다 等表示感知/知晓的动词词干后：보시다시피、아시다시피、들으셨다시피；已经说过的内容用过去式 -았/었다시피（말씀드렸다시피）。通常放在句首，语气较正式，常见于演讲、发表、公告。常见错误：用于对方还不知道的新信息，或接在与感知、知晓无关的动词后。","ex":["正如您所见，在韩国给长辈递东西时要用双手。","正如您所知，每个国家的问候方式都不一样。","正如上节课我说过的，明天有肢体语言的发表。"],"notes":["-다시피 接在 보다/알다/듣다 等感知、知晓类动词后，说的是听话人也已经知道的事实，不用于对方不知道的新信息。","注意区别：-다시피 하다 表示“几乎……”，如 밤을 새우다시피 했어요（几乎熬了一整夜），是另一个语法。"]},"g7-3":{"meaning":"-아/어야지：“应该……／得……”，作提醒、自我决心或轻微责备；-아/어서는 안 된다：“不可以……／不应该……”。","use":"-아/어야지(요) 接在动词、形容词词干后，表示理应如此、该这样做。对别人说是提醒或轻责，对自己说是决心（내일부터 운동해야지）。-아/어서는 안 된다 是比 -(으)면 안 되다 更郑重的禁止，多用于规则、礼仪、道德。两者常搭配：应该做A，不可以做B。敬语形式写作 안 돼요（不是 안 되요）。","ex":["向长辈问候时当然应该低头行礼。","在长辈面前不可以翘着二郎腿坐。","应该尊重其他国家的文化，不可以轻视。"],"notes":["-아/어서는 안 된다 比 -(으)면 안 되다 更强烈、更正式，多用于礼仪、规则、道德。礼貌说法是 안 돼요，不是 안 되요。","-아/어야지 单独结尾时：对别人是“当然该……啊”的提醒，对自己是“我得……”的决心。"]},"g7-4":{"meaning":"称呼与引用：把某人/某物叫作 N（N(이)라고 부르다/하다/말하다）；N 하고 则是直接引用某个词或声音。","use":"名词有收音时用 N이라고，没有收音时用 N라고，后面常接 부르다、하다、말하다，用来说明名字、称呼、术语“被叫作什么”。N 하고 是直接引用，放在引号中的词或声音之后，需要空格：'엄마!' 하고 소리치다。注意：这个 하고 不是表示“和”的 하고。","ex":["在韩国，人们把学长/前辈称作“선배님”。","朋友们叫我“대니”。","孩子喊着“妈妈！”跑了过来。"],"notes":["有收音用 이라고，没有收音用 라고。这里的 하고 不是“和”的 하고，而是接在被引用的词或声音之后，并且要空格。","解释名称、术语时常搭配 하다/부르다：이것을 한국어로 '손짓'이라고 해요（这个在韩语里叫“손짓”）。"]},"g7-5":{"meaning":"“所谓N，就是……／N这种东西……”。把 N 作为话题，对它下定义或谈一般性的看法。","use":"N 有收音时用 N이란，没有收音时用 N란，是 N(이)라는 것은 的缩略形式，后面接对 N 的解释。句尾常是 ~(이)다、~는 것이다、~(이)라고 할 수 있다。多用于文章、发表、课堂。不用于具体的某个人或某件事。","ex":["所谓肢体语言，就是不用话语而用身体传达心意的方法。","所谓称呼，就是称呼人的时候使用的话。","所谓礼貌，是出自尊重对方的心意。"],"notes":["N(이)란 用于下定义或表达一般看法，不用于具体的某个人或某件事（×민수 씨란 학생이에요，应说 민수 씨는 학생이에요）。","常用于文章、发表、课堂。句尾多为 ~(이)다、~는 것이다、~(이)라고 할 수 있다；也可以用疑问开头，如 사랑이란？（爱是什么？）"]},"g8-1":{"meaning":"表示说话人当场看到或发现某事时的惊讶、感叹或新发现；这里用来描述在画中注意到的内容。","use":"接在动词/形容词词干后（过去式 -았/었네요，推测 -겠네요，名词 N(이)네요）。只用于刚刚看到、听到或得知的事，重点是“现在才发现”的感觉。是一种柔和的口语表达，用来评论眼前的景象或回应对方。常见错误：用于早就知道的事，或用于自己的计划。","ex":["这幅画的颜色真华丽啊！","你看，画中的孩子们都在笑呢。","哇，这幅画是四百年前画的呀！"],"notes":["-네요 用于刚刚看到或发现的事，不用于早就知道的事或自己的计划（내일 가네요 不能表示“我明天去”）。","是柔和地表达惊讶或赞叹的说法。描述画时可用来说眼前所见：강아지가 있네요（有只小狗呢）。比 -군요 更口语化。"]},"g8-2":{"meaning":"N치고 + 否定：“凡是N，没有不……的”（没有例外）；N치고는：“就N而言，(出乎意料地)……”。","use":"치고／치고는 直接接在名词后，不必区分有无收音。N치고 表示“在这一类里，几乎都是这样”，后面多接否定（없다、-지 않다、못하다），整体意思是强烈的肯定。N치고는 把 N 当作标准，说出与对这一类的预期不同的结果，如“作为初学者，画得很好”。","ex":["凡是艺术家，没有感受力不丰富的。","就来韩国才三个月的人来说，韩语说得非常好。","凡是韩国人，几乎没有不吃泡菜的。"],"notes":["N치고는 后面的内容与对 N 的预期不同（初学者画得好；冬天天气暖和）。N치고 后面多接 없다 等否定，意思是“毫无例外”。","口语中 치고는 常缩略为 치곤：겨울치곤 따뜻해요（就冬天来说挺暖和的）。"]},"g8-3":{"meaning":"双重否定：连用两个否定来表示更强的肯定。“只能是N／不得不……／不……不行(必须)／没有不能……的事”。","use":"常见四种句型：N이/가 아닐 수 없다（只能说是N）；V-지 않을 수(가) 없다（不得不……、禁不住……）；V-지 않으면 안 되다（必须……）；V-(으)ㄹ 수 없는 것이 없다（没有做不到的事，什么都能……）。语气强烈、较正式，多见于文章、评论、发表；日常会话里 꼭 ~아/어야 해요 更自然。两个否定相加是肯定意思，不要按字面理解为“不能”。","ex":["这幅画不能不说是韩国风俗画的杰作。","看到这么美的画，不能不感动。","接受美术治疗期间，必须每天画画。"],"notes":["双重否定多用于文章、评论、发表等较正式的场合；日常会话里 꼭 ~아/어야 해요 更自然。两个否定合起来表示肯定。","-지 않을 수 없다 ≈ “不由得……、不得不……”；-지 않으면 안 되다 ≈ “必须……”；礼貌形式写作 안 돼요。"]},"g8-4":{"meaning":"“在做……方面／做……时(需要、花费……)”。-는 데 把动词变成名词性短语（做……这件事/这种情况），后面接 도움이 되다、필요하다、시간이 걸리다、자신이 있다 等。","use":"接在动词词干后（ㄹ 结尾的动词去掉 ㄹ：만들다 → 만드는 데）。这里的 데 是依存名词（“……的事/情况”），要空格，后面可加助词 에：하는 데(에)。常见搭配：도움이 되다/주다、필요하다、시간이 걸리다、돈이 들다、좋다、효과가 있다、자신이 있다、익숙하다、서투르다。注意不要与连接语尾 -는데（连写，表示“但是/而且”）混淆。","ex":["美术治疗有助于让心情平静。","据说完成这幅大画花了四年。","我对讲解画很有自信。"],"notes":["-는 데 的 데 要空格。连写的 -는데 是连接句子的语尾（“……，但是/而且……”），是另一个语法点。","-는 데 后面常接固定表达：도움이 되다、필요하다、시간이 걸리다、돈이 들다、자신이 있다、효과가 있다。整块记忆比较好。"]}},"th":{"g1-1":{"meaning":"เกือบจะเกิดเรื่องหนึ่งขึ้น แต่สุดท้ายก็ไม่เกิด ใช้กับเหตุการณ์ที่เฉียดฉิว มักเป็นเรื่องไม่ดี","use":"ก้านคำที่ลงท้ายด้วยสระเติม -ㄹ ลงท้ายด้วยพยัญชนะเติม -을 (넘어지다→넘어질, 먹다→먹을 ส่วนก้านที่ลงท้ายด้วย ㄹ คงไว้ เช่น 울다→울) แล้วตามด้วย 뻔했다 เพราะเรื่องนั้นไม่ได้เกิดขึ้นจริง จึงใช้รูปอดีตเกือบทุกครั้ง (뻔했어요/뻔했다) มักใช้กับเรื่องอุบัติเหตุหรือเรื่องน่าอาย (넘어지다, 늦다, 울다, 놓치다) การใส่ 하마터면 ('เกือบ') ไว้ข้างหน้าทำให้เน้นมากขึ้น ข้อผิดพลาดที่พบบ่อย: ใช้กับเรื่องที่เกิดขึ้นจริง หรือใช้รูปปัจจุบัน (넘어질 뻔해요)","ex":["วันที่ฝนตก ฉันลื่นบนบันไดและเกือบล้ม","ฉันไม่ได้จองตั๋วหนังไว้ล่วงหน้า เลยเกือบดูหนังไม่ได้","ตอนจบประทับใจมากจนฉันเกือบร้องไห้ในโรงหนัง"],"notes":["เพราะเรื่องนั้นไม่ได้เกิดขึ้น จึงใช้รูปอดีต -(으)ㄹ 뻔했다 ตามปกติ รูปปัจจุบันอย่าง 넘어질 뻔해요 ฟังแปลก","การใส่ 하마터면 ('เกือบ') ไว้ข้างหน้าทำให้ความรู้สึกเฉียดฉิวชัดขึ้น มักใช้กับเรื่องไม่ดี แต่ใช้กับโอกาสที่พลาดไปได้ด้วย (우승할 뻔했어요 'เกือบชนะแล้ว')"]},"g1-2":{"meaning":"บางที่เพราะ ~ ผู้พูดบอกเหตุผลที่เดาเอาแต่ไม่แน่ใจ แล้วพูดถึงผลที่สังเกตเห็น","use":"เติม 그런지 หลังรูป -아/어서 ปกติ (좋아서, 먹어서, 피곤해서 ส่วนคำนามใช้ 이라서/라서) แล้วบอกผลที่สังเกตเห็น เหตุผลเป็นเพียงการคาดเดา ถ้าแน่ใจให้ใช้ -아/어서 ธรรมดา ประโยคหลังเป็นการบอกสิ่งที่รู้สึกหรือสังเกตเห็น (졸리다, 사람이 많다) ไม่ใช่คำสั่งหรือคำชวน มักใช้คู่กับ 오늘따라 หรือ 왠지 ข้อผิดพลาดที่พบบ่อย: ใช้กับเหตุผลที่แน่ชัดแล้ว หรือลงท้ายด้วยคำสั่ง","ex":["บางทีเพราะเมื่อวานนอนดึก วันนี้ฉันเลยง่วงทั้งวัน","บางทีเพราะเป็นวันหยุดสุดสัปดาห์ ที่โรงหนังเลยมีคนเยอะมากจริง ๆ","บางทีเพราะเพลงดี คลิปลิปซิงก์เลยกำลังได้รับความนิยม"],"notes":["หลัง 그런지 ให้พูดสิ่งที่สังเกตเห็น ไม่ใช้คำสั่งหรือคำชวน (✗ 피곤해서 그런지 일찍 주무세요)","ถ้าเหตุผลแน่ชัด ให้ใช้ -아/어서 หรือ -(으)니까 ธรรมดา 그런지 มีความรู้สึกว่า 'หรือเพราะอย่างนี้นะ?'"]},"g1-3":{"meaning":"ยิ่ง ~ ก็ยิ่ง ~ เมื่อระดับของเรื่องแรกเพิ่มขึ้น เรื่องหลังก็เพิ่มขึ้น (หรือเปลี่ยนไป) ตามกัน","use":"ก้านคำที่ลงท้ายด้วยสระหรือ ㄹ เติม -ㄹ수록 (보다→볼수록, 만들다→만들수록) ก้านที่ลงท้ายด้วยพยัญชนะเติม -을수록 (먹다→먹을수록, 좋다→좋을수록) ส่วน -(으)면 ข้างหน้าจะใส่หรือไม่ใส่ก็ได้ ช่วยเน้นเท่านั้น และมักซ้ำคำกริยาเดิม (보면 볼수록, 알면 알수록) ประโยคหลังมักมี 더 ('ยิ่งขึ้น') ไม่ใส่ -았/었- หน้า -(으)ㄹ수록 ข้อผิดพลาดที่พบบ่อย: ใส่ -았/었- ในประโยคแรก หรือใช้กับเหตุการณ์ที่เกิดครั้งเดียว","ex":["หนังเรื่องนี้ยิ่งดูก็ยิ่งมีเสน่ห์","ลิปซิงก์ยิ่งฝึกก็ยิ่งเก่งขึ้น","ยิ่งอ่านเนื้อเพลงก็ยิ่งรู้สึกว่าความหมายลึกซึ้ง"],"notes":["ไม่ใส่ -았/었- หน้า -(으)ㄹ수록 (✗ 많았을수록) และไม่ใช้กับเรื่องที่เกิดครั้งเดียว","ประโยคหลังมักมี '더': 알수록 더 재미있어요 การซ้ำกริยาเดิมอย่าง 보면 볼수록 ช่วยเน้นความหมาย"]},"g1-4":{"meaning":"มากกว่าที่จะ ~ (ที่จริงคือ ~) วางสิ่งแรกไว้ แล้วเลือกคำอธิบายหรือการกระทำที่ดีกว่า/ตรงกว่า","use":"เติม -기보다 ต่อท้ายก้านกริยาโดยตรง (쉬다→쉬기보다, 사다→사기보다) การเติม 는 ช่วยเน้นความต่าง ใช้กับคำคุณศัพท์ได้ด้วย (슬프기보다) ประโยคหลังบอกสิ่งที่ผู้พูดชอบกว่า หรือคำอธิบายที่ตรงกว่า มักใช้คู่กับ -는 편이다, -는 게 낫다/좋다 หรือ 오히려 ('ตรงกันข้าม') ข้อผิดพลาดที่พบบ่อย: ใส่รูปอดีตที่ 기 (✗ 쉬었기보다) หรือเปรียบเทียบสองสิ่งที่ไม่เกี่ยวกัน","ex":["วันหยุดสุดสัปดาห์ ฉันชอบไปพบเพื่อนมากกว่านั่งพักอยู่บ้าน","หนังเรื่องนี้เป็นเรื่องราวที่อบอุ่นมากกว่าที่จะเศร้า","ก่อนสอบ การทำความเข้าใจสำคัญกว่าการท่องแต่โจทย์"],"notes":["ปกติสิ่งที่ดีกว่าหรือตรงกว่าจะมาทีหลัง ไม่เติมอดีต -았/었- หน้า -기보다 (✗ 쉬었기보다)","ใช้คู่กับ 오히려 หรือ -는 편이다 จะฟังเป็นธรรมชาติ: 슬프기보다 오히려 따뜻한 이야기예요 ถ้าเป็นคำนามใช้ 'N보다는'"]},"g1-5":{"meaning":"ในเมื่อ ~ / ตราบใดที่ ~ ก็ต้อง ~ ประโยคแรกเป็นข้อเท็จจริงที่แน่นอนแล้ว ประโยคหลังบอกผลที่ตามมาโดยธรรมชาติหรือสิ่งที่ต้องทำ","use":"กริยาใช้ -는 이상 คำคุณศัพท์และการกระทำที่เสร็จแล้วใช้ -(으)ㄴ 이상 (약속한 이상) คำนามใช้ 인 이상 ประโยคหลังบอกหน้าที่ การตัดสินใจ หรือข้อสรุปตามเหตุผล (-아/어야 하다, -(으)ㄹ 수밖에 없다, -겠다) ไม่ใช่ข้อเท็จจริงทั่วไป เมื่อเทียบกับ -(으)니까 จะหนักแน่นและเป็นทางการกว่า ข้อผิดพลาดที่พบบ่อย: ลงท้ายด้วยข้อเท็จจริงอดีตธรรมดา (✗ 약속한 이상 갔어요)","ex":["ตราบใดที่อยู่ในเกาหลี ก็ต้องตั้งใจเรียนภาษาเกาหลี","ในเมื่อสัญญาไว้แล้ว ต่อให้ฝนตกก็ต้องไป","ในเมื่อตัดสินใจไปแล้ว ตอนนี้ก็เปลี่ยนไม่ได้อีก"],"notes":["ประโยคหลังควรเป็นหน้าที่ ความตั้งใจ หรือผลตามธรรมชาติ ถ้าลงท้ายด้วยข้อเท็จจริงในอดีตธรรมดาจะฟังแปลก (✗ 약속한 이상 갔어요)","-(으)니까 เป็น 'เพราะ' แบบเบา ๆ ส่วน -는 이상 หนักแน่นเหมือน 'ในเมื่อเป็นอย่างนี้แล้วก็หลีกเลี่ยงไม่ได้' เหมาะกับการพูดและเขียนแบบเป็นทางการ"]},"g2-1":{"meaning":"ไม่มีทางที่ ~ ผู้พูดเชื่ออย่างหนักแน่นว่าเรื่องนั้นเป็นไปไม่ได้หรือไม่จริง","use":"เติม -(으)ㄹ ที่ก้านคำ (가다→갈, 먹다→먹을, 살다→살) แล้วตามด้วย 리가 없다 อดีตใช้ -았/었을 리가 없다 คำนามใช้ 일 리가 없다 리 เป็นคำนามแปลว่า 'เหตุผล/ความเป็นไปได้' จึงมี 리는 없다 และ 리(가) 있어요? ('เป็นไปได้อย่างไร?') ด้วย เป็นความเชื่อมั่นของผู้พูดจากสิ่งที่รู้เกี่ยวกับคนหรือสถานการณ์ ไม่ใช่ข้อเท็จจริงที่ตรวจสอบแล้ว ข้อผิดพลาดที่พบบ่อย: ใช้กับแผนของตัวเอง หรือลงท้ายด้วยคำสั่ง","ex":["เขาไม่มีทางโกหกหรอก ฉันรู้จักเขามานานแล้ว","กบเขียวไม่มีทางเชื่อฟังแม่หรอก เพราะมันทำตรงข้ามเสมอ","เมื่อวานยังแข็งแรงดีอยู่ ไม่มีทางที่จู่ ๆ จะป่วย"],"notes":["คำนามใช้ '일 리가 없다' (✗ 거짓말 리가 없다 → ○ 거짓말일 리가 없다) ถ้าเป็นเรื่องที่จบไปแล้วใช้ -았/었을 리가 없다","ในบทสนทนามักใช้เป็นคำถามเชิงโต้แย้ง '리가 있어요?' ('จะเป็นไปได้อย่างไร?') หรือ '-ㄹ 리가 없는데…'"]},"g2-2":{"meaning":"เพราะเกิดเรื่องที่ไม่คาดคิด จึงมีผลที่ (มักจะไม่ดี) ตามมา ทั้งหมดเป็นเรื่องในอดีตแล้ว","use":"เติม -는 바람에 ที่ก้านกริยา (넘어지다→넘어지는 바람에, 오다→오는 바람에) กาลแสดงที่ท้ายประโยคเท่านั้น ดังนั้นแม้เป็นเรื่องอดีต ประโยคแรกก็ยังเป็น -는 (✗ 비가 왔는 바람에) สาเหตุเป็นเรื่องไม่คาดคิดที่ผู้พูดไม่ได้เลือก และผลมักเป็นเชิงลบ (늦다, 못 하다, 놓치다, 망치다) ประโยคหลังไม่ใช้คำสั่งหรือคำชวน ไม่ใช้กับคำคุณศัพท์ ข้อผิดพลาดที่พบบ่อย: ใช้ -았/었는 바람에 หรือใช้การกระทำที่ตั้งใจเป็นสาเหตุ","ex":["จู่ ๆ ฝนก็ตก เราเลยไม่ได้ไปปิกนิก","น้องทำแก้วแตก พื้นเลยกลายเป็นทะเลน้ำ","แบตมือถือหมด ฉันเลยถ่ายคลิปลิปซิงก์ไม่เสร็จ"],"notes":["ใส่กาลที่ท้ายประโยคเท่านั้น (✗ 비가 왔는 바람에 → ○ 비가 오는 바람에 소풍을 못 갔어요) ประโยคหลังไม่ใช้คำสั่งหรือคำชวน","-는 바람에 มีความรู้สึกว่า 'โชคร้ายเลยเป็นแบบนี้' ถ้าผลดีใช้ -덕분에 ถ้าเป็นเหตุผลทั่วไปใช้ -아/어서"]},"g2-3":{"meaning":"แกล้งทำเป็น ~ ทำท่าทางเหมือนเรื่องที่ไม่จริงเป็นเรื่องจริง","use":"กริยาใช้ -는 척하다 (자다→자는 척하다; 알다→아는 척하다, 모르다→모르는 척하다) คำคุณศัพท์ใช้ -(으)ㄴ 척하다 (아프다→아픈 척하다) คำนามใช้ N인 척하다 ถ้าแกล้งทำเหมือนทำไปแล้วใช้ V-(으)ㄴ 척하다 (이미 먹은 척하다) กาลของทั้งประโยคอยู่ที่ 하다 (척했다) -는 체하다 ความหมายเดียวกัน แต่ 척 เป็นภาษาพูดมากกว่า ข้อผิดพลาดที่พบบ่อย: ใช้ -는 กับคำคุณศัพท์ (✗ 아프는 척하다)","ex":["น้องแกล้งทำเป็นป่วยแล้วไม่ไปโรงเรียน","มินซูรู้เรื่องนั้นอยู่แล้วแต่แกล้งทำเป็นไม่รู้","กบเขียวแกล้งทำเป็นฟังแม่ แล้วก็ทำตรงข้าม"],"notes":["알다, 모르다, 있다, 없다 ใช้ -는 척 (아는 척, 모르는 척, 있는 척) มีเพียงคำคุณศัพท์ที่ใช้ -(으)ㄴ 척 (아픈 척, 괜찮은 척)","เพราะเป็นการแกล้งทำสิ่งที่ไม่จริง จึงอาจฟังดูเชิงลบเล็กน้อย -는 체하다 ความหมายเดียวกัน 척 เป็นภาษาพูดมากกว่า"]},"g2-4":{"meaning":"ทำบางสิ่งแบบขอไปที จนบอกไม่ได้ว่าทำหรือไม่ทำกันแน่","use":"เติม -는 둥 마는 둥 ที่ก้านกริยา โดยใช้กริยาตัวเดียวกันทั้งสองส่วน (먹다→먹는 둥 마는 둥, 듣다→듣는 둥 마는 둥) แล้วตามด้วย 하다 หรือกริยาอื่น: 먹는 둥 마는 둥 하고 나왔어요 มักใช้ในอดีต บอกว่าไม่ตั้งใจหรือไม่ได้พยายามเพราะง่วง รีบ หรือกังวล กริยาที่พบบ่อย: 먹다, 듣다, 자다, 하다, 보다 ข้อผิดพลาดที่พบบ่อย: ใช้กริยาสองตัวต่างกัน (นั่นเป็นอีกรูปแบบคือ -는 둥 -는 둥) หรือใช้กับคำคุณศัพท์","ex":["เช้านี้สาย ฉันเลยกินข้าวแบบขอไปทีแล้วก็ออกมา","ง่วงมาก เลยฟังเลกเชอร์แบบครึ่ง ๆ กลาง ๆ","กังวลมาก เมื่อคืนเลยแทบไม่ได้นอน"],"notes":["ต้องซ้ำกริยาตัวเดิม: 듣는 둥 마는 둥 ถ้าใช้กริยาสองตัวต่างกันจะเป็นอีกรูปแบบ (-는 둥 -는 둥)","마는 มาจาก 말다 ('หยุด') แฝงความไม่พอใจหรือเสียดายที่ทำไม่ดีพอ จึงมักพูดพร้อมเหตุผล (졸려서, 바빠서)"]},"g2-5":{"meaning":"ลงท้ายแบบผู้เล่านิทาน (ย่อจาก -다고 합니다) ใช้ถ่ายทอดเรื่องที่ได้ยินมาอย่างอบอุ่นและน่าสนใจ เหมือนในนิทานพื้นบ้าน หรือเวลาพูดกับเด็กและผู้ฟัง","use":"รูปแบบ: คำคุณศัพท์ -답니다 กริยาที่ไม่มีตัวสะกด -ㄴ답니다 มีตัวสะกด -는답니다 (กริยาที่ลงท้ายด้วย ㄹ จะตัด ㄹ: 살다→산답니다) คำนาม (이)랍니다 อดีต -았/었답니다 ใช้ในนิทาน และเวลาอธิบายเรื่องน่าสนใจให้ผู้ฟัง (พ่อแม่ ไกด์ ผู้ประกาศ) ฟังดูอบอุ่นและขี้เล่นเล็กน้อย จึงไม่ใช้รายงานแบบเป็นกลาง เวลาพูดกับเด็กโดยตรงใช้ -단다/-란다 ข้อผิดพลาดที่พบบ่อย: ใช้กับความเห็นหรือประสบการณ์ตรงของผู้พูดเอง","ex":["กาลครั้งหนึ่งนานมาแล้ว มีฮึงบูผู้ใจดีกับนอลบูผู้โลภอาศัยอยู่","สองพี่น้องขึ้นไปบนฟ้าและกลายเป็นพระอาทิตย์กับพระจันทร์","ในหมู่บ้านนั้นยังมีเรื่องเล่าของกบเขียวสืบทอดมาถึงทุกวันนี้"],"notes":["กริยาไม่มีตัวสะกดใช้ -ㄴ답니다 (간답니다) มีตัวสะกดใช้ -는답니다 (먹는답니다) คำคุณศัพท์ใช้ -답니다 (착하답니다) 이다 เป็น (이)랍니다 กริยาที่ลงท้ายด้วย ㄹ ตัด ㄹ (산답니다)","เวลาพูดกับเด็กโดยตรงใช้ -단다/-란다: 옛날에 호랑이가 살았단다 มักพบในประโยคท้ายของหนังสือนิทาน"]},"g3-1":{"meaning":"การเดาเบา ๆ แบบนุ่มนวล: ฉันคิดว่า ~ / คงจะ ~ มักใช้แก้หรือแย้งสิ่งที่คู่สนทนาพูดหรือเข้าใจอย่างอ่อนโยน","use":"ก้านคำที่ลงท้ายด้วยสระหรือ ㄹ เติม -ㄹ걸요 ก้านที่ลงท้ายด้วยพยัญชนะเติม -을걸요 อดีต -았/었을걸요 คำนาม 일걸요 กับเพื่อนสนิทตัด 요 ได้ (-(으)ㄹ걸) เป็นภาษาพูด ใช้เดาเท่านั้น ไม่ใช้กับข้อเท็จจริงที่ยืนยันแล้วหรือแผนของผู้พูดเอง มักใช้ตอบสิ่งที่อีกฝ่ายคิด (아니에요, ~ -(으)ㄹ걸요) และฟังนุ่มนวลขึ้นเมื่อใส่ 아마 ข้อผิดพลาดที่พบบ่อย: ใช้ในภาษาเขียนทางการ ใช้กับแผนของตัวเอง (✗ 저는 내일 갈걸요) หรือใช้ในประโยคคำถาม","ex":["ถ้าออกเดินทางตอนนี้ รถน่าจะติดมาก","หนังเรื่องนั้นคงจบไปแล้ว ไปตอนนี้ก็ดูไม่ทันแล้ว","คุณครูคิมตอนนี้คงไม่อยู่ที่ออฟฟิศ"],"notes":["-(으)ㄹ걸요 เป็นแค่การเดา จึงไม่ใช้กับแผนของตัวเอง และ '-(으)ㄹ걸 그랬다' เป็นอีกรูปแบบหนึ่งที่แสดงความเสียดาย","แย้งอย่างนุ่มนวลได้ด้วย 'อย่างนั้นไม่ใช่หรอก 주말이라서 사람이 많을걸요' (เป็นวันหยุด คนน่าจะเยอะ) การใส่ 아마 ยิ่งทำให้นุ่มนวลขึ้น"]},"g3-2":{"meaning":"ไม่ได้หมายความว่า ~ ก็จะ ~ เสมอไป ประโยคแรกเป็นความเชื่อทั่วไป ประโยคหลังปฏิเสธข้อสรุปที่ดูเหมือนจะเป็นไปโดยอัตโนมัติ","use":"สร้างรูปอ้างคำพูด -다고 해서 (คำคุณศัพท์ -다고 กริยา -ㄴ/는다고 คำนาม (이)라고 อดีต -았/었다고) และลงท้ายด้วย -(으)ㄴ/는 것은 아니다 (ภาษาพูด 건 아니에요) ประโยคแรกเป็นความเชื่อทั่วไป (비싸다고 해서 ...) ส่วนท้ายแปลว่า 'ไม่จำเป็นต้อง' ไม่ใช่ 'ไม่ใช่แน่นอน' ตัด 해서 ได้ การใส่ 반드시 / 꼭 / 항상 / 다 ฟังเป็นธรรมชาติ ข้อผิดพลาดที่พบบ่อย: เข้าใจว่าเป็นการปฏิเสธเด็ดขาด หรือใส่กฎที่ไม่มีใครเชื่อไว้ในประโยคแรก","ex":["ราคาแพงไม่ได้แปลว่าคุณภาพดีเสมอไป","ข้อมูลในอินเทอร์เน็ตไม่ได้เป็นความจริงทั้งหมด","ร้องเพลงเก่งไม่ได้แปลว่าลิปซิงก์เก่งด้วยเสมอไป"],"notes":["ลงท้ายด้วย '-(으)ㄴ/는 것은 아니다' (ภาษาพูด '-는 건 아니에요') ไม่ใช่การปฏิเสธทั้งหมด แต่แปลว่า 'ไม่จำเป็นต้องเป็นเช่นนั้น'","คำนามใช้ N(이)라고 해서 อดีตใช้ -았/었다고 해서 ตัด 해서 ได้ เป็น '-다고 -는 건 아니다'"]},"g3-3":{"meaning":"ทำบางอย่างไว้ล่วงหน้าและคงผลลัพธ์นั้นไว้เพื่อใช้ภายหลัง","use":"ก้านที่ลงท้ายด้วย ㅏ/ㅗ เติม -아 두다 ที่เหลือเติม -어 두다 (사다→사 두다, 적다→적어 두다, 준비하다→준비해 두다) ใช้เมื่อเตรียมการล่วงหน้า (예매해 두다) หรือปล่อยสภาพไว้อย่างนั้น (창문을 열어 두다 'เปิดหน้าต่างทิ้งไว้') ต้องเป็นกริยาที่ผลลัพธ์คงอยู่: 사다, 적다, 켜다, 열다, 예약하다 ไม่ใช้กับกริยาที่ไม่มีผลลัพธ์คงอยู่หรือกับคำคุณศัพท์ (✗ 학교에 가
