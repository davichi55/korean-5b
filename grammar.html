두다) 두었다 มักย่อเป็น 뒀다 ใกล้เคียงกับ -아/어 놓다 ซึ่งเป็นภาษาพูดมากกว่า","ex":["ก่อนสอบ ช่วยจดคำศัพท์สำคัญไว้ในสมุดนะ","ฉันจองตั๋วหนังไว้ล่วงหน้าแล้ว","ฉันเปิดไฟทิ้งไว้จนกว่าเพื่อนจะมา"],"notes":["ใช้กับการกระทำที่ผลลัพธ์คงอยู่เท่านั้น ไม่ใช้กับคำที่แสดงการเคลื่อนที่หรือสภาพ (✗ 학교에 가 두다, ✗ 예뻐 두다)","ใกล้เคียงกับ -아/어 놓다 มีสองความหมายคือ 'เตรียมไว้ล่วงหน้า' และ 'ปล่อยไว้อย่างนั้น' รูปอดีต 두었다 มักย่อเป็น 뒀다"]},"g3-4":{"meaning":"ขึ้นอยู่กับว่า ~ / ว่าอย่างไร ~ ผลของประโยคหลังต่างกันไปตามเนื้อหาของประโยคแรก","use":"กริยาใช้ -느냐에 따라 (먹느냐에 따라) คำคุณศัพท์ใช้ -(으)냐에 따라 (크냐에 따라, 어려우냐에 따라) คำนามใช้ (이)냐에 따라 เข้ากับคำถาม (누가, 어떻게, 얼마나, 무엇을) ประโยคหลังบอกว่าต่างกันหรือเปลี่ยนไป: 달라지다, 다르다, 바뀌다, 결정되다 ตัด 서 ได้ ข้อผิดพลาดที่พบบ่อย: ใช้ -(으)면 'ถ้า' หรือลงท้ายด้วยผลที่ตายตัวทั้งที่ไม่มีอะไรแปรผัน","ex":["แม้เป็นเพลงเดียวกัน ใครร้องก็ให้ความรู้สึกต่างกัน","สมองจะมีความสามารถต่างกันไปตามวิธีที่ใช้","ความจำอาจเปลี่ยนไปตามจำนวนชั่วโมงที่นอน"],"notes":["ประโยคหลังต้องมีคำที่บอกว่าผลเปลี่ยนไป เช่น 달라지다/다르다/바뀌다/결정되다 ถ้าผลตายตัวไม่ใช้","คำนามใช้แบบสั้นได้ 'N에 따라(서)': 사람에 따라 달라요 เข้ากับคำถาม (누가, 어떻게, 얼마나) เป็นธรรมชาติ"]},"g3-5":{"meaning":"ในที่สุดก็ทำสิ่งที่ยากสำเร็จด้วยกำลังของตัวเอง ฝ่าฟันความยากลำบากไปจนจบ","use":"ก้านที่ลงท้ายด้วย ㅏ/ㅗ เติม -아 내다 ที่เหลือเติม -어 내다 (참다→참아 내다, 이기다→이겨 내다, 하다→해 내다) ใช้บอกว่าทำงานยากหรืองานยาวนานสำเร็จด้วยพลังของตัวเอง จึงเข้ากับกริยาที่แสดงความอดทนและความสำเร็จ (참다, 이기다, 견디다, 찾다, 해결하다, 만들다) ส่วนมากใช้รูปอดีตหรือรูปสำเร็จ (참아 냈어요) มักมี 끝까지 หรือ 드디어 ไม่ใช้กับการกระทำที่ง่าย (✗ 밥을 먹어 냈어요) หรือกับคำคุณศัพท์","ex":["นักเรียนคนนั้นอดทนกับการฝึกที่หนักจนถึงที่สุด","ทีมของเราแก้ปัญหายากได้ด้วยตัวเอง","ฮึงบูเอาชนะความยากจนและมีชีวิตอย่างมีความสุข"],"notes":["ใช้กับเรื่องที่มีความยากลำบากและต้องพยายามเท่านั้น ถ้าใช้กับเรื่องง่ายจะฟังแปลก (✗ 밥을 먹어 냈어요)","มีคำที่ใช้เป็นกลุ่มคำคงที่หลายคำ เช่น 이겨 내다, 참아 내다, 견뎌 내다, 해 내다, 찾아 내다, 알아 내다 เข้ากับ 끝까지, 드디어, 결국"]},"g4-1":{"meaning":"ถึงขนาดที่…; …จนถึงขั้น… ประโยคแรกบอกสภาพหรือการกระทำ ส่วนประโยคหลังบอกผลหรือภาพที่เห็นชัดเพื่อแสดงว่ามันรุนแรงแค่ไหน","use":"ก้านที่ไม่มีตัวสะกดเติม -ㄹ ก้านที่มีตัวสะกดเติม -을 (ก้านที่ลงท้ายด้วย ㄹ ใช้เหมือนเดิม เช่น 울 정도로) อดีตใช้ -았/었을 정도로 ประโยคหลังมักเป็นผลที่เห็นภาพหรือพูดเกินจริง (눈물이 날, 믿기 어려울, 숨이 막힐) จึงใช้บ่อยเวลาเล่าเรื่องหรือบ่น ท้ายประโยคใช้ -(으)ㄹ 정도이다 ได้ ข้อผิดที่พบบ่อย: ใช้เป็นเหตุผล ('เพราะ') แต่ 정도로 บอกระดับ ไม่ใช่สาเหตุ และประโยคหลังเป็นสภาพหรือเหตุการณ์ ไม่ใช่คำสั่งหรือคำชวน","ex":["ผลสำรวจน่าประหลาดใจจนเชื่อได้ยาก","คนเกาหลีมีน้ำใจมาก ถึงขนาดเลี้ยงข้าวแม้แต่คนที่เพิ่งพบกันครั้งแรก","เมื่อวานเหนื่อยมากจนหลับทันทีที่เอนตัวลงนอน"],"notes":["정도로 บอกระดับ ไม่ใช่เหตุผล จึงใช้แทน -아/어서 ('เพราะ') ไม่ได้ และประโยคหลังมักไม่ใช้คำสั่งหรือคำชวน","ท้ายประโยคใช้ -(으)ㄹ 정도이다 เช่น '눈물이 날 정도예요' (ถึงขั้นน้ำตาไหล) ส่วน '죽을 정도로 힘들다' เป็นสำนวนพูดเกินจริงที่ใช้บ่อย"]},"g4-2":{"meaning":"ทำแต่…(และไม่ทำอย่างอื่น); เป็นแค่… ผู้พูดเน้นว่ามีการกระทำหรือสภาพเดียวเท่านั้น มักแฝงการบ่นหรือการเปรียบต่าง","use":"เติม -기만 หลังก้านคำกริยาหรือคำคุณศัพท์ แล้วลงท้ายด้วย 하다 ที่ผันแล้ว: 먹기만 해요, 좋기만 하다, 놀기만 했어요 มักตามด้วยความขัดแย้ง: 듣기만 하고 말은 안 해요 (ฟังอย่างเดียว ไม่พูด), 예쁘기만 하고 쓸모가 없어요 เทียบกับ N만 V: 책만 읽어요 จำกัดที่สิ่งของ (อ่านแต่หนังสือ) ส่วน 읽기만 하다 จำกัดที่การกระทำทั้งหมด (ได้แต่อ่าน ไม่ทำอย่างอื่น) อย่าสับสนกับ -기만 하면 ('แค่…ก็…')","ex":["เด็กสมัยนี้เอาแต่ไปเรียนพิเศษ ไม่มีเวลาไปเล่นกับเพื่อน","น้องชายพอกลับบ้านก็เอาแต่เล่นเกม ฉันเลยเป็นห่วง","ร้านอาหารนั้นแพงอย่างเดียว รสชาติก็ธรรมดา"],"notes":["'책만 읽어요' จำกัดที่สิ่งของ (อ่านแต่หนังสือ) ส่วน '책을 읽기만 해요' จำกัดที่การกระทำ (ได้แต่อ่าน ไม่ทำอย่างอื่น)","ต่อท้ายด้วย -고, -(으)ㄴ/는데 หรือ -지 않다 เพื่อสร้างความขัดแย้ง: '보기만 하고 사지는 않아요' (ดูอย่างเดียว ไม่ซื้อ)"]},"g4-3":{"meaning":"บางสิ่ง / บางคน / บางแห่ง / สักวันหนึ่ง: ไม่ชัดเจนหรือไม่ระบุว่าเป็นอะไร ใคร ที่ไหน เมื่อไร ส่วน 왠지 แปลว่า 'ไม่รู้ทำไม'","use":"เป็นรูปย่อของคำถาม + -인가: 무엇인가 → 뭔가 (ภาษาเขียน 무언가), 누구인가 → 누군가, 어디인가 → 어딘가, 언제인가 → 언젠가, 왜인지 → 왠지 ใช้ในประโยคบอกเล่า วางไว้หน้ากริยาหรือคำคุณศัพท์: 뭔가 이상해요 (มีอะไรแปลกๆ), 누군가 왔어요 (มีคนมา) ช่วยละคำช่วยได้: 뭔가를, 누군가가, 어딘가에서 언젠가 ชี้ได้ทั้งอดีต ('เคยครั้งหนึ่ง') และอนาคต ('สักวัน') 왠지 ใช้กับความรู้สึกที่อธิบายไม่ได้: 왠지 불안해요","ex":["ช่วงนี้อยากเริ่มงานอดิเรกใหม่ๆ สักอย่าง","ได้ยินเสียงใครสักคนเรียกชื่อฉัน เลยหันไปมอง","พอเรียนจบ สักวันหนึ่งอยากไปทำงานที่เกาหลี"],"notes":["สะกดที่ถูกคือ 왠지 (왜 + 인지) ส่วน 웬지 เป็นการสะกดผิด (웬일 และ 웬만하면 ใช้ 웬)","'어딘가 이상하다' แปลว่า 'แปลกๆ ยังไงไม่รู้' ใช้บอกความรู้สึกที่ชี้ชัดไม่ได้ 뭔가 이상하다 ก็ใช้แบบเดียวกัน"]},"g4-4":{"meaning":"โดยการ…; ด้วยการ… (สไตล์ภาษาเขียนทางการ) ประโยคแรกคือวิธีหรือสิ่งที่ใช้ทำให้เกิดผลในประโยคหลัง","use":"ก้านที่ไม่มีตัวสะกดเติม -ㅁ ก้านที่มีตัวสะกดเติม -음 แล้วตามด้วย 으로써: 하다 → 함으로써, 읽다 → 읽음으로써 ก้านที่ลงท้ายด้วย ㄹ เปลี่ยน ㄹ เป็น ㅁ: 알다 → 앎으로써 พบในบทความ ข่าว สุนทรพจน์ และรายงาน มักตามด้วยผล เช่น -(으)ㄹ 수 있다, 높이다, 줄이다, 해결하다 ในภาษาพูดให้ใช้ -아/어서 หรือ -(으)면 แทน อย่าสับสน 으로써 (วิธีการ) กับ 으로서 (สถานะ เช่น 학생으로서) หรือ -(으)므로 ('เพราะ')","ex":["รัฐบาลตั้งใจแก้ปัญหาอัตราการเกิดต่ำด้วยการให้เงินสนับสนุนการคลอดบุตร","เมื่อเราฟังเรื่องราวของกันและกัน เราก็สร้างความผูกพัน (정) ขึ้นได้","เขากลับมามีสุขภาพดีอีกครั้งด้วยการออกกำลังกายทุกวัน"],"notes":["으로써 บอกวิธีการ (칼로써 자르다 'ตัดด้วยมีด') ส่วน 으로서 บอกสถานะ (학생으로서 'ในฐานะนักเรียน') การใช้สลับกันเป็นข้อผิดที่พบบ่อยมาก","เป็นสำนวนภาษาเขียนทางการ ในการพูดใช้ -아/어서 หรือ -(으)면 จะเป็นธรรมชาติกว่า: '운동을 해서 건강해졌어요'"]},"g5-1":{"meaning":"มากเท่ากับ N; ในระดับเดียวกับ N บอกว่าขนาด ปริมาณ หรือระดับเท่ากับ N","use":"ต่อ 만큼 ติดกับคำนาม ไม่เว้นวรรค: 나만큼, 서울만큼, 아이를 키우는 일만큼 ส่วนหลังมักเป็นคำคุณศัพท์หรือกริยาที่บอกระดับ: 나만큼 키가 크다 (สูงเท่าฉัน) ถ้าจะบอกว่า 'ไม่เท่า' ให้ใช้รูปปฏิเสธ: 나만큼 크지 않다 / 못하다 เมื่อตามหลังกริยาหรือคำคุณศัพท์ที่ผันเป็นรูปขยาย 만큼 เป็นคำนามที่ต้องเว้นวรรค แปลว่า 'สมกับ…': 노력한 만큼, 먹을 만큼 เทียบกับ N처럼 (เหมือน N), N보다 (มากกว่า N), N만 (เฉพาะ N)","ex":["คนที่มีน้ำใจมากเท่าคนเกาหลีก็หาได้ยาก","ฉันไม่เก็บตัวเท่าพี่ชาย","ไม่มีงานไหนที่คุ้มค่าเท่าการเลี้ยงลูก"],"notes":["หลังกริยาหรือคำคุณศัพท์ต้องเว้นวรรค: 노력한 만큼, 먹을 만큼 ('สมกับ…') ส่วนติดกันได้เฉพาะหลังคำนาม","อย่าสับสนกับ 만 ('เท่านั้น'): 형만 커요 = มีแต่พี่ชายที่ตัวใหญ่; 형만큼 커요 = ตัวใหญ่เท่าพี่ชาย 보다 ('กว่า') บอกความต่าง ส่วน 만큼 บอกว่าเท่ากัน"]},"g5-2":{"meaning":"ความจำเป็น / โอกาส / แผน / กำหนดการ / ความเป็นไปได้ที่จะทำ… กริยาในรูป -(으)ㄹ ขยายคำนามที่ตามมา","use":"ก้านกริยา + -ㄹ/-을 + คำนาม แล้วมักตามด้วย 이/가 있다·없다 หรือ -이다: 갈 필요가 없다 (ไม่จำเป็นต้องไป), 말할 기회가 생겼다, 떠날 계획이다, 출발할 예정입니다, 비가 올 가능성이 높다 계획 คือสิ่งที่ตั้งใจจะทำ ส่วน 예정 คือกำหนดการที่แน่นอนแล้วและฟังดูเป็นทางการ (ประกาศ ข่าว) 가능성 ใช้กับ 있다/없다/높다/낮다 ส่วน 필요 มักใช้ปฏิเสธ: -(으)ㄹ 필요가 없다 = 'ไม่จำเป็นต้อง…' คำคุณศัพท์ก็ใช้กับ 가능성 ได้ (비쌀 가능성)","ex":["แม้แต่พ่อแม่ก็ยังเห็นไม่ตรงกันว่าจำเป็นต้องส่งลูกไปเรียนต่างประเทศแต่เนิ่นๆ หรือไม่","ฉันวางแผนจะเรียนต่อปริญญาโทปีหน้า","สุดสัปดาห์นี้มีโอกาสสูงที่ฝนจะตก"],"notes":["계획 คือสิ่งที่เราตั้งใจจะทำ ส่วน 예정 คือกำหนดการที่แน่นอนแล้ว จึงมักใช้ในประกาศและข่าว","-(으)ㄹ 필요가 없다 แปลว่า 'ไม่จำเป็นต้อง…' ใกล้เคียงกับ -지 않아도 되다 ส่วน 가능성 ใช้กับ 있다, 없다, 높다, 낮다"]},"g5-3":{"meaning":"ราวกับจะบอกว่า…; ทำท่าราวกับพูดว่า '…' บุคคลแสดงความคิดด้วยสีหน้าหรือท่าทาง โดยไม่ได้พูดออกมา","use":"ประกอบจากตอนท้ายประโยคอ้างอิงทางอ้อม + 는 듯이: คำคุณศัพท์ -다는, กริยา -(ㄴ/는)다는, คำนาม (이)라는, คำถาม -(느)냐는, ชวน -자는, สั่ง -(으)라는 อดีตใช้ -았/었다는 듯이 อนาคต/คาดเดาใช้ -(으)ㄹ 거라는 듯이 ประโยคหลังเป็นท่าทางหรือสีหน้าของคนนั้น (고개를 끄덕이다, 어깨를 으쓱하다, 쳐다보다, 웃다) มักมี 마치 อย่าสับสนกับ -(으)ㄴ/는 듯이 ธรรมดา ('ราวกับ') ที่ไม่ต้องมีการอ้างอิง: 비가 올 듯이 흐려요","ex":["เด็กพยักหน้าราวกับจะบอกว่าเข้าใจที่ฉันพูดทั้งหมดแล้ว","เขายิ้มทักทายราวกับไม่มีอะไรเกิดขึ้น","เพื่อนมองฉันราวกับจะถามว่า 'ทำไมเพิ่งมาล่ะ'"],"notes":["-다는 듯이 แปลว่า 'ทำท่าราวกับพูดว่า…' ส่วน -(으)ㄴ/는 듯이 ธรรมดาแปลว่า 'ราวกับ': 비가 올 듯이 흐려요 (ฟ้ามัวราวกับฝนจะตก)","เติม 마치 จะเห็นภาพชัดขึ้น: '마치 다 안다는 듯이' ข้อความหน้า 듯이 คือสิ่งที่คนนั้นไม่ได้พูดออกมา เขียนจากมุมมองของเขา"]},"g5-4":{"meaning":"(น่าเสียดาย) มักจะ…; ทำ…เป็นนิสัย อธิบายสิ่งที่ไม่พึงประสงค์ที่เกิดซ้ำแล้วซ้ำอีก","use":"ก้านกริยา + -기(가) 일쑤이다: 지각하기 일쑤예요, 잃어버리기가 일쑤다 일쑤 เป็นคำนาม ประโยคจึงลงท้ายด้วย -이다 (일쑤예요, 일쑤입니다, 일쑤였어요) ใช้กับนิสัยที่ไม่ดีหรือน่ารำคาญ (มาสาย ลืม ทำของหาย สะดุดล้ม ข้ามมื้ออาหาร) ถ้าเป็นนิสัยกลางๆ ใช้ 자주 หรือ -곤 하다 ตัด 가 ได้ ไม่ใช้กับนิสัยที่ดี","ex":["ช่วงนี้ทำงานล่วงเวลาบ่อย เลยมักข้ามมื้อเช้า","ฉันสะเพร่า เลยทำร่มหายบ่อยๆ","ตอนเด็กๆ ฉันทะเลาะกับน้องเรื่องของเล่นอยู่เป็นประจำ"],"notes":["ใช้กับเรื่องที่ไม่ดีเท่านั้น นิสัยที่ดีหรือสิ่งที่ทำบ่อยธรรมดาใช้ 자주 หรือ -곤 하다","일쑤 เป็นคำนาม จึงลงท้ายด้วย 일쑤이다 (일쑤예요) ตัว 가 ใน -기가 일쑤다 ละได้"]},"g5-5":{"meaning":"ว่ากันถึงการ… (ก็คือ…); ยกการกระทำขึ้นเป็นหัวข้อ แล้วอธิบายหรือตัดสินมัน ซึ่งมักจะบอกว่ายาก","use":"ก้านกริยา + -기란 เป็นรูปย่อของ -기라는 것은 (= -는 것은) ตามด้วยการตัดสินหรืออธิบาย: 쉽지 않다, 어렵다, 힘들다, 보통 일이 아니다, 하늘의 별 따기이다 พบมากในเรียงความ คอลัมน์ และคำพูดเชิงสะท้อนความคิด ผู้อ่านคาดหวังความจริงเกี่ยวกับความยากของสิ่งนั้น ใช้ก้านกริยาเฉยๆ ไม่ใส่ -았/었- หรือ -겠- ก่อน 기란 รูปของคำนามคือ N(이)란 (사랑이란 ...) ภาคแสดงที่เป็นกลางอย่าง '좋다' ฟังแปลก","ex":["การหาเพื่อนใหม่ในต่างแดนไม่ใช่เรื่องง่าย","สมัยนี้การหาบ้านในโซลยากแทบเป็นไปไม่ได้ (เหมือนเด็ดดาวบนฟ้า)","การมีลูกแล้วทำงานต่อไม่ได้ง่ายอย่างที่พูด"],"notes":["-기란 ย่อมาจาก -기라는 것은 ส่วนใหญ่ตามด้วยสำนวนที่บอกความยาก เช่น 쉽지 않다, 어렵다, 힘들다, 보통 일이 아니다","คำนามใช้ -(이)란 (사랑이란) กริยาใช้ -기란 ส่วน -기는 ดูคล้ายกันแต่มักมีความหมายยอมรับก่อน ('하기는 하지만 ...') จึงไม่เหมือนกัน"]},"g6-1":{"meaning":"สมมติว่า…; ถือว่า… เป็นจริง (เพื่อการโต้แย้ง) ผู้พูดยอมรับประเด็นหนึ่งก่อน แล้วค่อยแย้งหรือยกปัญหาขึ้นมา","use":"มาจากตอนท้ายประโยคอ้างอิงทางอ้อม -다고 + 치다 ('ถือว่า'): คำคุณศัพท์ -다고 치다, กริยา -(ㄴ/는)다고 치다, คำนาม (이)라고 치다, อดีต -았/었다고 치다 รูปที่พบบ่อยคือ -다고 치자 (สมมติว่า), -다고 쳐도 / -다고 치더라도 (ต่อให้ถือว่า) แล้วตามด้วย 그래도, 하지만, 그런데 หรือประโยคแย้ง/ปฏิเสธ ผู้พูดไม่ได้เชื่อข้อสมมตินั้นเต็มที่ ซึ่งต่างจากเงื่อนไขธรรมดา -(ㄴ/는)다면 ใช้ในการอภิปราย โต้วาที และบ่น","ex":["สมมติว่าการไปเรียนต่างประเทศตั้งแต่เด็กช่วยเรื่องภาษาต่างประเทศ ถึงอย่างนั้นการที่เด็กเล็กอยู่ห่างครอบครัวก็ไม่เป็นไรหรือ","ต่อให้ถือว่าเงินเดือนสูง ถ้างานหนักเกินไปก็ทำได้ไม่นาน","ต่อให้เธอพูดถูก ก็ต้องขอโทษก่อนสิ"],"notes":["รูปแบบที่พบบ่อยมากคือจบประโยคด้วย -다고 치자 แล้วประโยคถัดไปแย้งด้วย 그래도 หรือ 하지만","-(ㄴ/는)다면 สมมติเงื่อนไขที่เป็นไปได้จริง แต่ -다고 치다 แค่ยอมรับไว้ก่อนโดยไม่ได้เชื่อเต็มที่"]},"g6-2":{"meaning":"ถ้าเป็น…ก็อาจจะได้ (ฉันอาจเข้าใจ) แต่ถ้าไม่ใช่ก็ไม่ได้ ยอมรับเงื่อนไขพิเศษที่ไม่น่าจะเป็นไปได้ก่อน แล้วสรุปจริงเป็นด้านลบหรือสงสัย: 'นอกจาก… ไม่อย่างนั้นก็ไม่ได้'","use":"ต่อ -(ㄴ/는)다면 หรือรูปย่อ -(으)면 + 몰라도: 어린아이라면 몰라도 (ถ้าเป็นเด็กเล็กก็ว่าไปอย่าง), 눈이 많이 온다면 몰라도 (นอกจากหิมะตกหนัก), 특별한 이유가 있다면 몰라도 อดีตใช้ -았/었다면 몰라도 คำนามใช้ N(이)라면 몰라도 ประโยคหลังเป็นด้านลบหรือสงสัย: -(으)ㄹ 수 없다, -기 어렵다, 안 되다, -지 않다 ประโยคแรกเป็นข้อยกเว้นที่ผู้พูดคิดว่าไม่น่าเป็นไปได้ ความหมายคือ 'กรณีนั้นอาจได้ แต่กรณีปกติไม่ได้' อย่าสับสนกับ -(으)ㄴ/는지 몰라도 ('ไม่รู้ว่า…หรือเปล่า')","ex":["ถ้าเป็นเด็กเล็กก็ว่าไปอย่าง แต่ผู้ใหญ่พูดแบบนั้นลำบากใจ","นอกจากจะถูกลอตเตอรี่ ไม่งั้นการซื้อบ้านด้วยเงินเดือนอย่างเดียวเป็นเรื่องยาก","คนที่เพิ่งเจอกันก็ว่าไปอย่าง แต่กับเพื่อนเก่าก็ไม่จำเป็นต้องพูดแบบนั้นนี่"],"notes":["ประโยคหลังต้องเป็นเนื้อหาด้านลบหรือสงสัย การใช้ผลดีหลัง -다면 몰라도 จะฟังแปลก","ย่อเป็น -(으)면 몰라도 ได้: '한두 번이면 몰라도 매번 이러면 곤란해요' (ครั้งสองครั้งไม่เป็นไร แต่ทำทุกครั้งก็แย่)"]},"g6-3":{"meaning":"ท่ามกลาง…; ในขณะที่…; ภายใต้…. ตั้งฉากสถานการณ์ฉากหลัง (สไตล์ข่าว) แล้วเหตุการณ์หลักเกิดขึ้นในนั้น","use":"คำคุณศัพท์ใช้ -(으)ㄴ กริยาปัจจุบันใช้ -는 กริยาอดีตหรือที่จบแล้วใช้ -(으)ㄴ / -던 คำนามใช้ 인 แล้วตามด้วย 가운데: 어려운 가운데, 지켜보는 가운데, 마친 가운데, 학생인 가운데 ประโยคแรกเป็นสถานการณ์หรือบรรยากาศที่ดำเนินอยู่ (관심이 쏠리는, 비가 오는, 어려운) ส่วนประโยคหลังเป็นเหตุการณ์หลัก (열렸다, 발표했다) พบมากในข่าว รายงาน และสุนทรพจน์ ไม่ใช้กับการกระทำสองอย่างพร้อมกันของคนคนเดียว (ใช้ -(으)면서) 가운데에도 แปลว่า 'แม้ท่ามกลาง…' ส่วน N 가운데 ('ในบรรดา N / ตรงกลาง') เป็นการใช้อีกแบบ","ex":["นโยบายใหม่ถูกประกาศท่ามกลางการจับตามองของประชาชนจำนวนมาก","แม้ท่ามกลางเศรษฐกิจที่ยากลำบาก ก็ตัดสินใจเพิ่มเงินสนับสนุนการคลอดบุตร","การแข่งขันมาราธอนจัดขึ้นท่ามกลางสายฝน"],"notes":["ไม่ใช้กับการกระทำสองอย่างที่คนคนเดียวทำพร้อมกัน ให้ใช้ -(으)면서 แทน: '음악을 들으면서 걸어요'","'N 가운데' ยังแปลว่า 'ในบรรดา N' หรือ 'ตรงกลาง' ได้ด้วย ส่วน '그런 가운데' แปลว่า 'ในสถานการณ์เช่นนั้น'"]},"g6-4":{"meaning":"เท่ากับว่า…; ก็เหมือนกับ…; โดยผลแล้ว… ผู้พูดดูข้อเท็จจริงแล้วสรุปว่าผลลัพธ์เท่ากับอีกสิ่งหนึ่ง","use":"กริยาปัจจุบันใช้ -는 กริยาที่จบแล้วหรือคำคุณศัพท์ใช้ -(으)ㄴ คำนามใช้ 인 แล้วตามด้วย 셈이다: 받는 셈이다, 끝낸 셈이다, 싼 셈이다, 가족인 셈이다 มักตามหลัง 사실상, 결국, 거의 หรือตัวเลข/การเปรียบเทียบ (십 년을 살았으니 ...) 셈 แปลว่า 'การคำนวณ' ประโยคนี้จึงรวมข้อเท็จจริงแล้วบอกผลรวม ระวัง -(으)ㄹ 셈이다 ที่แปลว่า 'ตั้งใจจะ…' (갈 셈이다 = ตั้งใจจะไป) ซึ่งเป็นไวยากรณ์คนละตัว","ex":["กระเป๋าใบนี้ซื้อตอนลดราคา เท่ากับซื้อในราคาครึ่งเดียว","อยู่เกาหลีมาสิบปีแล้ว ก็เท่ากับเป็นคนเกาหลีไปแล้ว","เขียนรายงานเกือบเสร็จแล้ว งานก็เท่ากับเสร็จแล้ว"],"notes":["-(으)ㄹ 셈이다 แปลว่า 'ตั้งใจจะ…' เป็นไวยากรณ์คนละตัว: '내일은 일찍 일어날 셈이에요' (ตั้งใจจะตื่นเช้าพรุ่งนี้)","'-(으)ㄴ 셈 치고' แปลว่า 'ถือเสียว่า…': '속은 셈 치고 한번 해 보세요' (ถือเสียว่าโดนหลอก ลองดูสักครั้ง)"]},"g7-1":{"meaning":"ผู้พูดนึกถึงสิ่งที่เคยเห็นกับตาในอดีต (ส่วนใหญ่เป็นการกระทำหรือสภาพของคนอื่น) แล้วต่อด้วยการกระทำที่ตามมา สภาพที่เปลี่ยนไป หรือผลลัพธ์ แปลประมาณว่า “...แล้วก็...”","use":"ต่อท้ายก้านคำกริยา/คำคุณศัพท์ (อดีตใช้ -았/었더니 คำนามใช้ N(이)더니) ประโยคแรกคือสิ่งที่ผู้พูดเคยเห็นมาก่อน ประธานมักเป็นบุคคลที่สามหรืออากาศ ประโยคหลังคือสิ่งที่เกิดตามมา เช่น การกระทำ การเปลี่ยนแปลง หรือผลลัพธ์ ประธานของสองประโยคมักเป็นคนเดียวกัน ถ้าเป็นการกระทำของตัวเองแล้วพบผลลัพธ์ ให้ใช้ -았/었더니 คำที่พบบ่อย: 그러더니 (แล้วก็) ข้อผิดพลาดที่พบบ่อย: ใช้ -더니 ทั้งที่ประธานของประโยคแรกคือ “ฉัน”","ex":["มินซูใช้สองมือยื่นของขวัญให้อาจารย์ แล้วก้มศีรษะทักทาย","จนถึงเมื่อวานอากาศร้อน แต่วันนี้อากาศเย็นลงอย่างกะทันหัน","พอใช้ท่าทางพูดในประเทศที่ไม่คุ้นเคย คนก็เข้าใจทันที"],"notes":["-더니 ใช้กับการกระทำของคนอื่นที่เห็นด้วยตาตัวเอง ถ้าเป็นการกระทำของตัวเองแล้วเกิดผลลัพธ์ ให้ใช้ -았/었더니 เช่น 약을 먹었더니 열이 내렸어요 (กินยาแล้วไข้ก็ลด) ห้ามพูดว่า “ฉัน” + 약을 먹더니","ใช้ได้เมื่อสองประโยคมีประธานเดียวกันและเนื้อหาตรงข้ามกัน (เมื่อวานฝนตก แต่วันนี้ฟ้าใส) 그러더니 = “แล้วก็”"]},"g7-2":{"meaning":"“อย่างที่คุณเห็น/ทราบ/ได้ยิน...” ยกเรื่องที่ผู้ฟังก็เห็น รู้ หรือเคยได้ยินอยู่แล้ว แล้วพูดต่อจากนั้น","use":"ต่อท้ายก้านคำกริยาเกี่ยวกับการเห็น การรู้ การได้ยิน เช่น 보다, 알다, 듣다, 느끼다, 말하다, 예상하다: 보시다시피, 아시다시피, 들으셨다시피 ถ้าเป็นเรื่องที่พูดไปแล้วให้ใช้อดีต -았/었다시피 (말씀드렸다시피) มักอยู่ต้นประโยค และค่อนข้างเป็นทางการ จึงพบบ่อยในการพูดนำเสนอ การประกาศ ข้อผิดพลาดที่พบบ่อย: ใช้กับข้อมูลใหม่ที่ผู้ฟังยังไม่รู้ หรือใช้กับคำกริยาที่ไม่เกี่ยวกับการรับรู้","ex":["อย่างที่คุณเห็น ในเกาหลีเวลายื่นของให้ผู้ใหญ่จะใช้สองมือ","อย่างที่คุณทราบ วิธีทักทายแตกต่างกันไปในแต่ละประเทศ","อย่างที่เคยบอกไปในคาบที่แล้ว พรุ่งนี้มีการนำเสนอเรื่องภาษากาย"],"notes":["-다시피 ใช้กับกริยาประเภทเห็น/รู้/ได้ยิน และพูดถึงข้อเท็จจริงที่ผู้ฟังรู้อยู่แล้ว ไม่ใช้กับข้อมูลใหม่ที่ผู้ฟังยังไม่รู้","ระวังอย่าสับสนกับ -다시피 하다 ที่แปลว่า “เกือบจะ...” เช่น 밤을 새우다시피 했어요 (แทบจะอดนอนทั้งคืน) เป็นไวยากรณ์คนละตัว"]},"g7-3":{"meaning":"-아/어야지 = “ควร...สิ / ต้อง...” ใช้เตือน ตั้งใจกับตัวเอง หรือตำหนิเบา ๆ; -아/어서는 안 된다 = “ห้าม... / ไม่ควร...”","use":"-아/어야지(요) ต่อท้ายก้านคำกริยา/คำคุณศัพท์ บอกว่าสิ่งนั้นควรทำอย่างแน่นอน ถ้าพูดกับคนอื่นเป็นการเตือนหรือตำหนิเบา ๆ ถ้าพูดกับตัวเองเป็นการตั้งใจ (내일부터 운동해야지) ส่วน -아/어서는 안 된다 เป็นการห้ามที่หนักแน่นและเป็นทางการกว่า -(으)면 안 되다 ใช้กับกฎ มารยาท ศีลธรรม ทั้งสองมักใช้คู่กัน: ควรทำ A ห้ามทำ B รูปสุภาพเขียน 안 돼요 (ไม่ใช่ 안 되요)","ex":["เวลาทักทายผู้ใหญ่ก็ต้องก้มศีรษะสิ","ห้ามนั่งไขว่ห้างต่อหน้าผู้ใหญ่","ควรเคารพวัฒนธรรมของประเทศอื่น ไม่ควรดูถูก"],"notes":["-아/어서는 안 된다 หนักแน่นและเป็นทางการกว่า -(으)면 안 되다 ใช้กับมารยาท กฎ และศีลธรรม รูปสุภาพคือ 안 돼요 ไม่ใช่ 안 되요","ถ้าจบประโยคด้วย -아/어야지ล้วน ๆ เมื่อพูดกับคนอื่นเป็นการเตือนว่า “ก็ต้องทำสิ” ถ้าพูดกับตัวเองเป็นการตั้งใจว่า “ฉันต้อง...”"]},"g7-4":{"meaning":"การเรียกและการอ้างคำ: เรียกคนหรือสิ่งของว่า N (N(이)라고 부르다/하다/말하다) ส่วน N 하고 ใช้อ้างคำหรือเสียงนั้นตรง ๆ","use":"คำนามที่มีตัวสะกดใช้ N이라고 ไม่มีตัวสะกดใช้ N라고 ตามด้วย 부르다, 하다, 말하다 เพื่อบอกว่าชื่อ คำเรียก หรือศัพท์ “ถูกเรียกว่าอะไร” ส่วน N 하고 เป็นการอ้างคำพูดหรือเสียงโดยตรง วางหลังคำหรือเสียงในเครื่องหมายคำพูด และเว้นวรรค: '엄마!' 하고 소리치다 ระวัง: 하고 ตัวนี้ไม่ใช่ 하고 ที่แปลว่า “และ/กับ”","ex":["ในเกาหลีเรียกรุ่นพี่ว่า '선배님'","เพื่อน ๆ เรียกฉันว่า '대니'","เด็กตะโกนว่า “แม่!” แล้ววิ่งเข้ามา"],"notes":["ถ้ามีตัวสะกดใช้ 이라고 ถ้าไม่มีใช้ 라고 และ 하고 ตัวนี้ไม่ใช่ 하고 ที่แปลว่า “และ/กับ” แต่ตามหลังคำหรือเสียงที่อ้าง และต้องเว้นวรรค","เวลาอธิบายชื่อหรือศัพท์มักใช้คู่กับ 하다/부르다: 이것을 한국어로 '손짓'이라고 해요 (สิ่งนี้ภาษาเกาหลีเรียกว่า '손짓')"]},"g7-5":{"meaning":"“N ก็คือ... / สิ่งที่เรียกว่า N คือ...” ยก N เป็นหัวข้อเพื่อให้คำนิยามหรือแสดงความคิดเห็นทั่วไปเกี่ยวกับสิ่งนั้น","use":"คำนามที่มีตัวสะกดใช้ N이란 ไม่มีตัวสะกดใช้ N란 เป็นรูปย่อของ N(이)라는 것은 ตามด้วยคำอธิบาย N ประโยคมักลงท้ายด้วย ~(이)다, ~는 것이다, ~(이)라고 할 수 있다พบบ่อยในบทความ การนำเสนอ และการสอน ไม่ใช้กับคนหรือเหตุการณ์เฉพาะเจาะจง","ex":["ภาษากายคือวิธีสื่อความรู้สึกด้วยร่างกายแทนคำพูด","คำเรียกขาน (호칭) คือคำที่ใช้เรียกคน","มารยาทเกิดจากใจที่เคารพอีกฝ่าย"],"notes":["N(이)란 ใช้เมื่อให้นิยามหรือพูดความคิดเห็นทั่วไป ไม่ใช้กับคนหรือเรื่องเฉพาะเจาะจง (민수 씨란 학생이에요 ผิด ต้องพูด 민수 씨는 학생이에요)","พบบ่อยในงานเขียน การนำเสนอ และการสอน ประโยคมักลงท้าย ~(이)다, ~는 것이다, ~(이)라고 할 수 있다และเปิดเป็นคำถามได้ เช่น 사랑이란? (ความรักคืออะไร)"]},"g8-1":{"meaning":"แสดงความประหลาดใจ ชื่นชม หรือเพิ่งสังเกตเห็นเรื่องใดเรื่องหนึ่งในขณะนั้น (ในบทนี้ใช้บอกสิ่งที่สังเกตเห็นในภาพวาด)","use":"ต่อท้ายก้านคำกริยา/คำคุณศัพท์ (อดีต -았/었네요 เดา -겠네요 คำนาม N(이)네요) ใช้กับสิ่งที่เพิ่งเห็น เพิ่งได้ยิน หรือเพิ่งรู้ ความรู้สึก “เพิ่งสังเกตเห็นตอนนี้” คือหัวใจ เป็นภาษาพูดที่นุ่มนวลสำหรับวิจารณ์ภาพที่เห็นหรือโต้ตอบกับอีกฝ่าย ข้อผิดพลาดที่พบบ่อย: ใช้กับสิ่งที่รู้มานานแล้ว หรือกับแผนของตัวเอง","ex":["ภาพนี้สีสันสดใสมากเลยนะ","ดูสิ เด็ก ๆ ในภาพยิ้มกันหมดเลย","ว้าว ภาพนี้วาดมาตั้งสี่ร้อยปีก่อนแน่ะ"],"notes":["-네요 ใช้กับสิ่งที่เพิ่งเห็นหรือเพิ่งรู้ ไม่ใช้กับเรื่องที่รู้อยู่แล้ว หรือแผนของตัวเอง (내일 가네요 ไม่ได้แปลว่า “พรุ่งนี้ฉันจะไป”)","เป็นวิธีแสดงความประหลาดใจหรือชื่นชมอย่างนุ่มนวล เวลาบรรยายภาพให้ใช้กับสิ่งที่สะดุดตา: 강아지가 있네요 (มีลูกสุนัขด้วย) เป็นภาษาพูดมากกว่า -군요"]},"g8-2":{"meaning":"N치고 + คำปฏิเสธ: “ไม่มี N คนไหนที่ไม่...” (ไม่มีข้อยกเว้น); N치고는: “สำหรับ N แล้ว...” (ต่างจากที่คาดไว้)","use":"ต่อ 치고/치고는 หลังคำนามได้เลย ไม่ต้องแยกว่ามีตัวสะกดหรือไม่ N치고 หมายถึง “ในกลุ่มนี้แทบทุกคนเป็นแบบนั้น” มักตามด้วยคำปฏิเสธ (없다, -지 않다, 못하다) แต่ความหมายรวมเป็นการยืนยันอย่างหนักแน่น ส่วน N치고는 ใช้ N เป็นมาตรฐานแล้วบอกผลที่ต่างจากที่คาดไว้สำหรับกลุ่มนั้น เช่น “สำหรับมือใหม่ วาดเก่งมาก”","ex":["ศิลปินทุกคนล้วนมีความอ่อนไหวทางอารมณ์ (ไม่มีศิลปินที่ไม่มี)","สำหรับคนที่มาเกาหลีได้แค่สามเดือน พูดภาษาเกาหลีเก่งมาก","คนเกาหลีแทบไม่มีใครที่ไม่กินกิมจิ"],"notes":["สิ่งที่ตามหลัง N치고는 ต่างจากที่คาดไว้เกี่ยวกับ N (มือใหม่แต่วาดเก่ง หน้าหนาวแต่อากาศอุ่น) ส่วน N치고 มักตามด้วยคำปฏิเสธ เช่น 없다 ความหมายคือ “ไม่มีข้อยกเว้น”","ในภาษาพูด 치고는 มักย่อเป็น 치곤: 겨울치곤 따뜻해요 (สำหรับหน้าหนาวถือว่าอุ่น)"]},"g8-3":{"meaning":"การปฏิเสธซ้อน: ใช้การปฏิเสธสองครั้งเพื่อเน้นความหมายเชิงบวกให้หนักแน่นขึ้น “ต้องเป็น N แน่นอน / อดไม่ได้ที่จะ... / ถ้าไม่...ไม่ได้ (ต้อง...) / ไม่มีอะไรที่...ไม่ได้”","use":"โครงสร้างหลักมี 4 แบบ: N이/가 아닐 수 없다 (ต้องเป็น N แน่นอน), V-지 않을 수(가) 없다 (อดไม่ได้ที่จะ...), V-지 않으면 안 되다 (ต้อง...), V-(으)ㄹ 수 없는 것이 없다 (ไม่มีอะไรที่ทำไม่ได้ คือทำได้ทุกอย่าง) น้ำเสียงหนักแน่นและเป็นทางการ พบในงานเขียน บทวิจารณ์ การนำเสนอ ในชีวิตประจำวัน 꼭 ~아/어야 해요 ธรรมชาติกว่า ปฏิเสธสองครั้งรวมกันได้ความหมายเชิงบวก อย่าแปลตรงตัวว่า “ไม่ได้”","ex":["ภาพนี้ต้องยอมรับว่าเป็นผลงานชิ้นเอกของภาพวาดวิถีชีวิตเกาหลี","เห็นภาพที่งดงามขนาดนี้ก็อดประทับใจไม่ได้","ระหว่างบำบัดด้วยศิลปะ ต้องวาดรูปทุกวัน"],"notes":["การปฏิเสธซ้อนใช้บ่อยในภาษาทางการและงานเขียน เช่น บทความ บทวิจารณ์ การนำเสนอ ส่วนในบทสนทนาทั่วไป 꼭 ~아/어야 해요 ธรรมชาติกว่า การปฏิเสธสองครั้งรวมกันมีความหมายเชิงบวก","-지 않을 수 없다 ≈ “อดไม่ได้ที่จะ...” -지 않으면 안 되다 ≈ “ต้อง...” รูปสุภาพเขียน 안 돼요"]},"g8-4":{"meaning":"“ในการ... / สำหรับการทำ...” -는 데 เปลี่ยนคำกริยาให้เป็นวลีนาม (เรื่อง/สถานการณ์ของการทำ...) แล้วตามด้วย 도움이 되다, 필요하다, 시간이 걸리다, 자신이 있다 เป็นต้น","use":"ต่อท้ายก้านคำกริยา (กริยาที่ลงท้ายด้วย ㄹ ตัด ㄹ: 만들다 → 만드는 데) 데 ตรงนี้เป็นคำนามไม่อิสระ (“เรื่อง/กรณีของ...”) จึงเขียนเว้นวรรค และใส่ 에 ตามได้: 하는 데(에) คำที่มาคู่บ่อย: 도움이 되다/주다, 필요하다, 시간이 걸리다, 돈이 들다, 좋다, 효과가 있다, 자신이 있다, 익숙하다, 서투르다 อย่าสับสนกับ -는데 ที่เขียนติดกัน (แปลว่า “แต่/และ”)","ex":["การบำบัดด้วยศิลปะช่วยให้จิตใจสงบ","ได้ยินว่าใช้เวลาสี่ปีกว่าจะวาดภาพใหญ่นี้เสร็จ","ฉันมั่นใจเรื่องการอธิบายภาพวาด"],"notes":["ต้องเว้นวรรค 데 ใน -는 데 ส่วน -는데 ที่เขียนติดกันเป็นหางประโยคเชื่อมประโยค (“...แต่/และ...”) เป็นไวยากรณ์คนละตัว","หลัง -는 데 มักมีสำนวนตายตัว เช่น 도움이 되다, 필요하다, 시간이 걸리다, 돈이 들다, 자신이 있다, 효과가 있다 จำเป็นกลุ่มคำจะง่ายกว่า"]}},"ru":{"g1-1":{"meaning":"Что-то почти произошло, но в итоге не произошло. Используется для «чуть не»: обычно о чём-то плохом.","use":"К основе на гласный добавляется -ㄹ, к основе на согласный — -을 (넘어지다 → 넘어질, 먹다 → 먹을; основы на ㄹ сохраняют ㄹ: 울다 → 울), затем 뻔했다. Так как событие на самом деле не случилось, почти всегда используется прошедшее время (뻔했어요 / 뻔했다). Чаще всего с глаголами происшествий и неловких ситуаций (넘어지다, 늦다, 울다, 놓치다). Слово 하마터면 («чуть было не») в начале усиливает смысл. Частая ошибка: использовать форму для случившегося или в настоящем времени (넘어질 뻔해요).","ex":["В дождливый день я поскользнулся на лестнице и чуть не упал.","Я не заказал билет заранее и чуть не пропустил фильм.","Концовка была такой трогательной, что я чуть не заплакал в кинотеатре."],"notes":["Раз событие не произошло, обычно ставится прошедшее время -(으)ㄹ 뻔했다. Форма настоящего времени вроде 넘어질 뻔해요 звучит неверно.","Слово 하마터면 («чуть было не») перед глаголом усиливает ощущение «на волоске». Чаще оно о плохом, но может описывать и упущенный шанс (우승할 뻔했어요 «чуть не победил»)."]},"g1-2":{"meaning":"Может быть, потому что ~. Говорящий называет причину, которую лишь предполагает, а затем описывает замеченный результат.","use":"К обычной форме -아/어서 (좋아서, 먹어서, 피곤해서; у существительных 이라서/라서) добавляется 그런지, затем называется замеченный результат. Причина — только догадка; если вы уверены, используйте обычное -아/어서. Во второй части — утверждение о том, что вы почувствовали или заметили (졸리다, 사람이 많다), а не приказ или предложение. Часто встречается с 오늘따라 или 왠지. Частая ошибка: использовать при известной причине или заканчивать приказом.","ex":["Может быть, потому что вчера я поздно лёг, сегодня весь день хочу спать.","Может быть, потому что выходные, в кинотеатре очень много людей.","Может быть, потому что песня хорошая, видео с липсинком набирает популярность."],"notes":["После 그런지 ставьте утверждение о замеченном, а не приказ или предложение. (✗ 피곤해서 그런지 일찍 주무세요)","Если причина точно известна, используйте просто -아/어서 или -(으)니까. 그런지 несёт оттенок «может быть, дело в этом?»."]},"g1-3":{"meaning":"Чем больше ~, тем больше ~. Когда степень первого растёт, вместе с ней растёт (или меняется) второе.","use":"К основам на гласный или ㄹ добавляется -ㄹ수록 (보다 → 볼수록, 만들다 → 만들수록), к основам на согласный — -을수록 (먹다 → 먹을수록, 좋다 → 좋을수록). Предшествующее -(으)면 необязательно и лишь усиливает; тот же глагол повторяется (보면 볼수록, 알면 알수록). Во второй части часто стоит 더 («ещё больше»). Прошедшее -았/었- перед -(으)ㄹ수록 не ставится. Частые ошибки: -았/었- в первой части или использование для однократного события.","ex":["Чем больше смотришь этот фильм, тем он привлекательнее.","Чем больше тренируешь липсинк, тем лучше получается.","Чем больше читаю текст песни, тем глубже кажется смысл."],"notes":["Перед -(으)ㄹ수록 не ставится -았/었- (✗ 많았을수록). Форма также не употребляется для однократного события.","Во второй части часто стоит «더»: 알수록 더 재미있어요. Повтор того же глагола (보면 볼수록) добавляет усиление."]},"g1-4":{"meaning":"Скорее ~, чем ~ (на самом деле скорее ~). Отодвигает первое действие или описание в пользу более лучшего или более точного.","use":"-기보다 присоединяется прямо к основе глагола (쉬다 → 쉬기보다, 사다 → 사기보다); 는 добавляет противопоставление. Подходит и к прилагательным (슬프기보다). Вторая часть называет то, что говорящий предпочитает, или более точное описание; часто с -는 편이다, -는 게 낫다/좋다 или 오히려 («наоборот»). Частые ошибки: прошедшее время на 기 (✗ 쉬었기보다) или сравнение несопоставимых вещей.","ex":["В выходные я люблю скорее встречаться с друзьями, чем отдыхать дома.","Этот фильм скорее тёплая история, чем грустная.","Перед экзаменом важнее понимать, чем просто заучивать вопросы."],"notes":["Обычно после идёт более хороший или более точный вариант. К -기보다 не добавляют прошедшее -았/었- (✗ 쉬었기보다).","Естественно сочетание с 오히려 или -는 편이다: 슬프기보다 오히려 따뜻한 이야기예요. С существительными используется «N보다는»."]},"g1-5":{"meaning":"Раз уж ~ / пока ~, то естественно ~. Первая часть — установленный факт, вторая — то, что из него следует или что нужно делать.","use":"К глаголам добавляется -는 이상, к прилагательным и завершённым действиям — -(으)ㄴ 이상 (약속한 이상), к существительным — 인 이상. Вторая часть выражает долг, решение или естественный вывод (-아/어야 하다, -(으)ㄹ 수밖에 없다, -겠다), а не нейтральный факт. По сравнению с -(으)니까 более твёрдо и официально. Частая ошибка: заканчивать простым фактом в прошедшем времени (✗ 약속한 이상 갔어요).","ex":["Раз уж ты живёшь в Корее, нужно усердно учить корейский.","Раз я пообещал, то пойду, даже если будет дождь.","Раз решение уже принято, его больше нельзя изменить."],"notes":["Во второй части должны быть долг, решимость или естественный итог. Простой факт в прошедшем времени звучит странно (✗ 약속한 이상 갔어요).","-(으)니까 — лёгкое «потому что», а -는 이상 звучит твёрдо: «раз уж так, то деваться некуда». Подходит для официальной речи и письма."]},"g2-1":{"meaning":"Не может быть, чтобы ~. Говорящий твёрдо убеждён, что что-то не может быть правдой или не может произойти.","use":"К основе добавляется -(으)ㄹ (가다 → 갈, 먹다 → 먹을, 살다 → 살) и 리가 없다; прошедшее — -았/었을 리가 없다; у существительных — 일 리가 없다. 리 — существительное «причина/возможность», поэтому встречаются 리는 없다 и 리(가) 있어요? («как такое возможно?»). Это твёрдая уверенность говорящего, основанная на его знании человека или ситуации, а не проверенный факт. Частые ошибки: употреблять о собственных планах или с приказом.","ex":["Он не может лгать. Я давно его знаю.","Лягушонок ни за что не послушается маму. Он ведь всегда делает наоборот.","Ещё вчера он был здоров, так что не может быть, чтобы он вдруг заболел."],"notes":["С существительными используется «N일 리가 없다» (✗ 거짓말 리가 없다 → ○ 거짓말일 리가 없다). Для уже завершённого — -았/었을 리가 없다.","В разговоре часто встречается как риторический вопрос «리가 있어요?» («разве такое возможно?») или «-ㄹ 리가 없는데…»."]},"g2-2":{"meaning":"Из-за неожиданного события получился (обычно плохой) результат. Вся ситуация уже в прошлом.","use":"-는 바람에 присоединяется к основе глагола (넘어지다 → 넘어지는 바람에, 오다 → 오는 바람에). Время выражается только в конце предложения, поэтому первая часть остаётся с -는, даже если это прошлое (✗ 비가 왔는 바람에). Причина — неожиданное событие, которое говорящий не выбирал, а результат обычно негативный (늦다, 못 하다, 놓치다, 망치다). Вторая часть не может быть приказом или предложением. С прилагательными не используется. Частые ошибки: -았/었는 바람에 или намеренное действие в роли причины.","ex":["Внезапно пошёл дождь, поэтому мы не смогли поехать на пикник.","Младший брат разбил чашку, и пол оказался залит водой.","У телефона села батарея, поэтому я не смог доснять видео с липсинком."],"notes":["Время ставится только в конце предложения (✗ 비가 왔는 바람에 → ○ 비가 오는 바람에 소풍을 못 갔어요). После формы не ставятся приказ и предложение.","-는 바람에 несёт оттенок «к несчастью, так получилось». Для хорошего результата используют -덕분에, для нейтральной причины — -아/어서."]},"g2-3":{"meaning":"Притворяться, что ~. Субъект ведёт себя так, будто что-то правда, хотя это не так.","use":"С глаголами используется -는 척하다 (자다 → 자는 척하다; 알다 → 아는 척하다, 모르다 → 모르는 척하다), с прилагательными — -(으)ㄴ 척하다 (아프다 → 아픈 척하다), с существительными — N인 척하다. Чтобы притвориться, что действие уже совершено, используется V-(으)ㄴ 척하다 (이미 먹은 척하다). Время всего предложения ставится на 하다 (척했다). -는 체하다 означает то же самое, 척 разговорнее. Частая ошибка: -는 с прилагательным (✗ 아프는 척하다).","ex":["Младший брат притворился больным и не пошёл в школу.","Минсу знал этот факт, но притворился, что не знает.","Лягушонок притворился, что слушает маму, а потом сделал наоборот."],"notes":["알다, 모르다, 있다, 없다 берут -는 척 (아는 척, 모르는 척, 있는 척). Только прилагательные берут -(으)ㄴ 척 (아픈 척, 괜찮은 척).","Поскольку это изображение неправды, оттенок может быть слегка негативным. -는 체하다 означает то же, 척 разговорнее."]},"g2-4":{"meaning":"Делать что-то кое-как, так что трудно сказать, сделано это вообще или нет.","use":"-는 둥 마는 둥 присоединяется к основе глагола, причём один и тот же глагол стоит в обеих частях (먹다 → 먹는 둥 마는 둥, 듣다 → 듣는 둥 마는 둥); дальше идёт 하다 или другой глагол: 먹는 둥 마는 둥 하고 나왔어요. Чаще всего в прошедшем времени; описывает невнимание или небрежность из-за сонливости, спешки или тревоги. Типичные глаголы: 먹다, 듣다, 자다, 하다, 보다. Частые ошибки: два разных глагола (это другая конструкция -는 둥 -는 둥) или употребление с прилагательными.","ex":["Утром я опоздал, поэтому почти не поел и ушёл.","Хотелось спать, и я слушал урок вполуха.","Я так переживал, что прошлой ночью почти не спал."],"notes":["Глагол повторяется один и тот же: 듣는 둥 마는 둥. Два разных глагола дают другую конструкцию (-는 둥 -는 둥).","마는 происходит от 말다 («прекратить»). Передаёт недовольство тем, что сделано не как следует, поэтому обычно рядом называют причину (졸려서, 바빠서)."]},"g2-5":{"meaning":"Сказительское окончание (сокращение от -다고 합니다). Тепло и увлекательно передаёт услышанное, как в народной сказке или при разговоре с ребёнком и слушателями.","use":"Формы: прилагательное -답니다, глагол на гласный -ㄴ답니다, на согласный -는답니다 (глаголы на ㄹ теряют ㄹ: 살다 → 산답니다), существительное (이)랍니다, прошедшее -았/었답니다. Употребляется в сказках и когда рассказывают интересное слушателям (родители, гиды, ведущие). Звучит тепло и немного игриво, поэтому не подходит для нейтральных сообщений. Ребёнку напрямую говорят -단다/-란다. Частая ошибка: использовать для собственного мнения или личного опыта.","ex":["Давным-давно жили добрый Хынбу и жадный Нольбу.","Брат и сестра поднялись на небо и стали Солнцем и Луной.","В той деревне и сейчас передают историю про лягушонка."],"notes":["Глагол без патчима: -ㄴ답니다 (간답니다), с патчимом: -는답니다 (먹는답니다), прилагательное: -답니다 (착하답니다), 이다 превращается в (이)랍니다. Глаголы на ㄹ теряют ㄹ (산답니다).","Ребёнку напрямую говорят -단다/-란다: 옛날에 호랑이가 살았단다. Часто встречается в последних строках сказок."]},"g3-1":{"meaning":"Мягкое предположение: «думаю, ~» / «наверное, ~». Часто используется, чтобы мягко поправить или возразить собеседнику.","use":"К основам на гласный или ㄹ добавляется -ㄹ걸요, к основам на согласный — -을걸요; прошедшее -았/었을걸요; существительные — 일걸요. Между близкими -요 опускают (-(으)ㄹ걸). Это разговорная форма только для догадки, не для подтверждённых фактов и не для собственных планов. Часто отвечает на чужое предположение (아니에요, ~ -(으)ㄹ걸요) и звучит мягче с 아마. Частые ошибки: официальное письмо, собственные планы (✗ 저는 내일 갈걸요) или вопрос.","ex":["Если выехать сейчас, на дороге, наверное, будут сильные пробки.","Тот фильм, наверное, уже закончился. Сейчас не успеешь.","Господина Кима, наверное, сейчас нет в офисе."],"notes":["-(으)ㄹ걸요 — всего лишь догадка, поэтому не используется для своих планов. А '-(으)ㄹ걸 그랬다' — другая конструкция, выражающая сожаление.","Можно мягко возразить: «Нет, 주말이라서 사람이 많을걸요» («выходной, так что, наверное, людно»). С 아마 звучит ещё мягче."]},"g3-2":{"meaning":"Из того, что ~, ещё не следует, что ~. Первая часть — распространённое мнение, вторая отвергает «автоматический» вывод.","use":"Образуется цитатная форма -다고 해서 (прилагательное -다고, глагол -ㄴ/는다고, существительное (이)라고; прошедшее -았/었다고), а заканчивается -(으)ㄴ/는 것은 아니다 (в речи 건 아니에요). Первая часть — общепринятое мнение (비싸다고 해서 ...), а окончание значит «не обязательно», а не «точно нет». 해서 можно опустить. Естественно с 반드시 / 꼭 / 항상 / 다. Частые ошибки: понимать как полное отрицание или ставить в первую часть правило, в которое никто не верит.","ex":["Из того, что цена высока, не обязательно следует, что качество хорошее.","Не вся информация в интернете — правда.","Из того, что человек хорошо поёт, не следует, что он хорошо делает липсинк."],"notes":["Заканчивайте на '-(으)ㄴ/는 것은 아니다' (в речи '-는 건 아니에요'). Это не полное отрицание, а «не обязательно так».","Существительные: N(이)라고 해서, прошедшее: -았/었다고 해서. 해서 можно опустить: '-다고 -는 건 아니다'."]},"g3-3":{"meaning":"Сделать что-то заранее и сохранить результат на потом.","use":"К основам на ㅏ/ㅗ добавляется -아 두다, к остальным — -어 두다 (사다 → 사 두다, 적다 → 적어 두다, 준비하다 → 준비해 두다). Используется для подготовки заранее (예매해 두다) или чтобы оставить состояние как есть (창문을 열어 두다 «оставить окно открытым»). Нужен глагол, результат которого сохраняется: 사다, 적다, 켜다, 열다, 예약하다. Не употребляется с глаголами без устойчивого результата и с прилагательными (✗ 학교에 가 두다). 두었다 часто сокращается до 뒀다. Почти то же, что -아/어 놓다, но тот разговорнее.","ex":["Перед экзаменом запишите важные слова в тетрадь.","Я заранее заказал билеты в кино.","Я оставил свет включённым, пока не придёт друг."],"notes":["Используется только для действий, результат которых остаётся. Не употребляется с глаголами движения и состояния (✗ 학교에 가 두다, ✗ 예뻐 두다).","Почти то же, что -아/어 놓다. Два значения: «подготовить заранее» и «оставить как есть»; 두었다 часто сокращают до 뒀다."]},"g3-4":{"meaning":"В зависимости от того, ~ / как ~. Результат второй части различается в зависимости от содержания первой.","use":"К глаголам добавляется -느냐에 따라 (먹느냐에 따라), к прилагательным — -(으)냐에 따라 (크냐에 따라, 어려우냐에 따라), к существительным — (이)냐에 따라. Хорошо сочетается с вопросительными словами (누가, 어떻게, 얼마나, 무엇을). Вторая часть говорит о различии или изменении: 달라지다, 다르다, 바뀌다, 결정되다. 서 необязательно. Частые ошибки: использовать -(으)면 «если» или заканчивать фиксированным результатом, когда ничего не меняется.","ex":["Даже одна и та же песня звучит по-разному в зависимости от того, кто её поёт.","Способности мозга могут меняться в зависимости от того, как его использовать.","Память может меняться в зависимости от того, сколько вы спите."],"notes":["Во второй части нужно слово, говорящее об изменчивости результата: 달라지다/다르다/바뀌다/결정되다. Если результат фиксирован, форма не используется.","С существительными можно короче: «N에 따라(서)»: 사람에 따라 달라요. Естественно звучит с вопросительными словами (누가, 어떻게, 얼마나)."]},"g3-5":{"meaning":"Наконец-то справиться с чем-то трудным собственными силами, преодолев трудности до конца.","use":"К основам на ㅏ/ㅗ добавляется -아 내다, к остальным — -어 내다 (참다 → 참아 내다, 이기다 → 이겨 내다, 하다 → 해 내다). Описывает завершение трудного или долгого дела собственными силами, поэтому подходит глаголам терпения и достижения (참다, 이기다, 견디다, 찾다, 해결하다, 만들다). Чаще в прошедшем или завершённом виде (참아 냈어요), часто с 끝까지 или 드디어. Не употребляется с лёгкими действиями (✗ 밥을 먹어 냈어요) и с прилагательными.","ex":["Этот ученик выдержал тяжёлую тренировку до конца.","Наша команда сама решила трудную задачу.","Хынбу преодолел бедность и стал жить счастливо."],"notes":["Используется только для дел, где есть трудности и усилия. С лёгким действием звучит странно (✗ 밥을 먹어 냈어요).","Много устойчивых сочетаний: 이겨 내다, 참아 내다, 견뎌 내다, 해 내다, 찾아 내다, 알아 내다. Хорошо сочетается с 끝까지, 드디어, 결국."]},"g4-1":{"meaning":"Настолько ..., что ...; до такой степени, что .... В первой части называется состояние или действие, во второй — наглядный результат или образ, показывающий, насколько оно сильно.","use":"К основе на гласный добавляется -ㄹ, к основе на согласный — -을 (основы на ㄹ остаются как есть: 울 정도로); прошедшее время — -았/었을 정도로. Во второй части обычно стоит конкретный или преувеличенный результат (눈물이 날, 믿기 어려울, 숨이 막힐), поэтому оборот частый в рассказах и жалобах. В конце предложения: -(으)ㄹ 정도이다. Типичная ошибка: использовать его как причину («потому что»); 정도로 показывает степень, а не причину, и во второй части нет повелительной формы или приглашения.","ex":["Результаты опроса были настолько удивительными, что в них трудно поверить.","Корейцы такие душевные, что угощают обедом даже тех, кого видят впервые.","Вчера я так устал, что уснул, едва лёг."],"notes":["정도로 показывает степень, а не причину, поэтому его нельзя заменять на -아/어서 («потому что»). Во второй части обычно не ставят повелительную форму или приглашение.","В конце предложения используется -(으)ㄹ 정도이다: «눈물이 날 정도예요» (до слёз). «죽을 정도로 힘들다» — частое преувеличение."]},"g4-2":{"meaning":"Только делает ... (и ничего больше); только ... и всё. Говорящий подчёркивает, что есть лишь одно действие или состояние, часто с жалобой или противопоставлением.","use":"-기만 присоединяется к основе глагола или прилагательного, затем спрягается 하다: 먹기만 해요, 좋기만 하다, 놀기만 했어요. Часто далее идёт противопоставление: 듣기만 하고 말은 안 해요 (только слушает, не говорит), 예쁘기만 하고 쓸모가 없어요. Сравните с N만 V: 책만 읽어요 ограничивает объект (только книги), а 읽기만 하다 ограничивает всё действие (только читает и ничего больше). Не путайте с -기만 하면 («стоит только ...»).","ex":["Современные дети только ходят на дополнительные занятия, и у них нет времени играть с друзьями.","Младший брат, приходя домой, только играет в игры, и я за него беспокоюсь.","В этом ресторане только дорого, а еда так себе."],"notes":["'책만 읽어요' ограничивает объект (только книги); '책을 읽기만 해요' ограничивает действие (только читает и больше ничего не делает).","Противопоставление добавляют через -고, -(으)ㄴ/는데 или -지 않다: '보기만 하고 사지는 않아요' (только смотрит, не покупает)."]},"g4-3":{"meaning":"Что-то / кто-то / где-то / когда-нибудь: предмет, человек, место или время неясны или не названы. 왠지 значит «почему-то».","use":"Это вопросительные слова + -인가 в сокращённой форме: 무엇인가 → 뭔가 (в письменной речи 무언가), 누구인가 → 누군가, 어디인가 → 어딘가, 언제인가 → 언젠가, 왜인지 → 왠지. Употребляются в утверждениях непосредственно перед глаголом или прилагательным: 뭔가 이상해요 (что-то странно), 누군가 왔어요 (кто-то пришёл). Падежные частицы необязательны: 뭔가를, 누군가가, 어딘가에서. 언젠가 может указывать и на прошлое («однажды»), и на будущее («когда-нибудь»). 왠지 сочетается с чувством, которое трудно объяснить: 왠지 불안해요.","ex":["В последнее время хочу начать какое-нибудь новое хобби.","Я услышал, как кто-то зовёт меня по имени, и обернулся.","Когда закончу учёбу, когда-нибудь хочу поработать в Корее."],"notes":["Правильно писать 왠지 (왜 + 인지); 웬지 — ошибка. (В словах 웬일 и 웬만하면 пишется 웬.)","'어딘가 이상하다' значит «как-то странно»: так описывают ощущение, которое не удаётся точно определить. 뭔가 이상하다 работает так же."]},"g4-4":{"meaning":"Путём ...; посредством ... (книжный, письменный стиль). Первая часть — средство или способ, с помощью которого достигается результат второй части.","use":"К основе на гласный добавляется -ㅁ, к основе на согласный — -음, затем 으로써: 하다 → 함으로써, 읽다 → 읽음으로써. У основ на ㄹ ㄹ заменяется на ㅁ: 알다 → 앎으로써. Встречается в эссе, новостях, речах и отчётах, обычно с результатом вроде -(으)ㄹ 수 있다, 높이다, 줄이다, 해결하다. В разговорной речи вместо него используют -아/어서 или -(으)면. Не путайте 으로써 (средство) с 으로서 (статус, например 학생으로서) и -(으)므로 («потому что»).","ex":["Правительство намерено решить проблему низкой рождаемости, выплачивая пособия при рождении ребёнка.","Слушая рассказы друг друга, мы можем укреплять чувство 정.","Занимаясь спортом каждый день, он вернул себе здоровье."],"notes":["으로써 обозначает средство (칼로써 자르다 — «резать ножом»), а 으로서 — статус (학생으로서 — «как студент»). Путать их — очень частая ошибка.","Это формальный письменный оборот. В разговоре естественнее -아/어서 или -(으)면: '운동을 해서 건강해졌어요'."]},"g5-1":{"meaning":"Столько же, сколько N; в такой же степени, как N. Показывает, что что-то равно N по размеру, количеству или степени.","use":"만큼 присоединяется к существительному без пробела: 나만큼, 서울만큼, 아이를 키우는 일만큼. Во второй части обычно стоит прилагательное или глагол, показывающий степень: 나만큼 키가 크다 (такой же высокий, как я). Для «не такой, как» используется отрицание: 나만큼 크지 않다 / 못하다. После глагола или прилагательного в определительной форме 만큼 — зависимое существительное, пишется отдельно и значит «соразмерно»: 노력한 만큼, 먹을 만큼. Сравните: N처럼 (как N, по манере), N보다 (больше, чем N), N만 (только N).","ex":["Таких душевных людей, как корейцы, мало.","Я не такой замкнутый, как мой старший брат.","Нет труда, который приносил бы столько же удовлетворения, как воспитание ребёнка."],"notes":["После глагола или прилагательного 만큼 пишется отдельно: 노력한 만큼, 먹을 만큼 («соразмерно»). Слитно оно пишется только после существительного.","Не путайте 만큼 с 만 («только»): 형만 커요 = высокий только брат; 형만큼 커요 = такой же высокий, как брат. 보다 («чем») показывает разницу, а 만큼 — равенство."]},"g5-2":{"meaning":"Необходимость / возможность (случай) / план / намеченное на определённое время / вероятность сделать .... Глагол в форме -(으)ㄹ определяет следующее за ним существительное.","use":"Основа глагола + -ㄹ/-을 + существительное, затем обычно 이/가 있다·없다 или -이다: 갈 필요가 없다 (не нужно идти), 말할 기회가 생겼다, 떠날 계획이다, 출발할 예정입니다, 비가 올 가능성이 높다. 계획 — то, что вы сами собираетесь сделать; 예정 — уже назначенный срок, звучит официально (объявления, новости). 가능성 сочетается с 있다/없다/높다/낮다. 필요 часто в отрицании: -(으)ㄹ 필요가 없다 = «нет необходимости». С 가능성 можно использовать и прилагательные (비쌀 가능성).","ex":["Даже среди родителей мнения расходятся о том, нужно ли отправлять детей учиться за границу в раннем возрасте.","Я планирую поступить в магистратуру в следующем году.","В эти выходные высока вероятность дождя."],"notes":["계획 — то, что вы сами решили сделать, а 예정 — уже назначенный график, поэтому в объявлениях и новостях часто используют 예정.","-(으)ㄹ 필요가 없다 значит «нет необходимости» и близко к -지 않아도 되다. 가능성 сочетается с 있다, 없다, 높다, 낮다."]},"g5-3":{"meaning":"Как будто говоря ...; с видом, словно человек говорит «...». Человек выражает мысль взглядом или жестом, не произнося её вслух.","use":"Образуется из окончания косвенной речи + 는 듯이: прилагательное -다는, глагол -(ㄴ/는)다는, существительное (이)라는, вопрос -(느)냐는, приглашение -자는, приказ -(으)라는. Прошедшее — -았/었다는 듯이, будущее/предположение — -(으)ㄹ 거라는 듯이. Во второй части жест или выражение лица (고개를 끄덕이다, 어깨를 으쓱하다, 쳐다보다, 웃다), часто с 마치. Не путайте с обычным -(으)ㄴ/는 듯이 («как будто»), где цитаты нет: 비가 올 듯이 흐려요.","ex":["Ребёнок кивнул, словно говоря, что понял всё, что я сказал.","Он улыбнулся и поздоровался, будто ничего не произошло.","Друг посмотрел на меня, словно спрашивая: «Почему ты только сейчас пришёл?»"],"notes":["-다는 듯이 значит «ведёт себя так, будто говорит это», а обычное -(으)ㄴ/는 듯이 — просто «как будто»: 비가 올 듯이 흐려요 (пасмурно, как будто пойдёт дождь).","С 마치 звучит ярче: '마치 다 안다는 듯이'. Слова перед 듯이 — невысказанные слова самого действующего лица, написанные с его точки зрения."]},"g5-4":{"meaning":"(К сожалению) часто делает ...; имеет привычку .... Описывает нежелательное событие, которое повторяется снова и снова.","use":"Основа глагола + -기(가) 일쑤이다: 지각하기 일쑤예요, 잃어버리기가 일쑤다. 일쑤 — существительное, поэтому предложение заканчивается на -이다 (일쑤예요, 일쑤입니다, 일쑤였어요). Используется для плохих или досадных привычек (опаздывать, забывать, терять вещи, спотыкаться, пропускать приёмы пищи). Для нейтральных привычек подходят 자주 или -곤 하다. 가 можно опустить. Для хороших привычек не используется.","ex":["В последнее время много сверхурочных, поэтому я часто пропускаю завтрак.","Я такой рассеянный, что часто теряю зонт.","В детстве я часто дрался с братом из-за игрушек."],"notes":["Используется только для нежелательных вещей. Для нейтральных или хороших привычек говорят 자주 или -곤 하다.","일쑤 — существительное, поэтому предложение заканчивается на 일쑤이다 (일쑤예요). 가 в -기가 일쑤다 можно опустить."]},"g5-5":{"meaning":"Что касается ...; делать ... (это ...). Действие берётся как тема, и о нём даётся оценка или объяснение, чаще всего что это трудно.","use":"Основа глагола + -기란, сокращение от -기라는 것은 (= -는 것은). Далее следует оценка или объяснение: 쉽지 않다, 어렵다, 힘들다, 보통 일이 아니다, 하늘의 별 따기이다. Типично для эссе, колонок и рассуждений, где читатель ждёт мысли о трудности действия. Используйте простую основу глагола, не ставьте -았/었- или -겠- перед 기란. Для существительных есть форма N(이)란 (사랑이란 ...). Нейтральное сказуемое вроде '좋다' звучит странно.","ex":["Завести новых друзей в чужой стране нелегко.","Найти жильё в Сеуле сейчас почти невозможно («достать звезду с неба»).","Продолжать работать после рождения ребёнка не так просто, как кажется."],"notes":["-기란 — сокращение от -기라는 것은. Дальше обычно идёт выражение трудности: 쉽지 않다, 어렵다, 힘들다, 보통 일이 아니다.","К существительным добавляют -(이)란 (사랑이란), к глаголам — -기란. -기는 похоже, но часто выражает уступку ('하기는 하지만 ...'), так что это не одно и то же."]},"g6-1":{"meaning":"Допустим, что ...; предположим, что ... верно (для спора). Говорящий признаёт довод, а затем возражает или указывает на проблему.","use":"Это окончание косвенной речи -다고 + 치다 («считать»): прилагательное -다고 치다, глагол -(ㄴ/는)다고 치다, существительное (이)라고 치다, прошедшее -았/었다고 치다. Типичные формы: -다고 치자 (допустим), -다고 쳐도 / -다고 치더라도 (даже если допустить), далее 그래도, 하지만, 그런데 или возражающая, отрицательная часть. Говорящий не вполне верит в посылку, и этим оборот отличается от обычного условного -(ㄴ/는)다면. Используется в дискуссиях, спорах и жалобах.","ex":["Допустим, раннее обучение за границей помогает в иностранном языке. Но нормально ли, что маленький ребёнок живёт отдельно от семьи?","Даже если считать, что зарплата высокая, долго не проработаешь, если работа слишком тяжёлая.","Даже если ты прав, извиниться первым всё равно нужно."],"notes":["Очень частый приём — закончить предложение на -다고 치자 и возразить в следующем словами 그래도 или 하지만.","-(ㄴ/는)다면 предполагает реально возможное условие, а -다고 치다 лишь на время принимает довод, не веря в него до конца."]},"g6-2":{"meaning":"Если ..., то, может быть, (я бы понял), но в остальных случаях нет. Допускается маловероятное исключительное условие, а затем следует настоящий вывод — отрицательный или сомневающийся: «разве что ..., а так — нет».","use":"К основе присоединяется -(ㄴ/는)다면 или краткая форма -(으)면 + 몰라도: 어린아이라면 몰라도 (ребёнку ещё простительно), 눈이 많이 온다면 몰라도 (разве что пойдёт сильный снег), 특별한 이유가 있다면 몰라도. Прошедшее — -았/었다면 몰라도, существительное — N(이)라면 몰라도. Вторая часть отрицательная или сомневающаяся: -(으)ㄹ 수 없다, -기 어렵다, 안 되다, -지 않다. Первая часть — исключение, которое говорящий считает маловероятным: «только в таком случае, а в обычном — нет». Не путайте с -(으)ㄴ/는지 몰라도 («не знаю, ли»).","ex":["Маленькому ребёнку ещё простительно, но когда такое говорит взрослый, это неловко.","Разве что выиграешь в лотерею, а на одну зарплату квартиру купить трудно.","С едва знакомым человеком ещё куда ни шло, но даже со старым другом так разговаривать не нужно."],"notes":["Вторая часть должна быть отрицательной или сомневающейся. Положительный вывод после -다면 몰라도 звучит неестественно.","Можно сократить до -(으)면 몰라도: '한두 번이면 몰라도 매번 이러면 곤란해요' (раз-два ещё ничего, но если так каждый раз — это проблема)."]},"g6-3":{"meaning":"В то время как ...; в условиях ...; на фоне .... Задаёт фоновую ситуацию (новостной стиль), в которой происходит главное событие.","use":"К прилагательным добавляется -(으)ㄴ, к глаголам настоящего времени — -는, к глаголам прошедшего или завершённого — -(으)ㄴ / -던, к существительным — 인, затем 가운데: 어려운 가운데, 지켜보는 가운데, 마친 가운데, 학생인 가운데. Первая часть — продолжающаяся ситуация или атмосфера (관심이 쏠리는, 비가 오는, 어려운), вторая — главное событие (열렸다, 발표했다). Типично для новостей, отчётов и речей. Не используется для двух одновременных действий одного человека (для этого -(으)면서). 가운데에도 значит «даже в условиях ...». N 가운데 («среди N / посередине») — другое употребление.","ex":["Новая политика была объявлена на глазах у множества горожан.","Даже в тяжёлой экономической ситуации решили увеличить пособия при рождении ребёнка.","Марафон прошёл под дождём."],"notes":["Не используйте для двух одновременных действий одного человека; для этого есть -(으)면서: '음악을 들으면서 걸어요'.","'N 가운데' также значит «среди N» или «середина»; '그런 가운데' — «в этих условиях, тем временем»."]},"g6-4":{"meaning":"Это равносильно ...; всё равно что ...; по сути ...; можно сказать, что .... Говорящий смотрит на факты и делает вывод, что результат в основном такой же, как и что-то другое.","use":"К глаголам настоящего времени добавляется -는, к глаголам завершённого действия и прилагательным — -(으)ㄴ, к существительным — 인, затем 셈이다: 받는 셈이다, 끝낸 셈이다, 싼 셈이다, 가족인 셈이다. Часто идёт после 사실상, 결국, 거의 или числа/сравнения (십 년을 살았으니 ...). 셈 значит «подсчёт», поэтому предложение подводит итог фактам. Не путайте с -(으)ㄹ 셈이다, которое значит «намереваться» (갈 셈이다 = собираюсь пойти) — это другая грамматика.","ex":["Эту сумку я купил на распродаже, так что фактически получил её за полцены.","Я прожил в Корее десять лет, так что я практически кореец.","Отчёт почти написан, так что работа, считай, закончена."],"notes":["-(으)ㄹ 셈이다 значит «намереваться» и является совсем другой грамматикой: '내일은 일찍 일어날 셈이에요' (я собираюсь завтра рано встать).","'-(으)ㄴ 셈 치고' значит «считая, что ...»: '속은 셈 치고 한번 해 보세요' (считайте, что вас обманули, и попробуйте один раз)."]},"g7-1":{"meaning":"Говорящий вспоминает то, что сам видел раньше (обычно действие или состояние другого человека), и связывает это с последующим действием, изменением состояния или результатом: «...и потом...».","use":"Присоединяется к основе глагола или прилагательного (прошедшее -았/었더니; с существительным N(이)더니). Первая часть — то, что говорящий наблюдал раньше, подлежащее обычно третье лицо (или погода); вторая часть — то, что последовало: действие, перемена или результат. Подлежащее в обеих частях обычно одно и то же. Если за собственным действием следует результат, который вы обнаружили, используйте -았/었더니. Частое слово: 그러더니 («и затем»). Типичная ошибка: использовать -더니, когда подлежащее первой части — «я».","ex":["Минсу обеими руками подал учителю подарок, а затем поклонился в знак приветствия.","До вчерашнего дня было жарко, а сегодня вдруг похолодало.","Когда я заговорил жестами в незнакомой стране, люди сразу поняли."],"notes":["-더니 относится к тому, что вы видели у других. Если после вашего собственного действия появился результат, используйте -았/었더니: 약을 먹었더니 열이 내렸어요 (я принял лекарство, и температура спала). Нельзя говорить «я» + 약을 먹더니.","Можно использовать и для контраста при одном подлежащем (вчера шёл дождь, а сегодня ясно). 그러더니 = «и затем»."]},"g7-2":{"meaning":"«Как вы видите / знаете / слышали...». Сначала называется факт, который слушающий тоже видит, знает или слышал, а затем следует основная мысль.","use":"Присоединяется к основе глаголов видеть, знать, слышать: 보다, 알다, 듣다, 느끼다, 말하다, 예상하다 → 보시다시피, 아시다시피, 들으셨다시피. О том, что уже было сказано, используется прошедшее -았/었다시피 (말씀드렸다시피). Обычно стоит в начале предложения и звучит довольно официально: в докладах, презентациях, объявлениях. Ошибки: использовать для новой информации, которой слушающий ещё не знает, или присоединять к глаголам, не связанным с восприятием и знанием.","ex":["Как вы видите, в Корее старшим передают вещи обеими руками.","Как вы знаете, способы приветствия в каждой стране разные.","Как я говорил на прошлом занятии, завтра у нас презентация о языке тела."],"notes":["-다시피 присоединяется к глаголам видеть/знать/слышать и говорит о том, что слушающему уже известно. Для новой информации оно не используется.","Не путайте с -다시피 하다 «почти...»: 밤을 새우다시피 했어요 (почти не спал всю ночь) — это другая грамматика."]},"g7-3":{"meaning":"-아/어야지 = «надо же ~ / нужно ~» (напоминание, решение себе или лёгкий упрёк); -아/어서는 안 된다 = «нельзя ~ / не следует ~».","use":"-아/어야지(요) присоединяется к основе глагола или прилагательного и говорит, что так нужно поступать. Собеседнику это звучит как напоминание или мягкий упрёк, а самому себе — как решение (내일부터 운동해야지). -아/어서는 안 된다 — более сильный и официальный запрет, чем -(으)면 안 되다, типичный для правил, этикета и морали. Две формы часто идут парой: «надо делать A, нельзя делать B». В вежливой форме пишется 안 돼요 (не 안 되요).","ex":["Приветствуя старших, конечно, нужно склонять голову.","Перед старшими нельзя сидеть, закинув ногу на ногу.","Нужно уважать культуру других стран, а не презирать её."],"notes":["-아/어서는 안 된다 сильнее и официальнее, чем -(으)면 안 되다; часто используется для этикета, правил и морали. Вежливая форма — 안 돼요, а не 안 되요.","Если предложение просто заканчивается на -아/어야지, то собеседнику это «ну конечно, нужно», а в разговоре с самим собой — решение «я должен ~»."]},"g7-4":{"meaning":"Называние и цитирование: назвать кого-то или что-то N (N(이)라고 부르다/하다/말하다); N 하고 — прямая цитата слова или звука.","use":"После существительного с патчимом — N이라고, без патчима — N라고, затем обычно 부르다, 하다 или 말하다. Показывает, как кого-то или что-то называют: имя, обращение, термин. N 하고 — прямая цитата слова или звука; ставится после слова в кавычках и пишется через пробел: '엄마!' 하고 소리치다. Этот 하고 — не тот, что значит «и / с».","ex":["В Корее старших по учёбе или работе называют '선배님'.","Друзья зовут меня '대니'.","Ребёнок с криком «Мама!» подбежал."],"notes":["После патчима — 이라고, после гласной — 라고. Этот 하고 не значит «и / с»: он идёт после процитированного слова или звука и пишется через пробел.","Для названий и терминов часто используется с 하다/부르다: 이것을 한국어로 '손짓'이라고 해요 (по-корейски это называется '손짓')."]},"g7-5":{"meaning":"«N — это ... / то, что называется N, ...». N берётся как тема, чтобы дать его определение или общее суждение о нём.","use":"После существительного с патчимом — N이란, без патчима — N란; это сокращение от N(이)라는 것은, и дальше следует объяснение N. Предложение обычно заканчивается на ~(이)다, ~는 것이다 или ~(이)라고 할 수 있다. Типично для текстов, презентаций и объяснений на занятиях. Не используется для конкретного человека или события.","ex":["Язык тела — это способ передавать чувства телом вместо слов.","Обращение (호칭) — это слово, которым называют человека.","Вежливость исходит из уважения к собеседнику."],"notes":["N(이)란 используется для определения или общего суждения, а не для конкретного человека или события (민수 씨란 학생이에요 — ошибка, нужно 민수 씨는 학생이에요).","Часто встречается в текстах, докладах, на занятиях. Предложение обычно кончается на ~(이)다, ~는 것이다, ~(이)라고 할 수 있다; может открывать вопрос: 사랑이란? («Что такое любовь?»)."]},"g8-1":{"meaning":"Выражает удивление, восхищение или то, что говорящий только что заметил (здесь — то, что замечаешь на картине).","use":"Присоединяется к основе глагола или прилагательного (прошедшее -았/었네요, предположение -겠네요, существительное N(이)네요). Используется только для того, что вы только что увидели, услышали или поняли; важно именно ощущение «замечаю сейчас». Мягкий разговорный способ прокомментировать увиденное или отреагировать на слова собеседника. Ошибки: употреблять для давно известного или для собственных планов.","ex":["Какие яркие цвета у этой картины!","Смотрите, все дети на картине смеются.","Ого, эта картина написана четыреста лет назад!"],"notes":["-네요 — для того, что вы только что заметили. Не для давно известного и не для своих планов: 내일 가네요 не значит «завтра я поеду».","Мягкий способ выразить удивление или восхищение; описывая картину, говорите о том, что бросается в глаза: 강아지가 있네요 («Тут щенок!»). Разговорнее, чем -군요."]},"g8-2":{"meaning":"N치고 + отрицание: «нет такого N, который бы не ~» (без исключений); N치고는: «для N ~» (вопреки ожиданиям).","use":"치고 и 치고는 присоединяются прямо к существительному, патчим не играет роли. N치고 значит «в этой группе практически все такие» и обычно сопровождается отрицанием (없다, -지 않다, 못하다); в итоге получается сильное утверждение. N치고는 берёт N как мерило и сообщает результат, отличающийся от того, что ожидают от этой группы, например «для новичка рисует очень хорошо».","ex":["Нет такого художника, у которого не было бы богатой чувствительности.","Для человека, который в Корее всего три месяца, он очень хорошо говорит по-корейски.","Едва ли найдётся кореец, который не ест кимчи."],"notes":["После N치고는 идёт то, что отличается от ожидаемого для N (новичок рисует хорошо; тепло для зимы). После N치고 часто стоит отрицание, например 없다, и смысл — «без исключения».","В разговоре 치고는 часто сокращают до 치곤: 겨울치곤 따뜻해요 («для зимы тепло»)."]},"g8-3":{"meaning":"Двойное отрицание: два отрицания подряд дают более сильное утверждение. «Это может быть только N / не могу не ~ / нельзя не ~ (= необходимо ~) / нет ничего, чего нельзя ~».","use":"Четыре частые конструкции: N이/가 아닐 수 없다 («это не может быть ничем, кроме N»); V-지 않을 수(가) 없다 («не могу не ~»); V-지 않으면 안 되다 («необходимо ~»); V-(으)ㄹ 수 없는 것이 없다 («нет ничего, чего нельзя ~», то есть можно всё). Звучат сильно и официально, типичны для текстов, рецензий, докладов; в повседневной речи естественнее 꼭 ~아/어야 해요. Два отрицания дают утверждение, поэтому не читайте их буквально как «нельзя».","ex":["Эта картина, несомненно, шедевр корейской жанровой живописи.","Увидев такую красивую картину, невозможно не растрогаться.","Во время арт-терапии нужно рисовать каждый день."],"notes":["Двойное отрицание часто встречается в официальной речи и текстах: эссе, рецензиях, докладах. В повседневной речи естественнее 꼭 ~아/어야 해요. Два отрицания вместе дают утверждение.","-지 않을 수 없다 ≈ «не могу не ~, приходится ~»; -지 않으면 안 되다 ≈ «необходимо ~». В вежливой форме пишется 안 돼요."]},"g8-4":{"meaning":"«В ~ / для ~». -는 데 превращает глагол в именную группу (дело или ситуация «делать ~»), после которой идут слова вроде 도움이 되다, 필요하다, 시간이 걸리다, 자신이 있다.","use":"Присоединяется к основе глагола (у глаголов на ㄹ эта буква выпадает: 만들다 → 만드는 데). 데 здесь — зависимое существительное («дело, случай»), поэтому пишется через пробел и может принимать частицу 에: 하는 데(에). Типичные сочетания: 도움이 되다/주다, 필요하다, 시간이 걸리다, 돈이 들다, 좋다, 효과가 있다, 자신이 있다, 익숙하다, 서투르다. Не путайте с соединительным окончанием -는데 (пишется слитно, «но / и»).","ex":["Арт-терапия помогает успокоить душу.","Говорят, на завершение этой большой картины ушло четыре года.","Я уверен в себе, когда объясняю картины."],"notes":["В -는 데 слово 데 пишется отдельно. Слитное -는데 — окончание, соединяющее предложения («..., но / и ...»); это другая грамматика.","После -는 데 обычно идут устойчивые выражения: 도움이 되다, 필요하다, 시간이 걸리다, 돈이 들다, 자신이 있다, 효과가 있다. Удобно учить их целыми блоками."]}},"vi":{"g1-1":{"meaning":"Một việc suýt xảy ra nhưng cuối cùng đã không xảy ra. Dùng cho tình huống 'suýt nữa', thường là chuyện không hay.","use":"Thân từ kết thúc bằng nguyên âm thêm -ㄹ, kết thúc bằng phụ âm thêm -을 (넘어지다 → 넘어질, 먹다 → 먹을; thân từ có ㄹ giữ nguyên ㄹ: 울다 → 울), rồi thêm 뻔했다. Vì việc đó thật ra không xảy ra nên hầu như luôn dùng thì quá khứ (뻔했어요 / 뻔했다). Hay đi với động từ chỉ tai nạn hoặc tình huống xấu hổ (넘어지다, 늦다, 울다, 놓치다). Thêm 하마터면 ('suýt nữa') ở đầu câu làm ý nghĩa mạnh hơn. Lỗi thường gặp: dùng cho việc đã xảy ra thật, hoặc dùng thì hiện tại (넘어질 뻔해요).","ex":["Hôm trời mưa, tôi trượt chân trên cầu thang và suýt ngã.","Tôi không đặt vé xem phim trước nên suýt không xem được phim.","Đoạn kết cảm động đến mức tôi suýt khóc trong rạp."],"notes":["Vì việc đó không xảy ra nên thường dùng quá khứ -(으)ㄹ 뻔했다. Dạng hiện tại như 넘어질 뻔해요 nghe sai.","Thêm 하마터면 ('suýt nữa') phía trước làm cảm giác 'suýt gặp chuyện' mạnh hơn. Chủ yếu dùng cho chuyện xấu, nhưng cũng có thể chỉ cơ hội bị lỡ (우승할 뻔했어요 'suýt vô địch')."]},"g1-2":{"meaning":"Có lẽ vì ~. Người nói đưa ra một lý do chỉ là phỏng đoán, không chắc chắn, rồi nói kết quả mình nhận thấy.","use":"Lấy dạng -아/어서 thông thường (좋아서, 먹어서, 피곤해서; danh từ dùng 이라서/라서) rồi thêm 그런지, sau đó nói kết quả đã nhận thấy. Lý do chỉ là phỏng đoán; nếu chắc chắn thì dùng -아/어서 bình thường. Vế sau là câu kể về điều mình cảm thấy hoặc nhận thấy (졸리다, 사람이 많다), không phải mệnh lệnh hay đề nghị. Hay đi với 오늘따라 hoặc 왠지. Lỗi thường gặp: dùng cho lý do đã chắc chắn, hoặc kết thúc bằng câu mệnh lệnh.","ex":["Có lẽ vì hôm qua tôi ngủ muộn nên hôm nay buồn ngủ cả ngày.","Có lẽ vì là cuối tuần nên rạp chiếu phim đông người thật đấy.","Có lẽ vì bài hát hay nên video hát nhép đang được yêu thích."],"notes":["Sau 그런지 hãy nói điều mình nhận thấy, không dùng mệnh lệnh hay câu rủ rê. (✗ 피곤해서 그런지 일찍 주무세요)","Nếu lý do chắc chắn thì dùng -아/어서 hoặc -(으)니까. 그런지 mang cảm giác 'có lẽ vì thế chăng?'."]},"g1-3":{"meaning":"Càng ~ càng ~. Khi mức độ của việc thứ nhất tăng lên thì việc thứ hai cũng tăng (hoặc thay đổi) theo.","use":"Thân từ kết thúc bằng nguyên âm hoặc ㄹ thêm -ㄹ수록 (보다 → 볼수록, 만들다 → 만들수록), thân kết thúc bằng phụ âm thêm -을수록 (먹다 → 먹을수록, 좋다 → 좋을수록). -(으)면 phía trước có thể có hoặc không, chỉ để nhấn mạnh, và lặp lại cùng một động từ (보면 볼수록, 알면 알수록). Vế sau hay có 더 ('hơn nữa'). Không dùng -았/었- trước -(으)ㄹ수록. Lỗi thường gặp: gắn -았/었- vào vế đầu, hoặc dùng cho việc chỉ xảy ra một lần.","ex":["Bộ phim này càng xem càng có sức hút.","Hát nhép càng luyện càng giỏi.","Càng đọc lời bài hát càng thấy ý nghĩa sâu sắc."],"notes":["Không đặt -았/었- trước -(으)ㄹ수록 (✗ 많았을수록). Cũng không dùng cho việc chỉ xảy ra một lần.","Vế sau hay có '더': 알수록 더 재미있어요. Lặp lại cùng động từ như 보면 볼수록 sẽ nhấn mạnh hơn."]},"g1-4":{"meaning":"Thay vì ~ (đúng hơn là ~). Gác việc hoặc cách miêu tả đầu lại để chọn cái tốt hơn hoặc chính xác hơn.","use":"Gắn -기보다 trực tiếp vào thân động từ (쉬다 → 쉬기보다, 사다 → 사기보다); 는 thêm sắc thái đối lập. Tính từ cũng dùng được (슬프기보다). Vế sau nêu điều người nói thích hơn hoặc cách miêu tả chính xác hơn, thường đi với -는 편이다, -는 게 낫다/좋다 hoặc 오히려 ('ngược lại'). Lỗi thường gặp: thêm thì quá khứ vào 기 (✗ 쉬었기보다), hoặc so sánh hai thứ không liên quan.","ex":["Cuối tuần tôi thích gặp bạn bè hơn là nghỉ ở nhà.","Bộ phim này đúng hơn là một câu chuyện ấm áp chứ không buồn.","Trước kỳ thi, hiểu bài quan trọng hơn là chỉ học thuộc đề."],"notes":["Thường lựa chọn tốt hơn hoặc chính xác hơn đứng sau. Không thêm -았/었- vào -기보다 (✗ 쉬었기보다).","Đi với 오히려 hoặc -는 편이다 nghe tự nhiên: 슬프기보다 오히려 따뜻한 이야기예요. Với danh từ dùng 'N보다는'."]},"g1-5":{"meaning":"Một khi ~ / đã ~ thì đương nhiên ~. Vế đầu là sự thật đã định, vế sau nói kết quả đương nhiên hoặc việc phải làm.","use":"Động từ dùng -는 이상, tính từ và hành động đã hoàn thành dùng -(으)ㄴ 이상 (약속한 이상), danh từ dùng 인 이상. Vế sau diễn tả nghĩa vụ, quyết tâm hoặc kết luận đương nhiên (-아/어야 하다, -(으)ㄹ 수밖에 없다, -겠다), không phải sự việc thông thường. So với -(으)니까 thì chắc chắn và trang trọng hơn. Lỗi thường gặp: kết thúc bằng một sự việc quá khứ thông thường (✗ 약속한 이상 갔어요).","ex":["Một khi đã sống ở Hàn Quốc thì phải chăm chỉ học tiếng Hàn.","Đã hứa rồi thì dù mưa cũng phải đi chứ.","Một khi đã quyết định rồi thì giờ không thể thay đổi được nữa."],"notes":["Vế sau nên là nghĩa vụ, quyết tâm hoặc kết quả đương nhiên. Kết thúc bằng sự việc quá khứ thông thường nghe gượng (✗ 약속한 이상 갔어요).","-(으)니까 là 'vì' nhẹ nhàng, còn -는 이상 mang cảm giác chắc chắn 'đã thế rồi thì không còn cách nào', hợp với văn nói và viết trang trọng."]},"g2-1":{"meaning":"Làm gì có chuyện ~. Người nói tin chắc rằng việc đó không thể đúng hoặc không thể xảy ra.","use":"Thêm -(으)ㄹ vào thân từ (가다 → 갈, 먹다 → 먹을, 살다 → 살) rồi thêm 리가 없다; quá khứ dùng -았/었을 리가 없다; danh từ dùng 일 리가 없다. 리 là danh từ nghĩa là 'lý do / khả năng' nên cũng có 리는 없다 và 리(가) 있어요? ('làm sao có thể?'). Đây là niềm tin mạnh của người nói dựa trên hiểu biết về người hoặc tình huống, không phải sự thật đã kiểm chứng. Lỗi thường gặp: dùng cho kế hoạch của chính mình hoặc đi với câu mệnh lệnh.","ex":["Làm gì có chuyện anh ấy nói dối. Tôi quen anh ấy lâu rồi.","Làm gì có chuyện chú ếch xanh nghe lời mẹ. Nó lúc nào cũng làm ngược lại mà.","Đến hôm qua vẫn còn khỏe mạnh, làm gì có chuyện đột nhiên bị bệnh."],"notes":["Với danh từ dùng '일 리가 없다' (✗ 거짓말 리가 없다 → ○ 거짓말일 리가 없다). Việc đã xảy ra thì dùng -았/었을 리가 없다.","Trong hội thoại hay dùng như câu hỏi tu từ '리가 있어요?' ('làm sao có thể?') hoặc '-ㄹ 리가 없는데…'."]},"g2-2":{"meaning":"Vì có chuyện bất ngờ xảy ra nên dẫn đến kết quả (thường là không tốt). Toàn bộ tình huống đã là quá khứ.","use":"Gắn -는 바람에 vào thân động từ (넘어지다 → 넘어지는 바람에, 오다 → 오는 바람에). Thì chỉ thể hiện ở cuối câu nên vế đầu giữ -는 dù là chuyện quá khứ (✗ 비가 왔는 바람에). Nguyên nhân là việc bất ngờ mà người nói không chủ ý, kết quả thường tiêu cực (늦다, 못 하다, 놓치다, 망치다). Vế sau không dùng mệnh lệnh hay đề nghị. Không dùng với tính từ. Lỗi thường gặp: dùng -았/었는 바람에, hoặc lấy hành động có chủ ý làm nguyên nhân.","ex":["Trời đột nhiên mưa nên chúng tôi không đi dã ngoại được.","Em tôi làm vỡ cái cốc nên sàn nhà ngập nước.","Điện thoại hết pin nên tôi không quay xong video hát nhép."],"notes":["Chỉ dùng thì ở cuối câu (✗ 비가 왔는 바람에 → ○ 비가 오는 바람에 소풍을 못 갔어요). Phía sau không dùng mệnh lệnh hay đề nghị.","-는 바람에 mang cảm giác 'xui xẻo nên ra thế này'. Kết quả tốt thì dùng -덕분에, lý do bình thường thì dùng -아/어서."]},"g2-3":{"meaning":"Giả vờ ~. Chủ ngữ hành động như thể điều gì đó là thật trong khi không phải vậy.","use":"Động từ dùng -는 척하다 (자다 → 자는 척하다; 알다 → 아는 척하다, 모르다 → 모르는 척하다), tính từ dùng -(으)ㄴ 척하다 (아프다 → 아픈 척하다), danh từ dùng N인 척하다. Giả vờ như đã làm xong thì dùng V-(으)ㄴ 척하다 (이미 먹은 척하다). Thì của cả câu đặt ở 하다 (척했다). -는 체하다 có nghĩa giống nhau, 척 mang tính khẩu ngữ hơn. Lỗi thường gặp: dùng -는 với tính từ (✗ 아프는 척하다).","ex":["Em tôi giả vờ bị ốm nên không đi học.","Minsu biết chuyện đó mà vẫn giả vờ không biết.","Chú ếch xanh giả vờ nghe lời mẹ rồi lại làm ngược lại."],"notes":["알다, 모르다, 있다, 없다 dùng -는 척 (아는 척, 모르는 척, 있는 척). Chỉ tính từ mới dùng -(으)ㄴ 척 (아픈 척, 괜찮은 척).","Vì là giả vờ điều không thật nên có thể hơi tiêu cực. -는 체하다 nghĩa giống nhau; 척 khẩu ngữ hơn."]},"g2-4":{"meaning":"Làm việc gì đó qua loa, đến mức khó nói là đã làm hay chưa.","use":"Gắn -는 둥 마는 둥 vào thân động từ, dùng cùng một động từ ở cả hai vế (먹다 → 먹는 둥 마는 둥, 듣다 → 듣는 둥 마는 둥), rồi thêm 하다 hoặc động từ khác: 먹는 둥 마는 둥 하고 나왔어요. Thường dùng ở quá khứ, diễn tả sự thiếu tập trung hoặc làm qua loa vì buồn ngủ, vội hoặc lo lắng. Động từ thường gặp: 먹다, 듣다, 자다, 하다, 보다. Lỗi thường gặp: dùng hai động từ khác nhau (đó là mẫu khác -는 둥 -는 둥), hoặc dùng với tính từ.","ex":["Sáng nay muộn nên tôi ăn qua loa rồi đi ra.","Buồn ngủ quá nên tôi nghe giảng cho có.","Lo lắng quá nên đêm qua tôi gần như không ngủ."],"notes":["Phải lặp lại cùng một động từ: 듣는 둥 마는 둥. Dùng hai động từ khác nhau sẽ thành mẫu khác (-는 둥 -는 둥).","마는 xuất phát từ 말다 ('dừng'). Mang cảm giác không hài lòng vì làm không đàng hoàng nên thường đi kèm lý do (졸려서, 바빠서)."]},"g2-5":{"meaning":"Đuôi câu kể chuyện (rút gọn từ -다고 합니다). Truyền đạt điều nghe được một cách ấm áp, thú vị, như trong truyện dân gian hoặc khi nói với trẻ em và người nghe.","use":"Dạng: tính từ -답니다, động từ không có patchim -ㄴ답니다, có patchim -는답니다 (động từ kết thúc ㄹ bỏ ㄹ: 살다 → 산답니다), danh từ (이)랍니다, quá khứ -았/었답니다. Dùng trong truyện cổ tích và khi giải thích điều thú vị cho người nghe (cha mẹ, hướng dẫn viên, phát thanh viên). Nghe ấm áp và hơi tinh nghịch nên không dùng để tường thuật trung lập. Nói trực tiếp với trẻ em dùng -단다/-란다. Lỗi thường gặp: dùng cho ý kiến hoặc trải nghiệm trực tiếp của người nói.","ex":["Ngày xửa ngày xưa, có Heungbu hiền lành và Nolbu tham lam sống ở đó.","Hai anh em bay lên trời và trở thành Mặt Trời và Mặt Trăng.","Ở ngôi làng đó, đến nay vẫn còn truyền lại câu chuyện về chú ếch xanh."],"notes":["Động từ không patchim dùng -ㄴ답니다 (간답니다), có patchim dùng -는답니다 (먹는답니다), tính từ dùng -답니다 (착하답니다), 이다 thành (이)랍니다. Động từ kết thúc ㄹ bỏ ㄹ (산답니다).","Nói trực tiếp với trẻ em dùng -단다/-란다: 옛날에 호랑이가 살았단다. Hay xuất hiện ở những câu cuối của truyện thiếu nhi."]},"g3-1":{"meaning":"Phỏng đoán nhẹ nhàng: tôi nghĩ ~ / chắc là ~. Hay dùng để nhẹ nhàng đính chính hoặc không đồng ý với điều người nghe nói hoặc nghĩ.","use":"Thân từ kết thúc bằng nguyên âm hoặc ㄹ thêm -ㄹ걸요, kết thúc bằng phụ âm thêm -을걸요; quá khứ -았/었을걸요; danh từ 일걸요. Với bạn thân có thể bỏ 요 (-(으)ㄹ걸). Đây là khẩu ngữ, chỉ để phỏng đoán, không dùng cho sự thật đã xác nhận hay kế hoạch của chính mình. Hay dùng để đáp lại giả định của người khác (아니에요, ~ -(으)ㄹ걸요) và nghe mềm hơn khi thêm 아마. Lỗi thường gặp: dùng trong văn viết trang trọng, dùng cho kế hoạch của mình (✗ 저는 내일 갈걸요), hoặc dùng trong câu hỏi.","ex":["Nếu xuất phát bây giờ thì đường chắc sẽ rất tắc.","Bộ phim đó chắc đã hết rồi. Bây giờ đi cũng không xem được đâu.","Cô Kim bây giờ chắc không ở văn phòng."],"notes":["-(으)ㄹ걸요 chỉ là phỏng đoán nên không dùng cho kế hoạch của mình. Ngoài ra, '-(으)ㄹ걸 그랬다' là mẫu khác diễn tả sự hối tiếc.","Có thể nhẹ nhàng phản đối bằng 'Không đâu, 주말이라서 사람이 많을걸요' ('cuối tuần chắc đông lắm'). Thêm 아마 nghe mềm hơn."]},"g3-2":{"meaning":"Không phải cứ ~ là ~. Vế đầu là suy nghĩ phổ biến, vế sau phủ nhận kết luận mặc nhiên đó.","use":"Tạo dạng trích dẫn -다고 해서 (tính từ -다고, động từ -ㄴ/는다고, danh từ (이)라고; quá khứ -았/었다고) và kết thúc bằng -(으)ㄴ/는 것은 아니다 (khẩu ngữ 건 아니에요). Vế đầu là giả định chung (비싸다고 해서 ...), phần cuối nghĩa là 'không nhất thiết', không phải 'chắc chắn không'. Có thể bỏ 해서. Thêm 반드시 / 꼭 / 항상 / 다 nghe tự nhiên. Lỗi thường gặp: hiểu là phủ định hoàn toàn, hoặc đặt ở vế đầu một quy tắc không ai tin.","ex":["Giá đắt không nhất thiết là chất lượng tốt.","Thông tin trên mạng không phải cái nào cũng đúng.","Hát hay không có nghĩa là hát nhép cũng giỏi."],"notes":["Kết thúc bằng '-(으)ㄴ/는 것은 아니다' (khẩu ngữ '-는 건 아니에요'). Đây không phải phủ định hoàn toàn mà là 'không nhất thiết như vậy'.","Danh từ dùng N(이)라고 해서, quá khứ dùng -았/었다고 해서. Có thể bỏ 해서 thành '-다고 -는 건 아니다'."]},"g3-3":{"meaning":"Làm sẵn việc gì đó trước và giữ nguyên kết quả để dùng về sau.","use":"Thân từ có nguyên âm cuối ㅏ/ㅗ thêm -아 두다, còn lại thêm -어 두다 (사다 → 사 두다, 적다 → 적어 두다, 준비하다 → 준비해 두다). Dùng khi chuẩn bị trước (예매해 두다) hoặc để nguyên trạng thái (창문을 열어 두다 'để cửa sổ mở'). Cần động từ có kết quả còn lại: 사다, 적다, 켜다, 열다, 예약하다. Không dùng với động từ không để lại kết quả hoặc với tính từ (✗ 학교에 가 두다). 두었다 thường rút gọn thành 뒀다. Gần giống -아/어 놓다 nhưng cái đó khẩu ngữ hơn.","ex":["Trước kỳ thi, hãy ghi những từ quan trọng vào vở.","Tôi đã đặt trước vé xem phim.","Tôi để đèn sáng cho đến khi bạn đến."],"notes":["Chỉ dùng cho hành động có kết quả còn lại. Không dùng với từ chỉ di chuyển hay trạng thái (✗ 학교에 가 두다, ✗ 예뻐 두다).","Gần giống -아/어 놓다. Có hai nghĩa: 'chuẩn bị trước' và 'để nguyên như vậy'; quá khứ 두었다 thường rút thành 뒀다."]},"g3-4":{"meaning":"Tùy theo việc ~ / ~ như thế nào. Kết quả ở vế sau khác nhau tùy theo nội dung vế đầu.","use":"Động từ gắn -느냐에 따라 (먹느냐에 따라), tính từ gắn -(으)냐에 따라 (크냐에 따라, 어려우냐에 따라), danh từ gắn (이)냐에 따라. Hợp với từ nghi vấn (누가, 어떻게, 얼마나, 무엇을). Vế sau nói rằng có sự khác biệt hoặc thay đổi: 달라지다, 다르다, 바뀌다, 결정되다. Có thể bỏ 서. Lỗi thường gặp: dùng -(으)면 'nếu', hoặc kết thúc bằng kết quả cố định khi không có gì thay đổi.","ex":["Ngay cả cùng một bài hát, ai hát thì cảm giác cũng khác.","Khả năng của bộ não có thể khác nhau tùy cách sử dụng.","Trí nhớ có thể thay đổi tùy theo bạn ngủ bao nhiêu."],"notes":["Vế sau cần từ nói rằng kết quả thay đổi như 달라지다/다르다/바뀌다/결정되다. Khi kết quả cố định thì không dùng.","Danh từ có thể dùng dạng ngắn 'N에 따라(서)': 사람에 따라 달라요. Đi với từ nghi vấn (누가, 어떻게, 얼마나) nghe tự nhiên."]},"g3-5":{"meaning":"Cuối cùng cũng làm được việc khó bằng sức của chính mình, vượt qua khó khăn đến cùng.","use":"Thân từ có nguyên âm cuối ㅏ/ㅗ thêm -아 내다, còn lại thêm -어 내다 (참다 → 참아 내다, 이기다 → 이겨 내다, 하다 → 해 내다). Diễn tả việc hoàn thành một việc khó hoặc dài bằng sức mình, nên hợp với động từ chỉ sự chịu đựng và thành tựu (참다, 이기다, 견디다, 찾다, 해결하다, 만들다). Thường dùng ở quá khứ hoặc dạng hoàn thành (참아 냈어요), hay đi với 끝까지 hoặc 드디어. Không dùng với hành động dễ (✗ 밥을 먹어 냈어요) hoặc tính từ.","ex":["Học sinh đó đã chịu đựng buổi tập luyện vất vả đến cùng.","Đội chúng tôi tự giải quyết được vấn đề khó.","Heungbu vượt qua cảnh nghèo và được sống hạnh phúc."],"notes":["Chỉ dùng cho việc có khó khăn và nỗ lực. Dùng cho việc dễ sẽ nghe gượng (✗ 밥을 먹어 냈어요).","Có nhiều cụm cố định: 이겨 내다, 참아 내다, 견뎌 내다, 해 내다, 찾아 내다, 알아 내다. Hợp với 끝까지, 드디어, 결국."]},"g4-1":{"meaning":"Đến mức ...; ... đến nỗi .... Vế trước nêu trạng thái hoặc hành động, vế sau nêu kết quả hay hình ảnh cụ thể cho thấy nó mạnh đến đâu.","use":"Thân từ không có patchim thêm -ㄹ, thân từ có patchim thêm -을 (thân từ kết thúc bằng ㄹ giữ nguyên: 울 정도로); quá khứ dùng -았/었을 정도로. Vế sau thường là kết quả cụ thể hoặc cường điệu (눈물이 날, 믿기 어려울, 숨이 막힐) nên hay gặp khi kể chuyện và than phiền. Cuối câu có thể dùng -(으)ㄹ 정도이다. Lỗi thường gặp: dùng như nguyên nhân ('vì'); 정도로 chỉ mức độ chứ không chỉ lý do, và vế sau không dùng câu mệnh lệnh hay rủ rê.","ex":["Kết quả khảo sát đáng ngạc nhiên đến mức khó tin.","Người Hàn Quốc giàu tình cảm đến mức mời cơm cả người mới gặp lần đầu.","Hôm qua tôi mệt đến mức vừa nằm xuống là ngủ ngay."],"notes":["정도로 chỉ mức độ chứ không chỉ nguyên nhân, nên không thể thay bằng -아/어서 ('vì'). Vế sau cũng ít khi dùng câu mệnh lệnh hay đề nghị.","Cuối câu dùng -(으)ㄹ 정도이다: '눈물이 날 정도예요' (đến mức rơi nước mắt). '죽을 정도로 힘들다' là cách nói cường điệu rất hay dùng."]},"g4-2":{"meaning":"Chỉ làm ... (và không làm gì khác); chỉ toàn ... mà thôi. Người nói nhấn mạnh chỉ có một hành động hoặc trạng thái, thường mang ý phàn nàn hoặc đối lập.","use":"Thêm -기만 vào thân động từ hay tính từ rồi kết thúc bằng 하다 đã chia: 먹기만 해요, 좋기만 하다, 놀기만 했어요. Thường nối sang vế đối lập: 듣기만 하고 말은 안 해요 (chỉ nghe, không nói), 예쁘기만 하고 쓸모가 없어요. So với N만 V: 책만 읽어요 giới hạn đối tượng (chỉ đọc sách), còn 읽기만 하다 giới hạn cả hành động (chỉ đọc, không làm gì khác). Đừng nhầm với -기만 하면 ('hễ cứ ... là ...').","ex":["Trẻ em bây giờ chỉ đi học thêm, không có thời gian chơi với bạn.","Em trai tôi về nhà là chỉ chơi game nên tôi lo lắm.","Nhà hàng đó chỉ đắt thôi, còn đồ ăn thì bình thường."],"notes":["'책만 읽어요' giới hạn đối tượng (chỉ đọc sách); '책을 읽기만 해요' giới hạn hành động (chỉ đọc và không làm gì khác).","Nối vế đối lập bằng -고, -(으)ㄴ/는데 hoặc -지 않다: '보기만 하고 사지는 않아요' (chỉ xem, không mua)."]},"g4-3":{"meaning":"Một cái gì đó / ai đó / đâu đó / một ngày nào đó: sự vật, người, nơi chốn hay thời gian không rõ hoặc không nói cụ thể. 왠지 nghĩa là 'không hiểu sao'.","use":"Đây là từ để hỏi + -인가 ở dạng rút gọn: 무엇인가 → 뭔가 (văn viết 무언가), 누구인가 → 누군가, 어디인가 → 어딘가, 언제인가 → 언젠가, 왜인지 → 왠지. Dùng trong câu khẳng định, đặt ngay trước động từ hoặc tính từ: 뭔가 이상해요 (có gì đó lạ), 누군가 왔어요 (có ai đó đến). Trợ từ có thể lược bỏ: 뭔가를, 누군가가, 어딘가에서. 언젠가 có thể chỉ quá khứ ('có lần') hoặc tương lai ('một ngày nào đó'). 왠지 đi với cảm giác không giải thích được: 왠지 불안해요.","ex":["Dạo này tôi muốn bắt đầu một sở thích mới nào đó.","Tôi nghe có ai đó gọi tên mình nên quay lại nhìn.","Tốt nghiệp xong, một ngày nào đó tôi muốn làm việc ở Hàn Quốc."],"notes":["Cách viết đúng là 왠지 (왜 + 인지); 웬지 là sai. (웬일, 웬만하면 thì dùng 웬.)","'어딘가 이상하다' nghĩa là 'có gì đó lạ lạ': dùng khi tả cảm giác không chỉ ra chính xác được. 뭔가 이상하다 cũng dùng như vậy."]},"g4-4":{"meaning":"Bằng cách ...; thông qua việc ... (văn viết trang trọng). Vế trước là phương tiện hay cách thức để đạt được kết quả ở vế sau.","use":"Thân từ không có patchim thêm -ㅁ, thân từ có patchim thêm -음, rồi thêm 으로써: 하다 → 함으로써, 읽다 → 읽음으로써. Thân từ kết thúc bằng ㄹ thì đổi ㄹ thành ㅁ: 알다 → 앎으로써. Hay gặp trong bài luận, tin tức, bài phát biểu và báo cáo, vế sau thường là kết quả như -(으)ㄹ 수 있다, 높이다, 줄이다, 해결하다. Trong hội thoại dùng -아/어서 hoặc -(으)면. Đừng nhầm 으로써 (phương tiện) với 으로서 (tư cách, như 학생으로서) hay -(으)므로 ('vì').","ex":["Chính phủ định giải quyết vấn đề tỉ lệ sinh thấp bằng cách chi trợ cấp sinh con.","Bằng cách lắng nghe câu chuyện của nhau, chúng ta có thể vun đắp tình cảm (정).","Anh ấy đã lấy lại sức khỏe nhờ tập thể dục mỗi ngày."],"notes":["으로써 chỉ phương tiện (칼로써 자르다, 'cắt bằng dao'); 으로서 chỉ tư cách (학생으로서, 'với tư cách học sinh'). Nhầm lẫn hai từ này là lỗi rất phổ biến.","Đây là cách nói của văn viết trang trọng. Trong hội thoại dùng -아/어서 hoặc -(으)면 tự nhiên hơn: '운동을 해서 건강해졌어요'."]},"g5-1":{"meaning":"Bằng với N; đến mức như N. Cho biết kích thước, số lượng hay mức độ của một thứ ngang với N.","use":"만큼 gắn trực tiếp vào danh từ, không cách: 나만큼, 서울만큼, 아이를 키우는 일만큼. Phần sau thường là tính từ hoặc động từ chỉ mức độ: 나만큼 키가 크다 (cao bằng tôi). Muốn nói 'không bằng' thì dùng phủ định: 나만큼 크지 않다 / 못하다. Sau động từ hay tính từ ở dạng định ngữ, 만큼 là danh từ phụ thuộc, viết cách ra và nghĩa là 'tương xứng với': 노력한 만큼, 먹을 만큼. So sánh: N처럼 (như N, về cách thức), N보다 (hơn N), N만 (chỉ N).","ex":["Hiếm có người nào giàu tình cảm như người Hàn Quốc.","Tôi không hướng nội bằng anh trai.","Không có công việc nào đáng giá bằng việc nuôi dạy con."],"notes":["Sau động từ hoặc tính từ thì viết cách: 노력한 만큼, 먹을 만큼 ('tương xứng với'). Chỉ viết liền khi đứng sau danh từ.","Đừng nhầm với 만 ('chỉ'): 형만 커요 = chỉ anh trai là to; 형만큼 커요 = to bằng anh trai. 보다 ('hơn') chỉ sự khác biệt, còn 만큼 chỉ sự ngang bằng."]},"g5-2":{"meaning":"Sự cần thiết / cơ hội / kế hoạch / dự định (lịch đã định) / khả năng làm .... Động từ ở dạng -(으)ㄹ bổ nghĩa cho danh từ đứng sau.","use":"Thân động từ + -ㄹ/-을 + danh từ, sau đó thường là 이/가 있다·없다 hoặc -이다: 갈 필요가 없다 (không cần đi), 말할 기회가 생겼다, 떠날 계획이다, 출발할 예정입니다, 비가 올 가능성이 높다. 계획 là điều bản thân định làm; 예정 là lịch đã được ấn định, nghe trang trọng (thông báo, tin tức). 가능성 đi với 있다/없다/높다/낮다. 필요 hay dùng phủ định: -(으)ㄹ 필요가 없다 = 'không cần phải ...'. Tính từ cũng đi với 가능성 được (비쌀 가능성).","ex":["Ngay cả giữa các bậc phụ huynh, ý kiến về việc có cần cho con đi du học sớm hay không cũng khác nhau.","Tôi dự định học lên cao học vào năm sau.","Cuối tuần này khả năng có mưa rất cao."],"notes":["계획 là việc mình quyết định làm, còn 예정 là lịch đã được ấn định, nên 예정 hay dùng trong thông báo và tin tức.","-(으)ㄹ 필요가 없다 nghĩa là 'không cần phải ...', gần với -지 않아도 되다. 가능성 đi với 있다, 없다, 높다, 낮다."]},"g5-3":{"meaning":"Như thể muốn nói rằng ...; làm ra vẻ như đang nói '...'. Người ta thể hiện suy nghĩ bằng nét mặt hay cử chỉ mà không nói thành lời.","use":"Cấu tạo từ đuôi câu gián tiếp + 는 듯이: tính từ -다는, động từ -(ㄴ/는)다는, danh từ (이)라는, nghi vấn -(느)냐는, rủ rê -자는, mệnh lệnh -(으)라는. Quá khứ là -았/었다는 듯이, tương lai/phỏng đoán là -(으)ㄹ 거라는 듯이. Vế sau là cử chỉ hay nét mặt của người đó (고개를 끄덕이다, 어깨를 으쓱하다, 쳐다보다, 웃다), thường đi với 마치. Đừng nhầm với -(으)ㄴ/는 듯이 thường ('như thể') không cần trích dẫn: 비가 올 듯이 흐려요.","ex":["Đứa trẻ gật đầu như thể nói rằng đã hiểu hết lời tôi nói.","Anh ấy mỉm cười chào như thể chưa có chuyện gì xảy ra.","Bạn nhìn tôi như thể hỏi 'Sao bây giờ cậu mới đến?'."],"notes":["-다는 듯이 nghĩa là 'hành động như thể đang nói rằng ...', còn -(으)ㄴ/는 듯이 thường chỉ là 'như thể': 비가 올 듯이 흐려요 (trời âm u như sắp mưa).","Thêm 마치 sẽ sinh động hơn: '마치 다 안다는 듯이'. Phần trước 듯이 là lời không nói ra của chính người hành động, viết theo góc nhìn của người đó."]},"g5-4":{"meaning":"(Đáng tiếc là) hay ...; có thói quen ... . Mô tả việc không mong muốn cứ lặp đi lặp lại.","use":"Thân động từ + -기(가) 일쑤이다: 지각하기 일쑤예요, 잃어버리기가 일쑤다. 일쑤 là danh từ nên câu kết thúc bằng -이다 (일쑤예요, 일쑤입니다, 일쑤였어요). Dùng cho thói quen xấu hay phiền toái (đi muộn, quên, làm mất đồ, vấp ngã, bỏ bữa). Với thói quen bình thường thì dùng 자주 hoặc -곤 하다. Có thể bỏ 가. Không dùng cho thói quen tốt.","ex":["Dạo này tôi tăng ca nhiều nên hay bỏ bữa sáng.","Tôi vụng về nên hay làm mất ô.","Hồi nhỏ tôi thường cãi nhau với em vì đồ chơi."],"notes":["Chỉ dùng cho việc không tốt. Thói quen tốt hoặc việc làm thường xuyên bình thường thì dùng 자주 hay -곤 하다.","일쑤 là danh từ nên câu kết thúc bằng 일쑤이다 (일쑤예요). 가 trong -기가 일쑤다 có thể bỏ."]},"g5-5":{"meaning":"Việc ... (thì ...). Lấy một hành động làm chủ đề rồi giải thích hoặc đánh giá nó, thường là nói rằng nó khó.","use":"Thân động từ + -기란, là dạng rút gọn của -기라는 것은 (= -는 것은). Sau đó là lời đánh giá hay giải thích: 쉽지 않다, 어렵다, 힘들다, 보통 일이 아니다, 하늘의 별 따기이다. Điển hình trong bài luận, chuyên mục và những lời suy ngẫm, nơi người đọc mong chờ một nhận định về độ khó của việc đó. Dùng thân động từ nguyên dạng, không thêm -았/었- hay -겠- trước 기란. Với danh từ dùng N(이)란 (사랑이란 ...). Vị ngữ trung tính như '좋다' nghe lạ.","ex":["Kết bạn mới ở nước lạ không hề dễ.","Dạo này tìm nhà ở Seoul khó như hái sao trên trời.","Sinh con rồi vẫn tiếp tục đi làm không dễ như lời nói."],"notes":["-기란 là dạng rút gọn của -기라는 것은. Phía sau thường là cách nói về sự khó khăn như 쉽지 않다, 어렵다, 힘들다, 보통 일이 아니다.","Danh từ dùng -(이)란 (사랑이란), động từ dùng -기란. -기는 trông giống nhưng thường mang nghĩa nhượng bộ ('하기는 하지만 ...') nên không giống nhau."]},"g6-1":{"meaning":"Cứ cho là ...; giả sử ... là đúng (để tranh luận). Người nói thừa nhận một điểm rồi nêu phản bác hoặc vấn đề.","use":"Là đuôi câu gián tiếp -다고 + 치다 ('coi là'): tính từ -다고 치다, động từ -(ㄴ/는)다고 치다, danh từ (이)라고 치다, quá khứ -았/었다고 치다. Các khung thường gặp là -다고 치자 (cứ cho là), -다고 쳐도 / -다고 치더라도 (dù cho là), theo sau là 그래도, 하지만, 그런데 hoặc một vế phản bác, phủ định. Ngư
