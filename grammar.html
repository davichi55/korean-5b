<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Korean 5B — 문법·표현</title>
<meta property="og:title" content="Korean 5B 문법·표현 · Grammar">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="grammar.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-grammar-192.png">
<link rel="icon" href="icon-grammar-192.png">
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:#1c2740; --card2:#223052;
    --line:#2c3a5a; --txt:#eaf0fb; --dim:#96a3c2; --accent:#5b8cff;
    --gold:#ffcf5c; --good:#37d18f; --bad:#ff6b7a; --hl:#ffd98a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.55;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  [lang="zh"]{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
  [lang="zht"]{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
  [lang="th"]{font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif}
  [hidden]{display:none!important}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:5;background:rgba(15,20,32,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px 6px;max-width:860px;margin:0 auto}
  .top>*{min-width:0} #lang{max-width:100%}
  .top h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
  .top h1 small{color:var(--dim);font-weight:400;font-size:13px;margin-left:6px}
  .top .home{color:var(--dim);text-decoration:none;font-size:20px;padding:0 4px}
  select,.pill{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;max-width:860px;margin:0 auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:12px;padding:5px 12px;cursor:pointer;font:inherit;font-size:14px;text-align:left;line-height:1.25}
  .tab small{display:block;font-size:11px}
  .tab.on{background:var(--card2);border-color:var(--accent);color:var(--txt)}
  main{max-width:860px;margin:0 auto;padding:12px 16px}
  .chhead{display:flex;align-items:baseline;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
  .chhead h2{margin:0;font-size:22px}
  .chhead .sub{color:var(--dim);font-size:14px}
  .chhead .grow{flex:1}

  .gp{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
  .gphead{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;cursor:pointer}
  .gphead .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px;color:var(--dim)}
  .gphead .ttl{flex:1;min-width:0}
  .gphead .ttl b{font-size:19px;display:block}
  .gphead .ttl .mean{color:var(--dim);font-size:14px}
  .gphead .part{flex:none;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-top:4px}
  .gphead .chev{flex:none;color:var(--dim);transition:.2s;margin-top:4px}
  .gp.open .gphead .chev{transform:rotate(180deg)}
  .gpbody{display:none;padding:0 16px 16px}
  .gp.open .gpbody{display:block}

  .formula{background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:2px 0 10px;font-size:17px}
  .formula .form{color:var(--dim);font-size:13px;margin-bottom:4px}
  .formula .pat{font-weight:600}
  .rule{font-size:15px;margin:0 0 4px}
  .tr{color:var(--dim);font-size:14px}
  .sec{margin-top:14px}
  .sec>h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .ex{padding:8px 12px;border-left:3px solid var(--accent);background:rgba(91,140,255,.06);border-radius:0 10px 10px 0;margin-bottom:6px;cursor:pointer}
  .ex .ko{font-size:16px}
  .ex .tr{margin-top:2px}
  body.hidetr .ex:not(.shown) .tr{display:none}
  body.hidetr .ex:not(.shown) .ko::after{content:" 👁";opacity:.35;font-size:12px}
  mark{background:none;color:var(--hl);font-weight:700;border-bottom:2px solid rgba(255,217,138,.45)}
  .note{border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:14px}
  .note.warn{background:rgba(255,107,122,.09);border:1px solid rgba(255,107,122,.35)}
  .note.tip{background:rgba(255,207,92,.08);border:1px solid rgba(255,207,92,.35)}
  .note .k{font-weight:700;margin-right:6px}
  .note .tr{margin-top:3px}

  .tbl{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{background:var(--bg2);color:var(--dim);font-weight:600}
  td:first-child{font-weight:600}
  tr:last-child td{border-bottom:none}
  .tbl.cover td:not(:first-child):not(.shown){color:transparent;background:var(--card2);cursor:pointer;border-radius:4px;text-shadow:none}
  .tbl.cover td:not(:first-child):not(.shown)::after{content:"?";color:var(--dim);margin-left:-.4em}
  .tbar{display:flex;gap:8px;margin:0 0 6px;flex-wrap:wrap;align-items:center}
  .tbar .tr{flex:1}

  .pr{display:flex;flex-direction:column;gap:4px;padding:9px 12px;background:var(--bg2);border-radius:10px;margin-bottom:6px;border:1px solid transparent}
  .pr .q{font-size:15px}
  .pr .a{font-size:15px;color:var(--good)}
  .pr button{align-self:flex-start}
  .pr.done{border-color:rgba(55,209,143,.35)}
  .pill.small{font-size:12px;padding:3px 10px}
  .aihint{font-size:11px;color:var(--dim);margin-top:4px}

  /* quiz */
  .quiz{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--accent);border-radius:16px;padding:16px;margin-bottom:14px}
  .quiz .qtop{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;margin-bottom:8px}
  .quiz .qs{font-size:19px;margin:6px 0 4px;line-height:1.6}
  .quiz .blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--gold);color:var(--gold);text-align:center}
  .quiz .qen{color:var(--dim);font-size:15px;font-style:italic;margin:2px 0 6px}
  .quiz .qwhy{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:14px;line-height:1.55}
  .quiz .qwhy b{color:var(--gold)}
  .quiz .qmine{margin-top:6px;color:var(--dim)}
  .quiz .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:12px}
  .quiz .opt{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;text-align:left;cursor:pointer}
  .quiz .opt small{display:block;color:var(--dim);font-size:12px}
  .quiz .opt.right{border-color:var(--good);background:rgba(55,209,143,.15)}
  .quiz .opt.wrong{border-color:var(--bad);background:rgba(255,107,122,.12)}
  .quiz .fb{min-height:24px;margin-top:10px;font-size:14px}
  .quiz .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin:24px 0 8px}
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="home" href="./" title="단어장">‹</a>
    <h1>문법·표현 <small>5B</small></h1>
    <button class="pill" id="trBtn"></button>
    <select id="lang" aria-label="Language"></select>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>

<script>
const DATA = {"chapters":[{"n":1,"title":"대중문화"},{"n":2,"title":"전래 동화"},{"n":3,"title":"과학 상식"},{"n":4,"title":"문화"},{"n":5,"title":"성격 유형"},{"n":6,"title":"사회"},{"n":7,"title":"호칭과 몸짓언어"},{"n":8,"title":"예술"}],"points":[{"id":"g1-1","ch":1,"part":"읽기 II","title":"A/V-(으)ㄹ 뻔하다","star":1,"form":"동사 + -(으)ㄹ 뻔하다 (받침 없음 -ㄹ 뻔하다 / 받침 있음 -을 뻔하다) / 과거: -(으)ㄹ 뻔했다","pattern":"A/V-(으)ㄹ 뻔했다","rule":"어떤 일이 거의 일어날 뻔했지만 실제로는 일어나지 않았음을 나타낸다.","meaning":"Something almost happened, but in the end it did not. It is used for a close call, usually something bad.","use":"Add -ㄹ to a stem ending in a vowel and -을 to a stem ending in a consonant (넘어지다 → 넘어질, 먹다 → 먹을; ㄹ stems keep ㄹ: 울다 → 울), then 뻔했다. The event did not really happen, so it is almost always in the past (뻔했어요 / 뻔했다). It goes mostly with accidents and embarrassing moments (넘어지다, 늦다, 울다, 놓치다). Putting 하마터면 ('nearly') in front makes it stronger. Common mistake: using it for something that really happened, or in the present (넘어질 뻔해요).","table":null,"examples":[{"ko":"비 오는 날 계단에서 미끄러져서 넘어질 뻔했어요.","en":"On a rainy day I slipped on the stairs and almost fell."},{"ko":"영화표를 예매하지 않아서 영화를 못 볼 뻔했어요.","en":"I hadn't booked the film ticket, so I almost couldn't see the film."},{"ko":"결말이 너무 감동적이어서 극장에서 눈물이 날 뻔했어요.","en":"The ending was so touching that I almost cried in the theater."}],"notes":[{"kind":"주의","ko":"일어나지 않은 일이므로 보통 과거형 -(으)ㄹ 뻔했다로 쓴다. 현재형 '넘어질 뻔해요'는 어색하다.","en":"Because the event did not happen, it is normally past: -(으)ㄹ 뻔했다. A present form like 넘어질 뻔해요 sounds wrong."},{"kind":"tip","ko":"'하마터면'을 앞에 넣으면 '큰일 날 뻔했다'는 느낌이 더 강해진다. 주로 나쁜 일에 쓰지만, 놓친 기회에도 쓸 수 있다 (우승할 뻔했어요).","en":"Putting 하마터면 ('nearly') in front makes the close-call feeling stronger. It mostly describes bad things, but can also describe a missed chance (우승할 뻔했어요 'I almost won')."}],"practice":[{"q":"길이 미끄럽다 / 넘어지다 →","a":"길이 미끄러워서 넘어질 뻔했어요.","en":"The road was slippery, so I almost fell."},{"q":"늦잠을 자다 / 시험에 늦다 →","a":"늦잠을 자서 시험에 늦을 뻔했어요.","en":"I overslept and almost was late for the exam."},{"q":"눈이 많이 오다 / 비행기를 못 타다 →","a":"눈이 많이 와서 비행기를 못 탈 뻔했어요.","en":"It snowed a lot, so I almost couldn't catch the plane."},{"q":"영화 결말이 너무 놀랍다 / 소리를 지르다 →","a":"영화 결말이 너무 놀라워서 소리를 지를 뻔했어요.","en":"The ending was so surprising I almost screamed."}],"hl":"[가-힣]\\s뻔[가-힣]*","drill":[{"ko":"지갑을 잃어버릴 뻔했는데 다행히 찾았어요.","en":"I almost lost my wallet, but luckily I found it."},{"ko":"청소하다가 꽃병을 깰 뻔했어요.","en":"While cleaning I almost broke the vase."},{"ko":"자전거를 타다가 차에 부딪칠 뻔했어요.","en":"While riding my bike I almost hit a car."},{"ko":"발표 자료를 저장하지 않고 컴퓨터를 끌 뻔했어요.","en":"I almost turned off the computer without saving my presentation."},{"ko":"친구의 농담이 너무 웃겨서 커피를 뿜을 뻔했어요.","en":"My friend's joke was so funny that I almost spat out my coffee."},{"ko":"지하철에서 내릴 역을 지나칠 뻔했어요.","en":"I almost missed my stop on the subway."},{"ko":"숙제를 안 해서 선생님께 혼날 뻔했어요.","en":"I hadn't done my homework, so I almost got scolded by the teacher."},{"ko":"길을 잃어서 공연 시간에 늦을 뻔했어요.","en":"I got lost and almost was late for the show."},{"ko":"아침을 거르고 학교에 갔다가 쓰러질 뻔했어요.","en":"I skipped breakfast and went to school, and I almost collapsed."},{"ko":"하마터면 비밀번호를 잊어버릴 뻔했어요.","en":"I nearly forgot my password."}],"why":"Look for a past scene where something bad nearly happened but did not, often with 하마터면 ('nearly') or a relieved 다행히 ('luckily') nearby.","hlShow":"[가-힣]\\s뻔[가-힣]*"},{"id":"g1-2","ch":1,"part":"읽기 II","title":"A/V-아/어서 그런지 ~","star":1,"form":"A/V-아/어서 그런지 + 결과 / 명사: N(이)라서 그런지","pattern":"A/V-아/어서 그런지 ~","rule":"정확한 이유는 모르지만 그럴 것이라고 짐작되는 이유를 말한 뒤, 느낀 결과를 이어서 말한다.","meaning":"Maybe because ~. The speaker offers a reason they guess but are not sure of, then describes the result they noticed.","use":"Take the normal -아/어서 form (좋아서, 먹어서, 피곤해서; nouns 이라서/라서) and add 그런지, then state the result you noticed. The reason is only a guess; if you are sure, use plain -아/어서. The second clause is a statement of what you felt or noticed (졸리다, 사람이 많다), not a command or suggestion. Often found with 오늘따라 or 왠지. Common mistake: using it for a confirmed reason, or ending in a command.","table":{"head":["","형용사","동사","-이다"],"rows":[["-아/어서","추워서 그런지","먹어서 그런지","주말이라서 그런지"],["예","날씨가 추워서 그런지","많이 먹어서 그런지","방학이라서 그런지"]]},"examples":[{"ko":"어제 늦게 자서 그런지 오늘 하루 종일 졸려요.","en":"Maybe because I went to bed late yesterday, I'm sleepy all day today."},{"ko":"주말이라서 그런지 영화관에 사람이 정말 많네요.","en":"Maybe because it's the weekend, there are really a lot of people at the cinema."},{"ko":"노래가 좋아서 그런지 립싱크 영상이 인기를 얻고 있어요.","en":"Maybe because the song is good, the lip-sync video is getting popular."}],"notes":[{"kind":"주의","ko":"그런지 뒤에는 명령이나 청유를 쓰지 않는다. 결과는 느낀 사실이다. (✗ 피곤해서 그런지 일찍 주무세요)","en":"After 그런지 use a statement of what you noticed, not a command or suggestion. (✗ 피곤해서 그런지 일찍 주무세요)"},{"kind":"tip","ko":"이유가 확실하면 그냥 -아/어서나 -(으)니까를 쓴다. 그런지는 '아마 이래서 그런가?' 하는 느낌이다.","en":"If the reason is certain, just use -아/어서 or -(으)니까. 그런지 carries the feeling 'maybe that's why?'"}],"practice":[{"q":"어제 잠을 못 자다 / 오늘 너무 피곤하다 →","a":"어제 잠을 못 자서 그런지 오늘 너무 피곤해요.","en":"Maybe because I couldn't sleep yesterday, I'm very tired today."},{"q":"주말이다 / 길이 많이 막히다 →","a":"주말이라서 그런지 길이 많이 막혀요.","en":"Maybe because it's the weekend, the roads are very congested."},{"q":"약을 먹다 / 기분이 좀 나아졌다 →","a":"약을 먹어서 그런지 기분이 좀 나아졌어요.","en":"Maybe because I took medicine, I feel a bit better."},{"q":"한국 드라마를 많이 보다 / 듣기가 쉬워졌다 →","a":"한국 드라마를 많이 봐서 그런지 듣기가 쉬워졌어요.","en":"Maybe because I watch a lot of Korean dramas, listening has become easier."}],"hl":"[가-힣]서 그런지","drill":[{"ko":"요즘 운동을 해서 그런지 몸이 가벼워요.","en":"Maybe because I've been exercising lately, my body feels light."},{"ko":"비가 와서 그런지 오늘은 카페가 한산해요.","en":"Maybe because it's raining, the cafe is quiet today."},{"ko":"방학이라서 그런지 거리에 학생들이 별로 없어요.","en":"Maybe because it's vacation, there aren't many students on the street."},{"ko":"점심을 많이 먹어서 그런지 졸음이 쏟아져요.","en":"Maybe because I ate a lot for lunch, I'm overwhelmed by sleepiness."},{"ko":"날씨가 추워서 그런지 아침에 일어나기가 힘들어요.","en":"Maybe because it's cold, it's hard to get up in the morning."},{"ko":"어제 영화를 두 편이나 봐서 그런지 눈이 피곤해요.","en":"Maybe because I watched two films yesterday, my eyes are tired."},{"ko":"이 노래가 신나서 그런지 자꾸 따라 부르게 돼요.","en":"Maybe because this song is upbeat, I keep singing along."},{"ko":"시험 기간이라서 그런지 도서관이 항상 꽉 차 있어요.","en":"Maybe because it's exam period, the library is always packed."},{"ko":"아이가 어려서 그런지 이야기를 금방 믿어요.","en":"Maybe because the child is young, he believes the story right away."},{"ko":"감독이 유명해서 그런지 영화표가 금방 매진됐어요.","en":"Maybe because the director is famous, the tickets sold out quickly."}],"why":"Look for a result the speaker has just noticed together with a possible cause that is only a guess ('maybe'), not a confirmed fact.","hlShow":"[가-힣]서 그런지"},{"id":"g1-3","ch":1,"part":"읽기 II","title":"(A/V-(으)면) A/V-(으)ㄹ수록 ~","star":1,"form":"A/V-(으)ㄹ수록 (받침 없음·ㄹ 받침 -ㄹ수록 / 받침 있음 -을수록) / A/V-(으)면 A/V-(으)ㄹ수록","pattern":"(A/V-(으)면) A/V-(으)ㄹ수록 ~","rule":"앞의 일의 정도가 더해지면 뒤의 일의 정도도 함께 더해짐을 나타낸다.","meaning":"The more ~, the more ~. As the degree of the first thing increases, the second increases (or changes) along with it.","use":"Attach -ㄹ수록 to stems ending in a vowel or ㄹ (보다 → 볼수록, 만들다 → 만들수록) and -을수록 to consonant stems (먹다 → 먹을수록, 좋다 → 좋을수록). The -(으)면 in front is optional and only adds emphasis; the same verb is repeated (보면 볼수록, 알면 알수록). The second clause often has 더 ('even more'). Past -았/었- is not used before -(으)ㄹ수록. Common mistake: attaching -았/었- to the first clause, or using it for a one-time event.","table":null,"examples":[{"ko":"이 영화는 보면 볼수록 매력이 있어요.","en":"This film becomes more charming the more you watch it."},{"ko":"립싱크는 연습할수록 실력이 늘어요.","en":"The more you practise lip-syncing, the better you get."},{"ko":"가사를 읽을수록 의미가 깊게 느껴져요.","en":"The more I read the lyrics, the deeper the meaning feels."}],"notes":[{"kind":"주의","ko":"-(으)ㄹ수록 앞에는 -았/었-을 붙이지 않는다. (✗ 많았을수록) 한 번만 일어난 일에도 쓰지 않는다.","en":"Do not put -았/었- before -(으)ㄹ수록 (✗ 많았을수록). It is also not used for a one-time event."},{"kind":"tip","ko":"뒤 문장에 '더'를 자주 넣는다: 알수록 더 재미있어요. 같은 동사를 반복하면 '보면 볼수록'처럼 강조가 된다.","en":"The second clause often contains 더: 알수록 더 재미있어요. Repeating the same verb, as in 보면 볼수록, adds emphasis."}],"practice":[{"q":"한국어를 공부하다 / 재미있다 →","a":"한국어는 공부할수록 재미있어요.","en":"The more I study Korean, the more fun it is."},{"q":"노래를 듣다 / 좋아지다 →","a":"노래는 들을수록 좋아져요.","en":"The more I listen to the song, the more I like it."},{"q":"잠을 많이 자다 / 더 졸리다 →","a":"잠은 많이 잘수록 더 졸려요.","en":"The more I sleep, the sleepier I get."},{"q":"사람을 만나다 / 정이 들다 →","a":"사람은 만날수록 정이 들어요.","en":"The more you meet someone, the more attached you get."}],"hl":"[가-힣]+수록","drill":[{"ko":"이 책은 읽을수록 이야기가 흥미로워요.","en":"The more I read this book, the more interesting the story is."},{"ko":"김치는 먹을수록 맛있는 것 같아요.","en":"The more I eat kimchi, the tastier it seems."},{"ko":"나이가 들수록 시간이 빨리 가는 느낌이에요.","en":"The older I get, the faster time seems to pass."},{"ko":"그 배우는 알면 알수록 매력적이에요.","en":"The more you know that actor, the more charming he is."},{"ko":"연습할수록 춤 동작이 자연스러워져요.","en":"The more I practise, the more natural my dance moves become."},{"ko":"설명을 들을수록 더 헷갈려요.","en":"The more I hear the explanation, the more confused I get."},{"ko":"값이 쌀수록 사람들이 많이 사요.","en":"The cheaper the price, the more people buy."},{"ko":"멀리 갈수록 풍경이 아름다워졌어요.","en":"The farther we went, the more beautiful the scenery became."},{"ko":"쓰면 쓸수록 이 앱이 편리하다는 걸 알게 돼요.","en":"The more I use this app, the more I realize how convenient it is."},{"ko":"날씨가 따뜻할수록 아이스크림이 잘 팔려요.","en":"The warmer the weather, the better ice cream sells."}],"why":"Look for two things that change together: a repeated verb (보면 볼수록) or a 더 in the second clause pointing to a rising degree.","hlShow":"[가-힣]+수록"},{"id":"g1-4","ch":1,"part":"읽기 I","title":"V-기보다(는) ~","star":0,"form":"동사 + -기보다(는) (형용사에도 -기보다(는)) / 명사 + 보다는","pattern":"V-기보다(는) ~","rule":"앞의 것보다 뒤의 것이 더 낫거나 더 알맞은 설명임을 나타낸다.","meaning":"Rather than ~ (it is more that ~). It sets aside the first action or description in favour of a better or more accurate one.","use":"Attach -기보다 directly to a verb stem (쉬다 → 쉬기보다, 사다 → 사기보다); 는 adds contrast. Adjectives can also take it (슬프기보다). The second clause gives what the speaker prefers or a more accurate description, often with -는 편이다, -는 게 낫다/좋다, or 오히려 ('on the contrary'). Common mistake: putting a past tense on 기 (✗ 쉬었기보다), or comparing two things that do not belong together.","table":null,"examples":[{"ko":"저는 주말에 집에서 쉬기보다는 친구를 만나는 것을 좋아해요.","en":"On weekends I like meeting friends rather than resting at home."},{"ko":"이 영화는 슬프기보다 따뜻한 이야기예요.","en":"This film is a warm story rather than a sad one."},{"ko":"시험 전에 문제만 외우기보다 이해하는 게 더 중요해요.","en":"Before an exam, understanding is more important than just memorizing questions."}],"notes":[{"kind":"주의","ko":"뒤에는 보통 더 좋거나 더 맞는 쪽이 온다. -기보다에는 과거 -았/었-을 붙이지 않는다. (✗ 쉬었기보다)","en":"The better or more accurate choice normally comes after it. Do not add past -았/었- to -기보다 (✗ 쉬었기보다)."},{"kind":"tip","ko":"'오히려'나 '-는 편이다'를 같이 쓰면 자연스럽다: 슬프기보다 오히려 따뜻한 이야기예요. 명사는 'N보다는'을 쓴다.","en":"Pairing it with 오히려 or -는 편이다 sounds natural: 슬프기보다 오히려 따뜻한 이야기예요. For nouns use 'N보다는'."}],"practice":[{"q":"집에서 쉬다 / 운동하러 가고 싶다 →","a":"집에서 쉬기보다 운동하러 가고 싶어요.","en":"Rather than rest at home, I want to go exercise."},{"q":"말로 설명하다 / 그림으로 보여 주는 게 쉽다 →","a":"말로 설명하기보다 그림으로 보여 주는 게 쉬워요.","en":"Rather than explain in words, showing a picture is easier."},{"q":"택시를 타다 / 지하철이 더 빠르다 →","a":"택시를 타기보다 지하철이 더 빨라요.","en":"Rather than a taxi, the subway is faster."},{"q":"혼자 공부하다 / 친구와 같이 하는 편이 좋다 →","a":"혼자 공부하기보다 친구와 같이 하는 편이 좋아요.","en":"Rather than studying alone, studying with a friend is better."}],"hl":"[가-힣]+기보다(?:는)?","drill":[{"ko":"뉴스를 읽기보다 영상으로 보는 게 이해하기 쉬워요.","en":"Rather than reading the news, watching it as video is easier to understand."},{"ko":"이 가수는 노래를 잘하기보다 분위기를 잘 만드는 사람이에요.","en":"This singer is more someone who creates a mood than someone who sings well."},{"ko":"비싼 옷을 사기보다 오래 입을 옷을 사는 게 좋아요.","en":"Rather than buying expensive clothes, it's better to buy clothes you can wear for long."},{"ko":"그 친구는 말이 많기보다 잘 들어 주는 사람이에요.","en":"That friend is a good listener rather than a talkative person."},{"ko":"걱정만 하기보다는 먼저 해 보세요.","en":"Rather than just worrying, try doing it first."},{"ko":"그는 키가 크기보다 어깨가 넓은 편이에요.","en":"He is more broad-shouldered than tall."},{"ko":"이 노래는 신나기보다 슬픈 느낌이 강해요.","en":"This song feels more sad than upbeat."},{"ko":"사전을 찾기보다는 먼저 문맥으로 짐작해 보세요.","en":"Rather than looking up the dictionary, first guess from the context."},{"ko":"혼자 해결하기보다 선생님께 물어보는 게 나아요.","en":"Rather than solving it alone, it's better to ask the teacher."},{"ko":"경치를 구경하기보다 사진 찍기에 바쁜 사람들이 많아요.","en":"Many people are busy taking photos rather than enjoying the view."}],"why":"Look for a comparison where the first option is set aside and a truer or better second one follows (often 오히려, -는 게 낫다, -는 편이다).","hlShow":"[가-힣]+기보다(?:는)?"},{"id":"g1-5","ch":1,"part":"읽기 I","title":"A/V-(으)ㄴ/는 이상 ~","star":0,"form":"동사 현재 -는 이상 / 동사 완료 -(으)ㄴ 이상 / 형용사 -(으)ㄴ 이상 / 명사 + 인 이상","pattern":"A/V-(으)ㄴ/는 이상 ~","rule":"앞의 상황이 이미 정해진 사실이므로, 뒤에는 당연한 결과나 해야 할 일이 온다.","meaning":"Since ~ is the case / as long as ~, naturally ~. The first clause is an established fact, and the second states what follows from it or what must be done.","use":"Attach -는 이상 to verbs, -(으)ㄴ 이상 to adjectives and to completed actions (약속한 이상), and 인 이상 to nouns. The second clause expresses a duty, a decision, or a natural conclusion (-아/어야 하다, -(으)ㄹ 수밖에 없다, -겠다), not a neutral fact. Compared with -(으)니까 it is firmer and more formal. Common mistake: ending with a plain past fact (✗ 약속한 이상 갔어요).","table":{"head":["","동사","형용사","-이다"],"rows":[["현재","가는 이상 · 먹는 이상","바쁜 이상 · 좋은 이상","학생인 이상"],["완료·과거","간 이상 · 먹은 이상","-","학생이었던 이상"]]},"examples":[{"ko":"한국에 사는 이상 한국어를 열심히 배워야 해요.","en":"As long as you live in Korea, you have to study Korean hard."},{"ko":"약속한 이상 비가 와도 가야지요.","en":"Since I promised, I have to go even if it rains."},{"ko":"이미 결정이 난 이상 이제는 바꿀 수 없어요.","en":"Now that the decision has been made, it can't be changed anymore."}],"notes":[{"kind":"주의","ko":"뒤에는 의무·결심·당연한 결과가 온다. 단순한 과거 사실로 끝내면 어색하다. (✗ 약속한 이상 갔어요)","en":"The second clause should be a duty, resolve or natural result. Ending with a plain past fact sounds odd (✗ 약속한 이상 갔어요)."},{"kind":"tip","ko":"-(으)니까는 가벼운 '때문에'이고, -는 이상은 '이렇게 된 이상 어쩔 수 없다'는 단단한 느낌이라 격식 있는 말과 글에 어울린다.","en":"-(으)니까 is a light 'because', while -는 이상 feels firm, like 'since it is so, there's no way around it', and suits formal speech and writing."}],"practice":[{"q":"한국에서 살다 / 한국어를 배워야 하다 →","a":"한국에서 사는 이상 한국어를 배워야 해요.","en":"As long as I live in Korea, I have to learn Korean."},{"q":"일을 시작하다 / 끝까지 해야 하다 →","a":"일을 시작한 이상 끝까지 해야 해요.","en":"Since you started the job, you must finish it."},{"q":"학생이다 / 공부를 열심히 해야 하다 →","a":"학생인 이상 공부를 열심히 해야 해요.","en":"As long as you're a student, you must study hard."},{"q":"표를 사다 / 영화를 보러 가야죠 →","a":"표를 산 이상 영화를 보러 가야죠.","en":"Since I bought the ticket, I have to go see the film."}],"hl":"[가-힣]\\s이상","drill":[{"ko":"가수가 된 이상 노래 연습을 게을리하면 안 돼요.","en":"Now that you've become a singer, you must not neglect practice."},{"ko":"이렇게 비싼 값을 낸 이상 끝까지 써야죠.","en":"Since I paid such a high price, I have to use it to the end."},{"ko":"이 회사에서 일하는 이상 규칙을 지켜야 합니다.","en":"As long as you work at this company, you must follow the rules."},{"ko":"아이인 이상 실수를 할 수도 있어요.","en":"Since he's a child, he may make mistakes."},{"ko":"상황이 이런 이상 계획을 바꿀 수밖에 없어요.","en":"Since the situation is like this, we have no choice but to change the plan."},{"ko":"한 번 말한 이상 취소할 수는 없어요.","en":"Now that I've said it, I can't take it back."},{"ko":"몸이 아픈 이상 오늘은 쉬는 게 좋겠어요.","en":"Since you're sick, it'd be better to rest today."},{"ko":"시험을 신청한 이상 열심히 준비해야죠.","en":"Now that you've applied for the exam, you have to prepare hard."},{"ko":"부모가 된 이상 아이를 책임져야 해요.","en":"Once you've become a parent, you have to take responsibility for your child."},{"ko":"이야기를 들은 이상 모른 척할 수 없어요.","en":"Now that I've heard the story, I can't pretend not to know."}],"why":"Look for a given fact in the first clause (a promise, a status, a decision) and a duty, resolve or logical conclusion in the second.","hlShow":"[가-힣]\\s이상"},{"id":"g2-1","ch":2,"part":"읽기 II","title":"A/V-(으)ㄹ 리가 없다","star":1,"form":"동사/형용사 + -(으)ㄹ 리가 없다 / 과거: -았/었을 리가 없다 / 명사 + 일 리가 없다","pattern":"A/V-(으)ㄹ 리가 없다","rule":"어떤 일이 사실일 가능성이 전혀 없다고 강하게 믿을 때 쓴다.","meaning":"There is no way that ~. The speaker strongly believes that something cannot be true or cannot happen.","use":"Attach -(으)ㄹ to the stem (가다 → 갈, 먹다 → 먹을, 살다 → 살) and add 리가 없다; for the past use -았/었을 리가 없다; nouns take 일 리가 없다. 리 is a noun meaning 'reason / possibility', so 리는 없다 and 리(가) 있어요? ('how could it be?') also appear. It is the speaker's strong conviction based on what they know about the person or situation, not a checked fact. Common mistake: using it for the speaker's own plans or with a command.","table":{"head":["","형용사","동사","-이다"],"rows":[["현재","쉬울 리가 없다","갈 리가 없다 · 먹을 리가 없다","거짓말일 리가 없다"],["과거","쉬웠을 리가 없다","갔을 리가 없다 · 먹었을 리가 없다","학생이었을 리가 없다"]]},"examples":[{"ko":"그 사람이 거짓말을 할 리가 없어요. 제가 오래 알고 지냈거든요.","en":"There's no way he would lie. I've known him for a long time."},{"ko":"청개구리가 엄마 말을 잘 들을 리가 없어요. 늘 반대로만 하잖아요.","en":"There's no way the green frog would obey his mother. He always does the opposite."},{"ko":"어제까지 건강했는데 갑자기 병이 났을 리가 없어요.","en":"He was healthy until yesterday, so there's no way he suddenly fell ill."}],"notes":[{"kind":"주의","ko":"명사에는 '일 리가 없다'를 쓴다. (✗ 거짓말 리가 없다 → ○ 거짓말일 리가 없다) 이미 끝난 일이면 -았/었을 리가 없다.","en":"With nouns use 'N일 리가 없다' (✗ 거짓말 리가 없다 → ○ 거짓말일 리가 없다). For something already over, use -았/었을 리가 없다."},{"kind":"tip","ko":"대화에서는 '리가 있어요?'(어떻게 그럴 수 있어요?) 같은 반문이나 '-ㄹ 리가 없는데…'로도 자주 쓴다.","en":"In conversation it often appears as a rhetorical question, '리가 있어요?' ('how could that be?'), or as '-ㄹ 리가 없는데…'."}],"practice":[{"q":"그 사람은 정직하다 / 거짓말을 하다 →","a":"그 사람이 거짓말을 할 리가 없어요.","en":"There's no way that person would lie."},{"q":"어제 비가 안 왔다 / 길이 젖다 →","a":"어제 비가 안 왔는데 길이 젖었을 리가 없어요.","en":"It didn't rain yesterday, so there's no way the road got wet."},{"q":"이렇게 쉬운 문제다 / 틀리다 →","a":"이렇게 쉬운 문제를 틀릴 리가 없어요.","en":"There's no way I'd get such an easy question wrong."},{"q":"저 사람이 우리 선생님이다 →","a":"저 사람이 우리 선생님일 리가 없어요.","en":"There's no way that person is our teacher."}],"hl":"[가-힣]+\\s?리(?:가|는)\\s?없","drill":[{"ko":"그렇게 열심히 연습했으니 실패할 리가 없어요.","en":"He practised so hard, so there's no way he'll fail."},{"ko":"이 시간에 그 가게가 문을 열었을 리가 없어요.","en":"There's no way that shop is open at this hour."},{"ko":"내 친구가 내 비밀을 말했을 리가 없어요.","en":"There's no way my friend told my secret."},{"ko":"저 귀여운 아이가 범인일 리가 없어요.","en":"There's no way that cute child is the culprit."},{"ko":"오늘 시험이 어려울 리가 없어요.","en":"There's no way today's exam is hard."},{"ko":"흥부가 동생을 미워할 리가 없지요.","en":"There's no way Heungbu would hate his brother."},{"ko":"이렇게 비싼 가방이 가짜일 리가 없어요.","en":"There's no way such an expensive bag is fake."},{"ko":"그 사람이 한국어를 모를 리가 없어요.","en":"There's no way that person doesn't know Korean."},{"ko":"아무도 없는데 문이 저절로 열렸을 리가 없어요.","en":"Nobody was there, so there's no way the door opened by itself."},{"ko":"방금 먹었는데 벌써 배가 고플 리가 없어요.","en":"I just ate, so there's no way I'm hungry already."}],"why":"Look for the speaker's strong disbelief based on what they know about a person or situation; a reason clause such as 늘 ~하니까 or ~했으니 often comes with it.","hlShow":"[가-힣]+\\s?리(?:가|는)\\s?없"},{"id":"g2-2","ch":2,"part":"읽기 II","title":"V-는 바람에 ~","star":1,"form":"동사 + -는 바람에 (과거의 일이어도 시제는 문장 끝에서 표현: -는 바람에 ~ -았/었다)","pattern":"V-는 바람에 ~","rule":"뜻밖의 일 때문에 좋지 않은 결과가 생겼음을 나타낸다.","meaning":"Because something unexpected happened, a (usually bad) result followed. The whole situation is already in the past.","use":"Attach -는 바람에 to a verb stem (넘어지다 → 넘어지는 바람에, 오다 → 오는 바람에). The tense is shown only at the end of the sentence, so the first clause stays -는 even when it is past (✗ 비가 왔는 바람에). The cause is something unexpected that the speaker did not choose, and the result is usually negative (늦다, 못 하다, 놓치다, 망치다). The second clause cannot be a command or suggestion. It is not used with adjectives. Common mistake: using -았/었는 바람에, or an intended action as the cause.","table":null,"examples":[{"ko":"갑자기 비가 오는 바람에 소풍을 못 갔어요.","en":"It suddenly rained, so we couldn't go on the picnic."},{"ko":"동생이 컵을 깨뜨리는 바람에 바닥이 물바다가 됐어요.","en":"My younger brother broke a cup, and the floor ended up flooded with water."},{"ko":"휴대폰 배터리가 나가는 바람에 립싱크 영상을 다 못 찍었어요.","en":"My phone battery died, so I couldn't finish filming the lip-sync video."}],"notes":[{"kind":"주의","ko":"시제는 문장 끝에만 쓴다. (✗ 비가 왔는 바람에 → ○ 비가 오는 바람에 소풍을 못 갔어요) 뒤에는 명령·청유를 쓰지 않는다.","en":"Put the tense only at the end of the sentence (✗ 비가 왔는 바람에 → ○ 비가 오는 바람에 소풍을 못 갔어요). Do not follow it with a command or suggestion."},{"kind":"tip","ko":"-는 바람에는 '운이 없어서 이렇게 됐다'는 느낌이다. 좋은 결과에는 -덕분에, 일반적인 이유에는 -아/어서를 쓴다.","en":"-는 바람에 carries the feeling 'unluckily it turned out like this'. For good results use -덕분에, and for a neutral reason use -아/어서."}],"practice":[{"q":"길이 막히다 / 약속에 늦다 →","a":"길이 막히는 바람에 약속에 늦었어요.","en":"The road was jammed, so I was late for the appointment."},{"q":"휴대폰이 꺼지다 / 연락을 못 받다 →","a":"휴대폰이 꺼지는 바람에 연락을 못 받았어요.","en":"My phone turned off, so I couldn't get the message."},{"q":"갑자기 눈이 오다 / 비행기가 취소되다 →","a":"갑자기 눈이 오는 바람에 비행기가 취소됐어요.","en":"It suddenly snowed, so the flight was cancelled."},{"q":"동생이 소리를 지르다 / 잠에서 깨다 →","a":"동생이 소리를 지르는 바람에 잠에서 깼어요.","en":"My brother shouted, so I woke up."}],"hl":"[가-힣]+는\\s?바람에","drill":[{"ko":"버스가 늦게 오는 바람에 지각했어요.","en":"The bus came late, so I was late."},{"ko":"컴퓨터가 갑자기 고장 나는 바람에 숙제를 못 냈어요.","en":"The computer suddenly broke down, so I couldn't hand in my homework."},{"ko":"친구가 말을 바꾸는 바람에 계획이 엉망이 됐어요.","en":"My friend changed his words, and the plan fell apart."},{"ko":"지갑을 잃어버리는 바람에 하루 종일 고생했어요.","en":"I lost my wallet and had a hard time all day."},{"ko":"앞 사람이 갑자기 멈추는 바람에 부딪힐 뻔했어요.","en":"The person in front suddenly stopped, and I almost bumped into him."},{"ko":"잠을 못 자는 바람에 시험을 망쳤어요.","en":"I couldn't sleep, so I messed up the exam."},{"ko":"정전이 되는 바람에 영화를 끝까지 못 봤어요.","en":"There was a power outage, so I couldn't watch the film to the end."},{"ko":"마지막 순간에 실수를 하는 바람에 우승을 놓쳤어요.","en":"I made a mistake at the last moment and lost the championship."},{"ko":"아이가 우는 바람에 이야기를 끝내지 못했어요.","en":"The child started crying, so I couldn't finish the story."},{"ko":"바람이 세게 부는 바람에 우산이 뒤집혔어요.","en":"The wind blew hard, and my umbrella turned inside out."}],"why":"Look for an unexpected event that was not the speaker's choice, followed by an unlucky result in the past (늦다, 못 하다, 놓치다).","hlShow":"[가-힣]+는\\s?바람에"},{"id":"g2-3","ch":2,"part":"읽기 II","title":"A/V-(으)ㄴ/는 척하다","star":1,"form":"형용사 -(으)ㄴ 척하다 / 동사 -는 척하다 / 명사 + 인 척하다 / 이미 한 것처럼: 동사 -(으)ㄴ 척하다","pattern":"A/V-(으)ㄴ/는 척하다","rule":"사실이 아닌 것을 사실인 것처럼 꾸며서 행동함을 나타낸다.","meaning":"To pretend to ~. The subject acts as if something were true when it is not.","use":"Use -는 척하다 with verbs (자다 → 자는 척하다; 알다 → 아는 척하다, 모르다 → 모르는 척하다), -(으)ㄴ 척하다 with adjectives (아프다 → 아픈 척하다) and N인 척하다 with nouns. To pretend an action is already done, use V-(으)ㄴ 척하다 (이미 먹은 척하다). The tense of the whole sentence goes on 하다 (척했다). -는 체하다 means the same, and 척 is a bit more colloquial. Common mistake: using -는 for an adjective (✗ 아프는 척하다).","table":{"head":["","형용사","동사","-이다"],"rows":[["지금 그런 것처럼","아픈 척하다","자는 척하다 · 모르는 척하다","학생인 척하다"],["이미 한 것처럼","-","먹은 척하다 · 본 척하다","-"]]},"examples":[{"ko":"동생이 아픈 척하면서 학교에 안 갔어요.","en":"My brother pretended to be sick and didn't go to school."},{"ko":"민수는 그 사실을 알면서도 모르는 척했어요.","en":"Minsu knew the fact, but he pretended not to."},{"ko":"청개구리는 엄마 말을 듣는 척하다가 반대로 했어요.","en":"The green frog pretended to listen to his mother, then did the opposite."}],"notes":[{"kind":"주의","ko":"'알다, 모르다, 있다, 없다'는 동사/존재사라서 -는 척: 아는 척, 모르는 척, 있는 척. 형용사만 -(으)ㄴ 척: 아픈 척, 괜찮은 척.","en":"알다, 모르다, 있다, 없다 take -는 척 (아는 척, 모르는 척, 있는 척). Only adjectives take -(으)ㄴ 척 (아픈 척, 괜찮은 척)."},{"kind":"tip","ko":"사실과 다르게 꾸민다는 뜻이라 조금 부정적일 수 있다. -는 체하다와 같은 뜻이며 '척'이 더 구어적이다.","en":"Because it means faking something untrue, it can sound a little negative. -는 체하다 means the same; 척 is more colloquial."}],"practice":[{"q":"동생이 / 아프다 →","a":"동생이 아픈 척했어요.","en":"My brother pretended to be sick."},{"q":"친구가 / 그 사실을 모르다 →","a":"친구가 그 사실을 모르는 척했어요.","en":"My friend pretended not to know that fact."},{"q":"아이가 / 자다 →","a":"아이가 자는 척했어요.","en":"The child pretended to sleep."},{"q":"그는 / 부자이다 →","a":"그는 부자인 척했어요.","en":"He pretended to be rich."}],"hl":"[가-힣]\\s?척[가-힣]*","drill":[{"ko":"그는 바쁜 척하면서 내 부탁을 거절했어요.","en":"He pretended to be busy and refused my request."},{"ko":"아이가 자는 척하고 몰래 만화를 봤어요.","en":"The child pretended to sleep and secretly read a comic."},{"ko":"저는 일본어를 못하는데 잘하는 척했어요.","en":"I can't speak Japanese, but I pretended I could."},{"ko":"친구가 우는 척해서 깜짝 놀랐어요.","en":"My friend pretended to cry and I was startled."},{"ko":"선생님이 안 보는 척하고 다 보고 계셨어요.","en":"The teacher pretended not to look but was seeing everything."},{"ko":"그 배우는 영화에서 의사인 척하는 사기꾼 역을 맡았어요.","en":"That actor played a swindler pretending to be a doctor in the film."},{"ko":"아무것도 모르는 척하지 마세요.","en":"Don't pretend you know nothing."},{"ko":"먹기 싫어서 이미 먹은 척했어요.","en":"I didn't want to eat, so I pretended to have already eaten."},{"ko":"그는 힘든 척하지 않고 묵묵히 일했어요.","en":"He worked quietly without pretending to be tired."},{"ko":"아이들 앞에서는 괜찮은 척했지만 사실은 많이 아팠어요.","en":"In front of the children I pretended to be fine, but in fact it hurt a lot."}],"why":"Look for a contrast between the real situation and how someone acts (알면서도 모르는 척, 안 아픈데 아픈 척).","hlShow":"[가-힣]\\s?척[가-힣]*"},{"id":"g2-4","ch":2,"part":"읽기 I","title":"V-는 둥 마는 둥 (하다)","star":0,"form":"동사 + -는 둥 마는 둥 (하다) (같은 동사를 반복: 먹는 둥 마는 둥 하다)","pattern":"V-는 둥 마는 둥 (하다)","rule":"어떤 일을 하는 것인지 안 하는 것인지 알 수 없을 정도로 대충 함을 나타낸다.","meaning":"To do something half-heartedly, so that it is hard to say whether it was done at all.","use":"Attach -는 둥 마는 둥 to a verb stem, using the same verb in both parts (먹다 → 먹는 둥 마는 둥, 듣다 → 듣는 둥 마는 둥), then 하다 or a following verb: 먹는 둥 마는 둥 하고 나왔어요. It is mostly in the past and describes lack of attention or effort because of sleepiness, hurry or worry. Typical verbs: 먹다, 듣다, 자다, 하다, 보다. Common mistake: using two different verbs (that is the pattern -는 둥 -는 둥), or using it with adjectives.","table":null,"examples":[{"ko":"아침에 늦어서 밥을 먹는 둥 마는 둥 하고 나왔어요.","en":"I was late in the morning, so I barely ate anything and left."},{"ko":"졸려서 수업을 듣는 둥 마는 둥 했어요.","en":"I was sleepy, so I half-listened to the class."},{"ko":"걱정이 많아서 어젯밤에 잠을 자는 둥 마는 둥 했어요.","en":"I was so worried that I hardly slept last night."}],"notes":[{"kind":"주의","ko":"같은 동사를 반복한다: 듣는 둥 마는 둥. 서로 다른 두 동사를 쓰면 다른 문형(-는 둥 -는 둥)이 된다.","en":"Repeat the same verb: 듣는 둥 마는 둥. Using two different verbs makes another pattern (-는 둥 -는 둥)."},{"kind":"tip","ko":"'마는'은 '말다'(그만두다)에서 왔다. '제대로 하지 않았다'는 불만이나 아쉬움이 느껴져서, 보통 이유(졸려서, 바빠서)와 같이 말한다.","en":"마는 comes from 말다 ('to stop'). It carries a feeling of dissatisfaction that it wasn't done properly, so it is usually accompanied by a reason (졸려서, 바빠서)."}],"practice":[{"q":"아침을 먹다 / 학교에 가다 →","a":"아침을 먹는 둥 마는 둥 하고 학교에 갔어요.","en":"I barely ate breakfast and went to school."},{"q":"선생님 말씀을 듣다 / 졸다 →","a":"선생님 말씀을 듣는 둥 마는 둥 하고 졸았어요.","en":"I half-listened to the teacher and dozed off."},{"q":"청소를 하다 / 나가다 →","a":"청소를 하는 둥 마는 둥 하고 나갔어요.","en":"I did the cleaning half-heartedly and went out."},{"q":"인사를 하다 / 지나가다 →","a":"인사를 하는 둥 마는 둥 하고 지나갔어요.","en":"He half-greeted me and passed by."}],"hl":"[가-힣]+는 둥 마는 둥","drill":[{"ko":"피곤해서 샤워를 하는 둥 마는 둥 하고 잤어요.","en":"I was tired, so I barely showered and went to sleep."},{"ko":"걱정이 되어서 점심을 먹는 둥 마는 둥 했어요.","en":"I was worried, so I barely ate lunch."},{"ko":"영화를 보는 둥 마는 둥 하고 휴대폰만 봤어요.","en":"I half-watched the film and only looked at my phone."},{"ko":"그는 내 얘기를 듣는 둥 마는 둥 했어요.","en":"He only half-listened to what I said."},{"ko":"시험 전날이라 잠을 자는 둥 마는 둥 했어요.","en":"It was the night before the exam, so I hardly slept."},{"ko":"숙제를 하는 둥 마는 둥 하고 놀러 나갔어요.","en":"I did my homework half-heartedly and went out to play."},{"ko":"화장을 하는 둥 마는 둥 하고 서둘러 나왔어요.","en":"I hardly did my makeup and hurried out."},{"ko":"운동을 하는 둥 마는 둥 해서 효과가 없어요.","en":"I exercise half-heartedly, so it has no effect."},{"ko":"아이가 책을 읽는 둥 마는 둥 하더니 잠들어 버렸어요.","en":"The child half-read the book and then fell asleep."},{"ko":"빨래를 개는 둥 마는 둥 하고 쉬었어요.","en":"I half-folded the laundry and then rested."}],"why":"Look for the same verb repeated as V-는 둥 마는 둥, usually with a reason such as 졸려서, 바빠서 or 걱정돼서: the action looked done but wasn't done properly.","hlShow":"[가-힣]+는 둥 마는 둥"},{"id":"g2-5","ch":2,"part":"읽기 I","title":"A/V-답니다","star":0,"form":"형용사 -답니다 / 동사 -ㄴ/는답니다 / 명사 (이)랍니다 / 과거 -았/었답니다 (< -다고 합니다)","pattern":"A/V-답니다","rule":"들은 이야기를 친절하고 재미있게 전달할 때 쓰는 '-다고 합니다'의 줄임 표현이다.","meaning":"A storyteller ending (short for -다고 합니다). It passes on a fact warmly, as in a folk tale or when speaking to a child or an audience.","use":"Form: adjective -답니다, verb without final consonant -ㄴ답니다 and with final consonant -는답니다 (ㄹ verbs drop ㄹ: 살다 → 산답니다), noun (이)랍니다, past -았/었답니다. Used in fairy tales and when explaining something interesting to listeners (parents, guides, announcers). It sounds warm and a little playful, so it is not for neutral reports. To a child directly, the plain form is -단다 / -란다. Common mistake: using it for the speaker's own opinion or first-hand experience.","table":{"head":["","형용사","동사","-이다"],"rows":[["현재","착하답니다","간답니다 · 먹는답니다","왕이랍니다 · 의사랍니다"],["과거","착했답니다","갔답니다 · 먹었답니다","왕이었답니다 · 의사였답니다"]]},"examples":[{"ko":"옛날 옛적에 착한 흥부와 욕심 많은 놀부가 살았답니다.","en":"Once upon a time there lived kind Heungbu and greedy Nolbu."},{"ko":"오누이는 하늘로 올라가 해님과 달님이 되었답니다.","en":"The brother and sister went up to the sky and became the Sun and the Moon."},{"ko":"그 마을에는 지금도 청개구리 이야기가 전해진답니다.","en":"In that village, the story of the green frog is still handed down."}],"notes":[{"kind":"주의","ko":"받침 없는 동사는 -ㄴ답니다 (간답니다), 받침 있는 동사는 -는답니다 (먹는답니다), 형용사는 -답니다 (착하답니다), 이다는 (이)랍니다. ㄹ 받침 동사는 ㄹ이 빠진다 (산답니다).","en":"Verbs without a final consonant take -ㄴ답니다 (간답니다), with one -는답니다 (먹는답니다), adjectives -답니다 (착하답니다), and 이다 becomes (이)랍니다. Verbs ending in ㄹ drop it (산답니다)."},{"kind":"tip","ko":"아이에게 직접 말할 때는 -단다 / -란다를 쓴다: 옛날에 호랑이가 살았단다. 이야기책의 마지막 문장에 자주 나온다.","en":"When speaking straight to a child use -단다 / -란다: 옛날에 호랑이가 살았단다. It often appears in the last lines of a storybook."}],"practice":[{"q":"옛날에 호랑이가 살다 →","a":"옛날에 호랑이가 살았답니다.","en":"Long ago a tiger lived there."},{"q":"해님은 하늘로 올라가다 →","a":"해님은 하늘로 올라갔답니다.","en":"The Sun went up to the sky."},{"q":"청개구리는 엄마 말을 안 듣다 (과거) →","a":"청개구리는 엄마 말을 안 들었답니다.","en":"The green frog did not listen to his mother."},{"q":"흥부는 마음이 착하다 →","a":"흥부는 마음이 착하답니다.","en":"Heungbu has a kind heart."}],"hl":"[가-힣]+[답랍]니다","drill":[{"ko":"옛날 옛적에 호랑이가 담배를 피웠답니다.","en":"Once upon a time, tigers smoked pipes."},{"ko":"흥부는 가난하지만 마음이 아주 착하답니다.","en":"Heungbu is poor, but he has a very kind heart."},{"ko":"놀부는 욕심이 많아서 흥부를 쫓아냈답니다.","en":"Nolbu was greedy and drove Heungbu out."},{"ko":"제비가 박씨를 물어다 주었답니다.","en":"A swallow brought a gourd seed in its beak."},{"ko":"오누이는 무서운 호랑이를 피해 도망쳤답니다.","en":"The brother and sister ran away from the scary tiger."},{"ko":"청개구리는 어머니가 돌아가신 뒤에야 후회했답니다.","en":"The green frog regretted it only after his mother passed away."},{"ko":"그 연못은 비가 오면 개구리들이 운답니다.","en":"At that pond, the frogs croak when it rains."},{"ko":"이 이야기는 아주 오래전부터 전해 내려온 이야기랍니다.","en":"This is a story handed down since very long ago."},{"ko":"박을 타자 금은보화가 쏟아져 나왔답니다.","en":"When they sawed open the gourd, gold and jewels poured out."},{"ko":"그 후로 사람들은 모두 행복하게 살았답니다.","en":"After that, everyone lived happily."}],"why":"Look for a storytelling or explaining voice (옛날에, 지금도 전해진다): the speaker is passing on a story, not giving their own opinion.","hlShow":"[가-힣]+[답랍]니다"},{"id":"g3-1","ch":3,"part":"읽기 I","title":"A/V-(으)ㄹ걸(요)","star":1,"form":"동사/형용사 + -(으)ㄹ걸(요) / 과거: -았/었을걸(요) / 명사 + 일걸(요)","pattern":"A/V-(으)ㄹ걸(요)","rule":"듣는 사람과 다를 수 있는 가벼운 추측을 부드럽게 말할 때 쓴다.","meaning":"A soft guess: I think ~ / probably ~. It is often used to gently correct or disagree with what the listener said or assumed.","use":"Add -ㄹ걸요 to stems ending in a vowel or ㄹ and -을걸요 to consonant stems; past -았/었을걸요; nouns 일걸요. Drop 요 (-(으)ㄹ걸) with close friends. It is conversational and only for a guess, not for confirmed facts or for the speaker's own plan. It often answers someone else's assumption (아니에요, ~ -(으)ㄹ걸요) and sounds softer with 아마. Common mistake: using it in formal writing, with the speaker's own plan (✗ 저는 내일 갈걸요), or in a question.","table":{"head":["","형용사","동사","-이다"],"rows":[["현재·미래 추측","쉬울걸요 · 추울걸요","갈걸요 · 먹을걸요","가수일걸요"],["과거 추측","쉬웠을걸요","갔을걸요 · 먹었을걸요","가수였을걸요"]]},"examples":[{"ko":"지금 출발하면 길이 많이 막힐걸요.","en":"If you leave now, the road will probably be very congested."},{"ko":"그 영화는 벌써 끝났을걸요. 지금 가도 못 봐요.","en":"That film has probably already finished. You can't see it even if you go now."},{"ko":"김 선생님은 지금 사무실에 안 계실걸요.","en":"Mr. Kim is probably not in the office right now."}],"notes":[{"kind":"주의","ko":"-(으)ㄹ걸요는 추측일 뿐이라 자기 계획에는 쓰지 않는다. 또 '-(으)ㄹ걸 그랬다'는 후회를 나타내는 다른 문형이다.","en":"-(으)ㄹ걸요 is only a guess, so it is not used for the speaker's own plan. Also, '-(으)ㄹ걸 그랬다' is a different pattern that expresses regret."},{"kind":"tip","ko":"상대가 말한 것과 다르게 생각할 때 '아니에요, 주말이라서 사람이 많을걸요'처럼 부드럽게 반대할 수 있다. '아마'를 넣으면 더 부드럽다.","en":"You can disagree gently with 'No, 주말이라서 사람이 많을걸요' ('it's the weekend, so it'll probably be crowded'). Adding 아마 makes it softer."}],"practice":[{"q":"(추측) 지금 가면 길이 막히다 →","a":"지금 가면 길이 막힐걸요.","en":"If you go now, the road will probably be jammed."},{"q":"(추측) 그 가게는 일요일에 문을 닫다 →","a":"그 가게는 일요일에 문을 닫을걸요.","en":"That shop is probably closed on Sundays."},{"q":"(추측) 어제 시험이 어려웠다 →","a":"어제 시험이 어려웠을걸요.","en":"Yesterday's exam was probably hard."},{"q":"(추측) 저 사람은 가수이다 →","a":"저 사람은 가수일걸요.","en":"That person is probably a singer."}],"hl":"[가-힣]걸요","drill":[{"ko":"이 시간에는 그 식당이 이미 문을 닫았을걸요.","en":"At this hour that restaurant has probably already closed."},{"ko":"아마 민수 씨는 벌써 집에 갔을걸요.","en":"Minsu has probably already gone home."},{"ko":"이번 시험은 지난번보다 쉬울걸요.","en":"This exam will probably be easier than last time."},{"ko":"저 가수는 요즘 해외에서 더 인기가 많을걸요.","en":"That singer is probably more popular abroad these days."},{"ko":"내일은 날씨가 추울걸요.","en":"It will probably be cold tomorrow."},{"ko":"그 영화는 아이들이 보기에는 좀 무서울걸요.","en":"That film is probably a bit scary for children."},{"ko":"지금쯤 친구가 도착했을걸요.","en":"My friend has probably arrived by now."},{"ko":"그 사람은 한국어를 잘하니까 통역도 할 수 있을걸요.","en":"He's good at Korean, so he can probably interpret too."},{"ko":"이 책은 아마 도서관에 있을걸요.","en":"This book is probably in the library."},{"ko":"그건 아마 가짜일걸요.","en":"That is probably a fake."}],"why":"Look for a gentle guess about something the speaker cannot confirm, often answering a different assumption (아니에요, ~걸요) and often with 아마.","hlShow":"[가-힣]걸요"},{"id":"g3-2","ch":3,"part":"읽기 II","title":"A/V-다고 (해서) -(으)ㄴ/는 것은 아니다","star":1,"form":"형용사 -다고 해서 / 동사 -ㄴ/는다고 해서 / 명사 (이)라고 해서 + -(으)ㄴ/는 것은 아니다","pattern":"A/V-다고 (해서) -(으)ㄴ/는 것은 아니다","rule":"앞의 일이 반드시 뒤의 결과로 이어지는 것은 아님을 나타낸다.","meaning":"Just because ~ does not mean ~. The first clause is a common assumption, and the second rejects the automatic conclusion.","use":"Form the quotation -다고 해서 (adjective -다고, verb -ㄴ/는다고, noun (이)라고; past -았/었다고) and end with -(으)ㄴ/는 것은 아니다 (in speech 건 아니에요). The first clause is a general assumption (비싸다고 해서 ...), and the ending means 'not necessarily', not 'definitely not'. 해서 can be dropped. Adding 반드시 / 꼭 / 항상 / 다 sounds natural. Common mistake: treating it as a complete negation, or putting a rule that nobody believes in the first clause.","table":{"head":["","형용사","동사","-이다"],"rows":[["현재","비싸다고 해서","간다고 해서 · 먹는다고 해서","학생이라고 해서"],["과거","비쌌다고 해서","갔다고 해서 · 먹었다고 해서","학생이었다고 해서"]]},"examples":[{"ko":"값이 비싸다고 해서 반드시 품질이 좋은 것은 아니에요.","en":"Just because the price is high doesn't mean the quality is necessarily good."},{"ko":"인터넷에 나온 정보라고 해서 모두 사실인 것은 아니에요.","en":"Just because information is on the internet doesn't mean it is all true."},{"ko":"노래를 잘한다고 해서 립싱크도 잘하는 것은 아니에요.","en":"Just because someone sings well doesn't mean they are good at lip-syncing too."}],"notes":[{"kind":"주의","ko":"뒤는 '-(으)ㄴ/는 것은 아니다'(말할 때는 '-는 건 아니에요')로 끝낸다. 완전한 부정이 아니라 '꼭 그런 것은 아니다'라는 뜻이다.","en":"End with '-(으)ㄴ/는 것은 아니다' (in speech '-는 건 아니에요'). It is not a complete denial but 'not necessarily so'."},{"kind":"tip","ko":"명사는 N(이)라고 해서, 과거는 -았/었다고 해서. 앞의 '해서'는 빼고 '-다고 -는 건 아니다'로도 말한다.","en":"Nouns take N(이)라고 해서 and the past takes -았/었다고 해서. 해서 can be dropped, as in '-다고 -는 건 아니다'."}],"practice":[{"q":"값이 싸다 / 품질이 나쁘다 →","a":"값이 싸다고 해서 품질이 나쁜 것은 아니에요.","en":"Just because it's cheap doesn't mean the quality is bad."},{"q":"한국에 오래 살다 / 한국어를 다 잘하다 →","a":"한국에 오래 산다고 해서 한국어를 다 잘하는 것은 아니에요.","en":"Living in Korea a long time doesn't mean you speak perfect Korean."},{"q":"유명한 가수이다 / 노래를 다 잘하다 →","a":"유명한 가수라고 해서 노래를 다 잘하는 것은 아니에요.","en":"Being a famous singer doesn't mean you sing everything well."},{"q":"비가 오다 / 길이 항상 막히다 →","a":"비가 온다고 해서 길이 항상 막히는 것은 아니에요.","en":"Just because it rains doesn't mean the roads are always jammed."}],"hl":"[가-힣]+[다라]고 해서","drill":[{"ko":"열심히 공부한다고 해서 모두 성적이 오르는 것은 아니에요.","en":"Studying hard doesn't mean everyone's grades go up."},{"ko":"책이 두껍다고 해서 내용이 어려운 것은 아니에요.","en":"Just because a book is thick doesn't mean the content is hard."},{"ko":"외국인이라고 해서 한국 음식을 못 먹는 것은 아니에요.","en":"Being a foreigner doesn't mean you can't eat Korean food."},{"ko":"나이가 많다고 해서 배울 수 없는 것은 아니에요.","en":"Being old doesn't mean you can't learn."},{"ko":"인기가 많다고 해서 모두 좋은 영화인 것은 아니에요.","en":"Being popular doesn't mean every film is a good one."},{"ko":"머리가 좋다고 해서 항상 일을 잘하는 것은 아니에요.","en":"Being smart doesn't mean you always do your work well."},{"ko":"비싼 옷을 입었다고 해서 부자인 것은 아니에요.","en":"Wearing expensive clothes doesn't mean you are rich."},{"ko":"이야기가 짧다고 해서 의미도 가벼운 것은 아니에요.","en":"Just because a story is short doesn't mean its meaning is light."},{"ko":"자주 웃는다고 해서 늘 행복한 것은 아니에요.","en":"Smiling often doesn't mean you are always happy."},{"ko":"전래 동화라고 해서 아이들만 읽는 것은 아니에요.","en":"Being a folk tale doesn't mean only children read it."}],"why":"Look for a common assumption stated first (비싸다고 해서, 유명하다고 해서) and a conclusion that does not automatically follow, ending in 것은 아니다.","hlShow":"[가-힣]+[다라]고 해서"},{"id":"g3-3","ch":3,"part":"읽기 II","title":"V-아/어 두다","star":1,"form":"동사 + -아/어 두다 (ㅏ·ㅗ 모음 -아 두다 / 그 외 -어 두다 / 하다 → 해 두다)","pattern":"V-아/어 두다","rule":"어떤 행동을 끝내고 그 결과를 그대로 유지해 둠을 나타낸다.","meaning":"To do something in advance and keep the result in place for later use.","use":"Attach -아 두다 to stems ending in ㅏ/ㅗ and -어 두다 to the others (사다 → 사 두다, 적다 → 적어 두다, 준비하다 → 준비해 두다). It is used for preparing something in advance (예매해 두다) or leaving a state as it is (창문을 열어 두다 'leave the window open'). It needs a verb whose result stays: 사다, 적다, 켜다, 열다, 예약하다. It is not used with verbs without a lasting result or with adjectives (✗ 학교에 가 두다). 두었다 is often shortened to 뒀다. Compare -아/어 놓다, which is almost the same and more colloquial.","table":{"head":["","ㅏ·ㅗ 모음","그 외 모음","하다"],"rows":[["-아/어 두다","사 두다 · 놓아 두다","적어 두다 · 켜 두다","준비해 두다"],["과거","사 두었다 · 놓아 두었다","적어 두었다 · 켜 두었다","준비해 두었다"]]},"examples":[{"ko":"시험 전에 중요한 단어를 노트에 적어 두세요.","en":"Before the exam, write down the important words in your notebook."},{"ko":"미리 영화표를 예매해 두었어요.","en":"I booked the film tickets in advance."},{"ko":"친구가 올 때까지 불을 켜 두었어요.","en":"I left the light on until my friend came."}],"notes":[{"kind":"주의","ko":"결과가 남는 동작에만 쓴다. 이동이나 상태를 나타내는 말에는 쓰지 않는다. (✗ 학교에 가 두다, ✗ 예뻐 두다)","en":"Use it only for actions whose result remains. It is not used with movement or state words (✗ 학교에 가 두다, ✗ 예뻐 두다)."},{"kind":"tip","ko":"'-아/어 놓다'와 거의 같다. '미리 준비'와 '그대로 두기' 두 가지 뜻이 있고, 과거형 '두었다'는 '뒀다'로 줄여 쓴다.","en":"It is almost the same as -아/어 놓다. It has two senses, 'prepare ahead' and 'leave as it is', and the past 두었다 is often shortened to 뒀다."}],"practice":[{"q":"내일 쓸 돈을 찾다 →","a":"내일 쓸 돈을 찾아 두었어요.","en":"I withdrew the money I'll use tomorrow, in advance."},{"q":"방에 불을 켜다 (부탁) →","a":"방에 불을 켜 두세요.","en":"Please leave the light on in the room."},{"q":"약속 날짜를 달력에 적다 →","a":"약속 날짜를 달력에 적어 두었어요.","en":"I wrote the appointment date on the calendar."},{"q":"호텔을 미리 예약하다 →","a":"호텔을 미리 예약해 두었어요.","en":"I reserved the hotel in advance."}],"hl":"[가-힣]\\s(?:두|뒀|둬|둔)[가-힣]*","drill":[{"ko":"손님이 오기 전에 음식을 만들어 두었어요.","en":"I made the food before the guests came."},{"ko":"냄새가 나니까 창문을 열어 두세요.","en":"It smells, so please leave the window open."},{"ko":"중요한 서류는 잃어버리지 않게 따로 챙겨 두세요.","en":"Put important documents aside so you don't lose them."},{"ko":"내일 아침에 먹을 빵을 사 두었어요.","en":"I bought the bread to eat tomorrow morning."},{"ko":"이 비밀번호는 어딘가에 적어 두는 게 좋아요.","en":"It's better to write this password down somewhere."},{"ko":"영화를 보기 전에 줄거리를 읽어 두면 이해하기 쉬워요.","en":"If you read the plot before the film, it's easier to understand."},{"ko":"비가 올지 모르니까 우산을 가방에 넣어 두세요.","en":"It might rain, so keep an umbrella in your bag."},{"ko":"친구 선물을 미리 포장해 두었어요.","en":"I wrapped my friend's present in advance."},{"ko":"짐은 문 앞에 놓아 두세요.","en":"Please leave the luggage in front of the door."},{"ko":"배가 고플 때 먹으려고 간식을 남겨 두었어요.","en":"I saved a snack to eat when I'm hungry."}],"why":"Look for preparation 'for later' (미리, 나중에, 올 때까지) or a result that is left as it is (창문을 열어 두다).","hlShow":"[가-힣]\\s(?:두|뒀|둬|둔)[가-힣]*"},{"id":"g3-4","ch":3,"part":"읽기 I","title":"A/V-(느)냐에 따라(서) ~","star":0,"form":"동사 + -느냐에 따라(서) / 형용사 + -(으)냐에 따라(서) / 명사 + (이)냐에 따라(서) / 과거 -았/었느냐에 따라","pattern":"A/V-(느)냐에 따라(서) ~","rule":"앞의 내용이 어떠한지에 따라 뒤의 결과가 달라짐을 나타낸다.","meaning":"Depending on whether / how ~. The result in the second clause differs according to the content of the first.","use":"Attach -느냐에 따라 to verbs (먹느냐에 따라), -(으)냐에 따라 to adjectives (크냐에 따라, 어려우냐에 따라) and (이)냐에 따라 to nouns. It goes well with question words (누가, 어떻게, 얼마나, 무엇을). The second clause says that something differs or changes: 달라지다, 다르다, 바뀌다, 결정되다. 서 is optional. Common mistake: using -(으)면 'if', or ending with a fixed result when nothing varies.","table":{"head":["","형용사","동사","-이다"],"rows":[["현재","크냐에 따라 · 어려우냐에 따라","먹느냐에 따라 · 하느냐에 따라","학생이냐에 따라"],["과거","컸느냐에 따라","먹었느냐에 따라","학생이었느냐에 따라"]]},"examples":[{"ko":"같은 노래도 누가 부르느냐에 따라 느낌이 달라요.","en":"Even the same song feels different depending on who sings it."},{"ko":"뇌는 어떻게 쓰느냐에 따라 능력이 달라질 수 있어요.","en":"Depending on how you use it, the brain's ability can change."},{"ko":"잠을 얼마나 자느냐에 따라 기억력이 달라질 수 있어요.","en":"Depending on how much you sleep, your memory can change."}],"notes":[{"kind":"주의","ko":"뒤에는 '달라지다/다르다/바뀌다/결정되다'처럼 결과가 변한다는 말이 와야 한다. 결과가 하나로 정해져 있으면 쓰지 않는다.","en":"The second clause needs a word saying the result varies, such as 달라지다/다르다/바뀌다/결정되다. It is not used when the result is fixed."},{"kind":"tip","ko":"명사는 'N에 따라(서)'로 짧게 쓸 수 있다: 사람에 따라 달라요. 의문사(누가, 어떻게, 얼마나)와 함께 쓰면 자연스럽다.","en":"Nouns can use the shorter 'N에 따라(서)': 사람에 따라 달라요. It sounds natural with question words (누가, 어떻게, 얼마나)."}],"practice":[{"q":"누가 가르치다 / 수업 분위기가 달라지다 →","a":"누가 가르치느냐에 따라 수업 분위기가 달라져요.","en":"Depending on who teaches, the class atmosphere changes."},{"q":"어떻게 연습하다 / 실력이 다르다 →","a":"어떻게 연습하느냐에 따라 실력이 달라요.","en":"Depending on how you practise, your skill differs."},{"q":"날씨가 어떻다 / 계획이 바뀌다 →","a":"날씨가 어떠냐에 따라 계획이 바뀔 수 있어요.","en":"Depending on the weather, the plan may change."},{"q":"학생이냐 아니냐 / 가격이 다르다 →","a":"학생이냐 아니냐에 따라 가격이 달라요.","en":"Depending on whether you are a student, the price differs."}],"hl":"[가-힣]+냐에 따라(?:서)?","drill":[{"ko":"몇 시에 출발하느냐에 따라 도착 시간이 달라져요.","en":"Depending on what time you leave, the arrival time changes."},{"ko":"뭘 먹느냐에 따라 기분이 달라지기도 해요.","en":"Depending on what you eat, your mood can change."},{"ko":"영화를 누구와 보느냐에 따라 재미가 다르게 느껴져요.","en":"Depending on who you watch a film with, it feels different."},{"ko":"이 일은 얼마나 집중하느냐에 따라 결과가 크게 달라요.","en":"For this task, the result differs greatly depending on how focused you are."},{"ko":"시험이 어려우냐에 따라 합격자 수가 달라질 거예요.","en":"Depending on how hard the exam is, the number of passers will change."},{"ko":"값이 얼마냐에 따라 살지 말지 결정하겠어요.","en":"Depending on the price, I'll decide whether to buy or not."},{"ko":"어떤 사람을 만나느냐에 따라 인생이 바뀔 수도 있어요.","en":"Depending on whom you meet, your life can change."},{"ko":"이야기를 어떻게 전하느냐에 따라 아이들의 반응이 달라요.","en":"Depending on how you tell the story, the children's reactions differ."},{"ko":"비가 오느냐 안 오느냐에 따라 소풍 장소를 정할 거예요.","en":"Depending on whether it rains or not, we'll decide the picnic place."},{"ko":"뇌에 어떤 자극을 주느냐에 따라 기억이 달라질 수 있어요.","en":"Depending on what stimulus you give the brain, memory can change."}],"why":"Look for a variable in the first clause (who, how, how much, whether) and a word like 달라지다 / 다르다 / 결정되다 in the second.","hlShow":"[가-힣]+냐에 따라(?:서)?"},{"id":"g3-5","ch":3,"part":"읽기 II","title":"V-아/어 내다","star":0,"form":"동사 + -아/어 내다 (ㅏ·ㅗ 모음 -아 내다 / 그 외 -어 내다 / 하다 → 해 내다)","pattern":"V-아/어 내다","rule":"어려움을 이겨 내고 스스로의 힘으로 끝까지 해냈음을 나타낸다.","meaning":"To finally manage something hard by one's own effort, getting through the difficulty to the end.","use":"Attach -아 내다 after stems ending in ㅏ/ㅗ and -어 내다 after the others (참다 → 참아 내다, 이기다 → 이겨 내다, 하다 → 해 내다). It describes finishing a hard or long task by one's own power, so it fits verbs of endurance and achievement (참다, 이기다, 견디다, 찾다, 해결하다, 만들다). It is mostly in the past or completed form (참아 냈어요), often with 끝까지 or 드디어. It is not used for easy actions (✗ 밥을 먹어 냈어요) or with adjectives.","table":{"head":["","ㅏ·ㅗ 모음","그 외 모음","하다"],"rows":[["-아/어 내다","참아 내다 · 찾아 내다","이겨 내다 · 견뎌 내다","해 내다 · 완성해 내다"],["과거","참아 냈다 · 찾아 냈다","이겨 냈다 · 견뎌 냈다","해 냈다 · 완성해 냈다"]]},"examples":[{"ko":"그 학생은 힘든 연습을 끝까지 참아 냈어요.","en":"That student endured the hard practice to the end."},{"ko":"우리 팀은 어려운 문제를 스스로 해결해 냈어요.","en":"Our team solved the difficult problem by ourselves."},{"ko":"흥부는 가난을 이겨 내고 행복하게 살게 되었어요.","en":"Heungbu overcame poverty and came to live happily."}],"notes":[{"kind":"주의","ko":"어려움과 노력이 있는 일에만 쓴다. 쉬운 일에 쓰면 어색하다. (✗ 밥을 먹어 냈어요)","en":"Use it only for things that involve difficulty and effort. For an easy action it sounds odd (✗ 밥을 먹어 냈어요)."},{"kind":"tip","ko":"이겨 내다, 참아 내다, 견뎌 내다, 해 내다, 찾아 내다, 알아 내다처럼 굳어진 말이 많다. '끝까지, 드디어, 결국'과 잘 어울린다.","en":"Many combinations are fixed: 이겨 내다, 참아 내다, 견뎌 내다, 해 내다, 찾아 내다, 알아 내다. It goes well with 끝까지, 드디어, 결국."}],"practice":[{"q":"힘든 훈련을 끝까지 참다 →","a":"힘든 훈련을 끝까지 참아 냈어요.","en":"I endured the hard training to the end."},{"q":"어려운 병을 이기다 →","a":"어려운 병을 이겨 냈어요.","en":"I overcame the serious illness."},{"q":"혼자서 이 일을 해결하다 →","a":"혼자서 이 일을 해결해 냈어요.","en":"I solved this problem all by myself."},{"q":"잃어버린 열쇠를 끝내 찾다 →","a":"잃어버린 열쇠를 끝내 찾아 냈어요.","en":"I finally found the lost key."}],"hl":"[가-힣]\\s(?:내(?:다|고|서|면|야|는|지|어|었)|냈)[가-힣]*","drill":[{"ko":"그는 어려운 시험을 훌륭하게 치러 냈어요.","en":"He got through the difficult exam splendidly."},{"ko":"아이들이 추위를 견뎌 내고 산 정상까지 올랐어요.","en":"The children endured the cold and climbed to the summit."},{"ko":"우리는 서로 도우며 위기를 이겨 냈어요.","en":"We helped each other and overcame the crisis."},{"ko":"마라톤을 끝까지 달려 냈을 때 정말 뿌듯했어요.","en":"I felt really proud when I ran the marathon to the end."},{"ko":"그 사람은 어려운 환경에서도 공부를 해 냈어요.","en":"He managed to study even in a difficult environment."},{"ko":"몇 달 동안 연습해서 드디어 그 춤을 완성해 냈어요.","en":"After months of practice, I finally completed that dance."},{"ko":"친구의 거짓말을 결국 알아 냈어요.","en":"I finally found out my friend's lie."},{"ko":"뜨거운 햇볕을 참아 내고 일을 마쳤어요.","en":"I endured the hot sun and finished the work."},{"ko":"혼자서 이사를 해 냈다니 정말 대단해요.","en":"You managed the move all by yourself, that's amazing."},{"ko":"포기하고 싶었지만 끝까지 버텨 냈어요.","en":"I wanted to give up, but I held out to the end."}],"why":"Look for difficulty and effort (끝까지, 드디어, 어렵지만, 힘든) and a successful outcome that the subject achieved on their own.","hlShow":"[가-힣]\\s(?:내(?:다|고|서|면|야|는|지|어|었)|냈)[가-힣]*"},{"id":"g4-1","ch":4,"part":"읽기 I","title":"A/V-(으)ㄹ 정도로","star":1,"form":"형용사/동사 + -(으)ㄹ 정도로","pattern":"A/V-(으)ㄹ 정도로 + 결과·상태","rule":"앞의 상태나 행동이 뒤의 결과나 상태에 이를 만큼 심하다는 것을 나타낸다.","meaning":"So ... that ...; to the extent that .... The first clause names a state or action, and the second gives a vivid result or image that shows how strong it is.","use":"Attach -ㄹ to a vowel stem and -을 to a consonant stem (ㄹ stems stay as they are: 울 정도로); for the past use -았/었을 정도로. The second clause is a concrete or exaggerated result (눈물이 날, 믿기 어려울, 숨이 막힐), so it is common in stories and complaints. It can also end a sentence: -(으)ㄹ 정도이다. Typical mistake: using it as a reason ('because'). 정도로 shows degree, not cause, and the second clause is a state or event, not a command or suggestion.","table":{"head":["","형용사","동사"],"rows":[["받침 없음","크다 → 클 정도로","자다 → 잘 정도로"],["받침 있음","좁다 → 좁을 정도로","먹다 → 먹을 정도로"],["ㄹ 받침","길다 → 길 정도로","울다 → 울 정도로"],["과거","예뻤을 정도로","울었을 정도로"]]},"examples":[{"ko":"설문 조사 결과가 믿기 어려울 정도로 놀라웠어요.","en":"The survey results were so surprising that they were hard to believe."},{"ko":"한국 사람들은 처음 만난 사람에게도 밥을 사 줄 정도로 정이 많아요.","en":"Koreans are so warm-hearted that they will even buy a meal for someone they have just met."},{"ko":"어제는 눕자마자 잠이 들 정도로 피곤했어요.","en":"Yesterday I was so tired that I fell asleep the moment I lay down."}],"notes":[{"kind":"주의","ko":"'-(으)ㄹ 정도로'는 이유가 아니라 정도를 나타낸다. '-아/어서'처럼 원인으로 바꿔 쓰면 뜻이 달라지고, 뒤에는 보통 명령이나 청유를 쓰지 않는다.","en":"정도로 shows degree, not reason, so it is not interchangeable with -아/어서 ('because'). The second clause also rarely takes a command or a suggestion."},{"kind":"tip","ko":"문장 끝에서는 '-(으)ㄹ 정도이다'로 쓴다. 예: 눈물이 날 정도예요. '죽을 정도로 힘들다'는 자주 쓰는 과장 표현이다.","en":"At the end of a sentence it becomes -(으)ㄹ 정도이다: '눈물이 날 정도예요' (it is to the point of tears). '죽을 정도로 힘들다' is a very common exaggeration."}],"practice":[{"q":"피곤하다 / 쓰러지다","a":"쓰러질 정도로 피곤했어요.","en":"I was so tired that I nearly collapsed."},{"q":"MBTI 결과가 정확하다 / 놀라다","a":"MBTI 결과가 놀랄 정도로 정확했어요.","en":"The MBTI result was so accurate that I was amazed."},{"q":"출산율이 낮다 / 걱정되다","a":"출산율이 걱정될 정도로 낮아요.","en":"The birth rate is so low that it is worrying."},{"q":"배가 고프다 / 아무거나 맛있게 먹다","a":"아무거나 맛있게 먹을 정도로 배가 고팠어요.","en":"I was so hungry that I could happily eat anything."}],"hl":"(?:[갈갤걀걜걸겔결곌골괄괠괼굘굴궐궬귈귤글긜길깔깰꺌꺨껄껠껼꼘꼴꽐꽬꾈꾤꿀꿜꿸뀔뀰끌끨낄날낼냘냴널넬녈녤놀놜놸뇔뇰눌눨뉄뉠뉼늘늴닐달댈댤덀덜델뎔뎰돌돨됄될됼둘둴뒐뒬듈들딀딜딸땔땰떌떨뗄뗠뗼똘똴뙐뙬뚈뚤뛀뛜뛸뜔뜰띌띨랄랠랼럘럴렐렬롈롤뢀뢜뢸룔룰뤌뤨륄률를릘릴말맬먈먤멀멜멸몔몰뫌뫨묄묠물뭘뭴뮐뮬믈믤밀발밸뱔뱰벌벨별볠볼봘봴뵐뵬불붤뷀뷜뷸블븰빌빨뺄뺠뺼뻘뻴뼐뼬뽈뽤뾀뾜뾸뿔뿰쀌쀨쁄쁠쁼삘살샐샬섈설셀셜셸솔솰쇌쇨숄술숼쉘쉴슐슬싈실쌀쌜쌸썔썰쎌쎨쏄쏠쏼쐘쐴쑐쑬쒈쒤쓀쓜쓸씔씰알앨얄얠얼엘열옐올왈왤욀욜울월웰윌율을읠일잘잴쟐쟬절젤졀졜졸좔좰죌죨줄줠줼쥘쥴즐즬질짤쨀쨜쨸쩔쩰쪌쪨쫄쫠쫼쬘쬴쭐쭬쮈쮤쯀쯜쯸찔찰챌챨첄철첼쳘쳴촐촬쵈쵤춀출춸췔췰츌츨칄칠칼캘캴컐컬켈켤콀콜콸쾔쾰쿌쿨퀄퀠퀼큘클킐킬탈탤턀턜털텔텰톌톨퇄퇠퇼툘툴퉐퉬튈튤틀틜틸팔팰퍌퍨펄펠펼폘폴퐐퐬푈푤풀풜풸퓔퓰플픨필할핼햘햴헐헬혈혤홀활홸횔횰훌훨휄휠휼흘흴힐]) 정도로","drill":[{"ko":"시험이 포기하고 싶을 정도로 어려웠어요.","en":"The exam was so hard that I wanted to give up."},{"ko":"그 영화는 눈물이 날 정도로 슬퍼요.","en":"That movie is so sad that I cry."},{"ko":"우리 팀장님은 모두가 부러워할 정도로 일을 잘해요.","en":"Our team leader works so well that everyone envies her."},{"ko":"내 친구는 밤을 새울 정도로 게임을 좋아해요.","en":"My friend likes games so much that he stays up all night."},{"ko":"사람이 너무 많아서 걸을 수 없을 정도로 붐볐어요.","en":"It was so crowded that you could hardly walk."},{"ko":"요즘 한국 아이들은 쉴 시간이 없을 정도로 바빠요.","en":"These days Korean children are so busy that they have no time to rest."},{"ko":"그 가수는 길에서 알아볼 정도로 유명해요.","en":"That singer is famous enough to be recognised on the street."},{"ko":"한여름에는 숨이 막힐 정도로 더워요.","en":"In midsummer it is so hot that you can hardly breathe."},{"ko":"동생은 말을 못 할 정도로 부끄러움을 많이 타요.","en":"My younger brother is so shy that he cannot even speak."},{"ko":"어머니는 식당 음식보다 맛있을 정도로 솜씨가 좋으세요.","en":"My mother cooks so well that her food is tastier than a restaurant's."}],"why":"Look for a description of how strong a state is, followed by a vivid result or image (could cry, hard to believe, cannot walk); 'so ... that ...' fits in English.","hlShow":"(?:[갈갤걀걜걸겔결곌골괄괠괼굘굴궐궬귈귤글긜길깔깰꺌꺨껄껠껼꼘꼴꽐꽬꾈꾤꿀꿜꿸뀔뀰끌끨낄날낼냘냴널넬녈녤놀놜놸뇔뇰눌눨뉄뉠뉼늘늴닐달댈댤덀덜델뎔뎰돌돨됄될됼둘둴뒐뒬듈들딀딜딸땔땰떌떨뗄뗠뗼똘똴뙐뙬뚈뚤뛀뛜뛸뜔뜰띌띨랄랠랼럘럴렐렬롈롤뢀뢜뢸룔룰뤌뤨륄률를릘릴말맬먈먤멀멜멸몔몰뫌뫨묄묠물뭘뭴뮐뮬믈믤밀발밸뱔뱰벌벨별볠볼봘봴뵐뵬불붤뷀뷜뷸블븰빌빨뺄뺠뺼뻘뻴뼐뼬뽈뽤뾀뾜뾸뿔뿰쀌쀨쁄쁠쁼삘살샐샬섈설셀셜셸솔솰쇌쇨숄술숼쉘쉴슐슬싈실쌀쌜쌸썔썰쎌쎨쏄쏠쏼쐘쐴쑐쑬쒈쒤쓀쓜쓸씔씰알앨얄얠얼엘열옐올왈왤욀욜울월웰윌율을읠일잘잴쟐쟬절젤졀졜졸좔좰죌죨줄줠줼쥘쥴즐즬질짤쨀쨜쨸쩔쩰쪌쪨쫄쫠쫼쬘쬴쭐쭬쮈쮤쯀쯜쯸찔찰챌챨첄철첼쳘쳴촐촬쵈쵤춀출춸췔췰츌츨칄칠칼캘캴컐컬켈켤콀콜콸쾔쾰쿌쿨퀄퀠퀼큘클킐킬탈탤턀턜털텔텰톌톨퇄퇠퇼툘툴퉐퉬튈튤틀틜틸팔팰퍌퍨펄펠펼폘폴퐐퐬푈푤풀풜풸퓔퓰플픨필할핼햘햴헐헬혈혤홀활홸횔횰훌훨휄휠휼흘흴힐]) 정도로"},{"id":"g4-2","ch":4,"part":"읽기 II","title":"A/V-기만 하다","star":1,"form":"동사/형용사 + -기만 하다","pattern":"V-기만 하다 / A-기만 하다","rule":"다른 행동은 하지 않고 그것만 한다는 뜻, 또는 다른 면은 없이 그 상태일 뿐이라는 뜻을 나타낸다.","meaning":"Only does ... (and nothing else); is nothing but .... The speaker stresses that one action or state is all there is, often as a complaint or a contrast.","use":"Attach -기만 to a verb or adjective stem and finish with a conjugated 하다: 먹기만 해요, 좋기만 하다, 놀기만 했어요. It often leads into a contrast: 듣기만 하고 말은 안 해요 (only listens, never speaks), 예쁘기만 하고 쓸모가 없어요. Compare N만 V: 책만 읽어요 limits the object (only books), while 읽기만 하다 limits the whole action (only reads, does nothing else). Do not mix it up with -기만 하면 ('as soon as / as long as you just ...').","table":null,"examples":[{"ko":"요즘 아이들은 학원에 다니기만 하고 친구들과 놀 시간이 없어요.","en":"These days children just go to cram schools and have no time to play with friends."},{"ko":"동생은 집에 오면 게임을 하기만 해서 걱정이에요.","en":"When my younger brother comes home he does nothing but play games, so I am worried."},{"ko":"그 식당은 가격이 비싸기만 하고 맛은 별로예요.","en":"That restaurant is only expensive, and the food is nothing special."}],"notes":[{"kind":"주의","ko":"'책만 읽어요'는 읽는 대상이 책뿐이라는 뜻이고, '책을 읽기만 해요'는 읽는 것 말고는 아무것도 하지 않는다는 뜻이다.","en":"'책만 읽어요' limits the object (only books); '책을 읽기만 해요' limits the action (only reads and does nothing else)."},{"kind":"tip","ko":"뒤에 '-고', '-(으)ㄴ/는데', '-지 않다'를 이어서 대조를 만든다. 예: 보기만 하고 사지는 않아요.","en":"Add a contrast with -고, -(으)ㄴ/는데 or -지 않다: '보기만 하고 사지는 않아요' (just looks, does not buy)."}],"practice":[{"q":"주말 / 하루 종일 자다","a":"주말에는 하루 종일 자기만 했어요.","en":"At the weekend I only slept all day."},{"q":"내성적인 친구 / 이야기를 듣다","a":"내성적인 친구는 이야기를 듣기만 해요.","en":"My introverted friend only listens to the conversation."},{"q":"가방 / 예쁘다 / 쓸모없다","a":"이 가방은 예쁘기만 하고 쓸모가 없어요.","en":"This bag is only pretty and is of no use."},{"q":"동생 / 방학 동안 놀다","a":"동생은 방학 동안 놀기만 했어요.","en":"My younger brother did nothing but play during the vacation."}],"hl":"기만 (?:하|해|했|한|합)","drill":[{"ko":"우리 아이는 스마트폰을 보기만 하고 책은 읽지 않아요.","en":"My child only looks at the smartphone and does not read books."},{"ko":"그 사람은 불평하기만 하고 아무것도 하려고 하지 않아요.","en":"He only complains and does not try to do anything."},{"ko":"시험 기간에는 외우기만 해서 이해한 것이 별로 없어요.","en":"During exams I only memorised, so I understood very little."},{"ko":"남편은 주말마다 텔레비전을 보기만 해요.","en":"My husband only watches TV every weekend."},{"ko":"이 노트북은 크기만 하고 성능이 좋지 않아요.","en":"This laptop is only big and its performance is not good."},{"ko":"그는 계획을 말하기만 하고 실행하지는 않아요.","en":"He only talks about plans and does not carry them out."},{"ko":"회의에서 아무 의견도 내지 않고 듣기만 했어요.","en":"In the meeting I offered no opinion and just listened."},{"ko":"요즘 취직이 어려워서 걱정하기만 하는 친구가 많아요.","en":"Many friends do nothing but worry because jobs are hard to find."},{"ko":"그 영화는 길기만 하고 재미가 없었어요.","en":"That movie was just long and not fun."},{"ko":"아기는 낮에 자기만 하고 밤에는 안 자요.","en":"The baby only sleeps during the day and does not sleep at night."}],"why":"Look for a contrast: one action or quality is all that happens, and the expected action or quality is missing (-고 ... 안 하다 / -지 않다 / 없다).","hlShow":"기만 (?:하|해|했|한|합)"},{"id":"g4-3","ch":4,"part":"읽기 II","title":"뭔가 / 누군가 / 어딘가 / 언젠가 ~","star":1,"form":"의문사 + -(인)가: 무엇→뭔가, 누구→누군가, 어디→어딘가, 언제→언젠가, 왜→왠지","pattern":"뭔가 / 누군가 / 어딘가 / 언젠가 / 왠지 + V/A","rule":"무엇인지, 누구인지, 어디인지, 언제인지 분명하지 않거나 말하지 않을 때 쓴다.","meaning":"Something / someone / somewhere / some day: the thing, person, place or time is not clear or not specified. 왠지 means 'for some reason'.","use":"These are question words + -인가 in contracted form: 무엇인가 → 뭔가 (무언가 in writing), 누구인가 → 누군가, 어디인가 → 어딘가, 언제인가 → 언젠가, 왜인지 → 왠지. They are used in statements and sit right before the verb or adjective: 뭔가 이상해요 (something is odd), 누군가 왔어요 (someone came). Particles are optional: 뭔가를, 누군가가, 어딘가에서. 언젠가 can point to the past ('once') or the future ('some day'). 왠지 goes with a feeling you cannot explain: 왠지 불안해요.","table":{"head":["의문사","줄임 형태","뜻"],"rows":[["무엇","뭔가 (무언가)","something"],["누구","누군가","someone"],["어디","어딘가","somewhere"],["언제","언젠가","some day / once"],["왜","왠지","for some reason"]]},"examples":[{"ko":"요즘 뭔가 새로운 취미를 시작하고 싶어요.","en":"Lately I want to start some new hobby."},{"ko":"누군가 내 이름을 부르는 소리가 들려서 뒤를 돌아봤어요.","en":"I heard someone calling my name, so I turned around."},{"ko":"졸업하면 언젠가 한국에서 일해 보고 싶어요.","en":"After I graduate I want to work in Korea some day."}],"notes":[{"kind":"주의","ko":"'왠지'(왜 + 인지)가 맞고 '웬지'는 틀린 철자이다. '웬일', '웬만하면'에는 '웬'을 쓴다.","en":"The correct spelling is 왠지 (왜 + 인지); 웬지 is wrong. (웬일 and 웬만하면 do use 웬.)"},{"kind":"tip","ko":"'어딘가 이상하다'는 '어딘지 모르게 이상하다'와 같은 뜻으로, 정확히 짚을 수 없는 느낌을 말할 때 자주 쓴다.","en":"'어딘가 이상하다' means 'somehow strange': it describes a feeling you cannot pin down. 뭔가 이상하다 works the same way."}],"practice":[{"q":"새로운 것 / 배우다","a":"퇴근 후에 뭔가 새로운 것을 배우고 싶어요.","en":"After work I want to learn something new."},{"q":"누가 / 전화하다","a":"누군가 어젯밤에 저에게 전화를 했어요.","en":"Someone called me last night."},{"q":"고양이 / 어디 / 숨어 있다","a":"고양이가 어딘가에 숨어 있는 것 같아요.","en":"The cat seems to be hiding somewhere."},{"q":"우리 / 언제 / 다시 만나다","a":"우리는 언젠가 다시 만날 거예요.","en":"We will meet again some day."}],"hl":"뭔가|무언가|누군가|어딘가|언젠가|왠지","drill":[{"ko":"이 방에는 뭔가 이상한 냄새가 나요.","en":"There is some strange smell in this room."},{"ko":"누군가 제 우산을 가져간 것 같아요.","en":"It seems that someone took my umbrella."},{"ko":"어딘가에 제 지갑을 두고 온 것 같은데 기억이 안 나요.","en":"I think I left my wallet somewhere, but I cannot remember."},{"ko":"언젠가 꼭 제주도에서 살아 보고 싶어요.","en":"Some day I definitely want to live on Jeju Island."},{"ko":"왠지 오늘은 좋은 일이 생길 것 같아요.","en":"For some reason I feel something good will happen today."},{"ko":"시험을 앞두고 뭔가 불안해서 잠을 잘 수 없었어요.","en":"Before the exam I felt uneasy about something and could not sleep."},{"ko":"어제 길에서 누군가에게 길을 물어봤는데 친절하게 알려 주었어요.","en":"Yesterday I asked someone for directions on the street and they kindly told me."},{"ko":"우리 집 근처 어딘가에 맛있는 빵집이 있다고 들었어요.","en":"I heard there is a tasty bakery somewhere near my house."},{"ko":"언젠가 부모님께 효도하고 싶어요.","en":"Some day I want to repay my parents' kindness."},{"ko":"면접 때 뭔가 실수한 것 같아서 마음이 편하지 않아요.","en":"I feel I made some mistake in the interview, so I am not at ease."}],"why":"The speaker does not know or does not say the exact thing, person, place or time, and English 'some-' (something, someone, somewhere, some day) or 'for some reason' fits.","hlShow":"뭔가|무언가|누군가|어딘가|언젠가|왠지"},{"id":"g4-4","ch":4,"part":"읽기 II","title":"V-(으)ㅁ으로써 ~","star":0,"form":"동사 + -(으)ㅁ으로써","pattern":"V-(으)ㅁ으로써 + 결과","rule":"앞의 행동이 뒤의 결과를 이루는 수단이나 방법임을 나타낸다. 주로 글에서 쓴다.","meaning":"By doing ...; through doing ... (formal written style). The first clause is the means or method by which the result in the second clause is reached.","use":"Attach -ㅁ to a vowel stem and -음 to a consonant stem, then 으로써: 하다 → 함으로써, 읽다 → 읽음으로써. ㄹ stems replace ㄹ with ㅁ: 알다 → 앎으로써. It appears in essays, news, speeches and reports, usually with a result such as -(으)ㄹ 수 있다, 높이다, 줄이다, 해결하다. In speech, use -아/어서 or -(으)면 instead. Do not confuse 으로써 (means) with 으로서 (status, as in 학생으로서) or -(으)므로 ('because').","table":{"head":["","받침 없음","받침 있음","ㄹ 받침"],"rows":[["동사 예 1","하다 → 함으로써","읽다 → 읽음으로써","알다 → 앎으로써"],["동사 예 2","보내다 → 보냄으로써","얻다 → 얻음으로써","살다 → 삶으로써"]]},"examples":[{"ko":"정부는 출산 장려금을 지급함으로써 저출산 문제를 해결하려고 한다.","en":"By paying childbirth incentives, the government intends to solve the low birth rate problem."},{"ko":"우리는 서로의 이야기를 들음으로써 정을 쌓아 갈 수 있다.","en":"By listening to each other's stories we can build up jeong."},{"ko":"그는 매일 운동을 함으로써 건강을 되찾았다.","en":"By exercising every day he regained his health."}],"notes":[{"kind":"주의","ko":"'으로써'는 수단·방법, '으로서'는 자격이나 신분이다. 예: 칼로써 자르다(수단) / 학생으로서 공부하다(자격). 이 둘을 바꿔 쓰는 것은 흔한 실수이다.","en":"으로써 marks a means (칼로써 자르다, 'cut with a knife'); 으로서 marks a status (학생으로서, 'as a student'). Mixing them up is a very common mistake."},{"kind":"tip","ko":"격식 있는 글에서 쓰는 표현이다. 말할 때는 '-아/어서', '-(으)면'이 더 자연스럽다. 예: 운동을 해서 건강해졌어요.","en":"It belongs to formal writing. In conversation -아/어서 or -(으)면 sounds more natural: '운동을 해서 건강해졌어요'."}],"practice":[{"q":"조기 유학을 보내다 / 외국어 실력을 높이다","a":"조기 유학을 보냄으로써 외국어 실력을 높일 수 있다.","en":"By sending children abroad early, one can raise their foreign-language ability."},{"q":"서로의 성격을 이해하다 / 갈등을 줄이다","a":"서로의 성격을 이해함으로써 갈등을 줄일 수 있다.","en":"By understanding each other's personality we can reduce conflict."},{"q":"매일 일기를 쓰다 / 생각을 정리하다","a":"매일 일기를 씀으로써 생각을 정리할 수 있다.","en":"By writing a diary every day you can organise your thoughts."},{"q":"끊임없이 노력하다 / 꿈을 이루다","a":"끊임없이 노력함으로써 꿈을 이룰 수 있었다.","en":"By making constant efforts he was able to achieve his dream."}],"hl":"(?:[감갬걈걤검겜겸곔곰괌괨굄굠굼궘궴귐귬금긤김깜깸꺔꺰껌껨꼄꼠꼼꽘꽴꾐꾬꿈꿤뀀뀜뀸끔끰낌남냄냠냼넘넴념녬놈놤뇀뇜뇸눔눰뉌뉨늄늠늼님담댐댬덈덤뎀뎜뎸돔돰됌됨둄둠둼뒘뒴듐듬딈딤땀땜땸떔떰뗌뗨똄똠똼뙘뙴뚐뚬뛈뛤뜀뜜뜸띔띰람램럄럠럼렘렴롐롬뢈뢤룀룜룸뤔뤰륌륨름릠림맘맴먐먬멈멤몀몜몸뫔뫰묌묨뭄뭠뭼뮘뮴믐믬밈밤뱀뱜뱸범벰볌볨봄봠봼뵘뵴붐붬뷈뷤븀븜븸빔빰뺌뺨뻄뻠뻼뼘뼴뽐뽬뾈뾤뿀뿜뿸쀔쀰쁌쁨삄삠삼샘샴섐섬셈셤솀솜솸쇔쇰숌숨쉄쉠쉼슘슴싐심쌈쌤썀썜썸쎔쎰쏌쏨쐄쐠쐼쑘쑴쒐쒬쓈쓤씀씜씸암앰얌얨엄엠염옘옴왐왬욈욤움웜웸윔윰음읨임잠잼쟘쟴점젬졈졤좀좜좸죔죰줌줨쥄쥠쥼즘즴짐짬쨈쨤쩀쩜쩸쪔쪰쫌쫨쬄쬠쬼쭘쭴쮐쮬쯈쯤찀찜참챔챰첌첨쳄쳠쳼촘촴쵐쵬춈춤췀췜췸츔츰칌침캄캠캼컘컴켐켬콈콤쾀쾜쾸쿔쿰퀌퀨큄큠큼킘킴탐탬턈턤텀템텸톔톰퇌퇨툄툠툼퉘퉴튐튬틈틤팀팜팸퍔퍰펌펨폄폠폼퐘퐴푐푬품풤퓀퓜퓸픔픰핌함햄햠햼험헴혐혬홈홤횀횜횸훔훰휌휨흄흠흼힘])으로써","drill":[{"ko":"에너지를 아낌으로써 환경을 보호할 수 있다.","en":"By saving energy we can protect the environment."},{"ko":"충분히 잠을 잠으로써 피로를 풀 수 있습니다.","en":"By getting enough sleep you can relieve fatigue."},{"ko":"이웃과 인사를 나눔으로써 마을의 분위기가 달라졌다.","en":"By exchanging greetings with neighbours, the atmosphere of the village changed."},{"ko":"회사는 근무 시간을 줄임으로써 직원들의 만족도를 높였다.","en":"The company raised employee satisfaction by shortening working hours."},{"ko":"정부는 보육 시설을 늘림으로써 부모들의 부담을 덜어 주려고 한다.","en":"By increasing childcare facilities, the government intends to ease the burden on parents."},{"ko":"우리는 책을 읽음으로써 다른 사람의 경험을 배울 수 있다.","en":"By reading books we can learn from other people's experiences."},{"ko":"서로 대화를 나눔으로써 오해를 풀 수 있었다.","en":"By talking with each other we were able to clear up the misunderstanding."},{"ko":"그는 어려운 일을 참고 견딤으로써 성공했다.","en":"He succeeded by enduring and getting through difficult things."},{"ko":"지원자의 성격 유형을 파악함으로써 알맞은 업무를 맡길 수 있다.","en":"By identifying an applicant's personality type we can assign suitable work."},{"ko":"학생들이 직접 경험함으로써 이론을 더 잘 이해하게 되었다.","en":"By experiencing it themselves, the students came to understand the theory better."}],"why":"A formal, written sentence presents one action as the way a result is reached, and the result clause is something like 'can ...' or 'raised/reduced ...'; English 'by -ing' fits.","hlShow":"(?:[감갬걈걤검겜겸곔곰괌괨굄굠굼궘궴귐귬금긤김깜깸꺔꺰껌껨꼄꼠꼼꽘꽴꾐꾬꿈꿤뀀뀜뀸끔끰낌남냄냠냼넘넴념녬놈놤뇀뇜뇸눔눰뉌뉨늄늠늼님담댐댬덈덤뎀뎜뎸돔돰됌됨둄둠둼뒘뒴듐듬딈딤땀땜땸떔떰뗌뗨똄똠똼뙘뙴뚐뚬뛈뛤뜀뜜뜸띔띰람램럄럠럼렘렴롐롬뢈뢤룀룜룸뤔뤰륌륨름릠림맘맴먐먬멈멤몀몜몸뫔뫰묌묨뭄뭠뭼뮘뮴믐믬밈밤뱀뱜뱸범벰볌볨봄봠봼뵘뵴붐붬뷈뷤븀븜븸빔빰뺌뺨뻄뻠뻼뼘뼴뽐뽬뾈뾤뿀뿜뿸쀔쀰쁌쁨삄삠삼샘샴섐섬셈셤솀솜솸쇔쇰숌숨쉄쉠쉼슘슴싐심쌈쌤썀썜썸쎔쎰쏌쏨쐄쐠쐼쑘쑴쒐쒬쓈쓤씀씜씸암앰얌얨엄엠염옘옴왐왬욈욤움웜웸윔윰음읨임잠잼쟘쟴점젬졈졤좀좜좸죔죰줌줨쥄쥠쥼즘즴짐짬쨈쨤쩀쩜쩸쪔쪰쫌쫨쬄쬠쬼쭘쭴쮐쮬쯈쯤찀찜참챔챰첌첨쳄쳠쳼촘촴쵐쵬춈춤췀췜췸츔츰칌침캄캠캼컘컴켐켬콈콤쾀쾜쾸쿔쿰퀌퀨큄큠큼킘킴탐탬턈턤텀템텸톔톰퇌퇨툄툠툼퉘퉴튐튬틈틤팀팜팸퍔퍰펌펨폄폠폼퐘퐴푐푬품풤퓀퓜퓸픔픰핌함햄햠햼험헴혐혬홈홤횀횜횸훔훰휌휨흄흠흼힘])으로써"},{"id":"g5-1","ch":5,"part":"읽기 II","title":"N만큼","star":1,"form":"명사 + 만큼","pattern":"N만큼 + A/V","rule":"앞의 명사와 비슷한 정도나 양임을 나타낸다.","meaning":"As much as N; to the same degree as N. It says that something is equal to N in size, amount or degree.","use":"Attach 만큼 directly to a noun, with no space: 나만큼, 서울만큼, 아이를 키우는 일만큼. The second part is usually an adjective or a verb that shows degree: 나만큼 키가 크다 (as tall as me). For 'not as ... as', use a negative: 나만큼 크지 않다 / 못하다. After a verb or adjective + modifier, 만큼 is a spaced noun meaning 'in proportion to': 노력한 만큼, 먹을 만큼. Compare N처럼 (like N, in manner), N보다 (more than N), N만 (only N).","table":null,"examples":[{"ko":"한국 사람만큼 정이 많은 사람들도 드물어요.","en":"There are few people as warm-hearted as Koreans."},{"ko":"저는 형만큼 내성적이지는 않아요.","en":"I am not as introverted as my older brother."},{"ko":"아이를 키우는 일만큼 보람 있는 일은 없어요.","en":"There is no work as rewarding as raising a child."}],"notes":[{"kind":"tip","ko":"동사나 형용사 뒤에서는 띄어 쓴다: 노력한 만큼, 먹을 만큼 (그 정도에 맞게). 명사 뒤에서만 붙여 쓴다.","en":"After a verb or adjective, 만큼 is written with a space: 노력한 만큼, 먹을 만큼 ('in proportion to'). It is attached only after a noun."},{"kind":"주의","ko":"'만'(only)과 헷갈리지 말자. 형만 커요 = 형만 크다 / 형만큼 커요 = 형과 비슷하게 크다. '보다'는 차이를, '만큼'은 같은 정도를 나타낸다.","en":"Do not confuse 만큼 with 만 ('only'): 형만 커요 = only my brother is big; 형만큼 커요 = as big as my brother. 보다 ('than') marks a difference, 만큼 marks equality."}],"practice":[{"q":"민수 / 키가 크다","a":"제 동생은 민수만큼 키가 커요.","en":"My younger brother is as tall as Minsu."},{"q":"엄마 / 요리를 잘하다 (못하다)","a":"저는 엄마만큼 요리를 잘하지 못해요.","en":"I cannot cook as well as my mother."},{"q":"서울 / 물가가 비싸다","a":"부산도 서울만큼 물가가 비싸요.","en":"Prices in Busan are as high as in Seoul."},{"q":"영어 / 한국어 / 중요하다","a":"한국어도 영어만큼 중요해요.","en":"Korean is as important as English."}],"hl":"만큼","drill":[{"ko":"한국 학생들만큼 열심히 공부하는 나라도 드물어요.","en":"Few countries study as hard as Korean students."},{"ko":"저는 언니만큼 성격이 활발하지 않아요.","en":"I am not as lively as my older sister."},{"ko":"이번 시험은 지난번만큼 어렵지 않았어요.","en":"This exam was not as hard as the last one."},{"ko":"사랑하는 사람만큼 소중한 것은 없어요.","en":"Nothing is as precious as the person you love."},{"ko":"그 가수만큼 노래를 잘하는 사람은 별로 없어요.","en":"There are not many people who sing as well as that singer."},{"ko":"내 친구는 나만큼 외향적이에요.","en":"My friend is as extroverted as I am."},{"ko":"요즘은 아이만큼 부모도 스트레스를 받아요.","en":"Nowadays parents get as stressed as children."},{"ko":"서울만큼 대중교통이 편리한 도시도 많지 않아요.","en":"There are not many cities with public transport as convenient as Seoul's."},{"ko":"이 일은 월급만큼 보람도 있어요.","en":"This job is as rewarding as it is well paid."},{"ko":"우리 팀장님만큼 꼼꼼한 사람은 처음 봤어요.","en":"I have never seen anyone as meticulous as our team leader."}],"why":"Two things are set side by side and judged at the same level (or 'not as ... as'); 'as ... as N' in English fits, and an adjective of degree usually follows.","hlShow":"만큼"},{"id":"g5-2","ch":5,"part":"읽기 II","title":"V-(으)ㄹ 필요 / 기회 / 계획 / 예정 / 가능성 ~","star":1,"form":"동사 + -(으)ㄹ + 필요 / 기회 / 계획 / 예정 / 가능성","pattern":"V-(으)ㄹ 필요·기회·계획·예정·가능성 + 이/가 있다·없다","rule":"동사에 -(으)ㄹ을 붙여 뒤의 명사(필요, 기회, 계획, 예정, 가능성 등)를 꾸민다.","meaning":"The need / chance / plan / schedule / possibility of doing .... A verb in the -(으)ㄹ form describes the noun that follows.","use":"V stem + -ㄹ/-을 + noun, then usually 이/가 있다·없다 or -이다: 갈 필요가 없다 (no need to go), 말할 기회가 생겼다, 떠날 계획이다, 출발할 예정입니다, 비가 올 가능성이 높다. 계획 is what you intend; 예정 is a fixed schedule and sounds formal (announcements, news). 가능성 goes with 있다/없다/높다/낮다. 필요 is often negative: -(으)ㄹ 필요가 없다 = 'there is no need to'. Adjectives can also take 가능성 (비쌀 가능성).","table":{"head":["명사","뜻","자주 쓰는 말"],"rows":[["필요","need","-(으)ㄹ 필요가 있다 / 없다"],["기회","chance","-(으)ㄹ 기회가 있다 / 생기다 / 놓치다"],["계획","plan","-(으)ㄹ 계획이다 / 계획을 세우다"],["예정","schedule","-(으)ㄹ 예정이다"],["가능성","possibility","-(으)ㄹ 가능성이 있다 / 높다 / 낮다"]]},"examples":[{"ko":"조기 유학을 보낼 필요가 있는지 부모들 사이에서도 의견이 달라요.","en":"Even among parents, opinions differ on whether there is a need to send children abroad early."},{"ko":"저는 내년에 대학원에 진학할 계획이에요.","en":"I plan to go on to graduate school next year."},{"ko":"이번 주말에는 비가 올 가능성이 높아요.","en":"There is a high chance of rain this weekend."}],"notes":[{"kind":"tip","ko":"'계획'은 내가 하려고 마음먹은 일이고, '예정'은 이미 정해진 일정이다. 그래서 공지나 뉴스에서는 '예정'을 자주 쓴다.","en":"계획 is what you have decided to do; 예정 is an already fixed schedule, so it is common in announcements and news."},{"kind":"주의","ko":"'-(으)ㄹ 필요가 없다'는 '그럴 필요가 없다'는 뜻으로 '-지 않아도 되다'와 비슷하다. '가능성'은 '있다·없다·높다·낮다'와 함께 쓴다.","en":"-(으)ㄹ 필요가 없다 means 'there is no need to' and is close to -지 않아도 되다. 가능성 goes with 있다, 없다, 높다, 낮다."}],"practice":[{"q":"올해 / 한국에서 일하다 / 기회","a":"올해 한국에서 일할 기회가 생겼어요.","en":"This year I got a chance to work in Korea."},{"q":"시간이 많다 / 서두르다 / 필요 없다","a":"시간이 많아서 서두를 필요가 없어요.","en":"There is plenty of time, so there is no need to hurry."},{"q":"두 사람 / 내년에 결혼하다 / 예정","a":"두 사람은 내년에 결혼할 예정이에요.","en":"The two of them are scheduled to marry next year."},{"q":"출산율이 오르다 / 가능성이 낮다","a":"앞으로 출산율이 오를 가능성은 낮아요.","en":"The chance that the birth rate will rise is low."}],"hl":"(?:[갈갤걀걜걸겔결곌골괄괠괼굘굴궐궬귈귤글긜길깔깰꺌꺨껄껠껼꼘꼴꽐꽬꾈꾤꿀꿜꿸뀔뀰끌끨낄날낼냘냴널넬녈녤놀놜놸뇔뇰눌눨뉄뉠뉼늘늴닐달댈댤덀덜델뎔뎰돌돨됄될됼둘둴뒐뒬듈들딀딜딸땔땰떌떨뗄뗠뗼똘똴뙐뙬뚈뚤뛀뛜뛸뜔뜰띌띨랄랠랼럘럴렐렬롈롤뢀뢜뢸룔룰뤌뤨륄률를릘릴말맬먈먤멀멜멸몔몰뫌뫨묄묠물뭘뭴뮐뮬믈믤밀발밸뱔뱰벌벨별볠볼봘봴뵐뵬불붤뷀뷜뷸블븰빌빨뺄뺠뺼뻘뻴뼐뼬뽈뽤뾀뾜뾸뿔뿰쀌쀨쁄쁠쁼삘살샐샬섈설셀셜셸솔솰쇌쇨숄술숼쉘쉴슐슬싈실쌀쌜쌸썔썰쎌쎨쏄쏠쏼쐘쐴쑐쑬쒈쒤쓀쓜쓸씔씰알앨얄얠얼엘열옐올왈왤욀욜울월웰윌율을읠일잘잴쟐쟬절젤졀졜졸좔좰죌죨줄줠줼쥘쥴즐즬질짤쨀쨜쨸쩔쩰쪌쪨쫄쫠쫼쬘쬴쭐쭬쮈쮤쯀쯜쯸찔찰챌챨첄철첼쳘쳴촐촬쵈쵤춀출춸췔췰츌츨칄칠칼캘캴컐컬켈켤콀콜콸쾔쾰쿌쿨퀄퀠퀼큘클킐킬탈탤턀턜털텔텰톌톨퇄퇠퇼툘툴퉐퉬튈튤틀틜틸팔팰퍌퍨펄펠펼폘폴퐐퐬푈푤풀풜풸퓔퓰플픨필할핼햘햴헐헬혈혤홀활홸횔횰훌훨휄휠휼흘흴힐]) (?:필요|기회|계획|예정|가능성)","drill":[{"ko":"이번 방학에 유럽을 여행할 계획이에요.","en":"I plan to travel in Europe this vacation."},{"ko":"그 일은 혼자 할 필요가 없어요. 다 같이 하면 돼요.","en":"You do not need to do that job alone. We can all do it together."},{"ko":"신입 사원이 발표할 기회를 얻었어요.","en":"The new employee got a chance to give a presentation."},{"ko":"회의는 오후 세 시에 시작할 예정입니다.","en":"The meeting is scheduled to start at 3 p.m."},{"ko":"내일 눈이 올 가능성이 있대요.","en":"They say there is a chance of snow tomorrow."},{"ko":"그렇게 걱정할 필요는 없어요.","en":"There is no need to worry that much."},{"ko":"이번에 합격할 가능성은 높지 않아요.","en":"The chance of passing this time is not high."},{"ko":"저는 졸업한 후에 외국에서 공부할 계획이 있어요.","en":"I plan to study abroad after I graduate."},{"ko":"서로의 성격 유형을 이해할 기회가 많아지면 좋겠어요.","en":"I hope we get more chances to understand each other's personality types."},{"ko":"새 학기에는 이사할 예정이라서 요즘 집을 알아보고 있어요.","en":"I am scheduled to move next semester, so I am looking at houses these days."}],"why":"A verb in the -ㄹ/-을 form sits right before one of the nouns 필요, 기회, 계획, 예정 or 가능성, and the sentence says whether that need, chance, plan or possibility exists.","hlShow":"(?:[갈갤걀걜걸겔결곌골괄괠괼굘굴궐궬귈귤글긜길깔깰꺌꺨껄껠껼꼘꼴꽐꽬꾈꾤꿀꿜꿸뀔뀰끌끨낄날낼냘냴널넬녈녤놀놜놸뇔뇰눌눨뉄뉠뉼늘늴닐달댈댤덀덜델뎔뎰돌돨됄될됼둘둴뒐뒬듈들딀딜딸땔땰떌떨뗄뗠뗼똘똴뙐뙬뚈뚤뛀뛜뛸뜔뜰띌띨랄랠랼럘럴렐렬롈롤뢀뢜뢸룔룰뤌뤨륄률를릘릴말맬먈먤멀멜멸몔몰뫌뫨묄묠물뭘뭴뮐뮬믈믤밀발밸뱔뱰벌벨별볠볼봘봴뵐뵬불붤뷀뷜뷸블븰빌빨뺄뺠뺼뻘뻴뼐뼬뽈뽤뾀뾜뾸뿔뿰쀌쀨쁄쁠쁼삘살샐샬섈설셀셜셸솔솰쇌쇨숄술숼쉘쉴슐슬싈실쌀쌜쌸썔썰쎌쎨쏄쏠쏼쐘쐴쑐쑬쒈쒤쓀쓜쓸씔씰알앨얄얠얼엘열옐올왈왤욀욜울월웰윌율을읠일잘잴쟐쟬절젤졀졜졸좔좰죌죨줄줠줼쥘쥴즐즬질짤쨀쨜쨸쩔쩰쪌쪨쫄쫠쫼쬘쬴쭐쭬쮈쮤쯀쯜쯸찔찰챌챨첄철첼쳘쳴촐촬쵈쵤춀출춸췔췰츌츨칄칠칼캘캴컐컬켈켤콀콜콸쾔쾰쿌쿨퀄퀠퀼큘클킐킬탈탤턀턜털텔텰톌톨퇄퇠퇼툘툴퉐퉬튈튤틀틜틸팔팰퍌퍨펄펠펼폘폴퐐퐬푈푤풀풜풸퓔퓰플픨필할핼햘햴헐헬혈혤홀활홸횔횰훌훨휄휠휼흘흴힐]) (?:필요|기회|계획|예정|가능성)"},{"id":"g5-3","ch":5,"part":"읽기 II","title":"A/V-다는 듯이 ~","star":1,"form":"형용사/동사/-이다 + -다는 듯이 (간접화법 어미 + 듯이)","pattern":"A/V-(ㄴ/는)다는 듯이 + 행동","rule":"말로 하지는 않지만 마치 그렇다고 말하는 것처럼 행동하거나 표정을 짓는다는 뜻을 나타낸다.","meaning":"As if to say ...; acting as though one were saying '...'. A person shows a thought through a look or a gesture without saying it aloud.","use":"It is an indirect-quotation ending + 는 듯이: adjective -다는, verb -(ㄴ/는)다는, noun (이)라는, question -(느)냐는, suggestion -자는, command -(으)라는. Past is -았/었다는 듯이 and future/guess is -(으)ㄹ 거라는 듯이. The second clause is the person's gesture or expression (고개를 끄덕이다, 어깨를 으쓱하다, 쳐다보다, 웃다), often with 마치. Do not confuse it with plain -(으)ㄴ/는 듯이 ('as if, seemingly'), which needs no quotation: 비가 올 듯이 흐려요.","table":{"head":["","형용사","동사","-이다"],"rows":[["평서 (현재)","크다는 듯이","간다는 듯이","학생이라는 듯이"],["부정","크지 않다는 듯이","가지 않는다는 듯이","학생이 아니라는 듯이"],["과거","컸다는 듯이","갔다는 듯이","학생이었다는 듯이"],["미래·추측","클 거라는 듯이","갈 거라는 듯이","학생일 거라는 듯이"],["의문","크냐는 듯이","가냐는 듯이","학생이냐는 듯이"],["청유","-","가자는 듯이","-"],["명령","-","가라는 듯이","-"]]},"examples":[{"ko":"아이는 내 말을 다 알아들었다는 듯이 고개를 끄덕였다.","en":"The child nodded as if to say he had understood everything I said."},{"ko":"그는 아무 일도 없었다는 듯이 웃으면서 인사했다.","en":"He greeted me with a smile as if nothing had happened."},{"ko":"친구는 왜 이제 왔냐는 듯이 나를 쳐다봤어요.","en":"My friend looked at me as if asking, 'Why have you only come now?'"}],"notes":[{"kind":"주의","ko":"'-다는 듯이'는 말하는 것처럼 행동한다는 뜻이고, '-(으)ㄴ/는 듯이'는 그냥 '~처럼'이다. 예: 비가 올 듯이 흐려요.","en":"-다는 듯이 means 'as if saying that'; plain -(으)ㄴ/는 듯이 only means 'as if / as though': 비가 올 듯이 흐려요 (it is cloudy as if it will rain)."},{"kind":"tip","ko":"'마치 ~다는 듯이'로 쓰면 더 생생하다. 앞의 말은 행동하는 사람이 속으로 하는 말이다.","en":"Adding 마치 makes it vivid: '마치 다 안다는 듯이'. The clause before it is the unspoken words of the
