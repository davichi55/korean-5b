<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Korean 5B — 문법·표현</title>
<meta property="og:title" content="Korean 5B 문법·표현 · Grammar">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="grammar.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-grammar-192.png">
<link rel="icon" href="icon-grammar-192.png">
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:#1c2740; --card2:#223052;
    --line:#2c3a5a; --txt:#eaf0fb; --dim:#96a3c2; --accent:#5b8cff;
    --gold:#ffcf5c; --good:#37d18f; --bad:#ff6b7a; --hl:#ffd98a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.55;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  [lang="zh"]{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
  [lang="zht"]{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
  [lang="th"]{font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif}
  [hidden]{display:none!important}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:5;background:rgba(15,20,32,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;gap:8px;padding:10px 16px 6px;max-width:860px;margin:0 auto}
  .top h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
  .top h1 small{color:var(--dim);font-weight:400;font-size:13px;margin-left:6px}
  .top .home{color:var(--dim);text-decoration:none;font-size:20px;padding:0 4px}
  select,.pill{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;max-width:860px;margin:0 auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:12px;padding:5px 12px;cursor:pointer;font:inherit;font-size:14px;text-align:left;line-height:1.25}
  .tab small{display:block;font-size:11px}
  .tab.on{background:var(--card2);border-color:var(--accent);color:var(--txt)}
  main{max-width:860px;margin:0 auto;padding:12px 16px}
  .chhead{display:flex;align-items:baseline;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
  .chhead h2{margin:0;font-size:22px}
  .chhead .sub{color:var(--dim);font-size:14px}
  .chhead .grow{flex:1}

  .gp{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
  .gphead{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;cursor:pointer}
  .gphead .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px;color:var(--dim)}
  .gphead .ttl{flex:1;min-width:0}
  .gphead .ttl b{font-size:19px;display:block}
  .gphead .ttl .mean{color:var(--dim);font-size:14px}
  .gphead .part{flex:none;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-top:4px}
  .gphead .chev{flex:none;color:var(--dim);transition:.2s;margin-top:4px}
  .gp.open .gphead .chev{transform:rotate(180deg)}
  .gpbody{display:none;padding:0 16px 16px}
  .gp.open .gpbody{display:block}

  .formula{background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:2px 0 10px;font-size:17px}
  .formula .form{color:var(--dim);font-size:13px;margin-bottom:4px}
  .formula .pat{font-weight:600}
  .rule{font-size:15px;margin:0 0 4px}
  .tr{color:var(--dim);font-size:14px}
  .sec{margin-top:14px}
  .sec>h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .ex{padding:8px 12px;border-left:3px solid var(--accent);background:rgba(91,140,255,.06);border-radius:0 10px 10px 0;margin-bottom:6px;cursor:pointer}
  .ex .ko{font-size:16px}
  .ex .tr{margin-top:2px}
  body.hidetr .ex:not(.shown) .tr{display:none}
  body.hidetr .ex:not(.shown) .ko::after{content:" 👁";opacity:.35;font-size:12px}
  mark{background:none;color:var(--hl);font-weight:700;border-bottom:2px solid rgba(255,217,138,.45)}
  .note{border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:14px}
  .note.warn{background:rgba(255,107,122,.09);border:1px solid rgba(255,107,122,.35)}
  .note.tip{background:rgba(255,207,92,.08);border:1px solid rgba(255,207,92,.35)}
  .note .k{font-weight:700;margin-right:6px}
  .note .tr{margin-top:3px}

  .tbl{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{background:var(--bg2);color:var(--dim);font-weight:600}
  td:first-child{font-weight:600}
  tr:last-child td{border-bottom:none}
  .tbl.cover td:not(:first-child):not(.shown){color:transparent;background:var(--card2);cursor:pointer;border-radius:4px;text-shadow:none}
  .tbl.cover td:not(:first-child):not(.shown)::after{content:"?";color:var(--dim);margin-left:-.4em}
  .tbar{display:flex;gap:8px;margin:0 0 6px;flex-wrap:wrap;align-items:center}
  .tbar .tr{flex:1}

  .pr{display:flex;flex-direction:column;gap:4px;padding:9px 12px;background:var(--bg2);border-radius:10px;margin-bottom:6px;border:1px solid transparent}
  .pr .q{font-size:15px}
  .pr .a{font-size:15px;color:var(--good)}
  .pr button{align-self:flex-start}
  .pr.done{border-color:rgba(55,209,143,.35)}
  .pill.small{font-size:12px;padding:3px 10px}
  .aihint{font-size:11px;color:var(--dim);margin-top:4px}

  /* quiz */
  .quiz{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--accent);border-radius:16px;padding:16px;margin-bottom:14px}
  .quiz .qtop{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;margin-bottom:8px}
  .quiz .qs{font-size:19px;margin:6px 0 4px;line-height:1.6}
  .quiz .blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--gold);color:var(--gold);text-align:center}
  .quiz .qen{color:var(--dim);font-size:15px;font-style:italic;margin:2px 0 6px}
  .quiz .qwhy{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:14px;line-height:1.55}
  .quiz .qwhy b{color:var(--gold)}
  .quiz .qmine{margin-top:6px;color:var(--dim)}
  .quiz .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:12px}
  .quiz .opt{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;text-align:left;cursor:pointer}
  .quiz .opt small{display:block;color:var(--dim);font-size:12px}
  .quiz .opt.right{border-color:var(--good);background:rgba(55,209,143,.15)}
  .quiz .opt.wrong{border-color:var(--bad);background:rgba(255,107,122,.12)}
  .quiz .fb{min-height:24px;margin-top:10px;font-size:14px}
  .quiz .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin:24px 0 8px}
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="home" href="./" title="단어장">‹</a>
    <h1>문법·표현 <small>5B</small></h1>
    <button class="pill" id="trBtn"></button>
    <select id="lang" aria-label="Language"></select>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>

<script>
const DATA = {"chapters":[{"n":1,"title":"낮 플레이드"},{"n":3,"title":"낮 플레이드"},{"n":4,"title":"낮 플레이드"},{"n":5,"title":"성격 · 심리 · 사무실"},{"n":6,"title":"저출산 · 교육"},{"n":7,"title":"호칭 · 몸짓언어"},{"n":8,"title":"씨름 그림 · 묘사"}],"points":[{"id":"bg-b020","ch":1,"part":"읽기·말하기","title":"가뜩이나 A-(으)ㄴ데 / V-는데","form":"가뜩이나 + 형용사 -(으)ㄴ데 / 동사 -는데","pattern":"가뜩이나 A/V-(으)ㄴ/는데, ~","rule":"이미 좋지 않은 상황인데 거기에 또 안 좋은 일이 더해질 때 씁니다.","meaning":"'As it is already...' / 'On top of everything else': the situation is already bad, and now something worse is added. The second clause is usually another problem.","use":"Put 가뜩이나 at the start of the first clause and end that clause with -(으)ㄴ데 (adjectives) or -는데 (verbs); the second clause adds the extra bad thing, often with 또, -까지 or 게다가. It is used in speech and writing to complain or show sympathy. It only fits bad or tiring situations, never good news.","examples":[{"ko":"가뜩이나 바쁜데 일이 또 생겼어요.","en":"I'm already busy, and now more work has come up."},{"ko":"가뜩이나 돈이 없는데 지갑까지 잃어버렸어요.","en":"I'm already short of money, and I even lost my wallet."}],"notes":[{"kind":"주의","ko":"가뜩이나 뒤에는 나쁜 상황이 와야 합니다. 좋은 일에는 쓰지 않습니다.","en":"The situation must be a bad one; don't use it for good things, e.g. (×) 가뜩이나 기분이 좋은데…"}],"practice":[{"q":"바쁘다 / 일이 또 생겼다 →","a":"가뜩이나 바쁜데 일이 또 생겼어요.","en":"I'm already busy, and more work has come up."},{"q":"배가 고프다 / 식당이 문을 닫았다 →","a":"가뜩이나 배가 고픈데 식당이 문을 닫았어요.","en":"I'm already hungry, and the restaurant has closed."},{"q":"길이 막히다 / 비까지 오다 →","a":"가뜩이나 길이 막히는데 비까지 와요.","en":"The traffic is already jammed, and it's even raining."},{"q":"감기에 걸렸다 / 시험이 내일이다 →","a":"가뜩이나 감기에 걸렸는데 시험이 내일이에요.","en":"I already caught a cold, and the exam is tomorrow."}],"hl":"가뜩이나","drill":[{"ko":"가뜩이나 늦었는데 길까지 막혀요.","en":"I'm already late, and the traffic is jammed too."},{"ko":"가뜩이나 힘든데 자꾸 잔소리를 하지 마세요.","en":"I'm already having a hard time, so please don't nag me."},{"ko":"가뜩이나 추운데 바람까지 많이 불어요.","en":"It's already cold, and the wind is blowing a lot too."},{"ko":"가뜩이나 걱정이 많은데 그런 말까지 들으니 더 불안해요.","en":"I'm already full of worries, and hearing that makes me even more anxious."},{"ko":"가뜩이나 시간이 없는데 컴퓨터가 고장 났어요.","en":"I already have no time, and my computer broke."},{"ko":"가뜩이나 비싼데 세금까지 붙어서 더 비싸졌어요.","en":"It was already expensive, and with tax on top it got even more expensive."},{"ko":"가뜩이나 어려운 시험인데 문제가 너무 많았어요.","en":"It's already a hard exam, and there were too many questions."},{"ko":"가뜩이나 몸이 안 좋은데 일이 너무 많아서 쉴 수가 없어요.","en":"I'm already feeling unwell, and with so much work I can't rest."},{"ko":"가뜩이나 집이 좁은데 친구가 갑자기 찾아왔어요.","en":"My house is already small, and a friend suddenly dropped by."},{"ko":"가뜩이나 속상한데 놀리지 마세요.","en":"I'm already upset, so please don't tease me."}],"why":"A first clause that already describes a bad or tiring situation, followed by a second problem piled on top (또, -까지, 게다가), is the clue for 가뜩이나.","hlShow":"가뜩이나"},{"id":"bg-b105","ch":1,"part":"읽기·말하기","title":"N에 의하면 / N에 따르면 -다고 하다","form":"명사 + 에 의하면 / 에 따르면 + 간접 인용 (-다고 하다 / -(느)ㄴ다고 하다 / -(이)라고 하다)","pattern":"(출처)에 의하면/따르면 ~다고 합니다","rule":"들은 정보나 읽은 정보의 출처를 먼저 밝히고, 뒤에는 간접 인용 형태로 전달합니다.","meaning":"'According to N, ...': it names where the information comes from (news, a survey, an expert) and then reports it as quoted speech.","use":"Attach 에 의하면 or 에 따르면 to the source noun (뉴스, 조사, 연구, 기사, 선생님 말씀 …), then end with a reported form: -다고 하다 (adjectives and past), -ㄴ/는다고 하다 (present verbs), -(이)라고 하다 (nouns); in speech it shrinks to -대요. The two are interchangeable, fairly formal, and typical of news and reports.","examples":[{"ko":"뉴스에 따르면 내일부터 비가 많이 온다고 합니다.","en":"According to the news, it will rain a lot from tomorrow."},{"ko":"설문 조사에 의하면 대학생의 60%가 아르바이트를 한다고 합니다.","en":"According to the survey, 60% of university students have a part-time job."}],"notes":[{"kind":"주의","ko":"'에 의하면/에 따르면' 뒤에는 명령(-(으)세요)이나 제안(-(으)ㄹ까요?)을 쓸 수 없습니다. 정보를 전하는 문장으로 끝내야 합니다.","en":"After it you can't use a command or a suggestion: (×) 뉴스에 따르면 우산을 가져가세요. End with a reported statement instead."}],"practice":[{"q":"일기 예보 / 내일 눈이 오다 →","a":"일기 예보에 따르면 내일 눈이 온다고 합니다.","en":"According to the weather forecast, it will snow tomorrow."},{"q":"신문 기사 / 물가가 계속 오르다 →","a":"신문 기사에 따르면 물가가 계속 오른다고 합니다.","en":"According to the newspaper article, prices keep rising."},{"q":"선생님 말씀 / 시험이 어렵지 않다 →","a":"선생님 말씀에 의하면 시험이 어렵지 않다고 합니다.","en":"According to the teacher, the exam isn't difficult."},{"q":"통계 / 한국 사람들이 하루에 커피를 두 잔 마시다 →","a":"통계에 따르면 한국 사람들은 하루에 커피를 두 잔 마신다고 합니다.","en":"According to statistics, Koreans drink two cups of coffee a day."}],"hl":"에 (의하면|따르면)","drill":[{"ko":"연구에 따르면 잠을 충분히 자는 사람이 더 행복하다고 합니다.","en":"According to research, people who sleep enough are happier."},{"ko":"뉴스에 의하면 어제 서울에 첫눈이 왔다고 합니다.","en":"According to the news, the first snow fell in Seoul yesterday."},{"ko":"통계에 따르면 한국의 1인 가구가 계속 늘고 있다고 합니다.","en":"According to statistics, single-person households in Korea keep increasing."},{"ko":"친구 말에 의하면 그 식당은 주말에 사람이 많다고 해요.","en":"According to my friend, that restaurant is crowded on weekends."},{"ko":"신문 기사에 따르면 내년부터 버스 요금이 오른다고 합니다.","en":"According to the newspaper article, bus fares will go up from next year."},{"ko":"일기 예보에 따르면 이번 주말에는 날씨가 맑을 거라고 합니다.","en":"According to the forecast, the weather will be clear this weekend."},{"ko":"설문 조사에 따르면 학생들은 방학에 여행을 가장 하고 싶어 한다고 합니다.","en":"According to the survey, students most want to travel during vacation."},{"ko":"의사 선생님의 말씀에 따르면 이 약은 식사 후에 먹어야 한다고 해요.","en":"According to the doctor, this medicine has to be taken after meals."},{"ko":"인터넷 기사에 의하면 그 가수가 곧 한국에 온다고 합니다.","en":"According to the online article, that singer is coming to Korea soon."},{"ko":"조사 결과에 따르면 청소년의 수면 시간이 부족하다고 합니다.","en":"According to the survey results, teenagers don't get enough sleep."}],"why":"A sentence that opens with where the information came from (news, a survey, a person's statement) and ends in a reported form (-다고 합니다) is the clue.","hlShow":"에 (의하면|따르면)"},{"id":"bg-b106","ch":1,"part":"읽기·말하기","title":"-다면서 / -다니까 / -다는데 (인용의 준말)","form":"동사 -ㄴ/는다면서·-ㄴ/는다니까·-ㄴ/는다는데 / 형용사 -다면서·-다니까·-다는데 / 명사 -(이)라면서·-(이)라니까·-(이)라는데","pattern":"-다고 하면서 → -다면서, -다고 하니까 → -다니까, -다고 하는데 → -다는데","rule":"'-다고 하-' 뒤에 연결어미가 올 때 '-다고 하'를 줄여 -다면서, -다니까, -다는데로 씁니다.","meaning":"Contracted quote plus connective. -다면서 = 'I hear that ... (is that right?)'; -다니까 = 'since (they) say ... / I told you ...'; -다는데 = '(they) say ..., so/but ...' and sets up the next clause.","use":"Attach to the plain form: verb -ㄴ/는다-, adjective -다-, noun -(이)라-, then 면서 / 니까 / 는데. -다면서(요)? mainly checks something you were told; -다니까 gives a reason based on what someone said, or insists when the listener doesn't believe you; -다는데 gives the reported background that is followed by advice, a request or another statement. These are spoken forms and pass on what you were told, not what you saw yourself.","examples":[{"ko":"이 식당이 맛있다면서요? 저도 가 보고 싶어요.","en":"I hear this restaurant is good, right? I want to go too."},{"ko":"민수 씨가 괜찮다니까 그냥 먹읍시다.","en":"Since Minsu says it's fine, let's just eat."},{"ko":"내일 비가 온다는데 우산을 가져가세요.","en":"They say it will rain tomorrow, so take an umbrella."}],"notes":[{"kind":"주의","ko":"-다면서(요)?는 들은 내용을 확인하는 질문입니다. 자기가 직접 본 일에는 쓰지 않습니다.","en":"-다면서(요)? asks to confirm something you were told; don't use it for things you saw yourself."}],"practice":[{"q":"친구가 이사하다 (들은 말을 확인하는 질문) →","a":"친구가 이사한다면서요?","en":"I hear your friend is moving, right?"},{"q":"내일 눈이 오다 / 따뜻하게 입고 가세요 (-다는데) →","a":"내일 눈이 온다는데 따뜻하게 입고 가세요.","en":"They say it will snow tomorrow, so dress warmly."},{"q":"선생님이 괜찮다 / 걱정하지 마세요 (-다니까) →","a":"선생님이 괜찮다니까 걱정하지 마세요.","en":"The teacher says it's fine, so don't worry."},{"q":"그 가게가 싸다 / 같이 가 볼까요 (-다는데) →","a":"그 가게가 싸다는데 같이 가 볼까요?","en":"They say that shop is cheap, shall we go together?"}],"hl":"(다|라)(면서|니까|는데)","drill":[{"ko":"요즘 많이 바쁘다면서요? 건강 조심하세요.","en":"I hear you've been very busy lately, right? Take care of your health."},{"ko":"영수 씨가 내일 한국에 간다면서요?","en":"I hear Youngsu is going to Korea tomorrow, right?"},{"ko":"이번 주말에 날씨가 좋다는데 같이 소풍 갈래요?","en":"They say the weather will be nice this weekend, want to go on a picnic together?"},{"ko":"그 영화가 정말 재미있다는데 한번 볼까요?","en":"They say that movie is really fun, shall we watch it?"},{"ko":"내가 한다니까 걱정하지 말고 쉬세요.","en":"I said I'll do it, so don't worry and rest."},{"ko":"친구가 맛있다니까 한번 먹어 봐요.","en":"My friend says it's delicious, so let's try it."},{"ko":"가게 주인이 이 가방은 인기가 많다는데 저도 하나 살까요?","en":"The shop owner says this bag is very popular, shall I buy one too?"},{"ko":"지금 가면 늦는다니까 택시를 타자.","en":"I'm telling you we'll be late if we go now, so let's take a taxi."},{"ko":"다음 주가 시험이라면서요? 공부 많이 했어요?","en":"I hear the exam is next week, right? Have you studied a lot?"},{"ko":"민수 씨가 오늘 못 온다는데 어떻게 하죠?","en":"Minsu says he can't come today, what shall we do?"}],"why":"A sentence that passes on something someone else said (a rumor, a friend's remark, a forecast) and keeps going in the same sentence with a question, a reason or a follow-up points to -다면서 / -다니까 / -다는데.","hlShow":"(다|라)(면서|니까|는데)"},{"id":"bg-b058","ch":3,"part":"말하기","title":"(○○ 씨) 말로는 ~대요","form":"명사 + 말로는 + 간접 인용 준말 (동사 -ㄴ/는대요, 형용사 -대요, 명사 -(이)래요)","pattern":"(사람) 말로는 ~대요","rule":"다른 사람이 한 말을 근거로 정보를 전달할 때 쓰며, 문장 끝은 '-다고 해요'의 준말인 -대요를 씁니다.","meaning":"'According to N (what N says), ...' / 'N says that ...': passing on information that you got from a person's words.","use":"Put a person (친구, 의사, 민수 씨 …) before 말로는, then report with the contracted quote -대요: verb -ㄴ/는대요, adjective -대요, noun -(이)래요, command -(으)래요, suggestion -재요, past -았/었대요. It is conversational and polite-casual; for printed or official sources such as news and surveys use 에 따르면 instead.","examples":[{"ko":"의사 선생님 말로는 크게 걱정하지 않아도 된대요.","en":"The doctor says there's no need to worry much."},{"ko":"친구 말로는 그 영화가 정말 재미있대요.","en":"According to my friend, that movie is really fun."}],"notes":[{"kind":"주의","ko":"'말로는'은 사람의 말에 씁니다. 뉴스나 설문 조사에는 '에 따르면'을 쓰는 것이 자연스럽습니다.","en":"말로는 goes with a person's words; for news or surveys 에 따르면 sounds more natural."},{"kind":"참고","ko":"'말로는 ~지만'은 '말은 그렇게 했지만 실제로는 아니다'라는 뜻도 됩니다. 예: 말로는 괜찮다고 했지만 표정이 안 좋았어요.","en":"말로는 ~지만 can also mean 'in words (but not in reality)', e.g. 말로는 괜찮다고 했지만 표정이 안 좋았어요 (He said it was fine, but his face said otherwise)."}],"practice":[{"q":"민수 씨 / 내일 시험이 없다 →","a":"민수 씨 말로는 내일 시험이 없대요.","en":"Minsu says there's no exam tomorrow."},{"q":"의사 / 괜찮다 →","a":"의사 말로는 괜찮대요.","en":"The doctor says it's fine."},{"q":"친구 / 그 가게 빵이 맛있다 →","a":"친구 말로는 그 가게 빵이 맛있대요.","en":"My friend says the bread at that shop is delicious."},{"q":"언니 / 이번 주말에 이사하다 →","a":"언니 말로는 이번 주말에 이사한대요.","en":"My older sister says she's moving this weekend."}],"hl":"말로는","drill":[{"ko":"선생님 말로는 이번 시험이 어렵지 않대요.","en":"The teacher says this exam isn't difficult."},{"ko":"동생 말로는 그 가수가 다음 달에 한국에 온대요.","en":"My younger sibling says that singer is coming to Korea next month."},{"ko":"엄마 말로는 할머니가 많이 좋아지셨대요.","en":"Mom says Grandma has gotten much better."},{"ko":"민수 씨 말로는 기차역이 여기서 멀대요.","en":"Minsu says the train station is far from here."},{"ko":"룸메이트 말로는 우리 기숙사가 곧 수리한대요.","en":"My roommate says our dormitory is going to be repaired soon."},{"ko":"부장님 말로는 내일 회의가 취소됐대요.","en":"The manager says tomorrow's meeting has been canceled."},{"ko":"친구 말로는 그 식당이 주말에는 문을 닫는대요.","en":"My friend says that restaurant closes on weekends."},{"ko":"사장님 말로는 이 옷이 제일 잘 팔린대요.","en":"The owner says this clothing sells the best."},{"ko":"약사 말로는 이 약은 식사 전에 먹어야 한대요.","en":"The pharmacist says this medicine has to be taken before meals."},{"ko":"유진 씨 말로는 다음 주에 방학이래요.","en":"Yujin says next week is vacation."}],"why":"A person's name or role followed by 말로는, and an ending that passes on what that person said (-대요), is the clue; the information is second-hand and comes from someone you can name.","hlShow":"말로는"},{"id":"bg-b077","ch":4,"part":"말하기","title":"V-는 게 어디 있어요? / A-(으)ㄴ 게 어디 있어요?","form":"동사 -는 게 / 형용사 -(으)ㄴ 게 + 어디 있어요?","pattern":"-는 게 어디 있어요?","rule":"상대방이나 상황이 상식에 어긋난다고 비판할 때 '그런 일이 어디 있느냐'라고 반문하는 표현입니다.","meaning":"A rhetorical question: 'How can there be such a thing as ...?' / 'You can't just ...!' It says that the action is unreasonable and not acceptable.","use":"Attach -는 게 to a present verb or -(으)ㄴ 게 to an adjective, then 어디 있어요? (also -니? / -습니까?). It does not ask where something is; it is a complaint or protest meaning 'there is no such thing'. Use it with friends, family or peers; to a superior it sounds rude. The speaker is usually upset, and the stress falls on the action just before 게.","examples":[{"ko":"약속을 해 놓고 연락도 없이 안 오는 게 어디 있어요?","en":"How can you make a promise and then not even get in touch and not show up?"},{"ko":"친구가 아픈데 혼자 놀러 가는 게 어디 있니?","en":"Your friend is sick, so how can you go off to play by yourself?"}],"notes":[{"kind":"주의","ko":"말투가 강한 반문이므로 윗사람에게는 쓰지 않는 것이 좋습니다. 장소를 묻는 질문으로 대답하면 안 됩니다.","en":"It is a sharp rhetorical question, so avoid it with someone senior, and don't answer it as if it asked about a place."}],"practice":[{"q":"연락도 없이 갑자기 그만두다 →","a":"연락도 없이 갑자기 그만두는 게 어디 있어요?","en":"How can you quit suddenly without even getting in touch?"},{"q":"남의 허락 없이 물건을 가져가다 →","a":"남의 허락 없이 물건을 가져가는 게 어디 있어요?","en":"How can you take someone's things without their permission?"},{"q":"비싼 돈을 받고 서비스가 이렇게 나쁘다 →","a":"비싼 돈을 받고 서비스가 이렇게 나쁜 게 어디 있어요?","en":"How can the service be this bad when you charge so much?"},{"q":"시험 전날에 밤새 놀다 →","a":"시험 전날에 밤새 노는 게 어디 있어요?","en":"How can you play all night the day before an exam?"}],"hl":"[가-힣]\\s게 어디 있","drill":[{"ko":"먹고 나서 돈을 안 내는 게 어디 있어요?","en":"How can you eat and then not pay?"},{"ko":"부모님께 거짓말을 하는 게 어디 있니?","en":"How can you lie to your parents?"},{"ko":"약속 시간에 한 시간이나 늦게 오는 게 어디 있어요?","en":"How can you show up a whole hour late to an appointment?"},{"ko":"아프다고 하는데 일을 계속 시키는 게 어디 있습니까?","en":"How can you keep making someone work when they say they're sick?"},{"ko":"말도 안 하고 방에 들어오는 게 어디 있어요?","en":"How can you walk into a room without saying a word?"},{"ko":"친구 생일을 잊어버리는 게 어디 있어?","en":"How can you forget a friend's birthday?"},{"ko":"월급은 그대로인데 일만 늘리는 게 어디 있어요?","en":"How can they only increase the work while the salary stays the same?"},{"ko":"빌린 책을 돌려주지 않는 게 어디 있어요?","en":"How can you not return a book you borrowed?"},{"ko":"이렇게 좁은 방이 이렇게 비싼 게 어디 있어요?","en":"How can such a small room be this expensive?"},{"ko":"혼자만 맛있는 걸 먹는 게 어디 있어요?","en":"How can you eat something delicious all by yourself?"}],"why":"A speaker who is protesting someone's behavior, naming the action and then asking 'where is there...?' as a rhetorical question rather than asking about a place, is the clue.","hlShow":"[가-힣]\\s게 어디 있"},{"id":"bg-b329","ch":4,"part":"발표·말하기","title":"N을/를 대상으로 N에 대해 설문 조사를 하다","form":"명사 + 을/를 대상으로 + 명사 + 에 대해 + 설문 조사를 했습니다","pattern":"저는 [대상]을/를 대상으로 [주제]에 대해 설문 조사를 했습니다.","rule":"발표를 시작할 때 누구를 대상으로 무엇에 대해 설문 조사를 했는지 밝힙니다.","meaning":"'I (we) conducted a survey about [topic] among [target group].' This is the opening line of a survey presentation: who was asked and about what.","use":"Name the group before 을/를 대상으로 (학생 30명을, 직장인을 …) and the topic before 에 대해 (취미에 대해 …), then close with 설문 조사를 했습니다 (formal presentation style -ㅂ니다). In writing you may also see 설문 조사를 실시했습니다. Adding a number or an age group (30명, 20대) makes the sample clear.","examples":[{"ko":"저는 우리 반 학생 30명을 대상으로 휴대폰 사용 시간에 대해 설문 조사를 했습니다.","en":"I surveyed 30 students in our class about how long they use their phones."},{"ko":"저희 조는 20대 직장인 50명을 대상으로 퇴근 후 시간에 대해 설문 조사를 했습니다.","en":"Our group surveyed 50 office workers in their twenties about their time after work."}],"notes":[{"kind":"주의","ko":"'대상으로' 앞에는 받침이 있으면 '을', 없으면 '를'을 씁니다. '대상에게'로 바꾸지 않고, 주제는 따로 '에 대해'로 말합니다.","en":"Use 을 after a final consonant (30명을) and 를 after a vowel (남녀를). Say 대상으로, not 대상에게, and give the topic separately with 에 대해."}],"practice":[{"q":"대학생 100명 / 취미 →","a":"대학생 100명을 대상으로 취미에 대해 설문 조사를 했습니다.","en":"I surveyed 100 university students about hobbies."},{"q":"우리 반 친구들 / 방학 계획 →","a":"우리 반 친구들을 대상으로 방학 계획에 대해 설문 조사를 했습니다.","en":"I surveyed my classmates about their vacation plans."},{"q":"20대 직장인 / 스트레스 →","a":"20대 직장인을 대상으로 스트레스에 대해 설문 조사를 했습니다.","en":"I surveyed office workers in their twenties about stress."},{"q":"외국인 유학생 50명 / 한국 생활 →","a":"외국인 유학생 50명을 대상으로 한국 생활에 대해 설문 조사를 했습니다.","en":"I surveyed 50 international students about life in Korea."}],"hl":"[을를] 대상으로","drill":[{"ko":"저는 서강대학교 학생 40명을 대상으로 아르바이트에 대해 설문 조사를 했습니다.","en":"I surveyed 40 Sogang University students about part-time jobs."},{"ko":"저희는 우리 반 친구들을 대상으로 좋아하는 음식에 대해 설문 조사를 했습니다.","en":"We surveyed our classmates about their favorite foods."},{"ko":"저는 직장인 100명을 대상으로 점심 식사에 대해 설문 조사를 했습니다.","en":"I surveyed 100 office workers about lunch."},{"ko":"저희 조는 유학생 30명을 대상으로 한국 생활의 어려움에 대해 설문 조사를 했습니다.","en":"Our group surveyed 30 international students about the difficulties of life in Korea."},{"ko":"저는 20대 남녀 60명을 대상으로 결혼에 대해 설문 조사를 했습니다.","en":"I surveyed 60 men and women in their twenties about marriage."},{"ko":"저는 주부 50명을 대상으로 장보기 습관에 대해 설문 조사를 했습니다.","en":"I surveyed 50 homemakers about their grocery-shopping habits."},{"ko":"저희는 고등학생들을 대상으로 진로에 대해 설문 조사를 했습니다.","en":"We surveyed high school students about their future careers."},{"ko":"저는 기숙사 학생 20명을 대상으로 기숙사 생활에 대해 설문 조사를 했습니다.","en":"I surveyed 20 dormitory students about dormitory life."},{"ko":"저희 조는 대학생 80명을 대상으로 운동 습관에 대해 설문 조사를 했습니다.","en":"Our group surveyed 80 university students about exercise habits."},{"ko":"저는 이웃 주민 25명을 대상으로 쓰레기 분리배출에 대해 설문 조사를 했습니다.","en":"I surveyed 25 neighbors about sorting garbage for recycling."}],"why":"The first sentence of a survey presentation, naming a group of people (often with a number) and a topic, is the clue: 대상으로 for who was asked, 에 대해 for what about.","hlShow":"[을를] 대상으로"},{"id":"bg-b330","ch":4,"part":"발표·말하기","title":"N이/가 N%로 가장 많았습니다","form":"명사 + 이/가 + 숫자% + 로 + 가장 많았습니다","pattern":"[의견]이/가 [숫자]%로 가장 많았습니다.","rule":"설문 결과에서 가장 많은 응답을 얻은 항목과 그 비율을 말할 때 씁니다.","meaning":"'[Answer] was the most common, at [number]%.' It states the top result of a survey together with its share.","use":"Put 이/가 after the answer or item and 로 after the percentage (60%로, 52.5%로), then say 가장 많았습니다. The past tense 많았다 is used because the survey is already finished; use -ㅂ니다 in a presentation and 많았다 in writing. Variants: …(이)라고 대답한 사람이 40%로 가장 많았습니다; for rates you can also say 가장 높았습니다.","examples":[{"ko":"운동이라고 대답한 사람이 40%로 가장 많았습니다.","en":"People who answered 'exercise' were the most common, at 40%."},{"ko":"스트레스의 원인으로는 학업이 52%로 가장 많았습니다.","en":"As a cause of stress, studies were the most common, at 52%."}],"notes":[{"kind":"주의","ko":"'가장 많았습니다'는 과거형입니다. 설문이 이미 끝났기 때문입니다. 비율에는 '가장 높았습니다'를 쓰기도 합니다.","en":"Use the past tense 많았습니다 because the survey is already over; for rates 가장 높았습니다 also works."}],"practice":[{"q":"취미 / 영화 감상 35% →","a":"취미로는 영화 감상이 35%로 가장 많았습니다.","en":"As a hobby, watching movies was the most common, at 35%."},{"q":"고민 / 취업 45% →","a":"고민으로는 취업이 45%로 가장 많았습니다.","en":"As a worry, finding a job was the most common, at 45%."},{"q":"운동이라고 대답한 사람 / 40% →","a":"운동이라고 대답한 사람이 40%로 가장 많았습니다.","en":"People who answered 'exercise' were the most common, at 40%."},{"q":"좋아하는 음식 / 한식 52.5% →","a":"좋아하는 음식은 한식이 52.5%로 가장 많았습니다.","en":"As a favorite food, Korean food was the most common, at 52.5%."}],"hl":"\\d+(\\.\\d+)?%로 가장 많았","drill":[{"ko":"여가 시간에 하고 싶은 활동으로는 여행이 38%로 가장 많았습니다.","en":"As an activity they want to do in free time, travel was the most common, at 38%."},{"ko":"아르바이트를 하는 이유는 용돈을 벌기 위해서가 55%로 가장 많았습니다.","en":"As the reason for working part-time, earning pocket money was the most common, at 55%."},{"ko":"한국 생활에서 가장 어려운 점으로는 언어 문제가 48%로 가장 많았습니다.","en":"As the hardest thing in life in Korea, language problems were the most common, at 48%."},{"ko":"하루 평균 수면 시간은 6시간이 42%로 가장 많았습니다.","en":"For average daily sleep, 6 hours was the most common, at 42%."},{"ko":"좋아하는 계절로 봄을 선택한 사람이 35%로 가장 많았습니다.","en":"People who chose spring as their favorite season were the most common, at 35%."},{"ko":"휴대폰을 사용하는 목적으로는 인터넷 검색이 44%로 가장 많았습니다.","en":"As the purpose of using a smartphone, internet search was the most common, at 44%."},{"ko":"주말에 하는 일로는 집에서 쉬는 것이 47%로 가장 많았습니다.","en":"As what they do on weekends, resting at home was the most common, at 47%."},{"ko":"한국어를 공부하는 이유로는 한국 문화에 관심이 있어서가 50%로 가장 많았습니다.","en":"As the reason for studying Korean, interest in Korean culture was the most common, at 50%."},{"ko":"점심 식사 비용은 8,000원대가 33%로 가장 많았습니다.","en":"For the cost of lunch, the 8,000-won range was the most common, at 33%."},{"ko":"건강을 위해 걷기를 선택한 사람이 46%로 가장 많았습니다.","en":"People who chose walking for their health were the most common, at 46%."}],"why":"A survey presentation that names the top item and attaches its percentage, ending with 가장 많았다 (past tense because the survey is done), is the clue.","hlShow":"\\d+(\\.\\d+)?%로 가장 많았"},{"id":"bg-b331","ch":4,"part":"발표·말하기","title":"그 다음으로는 A, B의 순이었습니다","form":"그 다음으로는 + 명사, 명사, 명사 + 의 순이었습니다","pattern":"그 다음으로는 A, B, C의 순이었습니다.","rule":"가장 많은 의견을 말한 뒤, 그 다음으로 많았던 의견들을 순서대로 나열합니다.","meaning":"'Next came A, B and C, in that order.' After the top result, it lists the runners-up of a survey in descending order.","use":"Say the top result first, then 그 다음으로는, then list the items from most to least with commas; put 의 after the last item and finish with 순이었습니다 (순 = order). Past 이었습니다 is used because the survey is done. If you want percentages: 중식(20%), 일식(15%)의 순이었습니다. In writing, 이었다 is common.","examples":[{"ko":"한식이 가장 많았고 그 다음으로는 중식, 일식의 순이었습니다.","en":"Korean food was the most common, followed by Chinese and Japanese food, in that order."},{"ko":"그 다음으로는 영화 감상, 독서, 운동의 순이었습니다.","en":"Next came watching movies, reading and exercise, in that order."}],"notes":[{"kind":"주의","ko":"마지막 항목 뒤에 '의'를 붙이고, 항목 사이에는 쉼표를 씁니다. 예: 중식, 일식의 순이었습니다. 여기에는 '이/가'를 쓰지 않습니다.","en":"Put 의 right after the last item and use commas between the items: 중식, 일식의 순이었습니다. Don't use 이/가 there."}],"practice":[{"q":"1위 한식 / 다음 중식, 일식 →","a":"한식이 가장 많았고 그 다음으로는 중식, 일식의 순이었습니다.","en":"Korean food was the most common, followed by Chinese and Japanese."},{"q":"그 다음 / 독서, 운동, 영화 →","a":"그 다음으로는 독서, 운동, 영화의 순이었습니다.","en":"Next came reading, exercise and movies, in that order."},{"q":"그 다음 / 친구, 가족, 선생님 →","a":"그 다음으로는 친구, 가족, 선생님의 순이었습니다.","en":"Next came friends, family and teachers, in that order."},{"q":"그 다음 / 운동 20%, 영화 15% →","a":"그 다음으로는 운동(20%), 영화(15%)의 순이었습니다.","en":"Next came exercise (20%) and movies (15%), in that order."}],"hl":"그 다음으로는|의 순이었","drill":[{"ko":"그 다음으로는 여행, 쇼핑, 독서의 순이었습니다.","en":"Next came travel, shopping and reading, in that order."},{"ko":"1위는 봄이었고 그 다음으로는 가을, 여름의 순이었습니다.","en":"Spring was first, followed by autumn and summer, in that order."},{"ko":"그 다음으로는 영어, 중국어, 일본어의 순이었습니다.","en":"Next came English, Chinese and Japanese, in that order."},{"ko":"그 다음으로는 걷기, 수영, 자전거의 순이었습니다.","en":"Next came walking, swimming and cycling, in that order."},{"ko":"그 다음으로는 취업, 건강, 인간관계의 순이었습니다.","en":"Next came getting a job, health and relationships, in that order."},{"ko":"커피가 가장 많았고 그 다음으로는 녹차, 홍차의 순이었습니다.","en":"Coffee was the most common, followed by green tea and black tea, in that order."},{"ko":"그 다음으로는 지하철, 버스, 택시의 순이었습니다.","en":"Next came the subway, the bus and the taxi, in that order."},{"ko":"그 다음으로는 기숙사, 자취, 하숙의 순이었습니다.","en":"Next came the dormitory, living alone and a boarding house, in that order."},{"ko":"그 다음으로는 친구, 가족, 동료의 순이었습니다.","en":"Next came friends, family and colleagues, in that order."},{"ko":"그 다음으로는 치킨, 피자, 햄버거의 순이었습니다.","en":"Next came chicken, pizza and hamburgers, in that order."}],"why":"After the top result has been stated, a sentence that lists the remaining items in descending order, separated by commas, is the clue for 그 다음으로는 … 의 순이었습니다.","hlShow":"그 다음으로는|의 순이었"},{"id":"bg-b332","ch":4,"part":"발표·말하기","title":"그 밖에 -다는 의견도 있었습니다","form":"그 밖에 + 동사 -ㄴ/는다는 / 형용사 -다는 / 명사 -(이)라는 + 의견도 있었습니다","pattern":"그 밖에 ~다는 의견도 있었습니다.","rule":"주요 결과를 말한 뒤, 그 밖의 소수 의견을 덧붙일 때 씁니다.","meaning":"'Besides that, there was also an opinion that ...'. It adds the minor or miscellaneous answers after the main results.","use":"Open with 그 밖에 (besides these). The opinion is a quoted clause plus 는 that modifies 의견: adjective -다는, verb -ㄴ/는다는, noun -(이)라는, past -았/었다는. Then finish with 의견도 있었습니다 (도 = also). You may swap 의견 for 대답 or 응답, or open with 기타 의견으로는 … instead. Use -ㅂ니다 style in a presentation.","examples":[{"ko":"그 밖에 시간이 없다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that they have no time."},{"ko":"그 밖에 가격이 너무 비싸다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that the price is too high."}],"notes":[{"kind":"주의","ko":"'의견' 앞에는 -다는 형태를 씁니다. 동사는 -ㄴ/는다는입니다. (×) 가다는 의견 → (○) 간다는 의견","en":"Before 의견 use the -다는 form; verbs take -ㄴ/는다는: (×) 가다는 의견 → (○) 간다는 의견."}],"practice":[{"q":"기타 / 교통이 불편하다 →","a":"그 밖에 교통이 불편하다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that transportation is inconvenient."},{"q":"기타 / 운동할 시간이 없다 →","a":"그 밖에 운동할 시간이 없다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that they have no time to exercise."},{"q":"기타 / 혼자 산다 →","a":"그 밖에 혼자 산다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that they live alone."},{"q":"기타 / 월급이 너무 적다 →","a":"그 밖에 월급이 너무 적다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that the salary is too low."}],"hl":"그 밖에","drill":[{"ko":"그 밖에 기숙사가 너무 시끄럽다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that the dormitory is too noisy."},{"ko":"그 밖에 한국어 수업이 어렵다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that the Korean class is difficult."},{"ko":"그 밖에 주말에도 일한다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that they work on weekends too."},{"ko":"그 밖에 음식 값이 비싸다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that food prices are high."},{"ko":"그 밖에 잘 모르겠다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that they don't really know."},{"ko":"그 밖에 학교 식당이 좁다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that the school cafeteria is cramped."},{"ko":"그 밖에 친구를 사귀기 힘들다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that it is hard to make friends."},{"ko":"그 밖에 아침에 일찍 일어나기 싫다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that they don't like getting up early in the morning."},{"ko":"그 밖에 버스가 자주 안 온다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that the bus doesn't come often."},{"ko":"그 밖에 운동이 건강에 가장 중요하다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that exercise is the most important thing for health."}],"why":"A sentence that adds leftover minority views after the main results is the clue: 그 밖에 opens it, and the opinion is a quoted clause ending in -다는 before 의견.","hlShow":"그 밖에"},{"id":"bg-b333","ch":4,"part":"발표·말하기","title":"이러한 결과를 통해 -다는 것을 알 수 있었습니다","form":"(이러한) 결과를 통해 + 문장 + 동사 -ㄴ/는다는 / 형용사 -다는 / 명사 -(이)라는 + 것을 알 수 있었습니다","pattern":"이러한 결과를 통해 ~다는 것을 알 수 있었습니다.","rule":"발표를 마칠 때 조사 결과에서 알게 된 점을 정리해서 말합니다.","meaning":"'From these results we could see that ...'. This is the closing line of a survey presentation: the conclusion drawn from the data.","use":"Start with 결과를 통해 (through the results), add a clause ending in -다는 것을 (verb -ㄴ/는다는, adjective -다는, noun -(이)라는), and finish with 알 수 있었습니다 (we could tell). 이러한 means 'such / these'. Close variants: 알게 되었습니다; 것으로 보입니다 for a more cautious tone; 알 수 있었다 in writing.","examples":[{"ko":"이러한 결과를 통해 대학생들이 취업 때문에 걱정이 많다는 것을 알 수 있었습니다.","en":"From these results we could see that university students worry a lot about finding a job."},{"ko":"이번 설문 조사 결과를 통해 학생들이 운동보다 휴식을 더 원한다는 것을 알 수 있었습니다.","en":"From the results of this survey we could see that students want rest more than exercise."}],"notes":[{"kind":"주의","ko":"'통해' 앞에는 조사 '을/를'이 필요합니다. 결과를 통해(○) / 결과에 통해(×). 같은 뜻으로 '통하여'도 씁니다.","en":"Before 통해 you need the particle 을/를: 결과를 통해 (○) / 결과에 통해 (×). 통하여 means the same."}],"practice":[{"q":"이러한 결과 / 학생들이 바쁘다 →","a":"이러한 결과를 통해 학생들이 바쁘다는 것을 알 수 있었습니다.","en":"From these results we could see that students are busy."},{"q":"설문 결과 / 사람들이 건강에 관심이 많다 →","a":"설문 결과를 통해 사람들이 건강에 관심이 많다는 것을 알 수 있었습니다.","en":"From the survey results we could see that people are very interested in health."},{"q":"이 조사 / 취미가 사람마다 다르다 →","a":"이 조사를 통해 취미가 사람마다 다르다는 것을 알 수 있었습니다.","en":"From this survey we could see that hobbies differ from person to person."},{"q":"이러한 결과 / 운동하는 사람이 늘고 있다 →","a":"이러한 결과를 통해 운동하는 사람이 늘고 있다는 것을 알 수 있었습니다.","en":"From these results we could see that more people are exercising."}],"hl":"[을를] 통해","drill":[{"ko":"이러한 결과를 통해 아르바이트를 하는 학생이 많다는 것을 알 수 있었습니다.","en":"From these results we could see that many students work part-time."},{"ko":"설문 조사를 통해 한국 생활에서 언어가 가장 큰 어려움이라는 것을 알 수 있었습니다.","en":"From the survey we could see that language is the biggest difficulty in life in Korea."},{"ko":"이러한 결과를 통해 사람들이 건강을 중요하게 생각한다는 것을 알 수 있었습니다.","en":"From these results we could see that people consider health important."},{"ko":"이번 조사를 통해 유학생들이 한국 음식을 좋아한다는 것을 알 수 있었습니다.","en":"From this survey we could see that international students like Korean food."},{"ko":"이러한 결과를 통해 휴대폰 사용 시간이 길다는 것을 알 수 있었습니다.","en":"From these results we could see that phone usage time is long."},{"ko":"이러한 결과를 통해 직장인들이 점심시간을 소중하게 여긴다는 것을 알 수 있었습니다.","en":"From these results we could see that office workers value their lunch break."},{"ko":"설문 결과를 통해 젊은 사람들이 결혼을 늦게 한다는 것을 알 수 있었습니다.","en":"From the survey results we could see that young people marry late."},{"ko":"이 조사를 통해 취미가 사람마다 다르다는 것을 알 수 있었습니다.","en":"From this survey we could see that hobbies differ from person to person."},{"ko":"이러한 결과를 통해 잠이 부족한 학생이 많다는 것을 알 수 있었습니다.","en":"From these results we could see that many students lack sleep."},{"ko":"이번 조사 결과를 통해 기숙사 생활에 대한 만족도가 높다는 것을 알 수 있었습니다.","en":"From the results of this survey we could see that satisfaction with dormitory life is high."}],"why":"A sentence at the end of a presentation that draws a conclusion from the data you just showed ('through these results' + 'we could see that') is the clue.","hlShow":"[을를] 통해"},{"id":"bg-b390","ch":5,"part":"말하기·듣기","title":"말이 N(이)지","form":"말이 + 명사 + (이)지, (사실은) …","pattern":"말이 N(이)지, 사실은 ~","rule":"이름이나 겉모습은 그럴듯하지만 실제는 다르다는 것을 말할 때 쓴다.","meaning":"'It's called X, but really it's Y.' You grant the name or label first, then contrast it with the different or harsher reality.","use":"Put the label (a noun) between 말이 and (이)지: 지 after a vowel-ending noun (휴가지), 이지 after a consonant-ending noun (여행이지). Add a comma, then the real situation, often with 사실은 or 실제로는. Mostly spoken; often a complaint or a joke.","examples":[{"ko":"말이 휴가지, 사실은 매일 일만 했어요.","en":"It was called a vacation, but really I just worked every day."},{"ko":"말이 신혼여행이지, 거의 싸우기만 했어요.","en":"It was called a honeymoon, but we basically just fought."},{"ko":"말이 아르바이트지, 하는 일은 정규직과 같아요.","en":"It's called a part-time job, but the work is the same as a full-timer's."}],"notes":[{"kind":"주의","ko":"뒤 문장은 앞의 이름과 다른 현실을 말한다. 이름과 실제가 같을 때는 쓰지 않는다.","en":"The second clause must show a reality that differs from the label; don't use it when name and reality match."},{"kind":"참고","ko":"'말이 좋아 N(이)지, …' 형태로도 자주 쓴다.","en":"Also common as 말이 좋아 N(이)지, … ('nice as the name sounds, it's really just…')."}],"practice":[{"q":"여행이라고 하다 / 사실은 고생이다 →","a":"말이 여행이지, 사실은 고생이에요.","en":"It's called a trip, but really it's hard work."},{"q":"휴가라고 하다 / 집에서 일만 했다 →","a":"말이 휴가지, 집에서 일만 했어요.","en":"It was called a vacation, but I just worked at home."},{"q":"친구라고 하다 / 거의 모르는 사이이다 →","a":"말이 친구지, 거의 모르는 사이예요.","en":"We're called friends, but we barely know each other."},{"q":"교육이라고 하다 / 청소만 했다 →","a":"말이 교육이지, 청소만 했어요.","en":"It was called training, but I only cleaned."}],"hl":"말이 [가-힣]+?지(?=[,\\s])","drill":[{"ko":"말이 휴식이지, 사실은 숙제하는 시간이에요.","en":"It's called a break, but really it's homework time."},{"ko":"말이 회식이지, 사실은 회의의 연장이에요.","en":"It's called a company dinner, but really it's an extension of the meeting."},{"ko":"말이 방학이지, 학원 때문에 더 바빠요.","en":"It's called a vacation, but I'm busier because of cram school."},{"ko":"말이 가이드지, 하는 일은 짐 나르기예요.","en":"He's called a guide, but his job is carrying luggage."},{"ko":"말이 운동이지, 그냥 걷기만 했어요.","en":"It was called exercise, but we just walked."},{"ko":"말이 맛집이지, 맛은 그저 그래요.","en":"It's called a famous restaurant, but the food is so-so."},{"ko":"말이 다이어트지, 저녁에는 라면을 먹었어요.","en":"It's called a diet, but I ate ramen for dinner."},{"ko":"말이 선물이지, 사실은 뇌물이잖아요.","en":"It's called a gift, but it's really a bribe."},{"ko":"말이 도시락이지, 밥에 김치뿐이에요.","en":"It's called a lunchbox, but it's just rice and kimchi."},{"ko":"말이 캠핑이지, 거의 호텔 같은 곳이에요.","en":"It's called camping, but it's practically a hotel."}],"why":"A sentence that names a label and then turns with 'but actually…' (often 사실은 or 실제로는) calls for 말이 N(이)지; the first half is a name that doesn't match reality.","hlShow":"말이 [가-힣]+?지(?=[,\\s])"},{"id":"bg-b391","ch":5,"part":"말하기·듣기","title":"N을/를 통틀어(서)","form":"명사 + 을/를 통틀어(서)","pattern":"N을/를 통틀어(서) 가장/제일 ~","rule":"여러 대상이나 긴 기간을 모두 합쳐서 볼 때 쓴다.","meaning":"'Out of all…; throughout…; taken as a whole.' You look across a whole range (a group, a whole trip, a lifetime) and say something about the best, worst, only or first.","use":"Noun + 을/를 통틀어(서) (을 after a consonant, 를 after a vowel); 서 is optional. The clause that follows usually has 가장/제일 + adjective, 처음이다, or 한 번도 ~지 않다. The noun must be a range: many items or a long period. Both written and spoken.","examples":[{"ko":"이번 여행을 통틀어서 오늘이 가장 즐거웠어요.","en":"Out of this whole trip, today was the most fun."},{"ko":"우리 반을 통틀어 한국어를 제일 잘하는 사람은 민수예요.","en":"Of everyone in our class, the one who speaks Korean best is Minsu."},{"ko":"평생을 통틀어 이렇게 맛있는 음식은 처음이에요.","en":"In my whole life, this is the first time I've had food this delicious."}],"notes":[{"kind":"주의","ko":"뒤에는 보통 '가장, 제일, 처음, 한 번도' 같은 말이 오고, 앞에는 여러 개나 긴 기간이 와야 한다. 하나뿐인 대상에는 어색하다.","en":"Usually followed by 가장/제일/처음/한 번도; the noun must cover a range (many items or a long period), so a single thing sounds odd."}],"practice":[{"q":"지난 10년 / 가장 힘든 해는 작년이다 →","a":"지난 10년을 통틀어 가장 힘든 해는 작년이에요.","en":"Out of the last ten years, the hardest was last year."},{"q":"우리 가족 / 요리를 제일 잘하는 사람은 어머니이다 →","a":"우리 가족을 통틀어 요리를 제일 잘하는 사람은 어머니예요.","en":"In our whole family, the best cook is my mother."},{"q":"평생 / 이런 일은 처음이다 →","a":"평생을 통틀어 이런 일은 처음이에요.","en":"In my whole life, this has never happened before."},{"q":"이 책 / 제일 재미있는 부분은 마지막 장이다 →","a":"이 책을 통틀어 제일 재미있는 부분은 마지막 장이에요.","en":"In this whole book, the most interesting part is the last chapter."}],"hl":"[을를] 통틀어서?","drill":[{"ko":"이 가게의 메뉴를 통틀어 제일 인기 있는 것은 김밥이에요.","en":"Of everything on this shop's menu, the most popular is gimbap."},{"ko":"이번 학기를 통틀어 오늘 시험이 가장 어려웠어요.","en":"Of this whole semester, today's exam was the hardest."},{"ko":"유럽 여행 전체를 통틀어서 기억에 남는 것은 파리의 저녁이에요.","en":"Of the whole Europe trip, what stays with me is the evening in Paris."},{"ko":"우리 회사 직원들을 통틀어 일찍 출근하는 사람은 부장님뿐이에요.","en":"Of all the staff at our company, only the manager comes in early."},{"ko":"살면서 만난 사람들을 통틀어 그 친구가 제일 착해요.","en":"Of all the people I've met in my life, that friend is the kindest."},{"ko":"지난 일 년을 통틀어서 한 번도 쉬지 못했어요.","en":"Over the whole past year, I haven't been able to rest even once."},{"ko":"한국의 도시를 통틀어 서울이 가장 인구가 많아요.","en":"Of all the cities in Korea, Seoul has the largest population."},{"ko":"그 영화를 통틀어 마음에 드는 장면은 하나뿐이에요.","en":"In that whole movie, there is only one scene I like."},{"ko":"학교생활을 통틀어 가장 행복했던 때는 졸업식 날이에요.","en":"Of my whole school life, the happiest time was graduation day."},{"ko":"이 노래를 통틀어서 가장 좋아하는 부분은 마지막 소절이에요.","en":"In this whole song, my favorite part is the last verse."}],"why":"A sentence that looks across a whole group or period (the whole trip, my whole life) and picks the best, worst or only one is asking for 통틀어; the superlative or 처음/한 번도 later in the sentence is the clue.","hlShow":"[을를] 통틀어서?"},{"id":"bg-b505","ch":6,"part":"읽기·말하기","title":"A/V-(으)므로","form":"동사·형용사 어간 + -(으)므로 (받침 O: -으므로 / 받침 X, ㄹ: -므로); 명사 + 이므로","pattern":"A/V-(으)므로 ~","rule":"앞 내용이 뒤 내용의 이유나 근거가 됨을 격식 있게 나타낸다.","meaning":"'Since; because; as' — a formal, mostly written reason that leads to a conclusion or decision.","use":"-으므로 after a consonant stem, -므로 after a vowel or ㄹ stem; past -았/었으므로; noun + 이므로 (학생이므로). Used in reports, notices, speeches and news, hardly ever in casual talk. The main clause is normally not a command or a suggestion; in speech use -(으)니까 or -아/어서.","examples":[{"ko":"출산율이 낮으므로 대책이 필요합니다.","en":"Since the birth rate is low, countermeasures are needed."},{"ko":"이곳은 공사 중이므로 출입을 금지합니다.","en":"Since this area is under construction, entry is prohibited."},{"ko":"물가가 계속 오르므로 생활비를 줄여야 합니다.","en":"Prices keep rising, so living costs must be cut."}],"notes":[{"kind":"주의","ko":"-(으)므로 뒤에는 보통 명령형이나 청유형을 쓰지 않는다. 일상 대화에서는 -아/어서, -(으)니까를 쓴다.","en":"-(으)므로 is normally not followed by a command or suggestion; in everyday talk use -아/어서 or -(으)니까."},{"kind":"참고","ko":"'-(으)ㅁ으로써'는 방법·수단을 나타내므로 이유를 나타내는 -(으)므로와 구별한다.","en":"-(으)ㅁ으로써 means 'by doing' (means), so keep it apart from the reason marker -(으)므로."}],"practice":[{"q":"출산율이 낮다 / 대책이 필요하다 →","a":"출산율이 낮으므로 대책이 필요합니다.","en":"Since the birth rate is low, countermeasures are needed."},{"q":"인구가 줄고 있다 / 정책을 바꾸어야 하다 →","a":"인구가 줄고 있으므로 정책을 바꾸어야 합니다.","en":"The population is shrinking, so policy must change."},{"q":"오늘은 휴일이다 / 은행이 문을 닫다 →","a":"오늘은 휴일이므로 은행이 문을 닫습니다.","en":"Today is a holiday, so the bank is closed."},{"q":"비가 많이 오다 / 행사를 취소하다 →","a":"비가 많이 오므로 행사를 취소합니다.","en":"Since it is raining heavily, the event is canceled."}],"hl":"(으|이)?므로","drill":[{"ko":"이 제품은 품질이 우수하므로 수출이 늘고 있습니다.","en":"Since this product is of excellent quality, exports are growing."},{"ko":"날씨가 춥고 바람이 강하므로 외출을 삼가시기 바랍니다.","en":"As it is cold and windy, please refrain from going out."},{"ko":"학생은 학업이 본분이므로 열심히 공부해야 합니다.","en":"Since studying is a student's duty, students must study hard."},{"ko":"시험이 어려웠으므로 평균 점수가 낮았습니다.","en":"Because the exam was difficult, the average score was low."},{"ko":"회의실은 사용 중이므로 다른 곳에서 회의를 합니다.","en":"The meeting room is in use, so the meeting will be held elsewhere."},{"ko":"이 지역은 지진이 자주 일어나므로 건물을 튼튼하게 지어야 합니다.","en":"Earthquakes occur often in this region, so buildings must be built sturdily."},{"ko":"원료 가격이 올랐으므로 제품 가격도 오를 것입니다.","en":"Raw material prices have risen, so product prices will rise too."},{"ko":"고령 인구가 많으므로 복지 예산이 더 필요합니다.","en":"Since the elderly population is large, more welfare budget is needed."},{"ko":"그는 경험이 풍부하므로 이 일에 적합한 사람입니다.","en":"He has plenty of experience, so he is the right person for this job."},{"ko":"환경이 오염되므로 일회용품 사용을 줄여야 합니다.","en":"The environment is being polluted, so we must reduce disposable items."}],"why":"A formal, written sentence (report, notice, news) where the first part is the objective ground for the conclusion in the second, with no personal feeling or command, points to -(으)므로.","hlShow":"(으|이)?므로"},{"id":"bg-b506","ch":6,"part":"읽기·말하기","title":"A/V-(으)ㄴ/는 데다가","form":"형용사 + -(으)ㄴ 데다가 / 동사 + -는 데다가 / 명사 + 인 데다가","pattern":"A/V-(으)ㄴ/는 데다가 ~도/까지 ~","rule":"앞의 상황에 더하여 뒤의 상황까지 있음을 나타낸다.","meaning":"'On top of being…; besides; not only… but also.' Adds a second fact on top of the first, usually of the same kind (both good or both bad).","use":"Adjective: -(으)ㄴ 데다가 (비싼, 좋은); verb: -는 데다가 (오는); noun: 인 데다가; past verb: -(으)ㄴ 데다가 or -았/었는 데다가. The second clause often has -도/-까지. Both facts should point the same way. Spoken and written; 게다가 is the sentence-opening equivalent.","examples":[{"ko":"물가가 비싼 데다가 집값도 높습니다.","en":"Prices are high, and on top of that, housing costs are high too."},{"ko":"비가 오는 데다가 바람까지 불어서 너무 추웠어요.","en":"It was raining and, on top of that, windy, so it was freezing."},{"ko":"그 식당은 맛있는 데다가 값도 싸서 손님이 많아요.","en":"That restaurant is tasty and cheap on top of that, so it has lots of customers."}],"notes":[{"kind":"주의","ko":"앞뒤 내용이 둘 다 좋은 일이거나 둘 다 나쁜 일이어야 자연스럽다. '비싼 데다가 맛있어요'는 어색하다.","en":"Both facts should be good or both bad; '비싼 데다가 맛있어요' (expensive and tasty) sounds odd."},{"kind":"참고","ko":"문장을 시작할 때는 '게다가'를 쓴다: 물가가 비쌉니다. 게다가 집값도 높습니다.","en":"To start a new sentence use 게다가: 물가가 비쌉니다. 게다가 집값도 높습니다."}],"practice":[{"q":"물가가 비싸다 / 집값도 높다 →","a":"물가가 비싼 데다가 집값도 높습니다.","en":"Prices are high and on top of that housing is expensive too."},{"q":"비가 오다 / 바람도 불다 →","a":"비가 오는 데다가 바람도 불어요.","en":"It's raining and on top of that it's windy too."},{"q":"그 가수는 노래를 잘하다 / 춤도 잘 추다 →","a":"그 가수는 노래를 잘하는 데다가 춤도 잘 춰요.","en":"That singer sings well and dances well too."},{"q":"오늘은 월요일이다 / 비도 오다 →","a":"오늘은 월요일인 데다가 비도 와요.","en":"Today is Monday, and on top of that it's raining."}],"hl":"[가-힣]? 데다가","drill":[{"ko":"이 옷은 디자인이 예쁜 데다가 가격도 저렴해요.","en":"This outfit has a pretty design, and the price is cheap too."},{"ko":"어제는 늦게 일어난 데다가 길까지 막혀서 지각했어요.","en":"Yesterday I got up late and the roads were jammed too, so I was late."},{"ko":"그 사람은 성격이 좋은 데다가 일도 잘해서 인기가 많아요.","en":"He has a good personality and works well too, so he is popular."},{"ko":"요즘 일이 많은 데다가 몸까지 아파서 힘들어요.","en":"Lately I have lots of work and I'm even sick, so it's hard."},{"ko":"이 집은 역에서 가까운 데다가 조용해서 살기 좋아요.","en":"This house is close to the station and quiet, so it's good to live in."},{"ko":"오늘은 월급날인 데다가 금요일이라서 사람이 많아요.","en":"Today is payday and also a Friday, so it's crowded."},{"ko":"동생은 키가 큰 데다가 운동도 잘해요.","en":"My younger sibling is tall and good at sports too."},{"ko":"그는 영어를 잘하는 데다가 중국어도 할 수 있어요.","en":"He speaks English well and can speak Chinese too."},{"ko":"길이 미끄러운 데다가 어두워서 조심해야 해요.","en":"The road is slippery and dark too, so we must be careful."},{"ko":"시험을 못 본 데다가 열까지 나서 기분이 안 좋아요.","en":"I did badly on the exam and even have a fever, so I feel awful."}],"why":"Two facts that push in the same direction (both reasons for praise, or both complaints), with -도/-까지 in the second part, signal 데다가: the second fact is stacked on the first, not contrasted with it.","hlShow":"[가-힣]? 데다가"},{"id":"bg-b507","ch":6,"part":"읽기·말하기","title":"-다든지 -다든지 하다","form":"동사 어간 + -ㄴ/는다든지 / 형용사 어간 + -다든지 / 명사 + (이)라든지","pattern":"V-ㄴ/는다든지 V-ㄴ/는다든지 하다","rule":"여러 가지 가능한 행동이나 선택 가운데 몇 가지를 예로 든다.","meaning":"'Doing things like A or B; either A or B or the like.' Gives a couple of examples among many possible actions or choices, without fixing just one.","use":"Verb: -ㄴ/는다든지 (늘린다든지, 먹는다든지); adjective: -다든지; noun: (이)라든지; past: -았/었다든지. Usually two examples, then 하다 to close (…든지 …든지 하다). More colloquial than -거나 and with a stronger feel of 'for example'. Often followed by 해야 합니다 / 해 보세요 / 해요.","examples":[{"ko":"지원금을 늘린다든지 시설을 짓는다든지 해야 합니다.","en":"We need to do things like increase subsidies or build facilities."},{"ko":"주말에는 영화를 본다든지 친구를 만난다든지 하며 쉬어요.","en":"On weekends I relax by doing things like watching a movie or meeting friends."},{"ko":"피곤할 때는 잠을 잔다든지 산책을 한다든지 해 보세요.","en":"When you're tired, try things like sleeping or taking a walk."}],"notes":[{"kind":"주의","ko":"명사는 '(이)라든지', 형용사는 '-다든지', 동사는 '-ㄴ/는다든지'를 쓴다: 커피라든지 차라든지, 춥다든지 덥다든지.","en":"Nouns take (이)라든지, adjectives -다든지 (춥다든지 덥다든지), verbs -ㄴ/는다든지."},{"kind":"참고","ko":"'-거나'보다 구어적이다. 간단히 '-든지 -든지'로 줄여 쓰기도 한다.","en":"More colloquial than -거나; a shorter form -든지 -든지 is also common."}],"practice":[{"q":"지원금을 늘리다 / 시설을 짓다 →","a":"지원금을 늘린다든지 시설을 짓는다든지 해야 합니다.","en":"We need to do things like increase subsidies or build facilities."},{"q":"주말에 영화를 보다 / 운동을 하다 →","a":"주말에는 영화를 본다든지 운동을 한다든지 해요.","en":"On weekends I do things like watch a movie or exercise."},{"q":"스트레스를 받을 때 / 음악을 듣다 / 산책하다 →","a":"스트레스를 받을 때는 음악을 듣는다든지 산책을 한다든지 해 보세요.","en":"When stressed, try things like listening to music or taking a walk."},{"q":"피곤하다 / 커피 / 차 / 마시다 →","a":"피곤하면 커피라든지 차라든지 마셔 보세요.","en":"If you're tired, try having something like coffee or tea."}],"hl":"는?[다라]든지","drill":[{"ko":"숙제를 먼저 한다든지 청소를 먼저 한다든지 순서를 정하세요.","en":"Decide the order, like doing homework first or cleaning first."},{"ko":"쉬는 날에는 책을 읽는다든지 영화를 본다든지 해요.","en":"On days off I do things like read a book or watch a movie."},{"ko":"살을 빼려면 운동을 한다든지 식사량을 줄인다든지 해야 해요.","en":"To lose weight you need to exercise or cut down how much you eat."},{"ko":"모르는 단어가 있으면 사전을 찾아본다든지 친구에게 물어본다든지 하세요.","en":"If there's a word you don't know, look it up in a dictionary or ask a friend."},{"ko":"부모님께 선물로 꽃이라든지 과일이라든지 사 드리면 좋아해요.","en":"If you buy your parents something like flowers or fruit as a gift, they like it."},{"ko":"비가 오면 집에서 요리를 한다든지 게임을 한다든지 하며 보내요.","en":"When it rains I spend time at home cooking or playing games."},{"ko":"한국에 가면 경복궁에 간다든지 한강에서 자전거를 탄다든지 하고 싶어요.","en":"When I go to Korea I want to do things like visit Gyeongbokgung or bike by the Han River."},{"ko":"기분이 안 좋을 때는 노래를 부른다든지 일기를 쓴다든지 해 보세요.","en":"When you feel down, try things like singing or writing in a diary."},{"ko":"약속에 늦으면 미리 전화를 한다든지 문자를 보낸다든지 해야 해요.","en":"If you'll be late, you should call or text ahead of time."},{"ko":"회사에서는 이메일을 보낸다든지 전화를 건다든지 해서 연락해요.","en":"At work we get in touch by sending an email or making a call."}],"why":"When the speaker lists two sample options instead of naming one fixed choice, and usually closes with 하다 / 해 보세요 / 해야 한다, -다든지 … -다든지 fits; the paired examples are the clue.","hlShow":"는?[다라]든지"},{"id":"bg-b508","ch":6,"part":"읽기·말하기","title":"만약 A/V-(으)ㄹ 경우","form":"동사·형용사 어간 + -(으)ㄹ 경우 (받침 O: -을 경우 / 받침 X: -ㄹ 경우); 명사 + 의 경우 / 일 경우","pattern":"만약 A/V-(으)ㄹ 경우(에) ~","rule":"어떤 일이 일어날 수 있는 가정적인 상황을 나타낸다.","meaning":"'In the event that…; in case…'. Describes a possible (often unwanted) situation and what to do or what follows.","use":"Verb/adjective stem + -(으)ㄹ 경우 (-을 경우 after a consonant, -ㄹ 경우 after a vowel); past: -았/었을 경우; nouns: N의 경우 / N일 경우. 만약 ('if by any chance') is optional but common; 경우에(는) is also fine. The main clause often ends in -십시오, -아/어야 합니다 or -ㄹ 수 있습니다. Formal: rules, manuals, warnings, news.","examples":[{"ko":"만약 정책이 실패할 경우 문제가 커질 수 있습니다.","en":"In the event that the policy fails, the problem could grow."},{"ko":"만약 비가 올 경우에는 행사를 실내에서 합니다.","en":"In the event of rain, the event will be held indoors."},{"ko":"만약 길을 잃었을 경우 이 번호로 전화해 주십시오.","en":"If you should get lost, please call this number."}],"notes":[{"kind":"주의","ko":"'-(으)면'보다 가능성이 낮거나 예외적인 상황, 대비해야 할 일에 쓴다. 일상적이고 확실한 일에는 잘 쓰지 않는다.","en":"Compared with -(으)면, it suits unlikely, exceptional or 'be prepared' situations, not everyday, certain ones."},{"kind":"참고","ko":"명사 뒤에는 'N의 경우'나 'N일 경우'를 쓴다: 학생의 경우, 학생일 경우.","en":"After a noun use N의 경우 or N일 경우: 학생의 경우, 학생일 경우."}],"practice":[{"q":"정책이 실패하다 / 문제가 커지다 →","a":"만약 정책이 실패할 경우 문제가 커질 수 있습니다.","en":"If the policy fails, the problem could grow."},{"q":"길을 잃다 / 이 번호로 전화하다 →","a":"만약 길을 잃을 경우 이 번호로 전화하십시오.","en":"If you get lost, call this number."},{"q":"비가 오다 / 행사를 취소하다 →","a":"만약 비가 올 경우 행사를 취소합니다.","en":"In the event of rain, the event is canceled."},{"q":"물건이 고장 나다 / 일주일 안에 교환할 수 있다 →","a":"만약 물건이 고장 날 경우 일주일 안에 교환할 수 있습니다.","en":"If the item breaks, it can be exchanged within a week."}],"hl":"[가-힣] 경우","drill":[{"ko":"만약 화재가 발생할 경우 비상구로 대피해야 합니다.","en":"In the event of a fire, you must evacuate through the emergency exit."},{"ko":"만약 약속에 늦을 경우 미리 연락해 주세요.","en":"If you'll be late for the appointment, please contact me in advance."},{"ko":"만약 비밀번호를 잊어버릴 경우 고객센터에 문의하십시오.","en":"If you forget your password, please contact customer service."},{"ko":"만약 시험에 떨어질 경우 다시 신청할 수 있습니다.","en":"If you fail the exam, you can apply again."},{"ko":"만약 정전이 될 경우를 대비해서 손전등을 준비해 두세요.","en":"Prepare a flashlight in case of a power outage."},{"ko":"만약 학생일 경우 할인을 받을 수 있습니다.","en":"If you are a student, you can get a discount."},{"ko":"만약 회의가 취소될 경우 모든 참석자에게 알리겠습니다.","en":"If the meeting is canceled, I will notify all attendees."},{"ko":"만약 사고가 났을 경우 먼저 경찰에 신고해야 합니다.","en":"If an accident happens, you must first report it to the police."},{"ko":"만약 배송이 늦어질 경우 환불해 드립니다.","en":"If delivery is delayed, we will refund you."},{"ko":"만약 고객이 불만을 제기할 경우 신속하게 처리해야 합니다.","en":"If a customer raises a complaint, it must be handled promptly."}],"why":"A rule, warning or plan about something that might happen ('in case X occurs, do/then Y') calls for -(으)ㄹ 경우; the contingency framing (often 만약, 대비하다) is the cue.","hlShow":"[가-힣] 경우"},{"id":"bg-b574","ch":7,"part":"듣기·말하기","title":"웬만해서는 V-는 일이 없다","form":"웬만해서는 + 동사 어간 + -는 일이 없다 (습관) / -(으)ㄹ 일이 없다 (가능성)","pattern":"웬만해서는 V-는/(으)ㄹ 일이 없다","rule":"특별한 경우가 아니면 그런 일이 거의 일어나지 않는다는 뜻이다.","meaning":"'Under ordinary circumstances it hardly ever happens.' 웬만해서는 = unless something quite extreme comes up; 일이 없다 = there is no such occurrence.","use":"웬만해서는 (short: 웬만해선) opens the sentence, then V-는 일이 없다 for a habit ('hardly ever does') or V-(으)ㄹ 일이 없다 for 'won't happen' (things, events). 일이 없다 can shrink to 일 없다 in casual speech or ads. The sentence must end in a negative.","examples":[{"ko":"그는 웬만해서는 화를 내는 일이 없어요.","en":"He hardly ever gets angry."},{"ko":"이 휴대폰은 웬만해서는 고장 날 일이 없습니다.","en":"This phone won't break down under normal use."},{"ko":"저는 웬만해서는 약속에 늦는 일이 없어요.","en":"I hardly ever show up late for appointments."}],"notes":[{"kind":"주의","ko":"'웬만해서는' 뒤에는 항상 부정 표현(-는 일이 없다, -지 않다, -기 어렵다)이 온다. '웬만해서는 화를 낸다'는 틀린 문장이다.","en":"웬만해서는 is always followed by a negative expression (-는 일이 없다, -지 않다, -기 어렵다); '웬만해서는 화를 낸다' is wrong."},{"kind":"참고","ko":"'웬만하면'은 '가능하면'이라는 뜻이라 다르다: 웬만하면 오늘 끝내세요.","en":"웬만하면 is different: it means 'if at all possible' (웬만하면 오늘 끝내세요)."}],"practice":[{"q":"그는 화를 내다 / 거의 없다 →","a":"그는 웬만해서는 화를 내는 일이 없어요.","en":"He hardly ever gets angry."},{"q":"이 가방은 튼튼하다 / 찢어지다 →","a":"이 가방은 웬만해서는 찢어질 일이 없어요.","en":"This bag won't tear under normal use."},{"q":"아버지는 술을 마시다 / 거의 없다 →","a":"아버지는 웬만해서는 술을 마시는 일이 없으세요.","en":"My father hardly ever drinks alcohol."},{"q":"저는 약속에 늦다 / 거의 없다 →","a":"저는 웬만해서는 약속에 늦는 일이 없어요.","en":"I hardly ever arrive late for appointments."}],"hl":"웬만해(서는|선)","drill":[{"ko":"우리 선생님은 웬만해서는 숙제를 많이 내는 일이 없어요.","en":"Our teacher hardly ever gives a lot of homework."},{"ko":"이 유리는 웬만해서는 깨질 일이 없습니다.","en":"This glass won't break under normal circumstances."},{"ko":"저는 웬만해선 아침을 거르는 일이 없어요.","en":"I hardly ever skip breakfast."},{"ko":"그 친구는 웬만해서는 남에게 부탁하는 일이 없어요.","en":"That friend hardly ever asks others for favors."},{"ko":"이 앱은 웬만해서는 오류가 날 일이 없습니다.","en":"This app is unlikely to have errors under normal use."},{"ko":"동생은 웬만해서는 울 일이 없어요.","en":"My younger sibling hardly ever cries."},{"ko":"우리 팀은 웬만해서는 야근을 하는 일이 없어요.","en":"Our team hardly ever works overtime."},{"ko":"이렇게 튼튼한 자전거는 웬만해서는 고장 날 일이 없어요.","en":"A sturdy bike like this won't break down under normal use."},{"ko":"그 가게는 웬만해서는 문을 닫는 일이 없습니다.","en":"That shop hardly ever closes."},{"ko":"할머니는 웬만해서는 병원에 가는 일이 없으세요.","en":"My grandmother hardly ever goes to the hospital."}],"why":"A claim of 'basically never / won't normally happen' about habits or durability, with 일이 없다 (or another negative) at the end, signals 웬만해서는; it needs the ordinary-circumstances qualifier plus a negative ending.","hlShow":"웬만해(서는|선)"},{"id":"bg-b575","ch":7,"part":"듣기·말하기","title":"V-(으)랴 V-(으)랴","form":"동사 어간 + -(으)랴 (받침 O: -으랴 / 받침 X: -랴), 두 번 이상 반복","pattern":"V1-(으)랴 V2-(으)랴 바쁘다/정신이 없다/힘들다","rule":"두 가지 이상의 일을 동시에 해야 해서 바쁘거나 힘들다는 뜻이다.","meaning":"'Busy doing A and B (and more) all at once.' Several tasks pile up on the speaker, who is swamped or exhausted.","use":"Attach -(으)랴 to two (or more) action verbs: -랴 after a vowel stem (살림하랴), -으랴 after a consonant stem (먹으랴). Then end with a predicate of busyness or exhaustion: 바쁘다, 정신이 없다, 힘들다, 여유가 없다. The subject is the person doing the tasks; not used with commands or suggestions.","examples":[{"ko":"살림하랴 육아하랴 여유가 없습니다.","en":"Between housework and childcare, I have no room to breathe."},{"ko":"요즘 공부하랴 아르바이트하랴 정신이 없어요.","en":"These days, between studying and my part-time job, I'm swamped."},{"ko":"아침마다 밥을 하랴 도시락을 싸랴 눈코 뜰 새 없이 바빠요.","en":"Every morning I'm run off my feet cooking breakfast and packing lunches."}],"notes":[{"kind":"주의","ko":"같은 형태를 두 번 이상 써야 하고, 뒤에는 '바쁘다, 힘들다, 정신이 없다' 같은 말이 온다. 명령이나 청유는 쓸 수 없다.","en":"Use it twice (or more), followed by something like 바쁘다, 힘들다, 정신이 없다; commands and suggestions are not allowed."}],"practice":[{"q":"공부하다 / 아르바이트하다 / 정신이 없다 →","a":"공부하랴 아르바이트하랴 정신이 없어요.","en":"Between studying and my part-time job, I'm swamped."},{"q":"청소하다 / 빨래하다 / 하루가 모자라다 →","a":"청소하랴 빨래하랴 하루가 모자라요.","en":"Between cleaning and laundry, a day isn't enough."},{"q":"아이를 돌보다 / 일하다 / 너무 힘들다 →","a":"아이를 돌보랴 일하랴 너무 힘들어요.","en":"Caring for the kids and working, it's really hard."},{"q":"밥을 먹다 / 전화를 받다 / 바쁘다 →","a":"밥을 먹으랴 전화를 받으랴 바빠요.","en":"I'm busy eating and answering the phone at once."}],"hl":"으?랴","drill":[{"ko":"요즘 시험 준비하랴 보고서 쓰랴 잠잘 시간이 없어요.","en":"Lately, between exam prep and writing reports, I have no time to sleep."},{"ko":"어머니는 가게를 보시랴 집안일을 하시랴 쉴 틈이 없으세요.","en":"My mother is busy minding the shop and doing housework, with no time to rest."},{"ko":"이사하랴 새 직장을 구하랴 정신이 하나도 없었어요.","en":"Moving and looking for a new job, I was completely frazzled."},{"ko":"아이를 데려오랴 저녁을 준비하랴 퇴근 후에도 바빠요.","en":"Picking up the kids and making dinner, I'm busy even after work."},{"ko":"손님을 맞으랴 음식을 나르랴 직원들이 정신이 없습니다.","en":"Greeting guests and carrying food, the staff are swamped."},{"ko":"숙제를 하랴 친구를 만나랴 주말이 너무 짧아요.","en":"Between homework and meeting friends, the weekend is too short."},{"ko":"운동하랴 요리하랴 하루가 모자라요.","en":"Between exercising and cooking, a day isn't enough."},{"ko":"출장 가랴 보고서 쓰랴 이번 주는 눈코 뜰 새 없이 바빴어요.","en":"Between a business trip and writing reports, this week I was too busy to breathe."},{"ko":"집을 구하랴 이삿짐을 싸랴 한 달 내내 정신이 없었어요.","en":"Between house-hunting and packing, I was in a daze all month."},{"ko":"아이들 밥을 먹이랴 옷을 입히랴 아침마다 전쟁이에요.","en":"Feeding the kids and dressing them, every morning is a battle."}],"why":"A sentence that stacks two tasks one after another and ends with 'I'm busy / no time / exhausted' is the cue; the doubled -(으)랴 shows both tasks compete for the speaker's time.","hlShow":"으?랴"},{"id":"bg-b576","ch":7,"part":"듣기·말하기","title":"N은/는 늘 뒷전이다","form":"명사 + 은/는 + 늘(항상) + 뒷전이다","pattern":"N은/는 (늘/항상) 뒷전이다","rule":"다른 일에 밀려 가장 나중에, 가장 덜 중요하게 다뤄진다는 뜻이다.","meaning":"'X is always on the back burner.' Something (often oneself) is pushed to last place because other things come first.","use":"Topic N은/는 + 늘/항상 + 뒷전이다. Related: N을 뒷전으로 미루다 (put X off), N이 뒷전으로 밀리다 (X gets pushed back). Often used about oneself, one's health, rest or hobbies, in a slightly regretful or critical tone.","examples":[{"ko":"엄마는 가족 때문에 자기 자신은 늘 뒷전이에요.","en":"Mom always puts the family first, so she herself always comes last."},{"ko":"요즘 일이 너무 바빠서 건강은 늘 뒷전이에요.","en":"I'm so busy with work these days that my health always takes a back seat."},{"ko":"우리 가게는 손님이 많아서 직원 식사는 늘 뒷전이에요.","en":"Our shop gets so many customers that staff meals always come last."}],"notes":[{"kind":"주의","ko":"자기 자신, 건강, 취미처럼 소중한데 소홀히 하는 것에 쓴다. 후회나 비판의 느낌이 있다.","en":"Used for things that matter but get neglected — oneself, health, hobbies; it carries regret or criticism."},{"kind":"참고","ko":"'N을 뒷전으로 미루다 / N이 뒷전으로 밀리다' 형태도 자주 쓴다: 공부를 뒷전으로 미루고 게임만 했어요.","en":"Also common: N을 뒷전으로 미루다 / N이 뒷전으로 밀리다 (공부를 뒷전으로 미루고 게임만 했어요)."}],"practice":[{"q":"엄마 / 가족이 먼저이다 / 자신 →","a":"엄마는 가족이 먼저라서 자신은 늘 뒷전이에요.","en":"Mom puts family first, so she herself always comes last."},{"q":"일이 바쁘다 / 건강 →","a":"일이 너무 바빠서 건강은 늘 뒷전이에요.","en":"Work is so busy that my health always comes last."},{"q":"시험 기간이다 / 취미 →","a":"시험 기간이라서 취미는 늘 뒷전이에요.","en":"It's exam season, so hobbies always take a back seat."},{"q":"아이를 키우다 / 내 시간 →","a":"아이를 키우느라 내 시간은 늘 뒷전이에요.","en":"Raising a child means my own time always comes last."}],"hl":"뒷전","drill":[{"ko":"회사 일이 많아서 내 휴식은 늘 뒷전이죠.","en":"There's so much work that my rest always comes last."},{"ko":"바쁜 시기에는 운동이 늘 뒷전으로 밀려요.","en":"When I'm busy, exercise always gets pushed to the back burner."},{"ko":"우리 아빠는 가족을 위해 자신의 취미는 늘 뒷전이에요.","en":"My dad lives for the family, so his own hobbies always come last."},{"ko":"시험 기간에는 친구 만나는 일이 늘 뒷전이에요.","en":"During exams, meeting friends always comes last."},{"ko":"일이 우선이라 식사 시간은 늘 뒷전이 돼요.","en":"Work comes first, so mealtimes always get put off."},{"ko":"학생 때는 놀이보다 공부가 먼저라서 놀이는 늘 뒷전이었어요.","en":"As a student, studying came before play, so play was always last."},{"ko":"새 제품 개발에 집중하다 보니 고객 서비스는 늘 뒷전이에요.","en":"Focusing on new product development, customer service always comes last."},{"ko":"아이가 아플 때마다 내 일정은 늘 뒷전이에요.","en":"Whenever my child is sick, my own schedule always takes a back seat."},{"ko":"요리는 좋아하지만 바빠서 늘 뒷전으로 미루게 돼요.","en":"I like cooking but I'm busy, so I always end up putting it off."},{"ko":"그 회사는 이익만 생각해서 직원의 복지는 늘 뒷전이에요.","en":"That company only thinks about profit, so employee welfare always comes last."}],"why":"A person or thing that matters but loses out because 'something else comes first' (바빠서, 가족 때문에), said with a regretful tone, is the context for 늘 뒷전이다.","hlShow":"뒷전"},{"id":"bg-b649","ch":8,"part":"읽기·쓰기","title":"V-(으)면 끝이 아니다","form":"동사 어간 + -(으)면 끝이 아니다 (받침 O: -으면 / 받침 X, ㄹ: -면); 과거 끝이 아니었다","pattern":"V-(으)면 끝이 아니라 ~아/어야 하다","rule":"그 일을 하는 것만으로는 일이 완전히 마무리되지 않는다는 뜻이다.","meaning":"'It doesn't end with just doing…' Finishing step X is not the end of it; more still has to be done.","use":"Verb stem + -(으)면 끝이 아니다 (-으면 after a consonant, -면 after a vowel or ㄹ); the past 끝이 아니었다 is for something you realized afterwards. Often continues with 끝이 아니라 + what remains (…야 해요), or with a second sentence. Often preceded by 그냥/단순히. Informal: 끝이 아니야.","examples":[{"ko":"쓰레기는 그냥 버리면 끝이 아니에요. 종류별로 나눠서 버려야 해요.","en":"Just throwing out trash isn't the end of it. You have to sort it by type."},{"ko":"이사는 짐을 옮기면 끝이 아니에요. 정리가 더 힘들어요.","en":"Moving isn't over once you've carried the boxes. Organizing is harder."},{"ko":"원서를 내면 끝이 아니라 면접도 봐야 해요.","en":"Submitting the application isn't the end; you also have to do the interview."}],"notes":[{"kind":"주의","ko":"앞에 '그냥, 단순히'가 자주 오고, 뒤에는 남은 일(-아/어야 하다)이 이어진다.","en":"Often preceded by 그냥/단순히, and followed by what remains to be done (-아/어야 하다)."},{"kind":"참고","ko":"과거형 '끝이 아니었다'는 나중에 알게 된 사실을 말할 때 쓴다.","en":"The past form 끝이 아니었다 is used for a fact you realized afterwards."}],"practice":[{"q":"쓰레기를 버리다 / 종류별로 나누어야 하다 →","a":"쓰레기를 버리면 끝이 아니라 종류별로 나누어야 해요.","en":"Throwing out the trash isn't the end; you have to sort it by type."},{"q":"원서를 내다 / 면접도 봐야 하다 →","a":"원서를 내면 끝이 아니라 면접도 봐야 해요.","en":"Submitting the application isn't the end; you also have to do the interview."},{"q":"이사를 하다 / 정리가 남아 있다 →","a":"이사를 하면 끝이 아니에요. 정리가 남아 있어요.","en":"Moving isn't the end of it. The organizing is still left."},{"q":"계약서에 서명하다 / 돈을 내야 하다 →","a":"계약서에 서명하면 끝이 아니라 돈을 내야 해요.","en":"Signing the contract isn't the end; you also have to pay."}],"hl":"면 끝이 아","drill":[{"ko":"숙제는 하면 끝이 아니라 제출까지 해야 해요.","en":"Doing homework isn't the end; you have to hand it in too."},{"ko":"요리는 음식을 만들면 끝이 아니에요. 설거지도 해야죠.","en":"Cooking isn't over when the food is made. You have to do the dishes too."},{"ko":"집을 사면 끝이 아니라 관리도 잘해야 해요.","en":"Buying a house isn't the end; you also have to maintain it well."},{"ko":"시험은 보면 끝이 아니라 결과를 확인해야 해요.","en":"Taking an exam isn't the end; you have to check the results."},{"ko":"쓰레기를 버리면 끝이 아닌 줄 몰랐어요.","en":"I didn't know that throwing out the trash wasn't the end of it."},{"ko":"연습은 한 번 하면 끝이 아니에요. 계속 반복해야 해요.","en":"Practice isn't over after doing it once. You have to keep repeating."},{"ko":"그 일은 사과하면 끝이 아니었어요. 신뢰를 되찾는 것이 더 어려웠어요.","en":"Apologizing wasn't the end of that matter. Winning back trust was harder."},{"ko":"결혼은 식을 올리면 끝이 아니라 시작이에요.","en":"Marriage doesn't end with the ceremony; it begins there."},{"ko":"청소는 바닥을 쓸면 끝이 아니에요. 창문도 닦아야 해요.","en":"Cleaning isn't done once you sweep the floor. You have to wipe the windows too."},{"ko":"취직은 합격하면 끝이 아니라 적응하는 것이 더 중요해요.","en":"Getting a job isn't over once you pass; adjusting is more important."}],"why":"A sentence that names one step and then says there is still more to do (…야 하다, 더 중요하다) is where 끝이 아니다 fits; the contrast between the finished step and the remaining work is the clue.","hlShow":"면 끝이 아"}]};
const TR = {"zh":{"bg-b020":{"meaning":"已经够……了，偏偏又……；本来就……，还……。前面的情况已经不好，后面又添了更糟的事。","use":"把“가뜩이나”放在前一分句句首，形容词接 -(으)ㄴ데，动词接 -는데；后一分句再说另一件麻烦事（常和 또、-까지、게다가 一起用）。口语和书面语都可以用，多用于抱怨或表示同情，只能用于不好的情况。","ex":["我本来就忙，又有新的工作冒出来了。","我本来就没钱，连钱包也弄丢了。"],"notes":["前面的情况必须是不好的，不能用于好事。例如：(×) 가뜩이나 기분이 좋은데…"]},"bg-b105":{"meaning":"根据……（说）……：先说明信息的来源（新闻、调查、专家等），再用间接引语转述内容。","use":"在来源名词（뉴스、조사、연구、기사、선생님 말씀等）后加 에 의하면 或 에 따르면，句尾用间接引用形式：形容词/过去时用 -다고 하다，现在时动词用 -ㄴ/는다고 하다，名词用 -(이)라고 하다；口语中缩略为 -대요。两者可以互换，语气较正式，常见于新闻和报告。","ex":["据新闻报道，明天起会下大雨。","根据问卷调查，60%的大学生在打工。"],"notes":["后面不能接命令（-(으)세요）或建议（-(으)ㄹ까요?），只能转述信息。例如：(×) 뉴스에 따르면 우산을 가져가세요。"]},"bg-b106":{"meaning":"间接引语缩略后兼作连接词。-다면서＝“听说……（是吗？）”，用来确认听来的内容；-다니까＝“既然说……／我都说了……”，表示依据别人的话，或强调；-다는데＝“听说……，（所以）……”，为后面的建议、请求等铺垫背景。","use":"接在原形后：动词 -ㄴ/는다-，形容词 -다-，名词 -(이)라-，再加 면서/니까/는데。-다면서(요)? 主要用来确认听来的事；-다니까 表示以别人说的话为理由，或对方不相信时强调“我说了就是”；-다는데 先交代听来的背景，后面接建议、请求或另一个陈述。多用于口语，转述的是别人告诉你的内容，不是你自己亲眼所见。","ex":["听说这家餐厅很好吃，对吧？我也想去。","既然民秀说没关系，那就直接吃吧。","听说明天下雨，带上伞吧。"],"notes":["-다면서(요)? 用来确认听来的事；自己亲眼看到的事不能用。"]},"bg-b058":{"meaning":"据某人说……／某人说……：根据某人说的话来转述信息。","use":"在人物名词（친구、의사、민수 씨等）后加 말로는，句尾用缩略引用 -대요：动词 -ㄴ/는대요，形容词 -대요，名词 -(이)래요，命令 -(으)래요，建议 -재요，过去 -았/었대요。多用于口语，语气亲切而礼貌；新闻、调查等书面或官方来源请用 에 따르면。","ex":["医生说不用太担心。","朋友说那部电影真的很好看。"],"notes":["“말로는”用于某个人说的话；新闻、问卷调查自然应该用“에 따르면”。","“말로는 ~지만”也可表示“嘴上说……（但实际并非如此）”，例如：말로는 괜찮다고 했지만 표정이 안 좋았어요（嘴上说没关系，但脸色不好）。"]},"bg-b077":{"meaning":"反问句：“哪有……的道理？”“怎么能……呢！”表示某种行为不合理、不可接受。","use":"动词现在时接 -는 게，形容词接 -(으)ㄴ 게，后面加 어디 있어요?（也可用 -니?、-습니까?）。这里不是问地点，而是抱怨、抗议：“根本没有这种事”。用于朋友、家人等关系较近的人；对长辈说会显得没礼貌。说话人通常很生气，重音落在 게 前面的动作上。","ex":["约好了却连个联系都没有就不来，哪有这样的？","朋友病着，你却一个人出去玩，哪有这样的？"],"notes":["这是语气很强的反问句，不要对长辈使用；也不要当作询问地点的问题来回答。"]},"bg-b329":{"meaning":"“我以……为对象，就……做了问卷调查。”这是问卷调查发表的开头句：问了谁、问了什么主题。","use":"在调查对象后加 을/를 대상으로（学生 30명을、직장인을……），在主题后加 에 대해（취미에 대해……），最后用 설문 조사를 했습니다 结尾（发表时用 -ㅂ니다 体）。书面语也常用“설문 조사를 실시했습니다”。带上人数、年龄段（30명、20대），样本会更清楚。","ex":["我以我们班30名同学为对象，就手机使用时间做了问卷调查。","我们小组以50名20多岁的上班族为对象，就下班后的时间做了问卷调查。"],"notes":["有收音用 을（30명을），没有收音用 를（남녀를）。要说“대상으로”，不要换成“대상에게”；主题另用“에 대해”说明。"]},"bg-b330":{"meaning":"“……占（数字）%，最多。”用来说明问卷调查中回答最多的项目及其比例。","use":"在回答/项目后加 이/가，在比例后加 로（60%로、52.5%로），再说 가장 많았습니다。因为调查已经结束，所以用过去时 많았다；发表时用 -ㅂ니다 体，书面用 많았다。变体：…(이)라고 대답한 사람이 40%로 가장 많았습니다；表示比率时也可用 가장 높았습니다。","ex":["回答“运动”的人占40%，最多。","作为压力的原因，学业占52%，最多。"],"notes":["“가장 많았습니다”用过去时，因为调查已经结束。比率可以用“가장 높았습니다”。"]},"bg-b331":{"meaning":"“其次依次是A、B、C。”在说完最多的结果后，按从多到少的顺序列出其余结果。","use":"先说最多的结果，再说 그 다음으로는，然后用逗号把项目按从多到少列出，最后一个项目后加 의，以 순이었습니다 结尾（순＝顺序）。因为调查已经结束，所以用过去时 이었습니다。想加比例，可写成 중식(20%), 일식(15%)의 순이었습니다。书面语常用 이었다。","ex":["韩餐最多，其次依次是中餐、日餐。","其次依次是看电影、读书、运动。"],"notes":["最后一个项目后面接“의”，项目之间用逗号：중식, 일식의 순이었습니다。这里不要用 이/가。"]},"bg-b332":{"meaning":"“除此之外，也有……的意见。”在说完主要结果后，补充提到少数的、其他的意见。","use":"以 그 밖에（除此之外）开头。意见部分是“引用句 + 는”修饰 의견：形容词 -다는，动词 -ㄴ/는다는，名词 -(이)라는，过去 -았/었다는。后面接 의견도 있었습니다（도＝也）。也可以把 의견 换成 대답、응답，或用 기타 의견으로는 … 开头。发表时用 -ㅂ니다 体。","ex":["除此之外，也有人认为没有时间。","除此之外，也有人认为价格太贵。"],"notes":["意见前要用 -다는 的形式，动词用 -ㄴ/는다는：(×) 가다는 의견 → (○) 간다는 의견。"]},"bg-b333":{"meaning":"“通过这些结果，我们可以知道……。”这是问卷调查发表的结尾句，说明从数据中得出的结论。","use":"先说 결과를 통해（通过结果），再接以 -다는 것을 结尾的从句（动词 -ㄴ/는다는，形容词 -다는，名词 -(이)라는），最后用 알 수 있었습니다（可以得知）。이러한＝这样的、这些。类似说法：알게 되었습니다；语气较委婉时用 것으로 보입니다；书面语用 알 수 있었다。","ex":["通过这些结果，我们可以知道大学生因为就业问题而有很多担忧。","通过这次问卷调查的结果，我们可以知道学生们比起运动更想要休息。"],"notes":["“통해”前要有助词 을/를：결과를 통해（○）/ 결과에 통해（×）。意思相同的“통하여”也可以用。"]},"bg-b390":{"meaning":"“名义上叫X，实际上其实是Y。”先承认名称或表面说法，再说明真实情况并不一样、往往更糟。","use":"在“말이”和“(이)지”之间放名词(元音结尾用“지”，如 휴가지；辅音结尾用“이지”，如 여행이지)，加逗号，后面说明真实情况，常配合“사실은/실제로는”。多用于口语，常带抱怨或调侃的语气。","ex":["名义上是休假，其实每天都在工作。","说是蜜月旅行，其实几乎都在吵架。","说是兼职，其实干的活和正式员工一样。"],"notes":["后半句必须说出与名称不同的真实情况；名称与实际一致时不能用。","也常用“말이 좋아 N(이)지, …”的形式，意思是“说得好听，其实不过是……”。"]},"bg-b391":{"meaning":"“在……之中；纵观整个……；把……全部算在内”。把一个范围(群体、整段旅行、一生)整体看一遍，再指出最……的、唯一的或第一次的。","use":"名词后接“을/를 통틀어(서)”(辅音结尾用을，元音结尾用를)，“서”可省略。后面常接“가장/제일 + 形容词”“처음이다”“한 번도 ~지 않다”。名词必须是一个范围：多个对象或较长的时期。书面和口语都可用。","ex":["整个旅行中，今天最开心。","全班里韩语说得最好的人是民秀。","我这辈子第一次吃到这么好吃的东西。"],"notes":["后面通常接“가장、제일、처음、한 번도”等词；名词必须是一个范围(多个对象或长时期)，单个事物会显得不自然。"]},"bg-b505":{"meaning":"“因为；由于”。较正式、多用于书面的理由，引出结论或决定。","use":"辅音结尾的词干接“-으므로”，元音或ㄹ结尾的词干接“-므로”；过去用“-았/었으므로”；名词用“이므로”(如 학생이므로)。多用于报告、通知、演讲、新闻，日常对话中几乎不用。后句一般不用命令句和共动句，口语用“-(으)니까”或“-아/어서”。","ex":["由于出生率低，需要采取对策。","此处正在施工，禁止出入。","物价持续上涨，所以必须减少生活开支。"],"notes":["“-(으)므로”后面一般不用命令句或共动句；日常对话用“-아/어서”“-(으)니까”。","“-(으)ㅁ으로써”表示方法、手段(通过……)，要与表示原因的“-(으)므로”区分开。"]},"bg-b506":{"meaning":"“不仅……而且……；再加上……”。在前一个情况之上再增加后一个情况，两者通常性质相同(都是好事或都是坏事)。","use":"形容词用“-(으)ㄴ 데다가”(비싼、좋은)，动词用“-는 데다가”(오는)，名词用“인 데다가”，动词过去用“-(으)ㄴ 데다가”或“-았/었는 데다가”。后句常带“-도/-까지”。前后两件事方向要一致。口语书面都可用，句首用“게다가”表示同样意思。","ex":["物价贵，再加上房价也高。","又下雨又刮风，所以特别冷。","那家餐厅不仅好吃，价格还便宜，所以客人很多。"],"notes":["前后内容应同为好事或同为坏事才自然。“비싼 데다가 맛있어요”很别扭。","在句首用“게다가”：물가가 비쌉니다. 게다가 집값도 높습니다。"]},"bg-b507":{"meaning":"“做……或……之类的”。从多种可能的行动或选择中举出几个例子，并不限定其一。","use":"动词：-ㄴ/는다든지(늘린다든지、먹는다든지)；形容词：-다든지；名词：(이)라든지；过去：-았/었다든지。通常举两项，最后用“하다”收尾(…든지 …든지 하다)。比“-거나”口语化，更有“比如”的感觉。后面常接“해야 합니다/해 보세요/해요”。","ex":["必须采取增加补助金或建设设施之类的措施。","周末我会看看电影、见见朋友之类的来休息。","累的时候，可以睡一觉或散散步之类的。"],"notes":["名词用“(이)라든지”，形容词用“-다든지”(춥다든지 덥다든지)，动词用“-ㄴ/는다든지”。","比“-거나”更口语化，也常简化为“-든지 -든지”。"]},"bg-b508":{"meaning":"“万一……的情况下；如果发生……”。设想一种可能出现(多为不希望出现)的情况，并说明应对方法或后果。","use":"动词/形容词词干 + -(으)ㄹ 경우(辅音结尾用-을 경우，元音结尾用-ㄹ 경우)；过去：-았/었을 경우；名词：N의 경우、N일 경우。“만약”(万一)可省略但很常用，也可说“경우에(는)”。后句常用-십시오、-아/어야 합니다、-ㄹ 수 있습니다。多用于规定、说明书、警告、新闻等正式场合。","ex":["万一政策失败，问题可能会扩大。","万一下雨，活动改在室内举行。","万一迷路，请拨打这个号码。"],"notes":["与“-(으)면”相比，多用于可能性较低、例外或需要预防的情况，不用于日常、确定的事。","名词后用“N의 경우”或“N일 경우”：학생의 경우、학생일 경우。"]},"bg-b574":{"meaning":"“一般情况下几乎不会发生。”웬만해서는 = 除非很特殊；일이 없다 = 没有这种事。","use":"句首用“웬만해서는”(缩略“웬만해선”)，然后用“V-는 일이 없다”表示习惯(基本不会做某事)，用“V-(으)ㄹ 일이 없다”表示不会发生(多用于物品、事态)。口语或广告中“일이 없다”可略作“일 없다”。句子必须以否定结尾。","ex":["他一般不会发火。","这部手机正常情况下不会出故障。","我一般不会迟到。"],"notes":["“웬만해서는”后面总是接否定表达(-는 일이 없다、-지 않다、-기 어렵다)。“웬만해서는 화를 낸다”是错句。","“웬만하면”意思不同，是“可能的话”(웬만하면 오늘 끝내세요)。"]},"bg-b575":{"meaning":"“又要……又要……，忙得不可开交。”几件事同时压在身上，所以很忙很累。","use":"接在两个(或更多)动作动词后：元音词干接“-랴”(살림하랴)，辅音词干接“-으랴”(먹으랴)。后面以表示忙碌或疲惫的谓语结尾：바쁘다、정신이 없다、힘들다、여유가 없다。主语是做这些事的人，不能与命令句、共动句连用。","ex":["又要操持家务又要带孩子，一点空闲都没有。","最近又要学习又要打工，忙得晕头转向。","每天早上又要做饭又要装便当，忙得不可开交。"],"notes":["必须重复使用两次以上，后面接“바쁘다、힘들다、정신이 없다”等；不能用于命令句和共动句。"]},"bg-b576":{"meaning":"“……总是被放在最后。”因为别的事优先，某事(常常是自己)总被搁在一边、排在最后。","use":"主题 N은/는 + 늘/항상 + 뒷전이다。相关表达：N을 뒷전으로 미루다(把……搁置一边)、N이 뒷전으로 밀리다(……被挤到后面)。常用于说自己、健康、休息、爱好，带有些许遗憾或批评的语气。","ex":["妈妈总是为了家人，把自己放在最后。","最近工作太忙，健康总是被放在一边。","我们店客人多，员工的饭总是排在最后。"],"notes":["用于自己、健康、爱好等本来重要却被忽视的事物，带有后悔或批评的意味。","也常说“N을 뒷전으로 미루다 / N이 뒷전으로 밀리다”(공부를 뒷전으로 미루고 게임만 했어요)。"]},"bg-b649":{"meaning":"“光……还没完；做完……并不算结束。”完成了某一步并不等于事情结束，后面还有事要做。","use":"动词词干 + -(으)면 끝이 아니다(辅音结尾用-으면，元音或ㄹ结尾用-면)；事后才发现的事用过去式“끝이 아니었다”。常接“끝이 아니라 + 还剩下的事”(……야 해요)，或另起一句说明。常与“그냥/단순히”连用。口语：끝이 아니야。","ex":["垃圾随手一扔可不算完事，还得按种类分类再扔。","搬家不是把行李搬完就结束了，整理更累。","交了申请书还不算完，还得参加面试。"],"notes":["前面常有“그냥、단순히”，后面接还剩下要做的事(-아/어야 하다)。","过去式“끝이 아니었다”用于事后才发现的事实。"]}},"th":{"bg-b020":{"meaning":"อยู่แล้วก็...ยังจะ...อีก — สถานการณ์แย่อยู่แล้ว แล้วยังมีเรื่องแย่ซ้ำเข้ามาอีก","use":"วาง 가뜩이나 ไว้หน้าประโยคแรก คำคุณศัพท์ต่อ -(으)ㄴ데 กริยาต่อ -는데 ประโยคหลังบอกเรื่องแย่เพิ่มอีกเรื่อง (มักใช้กับ 또, -까지, 게다가) ใช้ทั้งภาษาพูดและภาษาเขียนเวลาบ่นหรือเห็นใจ และใช้ได้กับเรื่องไม่ดีเท่านั้น","ex":["ก็ยุ่งอยู่แล้ว ยังมีงานเข้ามาอีก","เงินก็ไม่มีอยู่แล้ว ยังทำกระเป๋าสตางค์หายอีก"],"notes":["สถานการณ์ต้องเป็นเรื่องไม่ดี ห้ามใช้กับเรื่องดี เช่น (×) 가뜩이나 기분이 좋은데…"]},"bg-b105":{"meaning":"ตามที่ N ... : บอกแหล่งที่มาของข้อมูล (ข่าว แบบสำรวจ ผู้เชี่ยวชาญ) ก่อน แล้วรายงานเนื้อหาด้วยประโยคอ้างอิงทางอ้อม","use":"ต่อ 에 의하면 หรือ 에 따르면 หลังคำนามแหล่งข้อมูล (뉴스, 조사, 연구, 기사, 선생님 말씀 ฯลฯ) แล้วลงท้ายด้วยรูปอ้างอิง: คำคุณศัพท์/อดีตใช้ -다고 하다 กริยาปัจจุบันใช้ -ㄴ/는다고 하다 คำนามใช้ -(이)라고 하다 ในภาษาพูดย่อเป็น -대요 ทั้งสองแบบใช้แทนกันได้ ค่อนข้างเป็นทางการ พบบ่อยในข่าวและรายงาน","ex":["ตามข่าว ตั้งแต่พรุ่งนี้ฝนจะตกหนัก","จากแบบสำรวจ นักศึกษามหาวิทยาลัย 60% ทำงานพิเศษ"],"notes":["หลังสองรูปนี้ใช้ประโยคคำสั่ง (-(으)세요) หรือชวน (-(으)ㄹ까요?) ไม่ได้ ต้องรายงานข้อมูลเท่านั้น เช่น (×) 뉴스에 따르면 우산을 가져가세요"]},"bg-b106":{"meaning":"คำเชื่อมที่ย่อมาจากประโยคอ้างอิง -다면서 = “ได้ยินมาว่า... จริงไหม” ใช้ยืนยันเรื่องที่ได้ยินมา; -다니까 = “ก็เขาบอกว่า... / บอกแล้วไงว่า...” ใช้เป็นเหตุผลจากคำพูดของคนอื่นหรือย้ำ; -다는데 = “เห็นว่า... (ก็เลย/แต่)...” เป็นฉากหลังก่อนข้อเสนอแนะ คำขอ หรือประโยคต่อไป","use":"ต่อกับรูปพื้นฐาน: กริยา -ㄴ/는다- คำคุณศัพท์ -다- คำนาม -(이)라- แล้วตามด้วย 면서/니까/는데 -다면서(요)? ใช้ถามยืนยันเรื่องที่ได้ยินมา; -다니까 ใช้บอกเหตุผลจากคำพูดของคนอื่น หรือย้ำเมื่อฟังไม่เชื่อ; -다는데 บอกที่มาก่อนแล้วตามด้วยคำแนะนำ คำขอ หรือข้อความอื่น ใช้ในภาษาพูด และใช้กับเรื่องที่ได้ยินมา ไม่ใช่เรื่องที่เห็นเอง","ex":["ได้ยินมาว่าร้านนี้อร่อย จริงไหม ฉันก็อยากไปเหมือนกัน","ในเมื่อมินซูบอกว่าไม่เป็นไร ก็กินกันเลยเถอะ","ได้ยินว่าพรุ่งนี้ฝนจะตก เอาร่มไปด้วยนะ"],"notes":["-다면서(요)? ใช้ถามยืนยันเรื่องที่ได้ยินมา ไม่ใช้กับเรื่องที่เห็นเอง"]},"bg-b058":{"meaning":"ตามที่ ... บอก / ... บอกว่า... : ถ่ายทอดข้อมูลที่ได้มาจากคำพูดของใครคนหนึ่ง","use":"วางชื่อคน (친구, 의사, 민수 씨 ฯลฯ) หน้า 말로는 แล้วลงท้ายด้วยรูปอ้างอิงแบบย่อ -대요: กริยา -ㄴ/는대요 คำคุณศัพท์ -대요 คำนาม -(이)래요 คำสั่ง -(으)래요 ข้อเสนอ -재요 อดีต -았/었대요 เป็นภาษาพูดสุภาพสบาย ๆ ถ้าแหล่งข้อมูลเป็นข่าวหรือแบบสำรวจให้ใช้ 에 따르면","ex":["หมอบอกว่าไม่ต้องกังวลมากก็ได้","เพื่อนบอกว่าหนังเรื่องนั้นสนุกมาก"],"notes":["말로는 ใช้กับคำพูดของคน ถ้าเป็นข่าวหรือแบบสำรวจใช้ 에 따르면 จะเป็นธรรมชาติกว่า","말로는 ~지만 ยังแปลว่า “ปากบอกว่า... (แต่จริงไม่ใช่)” ได้ด้วย เช่น 말로는 괜찮다고 했지만 표정이 안 좋았어요 (ปากบอกว่าไม่เป็นไร แต่สีหน้าไม่ดี)"]},"bg-b077":{"meaning":"คำถามเชิงตำหนิ: “จะมีที่ไหนที่...” / “ทำแบบนี้ได้ยังไง!” แสดงว่าการกระทำนั้นไม่สมเหตุสมผลและรับไม่ได้","use":"กริยาปัจจุบันต่อ -는 게 คำคุณศัพท์ต่อ -(으)ㄴ 게 แล้วตามด้วย 어디 있어요? (หรือ -니? / -습니까?) ไม่ได้ถามสถานที่ แต่เป็นการบ่นหรือประท้วงว่า “ไม่มีเรื่องแบบนี้หรอก” ใช้กับเพื่อน คนในครอบครัว หรือคนสนิท ถ้าใช้กับผู้ใหญ่จะเสียมารยาท ผู้พูดมักกำลังไม่พอใจ และเน้นเสียงที่การกระทำก่อน 게","ex":["นัดกันแล้วแต่ไม่ติดต่อมาเลยแล้วก็ไม่มา ทำแบบนี้ได้ยังไง","เพื่อนป่วยอยู่ แต่ไปเที่ยวคนเดียว มีที่ไหนกัน"],"notes":["เป็นคำถามเชิงตำหนิที่แรง อย่าใช้กับผู้ใหญ่ และอย่าตอบเหมือนเป็นคำถามถามสถานที่"]},"bg-b329":{"meaning":"“ฉัน (พวกเรา) ทำแบบสำรวจเรื่อง... กับกลุ่มตัวอย่าง...” ประโยคเปิดของการนำเสนอแบบสำรวจ บอกว่า
