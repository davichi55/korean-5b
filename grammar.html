ถามใครและถามเรื่องอะไร","use":"ใส่กลุ่มเป้าหมายหน้า 을/를 대상으로 (학생 30명을, 직장인을 ...) ใส่หัวข้อหน้า 에 대해 (취미에 대해 ...) แล้วจบด้วย 설문 조사를 했습니다 (ใช้ -ㅂ니다 แบบทางการในการนำเสนอ) ในงานเขียนอาจใช้ 설문 조사를 실시했습니다 ได้ การใส่จำนวนคนหรือช่วงอายุ (30명, 20대) ทำให้กลุ่มตัวอย่างชัดเจน","ex":["ฉันทำแบบสำรวจเรื่องเวลาใช้โทรศัพท์มือถือ กับนักเรียนในห้อง 30 คน","กลุ่มของเราทำแบบสำรวจเรื่องเวลาหลังเลิกงาน กับพนักงานบริษัทวัย 20 ปลาย ๆ 50 คน"],"notes":["คำที่มีตัวสะกดใช้ 을 (30명을) ไม่มีตัวสะกดใช้ 를 (남녀를) ใช้ 대상으로 ไม่ใช้ 대상에게 และบอกหัวข้อแยกด้วย 에 대해"]},"bg-b330":{"meaning":"“...มีมากที่สุด คือ ...%” ใช้บอกคำตอบที่ได้มากที่สุดในแบบสำรวจพร้อมสัดส่วน","use":"ใส่ 이/가 หลังคำตอบหรือรายการ ใส่ 로 หลังเปอร์เซ็นต์ (60%로, 52.5%로) แล้วตามด้วย 가장 많았습니다 ใช้อดีต 많았다 เพราะแบบสำรวจจบไปแล้ว ในการนำเสนอใช้ -ㅂ니다 ในงานเขียนใช้ 많았다 รูปแบบอื่น: …(이)라고 대답한 사람이 40%로 가장 많았습니다 ถ้าเป็นอัตราส่วนใช้ 가장 높았습니다 ได้","ex":["คนที่ตอบว่า “ออกกำลังกาย” มีมากที่สุด คือ 40%","สาเหตุของความเครียด การเรียนมีมากที่สุด คือ 52%"],"notes":["ใช้อดีต 많았습니다 เพราะแบบสำรวจเสร็จแล้ว ถ้าเป็นอัตราส่วนอาจใช้ 가장 높았습니다"]},"bg-b331":{"meaning":"“รองลงมาคือ A, B, C ตามลำดับ” ใช้เรียงผลลัพธ์รองลงมาจากมากไปน้อย หลังบอกผลที่มากที่สุดแล้ว","use":"บอกผลที่มากที่สุดก่อน แล้วตามด้วย 그 다음으로는 จากนั้นเรียงรายการจากมากไปน้อยโดยคั่นด้วยจุลภาค ใส่ 의 หลังรายการสุดท้าย และปิดด้วย 순이었습니다 (순 = ลำดับ) ใช้อดีต 이었습니다 เพราะแบบสำรวจจบแล้ว ถ้าต้องการใส่เปอร์เซ็นต์ เขียนว่า 중식(20%), 일식(15%)의 순이었습니다 ในงานเขียนมักใช้ 이었다","ex":["อาหารเกาหลีมากที่สุด รองลงมาคืออาหารจีนและอาหารญี่ปุ่นตามลำดับ","รองลงมาคือดูหนัง อ่านหนังสือ ออกกำลังกายตามลำดับ"],"notes":["ใส่ 의 หลังรายการสุดท้าย และคั่นรายการด้วยจุลภาค เช่น 중식, 일식의 순이었습니다 ห้ามใช้ 이/가 ตรงนี้"]},"bg-b332":{"meaning":"“นอกจากนี้ ก็ยังมีความเห็นว่า...ด้วย” ใช้พูดถึงความเห็นอื่น ๆ ที่มีน้อยหลังจากรายงานผลหลักแล้ว","use":"เริ่มประโยคด้วย 그 밖에 (นอกจากนี้) ส่วนความเห็นคือประโยคอ้างอิง + 는 ขยาย 의견: คำคุณศัพท์ -다는 กริยา -ㄴ/는다는 คำนาม -(이)라는 อดีต -았/었다는 แล้วตามด้วย 의견도 있었습니다 (도 = ด้วย) จะเปลี่ยน 의견 เป็น 대답 หรือ 응답 ก็ได้ หรือเริ่มด้วย 기타 의견으로는 ... แทนก็ได้ ในการนำเสนอใช้ -ㅂ니다","ex":["นอกจากนี้ ยังมีความเห็นว่าไม่มีเวลา","นอกจากนี้ ยังมีความเห็นว่าราคาแพงเกินไป"],"notes":["หน้า 의견 ต้องใช้รูป -다는 กริยาใช้ -ㄴ/는다는 เช่น (×) 가다는 의견 → (○) 간다는 의견"]},"bg-b333":{"meaning":"“จากผลเหล่านี้ ทำให้รู้ว่า...” ประโยคปิดการนำเสนอแบบสำรวจ บอกข้อสรุปที่ได้จากข้อมูล","use":"ขึ้นต้นด้วย 결과를 통해 (จากผลลัพธ์) ตามด้วยอนุประโยคที่ลงท้าย -다는 것을 (กริยา -ㄴ/는다는 คำคุณศัพท์ -다는 คำนาม -(이)라는) แล้วจบด้วย 알 수 있었습니다 (ทำให้ทราบว่า) 이러한 = เช่นนี้ เหล่านี้ สำนวนใกล้เคียง: 알게 되었습니다; ถ้าอยากพูดระมัดระวังขึ้นใช้ 것으로 보입니다; ในงานเขียนใช้ 알 수 있었다","ex":["จากผลเหล่านี้ ทำให้รู้ว่านักศึกษากังวลเรื่องหางานมาก","จากผลแบบสำรวจครั้งนี้ ทำให้รู้ว่านักศึกษาอยากพักผ่อนมากกว่าออกกำลังกาย"],"notes":["หน้า 통해 ต้องมีกรรมการก 을/를: 결과를 통해 (○) / 결과에 통해 (×) ใช้ 통하여 แทนได้เช่นกัน"]},"bg-b390":{"meaning":"“เรียกว่า X ก็จริง แต่ที่จริงแล้ว…” ยอมรับชื่อหรือภาพลักษณ์ก่อน แล้วบอกว่าความจริงต่างออกไป มักแย่กว่าที่เรียก","use":"ใส่คำนามระหว่าง 말이 กับ (이)지 (ลงท้ายด้วยสระใช้ 지 เช่น 휴가지, ลงท้ายด้วยพยัญชนะใช้ 이지 เช่น 여행이지) ตามด้วยจุลภาค แล้วบอกสถานการณ์จริง มักใช้กับ 사실은/실제로는 ใช้ในภาษาพูด มักเป็นการบ่นหรือพูดประชด","ex":["เรียกว่าลาพักร้อน แต่จริง ๆ แล้วทำงานทุกวัน","เรียกว่าฮันนีมูน แต่จริง ๆ ก็ทะเลาะกันอย่างเดียว","เรียกว่างานพาร์ทไทม์ แต่งานที่ทำก็เหมือนพนักงานประจำ"],"notes":["ประโยคหลังต้องบอกความจริงที่ต่างจากชื่อที่เรียก ถ้าชื่อกับความจริงตรงกันก็ไม่ใช้","มักใช้ในรูป 말이 좋아 N(이)지, … ด้วย แปลว่า 'พูดให้ดูดี แต่จริง ๆ แล้วก็แค่…'"]},"bg-b391":{"meaning":"“ในบรรดา…ทั้งหมด / ตลอด… / เมื่อรวมทั้งหมด” มองภาพรวมทั้งช่วงหรือกลุ่ม (กลุ่มคน ทริปทั้งทริป ทั้งชีวิต) แล้วชี้ว่าอะไรดีที่สุด แย่ที่สุด มีอย่างเดียว หรือเป็นครั้งแรก","use":"คำนาม + 을/를 통틀어(서) (ลงท้ายพยัญชนะใช้ 을 ลงท้ายสระใช้ 를) ตัด 서 ได้ ประโยคหลังมักมี 가장/제일 + คำคุณศัพท์, 처음이다 หรือ 한 번도 ~지 않다 คำนามต้องเป็นขอบเขตกว้าง เช่น หลายสิ่งหรือช่วงเวลายาว ใช้ได้ทั้งพูดและเขียน","ex":["ตลอดทริปนี้ วันนี้สนุกที่สุด","ทั้งห้องของเรา คนที่พูดเกาหลีเก่งที่สุดคือมินซู","ทั้งชีวิตเพิ่งเคยกินอาหารอร่อยขนาดนี้เป็นครั้งแรก"],"notes":["ข้างหลังมักตามด้วย 가장/제일/처음/한 번도 คำนามต้องเป็นขอบเขตกว้าง (หลายสิ่งหรือช่วงยาว) ถ้าเป็นสิ่งเดียวจะฟังแปลก"]},"bg-b505":{"meaning":"“เนื่องจาก; เพราะ” เหตุผลที่เป็นทางการ ใช้ในภาษาเขียนเป็นส่วนใหญ่ เพื่อนำไปสู่ข้อสรุปหรือการตัดสินใจ","use":"ก้านที่ลงท้ายด้วยพยัญชนะใช้ -으므로 ก้านที่ลงท้ายด้วยสระหรือ ㄹ ใช้ -므로 อดีตใช้ -았/었으므로 คำนามใช้ 이므로 (เช่น 학생이므로) ใช้ในรายงาน ประกาศ สุนทรพจน์ ข่าว แทบไม่ใช้ในการสนทนาทั่วไป ประโยคหลังโดยปกติไม่ใช้ประโยคคำสั่งหรือชวน ในภาษาพูดใช้ -(으)니까 หรือ -아/어서 แทน","ex":["เนื่องจากอัตราการเกิดต่ำ จึงจำเป็นต้องมีมาตรการ","ที่นี่กำลังก่อสร้าง จึงห้ามเข้า","ราคาสินค้าขึ้นต่อเนื่อง จึงต้องลดค่าครองชีพ"],"notes":["หลัง -(으)므로 ปกติไม่ใช้ประโยคคำสั่งหรือชวน ในภาษาพูดประจำวันใช้ -아/어서 หรือ -(으)니까","-(으)ㅁ으로써 บอกวิธีหรือวิถีทาง (โดยการ…) ต้องแยกจาก -(으)므로 ที่บอกเหตุผล"]},"bg-b506":{"meaning":"“นอกจากจะ… แล้วยัง…; ไม่ใช่แค่…แต่ยัง…” เพิ่มข้อเท็จจริงอย่างที่สองบนข้อแรก มักเป็นแนวเดียวกัน (ดีทั้งคู่หรือแย่ทั้งคู่)","use":"คำคุณศัพท์ใช้ -(으)ㄴ 데다가 (비싼, 좋은) กริยาใช้ -는 데다가 (오는) คำนามใช้ 인 데다가 กริยาอดีตใช้ -(으)ㄴ 데다가 หรือ -았/었는 데다가 ประโยคหลังมักมี -도/-까지 ข้อเท็จจริงสองอย่างต้องไปทางเดียวกัน ใช้ได้ทั้งพูดและเขียน ส่วน 게다가 ใช้ขึ้นต้นประโยคด้วยความหมายเดียวกัน","ex":["ของแพงแล้ว ราคาบ้านก็สูงอีกด้วย","ฝนตกแล้วลมยังพัดอีก เลยหนาวมาก","ร้านนั้นอร่อยแล้วราคายังถูกด้วย เลยมีลูกค้าเยอะ"],"notes":["ข้อเท็จจริงสองอย่างควรดีทั้งคู่หรือแย่ทั้งคู่ ถึงจะฟังเป็นธรรมชาติ '비싼 데다가 맛있어요' ฟังแปลก","ถ้าขึ้นต้นประโยคใหม่ ใช้ 게다가: 물가가 비쌉니다. 게다가 집값도 높습니다."]},"bg-b507":{"meaning":"“ทำอะไรทำนอง A หรือ B; ไม่ A ก็ B” ยกตัวอย่างสองสามอย่างจากการกระทำหรือทางเลือกที่เป็นไปได้หลายอย่าง โดยไม่ได้กำหนดว่าต้องเป็นอย่างใดอย่างหนึ่ง","use":"กริยา: -ㄴ/는다든지 (늘린다든지, 먹는다든지) คำคุณศัพท์: -다든지 คำนาม: (이)라든지 อดีต: -았/었다든지 มักยกสองตัวอย่างแล้วปิดด้วย 하다 (…든지 …든지 하다) เป็นภาษาพูดมากกว่า -거나 และให้ความรู้สึกว่า 'ยกตัวอย่าง' มักตามด้วย 해야 합니다/해 보세요/해요","ex":["ต้องทำอะไรทำนองเพิ่มเงินสนับสนุนหรือสร้างสิ่งอำนวยความสะดวก","วันหยุดฉันพักผ่อนด้วยการดูหนังหรือไปเจอเพื่อน","เวลาเหนื่อย ลองนอนหรือเดินเล่นดูสิ"],"notes":["คำนามใช้ (이)라든지 คำคุณศัพท์ใช้ -다든지 (춥다든지 덥다든지) กริยาใช้ -ㄴ/는다든지","เป็นภาษาพูดมากกว่า -거나 และมักย่อเป็น -든지 -든지"]},"bg-b508":{"meaning":"“ในกรณีที่…; หากเกิด… ขึ้น” สมมติสถานการณ์ที่อาจเกิดขึ้น (มักเป็นเรื่องที่ไม่อยากให้เกิด) แล้วบอกว่าควรทำอะไรหรือจะเกิดอะไรตามมา","use":"ก้านกริยา/คำคุณศัพท์ + -(으)ㄹ 경우 (ลงท้ายพยัญชนะใช้ -을 경우 ลงท้ายสระใช้ -ㄹ 경우) อดีต: -았/었을 경우 คำนาม: N의 경우 / N일 경우 만약 ('ถ้าบังเอิญว่า') จะละก็ได้แต่ใช้บ่อย 경우에(는) ก็ใช้ได้ ประโยคหลักมักเป็น -십시오, -아/어야 합니다, -ㄹ 수 있습니다 เป็นทางการ ใช้ในกฎ คู่มือ คำเตือน ข่าว","ex":["หากนโยบายล้มเหลว ปัญหาอาจใหญ่ขึ้น","หากฝนตก จะจัดงานในร่ม","หากหลงทาง โปรดโทรไปที่หมายเลขนี้"],"notes":["เมื่อเทียบกับ -(으)면 ใช้กับสถานการณ์ที่มีโอกาสเกิดน้อย ยกเว้น หรือเรื่องที่ต้องเตรียมรับมือ ไม่ค่อยใช้กับเรื่องประจำวันหรือเรื่องที่แน่นอน","หลังคำนามใช้ 'N의 경우' หรือ 'N일 경우': 학생의 경우, 학생일 경우"]},"bg-b574":{"meaning":"“ในสถานการณ์ปกติแทบไม่เกิดขึ้น” 웬만해서는 = ถ้าไม่ถึงขั้นรุนแรงจริง ๆ 일이 없다 = ไม่มีเรื่องแบบนั้นเกิดขึ้น","use":"ขึ้นต้นประโยคด้วย 웬만해서는 (ย่อเป็น 웬만해선) ตามด้วย V-는 일이 없다 สำหรับนิสัย (แทบไม่เคยทำ) หรือ V-(으)ㄹ 일이 없다 สำหรับ 'จะไม่เกิดขึ้น' (ของหรือเหตุการณ์) ในภาษาพูดหรือโฆษณา 일이 없다 อาจเหลือ 일 없다 ประโยคต้องลงท้ายด้วยรูปปฏิเสธ","ex":["เขาแทบไม่เคยโกรธง่าย ๆ","โทรศัพท์เครื่องนี้ในการใช้งานปกติจะไม่เสียง่าย ๆ","ฉันแทบไม่เคยไปสายตามนัด"],"notes":["หลัง 웬만해서는 ต้องเป็นรูปปฏิเสธเสมอ (-는 일이 없다, -지 않다, -기 어렵다) ประโยค '웬만해서는 화를 낸다' ผิด","웬만하면 ต่างกัน แปลว่า 'ถ้าเป็นไปได้' (웬만하면 오늘 끝내세요)"]},"bg-b575":{"meaning":"“ต้องทำทั้ง A ทั้ง B พร้อม ๆ กันจนยุ่งไปหมด” งานหลายอย่างกองอยู่ที่ผู้พูด จึงยุ่งหรือเหนื่อยมาก","use":"ใส่ -(으)랴 หลังกริยาสองตัวขึ้นไป: ก้านลงท้ายสระใช้ -랴 (살림하랴) ลงท้ายพยัญชนะใช้ -으랴 (먹으랴) แล้วจบด้วยคำที่บอกว่ายุ่งหรือเหนื่อย เช่น 바쁘다, 정신이 없다, 힘들다, 여유가 없다 ประธานคือคนที่ทำงานเหล่านั้น ไม่ใช้กับประโยคคำสั่งหรือชวน","ex":["ทั้งทำงานบ้านทั้งเลี้ยงลูก ไม่มีเวลาว่างเลย","ช่วงนี้ทั้งเรียนทั้งทำพาร์ทไทม์ ยุ่งจนหัวหมุน","ทุกเช้าทั้งหุงข้าวทั้งห่อข้าวกล่อง ยุ่งจนไม่มีเวลาหายใจ"],"notes":["ต้องใช้ซ้ำสองครั้งขึ้นไป และตามด้วยคำอย่าง 바쁘다, 힘들다, 정신이 없다 ใช้กับประโยคคำสั่งหรือชวนไม่ได้"]},"bg-b576":{"meaning":"“X มักถูกเก็บไว้ท้ายสุดเสมอ” บางสิ่ง (มักเป็นตัวเอง) ถูกผลักไปอยู่ลำดับท้ายสุดเพราะมีเรื่องอื่นสำคัญกว่า","use":"หัวข้อ N은/는 + 늘/항상 + 뒷전이다 สำนวนที่เกี่ยวข้อง: N을 뒷전으로 미루다 (เลื่อนสิ่งนั้นไปไว้ทีหลัง), N이 뒷전으로 밀리다 (ถูกผลักไปไว้ท้าย) มักใช้พูดถึงตัวเอง สุขภาพ การพักผ่อน หรืองานอดิเรก ด้วยน้ำเสียงเสียดายหรือตำหนิเล็กน้อย","ex":["แม่ทำเพื่อครอบครัว ตัวเองเลยมาทีหลังเสมอ","ช่วงนี้งานยุ่งมาก สุขภาพเลยมาทีหลังเสมอ","ร้านเรามีลูกค้าเยอะ มื้ออาหารของพนักงานเลยมาทีหลังเสมอ"],"notes":["ใช้กับสิ่งที่สำคัญแต่ถูกละเลย เช่น ตัวเอง สุขภาพ งานอดิเรก มีความรู้สึกเสียดายหรือตำหนิ","มักใช้ในรูป N을 뒷전으로 미루다 / N이 뒷전으로 밀리다 ด้วย (공부를 뒷전으로 미루고 게임만 했어요)"]},"bg-b649":{"meaning":"“แค่ … ยังไม่จบ; ทำ … แล้วไม่ได้แปลว่าเสร็จ” การทำขั้นตอนหนึ่งเสร็จยังไม่ใช่ที่สิ้นสุด ยังมีอีกหลายอย่างต้องทำ","use":"ก้านกริยา + -(으)면 끝이 아니다 (ลงท้ายพยัญชนะ -으면, ลงท้ายสระหรือ ㄹ -면) อดีต 끝이 아니었다 ใช้เมื่อเพิ่งรู้ภายหลัง มักตามด้วย 끝이 아니라 + สิ่งที่ยังเหลือ (…야 해요) หรือประโยคถัดไป มักใช้กับ 그냥/단순히 แบบไม่เป็นทางการ: 끝이 아니야","ex":["แค่ทิ้งขยะเฉย ๆ ยังไม่จบ ต้องแยกประเภทก่อนทิ้งด้วย","การย้ายบ้านไม่ได้จบแค่ขนของ การจัดของยิ่งเหนื่อยกว่า","แค่ยื่นใบสมัครยังไม่จบ ต้องสัมภาษณ์ด้วย"],"notes":["ข้างหน้ามักมี 그냥/단순히 และข้างหลังตามด้วยสิ่งที่ยังต้องทำ (-아/어야 하다)","รูปอดีต 끝이 아니었다 ใช้เมื่อเพิ่งรู้ความจริงภายหลัง"]}},"ru":{"bg-b020":{"meaning":"«И без того ...», «и так уже ...»: ситуация и так плохая, и к ней добавляется ещё одна неприятность.","use":"Ставится в начале первой части; прилагательные + -(으)ㄴ데, глаголы + -는데. Вторая часть сообщает о новой беде (часто с 또, -까지, 게다가). Используется в речи и на письме для жалобы или сочувствия; подходит только для плохих ситуаций.","ex":["Я и так занят, а тут ещё и новая работа появилась.","У меня и так нет денег, а я ещё и кошелёк потерял."],"notes":["Ситуация должна быть плохой; о хорошем так не говорят, например: (×) 가뜩이나 기분이 좋은데…"]},"bg-b105":{"meaning":"«Согласно N, ...» / «По данным N, ...»: сначала называется источник информации (новости, опрос, эксперт), затем содержание передаётся косвенной речью.","use":"Присоединяется 에 의하면 или 에 따르면 к существительному-источнику (뉴스, 조사, 연구, 기사, 선생님 말씀 и т. п.), в конце — форма косвенной речи: -다고 하다 (прилагательные, прошедшее), -ㄴ/는다고 하다 (глаголы в настоящем), -(이)라고 하다 (существительные); в разговоре сокращается до -대요. Оба варианта взаимозаменяемы, звучат довольно официально, типичны для новостей и отчётов.","ex":["По новостям, с завтрашнего дня будут сильные дожди.","По данным опроса, 60% студентов подрабатывают."],"notes":["После этих оборотов нельзя использовать приказ (-(으)세요) или предложение (-(으)ㄹ까요?): только передачу информации. Например: (×) 뉴스에 따르면 우산을 가져가세요."]},"bg-b106":{"meaning":"Сокращённые формы косвенной речи, служащие связками. -다면서 = «говорят, что ... (правда?)» — проверка услышанного; -다니까 = «раз (он) говорит, что ...» / «я же говорю ...» — причина со слов другого или настойчивость; -다는데 = «говорят, что ..., (так что) ...» — фон перед советом, просьбой или продолжением.","use":"Присоединяются к простой форме: глагол -ㄴ/는다-, прилагательное -다-, существительное -(이)라-, затем 면서/니까/는데. -다면서(요)? в основном уточняет услышанное; -다니까 даёт причину по чужим словам или настаивает, когда собеседник не верит; -다는데 задаёт фон, после которого идёт совет, просьба или другое высказывание. Разговорные формы; передают то, что вам сказали, а не то, что вы видели сами.","ex":["Говорят, в этом ресторане вкусно, правда? Я тоже хочу сходить.","Раз Минсу говорит, что всё нормально, давайте просто поедим.","Говорят, завтра будет дождь, возьмите зонт."],"notes":["-다면서(요)? уточняет услышанное; о том, что вы видели сами, так не говорят."]},"bg-b058":{"meaning":"«По словам N, ...» / «N говорит, что ...»: передача информации со слов конкретного человека.","use":"Ставьте имя человека (친구, 의사, 민수 씨 и т. д.) перед 말로는, затем сообщайте сокращённой косвенной формой -대요: глагол -ㄴ/는대요, прилагательное -대요, существительное -(이)래요, приказ -(으)래요, предложение -재요, прошедшее -았/었대요. Разговорная, вежливо-непринуждённая форма; для новостей, статей и опросов используйте 에 따르면.","ex":["Врач говорит, что особо волноваться не нужно.","По словам друга, этот фильм очень интересный."],"notes":["말로는 употребляется со словами человека; для новостей и опросов естественнее 에 따르면.","말로는 ~지만 может значить и «на словах ... (но на деле не так)», например: 말로는 괜찮다고 했지만 표정이 안 좋았어요 (на словах сказал, что всё нормально, но вид у него был мрачный)."]},"bg-b077":{"meaning":"Риторический вопрос: «Где это видано, чтобы ...?» / «Как можно ...!» — поступок неразумен и недопустим.","use":"К глаголу (настоящее время) добавляется -는 게, к прилагательному -(으)ㄴ 게, затем 어디 있어요? (или -니? / -습니까?). Это не вопрос о месте, а упрёк или протест: «такого не бывает». Употребляется с друзьями, родными, ровесниками; старшему по положению так говорить грубо. Говорящий обычно раздражён, ударение падает на действие перед 게.","ex":["Договориться о встрече и не прийти, даже не предупредив, — где это видано?","Друг болеет, а ты один идёшь гулять — как так можно?"],"notes":["Это резкий риторический вопрос: не говорите так старшим и не отвечайте на него, как на вопрос о месте."]},"bg-b329":{"meaning":"«Я (мы) провёл(и) опрос на тему ... среди ...». Вступительная фраза презентации опроса: кого опрашивали и о чём.","use":"Группа респондентов ставится перед 을/를 대상으로 (학생 30명을, 직장인을 ...), тема — перед 에 대해 (취미에 대해 ...), завершает 설문 조사를 했습니다 (в докладе — официальный стиль -ㅂ니다). В письменной речи встречается и 설문 조사를 실시했습니다. Число и возраст (30명, 20대) делают выборку понятной.","ex":["Я провёл опрос среди 30 студентов нашей группы о времени пользования телефоном.","Наша группа провела опрос среди 50 работников в возрасте от 20 до 29 лет о том, как они проводят время после работы."],"notes":["После согласной — 을 (30명을), после гласной — 를 (남녀를). Говорите 대상으로, а не 대상에게; тема вводится отдельно через 에 대해."]},"bg-b330":{"meaning":"«Чаще всего — N%». Так называют самый частый ответ в опросе и его долю.","use":"После ответа или пункта ставится 이/가, после процента — 로 (60%로, 52.5%로), затем 가장 많았습니다. Прошедшее время 많았다, потому что опрос уже закончен; в докладе -ㅂ니다, в тексте 많았다. Варианты: …(이)라고 대답한 사람이 40%로 가장 많았습니다; для долей также 가장 높았습니다.","ex":["Ответ «спорт» дали 40% — это самый частый ответ.","Среди причин стресса чаще всего (52%) назвали учёбу."],"notes":["Прошедшее время 많았습니다 используется потому, что опрос уже завершён. Для долей можно сказать и 가장 높았습니다."]},"bg-b331":{"meaning":"«Далее по убыванию шли A, B и C». После самого частого ответа по порядку перечисляются остальные результаты.","use":"Сначала назовите лидирующий результат, затем скажите 그 다음으로는 и перечислите пункты по убыванию через запятую; после последнего пункта ставится 의, и фраза заканчивается на 순이었습니다 (순 = порядок). Прошедшее время 이었습니다, так как опрос завершён. Проценты можно добавить так: 중식(20%), 일식(15%)의 순이었습니다. В письменной речи часто 이었다.","ex":["Корейская кухня на первом месте, далее по порядку китайская и японская.","Далее по порядку шли кино, чтение и спорт."],"notes":["После последнего пункта ставится 의, пункты разделяются запятыми: 중식, 일식의 순이었습니다. Частицы 이/가 здесь не используются."]},"bg-b332":{"meaning":"«Кроме того, были и мнения, что ...». Упоминаются редкие, прочие мнения после основных результатов.","use":"Предложение начинается с 그 밖에 («кроме этого»). Мнение — это цитатная конструкция + 는, определяющая 의견: прилагательное -다는, глагол -ㄴ/는다는, существительное -(이)라는, прошедшее -았/었다는. Далее 의견도 있었습니다 (도 = тоже). Вместо 의견 можно сказать 대답 или 응답; можно начать и с 기타 의견으로는 …. В докладе — стиль -ㅂ니다.","ex":["Кроме того, было мнение, что не хватает времени.","Кроме того, было мнение, что цены слишком высокие."],"notes":["Перед 의견 нужна форма на -다는; у глагола — -ㄴ/는다는: (×) 가다는 의견 → (○) 간다는 의견."]},"bg-b333":{"meaning":"«Из этих результатов мы смогли понять, что ...». Заключительная фраза презентации опроса — вывод из данных.","use":"Начинается с 결과를 통해 («по результатам»), затем придаточное с -다는 것을 (глагол -ㄴ/는다는, прилагательное -다는, существительное -(이)라는) и 알 수 있었습니다 («можно было увидеть/понять»). 이러한 = «такие, эти». Похожее: 알게 되었습니다; осторожнее — 것으로 보입니다; в письменной речи — 알 수 있었다.","ex":["Эти результаты показали, что студентов сильно беспокоит трудоустройство.","Результаты этого опроса показали, что студенты хотят отдыхать больше, чем заниматься спортом."],"notes":["Перед 통해 нужна частица 을/를: 결과를 통해 (○) / 결과에 통해 (×). Синоним — 통하여."]},"bg-b390":{"meaning":"«Называется это X, но на самом деле…» Сначала признаётся название или внешний вид, затем говорится, что реальность другая, часто хуже.","use":"Существительное ставится между 말이 и (이)지 (после гласной — 지: 휴가지, после согласной — 이지: 여행이지), затем запятая и описание реальности, часто со 사실은/실제로는. Разговорная конструкция, часто с жалобой или иронией.","ex":["Это называлось отпуском, но на самом деле я каждый день только работал(а).","Называлось свадебным путешествием, а мы почти всё время только ссорились.","Называется подработкой, но работа такая же, как у штатного сотрудника."],"notes":["Во второй части должна быть реальность, отличная от названия; если название и суть совпадают, конструкция не используется.","Часто встречается в форме 말이 좋아 N(이)지, … — «звучит красиво, а на деле всего лишь…»."]},"bg-b391":{"meaning":"«Из всего…; за всё…; если взять всё вместе». Окидываете взглядом весь набор или период (группу, всю поездку, всю жизнь) и называете лучшее, худшее, единственное или первое.","use":"Существительное + 을/를 통틀어(서) (을 после согласной, 를 после гласной); 서 можно опустить. Дальше обычно идёт 가장/제일 + прилагательное, 처음이다 или 한 번도 ~지 않다. Существительное должно обозначать диапазон: много предметов или долгий период. Подходит и для письма, и для речи.","ex":["За всю эту поездку сегодняшний день был самым весёлым.","Во всём нашем классе лучше всех говорит по-корейски Минсу.","За всю жизнь я впервые ем такую вкусную еду."],"notes":["После обычно идут 가장/제일/처음/한 번도; существительное должно обозначать диапазон (много предметов или длительный период), для единичного предмета звучит странно."]},"bg-b505":{"meaning":"«Так как; поскольку; ввиду того что» — формальная, в основном письменная причина, из которой следует вывод или решение.","use":"К основе на согласную -으므로, на гласную или ㄹ -므로; прошедшее -았/었으므로; к существительному 이므로 (학생이므로). Употребляется в отчётах, объявлениях, речах, новостях, почти не встречается в обычной беседе. В следующей части обычно не ставят повелительное и побудительное наклонение; в разговоре используют -(으)니까 или -아/어서.","ex":["Так как рождаемость низкая, необходимы меры.","Здесь идёт строительство, поэтому вход запрещён.","Цены продолжают расти, поэтому расходы на жизнь нужно сокращать."],"notes":["После -(으)므로 обычно не употребляют повелительное и побудительное; в повседневной речи используют -아/어서 или -(으)니까.","-(으)ㅁ으로써 выражает способ, средство («путём…»); не путайте его с -(으)므로, которое выражает причину."]},"bg-b506":{"meaning":"«Мало того что…, так ещё…; вдобавок к тому что…». К первому факту добавляется второй, обычно того же рода (оба хорошие или оба плохие).","use":"Прилагательное: -(으)ㄴ 데다가 (비싼, 좋은); глагол: -는 데다가 (오는); существительное: 인 데다가; глагол в прошедшем: -(으)ㄴ 데다가 или -았/었는 데다가. Во второй части часто стоят -도/-까지. Оба факта должны быть одной направленности. Подходит для речи и письма; в начале предложения аналог — 게다가.","ex":["Цены высокие, да ещё и жильё дорогое.","Шёл дождь, да ещё и ветер дул, поэтому было очень холодно.","В том ресторане вкусно, да ещё и недорого, поэтому много посетителей."],"notes":["Оба факта должны быть либо хорошими, либо плохими; «비싼 데다가 맛있어요» звучит неестественно.","Для начала нового предложения используется 게다가: 물가가 비쌉니다. 게다가 집값도 높습니다."]},"bg-b507":{"meaning":"«Делать что-то вроде А или Б; то А, то Б». Приводятся один-два примера из многих возможных действий или вариантов, без жёсткого выбора.","use":"Глагол: -ㄴ/는다든지 (늘린다든지, 먹는다든지); прилагательное: -다든지; существительное: (이)라든지; прошедшее: -았/었다든지. Обычно приводят два пункта и завершают словом 하다 (…든지 …든지 하다). Разговорнее, чем -거나, сильнее ощущается «например». Далее часто 해야 합니다 / 해 보세요 / 해요.","ex":["Нужно, например, увеличить пособия или построить объекты инфраструктуры.","По выходным я отдыхаю: смотрю фильмы, встречаюсь с друзьями и тому подобное.","Когда устанете, попробуйте, например, поспать или прогуляться."],"notes":["К существительным — (이)라든지, к прилагательным — -다든지 (춥다든지 덥다든지), к глаголам — -ㄴ/는다든지.","Разговорнее, чем -거나; часто сокращают до -든지 -든지."]},"bg-b508":{"meaning":"«В случае, если…; если вдруг…». Описывается возможная (часто нежелательная) ситуация и то, что нужно делать или что последует.","use":"Основа глагола/прилагательного + -(으)ㄹ 경우 (-을 경우 после согласной, -ㄹ 경우 после гласной); прошедшее: -았/었을 경우; существительные: N의 경우 / N일 경우. 만약 («если вдруг») необязательно, но часто используется; возможно и 경우에(는). В главной части часто -십시오, -아/어야 합니다, -ㄹ 수 있습니다. Формальный стиль: правила, инструкции, предупреждения, новости.","ex":["Если политика окажется неудачной, проблема может усугубиться.","В случае дождя мероприятие пройдёт в помещении.","Если вы заблудитесь, позвоните, пожалуйста, по этому номеру."],"notes":["В отличие от -(으)면, подходит для маловероятных, исключительных ситуаций или тех, к которым нужно подготовиться; для обыденного и несомненного почти не используется.","После существительного используйте «N의 경우» или «N일 경우»: 학생의 경우, 학생일 경우."]},"bg-b574":{"meaning":"«При обычных обстоятельствах этого почти не бывает». 웬만해서는 = если не случится что-то из ряда вон выходящее; 일이 없다 = такого не происходит.","use":"Предложение начинается с 웬만해서는 (сокращённо 웬만해선), далее V-는 일이 없다 — привычка («почти никогда не делает») или V-(으)ㄹ 일이 없다 — «не случится» (о вещах и событиях). В разговорной речи или рекламе 일이 없다 может сокращаться до 일 없다. Предложение должно заканчиваться отрицанием.","ex":["Он почти никогда не злится.","Этот телефон при обычном использовании не сломается.","Я почти никогда не опаздываю на встречи."],"notes":["После 웬만해서는 всегда стоит отрицание (-는 일이 없다, -지 않다, -기 어렵다); «웬만해서는 화를 낸다» — ошибка.","웬만하면 имеет другое значение — «по возможности» (웬만하면 오늘 끝내세요)."]},"bg-b575":{"meaning":"«Занят(а) и тем, и этим одновременно». На говорящего наваливается несколько дел сразу, поэтому он занят или измотан.","use":"-(으)랴 присоединяется к двум (или более) глаголам действия: -랴 после основы на гласную (살림하랴), -으랴 после основы на согласную (먹으랴). Затем идёт сказуемое со значением «занят/измотан»: 바쁘다, 정신이 없다, 힘들다, 여유가 없다. Подлежащее — тот, кто делает дела; с повелительным и побудительным не употребляется.","ex":["Между домашними делами и воспитанием ребёнка у меня нет свободной минуты.","В последнее время то учёба, то подработка — голова идёт кругом.","Каждое утро то готовлю завтрак, то собираю обеды — ни минуты передохнуть."],"notes":["Нужно употреблять дважды и более, а затем 바쁘다, 힘들다, 정신이 없다 и т.п.; повеления и предложения недопустимы."]},"bg-b576":{"meaning":"«X всегда отодвигается на задний план». Что-то (часто сам человек) оказывается на последнем месте, потому что другое важнее.","use":"Тема N은/는 + 늘/항상 + 뒷전이다. Родственные выражения: N을 뒷전으로 미루다 (откладывать X на потом), N이 뒷전으로 밀리다 (X оттесняется). Часто о себе, здоровье, отдыхе, увлечениях — с оттенком сожаления или упрёка.","ex":["Мама всё делает ради семьи, поэтому сама всегда на последнем месте.","В последнее время я так занят(а) работой, что здоровье всегда на последнем месте.","У нас в магазине много клиентов, поэтому обед сотрудников всегда откладывается на потом."],"notes":["Употребляется для важного, но забываемого: себя, здоровья, увлечений; несёт оттенок сожаления или упрёка.","Часто встречаются также N을 뒷전으로 미루다 / N이 뒷전으로 밀리다 (공부를 뒷전으로 미루고 게임만 했어요)."]},"bg-b649":{"meaning":"«Одним лишь… дело не заканчивается». Выполнить шаг X ещё не значит закончить — остаётся ещё многое.","use":"Основа глагола + -(으)면 끝이 아니다 (-으면 после согласной, -면 после гласной или ㄹ); прошедшее 끝이 아니었다 — о том, что стало ясно позже. Часто далее 끝이 아니라 + то, что осталось (…야 해요), либо отдельное предложение. Нередко с 그냥/단순히. В разговоре: 끝이 아니야.","ex":["Просто выбросить мусор — это ещё не всё. Его нужно сортировать по видам.","Переезд не заканчивается, когда перевёз вещи. Разбирать их ещё труднее.","Подать заявление — ещё не конец, нужно пройти и собеседование."],"notes":["Часто с 그냥/단순히 перед ним; далее — то, что ещё нужно сделать (-아/어야 하다).","Прошедшее 끝이 아니었다 используется, когда это стало понятно позже."]}},"vi":{"bg-b020":{"meaning":"Vốn đã ... lại còn ...: tình huống vốn đã không tốt, giờ lại thêm một chuyện tệ hơn.","use":"Đặt 가뜩이나 ở đầu vế trước; tính từ + -(으)ㄴ데, động từ + -는데. Vế sau nêu thêm một rắc rối (thường đi với 또, -까지, 게다가). Dùng cả khi nói và viết để phàn nàn hoặc thông cảm; chỉ dùng cho chuyện xấu, không dùng cho chuyện vui.","ex":["Vốn đã bận rồi mà lại phát sinh thêm việc.","Vốn đã không có tiền mà còn làm mất cả ví."],"notes":["Tình huống phải là chuyện không tốt, ví dụ không nói: (×) 가뜩이나 기분이 좋은데…"]},"bg-b105":{"meaning":"Theo N thì ...: nêu nguồn thông tin (tin tức, khảo sát, chuyên gia) trước rồi thuật lại nội dung bằng câu trích dẫn gián tiếp.","use":"Gắn 에 의하면 hoặc 에 따르면 vào danh từ chỉ nguồn (뉴스, 조사, 연구, 기사, 선생님 말씀…), cuối câu dùng dạng trích dẫn gián tiếp: -다고 하다 (tính từ/quá khứ), -ㄴ/는다고 하다 (động từ hiện tại), -(이)라고 하다 (danh từ); trong văn nói rút gọn thành -대요. Hai cách này dùng thay nhau được, khá trang trọng, hay gặp trong tin tức và báo cáo.","ex":["Theo tin tức, từ ngày mai trời sẽ mưa rất to.","Theo khảo sát, 60% sinh viên đại học đi làm thêm."],"notes":["Phía sau không dùng câu mệnh lệnh (-(으)세요) hoặc rủ rê (-(으)ㄹ까요?), chỉ thuật lại thông tin. Ví dụ sai: (×) 뉴스에 따르면 우산을 가져가세요."]},"bg-b106":{"meaning":"Dạng rút gọn của câu trích dẫn dùng làm từ nối. -다면서 = 'nghe nói ... (có đúng không?)', dùng để xác nhận điều nghe được; -다니까 = 'vì (họ) nói rằng ... / tôi đã bảo là ...', nêu lý do từ lời người khác hoặc nhấn mạnh; -다는데 = 'nghe nói ..., (nên/nhưng) ...', làm nền cho lời khuyên, lời nhờ hoặc câu tiếp theo.","use":"Gắn vào dạng nguyên: động từ -ㄴ/는다-, tính từ -다-, danh từ -(이)라-, rồi thêm 면서/니까/는데. -다면서(요)? chủ yếu để hỏi lại điều đã nghe; -다니까 nêu lý do dựa trên lời người khác hoặc nhấn mạnh khi người nghe không tin; -다는데 nêu bối cảnh nghe được rồi nối tiếp bằng lời khuyên, đề nghị hoặc nhận định khác. Dùng trong văn nói, cho điều được kể lại chứ không phải điều tự mình thấy.","ex":["Nghe nói quán này ngon đúng không? Mình cũng muốn đi thử.","Minsu bảo không sao thì cứ ăn thôi.","Nghe nói mai trời mưa, bạn nhớ mang ô nhé."],"notes":["-다면서(요)? dùng để xác nhận điều đã nghe; không dùng cho điều chính mình đã thấy."]},"bg-b058":{"meaning":"Theo lời N thì ... / N nói rằng ...: truyền đạt thông tin dựa trên lời của một người.","use":"Đặt tên người (친구, 의사, 민수 씨…) trước 말로는, rồi thuật lại bằng dạng trích dẫn rút gọn -대요: động từ -ㄴ/는대요, tính từ -대요, danh từ -(이)래요, mệnh lệnh -(으)래요, rủ rê -재요, quá khứ -았/었대요. Dùng trong hội thoại thân mật mà lịch sự; với tin tức, bài báo, khảo sát hãy dùng 에 따르면.","ex":["Bác sĩ nói là không cần lo lắng quá.","Theo lời bạn tôi, bộ phim đó rất hay."],"notes":["말로는 dùng với lời của một người; với tin tức hay khảo sát, dùng 에 따르면 sẽ tự nhiên hơn.","말로는 ~지만 còn có nghĩa 'ngoài miệng nói ... (nhưng thực tế không phải)', ví dụ: 말로는 괜찮다고 했지만 표정이 안 좋았어요 (ngoài miệng nói không sao nhưng nét mặt thì không ổn)."]},"bg-b077":{"meaning":"Câu hỏi tu từ: 'Làm gì có chuyện ...?' / 'Sao lại có thể ... được!' Diễn tả hành động đó vô lý, không thể chấp nhận.","use":"Động từ hiện tại + -는 게, tính từ + -(으)ㄴ 게, rồi 어디 있어요? (hoặc -니? / -습니까?). Không phải hỏi địa điểm mà là phàn nàn, phản đối: 'làm gì có chuyện như vậy'. Dùng với bạn bè, người nhà, người ngang hàng; nói với người trên sẽ bất lịch sự. Người nói thường đang bực, nhấn mạnh vào hành động ngay trước 게.","ex":["Hẹn rồi mà không liên lạc gì cũng không đến, làm gì có chuyện như vậy?","Bạn đang ốm mà lại một mình đi chơi, làm gì có chuyện đó?"],"notes":["Đây là câu hỏi tu từ khá gay gắt, không dùng với người trên và đừng trả lời như thể đang hỏi địa điểm."]},"bg-b329":{"meaning":"'Tôi (chúng tôi) đã khảo sát về [chủ đề] với đối tượng là [nhóm].' Câu mở đầu của bài thuyết trình khảo sát: hỏi ai và hỏi về điều gì.","use":"Đặt nhóm đối tượng trước 을/를 대상으로 (학생 30명을, 직장인을…), chủ đề trước 에 대해 (취미에 대해…), rồi kết thúc bằng 설문 조사를 했습니다 (thuyết trình dùng lối trang trọng -ㅂ니다). Trong văn viết cũng hay gặp 설문 조사를 실시했습니다. Nêu số người, độ tuổi (30명, 20대) để mẫu khảo sát rõ ràng.","ex":["Tôi đã khảo sát 30 bạn trong lớp về thời gian sử dụng điện thoại.","Nhóm chúng tôi đã khảo sát 50 nhân viên văn phòng ở độ tuổi 20 về thời gian sau giờ làm."],"notes":["Có patchim dùng 을 (30명을), không có patchim dùng 를 (남녀를). Dùng 대상으로, không đổi thành 대상에게; chủ đề nêu riêng bằng 에 대해."]},"bg-b330":{"meaning":"'... chiếm [số]%, nhiều nhất.' Nêu mục được trả lời nhiều nhất trong khảo sát cùng với tỷ lệ.","use":"Gắn 이/가 sau đáp án/mục, 로 sau tỷ lệ (60%로, 52.5%로), rồi nói 가장 많았습니다. Dùng thì quá khứ 많았다 vì khảo sát đã kết thúc; khi thuyết trình dùng -ㅂ니다, văn viết dùng 많았다. Biến thể: …(이)라고 대답한 사람이 40%로 가장 많았습니다; với tỷ lệ cũng có thể dùng 가장 높았습니다.","ex":["Những người trả lời 'tập thể dục' chiếm 40%, nhiều nhất.","Về nguyên nhân gây căng thẳng, việc học chiếm 52%, nhiều nhất."],"notes":["Dùng quá khứ 많았습니다 vì khảo sát đã xong. Với tỷ lệ có thể dùng 가장 높았습니다."]},"bg-b331":{"meaning":"'Tiếp theo lần lượt là A, B, C.' Sau kết quả cao nhất, liệt kê các kết quả còn lại theo thứ tự từ nhiều đến ít.","use":"Nói kết quả cao nhất trước, rồi 그 다음으로는, sau đó liệt kê các mục từ nhiều đến ít, ngăn cách bằng dấu phẩy, thêm 의 sau mục cuối và kết thúc bằng 순이었습니다 (순 = thứ tự). Dùng quá khứ 이었습니다 vì khảo sát đã xong. Muốn thêm tỷ lệ: 중식(20%), 일식(15%)의 순이었습니다. Văn viết hay dùng 이었다.","ex":["Món Hàn nhiều nhất, tiếp theo lần lượt là món Trung và món Nhật.","Tiếp theo lần lượt là xem phim, đọc sách và tập thể dục."],"notes":["Sau mục cuối cùng thêm 의, các mục cách nhau bằng dấu phẩy: 중식, 일식의 순이었습니다. Không dùng 이/가 ở đây."]},"bg-b332":{"meaning":"'Ngoài ra, cũng có ý kiến cho rằng ...' Dùng để nói thêm các ý kiến ít gặp, ý kiến khác sau kết quả chính.","use":"Mở đầu bằng 그 밖에 (ngoài ra). Phần ý kiến là câu trích dẫn + 는 bổ nghĩa cho 의견: tính từ -다는, động từ -ㄴ/는다는, danh từ -(이)라는, quá khứ -았/었다는. Sau đó là 의견도 있었습니다 (도 = cũng). Có thể thay 의견 bằng 대답 hoặc 응답; cũng có thể mở đầu bằng 기타 의견으로는 …. Khi thuyết trình dùng lối -ㅂ니다.","ex":["Ngoài ra, cũng có ý kiến cho rằng không có thời gian.","Ngoài ra, cũng có ý kiến cho rằng giá quá đắt."],"notes":["Trước 의견 phải dùng dạng -다는; động từ dùng -ㄴ/는다는: (×) 가다는 의견 → (○) 간다는 의견."]},"bg-b333":{"meaning":"'Qua những kết quả này, chúng tôi đã thấy được rằng ...' Câu kết của bài thuyết trình khảo sát, nêu kết luận rút ra từ số liệu.","use":"Mở đầu bằng 결과를 통해 (qua kết quả), tiếp theo là mệnh đề kết thúc bằng -다는 것을 (động từ -ㄴ/는다는, tính từ -다는, danh từ -(이)라는), cuối cùng là 알 수 있었습니다 (có thể biết được). 이러한 = 'những ... như thế này'. Cách nói gần nghĩa: 알게 되었습니다; khi muốn nói dè dặt dùng 것으로 보입니다; văn viết dùng 알 수 있었다.","ex":["Qua những kết quả này, chúng tôi biết được sinh viên lo lắng nhiều vì chuyện xin việc.","Qua kết quả khảo sát lần này, chúng tôi biết được sinh viên muốn nghỉ ngơi hơn là tập thể dục."],"notes":["Trước 통해 cần có trợ từ 을/를: 결과를 통해 (○) / 결과에 통해 (×). Cũng có thể dùng 통하여 với nghĩa tương tự."]},"bg-b390":{"meaning":"“Nói là X thôi chứ thật ra…”: thừa nhận tên gọi hay vẻ ngoài trước, rồi nói thực tế khác hẳn, thường tệ hơn.","use":"Đặt danh từ giữa 말이 và (이)지 (danh từ kết thúc bằng nguyên âm dùng 지: 휴가지; kết thúc bằng phụ âm dùng 이지: 여행이지), thêm dấu phẩy rồi nêu thực tế, thường kèm 사실은/실제로는. Dùng nhiều trong văn nói, thường để than phiền hoặc nói mỉa.","ex":["Nói là kỳ nghỉ, nhưng thật ra ngày nào tôi cũng chỉ làm việc.","Nói là tuần trăng mật, nhưng thật ra gần như chỉ cãi nhau.","Nói là làm thêm, nhưng việc làm thì giống hệt nhân viên chính thức."],"notes":["Vế sau phải nêu thực tế khác với tên gọi; nếu tên gọi và thực tế giống nhau thì không dùng.","Cũng hay dùng dạng 말이 좋아 N(이)지, … nghĩa là 'nói cho hay chứ thật ra chỉ là…'."]},"bg-b391":{"meaning":"“Trong tất cả…; suốt cả…; tính gộp lại”. Nhìn toàn bộ một phạm vi (nhóm người, cả chuyến đi, cả đời) rồi nêu điều nhất, điều duy nhất hoặc lần đầu tiên.","use":"Danh từ + 을/를 통틀어(서) (을 sau phụ âm, 를 sau nguyên âm); 서 có thể bỏ. Vế sau thường có 가장/제일 + tính từ, 처음이다 hoặc 한 번도 ~지 않다. Danh từ phải chỉ một phạm vi: nhiều đối tượng hoặc khoảng thời gian dài. Dùng được cả văn viết lẫn nói.","ex":["Trong cả chuyến đi này, hôm nay là ngày vui nhất.","Trong cả lớp, người nói tiếng Hàn giỏi nhất là Min-su.","Cả đời này, đây là lần đầu tôi ăn món ngon như vậy."],"notes":["Phía sau thường có 가장/제일/처음/한 번도; danh từ phải là một phạm vi (nhiều đối tượng hoặc thời gian dài), nếu chỉ một vật thì nghe không tự nhiên."]},"bg-b505":{"meaning":"“Vì; do; bởi vì” — lý do trang trọng, chủ yếu trong văn viết, dẫn đến kết luận hay quyết định.","use":"Thân từ có patchim + -으므로, thân từ kết thúc bằng nguyên âm hoặc ㄹ + -므로; quá khứ -았/었으므로; danh từ + 이므로 (학생이므로). Dùng trong báo cáo, thông báo, diễn văn, bản tin; hầu như không dùng trong hội thoại thường ngày. Vế sau thường không dùng câu mệnh lệnh hay đề nghị; trong lời nói dùng -(으)니까 hoặc -아/어서.","ex":["Vì tỷ lệ sinh thấp nên cần có đối sách.","Khu vực này đang thi công nên cấm ra vào.","Vật giá liên tục tăng nên phải cắt giảm chi phí sinh hoạt."],"notes":["Sau -(으)므로 thường không dùng câu mệnh lệnh hay đề nghị; trong hội thoại hằng ngày dùng -아/어서 hoặc -(으)니까.","-(으)ㅁ으로써 chỉ phương tiện, cách thức ('bằng cách…'), cần phân biệt với -(으)므로 chỉ lý do."]},"bg-b506":{"meaning":"“Không những… mà còn…; hơn nữa…”. Thêm một sự việc thứ hai lên trên sự việc thứ nhất, thường cùng loại (cùng tốt hoặc cùng xấu).","use":"Tính từ: -(으)ㄴ 데다가 (비싼, 좋은); động từ: -는 데다가 (오는); danh từ: 인 데다가; động từ quá khứ: -(으)ㄴ 데다가 hoặc -았/었는 데다가. Vế sau thường có -도/-까지. Hai việc phải cùng chiều. Dùng được cả nói lẫn viết; đầu câu dùng 게다가 với nghĩa tương tự.","ex":["Vật giá đã đắt, lại thêm giá nhà cũng cao.","Trời đã mưa lại còn gió nên lạnh quá.","Quán đó đã ngon lại còn rẻ nên đông khách."],"notes":["Hai vế phải cùng tốt hoặc cùng xấu mới tự nhiên; '비싼 데다가 맛있어요' nghe gượng.","Khi mở đầu câu mới dùng 게다가: 물가가 비쌉니다. 게다가 집값도 높습니다."]},"bg-b507":{"meaning":"“Làm những việc như A hoặc B; hoặc A hoặc B…”. Nêu vài ví dụ trong nhiều hành động hay lựa chọn có thể, không cố định một cái.","use":"Động từ: -ㄴ/는다든지 (늘린다든지, 먹는다든지); tính từ: -다든지; danh từ: (이)라든지; quá khứ: -았/었다든지. Thường nêu hai ví dụ rồi kết bằng 하다 (…든지 …든지 하다). Khẩu ngữ hơn -거나 và có cảm giác 'ví dụ như'. Thường theo sau là 해야 합니다 / 해 보세요 / 해요.","ex":["Cần làm những việc như tăng tiền hỗ trợ hoặc xây dựng cơ sở vật chất.","Cuối tuần tôi nghỉ ngơi bằng cách xem phim hay gặp bạn bè chẳng hạn.","Khi mệt, hãy thử ngủ một giấc hoặc đi dạo chẳng hạn."],"notes":["Danh từ dùng (이)라든지, tính từ dùng -다든지 (춥다든지 덥다든지), động từ dùng -ㄴ/는다든지.","Khẩu ngữ hơn -거나; cũng hay rút gọn thành -든지 -든지."]},"bg-b508":{"meaning":"“Trong trường hợp…; nếu lỡ như…”. Giả định một tình huống có thể xảy ra (thường là điều không mong muốn) và nói cách ứng phó hoặc hệ quả.","use":"Thân động từ/tính từ + -(으)ㄹ 경우 (-을 경우 sau phụ âm, -ㄹ 경우 sau nguyên âm); quá khứ: -았/었을 경우; danh từ: N의 경우 / N일 경우. 만약 ('lỡ như') có thể bỏ nhưng rất hay dùng; cũng có thể nói 경우에(는). Vế chính thường là -십시오, -아/어야 합니다, -ㄹ 수 있습니다. Trang trọng: quy định, hướng dẫn, cảnh báo, tin tức.","ex":["Nếu chính sách thất bại, vấn đề có thể trở nên lớn hơn.","Nếu trời mưa, sự kiện sẽ được tổ chức trong nhà.","Nếu lỡ bị lạc đường, xin hãy gọi vào số này."],"notes":["So với -(으)면, thường dùng cho tình huống ít khả năng, ngoại lệ hoặc cần phòng ngừa, ít dùng cho việc thường ngày và chắc chắn.","Sau danh từ dùng 'N의 경우' hoặc 'N일 경우': 학생의 경우, 학생일 경우."]},"bg-b574":{"meaning":"“Trong hoàn cảnh bình thường thì hầu như không xảy ra.” 웬만해서는 = trừ khi có chuyện khá nghiêm trọng; 일이 없다 = không có chuyện đó.","use":"Đầu câu đặt 웬만해서는 (rút gọn 웬만해선), sau đó V-는 일이 없다 chỉ thói quen ('hầu như không bao giờ làm') hoặc V-(으)ㄹ 일이 없다 chỉ 'sẽ không xảy ra' (đồ vật, sự việc). Trong khẩu ngữ hay quảng cáo 일이 없다 có thể rút thành 일 없다. Câu phải kết thúc bằng dạng phủ định.","ex":["Anh ấy hầu như không bao giờ nổi giận.","Chiếc điện thoại này dùng bình thường sẽ không bị hỏng.","Tôi hầu như không bao giờ đến trễ hẹn."],"notes":["Sau 웬만해서는 luôn là dạng phủ định (-는 일이 없다, -지 않다, -기 어렵다); '웬만해서는 화를 낸다' là câu sai.","웬만하면 khác nghĩa: là 'nếu có thể' (웬만하면 오늘 끝내세요)."]},"bg-b575":{"meaning":"“Vừa phải… vừa phải… nên bận rộn.” Nhiều việc cùng đổ lên người nói nên rất bận hoặc mệt.","use":"Gắn -(으)랴 vào hai (hoặc nhiều) động từ hành động: thân từ kết thúc bằng nguyên âm dùng -랴 (살림하랴), kết thúc bằng phụ âm dùng -으랴 (먹으랴). Sau đó kết bằng vị ngữ chỉ sự bận rộn hay mệt mỏi: 바쁘다, 정신이 없다, 힘들다, 여유가 없다. Chủ ngữ là người làm các việc đó; không dùng với câu mệnh lệnh hay đề nghị.","ex":["Vừa lo việc nhà vừa chăm con nên chẳng có lúc rảnh.","Dạo này vừa học vừa đi làm thêm nên rối tung cả lên.","Sáng nào cũng vừa nấu cơm vừa làm cơm hộp, bận tối mắt tối mũi."],"notes":["Phải dùng lặp lại từ hai lần trở lên, sau đó là 바쁘다, 힘들다, 정신이 없다…; không dùng với mệnh lệnh hay đề nghị."]},"bg-b576":{"meaning":"“X luôn bị xếp sau cùng.” Một việc (thường là bản thân) bị đẩy xuống hàng cuối vì có việc khác được ưu tiên.","use":"Chủ đề N은/는 + 늘/항상 + 뒷전이다. Cách nói liên quan: N을 뒷전으로 미루다 (gác X sang một bên), N이 뒷전으로 밀리다 (X bị đẩy lùi). Hay dùng khi nói về bản thân, sức khỏe, nghỉ ngơi, sở thích, với sắc thái tiếc nuối hoặc phê phán nhẹ.","ex":["Mẹ lúc nào cũng vì gia đình nên bản thân mẹ luôn bị xếp sau cùng.","Dạo này công việc quá bận nên sức khỏe lúc nào cũng bị gác lại.","Quán chúng tôi đông khách nên bữa ăn của nhân viên luôn bị xếp sau cùng."],"notes":["Dùng cho những thứ quan trọng nhưng bị bỏ bê như bản thân, sức khỏe, sở thích; mang sắc thái tiếc nuối hoặc phê phán.","Cũng hay gặp dạng N을 뒷전으로 미루다 / N이 뒷전으로 밀리다 (공부를 뒷전으로 미루고 게임만 했어요)."]},"bg-b649":{"meaning":"“Chỉ… thôi thì chưa xong; làm… chưa phải là kết thúc.” Hoàn thành một bước chưa có nghĩa là xong, vẫn còn việc phải làm.","use":"Thân động từ + -(으)면 끝이 아니다 (-으면 sau phụ âm, -면 sau nguyên âm hoặc ㄹ); quá khứ 끝이 아니었다 khi nhận ra sau đó. Thường theo sau là 끝이 아니라 + việc còn lại (…야 해요) hoặc một câu khác. Hay đi với 그냥/단순히. Thân mật: 끝이 아니야.","ex":["Chỉ vứt rác đi thôi thì chưa xong. Còn phải phân loại rồi mới vứt.","Chuyển nhà không phải cứ chuyển đồ xong là hết. Sắp xếp còn mệt hơn.","Nộp hồ sơ chưa phải là hết, còn phải phỏng vấn nữa."],"notes":["Phía trước hay có 그냥/단순히, phía sau là việc còn phải làm (-아/어야 하다).","Dạng quá khứ 끝이 아니었다 dùng khi nhận ra sự thật sau đó."]}},"zht":{"bg-b020":{"meaning":"已經夠……了，偏偏又……；本來就……，還……。前面的情況已經不好，後面又添了更糟的事。","use":"把“가뜩이나”放在前一分句句首，形容詞接 -(으)ㄴ데，動詞接 -는데；後一分句再說另一件麻煩事（常和 또、-까지、게다가 一起用）。口語和書面語都可以用，多用於抱怨或表示同情，只能用於不好的情況。","ex":["我本來就忙，又有新的工作冒出來了。","我本來就沒錢，連錢包也弄丟了。"],"notes":["前面的情況必須是不好的，不能用於好事。例如：(×) 가뜩이나 기분이 좋은데…"]},"bg-b105":{"meaning":"根據……（說）……：先說明資訊的來源（新聞、調查、專家等），再用間接引語轉述內容。","use":"在來源名詞（뉴스、조사、연구、기사、선생님 말씀等）後加 에 의하면 或 에 따르면，句尾用間接引用形式：形容詞/過去時用 -다고 하다，現在時動詞用 -ㄴ/는다고 하다，名詞用 -(이)라고 하다；口語中縮略為 -대요。兩者可以互換，語氣較正式，常見於新聞和報告。","ex":["據新聞報道，明天起會下大雨。","根據問卷調查，60%的大學生在打工。"],"notes":["後面不能接命令（-(으)세요）或建議（-(으)ㄹ까요?），只能轉述資訊。例如：(×) 뉴스에 따르면 우산을 가져가세요。"]},"bg-b106":{"meaning":"間接引語縮略後兼作連線詞。-다면서＝“聽說……（是嗎？）”，用來確認聽來的內容；-다니까＝“既然說……／我都說了……”，表示依據別人的話，或強調；-다는데＝“聽說……，（所以）……”，為後面的建議、請求等鋪墊背景。","use":"接在原形後：動詞 -ㄴ/는다-，形容詞 -다-，名詞 -(이)라-，再加 면서/니까/는데。-다면서(요)? 主要用來確認聽來的事；-다니까 表示以別人說的話為理由，或對方不相信時強調“我說了就是”；-다는데 先交代聽來的背景，後面接建議、請求或另一個陳述。多用於口語，轉述的是別人告訴你的內容，不是你自己親眼所見。","ex":["聽說這家餐廳很好吃，對吧？我也想去。","既然民秀說沒關係，那就直接吃吧。","聽說明天下雨，帶上傘吧。"],"notes":["-다면서(요)? 用來確認聽來的事；自己親眼看到的事不能用。"]},"bg-b058":{"meaning":"據某人說……／某人說……：根據某人說的話來轉述資訊。","use":"在人物名詞（친구、의사、민수 씨等）後加 말로는，句尾用縮略引用 -대요：動詞 -ㄴ/는대요，形容詞 -대요，名詞 -(이)래요，命令 -(으)래요，建議 -재요，過去 -았/었대요。多用於口語，語氣親切而禮貌；新聞、調查等書面或官方來源請用 에 따르면。","ex":["醫生說不用太擔心。","朋友說那部電影真的很好看。"],"notes":["“말로는”用於某個人說的話；新聞、問卷調查自然應該用“에 따르면”。","“말로는 ~지만”也可表示“嘴上說……（但實際並非如此）”，例如：말로는 괜찮다고 했지만 표정이 안 좋았어요（嘴上說沒關係，但臉色不好）。"]},"bg-b077":{"meaning":"反問句：“哪有……的道理？”“怎麼能……呢！”表示某種行為不合理、不可接受。","use":"動詞現在時接 -는 게，形容詞接 -(으)ㄴ 게，後面加 어디 있어요?（也可用 -니?、-습니까?）。這裡不是問地點，而是抱怨、抗議：“根本沒有這種事”。用於朋友、家人等關係較近的人；對長輩說會顯得沒禮貌。說話人通常很生氣，重音落在 게 前面的動作上。","ex":["約好了卻連個聯絡都沒有就不來，哪有這樣的？","朋友病著，你卻一個人出去玩，哪有這樣的？"],"notes":["這是語氣很強的反問句，不要對長輩使用；也不要當作詢問地點的問題來回答。"]},"bg-b329":{"meaning":"“我以……為物件，就……做了問卷調查。”這是問卷調查發表的開頭句：問了誰、問了什麼主題。","use":"在調查物件後加 을/를 대상으로（學生 30명을、직장인을……），在主題後加 에 대해（취미에 대해……），最後用 설문 조사를 했습니다 結尾（發表時用 -ㅂ니다 體）。書面語也常用“설문 조사를 실시했습니다”。帶上人數、年齡段（30명、20대），樣本會更清楚。","ex":["我以我們班30名同學為物件，就手機使用時間做了問卷調查。","我們小組以50名20多歲的上班族為物件，就下班後的時間做了問卷調查。"],"notes":["有收音用 을（30명을），沒有收音用 를（남녀를）。要說“대상으로”，不要換成“대상에게”；主題另用“에 대해”說明。"]},"bg-b330":{"meaning":"“……佔（數字）%，最多。”用來說明問卷調查中回答最多的專案及其比例。","use":"在回答/專案後加 이/가，在比例後加 로（60%로、52.5%로），再說 가장 많았습니다。因為調查已經結束，所以用過去時 많았다；發表時用 -ㅂ니다 體，書面用 많았다。變體：…(이)라고 대답한 사람이 40%로 가장 많았습니다；表示比率時也可用 가장 높았습니다。","ex":["回答“運動”的人佔40%，最多。","作為壓力的原因，學業佔52%，最多。"],"notes":["“가장 많았습니다”用過去時，因為調查已經結束。比率可以用“가장 높았습니다”。"]},"bg-b331":{"meaning":"“其次依次是A、B、C。”在說完最多的結果後，按從多到少的順序列出其餘結果。","use":"先說最多的結果，再說 그 다음으로는，然後用逗號把專案按從多到少列出，最後一個專案後加 의，以 순이었습니다 結尾（순＝順序）。因為調查已經結束，所以用過去時 이었습니다。想加比例，可寫成 중식(20%), 일식(15%)의 순이었습니다。書面語常用 이었다。","ex":["韓餐最多，其次依次是中餐、日餐。","其次依次是看電影、讀書、運動。"],"notes":["最後一個專案後面接“의”，專案之間用逗號：중식, 일식의 순이었습니다。這裡不要用 이/가。"]},"bg-b332":{"meaning":"“除此之外，也有……的意見。”在說完主要結果後，補充提到少數的、其他的意見。","use":"以 그 밖에（除此之外）開頭。意見部分是“引用句 + 는”修飾 의견：形容詞 -다는，動詞 -ㄴ/는다는，名詞 -(이)라는，過去 -았/었다는。後面接 의견도 있었습니다（도＝也）。也可以把 의견 換成 대답、응답，或用 기타 의견으로는 … 開頭。發表時用 -ㅂ니다 體。","ex":["除此之外，也有人認為沒有時間。","除此之外，也有人認為價格太貴。"],"notes":["意見前要用 -다는 的形式，動詞用 -ㄴ/는다는：(×) 가다는 의견 → (○) 간다는 의견。"]},"bg-b333":{"meaning":"“通過這些結果，我們可以知道……。”這是問卷調查發表的結尾句，說明從資料中得出的結論。","use":"先說 결과를 통해（通過結果），再接以 -다는 것을 結尾的從句（動詞 -ㄴ/는다는，形容詞 -다는，名詞 -(이)라는），最後用 알 수 있었습니다（可以得知）。이러한＝這樣的、這些。類似說法：알게 되었습니다；語氣較委婉時用 것으로 보입니다；書面語用 알 수 있었다。","ex":["通過這些結果，我們可以知道大學生因為就業問題而有很多擔憂。","通過這次問卷調查的結果，我們可以知道學生們比起運動更想要休息。"],"notes":["“통해”前要有助詞 을/를：결과를 통해（○）/ 결과에 통해（×）。意思相同的“통하여”也可以用。"]},"bg-b390":{"meaning":"“名義上叫X，實際上其實是Y。”先承認名稱或表面說法，再說明真實情況並不一樣、往往更糟。","use":"在“말이”和“(이)지”之間放名詞(母音結尾用“지”，如 휴가지；子音結尾用“이지”，如 여행이지)，加逗號，後面說明真實情況，常配合“사실은/실제로는”。多用於口語，常帶抱怨或調侃的語氣。","ex":["名義上是休假，其實每天都在工作。","說是蜜月旅行，其實幾乎都在吵架。","說是兼職，其實幹的活和正式員工一樣。"],"notes":["後半句必須說出與名稱不同的真實情況；名稱與實際一致時不能用。","也常用“말이 좋아 N(이)지, …”的形式，意思是“說得好聽，其實不過是……”。"]},"bg-b391":{"meaning":"“在……之中；縱觀整個……；把……全部算在內”。把一個範圍(群體、整段旅行、一生)整體看一遍，再指出最……的、唯一的或第一次的。","use":"名詞後接“을/를 통틀어(서)”(子音結尾用을，母音結尾用를)，“서”可省略。後面常接“가장/제일 + 形容詞”“처음이다”“한 번도 ~지 않다”。名詞必須是一個範圍：多個物件或較長的時期。書面和口語都可用。","ex":["整個旅行中，今天最開心。","全班裡韓語說得最好的人是民秀。","我這輩子第一次吃到這麼好吃的東西。"],"notes":["後面通常接“가장、제일、처음、한 번도”等詞；名詞必須是一個範圍(多個物件或長時期)，單個事物會顯得不自然。"]},"bg-b505":{"meaning":"“因為；由於”。較正式、多用於書面的理由，引出結論或決定。","use":"子音結尾的詞幹接“-으므로”，母音或ㄹ結尾的詞幹接“-므로”；過去用“-았/었으므로”；名詞用“이므로”(如 학생이므로)。多用於報告、通知、演講、新聞，日常對話中幾乎不用。後句一般不用命令句和共動句，口語用“-(으)니까”或“-아/어서”。","ex":["由於出生率低，需要採取對策。","此處正在施工，禁止出入。","物價持續上漲，所以必須減少生活開支。"],"notes":["“-(으)므로”後面一般不用命令句或共動句；日常對話用“-아/어서”“-(으)니까”。","“-(으)ㅁ으로써”表示方法、手段(通過……)，要與表示原因的“-(으)므로”區分開。"]},"bg-b506":{"meaning":"“不僅……而且……；再加上……”。在前一個情況之上再增加後一個情況，兩者通常性質相同(都是好事或都是壞事)。","use":"形容詞用“-(으)ㄴ 데다가”(비싼、좋은)，動詞用“-는 데다가”(오는)，名詞用“인 데다가”，動詞過去用“-(으)ㄴ 데다가”或“-았/었는 데다가”。後句常帶“-도/-까지”。前後兩件事方向要一致。口語書面都可用，句首用“게다가”表示同樣意思。","ex":["物價貴，再加上房價也高。","又下雨又颳風，所以特別冷。","那家餐廳不僅好吃，價格還便宜，所以客人很多。"],"notes":["前後內容應同為好事或同為壞事才自然。“비싼 데다가 맛있어요”很彆扭。","在句首用“게다가”：물가가 비쌉니다. 게다가 집값도 높습니다。"]},"bg-b507":{"meaning":"“做……或……之類的”。從多種可能的行動或選擇中舉出幾個例子，並不限定其一。","use":"動詞：-ㄴ/는다든지(늘린다든지、먹는다든지)；形容詞：-다든지；名詞：(이)라든지；過去：-았/었다든지。通常舉兩項，最後用“하다”收尾(…든지 …든지 하다)。比“-거나”口語化，更有“比如”的感覺。後面常接“해야 합니다/해 보세요/해요”。","ex":["必須採取增加補助金或建設設施之類的措施。","週末我會看看電影、見見朋友之類的來休息。","累的時候，可以睡一覺或散散步之類的。"],"notes":["名詞用“(이)라든지”，形容詞用“-다든지”(춥다든지 덥다든지)，動詞用“-ㄴ/는다든지”。","比“-거나”更口語化，也常簡化為“-든지 -든지”。"]},"bg-b508":{"meaning":"“萬一……的情況下；如果發生……”。設想一種可能出現(多為不希望出現)的情況，並說明應對方法或後果。","use":"動詞/形容詞詞幹 + -(으)ㄹ 경우(子音結尾用-을 경우，母音結尾用-ㄹ 경우)；過去：-았/었을 경우；名詞：N의 경우、N일 경우。“만약”(萬一)可省略但很常用，也可說“경우에(는)”。後句常用-십시오、-아/어야 합니다、-ㄹ 수 있습니다。多用於規定、說明書、警告、新聞等正式場合。","ex":["萬一政策失敗，問題可能會擴大。","萬一下雨，活動改在室內舉行。","萬一迷路，請撥打這個號碼。"],"notes":["與“-(으)면”相比，多用於可能性較低、例外或需要預防的情況，不用於日常、確定的事。","名詞後用“N의 경우”或“N일 경우”：학생의 경우、학생일 경우。"]},"bg-b574":{"meaning":"“一般情況下幾乎不會發生。”웬만해서는 = 除非很特殊；일이 없다 = 沒有這種事。","use":"句首用“웬만해서는”(縮略“웬만해선”)，然後用“V-는 일이 없다”表示習慣(基本不會做某事)，用“V-(으)ㄹ 일이 없다”表示不會發生(多用於物品、事態)。口語或廣告中“일이 없다”可略作“일 없다”。句子必須以否定結尾。","ex":["他一般不會發火。","這部手機正常情況下不會出故障。","我一般不會遲到。"],"notes":["“웬만해서는”後面總是接否定表達(-는 일이 없다、-지 않다、-기 어렵다)。“웬만해서는 화를 낸다”是錯句。","“웬만하면”意思不同，是“可能的話”(웬만하면 오늘 끝내세요)。"]},"bg-b575":{"meaning":"“又要……又要……，忙得不可開交。”幾件事同時壓在身上，所以很忙很累。","use":"接在兩個(或更多)動作動詞後：母音詞幹接“-랴”(살림하랴)，子音詞幹接“-으랴”(먹으랴)。後面以表示忙碌或疲憊的謂語結尾：바쁘다、정신이 없다、힘들다、여유가 없다。主語是做這些事的人，不能與命令句、共動句連用。","ex":["又要操持家務又要帶孩子，一點空閒都沒有。","最近又要學習又要打工，忙得暈頭轉向。","每天早上又要做飯又要裝便當，忙得不可開交。"],"notes":["必須重複使用兩次以上，後面接“바쁘다、힘들다、정신이 없다”等；不能用於命令句和共動句。"]},"bg-b576":{"meaning":"“……總是被放在最後。”因為別的事優先，某事(常常是自己)總被擱在一邊、排在最後。","use":"主題 N은/는 + 늘/항상 + 뒷전이다。相關表達：N을 뒷전으로 미루다(把……擱置一邊)、N이 뒷전으로 밀리다(……被擠到後面)。常用於說自己、健康、休息、愛好，帶有些許遺憾或批評的語氣。","ex":["媽媽總是為了家人，把自己放在最後。","最近工作太忙，健康總是被放在一邊。","我們店客人多，員工的飯總是排在最後。"],"notes":["用於自己、健康、愛好等本來重要卻被忽視的事物，帶有後悔或批評的意味。","也常說“N을 뒷전으로 미루다 / N이 뒷전으로 밀리다”(공부를 뒷전으로 미루고 게임만 했어요)。"]},"bg-b649":{"meaning":"“光……還沒完；做完……並不算結束。”完成了某一步並不等於事情結束，後面還有事要做。","use":"動詞詞幹 + -(으)면 끝이 아니다(子音結尾用-으면，母音或ㄹ結尾用-면)；事後才發現的事用過去式“끝이 아니었다”。常接“끝이 아니라 + 還剩下的事”(……야 해요)，或另起一句說明。常與“그냥/단순히”連用。口語：끝이 아니야。","ex":["垃圾隨手一扔可不算完事，還得按種類分類再扔。","搬家不是把行李搬完就結束了，整理更累。","交了申請書還不算完，還得參加面試。"],"notes":["前面常有“그냥、단순히”，後面接還剩下要做的事(-아/어야 하다)。","過去式“끝이 아니었다”用於事後才發現的事實。"]}}};           // {lang: {id: {meaning,use,ex[],notes[]}}}  (en comes from DATA)

I18N.zht = {meaning:"意思",use:"用法",examples:"例句",notes:"注意 / 小貼士",table:"變化形式",practice:"練習（練習冊）",
      show:"看答案",hide:"隱藏",quiz:"小測驗",quizT:"空格里應該用哪個語法？",next:"下一題",again:"再來",close:"關閉",
      right:"答對了！",wrong:"不對，答案是",score:"得分",trOn:"翻譯：顯示",trOff:"翻譯：點選看",
      cover:"遮住",uncover:"全部顯示",coverTip:"遮住表格，點格子自測。",tapEx:"點句子看翻譯。",
      model:"參考答案僅供參考，其他說法也可能正確。",all:"全部",done:"完成！得分"};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){try{return localStorage.getItem(k);}catch(e){return null;}}, set(k,v){try{localStorage.setItem(k,v);}catch(e){}} };

let lang = LANGS.some(l => l.code === store.get("k5b_lang")) ? store.get("k5b_lang") : "en";
let showTr = store.get("k5b_gr_tr") !== "0";
let chapter = +(store.get("k5b_gr_ch") || 1);
if (!DATA.chapters.some(c => c.n === chapter)) chapter = DATA.chapters[0].n;   // not every 5B chapter has grammar
const openSet = new Set();
let quiz = null;
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k];

function tr(p, field, i){
  if (lang === "en") return field === "ex" ? p.examples[i].en : field === "notes" ? p.notes[i].en : p[field];
  const x = (TR[lang] || {})[p.id];
  const v = x && (field === "ex" || field === "notes" ? x[field][i] : x[field]);
  return v || (field === "ex" ? p.examples[i].en : field === "notes" ? p.notes[i].en : p[field]);
}
// highlight the grammar in a Korean sentence (regex list per point, built in build_grammar.js)
function hl(p, ko){
  const re = p.hlShow ? new RegExp(p.hlShow, "g") : null;
  if (!re) return esc(ko);
  let out = "", last = 0, m;
  while ((m = re.exec(ko))) { if (!m[0]) { re.lastIndex++; continue; } out += esc(ko.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>"; last = m.index + m[0].length; }
  return out + esc(ko.slice(last));
}
const L = () => ` lang="${lang}"`;

function renderTabs(){
  $("#tabs").innerHTML = DATA.chapters.map(c =>
    `<button class="tab${c.n === chapter ? " on" : ""}" data-ch="${c.n}">${c.n}과<small>${esc(c.title)}</small></button>`).join("");
}
function renderPoint(p, idx){
  const open = openSet.has(p.id);
  let h = `<div class="gp${open ? " open" : ""}" data-id="${p.id}">
    <div class="gphead"><span class="num">${idx + 1}</span>
      <div class="ttl"><b>${esc(p.title)}</b><span class="mean"${L()}>${esc(tr(p, "meaning"))}</span></div>
      <span class="part">${esc(p.part)}</span><span class="chev">▼</span></div>
    <div class="gpbody">
      <div class="formula"><div class="form">${esc(p.form)}</div><div class="pat">${esc(p.pattern)}</div></div>
      <p class="rule">${esc(p.rule)}</p>
      <div class="sec"><h4${L()}>${t("use")}</h4><div class="tr"${L()}>${esc(tr(p, "use"))}</div></div>`;
  if (p.table) {
    h += `<div class="sec"><h4${L()}>${t("table")}</h4>
      <div class="tbar"><span class="tr"${L()}>${t("coverTip")}</span><button class="pill small" data-cover>${t("cover")}</button></div>
      <div class="tbl"><table><tr>${p.table.head.map(x => `<th>${esc(x)}</th>`).join("")}</tr>
      ${p.table.rows.map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div></div>`;
  }
  if (p.examples.length) {
    h += `<div class="sec"><h4${L()}>${t("examples")}</h4>` + p.examples.map((e, i) =>
      `<div class="ex"><div class="ko">${hl(p, e.ko)}</div><div class="tr"${L()}>${esc(tr(p, "ex", i))}</div></div>`).join("") + `</div>`;
  }
  if (p.notes.length) {
    h += `<div class="sec"><h4${L()}>${t("notes")}</h4>` + p.notes.map((n, i) =>
      `<div class="note ${n.kind === "주의" ? "warn" : "tip"}"><span class="k">${n.kind === "주의" ? "⚠ 주의" : "💡 tip"}</span>${esc(n.ko)}
        <div class="tr"${L()}>${esc(tr(p, "notes", i))}</div></div>`).join("") + `</div>`;
  }
  if (p.practice.length) {
    h += `<div class="sec"><h4${L()}>${t("practice")}</h4>` + p.practice.map(x =>
      `<div class="pr"><div class="q">${esc(x.q)}</div><div class="a" hidden>→ ${hl(p, x.a)}</div>
        <button class="pill small" data-ans>${t("show")}</button></div>`).join("") +
      `<div class="aihint"${L()}>${t("model")}</div></div>`;
  }
  return h + `</div></div>`;
}
function render(){
  document.documentElement.lang = "ko";
  document.body.classList.toggle("hidetr", !showTr);
  $("#trBtn").textContent = showTr ? "번역 ✓" : "번역 👁";
  $("#trBtn").title = showTr ? t("trOn") : t("trOff");
  $("#trBtn").classList.toggle("on", showTr);
  renderTabs();
  const ch = DATA.chapters.find(c => c.n === chapter);
  const pts = DATA.points.filter(p => p.ch === chapter);
  let h = `<div class="chhead"><h2>${chapter}과</h2><span class="sub">${esc(ch.title)} · ${pts.length}</span><span class="grow"></span>
    <button class="pill" id="quizBtn">🎯 ${t("quiz")}</button></div>`;
  if (quiz) h += renderQuiz();
  h += pts.map(renderPoint).join("");
  $("#main").innerHTML = h;
  $("#foot").innerHTML = `서강 5B 문법·표현 · ${esc(showTr ? "" : t("tapEx"))}`;
}

// ---- quiz: blank the grammar out of the chapter's example sentences, model answers and drill sentences ----
// Rounds of ROUND questions dealt from a per-chapter deck: "again" continues with sentences you have not had
// yet, and the deck is only reshuffled once the whole chapter has been gone through.
const ROUND = 15;
const decks = {};
function chapterItems(chN){
  const items = [];
  for (const p of DATA.points.filter(p => p.ch === chN && p.hl)) {
    // Korean sentence -> its English (shown after answering); the first source to give one wins
    const sents = new Map();
    for (const [ko, en] of [...p.examples.map(e => [e.ko, e.en]), ...p.practice.map(x => [x.a, x.en]), ...(p.drill || []).map(d => [d.ko, d.en])])
      if (!sents.has(ko) || (!sents.get(ko) && en)) sents.set(ko, en || "");
    for (const [s, en] of sents) {
      const m = new RegExp(p.hl).exec(s);
      if (!m || m[0].length < 1 || s.length < 8) continue;
      items.push({ id: p.id, before: s.slice(0, m.index), gap: m[0], after: s.slice(m.index + m[0].length), en });
    }
  }
  for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
  return items;
}
function quizItems(chN){
  let d = decks[chN];
  if (!d || d.pos >= d.items.length) d = decks[chN] = { items: chapterItems(chN), pos: 0 };
  const items = d.items.slice(d.pos, d.pos + ROUND);
  d.pos += items.length;
  return { pts: DATA.points.filter(p => p.ch === chN), items, i: 0, score: 0, picked: null, seen: d.pos, total: d.items.length };
}
function renderQuiz(){
  const q = quiz;
  if (q.i >= q.items.length) {
    // how far through this chapter's sentences you are; "again" deals the next unseen ones
    return `<div class="quiz"><div class="qs">🎉 ${t("done")}: ${q.score} / ${q.items.length}</div>
      <div class="qtop"><span>📚 ${q.seen} / ${q.total}</span></div>
      <div class="row"><button class="pill" data-q="close">${t("close")}</button><button class="pill on" data-q="again">${t("again")}</button></div></div>`;
  }
  const it = q.items[q.i];
  const done = q.picked !== null;
  const right = DATA.points.find(p => p.id === it.id);
  return `<div class="quiz"><div class="qtop"><span${L()}>${t("quizT")}</span><span>${q.i + 1} / ${q.items.length} · ${t("score")} ${q.score}</span></div>
    <div class="qs">${esc(it.before)}<span class="blank">${done ? esc(it.gap) : "?"}</span>${esc(it.after)}</div>
    ${done && it.en ? `<div class="qen">${esc(it.en)}</div>` : ""}
    <div class="opts">${q.pts.map(p => {
      const cls = done ? (p.id === it.id ? " right" : p.id === q.picked ? " wrong" : "") : "";
      return `<button class="opt${cls}" data-pick="${p.id}"${done ? " disabled" : ""}>${esc(p.title)}<small${L()}>${esc(tr(p, "meaning"))}</small></button>`;
    }).join("")}</div>
    <div class="fb"${L()}>${done ? (q.picked === it.id ? "✅ " + t("right") : "❌ " + t("wrong") + " " + esc(right.title)) : ""}</div>
    ${done && right.why ? (() => {
      // why the right one fits, and when you missed, what the one you picked actually means
      const mine = q.picked !== it.id ? DATA.points.find(p => p.id === q.picked) : null;
      return `<div class="qwhy">💡 <b>${esc(right.title)}</b>: ${esc(right.why)}` +
        (mine ? `<div class="qmine">You chose <b>${esc(mine.title)}</b>: ${esc(mine.meaning)}</div>` : "") + `</div>`;
    })() : ""}
    <div class="row"><button class="pill" data-q="close">${t("close")}</button>${done ? `<button class="pill on" data-q="next">${t("next")} ›</button>` : ""}</div></div>`;
}

// ---- events ----
$("#tabs").onclick = e => {
  const b = e.target.closest("[data-ch]"); if (!b) return;
  chapter = +b.dataset.ch; store.set("k5b_gr_ch", chapter); quiz = null; render(); window.scrollTo(0, 0);
};
$("#main").onclick = e => {
  const el = e.target;
  if (el.closest("#quizBtn")) { quiz = quizItems(chapter); render(); window.scrollTo(0, 0); return; }
  const pick = el.closest("[data-pick]");
  if (pick && quiz && quiz.picked === null) { quiz.picked = pick.dataset.pick; if (quiz.picked === quiz.items[quiz.i].id) quiz.score++; render(); return; }
  const qa = el.closest("[data-q]");
  if (qa) { const a = qa.dataset.q; if (a === "close") quiz = null; else if (a === "again") quiz = quizItems(chapter); else { quiz.i++; quiz.picked = null; } render(); return; }
  const ans = el.closest("[data-ans]");
  if (ans) { const pr = ans.closest(".pr"), a = pr.querySelector(".a"); a.hidden = !a.hidden; pr.classList.toggle("done", !a.hidden); ans.textContent = a.hidden ? t("show") : t("hide"); return; }
  const cov = el.closest("[data-cover]");
  if (cov) { const tb = cov.closest(".sec").querySelector(".tbl"); const on = !tb.classList.contains("cover");
    tb.classList.toggle("cover", on); tb.querySelectorAll("td.shown").forEach(td => td.classList.remove("shown")); cov.textContent = on ? t("uncover") : t("cover"); return; }
  const td = el.closest(".tbl.cover td"); if (td) { td.classList.add("shown"); return; }
  const ex = el.closest(".ex"); if (ex) { ex.classList.toggle("shown"); return; }
  const head = el.closest(".gphead");
  if (head) { const gp = head.parentElement, id = gp.dataset.id; gp.classList.toggle("open"); gp.classList.contains("open") ? openSet.add(id) : openSet.delete(id); }
};
$("#trBtn").onclick = () => { showTr = !showTr; store.set("k5b_gr_tr", showTr ? "1" : "0"); render(); };
$("#lang").innerHTML = LANGS.map(l => `<option value="${l.code}">${esc(l.native)}</option>`).join("");
$("#lang").value = lang;
$("#lang").onchange = e => { lang = e.target.value; store.set("k5b_lang", lang); render(); };

// first visit: open the first point so the page doesn't look like a bare list
if (!store.get("k5b_gr_seen")) { const f = DATA.points.find(p => p.ch === chapter); if (f) openSet.add(f.id); store.set("k5b_gr_seen", "1"); }
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
