ời nói không hoàn toàn tin vào tiền đề, đó là điểm khác với điều kiện thường -(ㄴ/는)다면. Dùng khi thảo luận, tranh luận và phàn nàn.","ex":["Cứ cho là du học sớm giúp ích cho ngoại ngữ. Dù vậy, để đứa trẻ nhỏ sống xa gia đình có ổn không?","Dù cho lương cao, nếu công việc quá vất vả thì cũng không làm lâu được.","Cứ cho là cậu nói đúng thì cũng phải xin lỗi trước chứ."],"notes":["Cách dùng rất phổ biến là kết thúc một câu bằng -다고 치자 rồi phản bác ở câu sau bằng 그래도 hoặc 하지만.","-(ㄴ/는)다면 giả định một điều kiện có thể xảy ra thật, còn -다고 치다 chỉ tạm thừa nhận chứ không hoàn toàn tin."]},"g6-2":{"meaning":"Nếu là ... thì có lẽ được (tôi có thể hiểu), nhưng nếu không thì không. Thừa nhận một điều kiện đặc biệt ít khả năng xảy ra, rồi kết luận thật là phủ định hoặc nghi ngờ: 'trừ khi ..., còn không thì không thể'.","use":"Gắn -(ㄴ/는)다면 hoặc dạng rút gọn -(으)면 + 몰라도: 어린아이라면 몰라도 (trẻ con thì còn được), 눈이 많이 온다면 몰라도 (trừ khi tuyết rơi dày), 특별한 이유가 있다면 몰라도. Quá khứ là -았/었다면 몰라도, danh từ là N(이)라면 몰라도. Vế sau mang ý phủ định hoặc nghi ngờ: -(으)ㄹ 수 없다, -기 어렵다, 안 되다, -지 않다. Vế trước là ngoại lệ mà người nói cho là khó xảy ra, ý nghĩa là 'chỉ trường hợp đó thôi, còn bình thường thì không'. Đừng nhầm với -(으)ㄴ/는지 몰라도 ('không biết có ... hay không').","ex":["Trẻ con thì còn được, chứ người lớn mà nói vậy thì khó xử.","Trừ khi trúng xổ số, chứ chỉ bằng lương thì khó mua được nhà.","Người mới gặp thì còn được, chứ với bạn cũ thì đâu cần nói như vậy."],"notes":["Vế sau phải mang nội dung phủ định hoặc nghi ngờ. Đặt kết quả tốt sau -다면 몰라도 nghe không tự nhiên.","Có thể rút gọn thành -(으)면 몰라도: '한두 번이면 몰라도 매번 이러면 곤란해요' (một hai lần thì được, nhưng lần nào cũng thế thì phiền)."]},"g6-3":{"meaning":"Trong lúc ...; giữa lúc ...; trong bối cảnh .... Dựng lên một bối cảnh (văn phong tin tức), sự kiện chính xảy ra trong đó.","use":"Tính từ gắn -(으)ㄴ, động từ hiện tại gắn -는, động từ quá khứ hay đã hoàn thành gắn -(으)ㄴ / -던, danh từ gắn 인, rồi thêm 가운데: 어려운 가운데, 지켜보는 가운데, 마친 가운데, 학생인 가운데. Vế trước là tình huống hay bầu không khí đang tiếp diễn (관심이 쏠리는, 비가 오는, 어려운), vế sau là sự kiện chính (열렸다, 발표했다). Điển hình trong tin tức, báo cáo và bài phát biểu. Không dùng cho hai hành động đồng thời của cùng một người (dùng -(으)면서). 가운데에도 nghĩa là 'ngay cả giữa lúc ...'. N 가운데 ('trong số N / ở giữa') là cách dùng khác.","ex":["Chính sách mới được công bố dưới sự theo dõi của đông đảo người dân.","Ngay cả trong lúc kinh tế khó khăn, họ vẫn quyết định tăng trợ cấp sinh con.","Cuộc thi marathon diễn ra trong lúc trời mưa."],"notes":["Không dùng cho hai hành động cùng lúc của một người; khi đó dùng -(으)면서: '음악을 들으면서 걸어요'.","'N 가운데' còn có nghĩa 'trong số N' hoặc 'chính giữa'; '그런 가운데' nghĩa là 'trong hoàn cảnh đó'."]},"g6-4":{"meaning":"Coi như là ...; xem như ...; thực chất là .... Người nói nhìn vào các sự thật rồi kết luận kết quả về cơ bản giống với một điều khác.","use":"Động từ hiện tại gắn -는, động từ đã hoàn thành hoặc tính từ gắn -(으)ㄴ, danh từ gắn 인, rồi thêm 셈이다: 받는 셈이다, 끝낸 셈이다, 싼 셈이다, 가족인 셈이다. Thường đứng sau 사실상, 결국, 거의 hoặc con số, sự so sánh (십 년을 살았으니 ...). 셈 nghĩa là 'phép tính', nên câu này cộng các sự thật lại rồi nêu tổng. Cẩn thận với -(으)ㄹ 셈이다 nghĩa là 'định ...' (갈 셈이다 = định đi), là ngữ pháp khác.","ex":["Cái túi này tôi mua lúc giảm giá nên coi như mua nửa giá.","Tôi sống ở Hàn Quốc mười năm rồi, coi như là người Hàn Quốc.","Báo cáo viết gần xong rồi, coi như công việc đã xong."],"notes":["-(으)ㄹ 셈이다 nghĩa là 'định ...' và là ngữ pháp hoàn toàn khác: '내일은 일찍 일어날 셈이에요' (ngày mai tôi định dậy sớm).","'-(으)ㄴ 셈 치고' nghĩa là 'coi như là ...': '속은 셈 치고 한번 해 보세요' (cứ coi như bị lừa, thử một lần xem)."]},"g7-1":{"meaning":"Người nói nhớ lại điều mình đã tận mắt thấy trước đó (thường là hành động hay trạng thái của người khác) rồi nối với hành động tiếp theo, sự thay đổi hoặc kết quả: “... rồi thì ...”.","use":"Gắn vào gốc động từ/tính từ (quá khứ: -았/었더니; danh từ: N(이)더니). Vế trước là điều người nói đã quan sát, chủ ngữ thường là ngôi thứ ba (hoặc thời tiết); vế sau là điều xảy ra tiếp theo: hành động, thay đổi hoặc kết quả. Chủ ngữ hai vế thường giống nhau. Khi hành động của chính mình dẫn tới một kết quả mà mình phát hiện, dùng -았/었더니. Hay gặp: 그러더니 (rồi thì). Lỗi thường gặp: dùng -더니 khi chủ ngữ vế đầu là “tôi”.","ex":["Min-su đưa quà cho thầy bằng hai tay rồi cúi đầu chào.","Đến hôm qua còn nóng, vậy mà hôm nay đột nhiên se lạnh.","Tôi dùng cử chỉ để nói chuyện ở một nước xa lạ thì mọi người hiểu ngay."],"notes":["-더니 dùng cho điều bạn tận mắt thấy người khác làm. Với hành động của chính mình dẫn tới kết quả, dùng -았/었더니: 약을 먹었더니 열이 내렸어요 (tôi uống thuốc thì hết sốt). Không nói “tôi” + 약을 먹더니.","Cũng dùng khi hai vế cùng chủ ngữ và đối lập nhau (hôm qua mưa, hôm nay trời quang). 그러더니 = “rồi thì”."]},"g7-2":{"meaning":"“Như bạn thấy / biết / đã nghe...”. Nêu điều mà người nghe cũng đã thấy, đã biết hoặc đã nghe, rồi nói tiếp ý chính.","use":"Gắn vào gốc động từ nhìn, biết, nghe như 보다, 알다, 듣다, 느끼다, 말하다, 예상하다: 보시다시피, 아시다시피, 들으셨다시피. Điều đã nói trước đó dùng quá khứ -았/었다시피 (말씀드렸다시피). Thường đứng đầu câu và khá trang trọng nên hay gặp trong phát biểu, thuyết trình, thông báo. Lỗi thường gặp: dùng cho thông tin mới mà người nghe chưa biết, hoặc gắn vào động từ không liên quan đến nhận thức.","ex":["Như bạn thấy, ở Hàn Quốc khi đưa đồ cho người lớn tuổi thì dùng hai tay.","Như bạn biết, cách chào hỏi ở mỗi nước khác nhau.","Như tôi đã nói ở buổi trước, ngày mai có bài thuyết trình về ngôn ngữ cơ thể."],"notes":["-다시피 gắn vào động từ nhìn/biết/nghe và nói về điều người nghe đã biết; không dùng để đưa thông tin mới.","Đừng nhầm với -다시피 하다 “gần như...”: 밤을 새우다시피 했어요 (gần như thức trắng đêm) là một ngữ pháp khác."]},"g7-3":{"meaning":"-아/어야지 = “phải ~ chứ / nên ~ chứ” (nhắc nhở, tự quyết tâm hoặc trách nhẹ); -아/어서는 안 된다 = “không được ~ / không nên ~”.","use":"-아/어야지(요) gắn vào gốc động từ/tính từ, nói rằng việc đó đương nhiên phải làm. Nói với người khác là nhắc nhở hoặc trách nhẹ, nói với chính mình là quyết tâm (내일부터 운동해야지). -아/어서는 안 된다 là lời cấm mạnh và trang trọng hơn -(으)면 안 되다, hay dùng với quy tắc, phép lịch sự, đạo đức. Hai dạng thường đi cặp: “nên làm A, không được làm B”. Dạng lịch sự viết là 안 돼요 (không phải 안 되요).","ex":["Khi chào người lớn tuổi thì đương nhiên phải cúi đầu chứ.","Không được ngồi vắt chân trước mặt người lớn tuổi.","Phải tôn trọng văn hóa nước khác, không được coi thường."],"notes":["-아/어서는 안 된다 mạnh và trang trọng hơn -(으)면 안 되다, hay dùng cho phép lịch sự, quy tắc, đạo đức. Dạng lịch sự là 안 돼요, không phải 안 되요.","Khi câu chỉ kết thúc bằng -아/어야지, nói với người khác là “đương nhiên phải ~ chứ”, nói với mình là quyết tâm “mình phải ~”."]},"g7-4":{"meaning":"Gọi tên và trích dẫn: gọi ai/cái gì là N (N(이)라고 부르다/하다/말하다); N 하고 trích dẫn trực tiếp một từ hoặc âm thanh.","use":"Danh từ có patchim dùng N이라고, không có patchim dùng N라고, thường đi với 부르다, 하다, 말하다 để nói ai/cái gì “được gọi là gì”: tên, cách xưng hô, thuật ngữ. N 하고 là trích dẫn trực tiếp, đặt sau từ hoặc âm thanh trong dấu ngoặc và viết cách ra: '엄마!' 하고 소리치다. Lưu ý: 하고 này không phải 하고 nghĩa “và / với”.","ex":["Ở Hàn Quốc, người ta gọi đàn anh/đàn chị là '선배님'.","Bạn bè gọi tôi là '대니'.","Đứa bé vừa hét “Mẹ ơi!” vừa chạy tới."],"notes":["Có patchim thì dùng 이라고, không có thì dùng 라고. 하고 ở đây không phải 하고 “và / với”: nó đứng sau từ hoặc âm thanh được trích và viết cách ra.","Khi nói về tên hay thuật ngữ thường đi với 하다/부르다: 이것을 한국어로 '손짓'이라고 해요 (cái này trong tiếng Hàn gọi là '손짓')."]},"g7-5":{"meaning":"“N là ... / cái gọi là N là ...”. Lấy N làm chủ đề để định nghĩa hoặc nêu nhận xét chung về nó.","use":"Danh từ có patchim dùng N이란, không có patchim dùng N란; đây là dạng rút gọn của N(이)라는 것은 và theo sau là phần giải thích về N. Câu thường kết thúc bằng ~(이)다, ~는 것이다 hoặc ~(이)라고 할 수 있다. Thường gặp trong bài viết, thuyết trình, giờ học. Không dùng cho một người hay một sự việc cụ thể.","ex":["Ngôn ngữ cơ thể là cách truyền đạt tình cảm bằng cơ thể thay cho lời nói.","Cách xưng hô (호칭) là từ dùng khi gọi một người.","Phép lịch sự xuất phát từ tấm lòng tôn trọng đối phương."],"notes":["N(이)란 dùng để định nghĩa hoặc nêu nhận xét chung, không dùng cho một người hay sự việc cụ thể (민수 씨란 학생이에요 là sai, phải nói 민수 씨는 학생이에요).","Hay gặp trong văn viết, thuyết trình, giờ học. Cuối câu thường là ~(이)다, ~는 것이다, ~(이)라고 할 수 있다; cũng có thể mở đầu câu hỏi: 사랑이란? (“Tình yêu là gì?”)."]},"g8-1":{"meaning":"Thể hiện sự ngạc nhiên, cảm thán hoặc điều vừa mới nhận ra ngay lúc đó (ở đây là điều nhận thấy trong bức tranh).","use":"Gắn vào gốc động từ/tính từ (quá khứ -았/었네요, suy đoán -겠네요, danh từ N(이)네요). Chỉ dùng cho điều vừa mới thấy, mới nghe hoặc mới biết; cảm giác “bây giờ mới nhận ra” là điểm chính. Là cách nói nhẹ nhàng, mang tính hội thoại để bình luận cảnh tượng hay phản ứng với người đối diện. Lỗi thường gặp: dùng cho điều đã biết từ lâu hoặc kế hoạch của chính mình.","ex":["Bức tranh này màu sắc thật rực rỡ nhỉ!","Nhìn kìa, bọn trẻ trong tranh đều đang cười.","Ồ, bức tranh này được vẽ từ bốn trăm năm trước đấy!"],"notes":["-네요 dùng cho điều vừa mới nhận ra. Không dùng cho điều đã biết từ trước hay kế hoạch của mình: 내일 가네요 không có nghĩa là “mai tôi sẽ đi”.","Là cách nhẹ nhàng thể hiện sự ngạc nhiên hay khen ngợi; khi miêu tả tranh, dùng để nói điều đập vào mắt: 강아지가 있네요 (có một chú chó con kìa). Mang tính hội thoại hơn -군요."]},"g8-2":{"meaning":"N치고 + phủ định: “không có N nào mà không ~” (không ngoại lệ); N치고는: “xét là N thì ~” (khác với dự đoán).","use":"Gắn 치고 / 치고는 trực tiếp sau danh từ, không phân biệt patchim. N치고 nghĩa là “trong nhóm này hầu như ai cũng vậy”, thường theo sau là phủ định (없다, -지 않다, 못하다) nhưng tổng thể là khẳng định mạnh. N치고는 lấy N làm chuẩn rồi nêu kết quả khác với điều người ta mong đợi ở nhóm đó, ví dụ “xét là người mới thì vẽ rất giỏi”.","ex":["Nghệ sĩ nào cũng có tâm hồn nhạy cảm phong phú (không có nghệ sĩ nào là không).","Xét là người mới đến Hàn Quốc ba tháng thì nói tiếng Hàn rất giỏi.","Người Hàn Quốc hầu như không ai là không ăn kim chi."],"notes":["Phần sau N치고는 khác với kỳ vọng về N (người mới mà vẽ giỏi; mùa đông mà trời ấm). Sau N치고 thường là phủ định như 없다, mang nghĩa “không ngoại lệ”.","Trong khẩu ngữ, 치고는 hay rút thành 치곤: 겨울치곤 따뜻해요 (xét là mùa đông thì khá ấm)."]},"g8-3":{"meaning":"Phủ định kép: dùng hai lần phủ định để tạo nghĩa khẳng định mạnh hơn. “Chỉ có thể là N / không thể không ~ / không ~ thì không được (= phải ~) / không có gì là không thể ~”.","use":"Bốn mẫu thường gặp: N이/가 아닐 수 없다 (chỉ có thể là N); V-지 않을 수(가) 없다 (không thể không ~, không kìm được ~); V-지 않으면 안 되다 (phải ~); V-(으)ㄹ 수 없는 것이 없다 (không có gì là không thể ~, cái gì cũng làm được). Giọng điệu mạnh và trang trọng, hay gặp trong văn viết, bình luận, thuyết trình; trong hội thoại hằng ngày 꼭 ~아/어야 해요 tự nhiên hơn. Hai phủ định cộng lại thành khẳng định, đừng hiểu theo nghĩa đen là “không thể”.","ex":["Bức tranh này chắc chắn là kiệt tác của tranh phong tục Hàn Quốc.","Thấy bức tranh đẹp thế này thì không thể không xúc động.","Trong thời gian trị liệu bằng nghệ thuật thì phải vẽ tranh mỗi ngày."],"notes":["Phủ định kép hay dùng trong văn trang trọng như bài viết, bình luận, thuyết trình. Trong hội thoại hằng ngày 꼭 ~아/어야 해요 tự nhiên hơn. Hai phủ định cộng lại mang nghĩa khẳng định.","-지 않을 수 없다 ≈ “không thể không ~, đành phải ~”; -지 않으면 안 되다 ≈ “nhất định phải ~”. Dạng lịch sự viết là 안 돼요."]},"g8-4":{"meaning":"“Trong việc ~ / để ~”. -는 데 biến động từ thành cụm danh từ (việc/tình huống làm ~), theo sau là 도움이 되다, 필요하다, 시간이 걸리다, 자신이 있다...","use":"Gắn vào gốc động từ (động từ đuôi ㄹ bỏ ㄹ: 만들다 → 만드는 데). 데 ở đây là danh từ phụ thuộc (“việc, trường hợp”) nên viết cách ra và có thể thêm trợ từ 에: 하는 데(에). Hay đi với: 도움이 되다/주다, 필요하다, 시간이 걸리다, 돈이 들다, 좋다, 효과가 있다, 자신이 있다, 익숙하다, 서투르다. Đừng nhầm với vĩ tố nối -는데 (viết liền, nghĩa “nhưng / và”).","ex":["Trị liệu bằng nghệ thuật giúp tâm trạng dễ chịu hơn.","Nghe nói để hoàn thành bức tranh lớn này mất bốn năm.","Tôi tự tin khi giải thích tranh."],"notes":["Trong -는 데, 데 viết cách ra. -는데 viết liền là vĩ tố nối câu (“..., nhưng / và ...”), là ngữ pháp khác.","Sau -는 데 thường là các cụm cố định: 도움이 되다, 필요하다, 시간이 걸리다, 돈이 들다, 자신이 있다, 효과가 있다. Nên học theo cụm."]}},"zht":{"g1-1":{"meaning":"某件事差一點就發生了，但最終沒有發生。多用於險些發生的、通常是不好的事情。","use":"詞幹以母音結尾加 -ㄹ，以子音結尾加 -을（넘어지다→넘어질，먹다→먹을；ㄹ詞幹保留ㄹ：울다→울），再接 뻔했다。因為事情並沒有真的發生，幾乎總是用過去時（뻔했어요/뻔했다）。多搭配意外或尷尬的動詞（넘어지다、늦다、울다、놓치다）。句首加 하마터면（差點兒）語氣更強。常見錯誤：用於真的發生了的事，或用現在時（넘어질 뻔해요）。","ex":["下雨天我在樓梯上滑了一下，差點摔倒。","我沒有提前訂電影票，差點看不成電影。","結局太感人了，我在電影院差點哭出來。"],"notes":["因為事情沒有發生，通常用過去時 -(으)ㄹ 뻔했다。像 넘어질 뻔해요 這樣的現在時聽起來不對。","在前面加 하마터면（差點兒）會更強調“險些出事”。多用於壞事，也可以用於錯失的機會（우승할 뻔했어요“差點奪冠”）。"]},"g1-2":{"meaning":"也許是因為……：說話人對原因只是推測，並不確定，然後說出自己注意到的結果。","use":"接在普通的 -아/어서 形式後（좋아서、먹어서、피곤해서；名詞用 이라서/라서），再加 그런지，後面說出自己注意到的結果。原因只是猜測；如果原因很確定，就直接用 -아/어서。後句是陳述自己感受到或注意到的事（졸리다、사람이 많다），不能是命令或建議。常與 오늘따라、왠지 一起出現。常見錯誤：用於已確定的原因，或後句用命令。","ex":["也許是因為昨天睡得晚，我今天一整天都很困。","也許是因為週末，電影院裡人真多啊。","也許是因為歌好聽，對口型影片越來越火了。"],"notes":["그런지 後面要說自己注意到的事實，不用命令或共動句。（✗ 피곤해서 그런지 일찍 주무세요）","如果原因很確定，直接用 -아/어서 或 -(으)니까。그런지 帶有“也許就是因為這個吧？”的感覺。"]},"g1-3":{"meaning":"越……越……。前面事情的程度加深，後面的程度也隨之加深（或發生變化）。","use":"詞幹以母音或ㄹ結尾加 -ㄹ수록（보다→볼수록，만들다→만들수록），以子音結尾加 -을수록（먹다→먹을수록，좋다→좋을수록）。前面的 -(으)면 可有可無，只起強調作用，並重復同一個動詞（보면 볼수록、알면 알수록）。後句常出現 더（更）。-(으)ㄹ수록 前不能加過去時 -았/었-。常見錯誤：前句加 -았/었-，或用於只發生一次的事。","ex":["這部電影越看越有魅力。","對口型越練越熟練。","歌詞越讀越覺得意味深長。"],"notes":["-(으)ㄹ수록 前不加 -았/었-（✗ 많았을수록）。也不用於只發生一次的事。","後句常加“더”：알수록 더 재미있어요。重複同一個動詞，如 보면 볼수록，可以起強調作用。"]},"g1-4":{"meaning":"與其……不如……（更準確地說是……）。放下前一個行為或說法，選擇更好或更準確的後者。","use":"直接接在動詞詞幹後（쉬다→쉬기보다，사다→사기보다），加 는 可加強對比。形容詞也可以用（슬프기보다）。後句說明說話人更偏向的做法或更準確的描述，常與 -는 편이다、-는 게 낫다/좋다、오히려（反而）連用。常見錯誤：在 기 前加過去時（✗ 쉬었기보다），或比較不相干的兩件事。","ex":["週末我比起在家休息，更喜歡見朋友。","這部電影與其說悲傷，不如說是一個溫暖的故事。","考試前，比起只背題目，理解更重要。"],"notes":["通常更好或更準確的一方放在後面。-기보다 前不加過去時 -았/었-（✗ 쉬었기보다）。","和“오히려”或“-는 편이다”連用很自然：슬프기보다 오히려 따뜻한 이야기예요。名詞用“N보다는”。"]},"g1-5":{"meaning":"既然……，那就……。前句是已確定的事實，後句說明由此得出的當然結果或應該做的事。","use":"動詞用 -는 이상，形容詞和已完成的動作用 -(으)ㄴ 이상（약속한 이상），名詞用 인 이상。後句表示義務、決心或理所當然的結論（-아/어야 하다、-(으)ㄹ 수밖에 없다、-겠다），不是單純的事實。與 -(으)니까 相比，語氣更堅定、更正式。常見錯誤：以單純的過去事實結尾（✗ 약속한 이상 갔어요）。","ex":["既然住在韓國，就得努力學韓語。","既然答應了，就是下雨也得去啊。","既然已經決定了，現在就不能改了。"],"notes":["後句應是義務、決心或當然的結果。以單純的過去事實結尾會顯得彆扭（✗ 약속한 이상 갔어요）。","-(으)니까 是輕鬆的“因為”，而 -는 이상 有“既然如此就沒辦法了”的堅定感，適合正式的說話和寫作。"]},"g2-1":{"meaning":"不可能……。說話人強烈相信某件事不可能是真的或不可能發生。","use":"詞幹加 -(으)ㄹ（가다→갈，먹다→먹을，살다→살）再接 리가 없다；過去時用 -았/었을 리가 없다；名詞用 일 리가 없다。리 是名詞，意為“理由、可能性”，因此也會出現 리는 없다 和 리(가) 있어요?（“怎麼可能？”）。這是說話人憑對人或情況的瞭解而產生的強烈確信，並非核實過的事實。常見錯誤：用於自己的計劃，或後接命令。","ex":["他不可能說謊。我認識他很久了。","青蛙不可能聽媽媽的話。他總是反著來嘛。","他到昨天都還很健康，不可能突然生病。"],"notes":["名詞用“일 리가 없다”（✗ 거짓말 리가 없다 → ○ 거짓말일 리가 없다）。已經過去的事用 -았/었을 리가 없다。","對話中常用反問“리가 있어요?”（怎麼可能？）或“-ㄹ 리가 없는데…”。"]},"g2-2":{"meaning":"由於發生了意想不到的事，出現了（通常是不好的）結果。整件事已經是過去。","use":"接在動詞詞幹後（넘어지다→넘어지는 바람에，오다→오는 바람에）。時態只在句末表現，所以即使是過去的事，前句也保持 -는（✗ 비가 왔는 바람에）。原因是說話人沒有選擇的意外之事，結果通常是負面的（늦다、못 하다、놓치다、망치다）。後句不能是命令或建議。不與形容詞連用。常見錯誤：用 -았/었는 바람에，或把有意的行為當原因。","ex":["突然下雨，所以沒能去野餐。","弟弟打碎了杯子，地板上全是水。","手機沒電了，所以沒能拍完對口型影片。"],"notes":["時態只用在句末（✗ 비가 왔는 바람에 → ○ 비가 오는 바람에 소풍을 못 갔어요）。後面不能接命令或共動句。","-는 바람에 帶有“倒霉地變成了這樣”的感覺。好結果用 -덕분에，一般原因用 -아/어서。"]},"g2-3":{"meaning":"假裝……。把不是事實的事裝成事實的樣子去做。","use":"動詞用 -는 척하다（자다→자는 척하다；알다→아는 척하다，모르다→모르는 척하다），形容詞用 -(으)ㄴ 척하다（아프다→아픈 척하다），名詞用 N인 척하다。假裝已經做過用 V-(으)ㄴ 척하다（이미 먹은 척하다）。整句的時態加在 하다 上（척했다）。-는 체하다 意思相同，척 更口語。常見錯誤：形容詞用 -는（✗ 아프는 척하다）。","ex":["弟弟假裝生病，沒去上學。","民秀明明知道這件事，卻假裝不知道。","青蛙假裝聽媽媽的話，然後又反著做。"],"notes":["알다、모르다、있다、없다 用 -는 척（아는 척、모르는 척、있는 척）。只有形容詞用 -(으)ㄴ 척（아픈 척、괜찮은 척）。","因為是裝成不真實的樣子，語氣可能略帶負面。-는 체하다 意思相同；척 更口語。"]},"g2-4":{"meaning":"敷衍地做某事，讓人說不清到底做了沒有。","use":"在動詞詞幹後接 -는 둥 마는 둥，前後用同一個動詞（먹다→먹는 둥 마는 둥，듣다→듣는 둥 마는 둥），後面接 하다 或其他動詞：먹는 둥 마는 둥 하고 나왔어요。多用過去時，表示因睏倦、匆忙或擔心而不專心、不用心。常見動詞：먹다、듣다、자다、하다、보다。常見錯誤：使用兩個不同的動詞（那是另一個句型 -는 둥 -는 둥），或用於形容詞。","ex":["早上晚了，飯沒怎麼吃就出門了。","太困了，課聽得馬馬虎虎。","因為擔心，昨晚幾乎沒睡。"],"notes":["要重複同一個動詞：듣는 둥 마는 둥。用兩個不同的動詞則是另一個句型（-는 둥 -는 둥）。","마는 來自 말다（停止）。帶有“沒有好好做”的不滿或遺憾，所以通常伴隨原因（졸려서、바빠서）。"]},"g2-5":{"meaning":"講故事的結尾（-다고 합니다 的縮略）。像講民間故事或對孩子、聽眾講述時，親切又有趣地轉述事情。","use":"形式：形容詞 -답니다，沒有收音的動詞 -ㄴ답니다，有收音的動詞 -는답니다（ㄹ 動詞去掉 ㄹ：살다→산답니다），名詞 (이)랍니다，過去 -았/었답니다。用於童話，或向聽眾（父母、導遊、播音員）介紹有趣的事。語氣親切、略帶俏皮，不用於中性的報道。直接對孩子說時用 -단다/-란다。常見錯誤：用於說話人自己的意見或親身經歷。","ex":["很久很久以前，住著善良的興夫和貪心的遊夫。","兄妹倆升到天上，變成了太陽和月亮。","那個村子裡至今還流傳著青蛙的故事。"],"notes":["無收音動詞用 -ㄴ답니다（간답니다），有收音用 -는답니다（먹는답니다），形容詞用 -답니다（착하답니다），이다 變為 (이)랍니다。以 ㄹ 結尾的動詞去掉 ㄹ（산답니다）。","直接對孩子說時用 -단다/-란다：옛날에 호랑이가 살았단다。童話書的最後幾句常出現。"]},"g3-1":{"meaning":"委婉的推測：我想……／大概……。常用來溫和地糾正或反駁對方的話或想法。","use":"母音或ㄹ結尾的詞幹加 -ㄹ걸요，子音結尾加 -을걸요；過去 -았/었을걸요；名詞 일걸요。與親近的朋友說話時可省略 요（-(으)ㄹ걸）。這是口語，只表示猜測，不用於已確認的事實或說話人自己的計劃。常用來回應別人的想法（아니에요, ~ -(으)ㄹ걸요），加 아마 語氣更柔和。常見錯誤：用於正式書面語，用於自己的計劃（✗ 저는 내일 갈걸요），或用於疑問句。","ex":["現在出發的話，路上大概會很堵。","那部電影大概已經結束了。現在去也看不到了。","金老師現在大概不在辦公室。"],"notes":["-(으)ㄹ걸요 只是猜測，不用於自己的計劃。另外，“-(으)ㄹ걸 그랬다”是表示後悔的另一個句型。","可以用“아니에요, 주말이라서 사람이 많을걸요”（不是的，週末大概人很多）來溫和地反對。加 아마 更委婉。"]},"g3-2":{"meaning":"並不是說……就一定……。前句是常見的想法，後句否定“理所當然”的結論。","use":"先構成引用形式 -다고 해서（形容詞 -다고，動詞 -ㄴ/는다고，名詞 (이)라고；過去 -았/었다고），最後以 -(으)ㄴ/는 것은 아니다 結尾（口語 건 아니에요）。前句是一般的想法（비싸다고 해서……），結尾的意思是“不一定”，不是“絕對不”。해서 可以省略。加上 반드시/꼭/항상/다 很自然。常見錯誤：把它當成完全否定，或在前句放一個沒人相信的規則。","ex":["價格貴不一定意味著質量好。","網上的資訊並不都是真的。","唱歌好不一定對口型也好。"],"notes":["結尾用“-(으)ㄴ/는 것은 아니다”（口語“-는 건 아니에요”）。不是完全否定，而是“不一定如此”。","名詞用 N(이)라고 해서，過去用 -았/었다고 해서。해서 可以省略，說成“-다고 -는 건 아니다”。"]},"g3-3":{"meaning":"事先做好某事，並把結果保持下去以備後用。","use":"詞幹末音節是 ㅏ/ㅗ 的加 -아 두다，其他加 -어 두다（사다→사 두다，적다→적어 두다，준비하다→준비해 두다）。用於提前準備（예매해 두다）或讓狀態保持原樣（창문을 열어 두다“讓窗戶開著”）。需要結果能留下來的動詞：사다、적다、켜다、열다、예약하다。不用於沒有持續結果的動詞或形容詞（✗ 학교에 가 두다）。두었다 常縮寫為 뒀다。與 -아/어 놓다 幾乎相同，後者更口語。","ex":["考試前，請把重要的單詞記在筆記本上。","我提前訂好了電影票。","到朋友來之前，我一直開著燈。"],"notes":["只用於結果會留下來的動作，不用於移動或狀態詞（✗ 학교에 가 두다，✗ 예뻐 두다）。","與 -아/어 놓다 幾乎相同。有“提前準備”和“保持原樣”兩種意思，過去式 두었다 常縮寫為 뒀다。"]},"g3-4":{"meaning":"根據是否……／怎樣……而不同。後句的結果隨前句內容的不同而不同。","use":"動詞接 -느냐에 따라（먹느냐에 따라），形容詞接 -(으)냐에 따라（크냐에 따라、어려우냐에 따라），名詞接 (이)냐에 따라。常與疑問詞（누가、어떻게、얼마나、무엇을）搭配。後句說明會不同或發生變化：달라지다、다르다、바뀌다、결정되다。서 可省略。常見錯誤：用表示“如果”的 -(으)면，或在沒有變化時以固定結果結尾。","ex":["同一首歌，誰來唱，感覺也不一樣。","大腦的能力會因使用方式而不同。","睡多久不同，記憶力也可能不同。"],"notes":["後句需要表示結果會變化的詞，如 달라지다/다르다/바뀌다/결정되다。結果固定時不能用。","名詞可以簡化為“N에 따라(서)”：사람에 따라 달라요。與疑問詞（누가、어떻게、얼마나）搭配很自然。"]},"g3-5":{"meaning":"靠自己的力量克服困難，最終做成了某件難事。","use":"詞幹末音節是 ㅏ/ㅗ 的加 -아 내다，其他加 -어 내다（참다→참아 내다，이기다→이겨 내다，하다→해 내다）。表示靠自己的力量完成艱難或漫長的事，所以適合表示忍耐和成就的動詞（참다、이기다、견디다、찾다、해결하다、만들다）。多用過去或完成形（참아 냈어요），常與 끝까지、드디어 搭配。不用於容易的動作（✗ 밥을 먹어 냈어요）或形容詞。","ex":["那個學生把艱苦的訓練堅持到了最後。","我們隊自己解決了難題。","興夫戰勝了貧窮，過上了幸福的生活。"],"notes":["只用於有困難和努力的事。用於容易的事會顯得彆扭（✗ 밥을 먹어 냈어요）。","有很多固定搭配：이겨 내다、참아 내다、견뎌 내다、해 내다、찾아 내다、알아 내다。與 끝까지、드디어、결국 很搭。"]},"g4-1":{"meaning":"達到……的程度；……到……的地步。前句說明狀態或動作，後句用具體的結果或形象來表現它有多強烈。","use":"母音詞幹加 -ㄹ，子音詞幹加 -을（詞幹以 ㄹ 結尾時保持原樣：울 정도로）；過去用 -았/었을 정도로。後句多為具體或誇張的結果（눈물이 날、믿기 어려울、숨이 막힐），常見於講述和抱怨。句尾可用 -(으)ㄹ 정도이다。常見錯誤：把它當作原因（“因為”）；정도로 表示程度而不是理由，後句是狀態或事件，不用命令句或共動句。","ex":["調查結果令人驚訝，難以置信。","韓國人很重感情，對剛認識的人甚至會請吃飯。","昨天累得一躺下就睡著了。"],"notes":["정도로 表示程度而不是原因，所以不能換成 -아/어서（“因為”）。後句也很少用命令句或建議句。","句尾用 -(으)ㄹ 정도이다，如「눈물이 날 정도예요」（到了要流淚的程度）。「죽을 정도로 힘들다」是常用的誇張說法。"]},"g4-2":{"meaning":"只做……（別的什麼都不做）；只是……。說話人強調只有這一個動作或狀態，常帶有抱怨或對比的語氣。","use":"在動詞或形容詞詞幹後加 -기만，再用活用的 하다 結尾：먹기만 해요、좋기만 하다、놀기만 했어요。後面常接對比：듣기만 하고 말은 안 해요（只聽不說）、예쁘기만 하고 쓸모가 없어요。與 N만 V 比較：책만 읽어요 限定的是物件（只讀書），而 읽기만 하다 限定的是整個動作（只是讀，什麼也不做）。不要和 -기만 하면（“只要……就”）混淆。","ex":["現在的孩子只是上補習班，沒有時間和朋友玩。","弟弟一回家就只會打遊戲，讓我很擔心。","那家餐廳只是價格貴，味道一般。"],"notes":["「책만 읽어요」限定物件（只讀書）；「책을 읽기만 해요」限定動作（只是讀，別的都不做）。","後面可用 -고、-(으)ㄴ/는데、-지 않다 接對比：「보기만 하고 사지는 않아요」（只看不買）。"]},"g4-3":{"meaning":"某事 / 某人 / 某處 / 總有一天：不清楚或不具體說明是什麼、誰、哪裡、什麼時候。왠지 的意思是“不知為什麼”。","use":"這些都是疑問詞加 -인가 的縮略形式：무엇인가 → 뭔가（書面語 무언가）、누구인가 → 누군가、어디인가 → 어딘가、언제인가 → 언젠가、왜인지 → 왠지。用於陳述句，放在動詞或形容詞前面：뭔가 이상해요（有點奇怪）、누군가 왔어요（有人來了）。助詞可以省略：뭔가를、누군가가、어딘가에서。언젠가 可指過去（“曾經”）也可指將來（“總有一天”）。왠지 搭配說不清楚的感覺：왠지 불안해요。","ex":["最近想開始一個新的愛好。","聽到有人叫我的名字，我回頭看了看。","畢業以後總有一天想在韓國工作。"],"notes":["正確拼寫是 왠지（왜 + 인지），웬지 是錯的。（웬일、웬만하면 才用 웬。）","「어딘가 이상하다」意思是“說不出哪裡怪”，用來描述說不清的感覺。뭔가 이상하다 也一樣。"]},"g4-4":{"meaning":"通過……；藉由……（書面體）。前句是達成後句結果的手段或方法。","use":"母音詞幹加 -ㅁ，子音詞幹加 -음，再接 으로써：하다 → 함으로써，읽다 → 읽음으로써。ㄹ 詞幹把 ㄹ 換成 ㅁ：알다 → 앎으로써。多見於議論文、新聞、演講和報告，後句常是 -(으)ㄹ 수 있다、높이다、줄이다、해결하다 之類的結果。口語裡改用 -아/어서 或 -(으)면。不要把 으로써（手段）和 으로서（身份，如 학생으로서）或 -(으)므로（“因為”）混淆。","ex":["政府打算通過發放生育補助金來解決低生育率問題。","通過傾聽彼此的故事，我們可以積累起“情”。","他通過每天運動恢復了健康。"],"notes":["으로써 表示手段（칼로써 자르다，“用刀切”）；으로서 表示身份（학생으로서，“作為學生”）。把它們混用是很常見的錯誤。","這是正式書面語。口語裡用 -아/어서 或 -(으)면 更自然：「운동을 해서 건강해졌어요」。"]},"g5-1":{"meaning":"和 N 一樣（多/大/厲害）；達到 N 的程度。表示某事物在大小、數量或程度上與 N 相當。","use":"만큼 直接接在名詞後，不空格：나만큼、서울만큼、아이를 키우는 일만큼。後面通常是表示程度的形容詞或動詞：나만큼 키가 크다（和我一樣高）。表示“不如……”時用否定：나만큼 크지 않다 / 못하다。接在動詞或形容詞的定語形後時，만큼 是依存名詞，要空格，意思是“與……相應的程度”：노력한 만큼、먹을 만큼。比較：N처럼（像 N，方式相似）、N보다（比 N 更……）、N만（只有 N）。","ex":["像韓國人這樣重感情的人也很少見。","我不像哥哥那樣內向。","沒有什麼工作比養育孩子更有價值了。"],"notes":["接在動詞或形容詞後面時要空格：노력한 만큼、먹을 만큼（“與……相應”）。只有接在名詞後才連寫。","不要和 만（“只”）混淆：형만 커요 = 只有哥哥高；형만큼 커요 = 和哥哥一樣高。보다（“比”）表示差異，만큼 表示相等。"]},"g5-2":{"meaning":"做……的必要 / 機會 / 計劃 / 預定 / 可能性。動詞的 -(으)ㄹ 形式修飾後面的名詞。","use":"動詞詞幹 + -ㄹ/-을 + 名詞，後面通常接 이/가 있다·없다 或 -이다：갈 필요가 없다（沒必要去）、말할 기회가 생겼다、떠날 계획이다、출발할 예정입니다、비가 올 가능성이 높다。계획 是自己打算做的事；예정 是已經確定的日程，語氣較正式（通知、新聞）。가능성 與 있다/없다/높다/낮다 搭配。필요 常用否定：-(으)ㄹ 필요가 없다 = “沒有必要……”。形容詞也能接 가능성（비쌀 가능성）。","ex":["就連父母之間，對是否有必要讓孩子早早出國留學也意見不一。","我計劃明年讀研究生。","這個週末下雨的可能性很大。"],"notes":["계획 是自己決定要做的事，예정 是已經定好的日程，所以通知和新聞裡常用 예정。","-(으)ㄹ 필요가 없다 是“沒有必要……”，和 -지 않아도 되다 相近。가능성 與 있다、없다、높다、낮다 搭配。"]},"g5-3":{"meaning":"像在說……似的；好像在表示……。不用嘴說，而是用表情或動作來表現自己的想法。","use":"由間接引用的詞尾 + 는 듯이 構成：形容詞 -다는，動詞 -(ㄴ/는)다는，名詞 (이)라는，疑問 -(느)냐는，共動 -자는，命令 -(으)라는。過去用 -았/었다는 듯이，將來/推測用 -(으)ㄹ 거라는 듯이。後句是該人的動作或表情（고개를 끄덕이다、어깨를 으쓱하다、쳐다보다、웃다），常與 마치 一起用。不要和不需要引用的 -(으)ㄴ/는 듯이（“好像”）混淆：비가 올 듯이 흐려요。","ex":["孩子點了點頭，好像在說我說的他全聽懂了。","他笑著打招呼，彷彿什麼事都沒發生過。","朋友看著我，像是在問“你怎麼現在才來”。"],"notes":["-다는 듯이 是“像在說那樣”行動；普通的 -(으)ㄴ/는 듯이 只是“好像”：비가 올 듯이 흐려요（天陰得像要下雨）。","加上 마치 更生動：「마치 다 안다는 듯이」。前面的話是做動作的人心裡沒說出口的話，從那個人的角度來寫。"]},"g5-4":{"meaning":"（不好的事）常常……；總是……。描述反覆發生的不理想的事。","use":"動詞詞幹 + -기(가) 일쑤이다：지각하기 일쑤예요、잃어버리기가 일쑤다。일쑤 是名詞，所以句子以 -이다 結尾（일쑤예요、일쑤입니다、일쑤였어요）。用於不好或令人煩惱的習慣（遲到、忘記、丟東西、摔倒、不吃飯）。中性的習慣用 자주 或 -곤 하다。가 可以省略。不用於好的習慣。","ex":["最近經常加班，所以常常不吃早飯。","我很馬虎，經常把傘弄丟。","小時候我常常為了玩具和弟弟吵架。"],"notes":["只用於不好的事。好習慣或中性的常做之事用 자주、-곤 하다。","일쑤 是名詞，所以以 일쑤이다（일쑤예요）結尾。-기가 일쑤다 裡的 가 可以省略。"]},"g5-5":{"meaning":"所謂做……（是……）。把某個行為作為話題，對它做出說明或判斷，多半是“很難”。","use":"動詞詞幹 + -기란，是 -기라는 것은（= -는 것은）的縮略。後面接判斷或說明：쉽지 않다、어렵다、힘들다、보통 일이 아니다、하늘의 별 따기이다。多見於議論文、專欄和感慨式的話，讀者期待聽到關於該行為之難的道理。用動詞基本詞幹，不在 기란 前加 -았/었- 或 -겠-。名詞對應的形式是 N(이)란（사랑이란 ...）。後面接“좋다”這類中性謂語會顯得奇怪。","ex":["在陌生的國家交新朋友並不容易。","如今在首爾找房子簡直比登天還難。","生了孩子後繼續工作，並不像說的那麼容易。"],"notes":["-기란 是 -기라는 것은 的縮略，後面常接表示困難的說法，如 쉽지 않다、어렵다、힘들다、보통 일이 아니다。","名詞用 -(이)란（사랑이란），動詞用 -기란。-기는 看似相近，但常帶讓步意味（「하기는 하지만 ...」），並不相同。"]},"g6-1":{"meaning":"就算……吧；假設……是對的（為了討論）。說話人先承認一點，然後提出反駁或指出問題。","use":"由間接引用的詞尾 -다고 + 치다（“當作、算作”）構成：形容詞 -다고 치다，動詞 -(ㄴ/는)다고 치다，名詞 (이)라고 치다，過去 -았/었다고 치다。常見搭配是 -다고 치자（就算……吧）、-다고 쳐도 / -다고 치더라도（即使算……），後面接 그래도、하지만、그런데 或表示反駁、否定的句子。說話人並不完全相信這個前提，這是它與一般條件句 -(ㄴ/는)다면 的區別。多用於討論、辯論和抱怨。","ex":["就算早期留學對外語能力有幫助吧。即使這樣，讓年幼的孩子離開家人生活真的沒問題嗎？","就算工資很高，要是工作太辛苦也做不長久。","就算你說得對，也應該先道歉吧。"],"notes":["很常見的用法是用「-다고 치자」結束一句話，下一句用「그래도」「하지만」反駁。","-(ㄴ/는)다면 是假設真實可能的條件，而 -다고 치다 只是暫且承認，並不完全相信。"]},"g6-2":{"meaning":"如果是……的話也許可以，但否則就不行。先承認一個不太可能的特殊條件，然後得出真正的否定或懷疑的結論：“除非……，否則不可能”。","use":"接 -(ㄴ/는)다면 或縮略形式 -(으)면 + 몰라도：어린아이라면 몰라도（小孩子的話還行）、눈이 많이 온다면 몰라도（除非下大雪）、특별한 이유가 있다면 몰라도。過去用 -았/었다면 몰라도，名詞用 N(이)라면 몰라도。後句是否定或懷疑的內容：-(으)ㄹ 수 없다、-기 어렵다、안 되다、-지 않다。前句是說話人認為不太可能的例外，意思是“只有那種情況才行，普通情況下不行”。不要和 -(으)ㄴ/는지 몰라도（“不知道是否”）混淆。","ex":["小孩子也就罷了，大人說那種話就讓人為難了。","除非中了彩票，否則光靠工資買房很難。","剛認識的人也就罷了，對老朋友也沒必要那樣說話吧。"],"notes":["後句必須是否定或懷疑的內容。-다면 몰라도 後面接好的結果會很彆扭。","可以縮略為 -(으)면 몰라도：「한두 번이면 몰라도 매번 이러면 곤란해요」（一兩次還行，每次都這樣就麻煩了）。"]},"g6-3":{"meaning":"在……之中；在……的情況下；趁著……。先交代一個背景情況（新聞文體），主要事件發生在這個背景之中。","use":"形容詞接 -(으)ㄴ，現在時動詞接 -는，過去或完成的動詞接 -(으)ㄴ / -던，名詞接 인，再接 가운데：어려운 가운데、지켜보는 가운데、마친 가운데、학생인 가운데。前句是持續的情況或氣氛（관심이 쏠리는、비가 오는、어려운），後句是主要事件（열렸다、발표했다）。多見於新聞、報告和演講。不用於同一個人同時做兩個動作（那種情況用 -(으)면서）。가운데에도 表示“即使在……之中”。N 가운데（“在 N 之中 / 中間”）是另一種用法。","ex":["在許多市民的注視下，新政策釋出了。","即使在經濟困難的情況下，也決定增加生育補助金。","在下雨的情況下，馬拉松比賽照常舉行。"],"notes":["不用於一個人同時做的兩個動作，那種情況用 -(으)면서：「음악을 들으면서 걸어요」。","「N 가운데」還有“在 N 之中”或“正中間”的其他意思；「그런 가운데」表示“在那種情況下”。"]},"g6-4":{"meaning":"相當於……；等於……；可以說是……。說話人看著事實，得出結論：結果基本上和某種情況一樣。","use":"現在時動詞接 -는，完成的動詞或形容詞接 -(으)ㄴ，名詞接 인，再接 셈이다：받는 셈이다、끝낸 셈이다、싼 셈이다、가족인 셈이다。常出現在 사실상、결국、거의 或數字、比較之後（십 년을 살았으니 ...）。셈 是“計算”的意思，所以這個句子是把事實加起來說出總和。注意 -(으)ㄹ 셈이다 是“打算……”的意思（갈 셈이다 = 打算去），是另一個語法。","ex":["這個包是打折時買的，等於是半價買的。","我在韓國住了十年，等於是個韓國人了。","報告已經寫得差不多了，工作等於完成了。"],"notes":["-(으)ㄹ 셈이다 是“打算……”的意思，完全是另一個語法：「내일은 일찍 일어날 셈이에요」（我打算明天早點起床）。","「-(으)ㄴ 셈 치고」意思是“就當作……”：「속은 셈 치고 한번 해 보세요」（就當被騙一次，試試看吧）。"]},"g7-1":{"meaning":"說話人回想起以前親眼看到的事（多為他人的行為或某種狀態），並接著說明由此引出的後續行動、現狀變化或結果。意思是“……之後，(就)……”。","use":"接在動詞/形容詞詞幹後（過去式用 -았/었더니；名詞用 N(이)더니）。前句是說話人以前親眼看到的情況，主語通常是第三人稱（或天氣），後句是隨後發生的行動、變化或結果，兩句的主語通常相同。說話人自己的行為引出了某個結果時，要用 -았/었더니。常見搭配：그러더니（然後就）。常見錯誤：前句主語是“我”時仍用 -더니。","ex":["民秀用雙手把禮物遞給老師，然後低頭行禮。","到昨天為止一直很熱，今天突然變冷了。","在陌生的國家用手勢說話，人們馬上就聽懂了。"],"notes":["-더니 用於親眼看到的他人的行為。自己的行為引出的結果要用 -았/었더니：약을 먹었더니 열이 내렸어요（吃了藥，燒就退了）。不能說“我”+ 약을 먹더니。","前後句主語相同、內容形成對比時也可使用（昨天下雨，今天卻放晴了）。그러더니 = “然後就”。"]},"g7-2":{"meaning":"“正如您所見／所知／所聽到的那樣……”。先提出聽話人也已經看到、知道或聽說過的事實，再繼續往下說。","use":"接在 보다、알다、듣다、느끼다、말하다、예상하다 等表示感知/知曉的動詞詞幹後：보시다시피、아시다시피、들으셨다시피；已經說過的內容用過去式 -았/었다시피（말씀드렸다시피）。通常放在句首，語氣較正式，常見於演講、發表、公告。常見錯誤：用於對方還不知道的新資訊，或接在與感知、知曉無關的動詞後。","ex":["正如您所見，在韓國給長輩遞東西時要用雙手。","正如您所知，每個國家的問候方式都不一樣。","正如上節課我說過的，明天有肢體語言的發表。"],"notes":["-다시피 接在 보다/알다/듣다 等感知、知曉類動詞後，說的是聽話人也已經知道的事實，不用於對方不知道的新資訊。","注意區別：-다시피 하다 表示“幾乎……”，如 밤을 새우다시피 했어요（幾乎熬了一整夜），是另一個語法。"]},"g7-3":{"meaning":"-아/어야지：“應該……／得……”，作提醒、自我決心或輕微責備；-아/어서는 안 된다：“不可以……／不應該……”。","use":"-아/어야지(요) 接在動詞、形容詞詞幹後，表示理應如此、該這樣做。對別人說是提醒或輕責，對自己說是決心（내일부터 운동해야지）。-아/어서는 안 된다 是比 -(으)면 안 되다 更鄭重的禁止，多用於規則、禮儀、道德。兩者常搭配：應該做A，不可以做B。敬語形式寫作 안 돼요（不是 안 되요）。","ex":["向長輩問候時當然應該低頭行禮。","在長輩面前不可以翹著二郎腿坐。","應該尊重其他國家的文化，不可以輕視。"],"notes":["-아/어서는 안 된다 比 -(으)면 안 되다 更強烈、更正式，多用於禮儀、規則、道德。禮貌說法是 안 돼요，不是 안 되요。","-아/어야지 單獨結尾時：對別人是“當然該……啊”的提醒，對自己是“我得……”的決心。"]},"g7-4":{"meaning":"稱呼與引用：把某人/某物叫作 N（N(이)라고 부르다/하다/말하다）；N 하고 則是直接引用某個詞或聲音。","use":"名詞有收音時用 N이라고，沒有收音時用 N라고，後面常接 부르다、하다、말하다，用來說明名字、稱呼、術語“被叫作什麼”。N 하고 是直接引用，放在引號中的詞或聲音之後，需要空格：'엄마!' 하고 소리치다。注意：這個 하고 不是表示“和”的 하고。","ex":["在韓國，人們把學長/前輩稱作“선배님”。","朋友們叫我“대니”。","孩子喊著“媽媽！”跑了過來。"],"notes":["有收音用 이라고，沒有收音用 라고。這裡的 하고 不是“和”的 하고，而是接在被引用的詞或聲音之後，並且要空格。","解釋名稱、術語時常搭配 하다/부르다：이것을 한국어로 '손짓'이라고 해요（這個在韓語裡叫“손짓”）。"]},"g7-5":{"meaning":"“所謂N，就是……／N這種東西……”。把 N 作為話題，對它下定義或談一般性的看法。","use":"N 有收音時用 N이란，沒有收音時用 N란，是 N(이)라는 것은 的縮略形式，後面接對 N 的解釋。句尾常是 ~(이)다、~는 것이다、~(이)라고 할 수 있다。多用於文章、發表、課堂。不用於具體的某個人或某件事。","ex":["所謂肢體語言，就是不用話語而用身體傳達心意的方法。","所謂稱呼，就是稱呼人的時候使用的話。","所謂禮貌，是出自尊重對方的心意。"],"notes":["N(이)란 用於下定義或表達一般看法，不用於具體的某個人或某件事（×민수 씨란 학생이에요，應說 민수 씨는 학생이에요）。","常用於文章、發表、課堂。句尾多為 ~(이)다、~는 것이다、~(이)라고 할 수 있다；也可以用疑問開頭，如 사랑이란？（愛是什麼？）"]},"g8-1":{"meaning":"表示說話人當場看到或發現某事時的驚訝、感嘆或新發現；這裡用來描述在畫中注意到的內容。","use":"接在動詞/形容詞詞幹後（過去式 -았/었네요，推測 -겠네요，名詞 N(이)네요）。只用於剛剛看到、聽到或得知的事，重點是“現在才發現”的感覺。是一種柔和的口語表達，用來評論眼前的景象或回應對方。常見錯誤：用於早就知道的事，或用於自己的計劃。","ex":["這幅畫的顏色真華麗啊！","你看，畫中的孩子們都在笑呢。","哇，這幅畫是四百年前畫的呀！"],"notes":["-네요 用於剛剛看到或發現的事，不用於早就知道的事或自己的計劃（내일 가네요 不能表示“我明天去”）。","是柔和地表達驚訝或讚歎的說法。描述畫時可用來說眼前所見：강아지가 있네요（有隻小狗呢）。比 -군요 更口語化。"]},"g8-2":{"meaning":"N치고 + 否定：“凡是N，沒有不……的”（沒有例外）；N치고는：“就N而言，(出乎意料地)……”。","use":"치고／치고는 直接接在名詞後，不必區分有無收音。N치고 表示“在這一類裡，幾乎都是這樣”，後面多接否定（없다、-지 않다、못하다），整體意思是強烈的肯定。N치고는 把 N 當作標準，說出與對這一類的預期不同的結果，如“作為初學者，畫得很好”。","ex":["凡是藝術家，沒有感受力不豐富的。","就來韓國才三個月的人來說，韓語說得非常好。","凡是韓國人，幾乎沒有不吃泡菜的。"],"notes":["N치고는 後面的內容與對 N 的預期不同（初學者畫得好；冬天天氣暖和）。N치고 後面多接 없다 等否定，意思是“毫無例外”。","口語中 치고는 常縮略為 치곤：겨울치곤 따뜻해요（就冬天來說挺暖和的）。"]},"g8-3":{"meaning":"雙重否定：連用兩個否定來表示更強的肯定。“只能是N／不得不……／不……不行(必須)／沒有不能……的事”。","use":"常見四種句型：N이/가 아닐 수 없다（只能說是N）；V-지 않을 수(가) 없다（不得不……、禁不住……）；V-지 않으면 안 되다（必須……）；V-(으)ㄹ 수 없는 것이 없다（沒有做不到的事，什麼都能……）。語氣強烈、較正式，多見於文章、評論、發表；日常會話裡 꼭 ~아/어야 해요 更自然。兩個否定相加是肯定意思，不要按字面理解為“不能”。","ex":["這幅畫不能不說是韓國風俗畫的傑作。","看到這麼美的畫，不能不感動。","接受美術治療期間，必須每天畫畫。"],"notes":["雙重否定多用於文章、評論、發表等較正式的場合；日常會話裡 꼭 ~아/어야 해요 更自然。兩個否定合起來表示肯定。","-지 않을 수 없다 ≈ “不由得……、不得不……”；-지 않으면 안 되다 ≈ “必須……”；禮貌形式寫作 안 돼요。"]},"g8-4":{"meaning":"“在做……方面／做……時(需要、花費……)”。-는 데 把動詞變成名詞性短語（做……這件事/這種情況），後面接 도움이 되다、필요하다、시간이 걸리다、자신이 있다 等。","use":"接在動詞詞幹後（ㄹ 結尾的動詞去掉 ㄹ：만들다 → 만드는 데）。這裡的 데 是依存名詞（“……的事/情況”），要空格，後面可加助詞 에：하는 데(에)。常見搭配：도움이 되다/주다、필요하다、시간이 걸리다、돈이 들다、좋다、효과가 있다、자신이 있다、익숙하다、서투르다。注意不要與連線語尾 -는데（連寫，表示“但是/而且”）混淆。","ex":["美術治療有助於讓心情平靜。","據說完成這幅大畫花了四年。","我對講解畫很有自信。"],"notes":["-는 데 的 데 要空格。連寫的 -는데 是連線句子的語尾（“……，但是/而且……”），是另一個語法點。","-는 데 後面常接固定表達：도움이 되다、필요하다、시간이 걸리다、돈이 들다、자신이 있다、효과가 있다。整塊記憶比較好。"]}}};           // {lang: {id: {meaning,use,ex[],notes[]}}}  (en comes from DATA)

      model:"คำตอบเป็นเพียงตัวอย่าง คำตอบอื่นก็อาจถูกได้",all:"ทั้งหมด",done:"เสร็จแล้ว! คะแนน"},
  ru:{meaning:"Значение",use:"Как употреблять",examples:"Примеры",notes:"Внимание / советы",table:"Формы",practice:"Упражнения (тетрадь)",
      show:"Показать ответ",hide:"Скрыть",quiz:"Тест",quizT:"Какая грамматика подходит в пропуск?",next:"Дальше",again:"Ещё раз",close:"Закрыть",
      right:"Верно!",wrong:"Не совсем — правильно:",score:"Счёт",trOn:"Перевод: виден",trOff:"Перевод: по нажатию",
      cover:"Закрыть",uncover:"Показать всё",coverTip:"Закройте таблицу и нажимайте на клетки, чтобы проверить себя.",tapEx:"Нажмите на предложение, чтобы увидеть перевод.",
      model:"Ответы — только образец, возможны и другие варианты.",all:"Все",done:"Готово! Счёт"},
  vi:{meaning:"Ý nghĩa",use:"Cách dùng",examples:"Ví dụ",notes:"Lưu ý / mẹo",table:"Các dạng",practice:"Luyện tập (sách bài tập)",
      show:"Xem đáp án",hide:"Ẩn",quiz:"Trắc nghiệm",quizT:"Ngữ pháp nào hợp với chỗ trống?",next:"Tiếp",again:"Làm lại",close:"Đóng",
      right:"Đúng rồi!",wrong:"Chưa đúng — đáp án là",score:"Điểm",trOn:"Bản dịch: hiện",trOff:"Bản dịch: chạm để xem",
      cover:"Che bảng",uncover:"Hiện tất cả",coverTip:"Che bảng rồi chạm vào ô để tự kiểm tra.",tapEx:"Chạm vào câu để xem bản dịch.",
      model:"Đáp án chỉ là gợi ý — câu trả lời khác cũng có thể đúng.",all:"Tất cả",done:"Xong! Điểm"},
};
I18N.zht = {meaning:"意思",use:"用法",examples:"例句",notes:"注意 / 小貼士",table:"變化形式",practice:"練習（練習冊）",
      show:"看答案",hide:"隱藏",quiz:"小測驗",quizT:"空格里應該用哪個語法？",next:"下一題",again:"再來",close:"關閉",
      right:"答對了！",wrong:"不對，答案是",score:"得分",trOn:"翻譯：顯示",trOff:"翻譯：點選看",
      cover:"遮住",uncover:"全部顯示",coverTip:"遮住表格，點格子自測。",tapEx:"點句子看翻譯。",
      model:"參考答案僅供參考，其他說法也可能正確。",all:"全部",done:"完成！得分"};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){try{return localStorage.getItem(k);}catch(e){return null;}}, set(k,v){try{localStorage.setItem(k,v);}catch(e){}} };

let lang = LANGS.some(l => l.code === store.get("k5b_lang")) ? store.get("k5b_lang") : "en";
let showTr = store.get("k5b_gr_tr") !== "0";
let chapter = +(store.get("k5b_gr_ch") || 1);
if (!DATA.chapters.some(c => c.n === chapter)) chapter = DATA.chapters[0].n;   // not every 5B chapter has grammar
const openSet = new Set();
let quiz = null;
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k];

function tr(p, field, i){
  if (lang === "en") return field === "ex" ? p.examples[i].en : field === "notes" ? p.notes[i].en : p[field];
  const x = (TR[lang] || {})[p.id];
  const v = x && (field === "ex" || field === "notes" ? x[field][i] : x[field]);
  return v || (field === "ex" ? p.examples[i].en : field === "notes" ? p.notes[i].en : p[field]);
}
// highlight the grammar in a Korean sentence (regex list per point, built in build_grammar.js)
function hl(p, ko){
  const re = p.hlShow ? new RegExp(p.hlShow, "g") : null;
  if (!re) return esc(ko);
  let out = "", last = 0, m;
  while ((m = re.exec(ko))) { if (!m[0]) { re.lastIndex++; continue; } out += esc(ko.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>"; last = m.index + m[0].length; }
  return out + esc(ko.slice(last));
}
const L = () => ` lang="${lang}"`;

function renderTabs(){
  $("#tabs").innerHTML = DATA.chapters.map(c =>
    `<button class="tab${c.n === chapter ? " on" : ""}" data-ch="${c.n}">${c.n}과<small>${esc(c.title)}</small></button>`).join("");
}
function renderPoint(p, idx){
  const open = openSet.has(p.id);
  let h = `<div class="gp${open ? " open" : ""}" data-id="${p.id}">
    <div class="gphead"><span class="num">${idx + 1}</span>
      <div class="ttl"><b>${esc(p.title)}</b><span class="mean"${L()}>${esc(tr(p, "meaning"))}</span></div>
      <span class="part">${esc(p.part)}</span><span class="chev">▼</span></div>
    <div class="gpbody">
      <div class="formula"><div class="form">${esc(p.form)}</div><div class="pat">${esc(p.pattern)}</div></div>
      <p class="rule">${esc(p.rule)}</p>
      <div class="sec"><h4${L()}>${t("use")}</h4><div class="tr"${L()}>${esc(tr(p, "use"))}</div></div>`;
  if (p.table) {
    h += `<div class="sec"><h4${L()}>${t("table")}</h4>
      <div class="tbar"><span class="tr"${L()}>${t("coverTip")}</span><button class="pill small" data-cover>${t("cover")}</button></div>
      <div class="tbl"><table><tr>${p.table.head.map(x => `<th>${esc(x)}</th>`).join("")}</tr>
      ${p.table.rows.map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div></div>`;
  }
  if (p.examples.length) {
    h += `<div class="sec"><h4${L()}>${t("examples")}</h4>` + p.examples.map((e, i) =>
      `<div class="ex"><div class="ko">${hl(p, e.ko)}</div><div class="tr"${L()}>${esc(tr(p, "ex", i))}</div></div>`).join("") + `</div>`;
  }
  if (p.notes.length) {
    h += `<div class="sec"><h4${L()}>${t("notes")}</h4>` + p.notes.map((n, i) =>
      `<div class="note ${n.kind === "주의" ? "warn" : "tip"}"><span class="k">${n.kind === "주의" ? "⚠ 주의" : "💡 tip"}</span>${esc(n.ko)}
        <div class="tr"${L()}>${esc(tr(p, "notes", i))}</div></div>`).join("") + `</div>`;
  }
  if (p.practice.length) {
    h += `<div class="sec"><h4${L()}>${t("practice")}</h4>` + p.practice.map(x =>
      `<div class="pr"><div class="q">${esc(x.q)}</div><div class="a" hidden>→ ${hl(p, x.a)}</div>
        <button class="pill small" data-ans>${t("show")}</button></div>`).join("") +
      `<div class="aihint"${L()}>${t("model")}</div></div>`;
  }
  return h + `</div></div>`;
}
function render(){
  document.documentElement.lang = "ko";
  document.body.classList.toggle("hidetr", !showTr);
  $("#trBtn").textContent = showTr ? "번역 ✓" : "번역 👁";
  $("#trBtn").title = showTr ? t("trOn") : t("trOff");
  $("#trBtn").classList.toggle("on", showTr);
  renderTabs();
  const ch = DATA.chapters.find(c => c.n === chapter);
  const pts = DATA.points.filter(p => p.ch === chapter);
  let h = `<div class="chhead"><h2>${chapter}과</h2><span class="sub">${esc(ch.title)} · ${pts.length}</span><span class="grow"></span>
    <button class="pill" id="quizBtn">🎯 ${t("quiz")}</button></div>`;
  if (quiz) h += renderQuiz();
  h += pts.map(renderPoint).join("");
  $("#main").innerHTML = h;
  $("#foot").innerHTML = `서강 5B 문법·표현 · ${esc(showTr ? "" : t("tapEx"))}`;
}

// ---- quiz: blank the grammar out of the chapter's example sentences, model answers and drill sentences ----
// Rounds of ROUND questions dealt from a per-chapter deck: "again" continues with sentences you have not had
// yet, and the deck is only reshuffled once the whole chapter has been gone through.
const ROUND = 15;
const decks = {};
function chapterItems(chN){
  const items = [];
  for (const p of DATA.points.filter(p => p.ch === chN && p.hl)) {
    // Korean sentence -> its English (shown after answering); the first source to give one wins
    const sents = new Map();
    for (const [ko, en] of [...p.examples.map(e => [e.ko, e.en]), ...p.practice.map(x => [x.a, x.en]), ...(p.drill || []).map(d => [d.ko, d.en])])
      if (!sents.has(ko) || (!sents.get(ko) && en)) sents.set(ko, en || "");
    for (const [s, en] of sents) {
      const m = new RegExp(p.hl).exec(s);
      if (!m || m[0].length < 1 || s.length < 8) continue;
      items.push({ id: p.id, before: s.slice(0, m.index), gap: m[0], after: s.slice(m.index + m[0].length), en });
    }
  }
  for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
  return items;
}
function quizItems(chN){
  let d = decks[chN];
  if (!d || d.pos >= d.items.length) d = decks[chN] = { items: chapterItems(chN), pos: 0 };
  const items = d.items.slice(d.pos, d.pos + ROUND);
  d.pos += items.length;
  return { pts: DATA.points.filter(p => p.ch === chN), items, i: 0, score: 0, picked: null, seen: d.pos, total: d.items.length };
}
function renderQuiz(){
  const q = quiz;
  if (q.i >= q.items.length) {
    // how far through this chapter's sentences you are; "again" deals the next unseen ones
    return `<div class="quiz"><div class="qs">🎉 ${t("done")}: ${q.score} / ${q.items.length}</div>
      <div class="qtop"><span>📚 ${q.seen} / ${q.total}</span></div>
      <div class="row"><button class="pill" data-q="close">${t("close")}</button><button class="pill on" data-q="again">${t("again")}</button></div></div>`;
  }
  const it = q.items[q.i];
  const done = q.picked !== null;
  const right = DATA.points.find(p => p.id === it.id);
  return `<div class="quiz"><div class="qtop"><span${L()}>${t("quizT")}</span><span>${q.i + 1} / ${q.items.length} · ${t("score")} ${q.score}</span></div>
    <div class="qs">${esc(it.before)}<span class="blank">${done ? esc(it.gap) : "?"}</span>${esc(it.after)}</div>
    ${done && it.en ? `<div class="qen">${esc(it.en)}</div>` : ""}
    <div class="opts">${q.pts.map(p => {
      const cls = done ? (p.id === it.id ? " right" : p.id === q.picked ? " wrong" : "") : "";
      return `<button class="opt${cls}" data-pick="${p.id}"${done ? " disabled" : ""}>${esc(p.title)}<small${L()}>${esc(tr(p, "meaning"))}</small></button>`;
    }).join("")}</div>
    <div class="fb"${L()}>${done ? (q.picked === it.id ? "✅ " + t("right") : "❌ " + t("wrong") + " " + esc(right.title)) : ""}</div>
    ${done && right.why ? (() => {
      // why the right one fits, and when you missed, what the one you picked actually means
      const mine = q.picked !== it.id ? DATA.points.find(p => p.id === q.picked) : null;
      return `<div class="qwhy">💡 <b>${esc(right.title)}</b>: ${esc(right.why)}` +
        (mine ? `<div class="qmine">You chose <b>${esc(mine.title)}</b>: ${esc(mine.meaning)}</div>` : "") + `</div>`;
    })() : ""}
    <div class="row"><button class="pill" data-q="close">${t("close")}</button>${done ? `<button class="pill on" data-q="next">${t("next")} ›</button>` : ""}</div></div>`;
}

// ---- events ----
$("#tabs").onclick = e => {
  const b = e.target.closest("[data-ch]"); if (!b) return;
  chapter = +b.dataset.ch; store.set("k5b_gr_ch", chapter); quiz = null; render(); window.scrollTo(0, 0);
};
$("#main").onclick = e => {
  const el = e.target;
  if (el.closest("#quizBtn")) { quiz = quizItems(chapter); render(); window.scrollTo(0, 0); return; }
  const pick = el.closest("[data-pick]");
  if (pick && quiz && quiz.picked === null) { quiz.picked = pick.dataset.pick; if (quiz.picked === quiz.items[quiz.i].id) quiz.score++; render(); return; }
  const qa = el.closest("[data-q]");
  if (qa) { const a = qa.dataset.q; if (a === "close") quiz = null; else if (a === "again") quiz = quizItems(chapter); else { quiz.i++; quiz.picked = null; } render(); return; }
  const ans = el.closest("[data-ans]");
  if (ans) { const pr = ans.closest(".pr"), a = pr.querySelector(".a"); a.hidden = !a.hidden; pr.classList.toggle("done", !a.hidden); ans.textContent = a.hidden ? t("show") : t("hide"); return; }
  const cov = el.closest("[data-cover]");
  if (cov) { const tb = cov.closest(".sec").querySelector(".tbl"); const on = !tb.classList.contains("cover");
    tb.classList.toggle("cover", on); tb.querySelectorAll("td.shown").forEach(td => td.classList.remove("shown")); cov.textContent = on ? t("uncover") : t("cover"); return; }
  const td = el.closest(".tbl.cover td"); if (td) { td.classList.add("shown"); return; }
  const ex = el.closest(".ex"); if (ex) { ex.classList.toggle("shown"); return; }
  const head = el.closest(".gphead");
  if (head) { const gp = head.parentElement, id = gp.dataset.id; gp.classList.toggle("open"); gp.classList.contains("open") ? openSet.add(id) : openSet.delete(id); }
};
$("#trBtn").onclick = () => { showTr = !showTr; store.set("k5b_gr_tr", showTr ? "1" : "0"); render(); };
$("#lang").innerHTML = LANGS.map(l => `<option value="${l.code}">${esc(l.native)}</option>`).join("");
$("#lang").value = lang;
$("#lang").onchange = e => { lang = e.target.value; store.set("k5b_lang", lang); render(); };

// first visit: open the first point so the page doesn't look like a bare list
if (!store.get("k5b_gr_seen")) { const f = DATA.points.find(p => p.ch === chapter); if (f) openSet.add(f.id); store.set("k5b_gr_seen", "1"); }
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
