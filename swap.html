<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Korean 5B — 바꿔 쓰기</title>
<meta name="description" content="Sogang Korean 5B: pick the word that can replace the underlined part. Combos, levels and a little celebration for every right answer.">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="swap.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="5B 바꿔 쓰기">
<link rel="apple-touch-icon" href="icon-swap-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%81%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:#1c2740; --card2:#223052;
    --line:#2c3a5a; --txt:#eaf0fb; --dim:#96a3c2; --accent:#5b8cff;
    --gold:#ffcf5c; --good:#37d18f; --bad:#ff6b7a; --fire:#ff8a3d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",
      "Microsoft YaHei","PingFang SC","Leelawadee UI","Noto Sans Thai",Tahoma,Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -200px,#1b2747,transparent),linear-gradient(180deg,#0f1420,#0b0f18);
    color:var(--txt);min-height:100%;overflow-x:hidden}
  [lang="zh"]{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
  [lang="zht"]{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
  [lang="th"]{font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif}
  .wrap{max-width:620px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:var(--accent)}
  .hidden{display:none!important}

  /* ---------- top bar ---------- */
  .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .top .home{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--dim);text-decoration:none;font-size:14px}
  .top h1{font-size:19px;margin:0;flex:1;letter-spacing:.2px}
  .iconbtn{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:16px}
  .langs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
  .chip{background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 12px;font-size:14px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---------- start ---------- */
  .hero{background:linear-gradient(135deg,#23315a,#1a2440);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .rankrow{display:flex;align-items:center;gap:12px}
  .rankicon{font-size:42px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
  .rankname{font-size:18px;font-weight:700}
  .ranksub{color:var(--dim);font-size:13px;margin-top:2px}
  .xpbar{height:12px;background:#0d1322;border-radius:999px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
  .xpfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#9b7bff,var(--gold));border-radius:999px;transition:width .9s cubic-bezier(.2,.9,.2,1)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:rgba(0,0,0,.18);border-radius:12px;padding:8px;text-align:center}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--dim)}
  .label{font-size:13px;color:var(--dim);margin:14px 0 6px;letter-spacing:.3px}
  .chs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .chbtn{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;font-size:15px}
  .chbtn small{display:block;color:var(--dim);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chbtn.on{background:var(--card2);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .chbtn .bar{height:4px;border-radius:4px;background:#0d1322;margin-top:6px;overflow:hidden}
  .chbtn .bar i{display:block;height:100%;background:var(--good)}
  .chip.star{display:block;width:100%;margin-top:8px;padding:10px;font-size:15px;text-align:center}
  .chip.star.on{background:linear-gradient(135deg,#ffcf5c,#ff8a3d);border-color:#ffcf5c;color:#0f1420;font-weight:800}
  .qstar{color:var(--gold);font-weight:800;margin-right:4px}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
  .bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:2px 0 12px;padding:12px;border:2px solid var(--txt);border-radius:6px;background:rgba(255,255,255,.03)}
  .bw{padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font-size:18px;font-weight:700;position:relative}
  .bw.done::after{content:"✓";position:absolute;top:-7px;right:-6px;font-size:12px;background:var(--good);color:#0f1420;border-radius:50%;width:17px;height:17px;display:grid;place-items:center}
  .bw.right{background:linear-gradient(135deg,rgba(55,209,143,.35),rgba(55,209,143,.15));border-color:var(--good);animation:yay .5s cubic-bezier(.2,1.6,.4,1)}
  .bw.wrongpick{background:rgba(255,107,122,.18);border-color:var(--bad);animation:shake .4s}
  .blank{display:inline-block;min-width:76px;border-bottom:2.5px solid var(--gold);margin:0 3px;text-align:center;color:transparent}
  .mode{padding:10px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);font-weight:800;font-size:15px}
  .mode small{display:block;font-weight:500;color:var(--dim);font-size:12px;margin-top:2px}
  .mode.on{border-color:var(--accent);background:linear-gradient(135deg,rgba(91,140,255,.25),rgba(155,123,255,.18))}
  .gram{display:inline-block;margin:2px 0 10px;padding:5px 12px;border-radius:999px;background:linear-gradient(135deg,#ffcf5c,#ff8a3d);color:#0f1420;font-weight:900;font-size:16px}
  .built{min-height:58px;margin-top:12px;padding:10px;border-radius:14px;border:1.5px dashed var(--line);background:rgba(0,0,0,.18);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .built.good{border-color:var(--good);border-style:solid;background:rgba(55,209,143,.12)}
  .built.bad{border-color:var(--bad);border-style:solid;animation:shake .4s}
  .built:empty::before{content:attr(data-ph);color:var(--dim);font-size:14px}
  .tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tile{padding:10px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font-size:18px;transition:transform .08s,opacity .2s}
  .tile:active{transform:scale(.95)}
  .tile.used{opacity:.18;pointer-events:none}
  .built .tile{background:#2a3a63;border-color:#4a64a8;animation:popin .25s cubic-bezier(.2,1.6,.4,1)}
  .fixline{margin-top:6px;font-size:17px;line-height:1.6}
  .fixline .ok{color:var(--good);font-weight:800}
  .lens{display:flex;gap:8px}
  .lens .chip{flex:1;text-align:center;padding:9px}
  .go{display:block;width:100%;margin-top:18px;padding:16px;border:0;border-radius:16px;font-size:19px;font-weight:800;color:#fff;
      background:linear-gradient(135deg,#5b8cff,#8a6bff);box-shadow:0 10px 26px rgba(91,140,255,.35);transition:transform .1s}
  .go:active{transform:scale(.98)}
  .go:disabled{opacity:.45}

  /* ---------- play ---------- */
  .hud{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .prog{flex:1;height:10px;background:#0d1322;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),#7af0c0);transition:width .35s}
  .count{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
  .combo{display:flex;align-items:center;gap:4px;font-weight:800;font-size:16px;color:var(--fire);min-width:58px;justify-content:flex-end;transition:transform .15s}
  .combo .flame{display:inline-block;transform-origin:50% 90%}
  .combo.hot .flame{animation:flick .5s infinite alternate}
  @keyframes flick{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.18) rotate(4deg)}}
  .combo.bump{transform:scale(1.35)}
  .score{font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);min-width:52px;text-align:right}
  .qcard{position:relative;background:linear-gradient(160deg,#1f2b48,#18213a);border:1px solid var(--line);border-radius:20px;padding:18px 16px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .ask{font-size:12.5px;color:var(--dim);margin-bottom:10px}
  .sent{font-size:21px;line-height:1.75;word-break:keep-all}
  .ul{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--gold);background:rgba(255,207,92,.10);border-radius:6px;padding:0 3px}
  .ans{color:#0f1420;background:linear-gradient(135deg,#6ff2b5,#37d18f);border-radius:8px;padding:1px 7px;font-weight:800;display:inline-block;animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
  .ans.miss{background:linear-gradient(135deg,#ffd27a,#ffb15c)}
  @keyframes popin{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  .opts{display:grid;gap:10px;margin-top:14px}
  .opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:16px;padding:14px 14px;font-size:19px;transition:transform .08s,background .2s,border-color .2s}
  .opt:active{transform:scale(.985)}
  .opt .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#0d1322;color:var(--dim);font-size:14px;font-weight:700}
  .opt.right{background:linear-gradient(135deg,rgba(55,209,143,.28),rgba(55,209,143,.12));border-color:var(--good);animation:yay .5s cubic-bezier(.2,1.6,.4,1)}
  .opt.right .n{background:var(--good);color:#0f1420}
  .opt.wrongpick{background:rgba(255,107,122,.16);border-color:var(--bad);animation:shake .4s}
  .opt.wrongpick .n{background:var(--bad);color:#0f1420}
  .opt.dim{opacity:.45}
  @keyframes yay{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  .fb{margin-top:12px;border-radius:16px;padding:12px 14px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
  .fb .head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
  .fb.good .head{color:var(--good)} .fb.bad .head{color:var(--warn,#ffb15c)}
  .fb .word{margin-top:6px;font-size:16px}
  .fb .word b{font-size:18px}
  .fb .en{margin-top:6px;color:var(--dim);font-size:14.5px;line-height:1.45}
  .next{display:block;width:100%;margin-top:12px;padding:13px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-weight:800;font-size:17px;position:relative;overflow:hidden}
  .next i{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.65);width:0}
  .float{position:fixed;pointer-events:none;font-weight:900;font-size:24px;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.6);z-index:30;animation:rise 1s ease-out forwards}
  @keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
  .banner{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);z-index:31;pointer-events:none;font-size:34px;font-weight:900;text-align:center;
          background:linear-gradient(135deg,#ffcf5c,#ff8a3d,#ff5c8a);-webkit-background-clip:text;background-clip:text;color:transparent;
          filter:drop-shadow(0 6px 18px rgba(255,138,61,.45));animation:bannerin 1.3s cubic-bezier(.2,1.4,.4,1) forwards;white-space:nowrap}
  @keyframes bannerin{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(2deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-70%) scale(.9);opacity:0}}
  .flash{position:fixed;inset:0;pointer-events:none;z-index:25;background:radial-gradient(circle at 50% 60%,rgba(55,209,143,.22),transparent 60%);animation:fl .5s ease-out forwards}
  .flash.bad{background:radial-gradient(circle at 50% 60%,rgba(255,107,122,.18),transparent 60%)}
  @keyframes fl{from{opacity:1}to{opacity:0}}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:29}

  /* ---------- end ---------- */
  .end{text-align:center}
  .end .big{font-size:56px;margin:6px 0 0}
  .end h2{margin:4px 0 2px;font-size:24px}
  .end .sub{color:var(--dim);font-size:14px}
  .endstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .lvup{margin:10px auto 0;font-weight:900;font-size:20px;color:var(--gold);animation:popin .6s cubic-bezier(.2,1.6,.4,1)}
  .missed{text-align:left;margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
  .missed h3{margin:4px 0 8px;font-size:15px;color:var(--dim);font-weight:600}
  .mrow{padding:7px 0;border-top:1px solid var(--line);font-size:15px}
  .mrow:first-of-type{border-top:0}
  .mrow b{font-size:17px}
  .btnrow{display:grid;gap:10px;margin-top:14px}
  .ghost{padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);font-weight:700;font-size:16px}
  .note{color:var(--dim);font-size:12px;margin-top:16px;text-align:center;line-height:1.5}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <a class="home" href="index.html">← 5B</a>
    <h1>🔁 바꿔 쓰기 <span style="color:var(--dim);font-weight:500;font-size:14px">· Word Swap</span></h1>
    <button class="iconbtn" id="mute" aria-label="sound">🔊</button>
  </div>

  <!-- ===================== start ===================== -->
  <section id="start">
    <div class="langs" id="langs"></div>
    <div class="modes" id="modes"></div>
    <div class="hero">
      <div class="rankrow">
        <div class="rankicon" id="rIcon">🌱</div>
        <div style="flex:1">
          <div class="rankname"><span id="rName"></span> · <span id="rLv"></span></div>
          <div class="ranksub" id="rNext"></div>
        </div>
      </div>
      <div class="xpbar"><div class="xpfill" id="rXp"></div></div>
      <div class="stats">
        <div class="stat"><b id="sMast">0</b><span id="tMast"></span></div>
        <div class="stat"><b id="sBest">0</b><span id="tBest"></span></div>
        <div class="stat"><b id="sDays">0</b><span id="tDays"></span></div>
      </div>
    </div>
    <div class="label" id="tPick"></div>
    <div class="chs" id="chs"></div>
    <button class="chip star" id="starBtn"></button>
    <div class="label" id="tLen"></div>
    <div class="lens" id="lens"></div>
    <button class="go" id="go"></button>
    <p class="note" id="tNote"></p>
  </section>

  <!-- ===================== play ===================== -->
  <section id="play" class="hidden">
    <div class="hud">
      <button class="iconbtn" id="quit" aria-label="menu">✕</button>
      <div class="prog"><i id="progFill"></i></div>
      <div class="count" id="count"></div>
      <div class="combo" id="combo"><span class="flame">🔥</span><span id="comboN">0</span></div>
      <div class="score" id="score">0</div>
    </div>
    <div class="qcard" id="qcard">
      <div class="ask">밑줄 친 부분과 바꿔 쓸 수 있는 말을 고르세요. · <span id="tAsk"></span></div>
      <div class="sent" id="sent" lang="ko"></div>
      <div class="bank hidden" id="bank"></div>
      <div class="gram hidden" id="gram"></div>
      <div class="built hidden" id="built"></div>
      <div class="tiles hidden" id="tiles"></div>
      <div class="opts" id="opts"></div>
      <div class="fb hidden" id="fb"></div>
    </div>
  </section>

  <!-- ===================== end ===================== -->
  <section id="end" class="hidden end"></section>
</div>

<script>
const DATA = {"chapters":[{"id":"ch1","title":"1과","theme":"비디오: 낮 플레이드"},{"id":"ch2","title":"2과","theme":"비디오: 낮 플레이드"},{"id":"ch3","title":"3과","theme":"비디오: 낮 플레이드"},{"id":"ch4","title":"4과","theme":"비디오: 낮 플레이드"},{"id":"ch5","title":"5과","theme":"성격"},{"id":"ch6","title":"6과","theme":"저출산"},{"id":"ch7","title":"7과","theme":"호칭"},{"id":"ch8","title":"8과","theme":"씨름 그림"}],"items":[{"id":"b001","ch":"ch1","kr":"기왕","s":"[[이미 정해진 일이니]] 가는 김에 좋은 호텔에서 자고 싶어요.","a":"기왕","w":["곧잘","괜히","자꾸"],"en":"Since we are going anyway, I want to sleep in a nice hotel.","tr":{"en":"anyway; since things are already this way"},"st":1},{"id":"b002","ch":"ch1","kr":"적금","s":"저는 매달 월급의 절반을 [[일정한 기간 동안 은행에 조금씩 모으는 저축]]에 넣어요.","a":"적금","w":["주간지","손주","일자리"],"en":"Every month I put half of my salary into an installment savings account.","tr":{"en":"installment savings (account)"}},{"id":"b003","ch":"ch1","kr":"빡빡하다","s":"이번 주는 일정이 [[여유 없이 꽉 차 있어서]] 약속을 잡기 어려워요.","a":"빡빡해서","w":["격렬해서","열악해서","한가해서"],"en":"My schedule is tight this week, so it is hard to make plans.","tr":{"en":"to be packed / tight (e.g. a schedule)"},"st":1},{"id":"b004","ch":"ch1","kr":"주간지","s":"저는 매주 서점에서 [[7일마다 한 번씩 나오는 잡지]]도 사서 읽어요.","a":"주간지","w":["손주","일자리","말솜씨"],"en":"Every week I also buy and read a weekly magazine at the bookstore.","tr":{"en":"weekly magazine"}},{"id":"b005","ch":"ch1","kr":"곧잘","s":"아이가 한국어를 배운 지 한 달밖에 안 됐는데 [[기대보다 훨씬 능숙하게]] 말해요.","a":"곧잘","w":["기왕","괜히","마침"],"en":"The child has only studied Korean for a month, but speaks it quite well.","tr":{"en":"quite well; readily; fairly often"},"st":1},{"id":"b006","ch":"ch1","kr":"과음하다","s":"어제 회식에서 [[술을 너무 많이 마셔서]] 오늘 머리가 아파요.","a":"과음해서","w":["출연해서","홍보해서","선호해서"],"en":"I drank too much at the company dinner yesterday, so my head hurts today.","tr":{"en":"to drink too much (alcohol)"},"st":1},{"id":"b007","ch":"ch1","kr":"접대","s":"저희 부서는 [[손님을 맞아 음식과 술을 대접하는 일]]도 많아서 힘들어요.","a":"접대","w":["달리기","방귀","말다툼"],"en":"Our department also has a lot of cl  the most common, at 50%."},{"id":"bg-b331#1","g":"bg-b331","p":"한식이 가장 많다 + 중식과 일식이 뒤를 잇다","a":"한식이 가장 많았고 그 다음으로는 중식, 일식의 순이었습니다.","t":["일식이","순이었고","순이에요"],"en":"Korean food was the most common, followed by Chinese and Japanese."},{"id":"bg-b331#2","g":"bg-b331","p":"1위는 봄이다 + 가을과 여름이 뒤를 잇다","a":"1위는 봄이었고 그 다음으로는 가을, 여름의 순이었습니다.","t":["여름이","봄이였고","순이였습니다"],"en":"Spring was first, followed by autumn and summer."},{"id":"bg-b331#3","g":"bg-b331","p":"다음 순서: 걷기, 수영, 자전거","a":"그 다음으로는 걷기, 수영, 자전거의 순이었습니다.","t":["자전거를","순이었다는","순이야"],"en":"Next came walking, swimming and cycling, in that order."},{"id":"bg-b331#4","g":"bg-b331","p":"다음 순서: 지하철, 버스, 택시","a":"그 다음으로는 지하철, 버스, 택시의 순이었습니다.","t":["택시가","택시에","순이었는데"],"en":"Next came the subway, the bus and the taxi, in that order."},{"id":"bg-b331#5","g":"bg-b331","p":"다음 순서: 취업, 건강, 인간관계","a":"그 다음으로는 취업, 건강, 인간관계의 순이었습니다.","t":["인간관계가","인간관계를","순이였습니다"],"en":"Next came getting a job, health and relationships, in that order."},{"id":"bg-b331#6","g":"bg-b331","p":"다음 순서: 영어, 중국어, 일본어","a":"그 다음으로는 영어, 중국어, 일본어의 순이었습니다.","t":["일본어가","일본어는","순이어서"],"en":"Next came English, Chinese and Japanese, in that order."},{"id":"bg-b331#7","g":"bg-b331","p":"커피가 가장 많다 + 녹차와 홍차가 뒤를 잇다","a":"커피가 가장 많았고 그 다음으로는 녹차, 홍차의 순이었습니다.","t":["홍차가","순이었고","많이"],"en":"Coffee was the most common, followed by green tea and black tea."},{"id":"bg-b331#8","g":"bg-b331","p":"다음 순서: 치킨, 피자, 햄버거","a":"그 다음으로는 치킨, 피자, 햄버거의 순이었습니다.","t":["햄버거가","햄버거를","순이었습니까"],"en":"Next came chicken, pizza and hamburgers, in that order."},{"id":"bg-b332#1","g":"bg-b332","p":"기타 의견 + 교통이 불편하다","a":"그 밖에 교통이 불편하다는 의견도 있었습니다.","t":["불편한다는","불편하는","의견이도"],"en":"Besides that, there was also an opinion that transportation is inconvenient."},{"id":"bg-b332#2","g":"bg-b332","p":"기타 의견 + 운동할 시간이 없다","a":"그 밖에 운동할 시간이 없다는 의견도 있었습니다.","t":["없는다는","없은다는","없다는데"],"en":"Besides that, there was also an opinion that they have no time to exercise."},{"id":"bg-b332#3","g":"bg-b332","p":"기타 function levelOf(xp){ let n = 1, base = 0; while (xp >= base + need(n)) { base += need(n); n++; } return { n, into: xp - base, span: need(n) }; }

function streakDays(){

}

function burst(x, y, n = 40, power = 1){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = (2 + Math.random() * 6) * power;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4 * power, g: .22, life: 60 + Math.random() * 40, age: 0,
      w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: COLORS[i % COLORS.length] }); }

function tick(){
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.age < p.life);
  for (const p of parts) { p.age++; p.vy += p.g; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    cx.save(); cx.globalAlpha = Math.max(0, 1 - p.age / p.life); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); }

let R = null;
function adverbSets(qs){
  // one sentence per adverb (its least-known one), then greedy sets of 5 without clashes
  const best = new Map();
  for (const q of qs) { const b = best.get(q.kr); if (!b || (P.mast[q.id] || 0) < (P.mast[b.id] || 0) || ((P.mast[q.id] || 0) === (P.mast[b.id] || 0) && Math.random() < .5)) best.set(q.kr, q); }
  let left = shuffle([...best.values()]).sort((a, b) => (P.mast[a.id] || 0) - (P.mast[b.id] || 0));
  const clash = (a, b) => a.adv.clash.includes(b.kr) || b.adv.clash.includes(a.kr);
  const out = [];
  while (left.length) {
    const set = [left.shift()];
    for (let i = 0; i < left.length && set.length < 5; ) { if (set.every(x => !clash(x, left[i]))) set.push(left.splice(i, 1)[0]); else i++; }
    // a set of 1-2 needs fillers so the box still offers a choice
    if (set.length < 4) for (const a of shuffle(ADV.slice())) { if (set.length >= 4) break; if (!set.some(x => x.kr === a.kr) && set.every(x => !a.clash.includes(x.kr) && !x.adv.clash.includes(a.kr))) set.push({ kr: a.kr, adv: a, filler: true }); }
    const bank = shuffle(set.map(x => x.kr));
    for (const q of shuffle(set.filter(x => !x.filler))) out.push(Object.assign({}, q, { bank }));
  }
  return out;
}
function pickRound(onlyIds){

    const pool = onlyIds ? AQ.filter(q => onlyIds.includes(q.id)) : poolNow();
    const sets = adverbSets(pool);
    return onlyIds ? sets : sets.slice(0, Math.max(5, Math.ceil(roundLen / 5) * 5));
  }
  const src = mode === "w" ? DATA.items : DATA.gitems;   // adverb replays are handled above
  let pool = onlyIds ? src.filter(x => onlyIds.includes(x.id)) : poolNow();
  // least-known first, a little shuffled so rounds differ
  pool = shuffle(pool.slice()).sort((a, b) => ((P.mast[a.id] || 0) - (P.mast[b.id] || 0)) + (Math.random() - .5) * .9);
  return pool.slice(0, onlyIds ? pool.length : roundLen);
}

// ---------- end ----------
function endRound(){
  const today = new Date().toISOString().slice(0, 10);
  if (!P.days.includes(today)) P.days.push(today); P.days = P.days.slice(-60);
  P.best = Math.max(P.best, R.best); P.rounds++;
  const perfect = R.firstTry === R.total;
  if (perfect) { P.xp += 50; }
  save();
  const L0 = levelOf(R.xp0), L1 = levelOf(P.xp), up = L1.n > L0.n, Rk = rankOf(L1.n);
  const acc = Math.round(100 * R.firstTry / R.total);
  const icon = perfect ? "🏆" : acc >= 80 ? "🎉" : acc >= 50 ? "💪" : "🌱";
  const head = perfect ? T("perfect") : acc >= 80 ? T("great") : acc >= 50 ? T("good") : T("keep");
  $("#play").classList.add("hidden");
  const end = $("#end"); end.classList.remove("hidden");
  end.innerHTML = `<div class="big">${icon}</div><h2>${esc(head)}</h2>
    <div class="sub">${R.firstTry} / ${R.total} ${esc(T("firstTry"))}${perfect ? " · +50 XP ✨" : ""}</div>
    <div class="endstats">
      <div class="stat"><b>${R.score}</b><span>XP</span></div>
      <div class="stat"><b>${acc}%</b><span>${esc(T("acc"))}</span></div>
      <div class="stat"><b>${R.best}</b><span>${esc(T("bestCombo"))}</span></div>
    </div>
    <div class="hero" style="text-align:left;margin:0">
      <div class="rankrow"><div class="rankicon">${Rk[0]}</div><div style="flex:1"><div class="rankname">${esc(Rk[1])} · Lv ${L1.n}</div>
      <div class="ranksub">${esc(T("toNext").replace("{n}", L1.span - L1.into))}</div></div></div>
      <div class="xpbar"><div class="xpfill" id="endXp" style="width:${up ? 0 : 100 * L0.into / L0.span}%"></div></div>
    </div>
    ${up ? `<div class="lvup">⬆ LEVEL UP! Lv ${L1.n}</div>` : ""}
    ${R.missed.length ? `<div class="missed"><h3>${esc(T("missed"))}</h3>${R.missed.map(m => m.adv ? `<div class="mrow"><b lang="ko">${esc(m.kr)}</b> — <span>${esc((m.adv.tr && (m.adv.tr[lang] || m.adv.tr.en)) || m.adv.en || "")}</span></div>` : m.g ? `<div class="mrow"><span class="gram" style="font-size:12px;margin:0 0 4px">${esc(GP[m.g].title)}</span><div lang="ko">${esc(m.a)}</div></div>` : `<div class="mrow"><b lang="ko">${esc(m.kr)}</b> — <span lang="${lang}">${esc((m.tr && (m.tr[lang] || m.tr.en)) || "")}</span></div>`).join("")}</div>` : ""}
    <div class="btnrow">
      ${R.missed.length ? `<button class="go" id="again" style="margin-top:0">${esc(T("again"))} (${R.missed.length})</button>` : ""}
      <button class="${R.missed.length ? "ghost" : "go"}" id="newr" ${R.missed.length ? "" : 'style="margin-top:0"'}>${esc(T("newRound"))}</button>
      <button class="ghost" id="menu">${esc(T("menu"))}</button>
    </div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => { $("#endXp").style.width = (100 * L1.into / L1.span) + "%"; }));
  const missedIds = R.missed.map(m => m.id);
  if ($("#again")) $("#again").onclick = () => startRound(missedIds);
  $("#newr").onclick = () => startRound();
  $("#menu").onclick = () => { end.classList.add("hidden"); $("#start").classList.remove("hidden"); renderStart(); };
  setTimeout(() => {
    if (perfect || up) { sndLevel(); buzz([40, 50, 40, 50, 80]);
      for (let k = 0; k < 5; k++) setTimeout(() => burst(innerWidth * (.2 + Math.random() * .6), innerHeight * (.2 + Math.random() * .3), 70, 1.4), k * 260); }
    else if (acc >= 50) { sndMilestone(); burst(innerWidth / 2, innerHeight * .25, 60, 1.2); }
  }, 250);
}

$("#go").onclick = () => startRound();
renderStart();
</script>
</body>
</html>
