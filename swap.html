<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Korean 5B — 바꿔 쓰기</title>
<meta name="description" content="Sogang Korean 5B: pick the word that can replace the underlined part. Combos, levels and a little celebration for every right answer.">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="swap.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="5B 바꿔 쓰기">
<link rel="apple-touch-icon" href="icon-swap-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%81%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:#1c2740; --card2:#223052;
    --line:#2c3a5a; --txt:#eaf0fb; --dim:#96a3c2; --accent:#5b8cff;
    --gold:#ffcf5c; --good:#37d18f; --bad:#ff6b7a; --fire:#ff8a3d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",
      "Microsoft YaHei","PingFang SC","Leelawadee UI","Noto Sans Thai",Tahoma,Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -200px,#1b2747,transparent),linear-gradient(180deg,#0f1420,#0b0f18);
    color:var(--txt);min-height:100%;overflow-x:hidden}
  [lang="zh"]{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
  [lang="zht"]{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
  [lang="th"]{font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif}
  .wrap{max-width:620px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:var(--accent)}
  .hidden{display:none!important}

  /* ---------- top bar ---------- */
  .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .top .home{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--dim);text-decoration:none;font-size:14px}
  .top h1{font-size:19px;margin:0;flex:1;letter-spacing:.2px}
  .iconbtn{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:16px}
  .langs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
  .chip{background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 12px;font-size:14px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---------- start ---------- */
  .hero{background:linear-gradient(135deg,#23315a,#1a2440);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .rankrow{display:flex;align-items:center;gap:12px}
  .rankicon{font-size:42px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
  .rankname{font-size:18px;font-weight:700}
  .ranksub{color:var(--dim);font-size:13px;margin-top:2px}
  .xpbar{height:12px;background:#0d1322;border-radius:999px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
  .xpfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#9b7bff,var(--gold));border-radius:999px;transition:width .9s cubic-bezier(.2,.9,.2,1)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:rgba(0,0,0,.18);border-radius:12px;padding:8px;text-align:center}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--dim)}
  .label{font-size:13px;color:var(--dim);margin:14px 0 6px;letter-spacing:.3px}
  .chs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .chs>*{min-width:0}
  .chbtn{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;font-size:15px}
  .chbtn small{display:block;color:var(--dim);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chbtn.on{background:var(--card2);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .chbtn .bar{height:4px;border-radius:4px;background:#0d1322;margin-top:6px;overflow:hidden}
  .chbtn .bar i{display:block;height:100%;background:var(--good)}
  .chip.star{display:block;width:100%;margin-top:8px;padding:10px;font-size:15px;text-align:center}
  .chip.star.on{background:linear-gradient(135deg,#ffcf5c,#ff8a3d);border-color:#ffcf5c;color:#0f1420;font-weight:800}
  .qstar{color:var(--gold);font-weight:800;margin-right:4px}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
  .bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:2px 0 12px;padding:12px;border:2px solid var(--txt);border-radius:6px;background:rgba(255,255,255,.03)}
  .bw{padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font-size:18px;font-weight:700;position:relative}
  .bw.done::after{content:"✓";position:absolute;top:-7px;right:-6px;font-size:12px;background:var(--good);color:#0f1420;border-radius:50%;width:17px;height:17px;display:grid;place-items:center}
  .bw.right{background:linear-gradient(135deg,rgba(55,209,143,.35),rgba(55,209,143,.15));border-color:var(--good);animation:yay .5s cubic-bezier(.2,1.6,.4,1)}
  .bw.wrongpick{background:rgba(255,107,122,.18);border-color:var(--bad);animation:shake .4s}
  .blank{display:inline-block;min-width:76px;border-bottom:2.5px solid var(--gold);margin:0 3px;text-align:center;color:transparent}
  .mode{padding:10px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);font-weight:800;font-size:15px}
  .mode small{display:block;font-weight:500;color:var(--dim);font-size:12px;margin-top:2px}
  .mode.on{border-color:var(--accent);background:linear-gradient(135deg,rgba(91,140,255,.25),rgba(155,123,255,.18))}
  .gram{display:inline-block;margin:2px 0 10px;padding:5px 12px;border-radius:999px;background:linear-gradient(135deg,#ffcf5c,#ff8a3d);color:#0f1420;font-weight:900;font-size:16px}
  .built{min-height:58px;margin-top:12px;padding:10px;border-radius:14px;border:1.5px dashed var(--line);background:rgba(0,0,0,.18);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .built.good{border-color:var(--good);border-style:solid;background:rgba(55,209,143,.12)}
  .built.bad{border-color:var(--bad);border-style:solid;animation:shake .4s}
  .built:empty::before{content:attr(data-ph);color:var(--dim);font-size:14px}
  .tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tile{padding:10px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font-size:18px;transition:transform .08s,opacity .2s}
  .tile:active{transform:scale(.95)}
  .tile.used{opacity:.18;pointer-events:none}
  .built .tile{background:#2a3a63;border-color:#4a64a8;animation:popin .25s cubic-bezier(.2,1.6,.4,1)}
  .fixline{margin-top:6px;font-size:17px;line-height:1.6}
  .fixline .ok{color:var(--good);font-weight:800}
  .lens{display:flex;gap:8px}
  .lens .chip{flex:1;text-align:center;padding:9px}
  .go{display:block;width:100%;margin-top:18px;padding:16px;border:0;border-radius:16px;font-size:19px;font-weight:800;color:#fff;
      background:linear-gradient(135deg,#5b8cff,#8a6bff);box-shadow:0 10px 26px rgba(91,140,255,.35);transition:transform .1s}
  .go:active{transform:scale(.98)}
  .go:disabled{opacity:.45}

  /* ---------- play ---------- */
  .hud{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .prog{flex:1;height:10px;background:#0d1322;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),#7af0c0);transition:width .35s}
  .count{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
  .combo{display:flex;align-items:center;gap:4px;font-weight:800;font-size:16px;color:var(--fire);min-width:58px;justify-content:flex-end;transition:transform .15s}
  .combo .flame{display:inline-block;transform-origin:50% 90%}
  .combo.hot .flame{animation:flick .5s infinite alternate}
  @keyframes flick{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.18) rotate(4deg)}}
  .combo.bump{transform:scale(1.35)}
  .score{font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);min-width:52px;text-align:right}
  .qcard{position:relative;background:linear-gradient(160deg,#1f2b48,#18213a);border:1px solid var(--line);border-radius:20px;padding:18px 16px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .ask{font-size:12.5px;color:var(--dim);margin-bottom:10px}
  .sent{font-size:21px;line-height:1.75;word-break:keep-all}
  .ul{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--gold);background:rgba(255,207,92,.10);border-radius:6px;padding:0 3px}
  .ans{color:#0f1420;background:linear-gradient(135deg,#6ff2b5,#37d18f);border-radius:8px;padding:1px 7px;font-weight:800;display:inline-block;animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
  .ans.miss{background:linear-gradient(135deg,#ffd27a,#ffb15c)}
  @keyframes popin{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  .opts{display:grid;gap:10px;margin-top:14px}
  .opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:16px;padding:14px 14px;font-size:19px;transition:transform .08s,background .2s,border-color .2s}
  .opt:active{transform:scale(.985)}
  .opt .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#0d1322;color:var(--dim);font-size:14px;font-weight:700}
  .opt.right{background:linear-gradient(135deg,rgba(55,209,143,.28),rgba(55,209,143,.12));border-color:var(--good);animation:yay .5s cubic-bezier(.2,1.6,.4,1)}
  .opt.right .n{background:var(--good);color:#0f1420}
  .opt.wrongpick{background:rgba(255,107,122,.16);border-color:var(--bad);animation:shake .4s}
  .opt.wrongpick .n{background:var(--bad);color:#0f1420}
  .opt.dim{opacity:.45}
  @keyframes yay{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  .fb{margin-top:12px;border-radius:16px;padding:12px 14px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
  .fb .head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
  .fb.good .head{color:var(--good)} .fb.bad .head{color:var(--warn,#ffb15c)}
  .fb .word{margin-top:6px;font-size:16px}
  .fb .word b{font-size:18px}
  .fb .en{margin-top:6px;color:var(--dim);font-size:14.5px;line-height:1.45}
  .next{display:block;width:100%;margin-top:12px;padding:13px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-weight:800;font-size:17px;position:relative;overflow:hidden}
  .next i{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.65);width:0}
  .float{position:fixed;pointer-events:none;font-weight:900;font-size:24px;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.6);z-index:30;animation:rise 1s ease-out forwards}
  @keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
  .banner{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);z-index:31;pointer-events:none;font-size:34px;font-weight:900;text-align:center;
          background:linear-gradient(135deg,#ffcf5c,#ff8a3d,#ff5c8a);-webkit-background-clip:text;background-clip:text;color:transparent;
          filter:drop-shadow(0 6px 18px rgba(255,138,61,.45));animation:bannerin 1.3s cubic-bezier(.2,1.4,.4,1) forwards;white-space:nowrap}
  @keyframes bannerin{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(2deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-70%) scale(.9);opacity:0}}
  .flash{position:fixed;inset:0;pointer-events:none;z-index:25;background:radial-gradient(circle at 50% 60%,rgba(55,209,143,.22),transparent 60%);animation:fl .5s ease-out forwards}
  .flash.bad{background:radial-gradient(circle at 50% 60%,rgba(255,107,122,.18),transparent 60%)}
  @keyframes fl{from{opacity:1}to{opacity:0}}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:29}

  /* ---------- end ---------- */
  .end{text-align:center}
  .end .big{font-size:56px;margin:6px 0 0}
  .end h2{margin:4px 0 2px;font-size:24px}
  .end .sub{color:var(--dim);font-size:14px}
  .endstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .lvup{margin:10px auto 0;font-weight:900;font-size:20px;color:var(--gold);animation:popin .6s cubic-bezier(.2,1.6,.4,1)}
  .missed{text-align:left;margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
  .missed h3{margin:4px 0 8px;font-size:15px;color:var(--dim);font-weight:600}
  .mrow{padding:7px 0;border-top:1px solid var(--line);font-size:15px}
  .mrow:first-of-type{border-top:0}
  .mrow b{font-size:17px}
  .btnrow{display:grid;gap:10px;margin-top:14px}
  .ghost{padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);font-weight:700;font-size:16px}
  .note{color:var(--dim);font-size:12px;margin-top:16px;text-align:center;line-height:1.5}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <a class="home" href="index.html">← 5B</a>
    <h1>🔁 바꿔 쓰기 <span style="color:var(--dim);font-weight:500;font-size:14px">· Word Swap</span></h1>
    <button class="iconbtn" id="mute" aria-label="sound">🔊</button>
  </div>

  <!-- ===================== start ===================== -->
  <section id="start">
    <div class="langs" id="langs"></div>
    <div class="modes" id="modes"></div>
    <div class="hero">
      <div class="rankrow">
        <div class="rankicon" id="rIcon">🌱</div>
        <div style="flex:1">
          <div class="rankname"><span id="rName"></span> · <span id="rLv"></span></div>
          <div class="ranksub" id="rNext"></div>
        </div>
      </div>
      <div class="xpbar"><div class="xpfill" id="rXp"></div></div>
      <div class="stats">
        <div class="stat"><b id="sMast">0</b><span id="tMast"></span></div>
        <div class="stat"><b id="sBest">0</b><span id="tBest"></span></div>
        <div class="stat"><b id="sDays">0</b><span id="tDays"></span></div>
      </div>
    </div>
    <div class="label" id="tPick"></div>
    <div class="chs" id="chs"></div>
    <button class="chip star" id="starBtn"></button>
    <div class="label" id="tLen"></div>
    <div class="lens" id="lens"></div>
    <button class="go" id="go"></button>
    <p class="note" id="tNote"></p>
  </section>

  <!-- ===================== play ===================== -->
  <section id="play" class="hidden">
    <div class="hud">
      <button class="iconbtn" id="quit" aria-label="menu">✕</button>
      <div class="prog"><i id="progFill"></i></div>
      <div class="count" id="count"></div>
      <div class="combo" id="combo"><span class="flame">🔥</span><span id="comboN">0</span></div>
      <div class="score" id="score">0</div>
    </div>
    <div class="qcard" id="qcard">
      <div class="ask">밑줄 친 부분과 바꿔 쓸 수 있는 말을 고르세요. · <span id="tAsk"></span></div>
      <div class="sent" id="sent" lang="ko"></div>
      <div class="bank hidden" id="bank"></div>
      <div class="gram hidden" id="gram"></div>
      <div class="built hidden" id="built"></div>
      <div class="tiles hidden" id="tiles"></div>
      <div class="opts" id="opts"></div>
      <div class="fb hidden" id="fb"></div>
    </div>
  </section>

  <!-- ===================== end ===================== -->
  <section id="end" class="hidden end"></section>
</div>

r is warm, I feel good."},{"id":"g1-2#8","g":"g1-2","p":"영화가 재미있다 + 사람이 많다","a":"영화가 재미있어서 그런지 사람이 많아요","t":["재미있으니까","재미있고","그렇지"],"en":"Maybe because the film is fun, there are many people."},{"id":"g1-3#1","g":"g1-3","p":"한국어를 공부하다 + 재미있다","a":"한국어는 공부할수록 재미있어요","t":["공부하수록","공부했을수록","공부하면"],"en":"The more I study Korean, the more fun it is."},{"id":"g1-3#2","g":"g1-3","p":"이 노래를 듣다 + 좋아지다","a":"이 노래는 들을수록 좋아져요","t":["듣을수록","들수록","들었을수록"],"en":"The more I listen to this song, the more I like it."},{"id":"g1-3#3","g":"g1-3","p":"이 영화를 보다 + 더 좋아지다","a":"이 영화는 볼수록 더 좋아져요","t":["보수록","봤을수록","보을수록"],"en":"The more I watch this film, the more I like it."},{"id":"g1-3#4","g":"g1-3","p":"값이 싸다 + 더 많이 팔리다","a":"값이 쌀수록 더 많이 팔려요","t":["싸을수록","쌌을수록","싸면수록"],"en":"The cheaper the price, the more it sells."},{"id":"g1-3#5","g":"g1-3","p":"나이가 들다 + 시간이 빨리 가다","a":"나이가 들수록 시간이 빨리 가요","t":["드을수록","들었을수록","든수록"],"en":"The older I get, the faster time passes."},{"id":"g1-3#6","g":"g1-3","p":"친구를 만나다 + 더 친해지다","a":"친구는 만날수록 더 친해져요","t":["만나을수록","만났을수록","만나수록"],"en":"The more I meet a friend, the closer we get."},{"id":"g1-3#7","g":"g1-3","p":"이 과자를 먹다 + 더 먹고 싶다","a":"이 과자는 먹을수록 더 먹고 싶어요","t":["먹수록","먹었을수록","먹면수록"],"en":"The more I eat these snacks, the more I want to eat."},{"id":"g1-3#8","g":"g1-3","p":"산을 오르다 + 더 춥다","a":"산은 오를수록 더 추워요","t":["오르을수록","올랐을수록","오르수록"],"en":"The higher you climb the mountain, the colder it gets."},{"id":"g1-4#1","g":"g1-4","p":"집에서 쉬다 + 친구를 만나고 싶다","a":"집에서 쉬기보다 친구를 만나고 싶어요","t":["쉬는보다","쉬었기보다","쉬고보다"],"en":"Rather than resting at home, I want to meet a friend."},{"id":"g1-4#2","g":"g1-4","p":"택시를 타다 + 지하철이 더 빠르다","a":"택시를 타기보다 지하철이 더 빨라요","t":["타는보다","탔기보다","타고보다"],"en":"Rather than taking a taxi, the subway is faster."},{"id":"g1-4#3","g":"g1-4","p":"말로 설명하다 + 그림이 더 쉽다","a":"말로 설명하기보다 그림이 더 쉬워요","t":["설명하는보다","설명했기보다","설명하고보다"],"en":"Rather than explaining in words, a picture is easier."},{"id":"g1-4#4","g":"g1-4","p":"걱정하다 + 먼저 해 보다","a":"걱정하기보다 먼저 해 보세요","t":["걱정하는보다","걱정했기보다","걱정하고보다"],"en":"Rather than worrying, try it first."},{"id":"g1-4#5","g":"g1-4","p":"비싼 옷을 사다 + 편한 옷이 좋다","a":"비싼 옷을 사기보다 편한 옷이 좋아요","t":["사는보다","샀기보다","사고보다"],"en":"Rather than buying expensive clothes, comfortable clothes are better."},{"id":"g1-4#6","g":"g1-4","p":"영화관에서 보다 + 집에서 보는 편이다","a":"영화관에서 보기보다 집에서 보는 편이에요","t":["보는보다","봤기보다","보고보다"],"en":"I tend to watch at home rather than at the cinema."},{"id":"g1-4#7","g":"g1-4","p":"사진만 찍다 + 경치를 즐기고 싶다","a":"사진만 찍기보다 경치를 즐기고 싶어요","t":["찍는보다","찍었기보다","찍고보다"],"en":"Rather than just taking photos, I want to enjoy the view."},{"id":"g1-4#8","g":"g1-4","p":"혼자 고민하다 + 친구에게 물어보다","a":"혼자 고민하기보다 친구에게 물어보세요","t":["고민하는보다","고민했기보다","고민하고보다"],"en":"Rather than worrying alone, ask a friend."},{"id":"g1-5#1","g":"g1-5","p":"한국에 살다 + 한국어를 배워야 하다","a":"한국에 사는 이상 한국어를 배워야 해요","t":["살는","살은","살아"],"en":"As long as you live in Korea, you have to learn Korean."},{"id":"g1-5#2","g":"g1-5","p":"약속하다 + 꼭 지키다","a":"약속한 이상 꼭 지켜야 해요","t":["약속할","약속했는","약속하은"],"en":"Since you promised, you must keep it."},{"id":"g1-5#3","g":"g1-5","p":"가수가 되다 + 연습하다","a":"가수가 된 이상 연습해야 해요","t":["되은","됐는","될"],"en":"Now that you've become a singer, you must practise."},{"id":"g1-5#4","g":"g1-5","p":"학생이다 + 규칙을 지키다","a":"학생인 이상 규칙을 지켜야 해요","t":["학생은","학생이는","학생인데"],"en":"As long as you're a student, you must follow the rules."},{"id":"g1-5#5","g":"g1-5","p":"몸이 아프다 + 오늘은 쉬다","a":"몸이 아픈 이상 오늘은 쉬어야 해요","t":["아프는","아프은","아팠는"],"en":"Since you're sick, you should rest today."},{"id":"g1-5#6","g":"g1-5","p":"표를 사다 + 영화를 보러 가다","a":"표를 산 이상 영화를 보러 가야죠","t":["사은","샀는","살"],"en":"Since I bought the ticket, I have to go see the film."},{"id":"g1-5#7","g":"g1-5","p":"회사에 들어가다 + 열심히 일하다","a":"회사에 들어간 이상 열심히 일해야 해요","t":["들어가은","들어갔는","들어갈"],"en":"Now that you've joined the company, you must work hard."},{"id":"g1-5#8","g":"g1-5","p":"이 일을 맡다 + 책임지다","a":"이 일을 맡은 이상 책임져야 해요","t":["맡은데","맡았는","맡을"],"en":"Since you took on this job, you must take responsibility."},{"id":"g2-1#1","g":"g2-1","p":"착한 사람 + 거짓말을 하다","a":"착한 사람이 거짓말을 할 리가 없어요","t":["하는","한","하을"],"en":"There's no way a kind person would lie."},{"id":"g2-1#2","g":"g2-1","p":"열심히 연습했다 + 실패하다","a":"열심히 연습했는데 실패할 리가 없어요","t":["실패하는","실패한","실패하을"],"en":"I practised hard, so there's no way I'll fail."},{"id":"g2-1#3","g":"g2-1","p":"저 아이 + 범인이다","a":"저 아이가 범인일 리가 없어요","t":["범인인","범인은","범인이을"],"en":"There's no way that child is the culprit."},{"id":"g2-1#4","g":"g2-1","p":"방금 먹었다 + 배가 고프다","a":"방금 먹었는데 배가 고플 리가 없어요","t":["고픈","고프는","고프을"],"en":"I just ate, so there's no way I'm hungry."},{"id":"g2-1#5","g":"g2-1","p":"비싼 가방 + 가짜이다","a":"비싼 가방이 가짜일 리가 없어요","t":["가짜인","가짜은","가짜이을"],"en":"There's no way an expensive bag is fake."},{"id":"g2-1#6","g":"g2-1","p":"공부를 잘하다 + 시험에 떨어지다","a":"공부를 잘하니까 시험에 떨어질 리가 없어요","t":["떨어지는","떨어진","떨어지을"],"en":"He studies well, so there's no way he'll fail the exam."},{"id":"g2-1#7","g":"g2-1","p":"엄마 + 나를 미워하다","a":"엄마가 나를 미워할 리가 없어요","t":["미워하는","미워한","미워하을"],"en":"There's no way Mom would hate me."},{"id":"g2-1#8","g":"g2-1","p":"새 차 + 벌써 고장 나다","a":"새 차가 벌써 고장 날 리가 없어요","t":["나는","난","나을"],"en":"There's no way a new car breaks down already."},{"id":"g2-2#1","g":"g2-2","p":"길이 막히다 + 약속에 늦다","a":"길이 막히는 바람에 약속에 늦었어요","t":["막힌","막혔는","막히을"],"en":"The road was jammed, so I was late for the appointment."},{"id":"g2-2#2","g":"g2-2","p":"비가 오다 + 소풍을 못 가다","a":"비가 오는 바람에 소풍을 못 갔어요","t":["온","왔는","오을"],"en":"It rained, so we couldn't go on the picnic."},{"id":"g2-2#3","g":"g2-2","p":"휴대폰이 꺼지다 + 전화를 못 받다","a":"휴대폰이 꺼지는 바람에 전화를 못 받았어요","t":["꺼진","꺼졌는","꺼지을"],"en":"My phone turned off, so I couldn't answer the call."},{"id":"g2-2#4","g":"g2-2","p":"동생이 떠들다 + 잠에서 깨다","a":"동생이 떠드는 바람에 잠에서 깼어요","t":["떠든","떠들는","떠들을"],"en":"My brother made noise, so I woke up."},{"id":"g2-2#5","g":"g2-2","p":"정전이 되다 + 영화를 못 보다","a":"정전이 되는 바람에 영화를 못 봤어요","t":["된","됐는","되을"],"en":"There was a power outage, so I couldn't watch the film."},{"id":"g2-2#6 ","t":["자은","잘","말는"],"en":"It was the night before the exam, so I hardly slept."},{"id":"g2-4#4","g":"g2-4","p":"바쁘다 + 청소를 하다","a":"바빠서 청소를 하는 둥 마는 둥 했어요","t":["하은","할","말는"],"en":"I was busy, so I half-cleaned."},{"id":"g2-4#5","g":"g2-4","p":"영화를 보다 + 나가다","a":"영화를 보는 둥 마는 둥 하고 나갔어요","t":["보은","볼","말는"],"en":"I half-watched the film and went out."},{"id":"g2-4#6","g":"g2-4","p":"인사를 하다 + 지나가다","a":"인사를 하는 둥 마는 둥 하고 지나갔어요","t":["하은","할","말는"],"en":"He half-greeted me and passed by."},{"id":"g2-4#7","g":"g2-4","p":"피곤하다 + 저녁을 먹다","a":"피곤해서 저녁을 먹는 둥 마는 둥 했어요","t":["먹은","먹을","말는"],"en":"I was tired, so I barely ate dinner."},{"id":"g2-4#8","g":"g2-4","p":"숙제를 하다 + 놀다","a":"숙제를 하는 둥 마는 둥 하고 놀았어요","t":["하은","할","말는"],"en":"I half-did my homework and played."},{"id":"g2-5#1","g":"g2-5","p":"옛날에 + 착한 아이가 살다","a":"옛날에 착한 아이가 살았답니다","t":["살았는답니다","살답니다","살았답니까"],"en":"Long ago, a kind child lived."},{"id":"g2-5#2","g":"g2-5","p":"흥부는 가난하다 + 마음은 착하다","a":"흥부는 가난하지만 마음은 착하답니다","t":["착한답니다","착하는답니다","착했답니까"],"en":"Heungbu is poor, but his heart is kind."},{"id":"g2-5#3","g":"g2-5","p":"놀부는 욕심이 많다 + 동생을 안 도와주다","a":"놀부는 욕심이 많아서 동생을 안 도와줬답니다","t":["도와줬는답니다","도와주답니다","도와줬답니까"],"en":"Nolbu was greedy, so he didn't help his brother."},{"id":"g2-5#4","g":"g2-5","p":"호랑이가 오다 + 토끼가 도망가다","a":"호랑이가 와서 토끼가 도망갔답니다","t":["도망갔는답니다","도망가답니다","도망갔답니까"],"en":"A tiger came and the rabbit ran away."},{"id":"g2-5#5","g":"g2-5","p":"청개구리는 엄마 말을 안 듣다 + 후회하다","a":"청개구리는 엄마 말을 안 듣다가 후회했답니다","t":["후회했는답니다","후회하답니다","후회했답니까"],"en":"The green frog didn't listen to his mother and regretted it."},{"id":"g2-5#6","g":"g2-5","p":"남매는 + 하늘로 올라가다","a":"남매는 하늘로 올라갔답니다","t":["올라갔는답니다","올라가답니다","올라갔답니까"],"en":"The brother and sister went up to the sky."},{"id":"g2-5#7","g":"g2-5","p":"남매는 하늘에 가다 + 해와 달이 되다","a":"남매는 하늘에 가서 해와 달이 되었답니다","t":["되었는답니다","되답니다","되었답니까"],"en":"The siblings went to the sky and became the sun and the moon."},{"id":"g2-5#8","g":"g2-5","p":"이 연못 + 개구리가 많이 살다","a":"이 연못에는 개구리가 많이 산답니다","t":["사는답니다","살답니다","살았답니까"],"en":"They say many frogs live in this pond."},{"id":"g3-1#1","g":"g3-1","p":"지금 출발하다 + 길이 막히다","a":"지금 출발하면 길이 막힐걸요","t":["막히을걸요","막힐껄요","막히걸요"],"en":"If you leave now, the road will probably be jammed."},{"id":"g3-1#2","g":"g3-1","p":"그 영화 + 벌써 끝났다","a":"그 영화는 벌써 끝났을걸요","t":["끝나을걸요","끝났껄요","끝났걸요"],"en":"That film has probably already ended."},{"id":"g3-1#3","g":"g3-1","p":"선생님은 지금 + 안 계시다","a":"선생님은 지금 안 계실걸요","t":["계시을걸요","계실껄요","계시걸요"],"en":"The teacher is probably not here now."},{"id":"g3-1#4","g":"g3-1","p":"이번 시험은 + 지난번보다 쉽다","a":"이번 시험은 지난번보다 쉬울걸요","t":["쉽을걸요","쉬울껄요","쉽걸요"],"en":"This exam will probably be easier than last time."},{"id":"g3-1#5","g":"g3-1","p":"저 사람은 + 가수이다","a":"저 사람은 아마 가수일걸요","t":["가수이을걸요","가수일껄요","가수이걸요"],"en":"That person is probably a singer."},{"id":"g3-1#6","g":"g3-1","p":"내일은 + 날씨가 춥다","a":"내일은 날씨가 추울걸요","t":["춥을걸요","추울껄요","춥걸요"],"en":"It will probably be cold tomorrow."},{"id":"g3-1#7","g":"g3-1","p":"친구가 + 지금쯤 도착했다","a":"친구가 지금쯤 도착했을걸요","t":["도착하을걸요","도착했껄요","도착했걸요"],"en":"My friend has probably arrived by now."},{"id":"g3-1#8","g":"g3-1","p":"아이에게는 + 그 영화가 무섭다","a":"아이에게는 그 영화가 무서울걸요","t":["무섭을걸요","무서울껄요","무섭걸요"],"en":"That film is probably scary for a child."},{"id":"g3-2#1","g":"g3-2","p":"값이 비싸다 + 좋다","a":"값이 비싸다고 해서 좋은 것은 아니에요","t":["비싼다고","비싸라고","좋는"],"en":"Just because the price is high doesn't mean it's good."},{"id":"g3-2#2","g":"g3-2","p":"오래 살다 + 한국어를 잘하다","a":"오래 산다고 해서 한국어를 잘하는 것은 아니에요","t":["사는다고","살다고","잘하은"],"en":"Living long somewhere doesn't mean you speak the language well."},{"id":"g3-2#3","g":"g3-2","p":"가수이다 + 노래를 잘하다","a":"가수라고 해서 노래를 잘하는 것은 아니에요","t":["가수이라고","가수다고","잘하은"],"en":"Being a singer doesn't mean you sing well."},{"id":"g3-2#4","g":"g3-2","p":"책이 두껍다 + 어렵다","a":"책이 두껍다고 해서 어려운 것은 아니에요","t":["두껍은다고","두꺼운다고","어렵은"],"en":"A thick book isn't necessarily difficult."},{"id":"g3-2#5","g":"g3-2","p":"공부하다 + 성적이 오르다","a":"공부한다고 해서 성적이 오르는 것은 아니에요","t":["공부하는다고","공부한다니","오르은"],"e y hard, but I ran to the end."},{"id":"g4-1#1","g":"g4-1","p":"눈물이 나다 + 슬프다","a":"눈물이 날 정도로 슬퍼요.","t":["난","정도에","정도를"],"en":"It is so sad that I could cry."},{"id":"g4-1#2","g":"g4-1","p":"숨이 막히다 + 덥다","a":"숨이 막힐 정도로 더워요.","t":["막히는","정도에","정도를"],"en":"It is so hot that I can hardly breathe."},{"id":"g4-1#3","g":"g4-1","p":"밤을 새우다 + 공부했다","a":"밤을 새울 정도로 공부했어요.","t":["새운","정도가","새워서"],"en":"I studied so hard that I stayed up all night."},{"id":"g4-1#4","g":"g4-1","p":"믿기 어렵다 + 놀랍다","a":"믿기 어려울 정도로 놀라워요.","t":["어려운","정도에","정도를"],"en":"It is so surprising that it is hard to believe."},{"id":"g4-1#5","g":"g4-1","p":"친구가 못 알아보다 + 살이 빠졌다","a":"친구가 못 알아볼 정도로 살이 빠졌어요.","t":["알아본","정도에","정도를"],"en":"I lost so much weight that my friends could not recognise me."},{"id":"g4-1#6","g":"g4-1","p":"시간이 없다 + 바쁘다","a":"시간이 없을 정도로 바빠요.","t":["없는","정도에","정도를"],"en":"I am so busy that I have no time."},{"id":"g4-1#7","g":"g4-1","p":"걷지 못하다 + 다리가 아프다","a":"걷지 못할 정도로 다리가 아파요.","t":["못한","정도에","정도를"],"en":"My legs hurt so much that I cannot walk."},{"id":"g4-1#8","g":"g4-1","p":"사람들이 놀라다 + 키가 크다","a":"사람들이 놀랄 정도로 키가 커요.","t":["놀란","정도에","놀라서"],"en":"He is so tall that people are amazed."},{"id":"g4-2#1","g":"g4-2","p":"게임을 하다 + 공부는 안 하다","a":"게임을 하기만 하고 공부는 안 해요.","t":["하기가","하지만","하는만"],"en":"He only plays games and does not study."},{"id":"g4-2#2","g":"g4-2","p":"친구는 듣다 + 말은 안 하다","a":"친구는 듣기만 하고 말은 안 해요.","t":["듣기가","듣지만","듣는만"],"en":"My friend only listens and does not speak."},{"id":"g4-2#3","g":"g4-2","p":"이 가방은 예쁘다 + 불편하다","a":"이 가방은 예쁘기만 하고 불편해요.","t":["예쁘지만","예쁘기가","예쁜만"],"en":"This bag is only pretty and not comfortable."},{"id":"g4-2#4","g":"g4-2","p":"하루 종일 자다 + 일어나지 않다","a":"하루 종일 자기만 하고 일어나지 않아요.","t":["자기가","자지만","자는만"],"en":"He only sleeps all day and does not get up."},{"id":"g4-2#5","g":"g4-2","p":"동생은 놀다 + 숙제는 안 하다","a":"동생은 놀기만 하고 숙제는 안 해요.","t":["놀기가","놀지만","노는만"],"en":"My younger brother only plays and does not do his homework."},{"id":"g4-2#6","g":"g4-2","p":"그 사람은 const RANKS = [["🌱","새싹"],["📗","꼬마 학자"],["🧺","단어 수집가"],["🧭","문장 탐험가"],["🥋","바꿔 쓰기 고수"],["🛠️","단어 장인"],["🪄","언어 마법사"],["🎓","국어 박사"],["👑","세종대왕의 제자"]];
const need = n => 60 * n + 15 * n * n;            // XP to go from level n to n+1
function levelOf(xp){ let n = 1, base = 0; while (xp >= base + need(n)) { base += need(n); n++; } return { n, into: xp - base, span: need(n) }; }
const rankOf = n => RANKS[Math.min(RANKS.length - 1, Math.floor((n - 1) / 3))];

function streakDays(){
  const days = new Set(P.days); let n = 0; const d = new Date();
  for (;;) { const k = d.toISOString().slice(0, 10); if (!days.has(k)) { if (n === 0) { d.setDate(d.getDate() - 1); if (days.has(d.toISOString().slice(0,10))) continue; } break; } n++; d.setDate(d.getDate() - 1); }
  return n;
}

// ---------- sound (synth, starts on the first tap) ----------
let AC = null;
const actx = () => (AC = AC || new (window.AudioContext || window.webkitAudioContext)());
function tone(freq, t0, dur, type = "sine", vol = .18){
  if (muted) return;
  try { const a = actx(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq; o.connect(g); g.connect(a.destination);
    const t = a.currentTime + t0; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.start(t); o.stop(t + dur + .02); } catch {}
}
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
const hz = semi => 523.25 * Math.pow(2, semi / 12);
function sndRight(combo){ const s = SCALE[Math.min(SCALE.length - 3, combo)]; tone(hz(s), 0, .18, "triangle", .2); tone(hz(s + 4), .07, .22, "triangle", .17); tone(hz(s + 7), .14, .32, "sine", .15); }
function sndWrong(){ tone(196, 0, .22, "square", .07); tone(155, .1, .3, "square", .06); }
function sndMilestone(){ [0, 4, 7, 12, 16].forEach((s, i) => tone(hz(s + 5), i * .07, .35, "triangle", .16)); }
function sndLevel(){ [0, 4, 7, 12, 7, 12, 16, 19].forEach((s, i) => tone(hz(s), i * .09, .4, i % 2 ? "sine" : "triangle", .17)); }
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

// ---------- confetti ----------
const cv = $("#fx"), cx = cv.getContext("2d"); let parts = [], raf = 0;
function fitCanvas(){ const r = devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r; cx.setTransform(r, 0, 0, r, 0, 0); }
addEventListener("resize", fitCanvas); fitCanvas();
const COLORS = ["#ffcf5c","#37d18f","#5b8cff","#ff8a3d","#ff5c8a","#9b7bff","#7af0c0"];
function burst(x, y, n = 40, power = 1){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = (2 + Math.random() * 6) * power;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4 * power, g: .22, life: 60 + Math.random() * 40, age: 0,
      w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: COLORS[i % COLORS.length] }); }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.age < p.life);
  for (const p of parts) { p.age++; p.vy += p.g; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    cx.save(); cx.globalAlpha = Math.max(0, 1 - p.age / p.life); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
}
function floatText(x, y, txt){ const d = document.createElement("div"); d.className = "float"; d.style.left = x + "px"; d.style.top = y + "px"; d.textContent = txt; document.body.appendChild(d); setTimeout(() => d.remove(), 1000); }
function banner(txt){ const d = document.createElement("div"); d.className = "banner"; d.textContent = txt; document.body.appendChild(d); setTimeout(() => d.remove(), 1300); }

  $("#modes").innerHTML = `<button class="mode${mode === "w" ? " on" : ""}" data-m="w">📝 단어 · ${esc(T("modeW"))}<small>${DATA.items.length}</small></button>`
    + `<button class="mode${mode === "g" ? " on" : ""}" data-m="g">🧩 문법 · ${esc(T("modeG"))}<small>${(DATA.gitems || []).length}</small></button>`
    + (ADV_ALL.length ? `<button class="mode${mode === "a" ? " on" : ""}" data-m="a">🎯 부사 · ${esc(T("modeA"))}<small>${ADV_ALL.length}</small></button>` : "")
    + (ONO.length ? `<button class="mode${mode === "o" ? " on" : ""}" data-m="o">🔊 의성어·의태어 · ${esc(T("modeO"))}<small>${ONO.length}</small></button>` : "");
  const L = levelOf(P.xp), Rk = rankOf(L.n);
  $("#rIcon").textContent = Rk[0]; $("#rName").textContent = Rk[1]; $("#rLv").textContent = "Lv " + L.n;
  $("#rNext").textContent = T("toNext").replace("{n}", L.span - L.into);
  requestAnimationFrame(() => $("#rXp").style.width = (100 * L.into / L.span) + "%");
  const all = mode === "w" ? DATA.items : mode === "g" ? DATA.gitems : AQ;
  $("#sMast").textContent = mastOf(all) + "/" + all.length; $("#tMast").textContent = T(mode === "w" ? "mastered" : "gMastered");
  $("#sBest").textContent = P.best; $("#tBest").textContent = T("bestCombo");
  $("#sDays").textContent = streakDays(); $("#tDays").textContent = T("days");
  $("#tPick").textContent = T("pick"); $("#tLen").textContent = T("len"); $("#tNote").textContent = T(mode === "w" ? "note" : mode === "g" ? "gNote" : mode === "o" ? "oNote" : "aNote");
  if (mode === "w") {
    $("#chs").innerHTML = DATA.chapters.map(c => `<button class="chbtn${selCh.includes(c.id) ? " on" : ""}" data-c="${c.id}">${esc(c.title)}<small lang="ko">${esc(c.theme)}</small><div class="bar"><i style="width:${Math.round(100 * chProgress(c.id))}%"></i></div></button>`).join("")
      + `<button class="chbtn${selCh.length === DATA.chapters.length ? " on" : ""}" data-c="all">${esc(T("all"))}<small>${DATA.items.filter(ofLevel).length}</small></button>`;
  } else if (isA(mode)) {
    $("#chs").innerHTML = ADVCH.map(c => { const qs = AQ.filter(q => q.ch === c);
        return `<button class="chbtn${selA.includes(c) ? " on" : ""}" data-c="${c}">${c}과<small lang="ko">${esc(ADV.filter(a => String(a.ch) === c).slice(0, 4).map(a => a.kr).join(" · "))}</small><div class="bar"><i style="width:${Math.round(100 * (qs.length ? mastOf(qs) / qs.length : 0))}%"></i></div></button>`; }).join("")
      + `<button class="chbtn${selA.length === ADVCH.length ? " on" : ""}" data-c="all">${esc(T("all"))}<small>${ADV.length}</small></button>`;
  } else {
    $("#chs").innerHTML = GCH.map(c => { const pts = DATA.gpoints.filter(p => String(p.ch) === c);
        return `<button class="chbtn${selG.includes(c) ? " on" : ""}" data-c="${c}">${esc(gChTitle(c))}<small lang="ko">${esc(pts.map(p => p.short).join(" · "))}</small><div class="bar"><i style="width:${Math.round(100 * gProgress(c))}%"></i></div></button>`; }).join("")
      + `<button class="chbtn${selG.length === GCH.length ? " on" : ""}" data-c="all">${esc(T("all"))}<small>${DATA.gitems.length}</small></button>`;
  }
  $("#starBtn").classList.toggle("hidden", mode !== "w");
  $("#starBtn").className = "chip star" + (starOnly ? " on" : "") + (mode !== "w" ? " hidden" : ""); $("#starBtn").textContent = T("star") + "  (" + DATA.items.filter(x => x.st).length + ")";
  $("#lens").innerHTML = [10, 20, 40].map(n => `<button class="chip${roundLen === n ? " on" : ""}" data-n="${n}">${n}</button>`).join("");
  $("#go").textContent = T("start") + "  →"; $("#go").disabled = !poolNow().length;
  $("#mute").textContent = muted ? "🔇" : "🔊";
}
$("#modes").onclick = e => { const b = e.target.closest("[data-m]"); if (!b) return; mode = b.dataset.m; store.set("k5b_swap_mode", mode); if (isA(mode)) useAdv(mode); renderStart(); };
$("#chs").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; const c = b.dataset.c;
  if (mode === "w") {
    if (c === "all") selCh = selCh.length === DATA.chapters.length ? [] : DATA.chapters.map(x => x.id);
    else selCh = selCh.includes(c) ? selCh.filter(x => x !== c) : [...selCh, c];
    store.set("k5b_swap_ch", selCh);
  } else if (isA(mode)) {
    if (c === "all") selA = selA.length === ADVCH.length ? [] : ADVCH.slice();
    else selA = selA.includes(c) ? selA.filter(x => x !== c) : [...selA, c];
    store.set(mode === "o" ? "k5b_swap_och" : "k5b_swap_ach", selA);
  } else {
    if (c === "all") selG = selG.length === GCH.length ? [] : GCH.slice();
    else selG = selG.includes(c) ? selG.filter(x => x !== c) : [...selG, c];
    store.set("k5b_swap_gch", selG);
  }
  renderStart(); };
$("#starBtn").onclick = () => { starOnly = !starOnly; store.set("k5b_swap_star", starOnly); renderStart(); };
$("#lens").onclick = e => { const b = e.target.closest("[data-n]"); if (!b) return; roundLen = +b.dataset.n; store.set("k5b_swap_len", roundLen); renderStart(); };
$("#mute").onclick = () => { muted = !muted; store.set("k5b_swap_mute", muted); $("#mute").textContent = muted ? "🔇" : "🔊"; if (!muted) tone(880, 0, .12, "triangle", .15); };

// ---------- a round ----------
let R = null;
function adverbSets(qs){
  // one sentence per adverb (its least-known one), then greedy sets of 5 without clashes
  const best = new Map();
  for (const q of qs) { const b = best.get(q.kr); if (!b || (P.mast[q.id] || 0) < (P.mast[b.id] || 0) || ((P.mast[q.id] || 0) === (P.mast[b.id] || 0) && Math.random() < .5)) best.set(q.kr, q); }
  let left = shuffle([...best.values()]).sort((a, b) => (P.mast[a.id] || 0) - (P.mast[b.id] || 0));
  const clash = (a, b) => a.adv.clash.includes(b.kr) || b.adv.clash.includes(a.kr);
  const out = [];
  while (left.length) {
    const set = [left.shift()];
    for (let i = 0; i < left.length && set.length < 5; ) { if (set.every(x => !clash(x, left[i]))) set.push(left.splice(i, 1)[0]); else i++; }
    // a set of 1-2 needs fillers so the box still offers a choice
    if (set.length < 4) for (const a of shuffle(ADV.slice())) { if (set.length >= 4) break; if (!set.some(x => x.kr === a.kr) && set.every(x => !a.clash.includes(x.kr) && !x.adv.clash.includes(a.kr))) set.push({ kr: a.kr, adv: a, filler: true }); }
    const bank = shuffle(set.map(x => x.kr));
    for (const q of shuffle(set.filter(x => !x.filler))) out.push(Object.assign({}, q, { bank }));
  }
  return out;
}
function pickRound(onlyIds){
  if (isA(mode)) {
    const pool = onlyIds ? AQ.filter(q => onlyIds.includes(q.id)) : poolNow();
    const sets = adverbSets(pool);
    return onlyIds ? sets : sets.slice(0, Math.max(5, Math.ceil(roundLen / 5) * 5));
  }
  const src = mode === "w" ? DATA.items : DATA.gitems;   // adverb replays are handled above
  let pool = onlyIds ? src.filter(x => onlyIds.includes(x.id)) : poolNow();
  // least-known first, a little shuffled so rounds differ
  pool = shuffle(pool.slice()).sort((a, b) => ((P.mast[a.id] || 0) - (P.mast[b.id] || 0)) + (Math.random() - .5) * .9);
  return pool.slice(0, onlyIds ? pool.length : roundLen);
}
function startRound(onlyIds){
  try { actx().resume(); } catch {}
  const qs = pickRound(onlyIds);
  if (!qs.length) return;
  R = { mode, qs, i: 0, total: qs.length, score: 0, combo: 0, best: 0, right: 0, firstTry: 0, missed: [], retried: new Set(), answered: false, xp0: P.xp, timer: 0, built: [] };
  $("#start").classList.add("hidden"); $("#end").classList.add("hidden"); $("#play").classList.remove("hidden");
  $("#score").textContent = 0; setCombo(0, false); showQ();
}
function setCombo(n, bump){
  $("#comboN").textContent = n; const c = $("#combo"); c.classList.toggle("hot", n >= 3); c.style.opacity = n ? 1 : .35;
  if (bump) { c.classList.add("bump"); setTimeout(() => c.classList.remove("bump"), 150); }
}
const ul = t => esc(t).replace(/\[\[(.+?)\]\]/g, (_, m) => `<span class="ul">${m}</span>`);
function showQ(){
  clearTimeout(R.timer);
  const q = R.qs[R.i]; R.answered = false;
  $("#progFill").style.width = (100 * R.i / R.qs.length) + "%";
  $("#count").textContent = (R.i + 1) + " / " + R.qs.length;
  $("#fb").classList.add("hidden");
  const g = R.mode === "g", a = isA(R.mode);
  for (const id of ["#gram", "#built", "#tiles"]) $(id).classList.toggle("hidden", !g);
  $("#bank").classList.toggle("hidden", !a);
  $("#opts").classList.toggle("hidden", g || a);
  if (a) {
    $("#tAsk").textContent = T(R.mode === "o" ? "oAsk" : "aAsk");
    const done = new Set(R.qs.slice(0, R.i).filter(x => x.bank === q.bank && x.solved).map(x => x.kr));
    $("#bank").innerHTML = q.bank.map(w => `<button class="bw${done.has(w) ? " done" : ""}" data-w="${esc(w)}" lang="ko">${esc(w)}</button>`).join("");
    $("#sent").innerHTML = esc(q.s).replace("___", '<span class="blank">____</span>');
  } else if (!g) {
    $("#tAsk").innerHTML = (q.st ? "<span class=\"qstar\">★</span>" : "") + esc(T("ask"));
    $("#sent").innerHTML = ul(q.s);
    const opts = shuffle([q.a, ...q.w]);
    $("#opts").innerHTML = opts.map((o, k) => `<button class="opt" data-o="${esc(o)}" lang="ko"><span class="n">${k + 1}</span><span>${esc(o)}</span></button>`).join("");
  } else {
    $("#tAsk").textContent = T("gAsk");
    $("#gram").textContent = GP[q.g].title;
    $("#sent").innerHTML = ul(q.p).replace(/ \+ /g, " <b style=\"color:var(--gold)\">+</b> ");
    R.built = [];
    const tiles = shuffle([...q.a.split(" ").map((t, k) => ({ t, k })), ...q.t.map((t, k) => ({ t, k: "x" + k }))]);
    $("#tiles").innerHTML = tiles.map((x, n) => `<button class="tile" data-n="${n}" lang="ko">${esc(x.t)}</button>`).join("");
    R.tiles = tiles;
    const b = $("#built"); b.className = "built"; b.dataset.ph = T("tapTiles"); b.innerHTML = "";
  }
}
$("#opts").onclick = e => { const b = e.target.closest(".opt"); if (b) answer(b); };
$("#bank").onclick = e => { const b = e.target.closest(".bw"); if (!b || R.answered) return;
  R.answered = true;
  const q = R.qs[R.i], ok = b.dataset.w === q.kr;
  for (const x of $("#bank").children) if (x.dataset.w === q.kr) x.classList.add("right");
  if (!ok) b.classList.add("wrongpick"); else q.solved = true;
  $("#sent").innerHTML = esc(q.s).replace("___", `<span class="ans${ok ? "" : " miss"}">${esc(q.kr)}</span>`);
  const gloss = (q.adv.tr && (q.adv.tr[lang] || q.adv.tr.en)) || q.adv.en || "";
  reward(ok, q, b.getBoundingClientRect(), `<div class="word"><b lang="ko">${esc(q.kr)}</b> — <span lang="${lang}">${esc(gloss)}</span></div>${q.en ? `<div class="en">${esc(q.en)}</div>` : ""}`);
};
$("#tiles").onclick = e => { const b = e.target.closest(".tile"); if (!b || R.answered) return;
  b.classList.add("used"); R.built.push(+b.dataset.n); tone(660 + R.built.length * 40, 0, .06, "triangle", .08); renderBuilt();
  if (R.built.length === R.qs[R.i].a.split(" ").length) setTimeout(checkTiles, 220); };
$("#built").onclick = e => { const b = e.target.closest(".tile"); if (!b || R.answered) return;
  const n = +b.dataset.n; R.built = R.built.filter(x => x !== n); $("#tiles").querySelector(`[data-n="${n}"]`).classList.remove("used"); renderBuilt(); };
function renderBuilt(){ $("#built").innerHTML = R.built.map(n => `<button class="tile" data-n="${n}" lang="ko">${esc(R.tiles[n].t)}</button>`).join(""); }
addEventListener("keydown", e => {
  if ($("#play").classList.contains("hidden")) return;
  if (!R.answered && R.mode === "w" && /^[1-4]$/.test(e.key)) { const b = $("#opts").children[+e.key - 1]; if (b) answer(b); }
  else if (!R.answered && R.mode === "g" && e.key === "Backspace" && R.built.length) { const n = R.built.pop(); $("#tiles").querySelector(`[data-n="${n}"]`).classList.remove("used"); renderBuilt(); }
  else if (R.answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); nextQ(); }
});
function answer(btn){
  if (R.answered) return; R.answered = true;
  const q = R.qs[R.i], ok = btn.dataset.o === q.a;
  for (const b of $("#opts").children) { if (b.dataset.o === q.a) b.classList.add("right"); else if (b !== btn) b.classList.add("dim"); }
  if (!ok) btn.classList.add("wrongpick");
  $("#sent").innerHTML = esc(q.s).replace(/\[\[(.+?)\]\]/, () => `<span class="ans${ok ? "" : " miss"}">${esc(q.a)}</span>`);
  const gloss = (q.tr && (q.tr[lang] || q.tr.en)) || "";
  reward(ok, q, btn.getBoundingClientRect(),
    `<div class="word"><b lang="ko">${esc(q.kr)}</b> — <span lang="${lang}">${esc(gloss)}</span></div>${q.en ? `<div class="en">${esc(q.en)}</div>` : ""}`);
}
function checkTiles(){
  if (R.answered) return; R.answered = true;
  const q = R.qs[R.i], got = R.built.map(n => R.tiles[n].t), want = q.a.split(" "), ok = got.join(" ") === q.a;
  const b = $("#built"); b.classList.add(ok ? "good" : "bad");
  const fix = want.map((w, k) => got[k] === w ? `<span class="ok">${esc(w)}</span>` : `<span class="ans miss">${esc(w)}</span>`).join(" ");
  reward(ok, q, b.getBoundingClientRect(),
    `<div class="word"><span class="gram" style="font-size:13px;margin:0">${esc(GP[q.g].title)}</span></div>${ok ? "" : `<div class="fixline" lang="ko">${fix}</div>`}${q.en ? `<div class="en">${esc(q.en)}</div>` : ""}`);
}
// shared by both modes: points, combo, sounds, confetti, mastery, the missed list and the feedback panel
function reward(ok, q, rect, body){
  const firstTime = !R.retried.has(q.id);
  if (ok) {
    R.combo++; R.best = Math.max(R.best, R.combo); R.right++; if (firstTime) R.firstTry++;
    const mult = 1 + Math.min(4, Math.floor(R.combo / 3)), pts = (R.mode === "g" ? 15 : 10) * mult;
    R.score += pts; P.xp += pts; P.mast[q.id] = (P.mast[q.id] || 0) + (firstTime ? 1 : 0);
    $("#score").textContent = R.score; setCombo(R.combo, true);
    const x = rect.left + rect.width / 2, y = rect.top + rect.height / 2;
    burst(x, y, 26 + Math.min(40, R.combo * 4), 1 + Math.min(.8, R.combo * .06));
    floatText(x, rect.top, "+" + pts + (mult > 1 ? "  ×" + mult : ""));
    sndRight(R.combo); buzz(25); flash(false);
    if ([3, 5, 10, 15, 20, 30, 50].includes(R.combo)) {
      setTimeout(() => { banner(R.combo >= 10 ? T("wow").replace("{n}", R.combo) : "🔥 " + R.combo + " COMBO!"); sndMilestone(); burst(innerWidth / 2, innerHeight * .3, 90, 1.5); buzz([30, 40, 30]); }, 180);
    }
  } else {
    if (R.combo >= 3) floatText(innerWidth / 2, rect.top, T("lost").replace("{n}", R.combo));
    R.combo = 0; setCombo(0, false); sndWrong(); buzz([60, 40, 60]); flash(true);
    P.mast[q.id] = Math.max(0, (P.mast[q.id] || 0) - 1);
    if (!R.missed.some(m => m.id === q.id)) R.missed.push(q);
    // it comes back three questions later (once)
    if (!R.retried.has(q.id)) { R.retried.add(q.id); R.qs.splice(Math.min(R.qs.length, R.i + 4), 0, q); }
  }
  save();
  const fb = $("#fb");
  fb.className = "fb " + (ok ? "good" : "bad");
  fb.innerHTML = `<div class="head">${ok ? "✔ " + esc(T(R.combo >= 5 ? "great" : "right")) : "✖ " + esc(T("wrong"))}</div>${body}
    <button class="next" id="nextBtn">${esc(T(R.i + 1 >= R.qs.length ? "finish" : "next"))} →</button>`;
  $("#nextBtn").onclick = nextQ;
  // no auto-advance: the feedback stays until Next is tapped, so there is time to read it
}
function nextQ(){
  if (!R || !R.answered) return;
  clearTimeout(R.timer); R.i++;
  if (R.i >= R.qs.length) return endRound();
  showQ();
}
$("#quit").onclick = () => { clearTimeout(R && R.timer); $("#play").classList.add("hidden"); $("#start").classList.remove("hidden"); renderStart(); };

// ---------- end ----------
function endRound(){
  const today = new Date().toISOString().slice(0, 10);
  if (!P.days.includes(today)) P.days.push(today); P.days = P.days.slice(-60);
  P.best = Math.max(P.best, R.best); P.rounds++;
  const perfect = R.firstTry === R.total;
  if (perfect) { P.xp += 50; }
  save();
  const L0 = levelOf(R.xp0), L1 = levelOf(P.xp), up = L1.n > L0.n, Rk = rankOf(L1.n);
  const acc = Math.round(100 * R.firstTry / R.total);
  const icon = perfect ? "🏆" : acc >= 80 ? "🎉" : acc >= 50 ? "💪" : "🌱";
  const head = perfect ? T("perfect") : acc >= 80 ? T("great") : acc >= 50 ? T("good") : T("keep");
  $("#play").classList.add("hidden");
  const end = $("#end"); end.classList.remove("hidden");
  end.innerHTML = `<div class="big">${icon}</div><h2>${esc(head)}</h2>
    <div class="sub">${R.firstTry} / ${R.total} ${esc(T("firstTry"))}${perfect ? " · +50 XP ✨" : ""}</div>
    <div class="endstats">
      <div class="stat"><b>${R.score}</b><span>XP</span></div>
      <div class="stat"><b>${acc}%</b><span>${esc(T("acc"))}</span></div>
      <div class="stat"><b>${R.best}</b><span>${esc(T("bestCombo"))}</span></div>
    </div>
    <div class="hero" style="text-align:left;margin:0">
      <div class="rankrow"><div class="rankicon">${Rk[0]}</div><div style="flex:1"><div class="rankname">${esc(Rk[1])} · Lv ${L1.n}</div>
      <div class="ranksub">${esc(T("toNext").replace("{n}", L1.span - L1.into))}</div></div></div>
      <div class="xpbar"><div class="xpfill" id="endXp" style="width:${up ? 0 : 100 * L0.into / L0.span}%"></div></div>
    </div>
    ${up ? `<div class="lvup">⬆ LEVEL UP! Lv ${L1.n}</div>` : ""}
    ${R.missed.length ? `<div class="missed"><h3>${esc(T("missed"))}</h3>${R.missed.map(m => m.adv ? `<div class="mrow"><b lang="ko">${esc(m.kr)}</b> — <span>${esc((m.adv.tr && (m.adv.tr[lang] || m.adv.tr.en)) || m.adv.en || "")}</span></div>` : m.g ? `<div class="mrow"><span class="gram" style="font-size:12px;margin:0 0 4px">${esc(GP[m.g].title)}</span><div lang="ko">${esc(m.a)}</div></div>` : `<div class="mrow"><b lang="ko">${esc(m.kr)}</b> — <span lang="${lang}">${esc((m.tr && (m.tr[lang] || m.tr.en)) || "")}</span></div>`).join("")}</div>` : ""}
    <div class="btnrow">
      ${R.missed.length ? `<button class="go" id="again" style="margin-top:0">${esc(T("again"))} (${R.missed.length})</button>` : ""}
      <button class="${R.missed.length ? "ghost" : "go"}" id="newr" ${R.missed.length ? "" : 'style="margin-top:0"'}>${esc(T("newRound"))}</button>
      <button class="ghost" id="menu">${esc(T("menu"))}</button>
    </div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => { $("#endXp").style.width = (100 * L1.into / L1.span) + "%"; }));
  const missedIds = R.missed.map(m => m.id);
  if ($("#again")) $("#again").onclick = () => startRound(missedIds);
  $("#newr").onclick = () => startRound();
  $("#menu").onclick = () => { end.classList.add("hidden"); $("#start").classList.remove("hidden"); renderStart(); };
  setTimeout(() => {
    if (perfect || up) { sndLevel(); buzz([40, 50, 40, 50, 80]);
      for (let k = 0; k < 5; k++) setTimeout(() => burst(innerWidth * (.2 + Math.random() * .6), innerHeight * (.2 + Math.random() * .3), 70, 1.4), k * 260); }
    else if (acc >= 50) { sndMilestone(); burst(innerWidth / 2, innerHeight * .25, 60, 1.2); }
  }, 250);
}

$("#go").onclick = () => startRound();
renderStart();
</script>
