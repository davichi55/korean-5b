<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>Korean 5B — 1–4과 코스</title>
<meta name="description" content="Sogang Korean 5B: one guided course for the chapter 1–4 quiz — short levels with the ★ words and ★ grammar.">

<style>
  /* navy palette shared with the other 5B pages; one column, big tap targets, one thing per screen */
  :root{ --bg:#0f1420; --bg2:#161d2e; --card:#1c2740; --line:#2c3a5a; --txt:#eaf0fb; --dim:#96a3c2; --accent:#5b8cff;
    --gold:#ffc766; --good:#37d18f; --bad:#ff6b7a; color-scheme:dark }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:640px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
  .hidden{display:none!important}
  a{color:inherit}
  /* home */
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .top a{color:var(--dim);text-decoration:none;font-size:14px}
  .top h1{margin:0;font-size:22px;font-weight:900;flex:1;min-width:0}
  .langs{display:flex;gap:4px;flex-wrap:wrap}
  .chip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--dim)}
  .chip.on{border-color:var(--accent);color:var(--txt);background:#233256}
  .stats{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
  .stats b{color:var(--txt)}
  .pbar{height:10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .4s}
  .cont{display:flex;flex-direction:column;gap:6px;text-align:left;background:linear-gradient(135deg,#2c4ea8,#1f3a7a);border:0;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .cont small{color:#c7d6ff;font-size:13px}
  .cont b{font-size:22px}
  .cont span{font-size:14px;color:#dbe6ff}
  .part{margin:10px 0 2px;font-size:13px;letter-spacing:.06em;color:var(--gold);font-weight:700}
  .lv{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
  .lv .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:13px;flex:none}
  .lv.done .ic{background:var(--good);color:#0b1a12}
  .lv.next{border-color:var(--accent);box-shadow:0 0 0 2px rgba(91,140,255,.25)}
  .lv .t{flex:1;min-width:0;font-size:15px}
  .lv .t small{display:block;color:var(--dim);font-size:12px}
  .lv .st{color:var(--gold);font-size:13px;letter-spacing:1px}
  /* lesson */
  .lhead{display:flex;align-items:center;gap:10px}
  .x{background:var(--bg2);border:1px solid var(--line);border-radius:10px;width:36px;height:36px}
  .lhead .pbar{flex:1}
  .lhead .cnt{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:300px}
  .ask{color:var(--dim);font-size:13px}
  .big{font-size:38px;font-weight:900;line-height:1.2;word-break:keep-all}
  .meta{color:var(--dim);font-size:13px}
  .mean{font-size:20px;font-weight:700;color:var(--gold)}
  .box{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.55}
  .box small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
  .sent{font-size:21px;line-height:1.65;word-break:keep-all}
  .ul{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--gold);background:rgba(255,207,92,.10);border-radius:6px;padding:0 3px}
  .blank{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--gold);margin:0 3px;color:transparent}
  .ans{background:rgba(55,209,143,.2);border-radius:6px;padding:0 4px;color:#bff5dc}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:18px}
  .opt .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#0d1322;color:var(--dim);font-size:13px;font-weight:700}
  .opt .om{margin-left:auto;padding-left:10px;color:var(--dim);font-size:13px;text-align:right}
  .opt.right{border-color:var(--good);background:rgba(55,209,143,.16)}
  .opt.right .n{background:var(--good);color:#0b1a12}
  .opt.wrongpick{border-color:var(--bad);background:rgba(255,107,122,.14)}
  .opt.dim>*:not(.om){opacity:.45}
  .opt:disabled{cursor:default}
  .tiles,.built{display:flex;flex-wrap:wrap;gap:8px}
  .built{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:8px}
  .tile{background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:17px}
  .tile.used{visibility:hidden}
  .fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.5}
  .fb.good{background:rgba(55,209,143,.12);border:1px solid var(--good)}
  .fb.bad{background:rgba(255,107,122,.10);border:1px solid var(--bad)}
  .fb b{font-size:17px}
  .fb small{color:var(--dim)}
  .next{background:var(--accent);border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;color:#fff;width:100%}
  .say{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;align-self:flex-start}
  .gw{cursor:pointer;border-bottom:1px dotted rgba(234,240,251,.35)}
  .gw.on{background:rgba(91,140,255,.25);border-radius:3px}
  #gpop{position:fixed;z-index:80;max-width:min(260px,80vw);background:#0b1020;border:1px solid var(--gold);border-radius:10px;padding:6px 10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.45);pointer-events:none}
  #gpop b{color:var(--gold);margin-right:6px}
  /* end of level */
  .end{text-align:center;align-items:center}
  .stars{font-size:46px;letter-spacing:6px;color:var(--gold)}
  .end h2{margin:0;font-size:24px}
  .end p{margin:0;color:var(--dim);font-size:15px;line-height:1.5}
  .brk{background:rgba(255,199,102,.10);border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;font-size:14px}
  .ghost{background:transparent;border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;color:var(--dim)}
  @keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  @media (prefers-reduced-motion: reduce){ .pop{animation:none} }
</style>
</head>

  <div id="fbwrap"></div>
</div>

<div class="wrap hidden" id="done">
  <div class="stage end" id="endbox"></div>
</div>

":"The exam is tomorrow and I haven't studied at all, so I'm worried sick."}},"w372":{"id":"w372","ch":4,"kr":"여한이 없다","pos":"표현","sec":"비디오","ex":"","exEn":"","m":["to have no regrets","死而无憾,没有遗憾","死而無憾,沒有遺憾","ไม่มีอะไรให้เสียดาย","ни о чём не жалеть","không còn gì hối tiếc"],"sw":{"s":"이제 소원을 다 이뤘으니 [[후회되는 것이 하나도 없어요]].","a":"여한이 없어요","w":["걱정이 태산이에요","집안이 시끄러워요","어쩔 수 없어요"],"en":"Now that I've achieved all my wishes, I have no regrets."}},"w373":{"id":"w373","ch":4,"kr":"보자 보자 하니까~","pos":"표현","sec":"비디오","ex":"","exEn":"","m":["I've put up with you so far, but…","我一忍再忍,可你……","我一忍再忍,可你……","ทนมาตลอดแล้วนะ แต่…","Я терпел-терпел, а ты…","Tôi nhịn mãi rồi mà…"],"sw":null}},"gram":[{"id":"g1-1","ch":1,"title":"A/V-(으)ㄹ 뻔하다","form":"동사 + -(으)ㄹ 뻔하다 (받침 없음 -ㄹ 뻔하다 / 받침 있음 -을 뻔하다) / 과거: -(으)ㄹ 뻔했다","rule":"어떤 일이 거의 일어날 뻔했지만 실제로는 일어나지 않았음을 나타낸다.","m":["Something almost happened, but in the end it did not. It is used for a close call, usually something bad.","某件事差一点就发生了，但最终没有发生。多用于险些发生的、通常是不好的事情。","某件事差一點就發生了，但最終沒有發生。多用於險些發生的、通常是不好的事情。","เกือบจะเกิดเรื่องหนึ่งขึ้น แต่สุดท้ายก็ไม่เกิด ใช้กับเหตุการณ์ที่เฉียดฉิว มักเป็นเรื่องไม่ดี","Что-то почти произошло, но в итоге не произошло. Используется для «чуть не»: обычно о чём-то плохом.","Một việc suýt xảy ra nhưng cuối cùng đã không xảy ra. Dùng cho tình huống 'suýt nữa', thường là chuyện không hay."],"use":"Add -ㄹ to a stem ending in a vowel and -을 to a stem ending in a consonant (넘어지다 → 넘어질, 먹다 → 먹을; ㄹ stems keep ㄹ: 울다 → 울), then 뻔했다. The event did not really happen, so it is almost always in the past (뻔했어요 / 뻔했다). It goes mostly with accidents and embarrassing moments (넘어지다, 늦다, 울다, 놓치다). Putting 하마터면 ('nearly') in front makes it stronger. Common mistake: using it for something that really happened, or in the present (넘어질 뻔해요).","ex":[{"ko":"비 오는 날 계단에서 미끄러져서 넘어질 뻔했어요.","t":["On a rainy day I slipped on the stairs and almost fell.","下雨天我在楼梯上滑了一下，差点摔倒。","下雨天我在樓梯上滑了一下，差點摔倒。","วันที่ฝนตก ฉันลื่นบนบันไดและเกือบล้ม","В дождливый день я поскользнулся на лестнице и чуть не упал.","Hôm trời mưa, tôi trượt chân trên cầu thang và suýt ngã."]},{"ko":"영화표를 예매하지 않아서 영화를 못 볼 뻔했어요.","t":["I hadn't booked the film ticket, so I almost couldn't see the film.","我没有提前订电影票，差点看不成电影。","我沒有提前訂電影票，差點看不成電影。","ฉันไม่ได้จองตั๋วหนังไว้ล่วงหน้า เลยเกือบดูหนังไม่ได้","Я не заказал билет заранее и чуть не пропустил фильм.","Tôi không đặt vé xem phim trước nên suýt không xem được phim."]}],"fills":[{"ko":"지갑을 잃어버릴 뻔했는데 다행히 찾았어요.","ans":"릴 뻔했는데","en":"I almost lost my wallet, but luckily I found it.","wrong":["인 척하는","어 두세요","겨 두세요"]},{"ko":"청소하다가 꽃병을 깰 뻔했어요.","ans":"깰 뻔했어요","en":"While cleaning I almost broke the vase.","wrong":["열었을 리가 없","는 척하고","봐서 그런지"]},{"ko":"자전거를 타다가 차에 부딪칠 뻔했어요.","ans":"칠 뻔했어요","en":"While riding my bike I almost hit a car.","wrong":["들을수록","실패할 리가 없","두껍다고 해서"]},{"ko":"발표 자료를 저장하지 않고 컴퓨터를 끌 뻔했어요.","ans":"끌 뻔했어요","en":"I almost turned off the computer without saving my presentation.","wrong":["을걸요","라서 그런지","잃어버리는 바람에"]},{"ko":"친구의 농담이 너무 웃겨서 커피를 뿜을 뻔했어요.","ans":"을 뻔했어요","en":"My friend's joke was so funny that I almost spat out my coffee.","wrong":["봐서 그런지","바꾸는 바람에","어 두면"]},{"ko":"지하철에서 내릴 역을 지나칠 뻔했어요.","ans":"칠 뻔했어요","en":"I almost missed my stop on the subway.","wrong":["해서 그런지","공부한다고 해서","쁜 척하면서"]}],"tiles":[{"prompt":"늦잠을 자다 + 학교에 늦다","answer":"늦잠을 자서 학교에 늦을 뻔했어요","traps":["늦는","늦은","늦어"],"en":"I overslept and almost was late for school."},{"prompt":"비가 오다 + 버스를 놓치다","answer":"비가 와서 버스를 놓칠 뻔했어요","traps":["놓치을","놓친","놓치는"],"en":"It rained and I almost missed the bus."},{"prompt":"영화가 너무 슬프다 + 울다","answer":"영화가 너무 슬퍼서 울 뻔했어요","traps":["우을","운","우는"],"en":"The film was so sad that I almost cried."},{"prompt":"뜨거운 커피를 쏟다 + 데다","answer":"뜨거운 커피를 쏟아서 델 뻔했어요","traps":["데을","덴","데는"],"en":"I spilled hot coffee and almost got burned."}]},{"id":"g1-2","ch":1,"title":"A/V-아/어서 그런지 ~","form":"A/V-아/어서 그런지 + 결과 / 명사: N(이)라서 그런지","rule":"정확한 이유는 모르지만 그럴 것이라고 짐작되는 이유를 말한 뒤, 느낀 결과를 이어서 말한다.","m":["Maybe because ~. The speaker offers a reason they guess but are not sure of, then describes the result they noticed.","也许是因为……：说话人对原因只是推测，并不确定，然后说出自己注意到的结果。","也許是因為……：說話人對原因只是推測，並不確定，然後說出自己注意到的結果。","บางที่เพราะ ~ ผู้พูดบอกเหตุผลที่เดาเอาแต่ไม่แน่ใจ แล้วพูดถึงผลที่สังเกตเห็น","Может быть, потому что ~. Говорящий называет причину, которую лишь предполагает, а затем описывает замеченный результат.","Có lẽ vì ~. Người nói đưa ra một lý do chỉ là phỏng đoán, không chắc chắn, rồi nói kết quả mình nhận thấy."],"use":"Take the normal -아/어서 form (좋아서, 먹어서, 피곤해서; nouns 이라서/라서) and add 그런지, then state the result you noticed. The reason is only a guess; if you are sure, use plain -아/어서. The second clause is a statement of what you felt or noticed (졸리다, 사람이 많다), not a command or suggestion. Often found with 오늘따라 or 왠지. Common mistake: using it for a confirmed reason, or ending in a command.","ex":[{"ko":"어제 늦게 자서 그런지 오늘 하루 종일 졸려요.","t":["Maybe because I went to bed late yesterday, I'm sleepy all day today.","也许是因为昨天睡得晚，我今天一整天都很困。","也許是因為昨天睡得晚，我今天一整天都很困。","บางทีเพราะเมื่อวานนอนดึก วันนี้ฉันเลยง่วงทั้งวัน","Может быть, потому что вчера я поздно лёг, сегодня весь день хочу спать.","Có lẽ vì hôm qua tôi ngủ muộn nên hôm nay buồn ngủ cả ngày."]},{"ko":"주말이라서 그런지 영화관에 사람이 정말 많네요.","t":["Maybe because it's the weekend, there are really a lot of people at the cinema.","也许是因为周末，电影院里人真多啊。","也許是因為週末，電影院裡人真多啊。","บางทีเพราะเป็นวันหยุดสุดสัปดาห์ ที่โรงหนังเลยมีคนเยอะมากจริง ๆ","Может быть, потому что выходные, в кинотеатре очень много людей.","Có lẽ vì là cuối tuần nên rạp chiếu phim đông người thật đấy."]}],"fills":[{"ko":"요즘 운동을 해서 그런지 몸이 가벼워요.","ans":"해서 그런지","en":"Maybe because I've been exercising lately, my body feels light.","wrong":["바꾸는 바람에","기만 하","먹을수록"]},{"ko":"비가 와서 그런지 오늘은 카페가 한산해요.","ans":"와서 그런지","en":"Maybe because it's raining, the cafe is quiet today.","wrong":["읽을수록","좋다고 해서","릴 뻔했는데"]},{"ko":"방학이라서 그런지 거리에 학생들이 별로 없어요.","ans":"라서 그런지","en":"Maybe because it's vacation, there aren't many students on the street.","wrong":["기만 하","끌 뻔했어요","인 척하는"]},{"ko":"점심을 많이 먹어서 그런지 졸음이 쏟아져요.","ans":"어서 그런지","en":"Maybe because I ate a lot for lunch, I'm overwhelmed by sleepiness.","wrong":["말했을 리가 없","울걸요","어 두세요"]},{"ko":"날씨가 추워서 그런지 아침에 일어나기가 힘들어요.","ans":"워서 그런지","en":"Maybe because it's cold, it's hard to get up in the morning.","wrong":["날 정도로","외국인이라고 해서","공부한다고 해서"]},{"ko":"어제 영화를 두 편이나 봐서 그런지 눈이 피곤해요.","ans":"봐서 그런지","en":"Maybe because I watched two films yesterday, my eyes are tired.","wrong":["잃어버리는 바람에","어 두는","울걸요"]}],"tiles":[{"prompt":"어제 늦게 자다 + 오늘 졸리다","answer":"어제 늦게 자서 그런지 오늘 졸려요","traps":["자니까","그렇지","자도"],"en":"Maybe because I slept late yesterday, I'm sleepy today."},{"prompt":"비가 오다 + 손님이 적다","answer":"비가 와서 그런지 손님이 적어요","traps":["오니까","그렇지","와도"],"en":"Maybe because it's raining, there are few customers."},{"prompt":"주말이다 + 사람이 많다","answer":"주말이라서 그런지 사람이 많아요","traps":["주말이니까","주말이면","주말이라도"],"en":"Maybe because it's the weekend, there are lots of people."},{"prompt":"약을 먹다 + 기침이 줄다","answer":"약을 먹어서 그런지 기침이 줄었어요","traps":["먹으니까","먹었는데","그렇지"],"en":"Maybe because I took medicine, my cough has lessened."}]},{"id":"g1-3","ch":1,"title":"(A/V-(으)면) A/V-(으)ㄹ수록 ~","form":"A/V-(으)ㄹ수록 (받침 없음·ㄹ 받침 -ㄹ수록 / 받침 있음 -을수록) / A/V-(으)면 A/V-(으)ㄹ수록","rule":"앞의 일의 정도가 더해지면 뒤의 일의 정도도 함께 더해짐을 나타낸다.","m":["The more ~, the more ~. As the degree of the first thing increases, the second increases (or changes) along with it.","越……越……。前面事情的程度加深，后面的程度也随之加深（或发生变化）。","越……越……。前面事情的程度加深，後面的程度也隨之加深（或發生變化）。","ยิ่ง ~ ก็ยิ่ง ~ เมื่อระดับของเรื่องแรกเพิ่มขึ้น เรื่องหลังก็เพิ่มขึ้น (หรือเปลี่ยนไป) ตามกัน","Чем больше ~, тем больше ~. Когда степень первого растёт, вместе с ней растёт (или меняется) второе.","Càng ~ càng ~. Khi mức độ của việc thứ nhất tăng lên thì việc thứ hai cũng tăng (hoặc thay đổi) theo."],"use":"Attach -ㄹ수록 to stems ending in a vowel or ㄹ (보다 → 볼수록, 만들다 → 만들수록) and -을수록 to consonant stems (먹다 → 먹을수록, 좋다 → 좋을수록). The -(으)면 in front is optional and only adds emphasis; the same verb is repeated (보면 볼수록, 알면 알수록). The second clause often has 더 ('even more'). Past -았/었- is not used before -(으)ㄹ수록. Common mistake: attaching -았/었- to the first clause, or using it for a one-time event.","ex":[{"ko":"이 영화는 보면 볼수록 매력이 있어요.","t":["This film becomes more charming the more you watch it.","这部电影越看越有魅力。","這部電影越看越有魅力。","หนังเรื่องนี้ยิ่งดูก็ยิ่งมีเสน่ห์","Чем больше смотришь этот фильм, тем он привлекательнее.","Bộ phim này càng xem càng có sức hút."]},{"ko":"립싱크는 연습할수록 실력이 늘어요.","t":["The more you practise lip-syncing, the better you get.","对口型越练越熟练。","對口型越練越熟練。","ลิปซิงก์ยิ่งฝึกก็ยิ่งเก่งขึ้น","Чем больше тренируешь липсинк, тем лучше получается.","Hát nhép càng luyện càng giỏi."]}],"fills":[{"ko":"이 책은 읽을수록 이야기가 흥미로워요.","ans":"읽을수록","en":"The more I read this book, the more interesting the story is.","wrong":["어 두세요","어 두었어요","릴 뻔했는데"]},{"ko":"김치는 먹을수록 맛있는 것 같아요.","ans":"먹을수록","en":"The more I eat kimchi, the tastier it seems.","wrong":["범인일 리가 없","울걸요","기만 하"]},{"ko":"나이가 들수록 시간이 빨리 가는 느낌이에요.","ans":"들수록","en":"The older I get, the faster time seems to pass.","wrong":["끌 뻔했어요","와서 그런지","좋다고 해서"]},{"ko":"그 배우는 알면 알수록 매력적이에요.","ans":"알수록","en":"The more you know that actor, the more charming he is.","wrong":["봐서 그런지","잃어버리는 바람에","두껍다고 해서"]},{"ko":"연습할수록 춤 동작이 자연스러워져요.","ans":"연습할수록","en":"The more I practise, the more natural my dance moves become.","wrong":["멈추는 바람에","기만 하","을걸요"]},{"ko":"설명을 들을수록 더 헷갈려요.","ans":"들을수록","en":"The more I hear the explanation, the more confused I get.","wrong":["와서 그런지","릴 뻔했는데","쁜 척하면서"]}],"tiles":[{"prompt":"한국어를 공부하다 + 재미있다","answer":"한국어는 공부할수록 재미있어요","traps":["공부하수록","공부했을수록","공부하면"],"en":"The more I study Korean, the more fun it is."},{"prompt":"이 노래를 듣다 + 좋아지다","answer":"이 노래는 들을수록 좋아져요","traps":["듣을수록","들수록","들었을수록"],"en":"The more I listen to this song, the more I like it."},{"prompt":"이 영화를 보다 + 더 좋아지다","answer":"이 영화는 볼수록 더 좋아져요","traps":["보수록","봤을수록","보을수록"],"en":"The more I watch this film, the more I like it."},{"prompt":"값이 싸다 + 더 많이 팔리다","answer":"값이 쌀수록 더 많이 팔려요","traps":["싸을수록","쌌을수록","싸면수록"],"en":"The cheaper the price, the more it sells."}]},{"id":"g2-1","ch":2,"title":"A/V-(으)ㄹ 리가 없다","form":"동사/형용사 + -(으)ㄹ 리가 없다 / 과거: -았/었을 리가 없다 / 명사 + 일 리가 없다","rule":"어떤 일이 사실일 가능성이 전혀 없다고 강하게 믿을 때 쓴다.","m":["There is no way that ~. The speaker strongly believes that something cannot be true or cannot happen.","不可能……。说话人强烈相信某件事不可能是真的或不可能发生。","不可能……。說話人強烈相信某件事不可能是真的或不可能發生。","ไม่มีทางที่ ~ ผู้พูดเชื่ออย่างหนักแน่นว่าเรื่องนั้นเป็นไปไม่ได้หรือไม่จริง","Не может быть, чтобы ~. Говорящий твёрдо убеждён, что что-то не может быть правдой или не может произойти.","Làm gì có chuyện ~. Người nói tin chắc rằng việc đó không thể đúng hoặc không thể xảy ra."],"use":"Attach -(으)ㄹ to the stem (가다 → 갈, 먹다 → 먹을, 살다 → 살) and add 리가 없다; for the past use -았/었을 리가 없다; nouns take 일 리가 없다. 리 is a noun meaning 'reason / possibility', so 리는 없다 and 리(가) 있어요? ('how could it be?') also appear. It is the speaker's strong conviction based on what they know about the person or situation, not a checked fact. Common mistake: using it for the speaker's own plans or with a command.","ex":[{"ko":"그 사람이 거짓말을 할 리가 없어요. 제가 오래 알고 지냈거든요.","t":["There's no way he would lie. I've known him for a long time.","他不可能说谎。我认识他很久了。","他不可能說謊。我認識他很久了。","เขาไม่มีทางโกหกหรอก ฉันรู้จักเขามานานแล้ว","Он не может лгать. Я давно его знаю.","Làm gì có chuyện anh ấy nói dối. Tôi quen anh ấy lâu rồi."]},{"ko":"청개구리가 엄마 말을 잘 들을 리가 없어요. 늘 반대로만 하잖아요.","t":["There's no way the green frog would obey his mother. He always does the opposite.","青蛙不可能听妈妈的话。他总是反着来嘛。","青蛙不可能聽媽媽的話。他總是反著來嘛。","กบเขียวไม่มีทางเชื่อฟังแม่หรอก เพราะมันทำตรงข้ามเสมอ","Лягушонок ни за что не послушается маму. Он ведь всегда делает наоборот.","Làm gì có chuyện chú ếch xanh nghe lời mẹ. Nó lúc nào cũng làm ngược lại mà."]}],"fills":[{"ko":"그렇게 열심히 연습했으니 실패할 리가 없어요.","ans":"실패할 리가 없","en":"He practised so hard, so there's no way he'll fail.","wrong":["을걸요","왠지","알수록"]},{"ko":"이 시간에 그 가게가 문을 열었을 리가 없어요.","ans":"열었을 리가 없","en":"There's no way that shop is open at this hour.","wrong":["들을수록","어 두면","는 척했어요"]},{"ko":"내 친구가 내 비밀을 말했을 리가 없어요.","ans":"말했을 리가 없","en":"There's no way my friend told my secret.","wrong":["쁜 척하면서","알수록","와서 그런지"]},{"ko":"저 귀여운 아이가 범인일 리가 없어요.","ans":"범인일 리가 없","en":"There's no way that cute child is the culprit.","wrong":["할 정도로","누군가","워서 그런지"]},{"ko":"오늘 시험이 어려울 리가 없어요.","ans":"어려울 리가 없","en":"There's no way today's exam is hard.","wrong":["많다고 해서","들수록","외국인이라고 해서"]},{"ko":"흥부가 동생을 미워할 리가 없지요.","ans":"미워할 리가 없","en":"There's no way Heungbu would hate his brother.","wrong":["칠 뻔했어요","언젠가","릴 뻔했는데"]}],"tiles":[{"prompt":"착한 사람 + 거짓말을 하다","answer":"착한 사람이 거짓말을 할 리가 없어요","traps":["하는","한","하을"],"en":"There's no way a kind person would lie."},{"prompt":"열심히 연습했다 + 실패하다","answer":"열심히 연습했는데 실패할 리가 없어요","traps":["실패하는","실패한","실패하을"],"en":"I practised hard, so there's no way I'll fail."},{"prompt":"저 아이 + 범인이다","answer":"저 아이가 범인일 리가 없어요","traps":["범인인","범인은","범인이을"],"en":"There's no way that child is the culprit."},{"prompt":"방금 먹었다 + 배가 고프다","answer":"방금 먹었는데 배가 고플 리가 없어요","traps":["고픈","고프는","고프을"],"en":"I just ate, so there's no way I'm hungry."}]},{"id":"g2-2","ch":2,"title":"V-는 바람에 ~","form":"동사 + -는 바람에 (과거의 일이어도 시제는 문장 끝에서 표현: -는 바람에 ~ -았/었다)","rule":"뜻밖의 일 때문에 좋지 않은 결과가 생겼음을 나타낸다.","m":["Because something unexpected happened, a (usually bad) result followed. The whole situation is already in the past.","由于发生了意想不到的事，出现了（通常是不好的）结果。整件事已经是过去。","由於發生了意想不到的事，出現了（通常是不好的）結果。整件事已經是過去。","เพราะเกิดเรื่องที่ไม่คาดคิด จึงมีผลที่ (มักจะไม่ดี) ตามมา ทั้งหมดเป็นเรื่องในอดีตแล้ว","Из-за неожиданного события получился (обычно плохой) результат. Вся ситуация уже в прошлом.","Vì có chuyện bất ngờ xảy ra nên dẫn đến kết quả (thường là không tốt). Toàn bộ tình huống đã là quá khứ."],"use":"Attach -는 바람에 to a verb stem (넘어지다 → 넘어지는 바람에, 오다 → 오는 바람에). The tense is shown only at the end of the sentence, so the first clause stays -는 even when it is past (✗ 비가 왔는 바람에). The cause is something unexpected that the speaker did not choose, and the result is usually negative (늦다, 못 하다, 놓치다, 망치다). The second clause cannot be a command or suggestion. It is not used with adjectives. Common mistake: using -았/었는 바람에, or an intended action as the cause.","ex":[{"ko":"갑자기 비가 오는 바람에 소풍을 못 갔어요.","t":["It suddenly rained, so we couldn't go on the picnic.","突然下雨，所以没能去野餐。","突然下雨，所以沒能去野餐。","จู่ ๆ ฝนก็ตก เราเลยไม่ได้ไปปิกนิก","Внезапно пошёл дождь, поэтому мы не смогли поехать на пикник.","Trời đột nhiên mưa nên chúng tôi không đi dã ngoại được."]},{"ko":"동생이 컵을 깨뜨리는 바람에 바닥이 물바다가 됐어요.","t":["My younger brother broke a cup, and the floor ended up flooded with water.","弟弟打碎了杯子，地板上全是水。","弟弟打碎了杯子，地板上全是水。","น้องทำแก้วแตก พื้นเลยกลายเป็นทะเลน้ำ","Младший брат разбил чашку, и пол оказался залит водой.","Em tôi làm vỡ cái cốc nên sàn nhà ngập nước."]}],"fills":[{"ko":"버스가 늦게 오는 바람에 지각했어요.","ans":"오는 바람에","en":"The bus came late, so I was late.","wrong":["어려울 리가 없","읽을수록","날 정도로"]},{"ko":"컴퓨터가 갑자기 고장 나는 바람에 숙제를 못 냈어요.","ans":"나는 바람에","en":"The computer suddenly broke down, so I couldn't hand in my homework.","wrong":["많다고 해서","들수록","을 뻔했어요"]},{"ko":"친구가 말을 바꾸는 바람에 계획이 엉망이 됐어요.","ans":"바꾸는 바람에","en":"My friend changed his words, and the plan fell apart.","wrong":["을걸요","울걸요","많다고 해서"]},{"ko":"지갑을 잃어버리는 바람에 하루 종일 고생했어요.","ans":"잃어버리는 바람에","en":"I lost my wallet and had a hard time all day.","wrong":["인 척하는","할 정도로","말했을 리가 없"]},{"ko":"앞 사람이 갑자기 멈추는 바람에 부딪힐 뻔했어요.","ans":"멈추는 바람에","en":"The person in front suddenly stopped, and I almost bumped into him.","wrong":["기만 하","누군가","범인일 리가 없"]},{"ko":"잠을 못 자는 바람에 시험을 망쳤어요.","ans":"자는 바람에","en":"I couldn't sleep, so I messed up the exam.","wrong":["인 척하는","어 두었어요","할 정도로"]}],"tiles":[{"prompt":"길이 막히다 + 약속에 늦다","answer":"길이 막히는 바람에 약속에 늦었어요","traps":["막힌","막혔는","막히을"],"en":"The road was jammed, so I was late for the appointment."},{"prompt":"비가 오다 + 소풍을 못 가다","answer":"비가 오는 바람에 소풍을 못 갔어요","traps":["온","왔는","오을"],"en":"It rained, so we couldn't go on the picnic."},{"prompt":"휴대폰이 꺼지다 + 전화를 못 받다","answer":"휴대폰이 꺼지는 바람에 전화를 못 받았어요","traps":["꺼진","꺼졌는","꺼지을"],"en":"My phone turned off, so I couldn't answer the call."},{"prompt":"동생이 떠들다 + 잠에서 깨다","answer":"동생이 떠드는 바람에 잠에서 깼어요","traps":["떠든","떠들는","떠들을"],"en":"My brother made noise, so I woke up."}]},{"id":"g2-3","ch":2,"title":"A/V-(으)ㄴ/는 척하다","form":"형용사 -(으)ㄴ 척하다 / 동사 -는 척하다 / 명사 + 인 척하다 / 이미 한 것처럼: 동사 -(으)ㄴ 척하다","rule":"사실이 아닌 것을 사실인 것처럼 꾸며서 행동함을 나타낸다.","m":["To pretend to ~. The subject acts as if something were true when it is not.","假装……。把不是事实的事装成事实的样子去做。","假裝……。把不是事實的事裝成事實的樣子去做。","แกล้งทำเป็น ~ ทำท่าทางเหมือนเรื่องที่ไม่จริงเป็นเรื่องจริง","Притворяться, что ~. Субъект ведёт себя так, будто что-то правда, хотя это не так.","Giả vờ ~. Chủ ngữ hành động như thể điều gì đó là thật trong khi không phải vậy."],"use":"Use -는 척하다 with verbs (자다 → 자는 척하다; 알다 → 아는 척하다, 모르다 → 모르는 척하다), -(으)ㄴ 척하다 with adjectives (아프다 → 아픈 척하다) and N인 척하다 with nouns. To pretend an action is already done, use V-(으)ㄴ 척하다 (이미 먹은 척하다). The tense of the whole sentence goes on 하다 (척했다). -는 체하다 means the same, and 척 is a bit more colloquial. Common mistake: using -는 for an adjective (✗ 아프는 척하다).","ex":[{"ko":"동생이 아픈 척하면서 학교에 안 갔어요.","t":["My brother pretended to be sick and didn't go to school.","弟弟假装生病，没去上学。","弟弟假裝生病，沒去上學。","น้องแกล้งทำเป็นป่วยแล้วไม่ไปโรงเรียน","Младший брат притворился больным и не пошёл в школу.","Em tôi giả vờ bị ốm nên không đi học."]},{"ko":"민수는 그 사실을 알면서도 모르는 척했어요.","t":["Minsu knew the fact, but he pretended not to.","民秀明明知道这件事，却假装不知道。","民秀明明知道這件事，卻假裝不知道。","มินซูรู้เรื่องนั้นอยู่แล้วแต่แกล้งทำเป็นไม่รู้","Минсу знал этот факт, но притворился, что не знает.","Minsu biết chuyện đó mà vẫn giả vờ không biết."]}],"fills":[{"ko":"그는 바쁜 척하면서 내 부탁을 거절했어요.","ans":"쁜 척하면서","en":"He pretended to be busy and refused my request.","wrong":["울걸요","어 두었어요","누군가"]},{"ko":"아이가 자는 척하고 몰래 만화를 봤어요.","ans":"는 척하고","en":"The child pretended to sleep and secretly read a comic.","wrong":["와서 그런지","외국인이라고 해서","좋다고 해서"]},{"ko":"저는 일본어를 못하는데 잘하는 척했어요.","ans":"는 척했어요","en":"I can't speak Japanese, but I pretended I could.","wrong":["많다고 해서","사 두었어요","릴 뻔했는데"]},{"ko":"친구가 우는 척해서 깜짝 놀랐어요.","ans":"는 척해서","en":"My friend pretended to cry and I was startled.","wrong":["워서 그런지","사 두었어요","을걸요"]},{"ko":"선생님이 안 보는 척하고 다 보고 계셨어요.","ans":"는 척하고","en":"The teacher pretended not to look but was seeing everything.","wrong":["날 정도로","알수록","울걸요"]},{"ko":"그 배우는 영화에서 의사인 척하는 사기꾼 역을 맡았어요.","ans":"인 척하는","en":"That actor played a swindler pretending to be a doctor in the film.","wrong":["많다고 해서","어서 그런지","해서 그런지"]}],"tiles":[{"prompt":"동생이 안 아프다 + 아프다","answer":"동생이 안 아픈데 아픈 척했어요","traps":["아프는","아프은","아플"],"en":"My brother wasn't sick but pretended to be."},{"prompt":"아이가 자다 + 만화를 보다","answer":"아이가 자는 척하고 만화를 봤어요","traps":["자은","잤는","잘"],"en":"The child pretended to sleep and read a comic."},{"prompt":"그는 바쁘다 + 부탁을 거절하다","answer":"그는 바쁜 척하면서 부탁을 거절했어요","traps":["바쁘는","바쁘은","바쁠"],"en":"He pretended to be busy and refused the request."},{"prompt":"그는 부자가 아니다 + 부자이다","answer":"그는 부자가 아닌데 부자인 척했어요","traps":["부자은","부자이는","부자일"],"en":"He wasn't rich but pretended to be."}]},{"id":"g3-1","ch":3,"title":"A/V-(으)ㄹ걸(요)","form":"동사/형용사 + -(으)ㄹ걸(요) / 과거: -았/었을걸(요) / 명사 + 일걸(요)","rule":"듣는 사람과 다를 수 있는 가벼운 추측을 부드럽게 말할 때 쓴다.","m":["A soft guess: I think ~ / probably ~. It is often used to gently correct or disagree with what the listener said or assumed.","委婉的推测：我想……／大概……。常用来温和地纠正或反驳对方的话或想法。","委婉的推測：我想……／大概……。常用來溫和地糾正或反駁對方的話或想法。","การเดาเบา ๆ แบบนุ่มนวล: ฉันคิดว่า ~ / คงจะ ~ มักใช้แก้หรือแย้งสิ่งที่คู่สนทนาพูดหรือเข้าใจอย่างอ่อนโยน","Мягкое предположение: «думаю, ~» / «наверное, ~». Часто используется, чтобы мягко поправить или возразить собеседнику.","Phỏng đoán nhẹ nhàng: tôi nghĩ ~ / chắc là ~. Hay dùng để nhẹ nhàng đính chính hoặc không đồng ý với điều người nghe nói hoặc nghĩ."],"use":"Add -ㄹ걸요 to stems ending in a vowel or ㄹ and -을걸요 to consonant stems; past -았/었을걸요; nouns 일걸요. Drop 요 (-(으)ㄹ걸) with close friends. It is conversational and only for a guess, not for confirmed facts or for the speaker's own plan. It often answers someone else's assumption (아니에요, ~ -(으)ㄹ걸요) and sounds softer with 아마. Common mistake: using it in formal writing, with the speaker's own plan (✗ 저는 내일 갈걸요), or in a question.","ex":[{"ko":"지금 출발하면 길이 많이 막힐걸요.","t":["If you leave now, the road will probably be very congested.","现在出发的话，路上大概会很堵。","現在出發的話，路上大概會很堵。","ถ้าออกเดินทางตอนนี้ รถน่าจะติดมาก","Если выехать сейчас, на дороге, наверное, будут сильные пробки.","Nếu xuất phát bây giờ thì đường chắc sẽ rất tắc."]},{"ko":"그 영화는 벌써 끝났을걸요. 지금 가도 못 봐요.","t":["That film has probably already finished. You can't see it even if you go now.","那部电影大概已经结束了。现在去也看不到了。","那部電影大概已經結束了。現在去也看不到了。","หนังเรื่องนั้นคงจบไปแล้ว ไปตอนนี้ก็ดูไม่ทันแล้ว","Тот фильм, наверное, уже закончился. Сейчас не успеешь.","Bộ phim đó chắc đã hết rồi. Bây giờ đi cũng không xem được đâu."]}],"fills":[{"ko":"이 시간에는 그 식당이 이미 문을 닫았을걸요.","ans":"을걸요","en":"At this hour that restaurant has probably already closed.","wrong":["을 정도로","을 뻔했어요","왠지"]},{"ko":"아마 민수 씨는 벌써 집에 갔을걸요.","ans":"을걸요","en":"Minsu has probably already gone home.","wrong":["자는 바람에","칠 뻔했어요","연습할수록"]},{"ko":"이번 시험은 지난번보다 쉬울걸요.","ans":"울걸요","en":"This exam will probably be easier than last time.","wrong":["말했을 리가 없","칠 뻔했어요","미워할 리가 없"]},{"ko":"저 가수는 요즘 해외에서 더 인기가 많을걸요.","ans":"을걸요","en":"That singer is probably more popular abroad these days.","wrong":["봐서 그런지","워서 그런지","왠지"]},{"ko":"내일은 날씨가 추울걸요.","ans":"울걸요","en":"It will probably be cold tomorrow.","wrong":["외국인이라고 해서","어서 그런지","을 정도로"]},{"ko":"그 영화는 아이들이 보기에는 좀 무서울걸요.","ans":"울걸요","en":"That film is probably a bit scary for children.","wrong":["나는 바람에","알수록","칠 뻔했어요"]}],"tiles":[{"prompt":"지금 출발하다 + 길이 막히다","answer":"지금 출발하면 길이 막힐걸요","traps":["막히을걸요","막힐껄요","막히걸요"],"en":"If you leave now, the road will probably be jammed."},{"prompt":"그 영화 + 벌써 끝났다","answer":"그 영화는 벌써 끝났을걸요","traps":["끝나을걸요","끝났껄요","끝났걸요"],"en":"That film has probably already ended."},{"prompt":"선생님은 지금 + 안 계시다","answer":"선생님은 지금 안 계실걸요","traps":["계시을걸요","계실껄요","계시걸요"],"en":"The teacher is probably not here now."},{"prompt":"이번 시험은 + 지난번보다 쉽다","answer":"이번 시험은 지난번보다 쉬울걸요","traps":["쉽을걸요","쉬울껄요","쉽걸요"],"en":"This exam will probably be easier than last time."}]},{"id":"g3-2","ch":3,"title":"A/V-다고 (해서) -(으)ㄴ/는 것은 아니다","form":"형용사 -다고 해서 / 동사 -ㄴ/는다고 해서 / 명사 (이)라고 해서 + -(으)ㄴ/는 것은 아니다","rule":"앞의 일이 반드시 뒤의 결과로 이어지는 것은 아님을 나타낸다.","m":["Just because ~ does not mean ~. The first clause is a common assumption, and the second rejects the automatic conclusion.","并不是说……就一定……。前句是常见的想法，后句否定“理所当然”的结论。","並不是說……就一定……。前句是常見的想法，後句否定“理所當然”的結論。","ไม่ได้หมายความว่า ~ ก็จะ ~ เสมอไป ประโยคแรกเป็นความเชื่อทั่วไป ประโยคหลังปฏิเสธข้อสรุปที่ดูเหมือนจะเป็นไปโดยอัตโนมัติ","Из того, что ~, ещё не следует, что ~. Первая часть — распространённое мнение, вторая отвергает «автоматический» вывод.","Không phải cứ ~ là ~. Vế đầu là suy nghĩ phổ biến, vế sau phủ nhận kết luận mặc nhiên đó."],"use":"Form the quotation -다고 해서 (adjective -다고, verb -ㄴ/는다고, noun (이)라고; past -았/었다고) and end with -(으)ㄴ/는 것은 아니다 (in speech 건 아니에요). The first clause is a general assumption (비싸다고 해서 ...), and the ending means 'not necessarily', not 'definitely not'. 해서 can be dropped. Adding 반드시 / 꼭 / 항상 / 다 sounds natural. Common mistake: treating it as a complete negation, or putting a rule that nobody believes in the first clause.","ex":[{"ko":"값이 비싸다고 해서 반드시 품질이 좋은 것은 아니에요.","t":["Just because the price is high doesn't mean the quality is necessarily good.","价格贵不一定意味着质量好。","價格貴不一定意味著質量好。","ราคาแพงไม่ได้แปลว่าคุณภาพดีเสมอไป","Из того, что цена высока, не обязательно следует, что качество хорошее.","Giá đắt không nhất thiết là chất lượng tốt."]},{"ko":"인터넷에 나온 정보라고 해서 모두 사실인 것은 아니에요.","t":["Just because information is on the internet doesn't mean it is all true.","网上的信息并不都是真的。","網上的資訊並不都是真的。","ข้อมูลในอินเทอร์เน็ตไม่ได้เป็นความจริงทั้งหมด","Не вся информация в интернете — правда.","Thông tin trên mạng không phải cái nào cũng đúng."]}],"fills":[{"ko":"열심히 공부한다고 해서 모두 성적이 오르는 것은 아니에요.","ans":"공부한다고 해서","en":"Studying hard doesn't mean everyone's grades go up.","wrong":["잃어버리는 바람에","미워할 리가 없","을 정도로"]},{"ko":"책이 두껍다고 해서 내용이 어려운 것은 아니에요.","ans":"두껍다고 해서","en":"Just because a book is thick doesn't mean the content is hard.","wrong":["울 정도로","는 척했어요","먹을수록"]},{"ko":"외국인이라고 해서 한국 음식을 못 먹는 것은 아니에요.","ans":"외국인이라고 해서","en":"Being a foreigner doesn't mean you can't eat Korean food.","wrong":["릴 뻔했는데","겨 두세요","실패할 리가 없"]},{"ko":"나이가 많다고 해서 배울 수 없는 것은 아니에요.","ans":"많다고 해서","en":"Being old doesn't mean you can't learn.","wrong":["자는 바람에","는 척했어요","겨 두세요"]},{"ko":"인기가 많다고 해서 모두 좋은 영화인 것은 아니에요.","ans":"많다고 해서","en":"Being popular doesn't mean every film is a good one.","wrong":["울걸요","먹을수록","알수록"]},{"ko":"머리가 좋다고 해서 항상 일을 잘하는 것은 아니에요.","ans":"좋다고 해서","en":"Being smart doesn't mean you always do your work well.","wrong":["미워할 리가 없","기만 해","라서 그런지"]}],"tiles":[{"prompt":"값이 비싸다 + 좋다","answer":"값이 비싸다고 해서 좋은 것은 아니에요","traps":["비싼다고","비싸라고","좋는"],"en":"Just because the price is high doesn't mean it's good."},{"prompt":"오래 살다 + 한국어를 잘하다","answer":"오래 산다고 해서 한국어를 잘하는 것은 아니에요","traps":["사는다고","살다고","잘하은"],"en":"Living long somewhere doesn't mean you speak the language well."},{"prompt":"가수이다 + 노래를 잘하다","answer":"가수라고 해서 노래를 잘하는 것은 아니에요","traps":["가수이라고","가수다고","잘하은"],"en":"Being a singer doesn't mean you sing well."},{"prompt":"책이 두껍다 + 어렵다","answer":"책이 두껍다고 해서 어려운 것은 아니에요","traps":["두껍은다고","두꺼운다고","어렵은"],"en":"A thick book isn't necessarily difficult."}]},{"id":"g3-3","ch":3,"title":"V-아/어 두다","form":"동사 + -아/어 두다 (ㅏ·ㅗ 모음 -아 두다 / 그 외 -어 두다 / 하다 → 해 두다)","rule":"어떤 행동을 끝내고 그 결과를 그대로 유지해 둠을 나타낸다.","m":["To do something in advance and keep the result in place for later use.","事先做好某事，并把结果保持下去以备后用。","事先做好某事，並把結果保持下去以備後用。","ทำบางอย่างไว้ล่วงหน้าและคงผลลัพธ์นั้นไว้เพื่อใช้ภายหลัง","Сделать что-то заранее и сохранить результат на потом.","Làm sẵn việc gì đó trước và giữ nguyên kết quả để dùng về sau."],"use":"Attach -아 두다 to stems ending in ㅏ/ㅗ and -어 두다 to the others (사다 → 사 두다, 적다 → 적어 두다, 준비하다 → 준비해 두다). It is used for preparing something in advance (예매해 두다) or leaving a state as it is (창문을 열어 두다 'leave the window open'). It needs a verb whose result stays: 사다, 적다, 켜다, 열다, 예약하다. It is not used with verbs without a lasting result or with adjectives (✗ 학교에 가 두다). 두었다 is often shortened to 뒀다. Compare -아/어 놓다, which is almost the same and more colloquial.","ex":[{"ko":"시험 전에 중요한 단어를 노트에 적어 두세요.","t":["Before the exam, write down the important words in your notebook.","考试前，请把重要的单词记在笔记本上。","考試前，請把重要的單詞記在筆記本上。","ก่อนสอบ ช่วยจดคำศัพท์สำคัญไว้ในสมุดนะ","Перед экзаменом запишите важные слова в тетрадь.","Trước kỳ thi, hãy ghi những từ quan trọng vào vở."]},{"ko":"미리 영화표를 예매해 두었어요.","t":["I booked the film tickets in advance.","我提前订好了电影票。","我提前訂好了電影票。","ฉันจองตั๋วหนังไว้ล่วงหน้าแล้ว","Я заранее заказал билеты в кино.","Tôi đã đặt trước vé xem phim."]}],"fills":[{"ko":"손님이 오기 전에 음식을 만들어 두었어요.","ans":"어 두었어요","en":"I made the food before the guests came.","wrong":["와서 그런지","많다고 해서","들수록"]},{"ko":"냄새가 나니까 창문을 열어 두세요.","ans":"어 두세요","en":"It smells, so please leave the window open.","wrong":["와서 그런지","잃어버리는 바람에","끌 뻔했어요"]},{"ko":"중요한 서류는 잃어버리지 않게 따로 챙겨 두세요.","ans":"겨 두세요","en":"Put important documents aside so you don't lose them.","wrong":["을 정도로","라서 그런지","칠 뻔했어요"]},{"ko":"내일 아침에 먹을 빵을 사 두었어요.","ans":"사 두었어요","en":"I bought the bread to eat tomorrow morning.","wrong":["와서 그런지","뭔가","어딘가"]},{"ko":"이 비밀번호는 어딘가에 적어 두는 게 좋아요.","ans":"어 두는","en":"It's better to write this password down somewhere.","wrong":["울 정도로","릴 뻔했는데","두껍다고 해서"]},{"ko":"영화를 보기 전에 줄거리를 읽어 두면 이해하기 쉬워요.","ans":"어 두면","en":"If you read the plot before the film, it's easier to understand.","wrong":["워서 그런지","칠 뻔했어요","외국인이라고 해서"]}],"tiles":[{"prompt":"시험 전에 + 단어를 쓰다","answer":"시험 전에 단어를 써 두세요","traps":["쓰어","쓰고","써서"],"en":"Before the exam, write the words down."},{"prompt":"미리 + 표를 예약하다","answer":"미리 표를 예약해 두었어요","traps":["예약하","예약하고","예약했다"],"en":"I booked the tickets in advance."},{"prompt":"냄새가 나다 + 창문을 열다","answer":"냄새가 나니까 창문을 열어 두세요","traps":["열","열고","열어서"],"en":"It smells, so leave the window open."},{"prompt":"내일 먹을 빵 + 사다","answer":"내일 먹을 빵을 사 두었어요","traps":["사어","사고","사서"],"en":"I bought the bread to eat tomorrow."}]},{"id":"g4-1","ch":4,"title":"A/V-(으)ㄹ 정도로","form":"형용사/동사 + -(으)ㄹ 정도로","rule":"앞의 상태나 행동이 뒤의 결과나 상태에 이를 만큼 심하다는 것을 나타낸다.","m":["So ... that ...; to the extent that .... The first clause names a state or action, and the second gives a vivid result or image that shows how strong it is.","达到……的程度；……到……的地步。前句说明状态或动作，后句用具体的结果或形象来表现它有多强烈。","達到……的程度；……到……的地步。前句說明狀態或動作，後句用具體的結果或形象來表現它有多強烈。","ถึงขนาดที่…; …จนถึงขั้น… ประโยคแรกบอกสภาพหรือการกระทำ ส่วนประโยคหลังบอกผลหรือภาพที่เห็นชัดเพื่อแสดงว่ามันรุนแรงแค่ไหน","Настолько ..., что ...; до такой степени, что .... В первой части называется состояние или действие, во второй — наглядный результат или образ, показывающий, насколько оно сильно.","Đến mức ...; ... đến nỗi .... Vế trước nêu trạng thái hoặc hành động, vế sau nêu kết quả hay hình ảnh cụ thể cho thấy nó mạnh đến đâu."],"use":"Attach -ㄹ to a vowel stem and -을 to a consonant stem (ㄹ stems stay as they are: 울 정도로); for the past use -았/었을 정도로. The second clause is a concrete or exaggerated result (눈물이 날, 믿기 어려울, 숨이 막힐), so it is common in stories and complaints. It can also end a sentence: -(으)ㄹ 정도이다. Typical mistake: using it as a reason ('because'). 정도로 shows degree, not cause, and the second clause is a state or event, not a command or suggestion.","ex":[{"ko":"설문 조사 결과가 믿기 어려울 정도로 놀라웠어요.","t":["The survey results were so surprising that they were hard to believe.","调查结果令人惊讶，难以置信。","調查結果令人驚訝，難以置信。","ผลสำรวจน่าประหลาดใจจนเชื่อได้ยาก","Результаты опроса были настолько удивительными, что в них трудно поверить.","Kết quả khảo sát đáng ngạc nhiên đến mức khó tin."]},{"ko":"한국 사람들은 처음 만난 사람에게도 밥을 사 줄 정도로 정이 많아요.","t":["Koreans are so warm-hearted that they will even buy a meal for someone they have just met.","韩国人很重感情，对刚认识的人甚至会请吃饭。","韓國人很重感情，對剛認識的人甚至會請吃飯。","คนเกาหลีมีน้ำใจมาก ถึงขนาดเลี้ยงข้าวแม้แต่คนที่เพิ่งพบกันครั้งแรก","Корейцы такие душевные, что угощают обедом даже тех, кого видят впервые.","Người Hàn Quốc giàu tình cảm đến mức mời cơm cả người mới gặp lần đầu."]}],"fills":[{"ko":"시험이 포기하고 싶을 정도로 어려웠어요.","ans":"을 정도로","en":"The exam was so hard that I wanted to give up.","wrong":["들수록","는 척해서","먹을수록"]},{"ko":"그 영화는 눈물이 날 정도로 슬퍼요.","ans":"날 정도로","en":"That movie is so sad that I cry.","wrong":["칠 뻔했어요","와서 그런지","울걸요"]},{"ko":"우리 팀장님은 모두가 부러워할 정도로 일을 잘해요.","ans":"할 정도로","en":"Our team leader works so well that everyone envies her.","wrong":["자는 바람에","뭔가","는 척했어요"]},{"ko":"내 친구는 밤을 새울 정도로 게임을 좋아해요.","ans":"울 정도로","en":"My friend likes games so much that he stays up all night.","wrong":["어서 그런지","릴 뻔했는데","말했을 리가 없"]},{"ko":"사람이 너무 많아서 걸을 수 없을 정도로 붐볐어요.","ans":"을 정도로","en":"It was so crowded that you could hardly walk.","wrong":["알수록","을 뻔했어요","잃어버리는 바람에"]},{"ko":"요즘 한국 아이들은 쉴 시간이 없을 정도로 바빠요.","ans":"을 정도로","en":"These days Korean children are so busy that they have no time to rest.","wrong":["어 두면","쁜 척하면서","잃어버리는 바람에"]}],"tiles":[{"prompt":"눈물이 나다 + 슬프다","answer":"눈물이 날 정도로 슬퍼요.","traps":["난","정도에","정도를"],"en":"It is so sad that I could cry."},{"prompt":"숨이 막히다 + 덥다","answer":"숨이 막힐 정도로 더워요.","traps":["막히는","정도에","정도를"],"en":"It is so hot that I can hardly breathe."},{"prompt":"밤을 새우다 + 공부했다","answer":"밤을 새울 정도로 공부했어요.","traps":["새운","정도가","새워서"],"en":"I studied so hard that I stayed up all night."},{"prompt":"믿기 어렵다 + 놀랍다","answer":"믿기 어려울 정도로 놀라워요.","traps":["어려운","정도에","정도를"],"en":"It is so surprising that it is hard to believe."}]},{"id":"g4-2","ch":4,"title":"A/V-기만 하다","form":"동사/형용사 + -기만 하다","rule":"다른 행동은 하지 않고 그것만 한다는 뜻, 또는 다른 면은 없이 그 상태일 뿐이라는 뜻을 나타낸다.","m":["Only does ... (and nothing else); is nothing but .... The speaker stresses that one action or state is all there is, often as a complaint or a contrast.","只做……（别的什么都不做）；只是……。说话人强调只有这一个动作或状态，常带有抱怨或对比的语气。","只做……（別的什麼都不做）；只是……。說話人強調只有這一個動作或狀態，常帶有抱怨或對比的語氣。","ทำแต่…(และไม่ทำอย่างอื่น); เป็นแค่… ผู้พูดเน้นว่ามีการกระทำหรือสภาพเดียวเท่านั้น มักแฝงการบ่นหรือการเปรียบต่าง","Только делает ... (и ничего больше); только ... и всё. Говорящий подчёркивает, что есть лишь одно действие или состояние, часто с жалобой или противопоставлением.","Chỉ làm ... (và không làm gì khác); chỉ toàn ... mà thôi. Người nói nhấn mạnh chỉ có một hành động hoặc trạng thái, thường mang ý phàn nàn hoặc đối lập."],"use":"Attach -기만 to a verb or adjective stem and finish with a conjugated 하다: 먹기만 해요, 좋기만 하다, 놀기만 했어요. It often leads into a contrast: 듣기만 하고 말은 안 해요 (only listens, never speaks), 예쁘기만 하고 쓸모가 없어요. Compare N만 V: 책만 읽어요 limits the object (only books), while 읽기만 하다 limits the whole action (only reads, does nothing else). Do not mix it up with -기만 하면 ('as soon as / as long as you just ...').","ex":[{"ko":"요즘 아이들은 학원에 다니기만 하고 친구들과 놀 시간이 없어요.","t":["These days children just go to cram schools and have no time to play with friends.","现在的孩子只是上补习班，没有时间和朋友玩。","現在的孩子只是上補習班，沒有時間和朋友玩。","เด็กสมัยนี้เอาแต่ไปเรียนพิเศษ ไม่มีเวลาไปเล่นกับเพื่อน","Современные дети только ходят на дополнительные занятия, и у них нет времени играть с друзьями.","Trẻ em bây giờ chỉ đi học thêm, không có thời gian chơi với bạn."]},{"ko":"동생은 집에 오면 게임을 하기만 해서 걱정이에요.","t":["When my younger brother comes home he does nothing but play games, so I am worried.","弟弟一回家就只会打游戏，让我很担心。","弟弟一回家就只會打遊戲，讓我很擔心。","น้องชายพอกลับบ้านก็เอาแต่เล่นเกม ฉันเลยเป็นห่วง","Младший брат, приходя домой, только играет в игры, и я за него беспокоюсь.","Em trai tôi về nhà là chỉ chơi game nên tôi lo lắm."]}],"fills":[{"ko":"우리 아이는 스마트폰을 보기만 하고 책은 읽지 않아요.","ans":"기만 하","en":"My child only looks at the smartphone and does not read books.","wrong":["봐서 그런지","어딘가","나는 바람에"]},{"ko":"그 사람은 불평하기만 하고 아무것도 하려고 하지 않아요.","ans":"기만 하","en":"He only complains and does not try to do anything.","wrong":["끌 뻔했어요","어서 그런지","잃어버리는 바람에"]},{"ko":"시험 기간에는 외우기만 해서 이해한 것이 별로 없어요.","ans":"기만 해","en":"During exams I only memorised, so I understood very little.","wrong":["자는 바람에","읽을수록","어 두면"]},{"ko":"남편은 주말마다 텔레비전을 보기만 해요.","ans":"기만 해","en":"My husband only watches TV every weekend.","wrong":["들을수록","을걸요","어 두었어요"]},{"ko":"이 노트북은 크기만 하고 성능이 좋지 않아요.","ans":"기만 하","en":"This laptop is only big and its performance is not good.","wrong":["어려울 리가 없","칠 뻔했어요","많다고 해서"]},{"ko":"그는 계획을 말하기만 하고 실행하지는 않아요.","ans":"기만 하","en":"He only talks about plans and does not carry them out.","wrong":["을걸요","누군가","끌 뻔했어요"]}],"tiles":[{"prompt":"게임을 하다 + 공부는 안 하다","answer":"게임을 하기만 하고 공부는 안 해요.","traps":["하기가","하지만","하는만"],"en":"He only plays games and does not study."},{"prompt":"친구는 듣다 + 말은 안 하다","answer":"친구는 듣기만 하고 말은 안 해요.","traps":["듣기가","듣지만","듣는만"],"en":"My friend only listens and does not speak."},{"prompt":"이 가방은 예쁘다 + 불편하다","answer":"이 가방은 예쁘기만 하고 불편해요.","traps":["예쁘지만","예쁘기가","예쁜만"],"en":"This bag is only pretty and not comfortable."},{"prompt":"하루 종일 자다 + 일어나지 않다","answer":"하루 종일 자기만 하고 일어나지 않아요.","traps":["자기가","자지만","자는만"],"en":"He only sleeps all day and does not get up."}]},{"id":"g4-3","ch":4,"title":"뭔가 / 누군가 / 어딘가 / 언젠가 ~","form":"의문사 + -(인)가: 무엇→뭔가, 누구→누군가, 어디→어딘가, 언제→언젠가, 왜→왠지","rule":"무엇인지, 누구인지, 어디인지, 언제인지 분명하지 않거나 말하지 않을 때 쓴다.","m":["Something / someone / somewhere / some day: the thing, person, place or time is not clear or not specified. 왠지 means 'for some reason'.","某事 / 某人 / 某处 / 总有一天：不清楚或不具体说明是什么、谁、哪里、什么时候。왠지 的意思是“不知为什么”。","某事 / 某人 / 某處 / 總有一天：不清楚或不具體說明是什麼、誰、哪裡、什麼時候。왠지 的意思是“不知為什麼”。","บางสิ่ง / บางคน / บางแห่ง / สักวันหนึ่ง: ไม่ชัดเจนหรือไม่ระบุว่าเป็นอะไร ใคร ที่ไหน เมื่อไร ส่วน 왠지 แปลว่า 'ไม่รู้ทำไม'","Что-то / кто-то / где-то / когда-нибудь: предмет, человек, место или время неясны или не названы. 왠지 значит «почему-то».","Một cái gì đó / ai đó / đâu đó / một ngày nào đó: sự vật, người, nơi chốn hay thời gian không rõ hoặc không nói cụ thể. 왠지 nghĩa là 'không hiểu sao'."],"use":"These are question words + -인가 in contracted form: 무엇인가 → 뭔가 (무언가 in writing), 누구인가 → 누군가, 어디인가 → 어딘가, 언제인가 → 언젠가, 왜인지 → 왠지. They are used in statements and sit right before the verb or adjective: 뭔가 이상해요 (something is odd), 누군가 왔어요 (someone came). Particles are optional: 뭔가를, 누군가가, 어딘가에서. 언젠가 can point to the past ('once') or the future ('some day'). 왠지 goes with a feeling you cannot explain: 왠지 불안해요.","ex":[{"ko":"요즘 뭔가 새로운 취미를 시작하고 싶어요.","t":["Lately I want to start some new hobby.","最近想开始一个新的爱好。","最近想開始一個新的愛好。","ช่วงนี้อยากเริ่มงานอดิเรกใหม่ๆ สักอย่าง","В последнее время хочу начать какое-нибудь новое хобби.","Dạo này tôi muốn bắt đầu một sở thích mới nào đó."]},{"ko":"누군가 내 이름을 부르는 소리가 들려서 뒤를 돌아봤어요.","t":["I heard someone calling my name, so I turned around.","听到有人叫我的名字，我回头看了看。","聽到有人叫我的名字，我回頭看了看。","ได้ยินเสียงใครสักคนเรียกชื่อฉัน เลยหันไปมอง","Я услышал, как кто-то зовёт меня по имени, и обернулся.","Tôi nghe có ai đó gọi tên mình nên quay lại nhìn."]}],"fills":[{"ko":"이 방에는 뭔가 이상한 냄새가 나요.","ans":"뭔가","en":"There is some strange smell in this room.","wrong":["외국인이라고 해서","와서 그런지","해서 그런지"]},{"ko":"누군가 제 우산을 가져간 것 같아요.","ans":"누군가","en":"It seems that someone took my umbrella.","wrong":["멈추는 바람에","날 정도로","봐서 그런지"]},{"ko":"어딘가에 제 지갑을 두고 온 것 같은데 기억이 안 나요.","ans":"어딘가","en":"I think I left my wallet somewhere, but I cannot remember.","wrong":["들수록","연습할수록","잃어버리는 바람에"]},{"ko":"언젠가 꼭 제주도에서 살아 보고 싶어요.","ans":"언젠가","en":"Some day I definitely want to live on Jeju Island.","wrong":["는 척해서","라서 그런지","열었을 리가 없"]},{"ko":"왠지 오늘은 좋은 일이 생길 것 같아요.","ans":"왠지","en":"For some reason I feel something good will happen today.","wrong":["와서 그런지","어 두면","기만 해"]},{"ko":"시험을 앞두고 뭔가 불안해서 잠을 잘 수 없었어요.","ans":"뭔가","en":"Before the exam I felt uneasy about something and could not sleep.","wrong":["끌 뻔했어요","날 정도로","을걸요"]}],"tiles":[{"pr const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const W = DATA.words, G = Object.fromEntries(DATA.gram.map(g => [g.id, g]));
const LV = DATA.levels;
const today = () => new Date().toISOString().slice(0, 10);
let S = Object.assign({ done: {}, day: "", n: 0 }, store.get("k5b_course", {}));
if (S.day !== today()) { S.day = today(); S.n = 0; }
const save = () => store.set("k5b_course", S);

// ---------- sound (tiny synth, no files) ----------
let ac = null; const actx = () => ac || (ac = new (window.AudioContext || window.webkitAudioContext)());
function tone(f, t, d, type, v){ try { const c = actx(), o = c.createOscillator(), g = c.createGain(); o.type = type || "sine"; o.frequency.value = f; g.gain.setValueAtTime(v || .12, c.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t + d); o.connect(g).connect(c.destination); o.start(c.currentTime + t); o.stop(c.currentTime + t + d + .02); } catch (e) {} }
const sRight = () => { tone(660, 0, .12, "triangle"); tone(990, .09, .18, "triangle"); };
const sWrong = () => tone(180, 0, .25, "sawtooth", .07);
const sDone = () => [523, 659, 784, 1046].forEach((f, i) => tone(f, i * .1, .22, "triangle"));
function say(t){ try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "ko-KR"; u.rate = .9; speechSynthesis.speak(u); } catch (e) {} }

// ---------- tap a word for its meaning ----------
const GL = DATA.gloss;
function glWord(w){ const m = w.match(/^([^가-힣A-Za-z0-9]*)(.*?)([^가-힣A-Za-z0-9]*)$/), c = m[2]; return esc(m[1]) + (GL[c] ? `<span class="gw" data-w="${esc(c)}">${esc(c)}</span>` : esc(c)) + esc(m[3]); }
function gl(text, fill){
  let out = "", inUl = false, skip = false, done = false;
  for (const part of text.split(/(\[\[|\]\]|____| \+ )/)) {
    if (part === "[[") { if (fill != null && !done) { out += fill; skip = done = true; } else { out += '<span class="ul">'; inUl = true; } continue; }
    if (part === "]]") { if (skip) skip = false; else if (inUl) { out += "</span>"; inUl = false; } continue; }
    if (part === "____") { out += fill != null && !done ? (done = true, fill) : '<span class="blank">____</span>'; continue; }
    if (part === " + ") { out += ' <b style="color:var(--gold)">+</b> '; continue; }
    if (!skip) out += part.split(/(\s+)/).map(w => /^\s*$/.test(w) ? w : glWord(w)).join("");
  }
  return out;
}
const gpop = document.createElement("div"); gpop.id = "gpop"; gpop.hidden = true; document.body.appendChild(gpop);
let gOn = null;
function gHide(){ gpop.hidden = true; if (gOn) { gOn.classList.remove("on"); gOn = null; } }
document.addEventListener("click", e => {
  const el = e.target.closest(".gw"); if (!el) return gHide();
  e.stopPropagation(); if (gOn === el) return gHide();
  const g = GL[el.dataset.w]; if (gOn) gOn.classList.remove("on"); gOn = el; el.classList.add("on");
  gpop.innerHTML = `<b lang="ko">${esc(el.dataset.w)}</b>${esc(g[li()] || g[0])}`; gpop.hidden = false;
  const r = el.getBoundingClientRect(), w = gpop.offsetWidth;
  gpop.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
  gpop.style.top = (r.bottom + 8 + gpop.offsetHeight > innerHeight ? r.top - gpop.offsetHeight - 8 : r.bottom + 8) + "px";
}, true);
addEventListener("scroll", gHide, { passive: true });

// ---------- home: the path ----------
const KIND = { words: "새 단어", review: "복습", grammar: "문법", test: "테스트", final: "모의 퀴즈" };
const nextLevel = () => LV.find(l => !S.done[l.id]);
function renderHome(){
  $("#langs").innerHTML = [["en", "English"], ["zh", "简体"], ["zht", "繁體"], ["th", "ไทย"], ["ru", "Русский"], ["vi", "Tiếng Việt"]]
    .map(([c, n]) => `<button class="chip${c === lang ? " on" : ""}" data-l="${c}">${n}</button>`).join("");
  const nDone = LV.filter(l => S.done[l.id]).length;
  $("#stats").innerHTML = `<span><b>${nDone}</b> / ${LV.length} levels</span><span>·</span><span>오늘 <b>${S.n}</b>개</span><span>·</span><span>★ 단어 ${Object.keys(W).length} · ★ 문법 ${DATA.gram.length}</span>`;
  $("#allbar").style.width = (100 * nDone / LV.length) + "%";
  const nx = nextLevel();
  $("#cont").innerHTML = nx ? `<small>${nDone ? "이어서 하기 · Continue" : "시작하기 · Start"}</small><b>${esc(nx.title)}</b><span>${KIND[nx.kind]} · ${nx.kind === "final" ? "mock quiz" : "about 3 min"}</span>`
                            : `<small>완료!</small><b>🎉 코스 끝! All done</b><span>Tap any level to practise it again.</span>`;
  $("#cont").onclick = () => nx && startLevel(nx);
  let h = "", last = "";
  for (const l of LV) {
    const key = l.part + l.ch;
    if (key !== last) { h += `<div class="part">${l.part === "테스트" ? "테스트 · TESTS" : `${l.ch}과 ${l.part === "단어" ? "★ 단어 · WORDS" : "★ 문법 · GRAMMAR"}`}</div>`; last = key; }
    const st = S.done[l.id], isNext = nx && nx.id === l.id;
    h += `<button class="lv${st ? " done" : ""}${isNext ? " next" : ""}" data-id="${l.id}"><span class="ic">${st ? "✓" : isNext ? "▶" : ""}</span><span class="t">${esc(l.title)}<small>${KIND[l.kind]}${l.ids && l.kind === "words" ? " · " + l.ids.map(id => W[id].kr).join(", ") : ""}</small></span><span class="st">${st ? "★".repeat(st) : ""}</span></button>`;
  }
  $("#path").innerHTML = h;
  show("home");
  const n = document.querySelector(".lv.next"); if (n && !renderHome.scrolled) { renderHome.scrolled = true; }
}
$("#langs").onclick = e => { const b = e.target.closest("[data-l]"); if (!b) return; lang = b.dataset.l; store.set("k5b_lang", lang); renderHome(); };
$("#path").onclick = e => { const b = e.target.closest("[data-id]"); if (b) startLevel(LV.find(l => l.id === b.dataset.id)); };
function show(id){ for (const s of ["home", "lesson", "done"]) $("#" + s).classList.toggle("hidden", s !== id); window.scrollTo(0, 0); gHide(); }

// ---------- building a level's steps ----------
function pickTypes(ids, n){ return shuffle(ids.slice()).slice(0, n).map(id => ({ t: W[id].sw && Math.random() < .6 ? "swap" : "mean", id })); }
function stepsFor(l){
  if (l.kind === "words") return [...l.ids.map(id => ({ t: "learn", id })), ...shuffle(l.ids.map(id => ({ t: "mean", id }))), ...shuffle(l.ids.filter(id => W[id].sw).map(id => ({ t: "swap", id })))];
  if (l.kind === "review") return pickTypes(l.ids, 8);
  if (l.kind === "grammar") { const g = G[l.gid]; return [{ t: "gcard", gid: g.id }, ...g.fills.slice(0, 3).map((_, i) => ({ t: "fill", gid: g.id, i })), ...g.tiles.slice(0, 2).map((_, i) => ({ t: "tile", gid: g.id, i }))]; }
  if (l.kind === "test") return shuffle([...pickTypes(l.ids, 7), ...l.gids.flatMap(gid => [{ t: "fill", gid, i: 3 + Math.floor(Math.random() * Math.max(1, G[gid].fills.length - 3)) }, { t: "tile", gid, i: 2 + Math.floor(Math.random() * Math.max(1, G[gid].tiles.length - 2)) }])].map(s => s.t === "fill" && !G[s.gid].fills[s.i] ? { ...s, i: 0 } : s.t === "tile" && !G[s.gid].tiles[s.i] ? { ...s, i: 0 } : s));
  return [{ t: "final" }];
}
let R = null;
function startLevel(l){
  try { actx().resume(); } catch (e) {}
  R = { l, steps: stepsFor(l), i: 0, miss: 0, retried: new Set() };
  show("lesson"); step();
}
$("#quit").onclick = () => { R = null; renderHome(); };
function prog(){
  $("#lbar").style.width = (100 * R.i / R.steps.length) + "%";
  $("#lcnt").textContent = `${Math.min(R.i + 1, R.steps.length)} / ${R.steps.length}`;
}
function nextBtn(label){ $("#fbwrap").insertAdjacentHTML("beforeend", `<button class="next" id="nx">${esc(label || "다음 · Next")} →</button>`); $("#nx").onclick = () => { R.i++; R.i >= R.steps.length ? finish() : step(); }; }
function feedback(ok, html){
  $("#fbwrap").innerHTML = `<div class="fb ${ok ? "good" : "bad"} pop"><b>${ok ? "✔ 맞아요!" : "✖ 아쉬워요 — this one comes back later"}</b>${html}</div>`;
  (ok ? sRight : sWrong)(); nextBtn();
}
function wrong(){ const s = R.steps[R.i]; R.miss++; const k = JSON.stringify(s); if (!R.retried.has(k)) { R.retried.add(k); R.steps.push(Object.assign({}, s)); } }
const mOf = id => W[id].m[li()] || W[id].m[0];

// ---------- one step ----------
function step(){
  gHide(); prog(); $("#fbwrap").innerHTML = "";
  const s = R.steps[R.i], st = $("#stage");
  if (s.t === "learn") {
    const w = W[s.id];
    st.innerHTML = `<div class="ask">새 단어 · new word</div><div class="big pop" lang="ko">${esc(w.kr)}</div>
      <button class="say" id="sayb">🔊 듣기</button>
      <div class="meta">${esc(w.pos)} · ${esc(w.sec)}</div><div class="mean">${esc(mOf(s.id))}</div>
      ${w.ex ? `<div class="box" lang="ko">${esc(w.ex)}${w.exEn ? `<small>${esc(w.exEn)}</small>` : ""}</div>` : ""}
      ${w.sw ? `<div class="box"><span class="sent" style="font-size:17px">${gl(w.sw.s, `<span class="ans">${esc(w.sw.a)}</span>`)}</span><small>${esc(w.sw.en)}</small></div>` : ""}`;
    $("#sayb").onclick = () => say(w.kr); say(w.kr);
    return nextBtn("알겠어요 · Got it");
  }
  if (s.t === "gcard") {
    const g = G[s.gid];
    st.innerHTML = `<div class="ask">새 문법 · new grammar</div><div class="big pop" lang="ko" style="font-size:28px">${esc(g.title)}</div>
      <div class="mean">${esc(g.m[li()] || g.m[0])}</div><div class="box" lang="ko">${esc(g.form)}<small>${esc(g.rule)}</small></div>
      ${g.ex.map(e => `<div class="box"><span class="sent" style="font-size:17px">${gl(e.ko)}</span><small>${esc(e.t[li()] || e.t[0])}</small></div>`).join("")}
      <div class="meta">${esc(g.use)}</div>`;
    return nextBtn("알겠어요 · Got it");
  }
  if (s.t === "mean") {
    const w = W[s.id], pool = shuffle(Object.keys(W).filter(id => id !== s.id && W[id].m[li()] && W[id].m[li()] !== mOf(s.id)));
    const sameCh = pool.filter(id => W[id].ch === w.ch);
    const opts = shuffle([s.id, ...(sameCh.length >= 3 ? sameCh : pool).slice(0, 3)]);
    st.innerHTML = `<div class="ask">뜻이 뭐예요? · What does it mean?</div><div class="big" lang="ko">${esc(w.kr)}</div>
      <div class="opts">${opts.map((id, k) => `<button class="opt" data-id="${id}"><span class="n">${k + 1}</span><span>${esc(mOf(id))}</span></button>`).join("")}</div>`;
    st.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const ok = b.dataset.id === s.id;
      st.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.dataset.id === s.id) x.classList.add("right"); else if (x !== b) x.classList.add("dim"); x.insertAdjacentHTML("beforeend", `<span class="om" lang="ko">${esc(W[x.dataset.id].kr)}</span>`); });
      if (!ok) { b.classList.add("wrongpick"); wrong(); }
      feedback(ok, `<span lang="ko">${esc(w.kr)} — ${esc(mOf(s.id))}</span>${w.ex ? `<small lang="ko">${esc(w.ex)}</small>` : ""}`);
    });
    return;
  }
  if (s.t === "swap") {
    const w = W[s.id], q = w.sw, opts = shuffle([q.a, ...q.w]);
    st.innerHTML = `<div class="ask">밑줄 친 부분과 바꿔 쓸 수 있는 말은? · Which word can replace the underlined part?</div>
      <div class="sent">${gl(q.s)}</div><div class="opts">${opts.map((o, k) => `<button class="opt" data-o="${esc(o)}" lang="ko"><span class="n">${k + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
    st.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const ok = b.dataset.o === q.a;
      st.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.dataset.o === q.a) x.classList.add("right"); else if (x !== b) x.classList.add("dim");
        const g = GL[x.dataset.o]; const t = g ? (g[li()] || g[0]) : x.dataset.o === q.a ? mOf(s.id) : ""; if (t) x.insertAdjacentHTML("beforeend", `<span class="om">${esc(t)}</span>`); });
      if (!ok) { b.classList.add("wrongpick"); wrong(); }
      st.querySelector(".sent").innerHTML = gl(q.s, `<span class="ans">${esc(q.a)}</span>`);
      feedback(ok, `<span lang="ko">${esc(w.kr)} — ${esc(mOf(s.id))}</span><small>${esc(q.en)}</small>`);
    });
    return;
  }
  if (s.t === "fill") {
    const g = G[s.gid], f = g.fills[s.i], opts = shuffle([f.ans, ...f.wrong]);
    st.innerHTML = `<div class="ask">빈칸에 맞는 것은? · Which fits the blank? <b style="color:var(--gold)">${esc(g.title)}</b></div>
      <div class="sent">${gl(f.ko.replace(f.ans, "____"))}</div><div class="opts">${opts.map((o, k) => `<button class="opt" data-o="${esc(o)}" lang="ko"><span class="n">${k + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
    st.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const ok = b.dataset.o === f.ans;
      st.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.dataset.o === f.ans) x.classList.add("right"); else if (x !== b) x.classList.add("dim"); });
      if (!ok) { b.classList.add("wrongpick"); wrong(); }
      st.querySelector(".sent").innerHTML = gl(f.ko.replace(f.ans, "____"), `<span class="ans">${esc(f.ans)}</span>`);
      feedback(ok, `<small>${esc(f.en)}</small>`);
    });
    return;
  }
  if (s.t === "tile") {
    const g = G[s.gid], tq = g.tiles[s.i], chunks = tq.answer.split(" "), built = [];
    const tiles = shuffle([...chunks.map((c, k) => ({ c, k })), ...tq.traps.map((c, k) => ({ c, k: "x" + k }))]);
    st.innerHTML = `<div class="ask">이 문법으로 문장을 만드세요 · Build the sentence with <b style="color:var(--gold)">${esc(g.title)}</b></div>
      <div class="sent" style="font-size:18px">${gl(tq.prompt)}</div><div class="built" id="built"></div><div class="tiles" id="tiles">${tiles.map((t, j) => `<button class="tile" data-j="${j}" lang="ko">${esc(t.c)}</button>`).join("")}</div>`;
    const draw = () => { $("#built").innerHTML = built.map((j, p) => `<button class="tile" data-p="${p}" lang="ko">${esc(tiles[j].c)}</button>`).join(""); st.querySelectorAll("#tiles .tile").forEach(b => b.classList.toggle("used", built.includes(+b.dataset.j))); };
    $("#tiles").onclick = e => { const b = e.target.closest("[data-j]"); if (!b || $("#fbwrap").innerHTML) return; built.push(+b.dataset.j); draw(); if (built.length === chunks.length) check(); };
    $("#built").onclick = e => { const b = e.target.closest("[data-p]"); if (!b || $("#fbwrap").innerHTML) return; built.splice(+b.dataset.p, 1); draw(); };
    const check = () => {
      const ok = built.map(j => tiles[j].c).join(" ") === chunks.join(" ");
      if (!ok) wrong();
      feedback(ok, `<span lang="ko">${esc(tq.answer)}</span><small>${esc(tq.en)}</small>`);
    };
    return;
  }
  if (s.t === "final") {
    st.innerHTML = `<div class="ask">마지막 · last step</div><div class="big" style="font-size:28px">📝 모의 퀴즈 1–4과</div>
      <p class="meta" style="font-size:15px;line-height:1.6">A full practice test with only chapters 1–4: word meanings, collocations, wrong usage, grammar and dialogues. Practice mode gives feedback after every question.</p>`;
    $("#fbwrap").innerHTML = `<button class="next" id="gofinal">모의 퀴즈 시작 · Start the mock quiz →</button>`;
    $("#gofinal").onclick = () => { S.done[R.l.id] = 3; S.n++; save(); store.set("k5b_exam_ch", [1, 2, 3, 4]); store.set("k5b_exam_mode", "practice"); location.href = "exam.html"; };
  }
}

// ---------- end of a level ----------
function finish(){
  const stars = R.miss === 0 ? 3 : R.miss <= 2 ? 2 : 1;
  S.done[R.l.id] = Math.max(stars, S.done[R.l.id] || 0); S.n++; save(); sDone();
  const nx = nextLevel();
  const brk = S.n > 0 && S.n % 3 === 0;
  $("#endbox").innerHTML = `<div class="stars pop">${"★".repeat(stars)}<span style="opacity:.25">${"★".repeat(3 - stars)}</span></div>
    <h2>${stars === 3 ? "완벽해요! Perfect!" : stars === 2 ? "잘했어요! Well done!" : "끝까지 했어요! You finished it!"}</h2>
    <p>${esc(R.l.title)} · ${R.miss ? R.miss + " mistake" + (R.miss > 1 ? "s" : "") + ", all fixed" : "no mistakes"}</p>
    <p>오늘 <b style="color:var(--txt)">${S.n}</b> levels · ${LV.filter(l => S.done[l.id]).length} / ${LV.length} done</p>
    ${brk ? `<div class="brk">🧃 ${S.n} levels in a row. Take a 2-minute break: stand up, drink some water, then come back.</div>` : ""}
    ${nx ? `<button class="next" id="endnext">다음 레벨 · Next: ${esc(nx.title)} →</button>` : `<p>🎉 코스 끝! The whole course is done.</p>`}
    <button class="ghost" id="endhome">코스 지도 · Back to the path</button>`;
  show("done");
  if (nx) $("#endnext").onclick = () => startLevel(nx);
  $("#endhome").onclick = renderHome;
}
renderHome();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
