<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Korean 5B — 기말시험 연습</title>
<meta name="description" content="Sogang Korean 5B mock final exam: 5급 말하기 어휘·문법 + 대화, 39 questions, 60 points, a new test every time.">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="exam.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="5B 시험 연습">
<link rel="apple-touch-icon" href="icon-exam-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:#1c2740; --card2:#223052; --paper:#f7f4ec; --ink:#1d2230;
    --line:#2c3a5a; --txt:#eaf0fb; --dim:#96a3c2; --accent:#5b8cff; --gold:#ffcf5c; --good:#37d18f; --bad:#ff6b7a; --fire:#ff8a3d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Microsoft YaHei","PingFang SC","Leelawadee UI",Tahoma,Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -200px,#1b2747,transparent),linear-gradient(180deg,#0f1420,#0b0f18);color:var(--txt);min-height:100vh;overflow-x:hidden}
  .wrap{max-width:680px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--accent)}
  .hidden{display:none!important}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .home{border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--dim);text-decoration:none;font-size:14px}
  .top h1{font-size:19px;margin:0;flex:1}
  .iconbtn{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:16px}
  .chip{background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 12px;font-size:14px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .langs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
  .hero{background:linear-gradient(135deg,#23315a,#1a2440);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .hero h2{margin:0 0 4px;font-size:22px}
  .hero p{margin:0;color:var(--dim);font-size:14px;line-height:1.5}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:rgba(0,0,0,.18);border-radius:12px;padding:8px;text-align:center}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--dim)}
  .label{font-size:13px;color:var(--dim);margin:14px 0 6px}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mode{text-align:left;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2)}
  .mode b{display:block;font-size:16px}
  .mode small{color:var(--dim);font-size:12.5px;line-height:1.35;display:block;margin-top:3px}
  .mode.on{border-color:var(--accent);background:linear-gradient(135deg,rgba(91,140,255,.25),rgba(155,123,255,.18))}
  .chs{display:flex;flex-wrap:wrap;gap:6px}
  .go{display:block;width:100%;margin-top:18px;padding:16px;border:0;border-radius:16px;font-size:19px;font-weight:800;color:#fff;background:linear-gradient(135deg,#5b8cff,#8a6bff);box-shadow:0 10px 26px rgba(91,140,255,.35)}
  .go:disabled{opacity:.45}
  .note{color:var(--dim);font-size:12.5px;margin-top:14px;line-height:1.5}

  /* exam paper */
  .hud{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .prog{flex:1;height:10px;background:#0d1322;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),#7af0c0);transition:width .35s}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold);min-width:58px;text-align:right}
  .timer.low{color:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.5}}
  .combo{font-weight:800;color:var(--fire);min-width:44px;text-align:right}
  .paper{background:var(--paper);color:var(--ink);border-radius:14px;padding:18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);line-height:1.7}
  .sec{font-size:14.5px;font-weight:700;color:#3a3f52;border-bottom:1px dashed #cfc8b6;padding-bottom:8px;margin-bottom:12px}
  .qn{font-weight:800;margin-right:6px}
  .stem{font-size:18.5px;word-break:keep-all}
  .stem u{text-decoration-thickness:2px;text-underline-offset:4px}
  .box{border:1.6px solid #333;padding:10px 14px;margin:10px 0;display:flex;flex-wrap:wrap;gap:18px;justify-content:center;font-size:17px;font-weight:600}
  .bogi{border:1.4px solid #555;border-radius:10px;padding:10px 12px;margin:8px 0 12px;font-size:15.5px;background:#fffdf6}
  .opts{display:grid;gap:8px;margin-top:12px}
  .opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:#fff;border:1.5px solid #d7d0bf;border-radius:12px;padding:10px 12px;font-size:17px;color:var(--ink)}
  .opt .n{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #888;display:grid;place-items:center;font-size:13px;font-weight:700}
  .opt.sel{border-color:var(--accent);background:#e8eeff}
  .opt.sel .n{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt.right{border-color:var(--good);background:#dff7ec}
  .opt.wrong{border-color:var(--bad);background:#ffe6e9}
  .two{display:flex;gap:10px;margin-top:12px}
  .two .opt{justify-content:center}
  .blank{display:inline-block;min-width:110px;border-bottom:2px solid #333;margin:0 4px}
  input.ans,textarea.ans{width:100%;margin-top:12px;background:#fff;border:1.5px solid #c9c1ad;border-radius:10px;padding:10px 12px;font-size:17px;color:var(--ink)}
  textarea.ans{min-height:110px;resize:vertical;line-height:1.6}
  input.ans:focus,textarea.ans:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .dlg{margin:8px 0;font-size:16.5px}
  .dlg div{margin:3px 0}
  .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:12px}
  .mcol{display:grid;gap:8px;align-content:start}
  .mi{background:#fff;border:1.5px solid #d7d0bf;border-radius:10px;padding:9px 10px;font-size:16.5px;color:var(--ink);text-align:left;position:relative}
  .mi.sel{border-color:var(--accent);background:#e8eeff}
  .mi .tag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;border-radius:999px;padding:1px 7px;color:#fff}
  .mi.right{border-color:var(--good);background:#dff7ec}
  .mi.wrong{border-color:var(--bad);background:#ffe6e9}
  .fb{margin-top:12px;border-radius:12px;padding:10px 12px;background:#efe9da;font-size:15px;line-height:1.55}
  .fb .h{font-weight:800}
  .fb.good .h{color:#178a58}.fb.bad .h{color:#c23a4b}
  .model{white-space:pre-wrap;background:#fff;border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;margin-top:6px}
  .marks{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .marks button{flex:1;min-width:90px;padding:10px;border-radius:10px;border:1.5px solid #bdb5a2;background:#fff;color:var(--ink);font-weight:700}
  .marks button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .nav{display:flex;gap:10px;margin-top:12px}
  .nav button{flex:1;padding:13px;border-radius:14px;border:0;font-weight:800;font-size:16px}
  .nav .prev{background:var(--bg2);border:1px solid var(--line)}
  .nav .next{background:var(--accent);color:#fff}
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
  .dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);font-size:12px;color:var(--dim)}
  .dot.done{background:#2a3a63;color:var(--txt)}
  .dot.cur{outline:2px solid var(--gold)}
  .override{margin-top:8px;font-size:13.5px;background:none;border:1px dashed #9a927d;border-radius:8px;padding:6px 10px;color:#5b5440}
  /* results */
  .score{text-align:center;margin:8px 0}
  .score .big{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#ffcf5c,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .score .of{color:var(--dim);font-size:18px}
  .grade{text-align:center;font-size:20px;font-weight:800;margin-top:2px}
  .rows{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .row:first-child{border-top:0}
  .row b{font-variant-numeric:tabular-nums}
  .ghost{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);font-weight:700;font-size:16px}
  .float{position:fixed;pointer-events:none;font-weight:900;font-size:24px;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.6);z-index:30;animation:rise 1s ease-out forwards}
  @keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:29}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <a class="home" href="index.html">← 5B</a>
    <h1>📝 기말시험 연습 <span style="color:var(--dim);font-weight:500;font-size:14px">· Mock final</span></h1>
    <button class="iconbtn" id="mute">🔊</button>
  </div>

  <section id="start">
    <div class="langs" id="langs"></div>
    <div class="hero">
      <h2>5급 말하기 · 어휘·문법 / 대화</h2>
      <p id="tIntro"></p>
      <div class="stats">
        <div class="stat"><b id="sTests">0</b><span id="tTests"></span></div>
        <div class="stat"><b id="sBest">–</b><span id="tBest"></span></div>
        <div class="stat"><b id="sLast">–</b><span id="tLast"></span></div>
      </div>
    </div>
    <div class="label" id="tMode"></div>
    <div class="modes" id="modes"></div>
    <div class="label" id="tCh"></div>
    <div class="chs" id="chs"></div>
    <button class="go" id="go"></button>
    <p class="note" id="tNote"></p>
  </section>

  <section id="exam" class="hidden">
    <div class="hud">
      <button class="iconbtn" id="quit">✕</button>
      <div class="prog"><i id="progFill"></i></div>
      <div class="combo hidden" id="combo">🔥0</div>
      <div class="timer" id="timer"></div>
    </div>
    <div class="paper" id="paper"></div>
    <div class="nav">
      <button class="prev" id="prev">←</button>
      <button class="next" id="next"></button>
    </div>
    <div class="dots" id="dots"></div>
  </section>

  <section id="mark" class="hidden"></section>
  <section id="result" class="hidden"></section>
</div>

<script>
const DATA = {"chapters":[{"n":1,"title":"1과"},{"n":2,"title":"2과"},{"n":3,"title":"3과"},{"n":4,"title":"4과"},{"n":5,"title":"5과"},{"n":6,"title":"6과"},{"n":7,"title":"7과"},{"n":8,"title":"8과"}],"words":[{"kr":"가요계","ch":1,"s":"요즘 [[대중이 즐겨 듣는 노래를 만들고 부르는 사람들의 세계]]가 해외에서도 큰 관심을 받고 있어요.","a":"가요계","w":["장르","대사","증거"],"en":"These days the pop music industry is getting a lot of attention overseas too.","gl":"the music industry (pop music scene)"},{"kr":"근본적","ch":1,"s":"그 문제를 해결하려면 [[가장 밑바탕이 되는]] 원인부터 찾아야 해요.","a":"근본적인","w":["격렬한","열악한","허술한"],"en":"To solve that problem, you have to find the fundamental cause first.","gl":"fundamental"},{"kr":"논란","ch":1,"s":"새 영화 때문에 사람들 사이에서 [[서로 다른 의견으로 시끄러운 다툼]]이 일어났어요.","a":"논란","w":["집착","만족","지능"],"en":"The new movie caused a controversy among people.","gl":"controversy"},{"kr":"동시","ch":1,"s":"친구와 저는 [[같은 때]]에 도착했어요.","a":"동시","w":["후반부","수준","등급"],"en":"My friend and I arrived at the same time.","gl":"same time; simultaneity"},{"kr":"립싱크","ch":1,"s":"그 가수는 무대에서 [[소리는 틀어 놓고 입만 움직이는 일]] 때문에 비난을 받았어요.","a":"립싱크","w":["대사","장사","달리기"],"en":"That singer was criticized for lip-syncing on stage.","gl":"lip-sync"},{"kr":"말솜씨","ch":1,"s":"그 사람은 [[말을 잘하는 재주]]가 대단해서 모두가 이야기를 즐겁게 들어요.","a":"말솜씨","w":["달리기","대사","장르"],"en":"He has such a way with words that everyone enjoys listening to him.","gl":"way with words; speaking skill"},{"kr":"오락","ch":1,"s":"저는 퇴근 후에 [[재미있게 놀면서 기분을 푸는]] 프로그램을 보며 쉬어요.","a":"오락","w":["장르","등급","달리기"],"en":"After work I relax by watching entertainment programs.","gl":"entertainment"},{"kr":"증거","ch":1,"s":"경찰은 범인이 그 사람이라는 [[사실을 확실하게 보여 주는 자료]]를 찾았어요.","a":"증거","w":["일자리","달리기","대사"],"en":"The police found evidence that he is the culprit.","gl":"evidence; proof"},{"kr":"가꾸다","ch":1,"s":"그 배우는 매일 운동을 하면서 외모를 [[예쁘게 손질하며 돌봐요]].","a":"가꿔요","w":["자랑해요","홍보해요","선호해요"],"en":"That actor works out every day and takes care of his appearance.","gl":"to take care of; to cultivate"},{"kr":"끊이다","ch":1,"s":"그 집은 가족들의 웃음소리가 [[그치지 않아요]].","a":"끊이지 않아요","w":["괴로워하지 않아요","훌쩍거리지 않아요","착각하지 않아요"],"en":"Laughter never stops in that house.","gl":"to be cut off; to cease"},{"kr":"맞추다","ch":1,"s":"음악에 [[박자를 똑같이 하여]] 춤을 췄어요.","a":"맞춰","w":["가꿔","키워","보태"],"en":"I danced in time with the music.","gl":"to match; to fit to; to adjust"},{"kr":"선호하다","ch":1,"s":"저는 영화관에서 보는 것보다 집에서 보는 것을 [[다른 것보다 더 좋아해요]].","a":"선호해요","w":["자랑해요","홍보해요","착각해요"],"en":"I prefer watching at home over watching at the cinema.","gl":"to prefer"},{"kr":"열창하다","ch":1,"s":"그 가수는 무대에서 [[온 힘을 다해 노래를 불렀어요]].","a":"열창했어요","w":["출연했어요","홍보했어요","자랑했어요"],"en":"The singer sang passionately on stage.","gl":"to sing passionately"},{"kr":"자랑하다","ch":1,"s":"그는 새 차를 사서 친구들에게 [[뽐내며 보여 줬어요]].","a":"자랑했어요","w":["선호했어요","착각했어요","홍보했어요"],"en":"He bought a new car and showed it off to his friends.","gl":"to boast; to show off"},{"kr":"출연하다","ch":1,"s":"그 배우는 새 드라마에 [[배역을 맡아 나왔어요]].","a":"출연했어요","w":["괴로워했어요","열창했어요","홍보했어요"],"en":"The actor appeared in a new drama.","gl":"to appear (on a show or film)"},{"kr":"키우다","ch":1,"s":"저는 영어 실력을 [[더 높게 만들려고]] 매일 공부해요.","a":"키우려고","w":["자랑하려고","홍보하려고","선호하려고"],"en":"I study every day to build up my English skills.","gl":"to raise; to grow; to build up"},{"kr":"홍보하다","ch":1,"s":"회사는 새 제품을 사람들에게 [[널리 알리려고]] 광고를 만들었어요.","a":"홍보하려고","w":["선호하려고","착각하려고","맞추려고"],"en":"The company made an ad to promote its new product.","gl":"to promote; to publicize"},{"kr":"격렬하다","ch":1,"s":"경기가 너무 [[세고 거칠어서]] 선수들이 많이 다쳤어요.","a":"격렬해서","w":["순수해서","뻔해서","어색해서"],"en":"The match was so intense that many players got hurt.","gl":"intense; fierce"},{"kr":"뛰어나다","ch":1,"s":"그 학생은 노래 실력이 [[다른 사람들보다 훨씬 훌륭해서]] 대회에서 일등을 했어요.","a":"뛰어나서","w":["열악해서","어색해서","허술해서"],"en":"The student's singing is outstanding, so she won first place in the contest.","gl":"outstanding; excellent"},{"kr":"열악하다","ch":1,"s":"이 공장은 작업 환경이 [[매우 나쁘고 좋지 않아서]] 직원들이 자주 아파요.","a":"열악해서","w":["뛰어나서","순수해서","어색해서"],"en":"The working conditions at this factory are poor, so 무례하게","가볍게"],"en":"The foreigner spoke Korean so fluently that everyone was surprised.","gl":"fluent"},{"kr":"흔히","ch":7,"s":"한국 식당에서는 직원을 '이모'라고 [[어디에서나 쉽게 볼 수 있을 만큼 자주]] 불러요.","a":"흔히","w":["심지어","마주","여러모로"],"en":"In Korean restaurants, people commonly call the staff \"aunt\".","gl":"commonly; often"},{"kr":"배워도 배워도 끝이 없다","ch":7,"s":"한국어는 공부할수록 [[공부할 내용이 계속 새로 나온다는]] 말이 맞아요.","a":"배워도 배워도 끝이 없다는","w":["숨통이 트인다는","믿는 구석이 있다는","잘돼 간다는"],"en":"The saying that there is no end to learning is true of Korean.","gl":"No matter how much you learn, there is no end."},{"kr":"뭐니 뭐니 해도","ch":7,"s":"[[무슨 말을 하더라도 결국에는]] 건강이 제일 중요해요.","a":"뭐니 뭐니 해도","w":["흔히","심지어","여러모로"],"en":"Whatever anyone says, health is the most important thing.","gl":"after all; above all; whatever anyone says"},{"kr":"선생(님)","ch":7,"s":"한국어 수업에서는 학생들이 저를 [[학생을 가르치는 사람을 높여 이르는 말]]이라고 불러요.","a":"선생님","w":["사모님","손님","아가씨"],"en":"In Korean class, the students call me \"teacher\".","gl":"teacher; Mr./Ms. (respectful, for a teacher or senior)"},{"kr":"사모님","ch":7,"s":"저는 교수님 댁에 가서 [[교수님의 아내를 높여 이르는 말]]께 인사드렸어요.","a":"사모님","w":["선생님","손님","따님"],"en":"I went to the professor's house and greeted his wife.","gl":"Mrs. (respectful title for a senior's wife or a married woman)"},{"kr":"자제 분","ch":7,"s":"사장님, [[사장님의 아이를 높여 이르는 말]]은 올해 몇 학년이에요?","a":"자제분","w":["사모님","손님","선생님"],"en":"Sir, what grade is your child in this year?","gl":"your child (honorific, to a superior)"},{"kr":"그쪽","ch":7,"s":"모르는 사람에게 '[[상대방이 있는 쪽을 가리켜 그 사람을 부르는 말]]' 하고 부르면 어색할 수 있어요.","a":"그쪽","w":["손님","아가씨","아줌마"],"en":"Calling a stranger \"you over there\" can sound awkward.","gl":"you over there (to a stranger)"},{"kr":"당신","ch":7,"s":"낯선 사람에게 [[상대를 가리켜 이르는 말인데 기분 나쁘게 들릴 수 있는 말]]이라고 하면 싸움이 날 수 있어요.","a":"당신","w":["손님","아가씨","저기요"],"en":"If you say \"you\" to a stranger, it can start a fight because it may sound rude.","gl":"you (to a stranger; can sound rude)"},{"kr":"손님","ch":7,"s":"가게 직원은 물건을 사러 온 사람을 '[[가게나 집에 찾아온 사람]]' 하고 불러요.","a":"손님","w":["사모님","아줌마","선생님"],"en":"Shop staff call a person who comes to buy things \"customer\".","gl":"customer; guest"},{"kr":"아가씨","ch":7,"s":"가게에서 젊은 여자 손님을 [[결혼하지 않은 젊은 여자를 부르는 말]]이라고 부르는 사람도 있어요.","a":"아가씨","w":["사모님","손님","따님"],"en":"Some people at shops call a young female customer \"miss\".","gl":"young woman; miss (to a young stranger)"},{"kr":"언니","ch":7,"s":"식당에서 젊은 여자 직원을 '[[원래는 여자가 친누나를 부르는 말인데 친근하게 쓰는 말]]' 하고 부르는 사람도 있어요.","a":"언니","w":["아가씨","사모님","손님"],"en":"In restaurants some people call a young female employee \"unni\" in a friendly way.","gl":"older sister (female speaker); friendly title for a woman"},{"kr":"저기요","ch":7,"s":"식당에서 직원을 부를 때 이름을 모르면 '[[모르는 사람의 주의를 끌려고 쓰는 말]]!' 하고 불러요.","a":"저기요","w":["손님","당신","아가씨"],"en":"When you do not know a restaurant employee's name, you call out \"excuse me!\".","gl":"Excuse me! (calling someone's attention)"},{"kr":"아가씨","ch":7,"s":"오빠의 아내는 저를 [[남편의 결혼하지 않은 여동생을 아내가 부르는 말]]로 불러요.","a":"아가씨","w":["사모님","손님","따님"],"en":"My older brother's wife calls me by the title for a husband's unmarried younger sister.","gl":"husband's unmarried younger sister (said by wife)"},{"kr":"언니","ch":7,"s":"저는 [[자기보다 나이 많은 여자 형제를 여자가 부르는 말]]에게 고민을 자주 이야기해요.","a":"언니","w":["아가씨","사모님","손님"],"en":"I often talk about my worries to my older sister.","gl":"older sister (female speaker)"},{"kr":"강의록","ch":7,"s":"수업에 못 간 친구가 [[교수님의 강의 내용을 글로 적어 놓은 것]]을 빌려 달라고 했어요.","a":"강의록","w":["문화권","배경","비웃음"],"en":"A friend who missed class asked to borrow the lecture notes.","gl":"lecture notes"},{"kr":"남미","ch":7,"s":"저는 [[아메리카 대륙의 남쪽 지역]]에 가서 탱고를 배우고 싶어요.","a":"남미","w":["지중해","문화권","배경"],"en":"I want to go to South America and learn the tango.","gl":"South America"},{"kr":"동그라미","ch":7,"s":"선생님이 맞는 답에 [[둥글게 그린 표시]]를 쳐 주셨어요.","a":"동그라미","w":["남미","지중해","부"],"en":"The teacher drew a circle around the correct answers.","gl":"circle"},{"kr":"동성연애","ch":7,"s":"그 나라에서는 [[같은 성별인 사람끼리 사랑하는 일]]에 대해 법이 바뀌었어요.","a":"동성연애","w":["몸짓언어","포옹","비웃음"],"en":"In tha 부자가 아니다 + 부자이다","a":"그는 부자가 아닌데 부자인 척했어요","en":"He wasn't rich but pretended to be."},{"g":"g2-3","ch":2,"title":"A/V-(으)ㄴ/는 척하다","p":"그는 일본어를 못하다 + 잘하다","a":"그는 일본어를 못하는데 잘하는 척했어요","en":"He couldn't speak Japanese but pretended he could."},{"g":"g2-3","ch":2,"title":"A/V-(으)ㄴ/는 척하다","p":"선생님은 안 보다 + 다 보고 계시다","a":"선생님은 안 보는 척하고 다 보고 계셨어요","en":"The teacher pretended not to look but was seeing everything."},{"g":"g2-3","ch":2,"title":"A/V-(으)ㄴ/는 척하다","p":"괜찮다 + 사실은 많이 아프다","a":"괜찮은 척했지만 사실은 많이 아팠어요","en":"I pretended to be fine, but in fact it hurt a lot."},{"g":"g2-4","ch":2,"title":"V-는 둥 마는 둥 (하다)","p":"너무 졸리다 + 수업을 듣다","a":"너무 졸려서 수업을 듣는 둥 마는 둥 했어요","en":"I was so sleepy that I half-listened to the class."},{"g":"g2-4","ch":2,"title":"V-는 둥 마는 둥 (하다)","p":"걱정이 되다 + 점심을 먹다","a":"걱정이 되어서 점심을 먹는 둥 마는 둥 했어요","en":"I was worried, so I barely ate lunch."},{"g":"g2-4","ch":2,"title":"V-는 둥 마는 둥 (하다)","p":"시험 전날이다 + 잠을 자다","a":"시험 전날이라서 잠을 자는 둥 마는 둥 했어요","en":"It was the night before the exam, so I hardly slept."},{"g":"g2-4","ch":2,"title":"V-는 둥 마는 둥 (하다)","p":"바쁘다 + 청소를 하고 나가다","a":"바빠서 청소를 하는 둥 마는 둥 하고 나갔어요","en":"I was busy, so I half-cleaned and went out."},{"g":"g2-4","ch":2,"title":"V-는 둥 마는 둥 (하다)","p":"영화를 보다 + 휴대폰만 보다","a":"영화를 보는 둥 마는 둥 하고 휴대폰만 봤어요","en":"I half-watched the film and only looked at my phone."},{"g":"g2-4","ch":2,"title":"V-는 둥 마는 둥 (하다)","p":"인사를 하다 + 지나가다","a":"인사를 하는 둥 마는 둥 하고 지나갔어요","en":"He half-greeted me and passed by."},{"g":"g2-4","ch":2,"title":"V-는 둥 마는 둥 (하다)","p":"샤워를 하다 + 자다","a":"샤워를 하는 둥 마는 둥 하고 잤어요","en":"I barely showered and went to sleep."},{"g":"g2-4","ch":2,"title":"V-는 둥 마는 둥 (하다)","p":"내 이야기를 듣다 + 딴짓을 하다","a":"내 이야기를 듣는 둥 마는 둥 하고 딴짓을 했어요","en":"He half-listened to me and did something else."},{"g":"g2-5","ch":2,"title":"A/V-답니다","p":"옛날에 마음씨 고운 오누이가 + 살다","a":"옛날에 마음씨 고운 오누이가 살았답니다","en":"Long ago, a kind-hearted brother and sister lived."},{"g":"g2-5","ch":2,"title":"A/V-답니다","p":"흥부는 가난하다 + 마음은 착하다","a":"흥부는 가난하지만 마음은 착하답니다","en":"Heungbu is poor, but his heart is kind."},{"g":"g2-5","ch":2,"title":"A/V-답니다","p":"놀부는 욕심이 많다 + 흥부를 쫓아내다","a":"놀부는 욕심이 많아서 흥부를 쫓아냈답니다","en":"Nolbu was greedy, so he drove Heungbu out."},{"g":"g2-5","ch":2,"title":"A/V-답니다","p":"제비가 박씨를 물다 + 흥부에게 주다","a":"제비가 박씨를 물어다 흥부에게 주었답니다","en":"A swallow brought a gourd seed and gave it to Heungbu."},{"g":"g2-5","ch":2,"title":"A/V-답니다","p":"청개구리는 엄마 말을 안 듣다 + 나중에 후회하다","a":"청개구리는 엄마 말을 안 듣다가 나중에 후회했답니다","en":"The green frog didn't listen to his mother and regretted it later."},{"g":"g2-5","ch":2,"title":"A/V-답니다","p":"오누이는 호랑이를 피하다 + 하늘로 올라가다","a":"오누이는 호랑이를 피해 하늘로 올라갔답니다","en":"The siblings escaped the tiger and went up to the sky."},{"g":"g2-5","ch":2,"title":"A/V-답니다","p":"오누이는 하늘에 가다 + 해님과 달님이 되다","a":"오누이는 하늘에 가서 해님과 달님이 되었답니다","en":"The siblings went to the sky and became the Sun and the Moon."},{"g":"g2-5","ch":2,"title":"A/V-답니다","p":"이 연못 + 개구리가 많이 살다","a":"이 연못에는 개구리가 많이 산답니다","en":"They say many frogs live in this pond."},{"g":"g3-1","ch":3,"title":"A/V-(으)ㄹ걸(요)","p":"지금 출발하다 + 길이 막히다","a":"지금 출발하면 길이 막힐걸요","en":"If you leave now, the road will probably be jammed."},{"g":"g3-1","ch":3,"title":"A/V-(으)ㄹ걸(요)","p":"그 영화 + 벌써 끝났다","a":"그 영화는 벌써 끝났을걸요","en":"That film has probably already ended."},{"g":"g3-1","ch":3,"title":"A/V-(으)ㄹ걸(요)","p":"김 선생님은 지금 + 사무실에 안 계시다","a":"김 선생님은 지금 사무실에 안 계실걸요","en":"Mr. Kim is probably not in the office now."},{"g":"g3-1","ch":3,"title":"A/V-(으)ㄹ걸(요)","p":"이번 시험은 + 지난번보다 쉽다","a":"이번 시험은 지난번보다 쉬울걸요","en":"This exam will probably be easier than last time."},{"g":"g3-1","ch":3,"title":"A/V-(으)ㄹ걸(요)","p":"저 사람은 + 가수이다","a":"저 사람은 아마 가수일걸요","en":"That person is probably a singer."},{"g":"g3-1","ch":3,"title":"A/V-(으)ㄹ걸(요)","p":"내일은 + 날씨가 춥다","a":"내일은 날씨가 추울걸요","en":"It will probably be cold tomorrow."},{"g":"g3-1","ch":3,"title":"A/V-(으)ㄹ걸(요)","p":"친구가 + 지금쯤 도착했다","a":"친구가 지금쯤 도착했을걸요","en":"My friend has probably arrived by now."},{"g":"g3-1","ch":3,"title":"A/V-(으)ㄹ걸(요)","p":"아이들에게는 + 그 영화가 좀 무섭다","a":"아이들에게는 그 영화가 좀 무서울걸요","en":"That film is probably a bit scary for children."},{"g":"g3-2","ch":3,"title":"A/V-다고 (해서) -(으)ㄴ/는 것은 아니다","p":"값이 비싸다 + 품질이 좋다","a":"값이 비싸다고 해서 품질이 좋은 것은 아니에요","en":"Just because the price is high doesn't mean the quality is good."},{"g":"g3-2","ch":3,"title":"A/V-다고 (해서) -(으)ㄴ/는 것은 아니다","p":"한국에 오래 살다 + 한국어를 잘하다","a":"한국에 오래 산다고 해서 한국어를 잘하는 것은 아니에요","en":"Living in Korea a long time doesn't mean you speak Korean well."},{"g":"g3-2","ch":3,"title":"A/V-다고 (해서) -(으)ㄴ/는 것은 아니다","p":"유명한 가수이다 + 노래를 다 잘하다","a":"유명한 가수라고 해서 노래를 다 잘하는 것은 아니에요","en":"Being a famous singer doesn't mean you sing everything well."},{"g":"g3-2","ch":3,"title":"A/V-다고 (해서) -(으)ㄴ/는 것은 아니다","p":"책이 두껍다 + 내용이 어렵다","a":"책이 두껍다고 해서 내용이 어려운 것은 아니에요","en":"A thick book doesn't necessarily have difficult content."},{"g":"g3-2","ch":3,"title":"A/V-다고 (해서) -(으)ㄴ/는 것은 아니다","p":"열심히 공부하다 + 성적이 오르다","a":"열심히 공부한다고 해서 성적이 오르는 것은 아니에요","en":"Studying hard doesn't mean your grades always go up."},{"g":"g3-2","ch":3,"title":"A/V-다고 (해서) -(으)ㄴ/는 것은 아니다","p":"머리가 좋다 + 항상 일을 잘하다","a":"머리가 좋다고 해서 항상 일을 잘하는 것은 아니에요","en":"Being smart doesn't mean you always work well."},{"g":"g3-2","ch":3,"title":"A/V-다고 (해서) -(으)ㄴ/는 것은 아니다","p":"나이가 많다 + 배울 수 없다","a":"나이가 많다고 해서 배울 수 없는 것은 아니에요","en":"Being old doesn't mean you can't learn."},{"g":"g3-2","ch":3,"title":"A/V-다고 (해서) -(으)ㄴ/는 것은 아니다","p":"전래 동화이다 + 아이들만 읽다","a":"전래 동화라고 해서 아이들만 읽는 것은 아니에요","en":"Being a folk tale doesn't mean only children read it."},{"g":"g3-3","ch":3,"title":"V-아/어 두다","p":"시험 전에 + 단어를 노트에 적다","a":"시험 전에 단어를 노트에 적어 두세요","en":"Before the exam, write the words down in your notebook."},{"g":"g3-3","ch":3,"title":"V-아/어 두다","p":"미리 + 영화표를 예매하다","a":"미리 영화표를 예매해 두었어요","en":"I booked the film tickets in advance."},{"g":"g3-3","ch":3,"title":"V-아/어 두다","p":"냄새가 나다 + 창문을 열다","a":"냄새가 나니까 창문을 열어 두세요","en":"It smells, so leave the window open."},{"g":"g3-3","ch":3,"title":"V-아/어 두다","p":"내일 아침에 먹을 빵 + 사다","a":"내일 아침에 먹을 빵을 사 두었어요","en":"I bought the bread to eat tomorrow morning."},{"g":"g3-3","ch":3,"title":"V-아/어 두다","p":"친구 선물 + 미리 포장하다","a":"친구 선물을 미리 포장해 두었어요","en":"I wrapped my friend's present in advance."},{"g":"g3-3","ch":3,"title":"V-아/어 두다","p":"짐 + 문 앞에 놓다","a":"짐은 문 앞에 놓아 두세요","en":"Please leave the luggage in front of the door."},{"g":"g3-3","ch":3,"title":"V-아/어 두다","p":"우산 + 가방에 넣다","a":"우산을 가방에 넣어 두세요","en":"Keep an umbrella in your bag."},{"g":"g3-3","ch":3,"title":"V-아/어 두다","p":"간식을 남기다 + 배고플 때 먹다","a":"배고플 때 먹으려고 간식을 남겨 두었어요","en":"I saved a snack to eat when I'm hungry."},{"g":"g3-4","ch":3,"title":"A/V-(느)냐에 따라(서) ~","p":"누가 가르치다 + 수업 분위기가 달라지다","a":"누가 가르치느냐에 따라 수업 분위기가 달라져요","en":"Depending on who teaches, the class atmosphere changes."},{"g":"g3-4","ch":3,"title":"A/V-(느)냐에 따라(서) ~","p":"어떻게 연습하다 + 실력이 다르다","a":"어떻게 연습하느냐에 따라 실력이 달라요","en":"Depending on how you practise, your skill differs."},{"g":"g3-4","ch":3,"title":"A/V-(느)냐에 따라(서) ~","p":"날씨가 어떻다 + 계획이 바뀌다","a":"날씨가 어떠냐에 따라 계획이 바뀔 수 있어요","en":"Depending on the weather, the plan may change."},{"g":"g3-4","ch":3,"title":"A/V-(느)냐에 따라(서) ~","p":"영화를 누구와 보다 + 재미가 다르다","a":"영화를 누구와 보느냐에 따라 재미가 달라요","en":"Depending on who you watch a film with, the fun differs."},{"g":"g3-4","ch":3,"title":"A/V-(느)냐에 따라(서) ~","p":"값이 얼마이다 + 살지 말지 결정하다","a":"값이 얼마냐에 따라 살지 말지 결정할게요","en":"Depending on the price, I'll decide whether to buy."},{"g":"g3-4","ch":3,"title":"A/V-(느)냐에 따라(서) ~","p":"학생이다 + 가격이 다르다","a":"학생이냐 아니냐에 따라 가격이 달라요","en":"Depending on whether you are a student, the price differs."},{"g":"g3-4","ch":3,"title":"A/V-(느)냐에 따라(서) ~","p":"어떤 사람을 만나다 + 인생이 바뀌다","a":"어떤 사람을 만나느냐에 따라 인생이 바뀔 수 있어요","en":"Depending on whom you meet, your life can change."},{"g":"g3-4","ch":3,"title":"A/V-(느)냐에 따라(서) ~","p":"잠을 얼마나 자다 + 기억력이 달라지다","a":"잠을 얼마나 자느냐에 따라 기억력이 달라져요","en":"Depending on how much you sleep, your memory changes."},{"g":"g3-5","ch":3,"title":"V-아/어 내다","p":"힘든 훈련 + 끝까지 참다","a":"힘든 훈련을 끝까지 참아 냈어요","en":"I endured the hard training to the end."},{"g":"g3-5","ch":3,"title":"V-아/어 내다","p":"어려운 병 + 이기다","a":"어려운 병을 이겨 냈어요","en":"I overcame the serious illness."},{"g":"g3-5","ch":3,"title":"V-아/어 내다","p":"포기하고 싶다 + 끝까지 버티다","a":"포기하고 싶었지만 끝까지 버텨 냈어요","en":"I wanted to give up, but I held out to the end."},{"g":"g3-5","ch":3,"title":"V-아/어 내다","p":"몇 달 연습하다 + 춤을 완성하다","a":"몇 달 연습해서 드디어 춤을 완성해 냈어요","en":"After months of practice I finally completed the dance."},{"g":"g3-5","ch":3,"title":"V-아/어 내다","p":"열쇠를 잃어버리다 + 끝내 찾다","a":"잃어버린 열쇠를 끝내 찾아 냈어요","en":"I finally found the lost key."},{"g":"g3-5","ch":3,"title":"V-아/어 내다","p":"혼자서 이사를 + 하다","a":"혼자서 이사를 해 냈어요","en":"I managed the move all by myself."},{"g":"g3-5","ch":3,"title":"V-아/어 내다","p":"서로 돕다 + 위기를 이기다","a":"서로 도우며 위기를 이겨 냈어요","en":"We helped each other and overcame the crisis."},{"g":"g3-5","ch":3,"title":"V-아/어 내다","p":"추위를 견디다 + 산 정상까지 오르다","a":"추위를 견뎌 내고 산 정상까지 올랐어요","en":"I endured the cold and climbed to the summit."},{"g":"g4-1","ch":4,"title":"A/V-(으)ㄹ 정도로","p":"눈물이 나다 + 슬프다","a":"눈물이 날 정도로 슬퍼요.","en":"It is so sad that I could cry."},{"g":"g4-1","ch":4,"title":"A/V-(으)ㄹ 정도로","p":"숨이 막히다 + 덥다","a":"숨이 막힐 정도로 더워요.","en":"It is so hot that I can hardly breathe."},{"g":"g4-1","ch":4,"title":"A/V-(으)ㄹ 정도로","p":"밤을 새우다 + 열심히 공부했다","a":"밤을 새울 정도로 열심히 공부했어요.","en":"I studied so hard that I stayed up all night."},{"g":"g4-1","ch":4,"title":"A/V-(으)ㄹ 정도로","p":"믿기 어렵다 + 놀라웠다","a":"믿기 어려울 정도로 놀라웠어요.","en":"It was so surprising that it was hard to believe."},{"g":"g4-1","ch":4,"title":"A/V-(으)ㄹ 정도로","p":"친구가 못 알아보다 + 살이 빠졌다","a":"친구가 못 알아볼 정도로 살이 빠졌어요.","en":"I lost so much weight that my friends could not recognise me."},{"g":"g4-1","ch":4,"title":"A/V-(으)ㄹ 정도로","p":"밥 먹을 시간도 없다 + 바쁘다","a":"밥 먹을 시간도 없을 정도로 바빠요.","en":"I am so busy that I do not even have time to eat."},{"g":"g4-1","ch":4,"title":"A/V-(으)ㄹ 정도로","p":"걷지 못하다 + 다리가 아프다","a":"걷지 못할 정도로 다리가 아파요.","en":"My legs hurt so much that I cannot walk."},{"g":"g4-1","ch":4,"title":"A/V-(으)ㄹ 정도로","p":"사람들이 놀라다 + 키가 크다","a":"사람들이 놀랄 정도로 키가 커요.","en":"He is so tall that people are amazed."},{"g":"g4-2","ch":4,"title":"A/V-기만 하다","p":"아이가 게임을 하다 + 공부는 안 하다","a":"아이가 게임을 하기만 하고 공부는 안 해요.","en":"The child only plays games and does not study."},{"g":"g4-2","ch":4,"title":"A/V-기만 하다","p":"친구는 듣다 + 말은 안 하다","a":"친구는 듣기만 하고 말은 안 해요.","en":"My friend only listens and does not speak."},{"g":"g4-2","ch":4,"title":"A/V-기만 하다","p":"가방이 예쁘다 + 쓸모가 없다","a":"가방이 예쁘기만 하고 쓸모가 없어요.","en":"The bag is only pretty and useless."},{"g":"g4-2","ch":4,"title":"A/V-기만 하다","p":"하루 종일 자다 + 일어나지 않다","a":"하루 종일 자기만 하고 일어나지 않아요.","en":"He only sleeps all day and does not get up."},{"g":"g4-2","ch":4,"title":"A/V-기만 하다","p":"동생은 놀다 + 숙제는 안 하다","a":"동생은 놀기만 하고 숙제는 안 해요.","en":"My younger brother only plays and does not do his homework."},{"g":"g4-2","ch":4,"title":"A/V-기만 하다","p":"그 사람은 불평하다 + 도와주지 않다","a":"그 사람은 불평하기만 하고 도와주지 않아요.","en":"He only complains and does not help."},{"g":"g4-2","ch":4,"title":"A/V-기만 하다","p":"회의에서 듣다 + 의견은 말하지 않다","a":"회의에서 듣기만 하고 의견은 말하지 않았어요.","en":"In the meeting I only listened and did not state an opinion."},{"g":"g4-2","ch":4,"title":"A/V-기만 하다","p":"영화가 길다 + 재미는 없다","a":"영화가 길기만 하고 재미는 없어요.","en":"The movie is only long and not fun."},{"g":"g4-3","ch":4,"title":"뭔가 / 누군가 / 어딘가 / 언젠가 ~","p":"방에 들어가다 + 이상한 냄새가 나다","a":"방에 들어가니 뭔가 이상한 냄새가 났어요.","en":"When I entered the room there was some strange smell."},{"g":"g4-3","ch":4,"title":"뭔가 / 누군가 / 어딘가 / 언젠가 ~","p":"문을 두드리다 + 밖을 보다","a":"누군가 문을 두드려서 밖을 봤어요.","en":"Someone knocked on the door, so I looked outside."},{"g":"g4-3","ch":4,"title":"뭔가 / 누군가 / 어딘가 / 언젠가 ~","p":"한국에서 살아 보다 + 싶다","a":"언젠가 한국에서 살아 보고 싶어요.","en":"Some day I want to try living in Korea."},{"g":"g4-3","ch":4,"title":"뭔가 / 누군가 / 어딘가 / 언젠가 ~","p":"시험 결과를 기다리다 + 불안하다","a":"시험 결과를 기다리는데 왠지 불안해요.","en":"While waiting for the exam result I feel uneasy for some reason."},{"g":"g4-3","ch":4,"title":"뭔가 / 누군가 / 어딘가 / 언젠가 ~","p":"지갑을 두고 오다 + 기억이 안 나다","a":"지갑을 어딘가에 두고 온 것 같은데 기억이 안 나요.","en":"I think I left my wallet somewhere, but I cannot remember."},{"g":"g4-3","ch":4,"title":"뭔가 / 누군가 / 어딘가 / 언젠가 ~","p":"퇴직하다 + 새로운 일을 시작하고 싶다","a":"퇴직하면 뭔가 새로운 일을 시작하고 싶어요.","en":"After retiring I want to start something new."},{"g":"g4-3","ch":4,"title":"뭔가 / 누군가 / 어딘가 / 언젠가 ~","p":"엘리베이터에서 만나다 + 인사하다","a":"엘리베이터에서 누군가를 만나서 인사했어요.","en":"I met someone in the elevator and said hello."},{"g":"g4-3","ch":4,"title":"뭔가 / 누군가 / 어딘가 / 언젠가 ~","p":"노래 소리가 들리다 + 따라가 보다","a":"어딘가에서 노래 소리가 들려서 따라가 봤어요.","en":"I heard singing from somewhere, so I followed it."},{"g":"g4-4","ch":4,"title":"V-(으)ㅁ으로써 ~","p":"운동을 하다 + 건강을 되찾았다","a":"운동을 함으로써 건강을 되찾았다.","en":"By exercising he regained his health."},{"g":"g4-4","ch":4,"title":"V-(으)ㅁ으로써 ~","p":"대화를 나누다 + 오해를 풀 수 있었다","a":"대화를 나눔으로써 오해를 풀 수 있었다.","en":"By talking we were able to clear up the misunderstanding."},{"g":"g4-4","ch":4,"title":"V-(으)ㅁ으로써 ~","p":"근무 시간을 줄이다 + 만족도를 높였다","a":"근무 시간을 줄임으로써 만족도를 높였다.","en":"By shortening working hours they raised satisfaction."},{"g":"g4-4","ch":4,"title":"V-(으)ㅁ으로써 ~","p":"책을 읽다 + 지식을 쌓을 수 있다","a":"책을 읽음으로써 지식을 쌓을 수 있다.","en":"By reading books we can build up knowledge."},{"g":"g4-4","ch":4,"title":"V-(으)ㅁ으로써 ~","p":"에너지를 아끼다 + 환경을 보호할 수 있다","a":"에너지를 아낌으로써 환경을 보호할 수 있다.","en":"By saving energy we can protect the environment."},{"g":"g4-4","ch":4,"title":"V-(으)ㅁ으로써 ~","p":"서로 노력하다 + 갈등을 줄여 나가야 한다","a":"서로 노력함으로써 갈등을 줄여 나가야 한다.","en":"By making efforts together we must keep reducing the conflict."},{"g":"g4-4","ch":4,"title":"V-(으)ㅁ으로써 ~","p":"보육 시설을 늘리다 + 부모의 부담을 덜 수 있다","a":"보육 시설을 늘림으로써 부모의 부담을 덜 수 있다.","en":"By increasing childcare facilities we can ease the burden on parents."},{"g":"g4-4","ch":4,"title":"V-(으)ㅁ으로써 ~","p":"직접 경험하다 + 이론을 더 잘 이해하게 되었다","a":"직접 경험함으로써 이론을 더 잘 이해하게 되었다.","en":"By experiencing it directly they came to understand the theory better."},{"g":"g5-1","ch":5,"title":"N만큼","p":"동생도 형[[처럼]] 키가 커요.","a":"동생도 형만큼 키가 커요.","en":"My younger brother is as tall as my older brother."},{"g":"g5-1","ch":5,"title":"N만큼","p":"저는 엄마[[처럼]] 요리를 잘하지 못해요.","a":"저는 엄마만큼 요리를 잘하지 못해요.","en":"I cannot cook as well as my mother."},{"g":"g5-1","ch":5,"title":"N만큼","p":"부산도 서울[[처럼]] 물가가 비싸요.","a":"부산도 서울만큼 물가가 비싸요.","en":"Prices in Busan are as high as in Seoul."},{"g":"g5-1","ch":5,"title":"N만큼","p":"이번 시험은 지난번[[처럼]] 어렵지 않았어요.","a":"이번 시험은 지난번만큼 어렵지 않았어요.","en":"This exam was not as hard as the last one."},{"g":"g5-1","ch":5,"title":"N만큼","p":"그 가수[[처럼]] 노래를 잘하는 사람은 별로 없어요.","a":"그 가수만큼 노래를 잘하는 사람은 별로 없어요.","en":"Few people sing as well as that singer."},{"g":"g5-1","ch":5,"title":"N만큼","p":"아이를 키우는 일 + 보람 있는 일은 없다","a":"아이를 키우는 일만큼 보람 있는 일은 없어요.","en":"No work is as rewarding as raising a child."},{"g":"g5-1","ch":5,"title":"N만큼","p":"저도 친구[[처럼]] 외향적이에요.","a":"저도 친구만큼 외향적이에요.","en":"I am as extroverted as my friend."},{"g":"g5-1","ch":5,"title":"N만큼","p":"우리 팀장님[[처럼]] 꼼꼼한 사람은 처음 봤어요.","a":"우리 팀장님만큼 꼼꼼한 사람은 처음 봤어요.","en":"I have never seen anyone as meticulous as our team leader."},{"g":"g5-2","ch":5,"title":"V-(으)ㄹ 필요 / 기회 / 계획 / 예정 / 가능성 ~","p":"올해 한국에서 일하다 + 기회가 생겼다","a":"올해 한국에서 일할 기회가 생겼어요.","en":"This year I got a chance to work in Korea."},{"g":"g5-2","ch":5,"title":"V-(으)ㄹ 필요 / 기회 / 계획 / 예정 / 가능성 ~","p":"시간이 많다 + 서두르다 (필요 없음)","a":"시간이 많아서 서두를 필요가 없어요.","en":"There is plenty of time, so there is no need to hurry."},{"g":"g5-2","ch":5,"title":"V-(으)ㄹ 필요 / 기회 / 계획 / 예정 / 가능성 ~","p":"두 사람은 내년에 결혼하다 + (예정)","a":"두 사람은 내년에 결혼할 예정이에요.","en":"The two of them are scheduled to marry next year."},{"g":"g5-2","ch":5,"title":"V-(으)ㄹ 필요 / 기회 / 계획 / 예정 / 가능성 ~","p":"내일은 눈이 오다 + 가능성이 높다","a":"내일은 눈이 올 가능성이 높아요.","en":"There is a high chance of snow tomorrow."},{"g":"g5-2","ch":5,"title":"V-(으)ㄹ 필요 / 기회 / 계획 / 예정 / 가능성 ~","p":"방학에 유럽을 여행하다 + (계획)","a":"방학에 유럽을 여행할 계획이에요.","en":"I plan to travel in Europe during the vacation."},{"g":"g5-2","ch":5,"title":"V-(으)ㄹ 필요 / 기회 / 계획 / 예정 / 가능성 ~","p":"신입 사원이 발표하다 + 기회를 얻었다","a":"신입 사원이 발표할 기회를 얻었어요.","en":"The new employee got a chance to present."},{"g":"g5-2","ch":5,"title":"V-(으)ㄹ 필요 / 기회 / 계획 / 예정 / 가능성 ~","p":"그렇게 걱정하다 + 필요는 없다","a":"그렇게 걱정할 필요는 없어요.","en":"There is no need to worry like that."},{"g":"g5-2","ch":5,"title":"V-(으)ㄹ 필요 / 기회 / 계획 / 예정 / 가능성 ~","p":"이번에 합격하다 + 가능성은 낮다","a":"이번에 합격할 가능성은 낮아요.","en":"The chance of passing this time is low."},{"g":"g5-3","ch":5,"title":"A/V-다는 듯이 ~","p":"아이는 알아듣다 + 고개를 끄덕이다","a":"아이는 다 알아들었다는 듯이 고개를 끄덕였다.","en":"The child nodded as if to say he had understood everything."},{"g":"g5-3","ch":5,"title":"A/V-다는 듯이 ~","p":"아무 일도 없었다 + 웃으며 인사하다","a":"그는 아무 일도 없었다는 듯이 웃으며 인사했다.","en":"He greeted me with a smile as if nothing had happened."},{"g":"g5-3","ch":5,"title":"A/V-다는 듯이 ~","p":"아버지는 왜 늦었다 + 시계를 가리키다","a":"아버지는 왜 늦었냐는 듯이 시계를 가리켰다.","en":"My father pointed at his watch as if asking why I was late."},{"g":"g5-3","ch":5,"title":"A/V-다는 듯이 ~","p":"친구는 조금도 힘들지 않다 + 계속 걷다","a":"친구는 조금도 힘들지 않다는 듯이 계속 걸었다.","en":"My friend kept walking as if it were not hard at all."},{"g":"g5-3","ch":5,"title":"A/V-다는 듯이 ~","p":"점원은 다 팔리다 + 빈 상자를 가리키다","a":"점원은 다 팔렸다는 듯이 빈 상자를 가리켰다.","en":"The clerk pointed at the empty box as if to say everything was sold."},{"g":"g5-3","ch":5,"title":"A/V-다는 듯이 ~","p":"엄마는 어서 먹다 + 반찬을 밀어 주다","a":"엄마는 어서 먹으라는 듯이 반찬을 밀어 주셨다.","en":"Mom pushed the side dishes toward me as if to say 'Eat up'."},{"g":"g5-3","ch":5,"title":"A/V-다는 듯이 ~","p":"동생은 괜찮다 + 웃어 보이다","a":"동생은 괜찮다는 듯이 웃어 보였다.","en":"My younger brother smiled as if to say it was fine."},{"g":"g5-3","ch":5,"title":"A/V-다는 듯이 ~","p":"고양이는 여기가 자기 자리이다 + 내 의자에 앉아 있다","a":"고양이는 여기가 자기 자리라는 듯이 내 의자에 앉아 있었다.","en":"The cat sat on my chair as if to say this was its spot."},{"g":"g5-4","ch":5,"title":"V-기(가) 일쑤(이)다","p":"야근이 많다 + 아침을 거르다","a":"야근이 많아서 아침을 거르기 일쑤예요.","en":"I work late a lot, so I often skip breakfast."},{"g":"g5-4","ch":5,"title":"V-기(가) 일쑤(이)다","p":"늦잠을 자다 + 학교에 지각하다","a":"늦잠을 자서 학교에 지각하기 일쑤였어요.","en":"I used to oversleep and often be late for school."},{"g":"g5-4","ch":5,"title":"V-기(가) 일쑤(이)다","p":"덜렁대다 + 우산을 잃어버리다","a":"덜렁대서 우산을 잃어버리기가 일쑤예요.","en":"I am careless, so I often lose my umbrella."},{"g":"g5-4","ch":5,"title":"V-기(가) 일쑤(이)다","p":"어릴 때 + 친구와 싸우다","a":"어릴 때는 친구와 싸우기 일쑤였어요.","en":"When I was little I often fought with friends."},{"g":"g5-4","ch":5,"title":"V-기(가) 일쑤(이)다","p":"피곤하다 + 수업 시간에 졸다","a":"피곤하면 수업 시간에 졸기 일쑤예요.","en":"When I am tired I often doze off in class."},{"g":"g5-4","ch":5,"title":"V-기(가) 일쑤(이)다","p":"눈이 오는 날 + 넘어지다","a":"눈이 오는 날에는 넘어지기 일쑤예요.","en":"On snowy days I often fall."},{"g":"g5-4","ch":5,"title":"V-기(가) 일쑤(이)다","p":"바쁘다 + 약속을 잊어버리다","a":"바쁠 때는 약속을 잊어버리기 일쑤예요.","en":"When I am busy I often forget appointments."},{"g":"g5-4","ch":5,"title":"V-기(가) 일쑤(이)다","p":"서두르다 + 물건을 떨어뜨리다","a":"서두르다가 물건을 떨어뜨리기 일쑤예요.","en":"When I rush I often drop things."},{"g":"g5-5","ch":5,"title":"V-기란 ~","p":"요즘 취직하다 + 정말 어렵다","a":"요즘 취직하기란 정말 어려워요.","en":"These days getting a job is really hard."},{"g":"g5-5","ch":5,"title":"V-기란 ~","p":"외국에서 혼자 살다 + 쉽지 않다","a":"외국에서 혼자 살기란 쉽지 않아요.","en":"Living alone abroad is not easy."},{"g":"g5-5","ch":5,"title":"V-기란 ~","p":"낯선 곳에서 새 친구를 사귀다 + 쉬운 일이 아니다","a":"낯선 곳에서 새 친구를 사귀기란 쉬운 일이 아니에요.","en":"Making new friends in an unfamiliar place is not easy."},{"g":"g5-5","ch":5,"title":"V-기란 ~","p":"월급만으로 저축하다 + 쉽지 않다","a":"월급만으로 저축하기란 쉽지 않아요.","en":"Saving on a salary alone is not easy."},{"g":"g5-5","ch":5,"title":"V-기란 ~","p":"다른 사람의 마음을 이해하다 + 생각보다 힘들다","a":"다른 사람의 마음을 이해하기란 생각보다 힘들어요.","en":"Understanding another person's heart is harder than you think."},{"g":"g5-5","ch":5,"title":"V-기란 ~","p":"성격을 바꾸다 + 불가능에 가깝다","a":"성격을 바꾸기란 불가능에 가까워요.","en":"Changing your personality is close to impossible."},{"g":"g5-5","ch":5,"title":"V-기란 ~","p":"아이를 혼자 키우다 + 보통 일이 아니다","a":"아이를 혼자 키우기란 보통 일이 아니에요.","en":"Raising a child alone is no ordinary task."},{"g":"g5-5","ch":5,"title":"V-기란 ~","p":"서울에서 주차할 곳을 찾다 + 하늘의 별 따기이다","a":"서울에서 주차할 곳을 찾기란 하늘의 별 따기예요.","en":"Finding a parking spot in Seoul is next to impossible."},{"g":"g6-1","ch":6,"title":"A/V-다고 치다","p":"네가 바빴다 + 연락은 할 수 있었다","a":"네가 바빴다고 쳐도 연락은 할 수 있었잖아.","en":"Even if you were busy, you could have contacted me."},{"g":"g6-1","ch":6,"title":"A/V-다고 치다","p":"시험이 쉬웠다 + 공부를 안 하면 합격하지 못하다","a":"시험이 쉬웠다고 쳐도 공부를 안 하면 합격하지 못해요.","en":"Even if the exam was easy, you cannot pass without studying."},{"g":"g6-1","ch":6,"title":"A/V-다고 치다","p":"일이 재미있다 + 매일 야근하면 건강을 해치다","a":"일이 재미있다고 쳐도 매일 야근하면 건강을 해칠 거예요.","en":"Even if the work is fun, daily overtime will harm your health."},{"g":"g6-1","ch":6,"title":"A/V-다고 치다","p":"유학이 도움이 되다 + 비용이 너무 비싸다","a":"유학이 도움이 된다고 쳐도 비용이 너무 비싸요.","en":"Even if studying abroad helps, the cost is too high."},{"g":"g6-1","ch":6,"title":"A/V-다고 치다","p":"그가 진심이다 + 방법은 적절하지 않았다","a":"그가 진심이라고 치더라도 방법은 적절하지 않았어요.","en":"Even supposing he was sincere, the method was not appropriate."},{"g":"g6-1","ch":6,"title":"A/V-다고 치다","p":"내가 틀렸다 + 네 태도도 잘못이다","a":"내가 틀렸다고 쳐도 네 태도도 잘못이야.","en":"Even if I was wrong, your attitude was wrong too."},{"g":"g6-1","ch":6,"title":"A/V-다고 치다","p":"외향적인 사람이 유리하다 + 내성적인 사람도 장점이 많다","a":"외향적인 사람이 유리하다고 쳐도 내성적인 사람도 장점이 많아요.","en":"Even if extroverts have the advantage, introverts have many strengths too."},{"g":"g6-1","ch":6,"title":"A/V-다고 치다","p":"혼자 사는 게 편하다 + 외롭다","a":"혼자 사는 게 편하다고 쳐도 외로워요.","en":"Even if living alone is comfortable, it is lonely."},{"g":"g6-2","ch":6,"title":"A/V-다면 몰라도 ~","p":"어린아이이다 + 어른이 그러면 안 되다","a":"어린아이라면 몰라도 어른이 그러면 안 돼요.","en":"A small child maybe, but an adult must not do that."},{"g":"g6-2","ch":6,"title":"A/V-다면 몰라도 ~","p":"복권에 당첨되다 + 월급으로 집을 사기 어렵다","a":"복권에 당첨된다면 몰라도 월급으로 집을 사기는 어려워요.","en":"Unless you win the lottery, it is hard to buy a house on a salary."},{"g":"g6-2","ch":6,"title":"A/V-다면 몰라도 ~","p":"한 번이다 + 계속하면 안 되다","a":"한 번이라면 몰라도 계속하면 안 돼요.","en":"Once maybe, but you must not keep doing it."},{"g":"g6-2","ch":6,"title":"A/V-다면 몰라도 ~","p":"특별한 이유가 있다 + 화를 낼 수 없다","a":"특별한 이유가 있다면 몰라도 화를 낼 수는 없어요.","en":"Unless there is a special reason, you cannot get angry."},{"g":"g6-2","ch":6,"title":"A/V-다면 몰라도 ~","p":"친구이다 + 모르는 사람에게는 말하기 어렵다","a":"친구라면 몰라도 모르는 사람에게는 말하기 어려워요.","en":"To a friend maybe, but it is hard to say to a stranger."},{"g":"g6-2","ch":6,"title":"A/V-다면 몰라도 ~","p":"급한 일이 생겼다 + 이유 없이 취소하면 안 되다","a":"급한 일이 생겼다면 몰라도 이유 없이 취소하면 안 되죠.","en":"If something urgent came up maybe, but you must not cancel for no reason."},{"g":"g6-2","ch":6,"title":"A/V-다면 몰라도 ~","p":"눈이 많이 오다 + 행사를 취소하지는 않다","a":"눈이 많이 온다면 몰라도 행사를 취소하지는 않아요.","en":"Unless it snows heavily, they will not cancel the event."},{"g":"g6-2","ch":6,"title":"A/V-다면 몰라도 ~","p":"신입 사원이다 + 팀장이 그런 실수를 하면 안 되다","a":"신입 사원이라면 몰라도 팀장이 그런 실수를 하면 안 돼요.","en":"A new employee maybe, but a team leader must not make that mistake."},{"g":"g6-3","ch":6,"title":"A/V-(으)ㄴ/는 가운데 ~","p":"많은 사람이 지켜보다 + 공연이 시작되다","a":"많은 사람이 지켜보는 가운데 공연이 시작되었다.","en":"The performance began with many people watching."},{"g":"g6-3","ch":6,"title":"A/V-(으)ㄴ/는 가운데 ~","p":"비가 오다 + 마라톤 대회가 열리다","a":"비가 오는 가운데 마라톤 대회가 열렸다.","en":"The marathon was held in the rain."},{"g":"g6-3","ch":6,"title":"A/V-(으)ㄴ/는 가운데 ~","p":"경제가 어렵다 + 출산 지원을 늘리기로 하다","a":"경제가 어려운 가운데 출산 지원을 늘리기로 했다.","en":"Amid economic hardship, they decided to increase childbirth support."},{"g":"g6-3","ch":6,"title":"A/V-(으)ㄴ/는 가운데 ~","p":"논란이 계속되다 + 회사가 입장을 발표하다","a":"논란이 계속되는 가운데 회사는 입장을 발표했다.","en":"Amid continuing controversy, the company announced its position."},{"g":"g6-3","ch":6,"title":"A/V-(으)ㄴ/는 가운데 ~","p":"눈이 내리다 + 사람들이 거리로 나오다","a":"눈이 내리는 가운데 사람들이 거리로 나왔다.","en":"People came out onto the street while snow was falling."},{"g":"g6-3","ch":6,"title":"A/V-(으)ㄴ/는 가운데 ~","p":"긴장하다 + 면접이 시작되다","a":"긴장한 가운데 면접이 시작되었다.","en":"The interview began amid tension."},{"g":"g6-3","ch":6,"title":"A/V-(으)ㄴ/는 가운데 ~","p":"모두가 기뻐하다 + 결혼식이 진행되다","a":"모두가 기뻐하는 가운데 결혼식이 진행되었다.","en":"The wedding took place amid everyone's joy."},{"g":"g6-3","ch":6,"title":"A/V-(으)ㄴ/는 가운데 ~","p":"찬반 의견이 엇갈리다 + 정부는 신중한 태도를 보이다","a":"찬반 의견이 엇갈리는 가운데 정부는 신중한 태도를 보였다.","en":"Amid divided opinions, the government took a cautious stance."},{"g":"g6-4","ch":6,"title":"V-는 셈이다","p":"회사에서 점심을 주다 + 월급을 더 받다","a":"회사에서 점심을 주니까 월급을 더 받는 셈이에요.","en":"The company gives lunch, so in effect I get a higher salary."},{"g":"g6-4","ch":6,"title":"V-는 셈이다","p":"한국에서 십 년 살다 + 한국 사람이나 다름없다","a":"한국에서 십 년 살았으니 한국 사람이나 다름없는 셈이에요.","en":"I have lived in Korea for ten years, so I am practically Korean."},{"g":"g6-4","ch":6,"title":"V-는 셈이다","p":"숙제를 반이나 하다 + 절반은 끝내다","a":"숙제를 반이나 했으니 절반은 끝낸 셈이에요.","en":"I have done half of the homework, so half of it is done."},{"g":"g6-4","ch":6,"title":"V-는 셈이다","p":"매일 야근하다 + 회사에서 살다","a":"매일 야근을 하니까 회사에서 사는 셈이에요.","en":"I work overtime every day, so I practically live at the company."},{"g":"g6-4","ch":6,"title":"V-는 셈이다","p":"사고가 났는데 다치지 않다 + 운이 좋다","a":"사고가 났는데 다치지 않았으니 운이 좋은 셈이에요.","en":"There was an accident but I was not hurt, so I was lucky in a way."},{"g":"g6-4","ch":6,"title":"V-는 셈이다","p":"친구에게 빌리다 + 공짜로 쓰다","a":"친구에게 빌려서 공짜로 쓰는 셈이에요.","en":"I borrow it from a friend, so I am using it for free in effect."},{"g":"g6-4","ch":6,"title":"V-는 셈이다","p":"결혼식만 안 하다 + 이미 부부이다","a":"결혼식만 안 했을 뿐 이미 부부인 셈이에요.","en":"They have just not held the wedding; they are already a couple in effect."},{"g":"g6-4","ch":6,"title":"V-는 셈이다","p":"월세를 내고 나다 + 한 푼도 못 벌다","a":"월세를 내고 나니 한 푼도 못 번 셈이에요.","en":"After paying rent, it is as if I earned nothing."},{"g":"g7-1","ch":7,"title":"A/V-더니","p":"아까는 울다 + 지금은 웃고 있다","a":"아까는 울더니 지금은 웃고 있어요","en":"A while ago he was crying, but now he is laughing."},{"g":"g7-1","ch":7,"title":"A/V-더니","p":"친구가 한참 생각하다 + 이렇게 말하다","a":"친구가 한참 생각하더니 이렇게 말했어요","en":"My friend thought for a long while and then said this."},{"g":"g7-1","ch":7,"title":"A/V-더니","p":"약을 먹다 + 열이 내리다","a":"약을 먹었더니 열이 내렸어요","en":"I took the medicine and the fever went down."},{"g":"g7-1","ch":7,"title":"A/V-더니","p":"어제는 비가 오다 + 오늘은 맑다","a":"어제는 비가 오더니 오늘은 맑네요","en":"It rained yesterday, but it is clear today."},{"g":"g7-1","ch":7,"title":"A/V-더니","p":"동생이 열심히 연습하다 + 일등을 하다","a":"동생이 열심히 연습하더니 일등을 했어요","en":"My brother practised hard and then took first place."},{"g":"g7-1","ch":7,"title":"A/V-더니","p":"외국인 손님이 인사하다 + 고개를 숙이다","a":"외국인 손님이 인사하더니 고개를 숙였어요","en":"The foreign guest greeted us and then bowed his head."},{"g":"g7-1","ch":7,"title":"A/V-더니","p":"밤새 공부하다 + 머리가 아프다","a":"밤새 공부했더니 머리가 아파요","en":"I studied all night, so my head hurts."},{"g":"g7-1","ch":7,"title":"A/V-더니","p":"요즘 날씨가 춥다 + 눈이 내리다","a":"요즘 날씨가 춥더니 눈이 내리네요","en":"The weather has been cold lately, and now it is snowing."},{"g":"g7-2","ch":7,"title":"V-다시피 ~","p":"여러분도 알다 + 한국에서는 나이가 중요하다","a":"아시다시피 한국에서는 나이가 중요해요","en":"As you know, age is important in Korea."},{"g":"g7-2","ch":7,"title":"V-다시피 ~","p":"여러분도 느끼다 + 요즘 날씨가 많이 춥다","a":"느끼셨다시피 요즘 날씨가 많이 추워요","en":"As you have felt, the weather has been very cold lately."},{"g":"g7-2","ch":7,"title":"V-다시피 ~","p":"지난 시간에 말하다 + 내일은 시험이 있다","a":"지난 시간에 말씀드렸다시피 내일은 시험이 있어요","en":"As I said in the last class, there is a test tomorrow."},{"g":"g7-2","ch":7,"title":"V-다시피 ~","p":"여러분도 듣다 + 회의가 다음 주로 미뤄졌다","a":"들으셨다시피 회의가 다음 주로 미뤄졌습니다","en":"As you heard, the meeting was postponed until next week."},{"g":"g7-2","ch":7,"title":"V-다시피 ~","p":"미리 예상하다 + 시험이 어렵다","a":"예상했다시피 시험이 어려웠어요","en":"As we expected, the exam was difficult."},{"g":"g7-2","ch":7,"title":"V-다시피 ~","p":"앞에서 설명하다 + 이 표현은 어른께 쓰지 않다","a":"앞에서 설명했다시피 이 표현은 어른께 쓰지 않아요","en":"As I explained earlier, we do not use this expression with elders."},{"g":"g7-2","ch":7,"title":"V-다시피 ~","p":"다 알다 + 몸짓의 뜻은 문화마다 다르다","a":"다 아시다시피 몸짓의 뜻은 문화마다 달라요","en":"As you all know, the meaning of gestures differs from culture to culture."},{"g":"g7-2","ch":7,"title":"V-다시피 ~","p":"여러분이 보다 + 저는 지금 많이 바쁘다","a":"보시다시피 저는 지금 많이 바빠요","en":"As you can see, I am very busy right now."},{"g":"g7-3","ch":7,"title":"A/V-아/어야지 A/V-아/어서는 안 된다","p":"건강해지다 + 규칙적으로 운동을 하다","a":"건강해지려면 규칙적으로 운동을 해야지요","en":"If you want to get healthy, you should exercise regularly."},{"g":"g7-3","ch":7,"title":"A/V-아/어야지 A/V-아/어서는 안 된다","p":"어른 앞에서 다리를 꼬고 앉다 + 예의에 어긋나다","a":"어른 앞에서 다리를 꼬고 앉아서는 안 돼요","en":"You must not sit with your legs crossed in front of an elder."},{"g":"g7-3","ch":7,"title":"A/V-아/어야지 A/V-아/어서는 안 된다","p":"친구를 만나다 + 약속 시간을 지키다","a":"친구를 만나면 약속 시간을 지켜야지요","en":"When you meet a friend, you should keep the appointment time."},{"g":"g7-3","ch":7,"title":"A/V-아/어야지 A/V-아/어서는 안 된다","p":"다른 나라 문화를 존중하다 + 무시하다","a":"다른 나라 문화를 존중해야지 무시해서는 안 돼요","en":"You should respect other countries' cultures, not look down on them."},{"g":"g7-3","ch":7,"title":"A/V-아/어야지 A/V-아/어서는 안 된다","p":"시험 기간 + 밤을 새우다","a":"시험 기간에 밤을 새워서는 안 돼요","en":"During exam week you must not stay up all night."},{"g":"g7-3","ch":7,"title":"A/V-아/어야지 A/V-아/어서는 안 된다","p":"도서관에서 조용히 하다 + 큰 소리로 떠들다","a":"도서관에서 조용히 해야지 큰 소리로 떠들어서는 안 돼요","en":"In a library you should be quiet; you must not make loud noise."},{"g":"g7-3","ch":7,"title":"A/V-아/어야지 A/V-아/어서는 안 된다","p":"내일부터 + 운동을 시작하다","a":"내일부터 운동을 시작해야지","en":"I should start exercising from tomorrow."},{"g":"g7-3","ch":7,"title":"A/V-아/어야지 A/V-아/어서는 안 된다","p":"남의 말을 + 함부로 믿다","a":"남의 말을 함부로 믿어서는 안 돼요","en":"You must not believe what others say carelessly."},{"g":"g7-4","ch":7,"title":"N(이)라고 ~ / N하고 ~","p":"친구들이 저를 부르다 + 별명은 곰돌이","a":"친구들은 저를 곰돌이라고 불러요","en":"My friends call me Gomdori (Teddy)."},{"g":"g7-4","ch":7,"title":"N(이)라고 ~ / N하고 ~","p":"한국에서는 선배를 부르다 + 선배님","a":"한국에서는 선배를 선배님이라고 불러요","en":"In Korea people call an older schoolmate 선배님."},{"g":"g7-4","ch":7,"title":"N(이)라고 ~ / N하고 ~","p":"이것을 한국어로 말하다 + 손짓","a":"이것을 한국어로 손짓이라고 해요","en":"In Korean this is called 손짓."},{"g":"g7-4","ch":7,"title":"N(이)라고 ~ / N하고 ~","p":"이런 인사를 말하다 + 목례","a":"이런 인사를 목례라고 합니다","en":"This kind of greeting is called a nod bow (목례)."},{"g":"g7-4","ch":7,"title":"N(이)라고 ~ / N하고 ~","p":"엄지를 올리는 몸짓을 말하다 + 최고","a":"엄지를 올리는 몸짓을 최고라고 해요","en":"The thumbs-up gesture is called \"the best\"."},{"g":"g7-4","ch":7,"title":"N(이)라고 ~ / N하고 ~","p":"아이가 엄마를 부르다 + 달려오다","a":"아이가 '엄마!' 하고 소리치며 달려왔어요","en":"The child ran over shouting \"Mom!\""},{"g":"g7-4","ch":7,"title":"N(이)라고 ~ / N하고 ~","p":"외국 사람들이 저를 부르다 + 미스터 킴","a":"외국 사람들은 저를 미스터 킴이라고 불러요","en":"Foreigners call me 'Mr. Kim'."},{"g":"g7-4","ch":7,"title":"N(이)라고 ~ / N하고 ~","p":"친구가 인사하다 + 손을 흔들다","a":"친구가 '안녕!' 하고 인사하며 손을 흔들었어요","en":"My friend greeted me with \"Hi!\" and waved."},{"g":"g7-5","ch":7,"title":"N(이)란","p":"우정 + 친구 사이에 서로 믿는 마음","a":"우정이란 친구 사이에 서로 믿는 마음이에요","en":"Friendship is the heart with which friends trust each other."},{"g":"g7-5","ch":7,"title":"N(이)란","p":"언어 + 생각을 나누는 도구","a":"언어란 생각을 나누는 도구예요","en":"Language is a tool for sharing thoughts."},{"g":"g7-5","ch":7,"title":"N(이)란","p":"호칭 + 사람을 부르는 말","a":"호칭이란 사람을 부르는 말이에요","en":"A form of address is a word for calling a person."},{"g":"g7-5","ch":7,"title":"N(이)란","p":"행복 + 작은 일에 감사하는 마음","a":"행복이란 작은 일에 감사하는 마음이에요","en":"Happiness is a heart that is thankful for small things."},{"g":"g7-5","ch":7,"title":"N(이)란","p":"문화 + 한 사회가 함께 가진 생활 방식","a":"문화란 한 사회가 함께 가진 생활 방식이에요","en":"Culture is the way of life that a society shares."},{"g":"g7-5","ch":7,"title":"N(이)란","p":"친구 + 어려울 때 곁에 있어 주는 사람","a":"친구란 어려울 때 곁에 있어 주는 사람이에요","en":"A friend is a person who stays beside you in hard times."},{"g":"g7-5","ch":7,"title":"N(이)란","p":"예술 + 마음을 표현하는 활동","a":"예술이란 마음을 표현하는 활동이에요","en":"Art is an activity that expresses the heart."},{"g":"g7-5","ch":7,"title":"N(이)란","p":"풍속화 + 그 시대 사람들의 생활을 그린 그림","a":"풍속화란 그 시대 사람들의 생활을 그린 그림이에요","en":"Genre painting is a picture of the daily life of people in that era."},{"g":"g8-1","ch":8,"title":"A/V-네요","p":"이 그림은 색이 정말 [[화려하다]]","a":"이 그림은 색이 정말 화려하네요","en":"The colours of this painting are really gorgeous!"},{"g":"g8-1","ch":8,"title":"A/V-네요","p":"그림 속 아이들을 보다 + 모두 웃고 있다","a":"그림 속 아이들이 모두 웃고 있네요","en":"Look, the children in the picture are all laughing."},{"g":"g8-1","ch":8,"title":"A/V-네요","p":"벌써 열두 시가 [[넘다]]","a":"벌써 열두 시가 넘었네요","en":"It is already past twelve."},{"g":"g8-1","ch":8,"title":"A/V-네요","p":"이 그림은 사백 년 전에 [[그려지다]]","a":"이 그림은 사백 년 전에 그려졌네요","en":"This painting was painted four hundred years ago!"},{"g":"g8-1","ch":8,"title":"A/V-네요","p":"이 그림을 그린 사람은 [[여자 화가이다]]","a":"이 그림을 그린 사람은 여자 화가네요","en":"The person who painted this is a woman painter!"},{"g":"g8-1","ch":8,"title":"A/V-네요","p":"한국어를 정말 [[잘하시다]]","a":"한국어를 정말 잘하시네요","en":"You speak Korean really well!"},{"g":"g8-1","ch":8,"title":"A/V-네요","p":"사람들을 보다 + 모두 한복을 입고 있다","a":"사람들이 모두 한복을 입고 있네요","en":"Everyone is wearing hanbok."},{"g":"g8-1","ch":8,"title":"A/V-네요","p":"어느새 비가 [[그치다]]","a":"어느새 비가 그쳤네요","en":"The rain has stopped before I knew it."},{"g":"g8-2","ch":8,"title":"N치고 ~ / N치고는 ~","p":"초보자이다 + 그림을 아주 잘 그리다","a":"초보자치고는 그림을 아주 잘 그려요","en":"For a beginner, he draws very well."},{"g":"g8-2","ch":8,"title":"N치고 ~ / N치고는 ~","p":"한국 사람 + 김치를 안 먹는 사람은 없다","a":"한국 사람치고 김치를 안 먹는 사람은 없어요","en":"There is no Korean who does not eat kimchi."},{"g":"g8-2","ch":8,"title":"N치고 ~ / N치고는 ~","p":"겨울이다 + 날씨가 아주 따뜻하다","a":"겨울치고는 날씨가 아주 따뜻해요","en":"The weather is very warm for winter."},{"g":"g8-2","ch":8,"title":"N치고 ~ / N치고는 ~","p":"화가이다 + 그림을 싫어하는 사람은 없다","a":"화가치고 그림을 싫어하는 사람은 없어요","en":"There is no painter who dislikes pictures."},{"g":"g8-2","ch":8,"title":"N치고 ~ / N치고는 ~","p":"외국인이다 + 발음이 정확하다","a":"외국인치고는 발음이 정말 정확해요","en":"For a foreigner, your pronunciation is really accurate."},{"g":"g8-2","ch":8,"title":"N치고 ~ / N치고는 ~","p":"학생이다 + 시험을 좋아하는 사람은 없다","a":"학생치고 시험을 좋아하는 사람은 없어요","en":"There is no student who likes exams."},{"g":"g8-2","ch":8,"title":"N치고 ~ / N치고는 ~","p":"예순 살이다 + 아주 건강해 보이다","a":"예순 살치고는 아주 건강해 보여요","en":"For someone in their sixties, you look very healthy."},{"g":"g8-2","ch":8,"title":"N치고 ~ / N치고는 ~","p":"비싼 옷이다 + 품질이 별로이다","a":"비싼 옷치고는 품질이 별로예요","en":"For an expensive piece of clothing, the quality is not great."},{"g" ":["변덕스럽다","시원시원하다","신중하다","털털하다"],"en":"Minsu thinks several times before deciding and never rushes into risky things. -> cautious / prudent."},{"text":"수진 씨는 시험에서 일등을 했는데도 \"운이 좋았어요.\"라고 말해요. 자기 자랑을 전혀 하지 않아요.","answer":"겸손하다","options":["겸손하다","직선적이다","이기적이다","보수적이다"],"en":"Sujin came first in the exam but says \"I was just lucky\" and never boasts. -> humble / modest."},{"text":"윤호 씨는 식당에 가면 재료부터 온도까지 따지는 게 많아요. 마음에 드는 곳을 찾기가 쉽지 않아서 같이 가는 사람이 힘들어요.","answer":"까다롭다","options":["단순하다","털털하다","차분하다","까다롭다"],"en":"Yunho is demanding about ingredients and temperature at restaurants, and is hard to please. -> picky / hard to please."},{"text":"지연 씨는 서류를 내기 전에 오타가 없는지 몇 번씩 확인해요. 작은 부분도 빠뜨리지 않아요.","answer":"꼼꼼하다","options":["변덕스럽다","꼼꼼하다","시원시원하다","싫증을 잘 내다"],"en":"Jiyeon checks a document several times for typos and never misses small details. -> meticulous / thorough."},{"text":"태현 씨는 복잡하게 생각하지 않아요. 기분 나쁜 일이 있어도 맛있는 걸 먹으면 금방 잊어버려요.","answer":"단순하다","options":["융통성이 없다","단순하다","까다롭다","이성적이다"],"en":"Taehyeon does not think in a complicated way; a tasty meal makes him forget a bad mood. -> simple / straightforward."},{"text":"민아 씨는 옷이 좀 더러워져도 신경 쓰지 않고 누구와도 편하게 지내요. 작은 일에 화를 내는 일이 없어요.","answer":"털털하다","options":["꼼꼼하다","겸손하다","보수적이다","털털하다"],"en":"Mina does not mind a bit of dirt on her clothes, gets along with anyone and never gets angry over small things. -> easygoing."},{"text":"아버지는 새로운 방식보다 예전부터 해 오던 방식을 더 좋아하세요. 변화를 별로 반기지 않으세요.","answer":"보수적이다","options":["보수적이다","예술 감각이 있다","직선적이다","차분하다"],"en":"My father prefers the traditional way to new ones and does not welcome change. -> conservative."},{"text":"하준 씨는 아침에는 영화를 보러 가자고 했다가 점심에는 집에 있겠다고 해요. 기분과 생각이 자주 바뀌어요.","answer":"변덕스럽다","options":["융통성이 없다","신중하다","변덕스럽다","이성적이다"],"en":"Hajun suggests a movie in the morning and wants to stay home by lunch; his mood and ideas change often. -> moody / fickle."},{"text":"소영 씨는 결정이 빠르고 생각을 솔직하게 말해서, 이야기를 하면 속이 후련해져요. 일도 망설이지 않고 척척 해요.","answer":"시원시원하다","options":["이기적이다","겸손하다","까다롭다","시원시원하다"],"en":"Soyoung decides quickly and speaks frankly, so talking to her feels refreshing; she does things without hesitation. -> open and decisive."},{"text":"지훈 씨는 새로 산 게임도 일주일이 지나면 재미없다고 해요. 취미도 자주 바꿔요.","answer":"싫증을 잘 내다","options":["신중하다","싫증을 잘 내다","보수적이다","단순하다"],"en":"Jihun says a new game is boring after a week and changes hobbies often. -> gets bored easily."},{"text":"은지 씨는 색깔을 고르는 눈이 남달라서 방을 꾸미면 갤러리처럼 보여요. 그림도 잘 그리고 사진도 잘 찍어요.","answer":"예술 감각이 있다","options":["털털하다","이성적이다","예술 감각이 있다","융통성이 없다"],"en":"Eunji has a rare eye for colour, her room looks like a gallery, and she draws and takes photos well. -> has an artistic sense."},{"text":"과장님은 규칙에 없는 일은 어떤 경우에도 안 된다고 하세요. 상황이 바뀌어도 방법을 바꾸지 않으세요.","answer":"융통성이 없다","options":["융통성이 없다","시원시원하다","겸손하다","싫증을 잘 내다"],"en":"My manager says anything outside the rules is never allowed and does not change method when the situation changes. -> inflexible."},{"text":"세호 씨는 팀 프로젝트를 할 때 자기에게 이익이 되는 일만 하고 힘든 일은 다른 사람에게 미뤄요.","answer":"이기적이다","options":["이기적이다","차분하다","꼼꼼하다","예술 감각이 있다"],"en":"In team projects Seho only does what benefits him and leaves the hard work to others. -> selfish."},{"text":"다은 씨는 화가 나도 감정보다 사실과 이유를 먼저 따져서 판단해요. 분위기에 흔들리지 않아요.","answer":"이성적이다","options":["변덕스럽다","털털하다","이성적이다","보수적이다"],"en":"Daeun, even when angry, judges by facts and reasons before feelings and is not swayed by the mood. -> rational."},{"text":"현우 씨는 마음에 안 드는 점이 있으면 돌려 말하지 않고 바로 말해요. 그래서 가끔 그 말에 상처받는 사람도 있어요.","answer":"직선적이다","options":["신중하다","직선적이다","까다롭다","단순하다"],"en":"Hyunwoo says what he dislikes directly without hinting, and sometimes people are hurt by it. -> blunt / direct."},{"text":"혜진 씨는 사고가 났을 때도 당황하지 않고 조용하고 침착하게 상황을 설명했어요. 목소리도 늘 낮고 부드러워요.","answer":"차분하다","options":["이기적이다","시원시원하다","싫증을 잘 내다","차분하다"],"en":"Hyejin, even at an accident, explained the situation quietly without panic; her voice is always low and soft. -> calm / composed."}],"wrong":[{"sents":["동생이 조용한 교실에서 피리를 [[뀌어서]] 모두 웃었다.","운 ":"불리하다","why":"유리하다 means advantageous; having no umbrella in the rain is a disadvantage (불리하다)."},{"sents":["그 사람의 말도 [[일리가 있어서]] 동의했다.","전쟁이 끝난 후 도시를 [[복구하는]] 데 십 년이 걸렸다.","두 사람이 [[동시에]] 같은 말을 해서 웃었다.","나는 어제 먹은 점심이 [[기억력]]이 안 난다."],"wrong":3,"fix":"기억이","why":"\"기억이 나다\" is the collocation; 기억력 is the ability to remember."},{"sents":["그 사건은 사회에 큰 문제를 [[저질렀다]].","그는 내 의견에 동의한다는 뜻으로 고개를 [[끄덕였다]].","처음 만난 사람들과 있으니 분위기가 [[어색했다]].","공장의 근무 환경이 [[열악해서]] 직원들이 힘들어한다."],"wrong":0,"fix":"일으켰다","why":"문제를 일으키다 (cause a problem); 저지르다 goes with mistakes and offenses, not 문제."},{"sents":["노래방에서 [[열창하는]] 친구를 보고 모두 박수를 쳤다.","생일 선물을 받아서 너무 기뻐서 얼굴을 [[찡그렸다]].","엄마가 아이에게 장난감을 [[가져다주었다]].","출장을 가서 현지 문화를 [[파악했다]]."],"wrong":1,"fix":"활짝 웃었다","why":"찡그리다 is to frown; it does not fit receiving a happy gift."},{"sents":["요즘 일이 많아서 [[벅차다]].","그는 취미로 정원을 [[가꾼다]].","친구의 [[덕]]에 시험에 합격했다.","우산이 없어서 소나기를 그대로 [[쬐었다]]."],"wrong":3,"fix":"맞았다","why":"비를 맞다 (get rained on); 쬐다 is for sunlight or heat."},{"sents":["서류를 [[꼼꼼하게]] 확인해서 실수가 없었다.","그 공연의 표는 [[순식간]]에 매진되었다.","동생이 장난을 치다가 엄마한테 [[혼냈다]].","월급이 올라서 부모님께 용돈을 [[보태]] 드렸다."],"wrong":2,"fix":"혼났다","why":"혼나다 (be scolded) is passive; 혼내다 means the scolder is the subject."},{"sents":["이 음식은 [[도무지]] 맛있다.","아이들의 [[순수한]] 웃음을 보면 마음이 편해진다.","회사에서 [[정시 퇴근]]을 하려고 노력한다.","며칠 밤을 새워서 그의 얼굴이 [[초췌해졌다]]."],"wrong":0,"fix":"정말","why":"도무지 is used only with negatives (cannot at all); \"정말 맛있다\" is right."},{"sents":["쓰레기는 [[분리배출]]을 해야 한다.","청소를 깨끗이 했더니 방이 [[어지럽다]].","아이들이 독립하고 나니 집이 [[허전해졌다]].","그 영화의 마지막 장면은 정말 [[강렬했다]]."],"wrong":1,"fix":"깔끔하다","why":"어지럽다 means messy; after cleaning the room should be neat (깔끔하다)."}],"pick":[{"s":"형은 말썽을 부려서 집에서 ( 쫓겨났다 / 쫓아냈다 ).","answer":"쫓겨났다","en":"My brother got into trouble and was kicked out of the house (passive)."},{"s":"신제품에 대한 소비자의 ( 영향 / 반응 )이 뜨겁다.","answer":"반응","en":"Consumers' reaction to the new product is hot."},{"s":"컵에 물이 ( 지나쳐서 / 넘쳐서 ) 바닥에 흘렀다.","answer":"넘쳐서","en":"The cup overflowed and water spilled on the floor."},{"s":"그는 매일 연습해서 노래 실력을 ( 키웠다 / 가꿨다 ).","answer":"키웠다","en":"He built up his singing skill by practising every day."},{"s":"높은 곳에 올라가는 것이 ( 어색해서 / 두려워서 ) 다리가 떨렸다.","answer":"두려워서","en":"Going up high was frightening, so my legs shook."},{"s":"아이들이 독립해서 집이 ( 허전하다 / 허기지다 ).","answer":"허전하다","en":"The children moved out, so the house feels empty."},{"s":"운동을 하면 쌓인 스트레스를 ( 해소될 / 해소할 ) 수 있다.","answer":"해소할","en":"Exercise lets you relieve built-up stress (object -> active verb)."},{"s":"겨울이 지나면서 날씨가 ( 단순히 / 서서히 ) 따뜻해졌다.","answer":"서서히","en":"As winter passed, the weather gradually got warm."},{"s":"그는 한 번 들은 노래는 ( 곧잘 / 도무지 ) 따라 부른다.","answer":"곧잘","en":"He can readily sing along to a song he has heard once."},{"s":"두 사람의 의견 차이가 ( 뻔해서 / 뚜렷해서 ) 합의하기 어렵다.","answer":"뚜렷해서","en":"The difference in their opinions is clear, so agreement is hard."},{"s":"회사의 경비가 ( 허술해서 / 열악해서 ) 도둑이 쉽게 들어왔다.","answer":"허술해서","en":"The company's security was sloppy, so a thief got in easily."},{"s":"상을 받았지만 그는 ( 겸손하게 / 무례하게 ) 감사 인사를 했다.","answer":"겸손하게","en":"Although he won a prize, he thanked everyone humbly."},{"s":"작은 실수가 큰 사고를 ( 일으켰다 / 일어났다 ).","answer":"일으켰다","en":"A small mistake caused a big accident."},{"s":"두 사람은 취향이 ( 맞춰서 / 맞아떨어져서 ) 금방 친해졌다.","answer":"맞아떨어져서","en":"Their tastes matched exactly, so they became close quickly."},{"s":"정부는 저출산 대책을 ( 갖췄다 / 마련했다 ).","answer":"마련했다","en":"The government arranged measures against the low birth rate."},{"s":"친구의 의견을 ( 습득했다 / 받아들였다 ).","answer":"받아들였다","en":"I accepted my friend's opinion."},{"s":"그는 첫눈에 그녀에게 ( 반했다 / 반응했다 ).","answer":"반했다","en":"He fell for her at first sight."},{"s":"그는 올림픽에 ( 출전해서 / 출연해서 ) 금메달을 땄다.","answer":"출전해서","en":"He entered the Olympics and won a gold medal."},{"s":"바닥에 ( 엎드려서 / 숨어서 ) 책을 읽었다.","answer":"엎드려서","en":"I lay face down on the floor and read a book."},{"s":"앞이 안 보이니 좀 ( 비켜 / 가려 ) 주세요.","answer":"비켜","en":"I cannot see, so please step aside."},{"s":"이 영화는 십오 세 이상 ( 상영 / 관람 )가예요.","answer":"관람","en":"This film is rated for viewers aged fifteen and over."},{"s":"윗사람을 직접 부를 때 쓰는 말을 ( 지칭어 / 호칭어 )라고 한다.","answer":"호칭어","en":"A word used to address a superior directly is a term of address."},{"s":"펭귄은 ( 북극 / 남극 )에 산다.","answer":"남극","en":"Penguins live in the South Pole / Antarctica."},{"s":"소리에 ( 예민해서 / 예리해서 ) 작은 소음에도 잠을 깬다.","answer":"예민해서","en":"I am sensitive to sound, so even a small noise wakes me."}],"idiom":[{"idiom":"걱정이 태산이다","b":"아니요, 걱정이 태산이에요. 어떤 질문이 나올지 몰라서 잠도 안 와요.","modelA":"내일이 면접이라면서요? 준비는 잘 되고 있어요?","en":"A: Your interview is tomorrow, right? Is the preparation going well? B: No, I'm worried sick. I don't know what questions will come up, so I can't even sleep."},{"idiom":"총대를 메다","b":"그럼 제가 총대를 메고 학생회에 이야기해 볼게요.","modelA":"반 친구들이 학교 식당 음식에 불만이 많은데 아무도 건의를 안 해요.","en":"A: Our classmates are unhappy with the cafeteria food, but nobody makes a suggestion. B: Then I'll take the lead and talk to the student council."},{"idiom":"독 안에 든 쥐","b":"독 안에 든 쥐 신세가 됐네요. 이제 빠져나갈 길이 없겠어요.","modelA":"상대 팀 선수들이 우리 선수를 완전히 둘러싸서 공을 패스할 데가 없대요.","en":"A: The other team has completely surrounded our player, so there's nowhere to pass the ball. B: He's become a rat in a jar. There's no way out now."},{"idiom":"소문난 잔치에 먹을 것 없다","b":"소문난 잔치에 먹을 것 없다더니 그 카페가 딱 그렇군요.","modelA":"인터넷에서 유명한 카페에 갔는데 사람만 많고 커피 맛은 평범했어요.","en":"A: I went to a cafe famous online, but it was just crowded and the coffee was ordinary. B: All hype, little substance, as they say - that cafe is exactly that."},{"idiom":"혀를 내두르다","b":"맞아요. 저도 민호 씨의 실력에 혀를 내둘렀어요.","modelA":"새로 온 민호 씨는 한국어를 배운 지 6개월밖에 안 됐는데 벌써 뉴스를 이해한대요.","en":"A: The new student Minho has studied Korean for only six months and already understands the news. B: That's right. I was amazed at his skill too."},{"idiom":"숨통이 트이다","b":"이제야 숨통이 트이는 것 같아요. 한 달 동안 정말 힘들었거든요.","modelA":"시험이 어제 끝났죠? 기분이 어때요?","en":"A: Your exams ended yesterday, right? How do you feel? B: I finally feel like I can breathe. The past month was really hard."},{"idiom":"믿는 도끼에 발등 찍힌다","b":"믿는 도끼에 발등 찍힌다더니, 사장님이 정말 속상하시겠어요.","modelA":"동업자를 믿고 가게를 맡겼는데 돈을 가지고 사라졌대요.","en":"A: He trusted his business partner with the shop, but the partner vanished with the money. B: Betrayed by the one he trusted, as they say. The owner must be really upset."},{"idiom":"소귀에 경 읽기","b":"소귀에 경 읽기네요. 아무리 이야기해도 달라지지 않는군요.","modelA":"후배한테 회의에 늦지 말라고 몇 번이나 말했는데 오늘도 늦었어요.","en":"A: I told my junior many times not to be late for meetings, but he was late again today. B: It's like reading scripture to a cow's ear. He doesn't change no matter what you say."},{"idiom":"녹초가 되다","b":"네, 끝나고 나서 완전히 녹초가 돼서 집에 오자마자 쓰러져 잤어요.","modelA":"어제 마라톤 대회에서 완주하셨다면서요?","en":"A: I heard you finished the marathon yesterday? B: Yes, afterwards I was completely worn out and fell asleep as soon as I got home."},{"idiom":"눈치가 보이다","b":"아직요. 팀원들이 바쁜 시기라서 눈치가 보여요.","modelA":"육아 휴직을 쓰고 싶다고 하셨는데 신청하셨어요?","en":"A: You said you wanted to take parental leave. Did you apply? B: Not yet. The team is in a busy period, so I feel uneasy about it."},{"idiom":"정이 들다","b":"오래 같이 다니다 보니까 정이 들었거든요. 버리기가 아까워요.","modelA":"십 년이나 된 낡은 자전거를 왜 안 버리세요?","en":"A: Why don't you throw away that ten-year-old bike? B: After riding it together for so long, I've grown attached to it. It feels like a waste to throw it away."},{"idiom":"입을 틔우다","b":"네, 얼마 전에 드디어 입을 틔웠어요. 이제 간단한 대화는 할 수 있어요.","modelA":"한국에 온 지 석 달이 됐는데 한국어는 좀 늘었어요?","en":"A: It's been three months since you came to Korea. Has your Korean improved? B: Yes, I finally started speaking not long ago. I can have simple conversations now."},{"idiom":"말을 아끼다","b":"확실한 결과가 나올 때까지 말을 아끼시는 거예요.","modelA":"기자가 사고 원인을 물었는데 감독님이 대답을 안 하셨대요.","en":"A: A reporter asked about the cause of the accident, but the coach didn't answer. B: He's holding back his words until the exact results come out."},{"idiom":"일리가 있다","b":"그 말씀에 일리가 있네요. 저도 신입일 때 말을 못 해서 아쉬웠거든요.","modelA":"저는 신입 사원도 회의에서 자유롭게 의견을 말해야 한다고 생각해요.","en":"A: I think even new employees should freely give opinions in meetings. B: You have a point. When I was new I regretted not being able to speak up."},{"idiom":"입장을 밝히다","b":"내일 기자 회견에서 학교 측이 공식 입장을 밝힐 예정이래요.","modelA":"논란이 된 규칙에 대해서 학교가 아직 아무 말도 안 했어요.","en":"A: The school hasn't said anything yet about the controversial rule. B: I heard the school will state its official position at tomorrow's press conference."},{"idiom":"집안이 시끄럽다","b":"형이 갑자기 회사를 그만둔다고 해서 집안이 시끄러워요.","modelA":"요즘 무슨 일 있어요? 표정이 안 좋아 보여요.","en":"A: Is something going on lately? You look unhappy. B: My older brother suddenly said he's quitting his job, so the household is in an uproar."},{"idiom":"업어 키우다","b":"그럼요. 부모님이 바쁘셔서 할머니가 어릴 때부터 업어 키우셨거든요.","modelA":"할머니가 손자를 정말 많이 예뻐하세요.","en":"A: The grandmother really dotes on her grandson. B: Of course. His parents were busy, so she raised him lovingly on her back from when he was little."},{"idiom":"허파에 바람이 덜 빠지다","b":"허파에 바람이 덜 빠졌나 봐요. 조금 철이 없어 보이네요.","modelA":"쟤는 내일이 시험인데도 하루 종일 친구들이랑 웃고 떠들어요.","en":"A: His exam is tomorrow, but he's laughing and chatting with friends all day. B: He must not have let the air out of his lungs yet. He seems a bit giddy and immature."},{"idiom":"두 마리 토끼를 다 잡다","b":"네, 돈도 벌고 영어도 늘어서 두 마리 토끼를 다 잡았어요.","modelA":"영어 학원에서 아르바이트를 하면서 공부도 하신다면서요?","en":"A: I heard you work part-time at an English academy and study there too? B: Yes, I earn money and my English improves, so I've caught two rabbits at once."},{"idiom":"기에 눌리다","b":"면접관 세 분의 분위기가 너무 강해서 기에 눌려 제대로 대답을 못 했어요.","modelA":"면접은 잘 보셨어요? 면접관이 무서웠어요?","en":"A: How was the interview? Were the interviewers scary? B: The three interviewers had such a strong presence that I was overpowered and couldn't answer properly."}],"speak":[{"grammar":"-에 따르면 -다고 하다","a":"내일 날씨가 어떻대요? 우산을 가져가야 할까요?","b":"___ 내일은 하루 종일 비가 온다고 해요. 우산을 꼭 가져가세요.","answers":["일기 예보에 따르면","일기 예보에 의하면","뉴스에 따르면","뉴스에 의하면","기상청에 따르면","기상청에 의하면"],"en":"A: What's the weather tomorrow? Should I bring an umbrella? B: According to the forecast, it will rain all day tomorrow. Be sure to bring one."},{"grammar":"-이/가 그러는데 -대(요)","a":"다음 주 학교 축제에 누가 온대요?","b":"선배가 ___ 아주 유명한 가수가 온대요.","answers":["그러는데"],"en":"A: Who is coming to the school festival next week? B: A senior told me that a very famous singer is coming."},{"grammar":"-다면서 (-다고 하면서)","a":"어제 모임에 안 오셨어요. 무슨 일 있었어요?","b":"미안해요. 친구가 갑자기 아프___ 전화해서 병원에 데려다줬어요.","answers":["다면서","다고 하면서"],"en":"A: You didn't come to the gathering yesterday. What happened? B: Sorry. A friend called saying she suddenly got sick, so I took her to the hospital."},{"grammar":"-다는데 (-다고 하는데)","a":"사람이 너무 많은데 다른 식당으로 갈까요?","b":"여기 불고기가 정말 맛있___ 조금만 더 기다려 봐요.","answers":["다는데","다고 하는데"],"en":"A: There are too many people. Shall we go to another restaurant? B: They say the bulgogi here is really good, so let's wait a little longer."},{"grammar":"-을/를 대상으로 -에 대해 설문 조사하다","a":"발표 준비는 어떻게 하고 있어요?","b":"우리 반 학생 50명___ 한국 음식에 대해 설문 조사한 결과를 발표할 거예요.","answers":["을 대상으로"],"en":"A: How is your presentation preparation going? B: I'll present the results of a survey about Korean food, taken among 50 students in our class."},{"grammar":"-이/가 -%로 가장 많았습니다","a":"설문 조사에서 가장 많이 나온 응답은 무엇이었습니까?","b":"\"운동 부족\"이라는 응답이 42%___.","answers":["로 가장 많았습니다","로 가장 많았어요","로 가장 많았다"],"en":"A: What was the most common response in the survey? B: \"Lack of exercise\" was the most common, at 42%."},{"grammar":"그 다음으로는 -의 순이었습니다","a":"그다음으로 많은 응답은 무엇이었습니까?","b":"그 다음으로는 수면 부족 30%, 스트레스 18%___.","answers":["의 순이었습니다","의 순이었어요","의 순으로 나타났습니다","순으로 나타났습니다","순이었습니다"],"en":"A: What were the next most common responses? B: Next came lack of sleep at 30% and stress at 18%, in that order."},{"grammar":"그 밖에 -다는 의견도 있었습니다","a":"그 외에 다른 의견은 없었습니까?","b":"네, 그 ___ 혼자 하는 운동이 부담스럽다는 의견도 있었습니다.","answers":["밖에"],"en":"A: Were there no other opinions? B: Yes, besides that, there was also the opinion that exercising alone is a burden."},{"grammar":"이러한 결과를 통해 -을 알 수 있었습니다","a":"조사 결과에서 무엇을 알 수 있었습니까?","b":"이러한 결과를 ___ 많은 직장인이 점심시간에도 제대로 쉬지 못한다는 것을 알 수 있었습니다.","answers":["통해","통해서"],"en":"A: What did you learn from the survey results? B: Through these results, we could see that many office workers can't properly rest even during lunchtime."},{"grammar":"제 생각에는 -다고 봅니다","a":"학교에서 교복을 꼭 입어야 한다고 생각하세요?","b":"___ 교복은 없어지는 편이 좋다고 봅니다.","answers":["제 생각에는","제 생각으로는","저는"],"en":"A: Do you think students must wear school uniforms? B: In my opinion, it would be better for uniforms to be abolished."},{"grammar":"만약 -(으)ㄹ 경우 -게 됩니다","a":"계약서에 서명하지 않으면 어떻게 되나요?","b":"만약 계약서에 서명하지 않을 ___ 계약은 무효가 될 수도 있습니다.","answers":["경우","경우에","경우에는"],"en":"A: What happens if I don't sign the contract? B: If you don't sign the contract, the contract could become void."},{"grammar":"-(으)므로","a":"왜 새 컴퓨터를 사지 않기로 하셨습니까?","b":"가격이 너무 비싸___ 이번에는 사지 않기로 했습니다.","answers":["므로"],"en":"A: Why did you decide not to buy a new computer? B: The price is too high, so I decided not to buy one this time."},{"grammar":"-다든지 -다든지 하다","a":"꽃이랑 케이크 중에 뭐가 좋을까요? 선물을 고르지 못하겠어요.","b":"케이크를 사 가든지 꽃을 사 ___ 하세요. 둘 다 좋아하실 거예요.","answers":["가든지","가든가"],"en":"A: Which is better, flowers or a cake? I can't choose a gift. B: Either buy a cake or buy flowers. They'll like both."},{"grammar":"저도 -씨의 의견에 (전적으로) 동의합니다","a":"저는 모든 학생이 봉사 활동을 해야 한다고 생각합니다.","b":"저도 지수 씨의 의견에 ___.","answers":["전적으로 동의합니다","전적으로 동의해요","동의합니다","동의해요"],"en":"A: I think every student should do volunteer work. B: I also fully agree with Jisu's opinion."},{"grammar":"-씨의 말도 일리는 있지만","a":"저는 회의를 모두 온라인으로 바꿔야 한다고 봅니다.","b":"민수 씨의 ___ 직접 만나야 아이디어가 잘 나올 때도 있어요.","answers":["말도 일리는 있지만","말씀도 일리는 있지만","말도 일리가 있지만","말씀도 일리가 있지만"],"en":"A: I think all meetings should be moved online. B: What Minsu says has a point, but sometimes ideas come out better when we meet in person."},{"grammar":"말씀하시는데 죄송하지만","a":"그 프로젝트는 처음부터 계획이 잘못됐고, 담당자가 제대로 관리를 안 했습니다.","b":"말씀하시는데 ___ 그 부분은 제가 담당했으니 제가 설명해도 되겠습니까?","answers":["죄송하지만","죄송합니다만","죄송한데"],"en":"A: That project had a wrong plan from the start, and the person in charge didn't manage it properly. B: Sorry to interrupt, but I handled that part, so may I explain?"},{"grammar":"구체적으로 말씀해 주시겠습니까?","a":"이번 보고서는 내용이 많이 부족한 것 같아요.","b":"혹시 어떤 부분이 부족한지 ___ 말씀해 주시겠습니까?","answers":["구체적으로"],"en":"A: This report seems to lack a lot of content. B: Could you tell me specifically which parts are lacking?"},{"grammar":"그러니까 -다는 말씀이시군요","a":"제 말은, 신제품 출시를 한 달 미루고 그 시간에 광고를 더 하자는 거예요.","b":"아, 그러니까 출시를 미루고 광고에 더 투자하자는 ___?","answers":["말씀이시군요","말씀이군요","말씀이시죠"],"en":"A: What I mean is, let's delay the product launch a month and use the time to advertise more. B: Ah, so what you're saying is to delay the launch and invest more in advertising?"},{"grammar":"호칭: 모르는 사람에게 (저기요)","a":"음식이 한참 동안 안 나오네요. 직원을 불러 볼까요?","b":"네, ___ 주문한 음식이 아직 안 나왔는데요.","answers":["저기요","여기요"],"en":"A: The food hasn't come for a long time. Shall we call a staff member? B: Yes. Excuse me, the food we ordered hasn't come yet."},{"grammar":"호칭: 가족이 아닌 사람에게도 사용하는 가족 호칭어","a":"식당에서 어머니 나이쯤 되신 직원분을 친근하게 부르려면 뭐라고 해요?","b":"\"___, 여기 물 좀 주세요!\"라고 하면 돼요.","answers":["이모","아주머니","아줌마","어머니","어머님"],"en":"A: How do I call a staff member about my mother's age in a friendly way at a restaurant? B: You can say \"Auntie, some water here, please!\""}],"simile":[{"expr":"맹모삼천지교","meaning":"Mencius' mother moved three times - a parent who will go to any length, even moving house, for the child's education","model":["A: 딸이 책을 좋아해서 다음 달에 도서관 근처로 이사하려고요.","B: 맹모삼천지교가 따로 없네요. 아이를 위해 큰 결정을 하셨군요.","A: 네, 아이가 좋은 환경에서 공부했으면 해서요.","B: 부모님 마음이 느껴져요. 새 동네에서도 잘 지내길 바랄게요."]},{"expr":"보기 좋은 떡이 먹기에 좋다","meaning":"good-looking rice cake is good to eat - things that look nice also tend to be nicer to have","model":["A: 이 한과 세트는 포장이 정말 예쁘네요. 선물하기 좋겠어요.","B: 보기 좋은 떡이 먹기에도 좋다더니, 하나 먹어 보니까 맛도 좋아요.","A: 그래요? 그럼 부모님께 드릴 것도 하나 살게요.","B: 좋은 생각이에요. 받으시는 분도 기뻐하실 거예요."]},{"expr":"이것저것 없는 게 없다","meaning":"there is a bit of everything, nothing is missing - a place that sells all kinds of things","model":["A: 이 시장에 처음 와 봤는데 규모가 정말 크네요.","B: 네, 이것저것 없는 게 없어서 필요한 건 여기서 다 살 수 있어요.","A: 과일부터 옷까지 다 있어서 구경하는 것만으로도 재미있어요.","B: 그럼 먼저 옷 가게부터 구경하고 점심은 시장 음식으로 먹어요."]},{"expr":"배워도 배워도 끝이 없다","meaning":"no matter how much you learn, there is no end - learning never finishes","model":["A: 한국어를 공부한 지 3년이 됐는데도 모르는 표현이 계속 나와요.","B: 배워도 배워도 끝이 없죠. 저도 매일 새로운 말을 알게 돼요.","A: 가끔은 실력이 늘지 않는 것 같아서 걱정이 돼요.","B: 처음보다 훨씬 잘하고 있으니까 너무 걱정하지 마세요."]},{"expr":"죽은 듯이 있다","meaning":"to keep a very low profile - to stay quiet and not draw attention, as if dead","model":["A: 이번 주에 감사팀이 우리 회사에 온대요. 팀 분위기가 이상하지 않아요?","B: 맞아요. 다들 죽은 듯이 있어서 사무실이 너무 조용해요.","A: 평소에는 농담도 많이 하던 분들인데 말이에요.","B: 감사가 끝나면 다시 시끌벅적해질 거예요."]},{"expr":"밸런스를 맞추다","meaning":"to strike a balance - to keep two things (e.g., work and life) in good proportion","model":["A: 일하랴 공부하랴 정신이 없다고 하셨죠? 요즘은 어떠세요?","B: 일과 공부의 밸런스를 맞추려고 매주 일요일에는 쉬기로 했어요.","A: 좋은 방법이네요. 쉬는 날이 있어야 오래 할 수 있죠.","B: 맞아요. 그렇게 하니까 훨씬 마음이 편해졌어요."]},{"expr":"믿는 구석이 있다","meaning":"to have something to fall back on - to feel safe because of a backup or support","model":["A: 회사를 그만두고 사업을 시작하신다니 걱정이 안 되세요?","B: 사실 믿는 구석이 있어요. 몇 년 동안 모은 돈도 있고 도와주실 분도 있거든요.","A: 그렇군요. 그래도 준비를 철저히 하셔야 해요.","B: 네, 조언 감사합니다. 차근차근 준비해 볼게요."]},{"expr":"뭐니 뭐니 해도","meaning":"whatever anyone says, after all - above all else","model":["A: 여행지로 바다가 좋을까요, 산이 좋을까요?","B: 뭐니 뭐니 해도 바다가 최고죠. 마음이 시원해지잖아요.","A: 저는 산을 더 좋아하는데, 이번에는 바다로 가 볼까요?","B: 좋아요. 이번 여름에는 동해에 가 봐요."]}],"conflict":[{"title":"새벽 게임 소음","lines":["친구1: 야, 지금 새벽 두 시야. 또 게임하는 거야? 소리 좀 줄여.","친구2: 내 방에서 내 마음대로 하는 건데 뭐가 문제야?","친구1: 네 소리 때문에 내가 매일 잠을 못 자잖아. 너는 남 생각은 하나도 안 해.","친구2: 그럼 네가 귀마개를 하면 되잖아. 왜 나한테만 뭐라고 해?","친구1: 귀마개를 하라니, 그게 말이 돼? 정말 이기적이다.","친구2: 됐어. 앞으로 너랑은 아무 말도 안 할 거야."],"problem":"Friend 1 commands and labels the roommate as selfish (lines 1, 3, 5); Friend 2 gets defensive and shifts the burden back with 'wear earplugs' (lines 2, 4, 6). Neither explains the effect calmly, asks about the other's situation, or proposes a compromise.","model":["A: 지금 잠깐 이야기해도 괜찮아? 요즘 밤에 게임 소리 때문에 잠을 잘 못 자서 그래.","B: 아, 그랬어? 몰랐어. 소리가 그렇게 크게 들리는 줄 몰랐어. 미안해.","A: 게임을 하는 건 괜찮아. 다만 새벽 한 시 이후에는 소리를 줄여 줬으면 해.","B: 무슨 말인지 알겠어. 그런데 나는 낮에 수업이 있어서 밤에만 시간이 나.","A: 그 점은 나도 인정해. 그럼 헤드폰을 쓰든지 한 시까지만 하든지 하면 어때?","B: 좋아. 앞으로는 헤드폰을 쓸게. 먼저 이야기해 줘서 고마워."]},{"title":"약속에 늦는 친구","lines":["친구1: 또 늦었어? 삼십 분이나 기다렸잖아.","친구2: 길이 막혀서 어쩔 수 없었어. 그렇게 화낼 일이야?","친구1: 맨날 길 탓이지. 너는 약속을 가볍게 생각하는 거야.","친구2: 내가 언제 가볍게 생각했다고 그래? 지난번에는 네가 늦었잖아.","친구1: 그건 5분이었어. 그게 지금이랑 비교가 돼?","친구2: 그럼 앞으로는 너 혼자 만나든지 말든지 해."],"problem":"Friend 1 accuses the friend of not taking promises seriously and dismisses the other's excuse (lines 3, 5); Friend 2 deflects with 'the road was busy' and counter-attacks about last time (lines 2, 4, 6). Nobody states the feeling calmly or agrees on a way to give notice in advance.","model":["A: 오늘 삼십 분 기다리면서 조금 속상했어. 지금 이야기해도 괜찮아?","B: 응, 말해 봐. 길이 막혀서 늦었는데 미리 연락을 못 해서 미안해.","A: 길이 막힌 건 어쩔 수 없지. 그래도 늦을 것 같으면 미리 말해 주면 좋겠어.","B: 네 말도 일리가 있어. 그런데 운전할 때는 문자를 볼 수가 없어.","A: 그러니까 운전 중에는 연락이 어렵다는 말이구나. 그럼 출발하기 전에 미리 메시지를 남기면 어때?","B: 좋은 생각이야. 앞으로는 출발하기 전에 꼭 연락할게."]},{"title":"망가진 노트북","lines":["친구1: 내 노트북 화면에 금이 갔네. 네가 떨어뜨렸지?","친구2: 아니야, 나는 안 떨어뜨렸어. 원래 그랬던 거 아니야?","친구1: 무슨 소리야? 빌려주기 전에는 멀쩡했어. 거짓말하지 마.","친구2: 거짓말이라니. 증거도 없이 사람을 의심하는 게 어디 있어?","친구1: 그럼 누가 그랬는데? 네가 안 했으면 네가 알아 와 봐."],"problem":"Friend 1 accuses without asking first and calls the friend a liar (lines 1, 3, 5); Friend 2 denies flatly and counter-attacks (lines 2, 4). Neither describes what happened calmly or proposes how to handle the repair.","model":["A: 노트북 화면 때문에 이야기하고 싶은데 지금 괜찮아? 화를 내려는 건 아니야.","B: 응. 나는 떨어뜨린 기억이 없는데, 내가 모르게 그랬을 수도 있겠다.","A: 빌려주기 전에는 금이 없어서 마음이 좀 속상해. 혹시 구체적으로 기억나는 일 없어?","B: 가방에 넣고 다닐 때 다른 책이랑 부딪혔을 수는 있어. 말해 줘서 고마워.","A: 그렇구나. 그럼 수리비를 반씩 내든지 수리점 견적을 먼저 받아 보든지 하자.","B: 좋아. 일단 수리점에 같이 가서 견적부터 받아 보자."]},{"title":"동아리 모임 장소","lines":["친구1: 이번 모임은 고깃집으로 하자. 내가 이미 예약했어.","친구2: 나 채식을 해서 고깃집에서는 먹을 게 없는데.","친구1: 그럼 샐러드 먹으면 되잖아. 다들 고기 좋아하는데 너 때문에 바꿀 순 없어.","친구2: 나만 불편하다는 걸 알면서 그렇게 말해?","친구1: 불편하면 안 와도 돼. 억지로 오라는 사람 없어.","친구2: 알았어. 그럼 안 갈게."],"problem":"Friend 1 decides alone and dismisses the vegetarian friend's need (lines 1, 3, 5); Friend 2 states the problem but then withdraws in hurt (lines 4, 6). Nobody looks for a place that suits everyone or asks for the other's idea.","model":["A: 모임 장소 때문에 이야기하고 싶은데 잠깐 괜찮아? 내가 먼저 정하고 말해서 미안해.","B: 응. 나는 채식을 하니까 고깃집에서는 먹을 게 거의 없어서 좀 걱정이 됐어.","A: 그렇구나. 몰랐어. 네 입장을 이해했어. 이미 예약했지만 바꿀 수 있는지 알아볼게.","B: 고마워. 다른 사람들이 고기를 좋아하는 것도 알아. 그 점은 나도 인정해.","A: 그러니까 고기도 있고 채식 메뉴도 있는 식당이면 된다는 말이지?","B: 응, 맞아. 그런 곳을 찾아보든지 예약을 바꾸든지 해 보자."]},{"title":"공용 냉장고의 요거트","lines":["친구1: 냉장고에 있던 내 요거트 누가 먹었어? 네가 먹었지?","친구2: 아니야, 난 안 먹었어. 왜 맨날 나만 의심해?","친구1: 우리 집에 너 말고 누가 있어? 거짓말하지 마.","친구2: 거짓말이라니! 증거도 없이 사람을 몰아붙이는 게 어디 있어?","친구1: 그럼 누가 먹었는지 네가 알아 와 봐.","친구2: 참 나, 이제 너랑 얘기하기 싫어."],"problem":"Friend 1 assumes guilt and pushes the roommate (lines 1, 3, 5); Friend 2 denies and walks away from the talk (lines 2, 4, 6). Neither names the real problem (shared food rules) or proposes a system.","model":["A: 냉장고에 있던 요거트가 없어져서 속상했는데, 지금 이야기해도 괜찮아?","B: 응. 나는 안 먹었는데 오해받은 것 같아서 조금 서운했어.","A: 그랬구나. 확인도 안 하고 몰아붙여서 미안해. 그 점은 내가 잘못했어.","B: 사과해 줘서 고마워. 앞으로 각자 음식에 이름을 써 놓으면 어떨까?","A: 좋은 생각이야. 이름표를 붙이든지 칸을 나누든지 하자.","B: 그럼 이번 주말에 같이 이름표랑 칸막이를 사러 가자."]},{"title":"발표 주제 변경","lines":["친구1: 발표 주제를 내가 다시 바꿨어. 환경 말고 건강으로 하자.","친구2: 뭐? 우리 일주일 동안 환경으로 준비했잖아. 왜 나한테 말도 없이 바꿔?","친구1: 건강이 더 재미있으니까 그렇지. 너는 늘 변화를 싫어하더라.","친구2: 지금 그게 문제가 아니야. 네 마음대로 하는 게 어디 있어?","친구1: 그럼 네가 혼자 환경으로 해. 난 건강으로 할 거야."],"problem":"Friend 1 changes the plan alone and labels the partner as someone who hates change (lines 1, 3, 5); Friend 2 protests without saying what they actually need (lines 2, 4). They never discuss the lost work or find a middle option.","model":["A: 주제를 말도 없이 바꿔서 미안해. 지금 이야기해도 괜찮아?","B: 응. 솔직히 좀 당황했어. 우리가 일주일 동안 준비한 자료가 있잖아.","A: 그 점은 나도 인정해. 그래도 건강이라는 주제가 더 흥미롭다고 봐서 바꾸고 싶었어.","B: 네 말도 일리는 있어. 그런데 시간이 부족해서 자료를 다시 만들기는 어려워.","A: 무슨 말인지 알겠어. 그럼 환경이 건강에 미치는 영향을 주제로 하면 어떨까?","B: 좋은 생각이야. 그 주제로 하면 우리 둘 다 만족할 수 있겠다."]}]};
