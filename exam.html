function renderStart(){
  document.documentElement.lang = lang === "en" ? "ko" : lang;
  $("#langs").innerHTML = LANGS.map(l => `<button class="chip${l.code === lang ? " on" : ""}" data-l="${l.code}">${esc(l.short)}</button>`).join("");
  $("#tIntro").textContent = T("intro");
  $("#sTests").textContent = H.tests; $("#tTests").textContent = T("tests");
  $("#sBest").textContent = H.best == null ? "–" : H.best + "/60"; $("#tBest").textContent = T("best");
  $("#sLast").textContent = H.last == null ? "–" : H.last + "/60"; $("#tLast").textContent = T("last");
  $("#tMode").textContent = T("modeLabel"); $("#tCh").textContent = T("chLabel"); $("#tNote").textContent = T("note");
  $("#modes").innerHTML = ["practice", "exam"].map(m => `<button class="mode${mode === m ? " on" : ""}" data-m="${m}"><b>${m === "practice" ? "🎯 연습 · " : "⏱ 실전 · "}${esc(T(m))}</b><small>${esc(T(m + "Sub"))}</small></button>`).join("");
  $("#chs").innerHTML = DATA.chapters.map(c => `<button class="chip${chSel.includes(c.n) ? " on" : ""}" data-c="${c.n}">${c.n}과</button>`).join("");
  $("#go").textContent = T("start") + "  →"; $("#go").disabled = !chSel.length;
  $("#mute").textContent = muted ? "🔇" : "🔊";
}
$("#langs").onclick = e => { const b = e.target.closest("[data-l]"); if (!b) return; lang = b.dataset.l; store.set("k5b_lang", lang); renderStart(); };
$("#modes").onclick = e => { const b = e.target.closest("[data-m]"); if (!b) return; mode = b.dataset.m; store.set("k5b_exam_mode", mode); renderStart(); };
$("#chs").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; const n = +b.dataset.c; chSel = chSel.includes(n) ? chSel.filter(x => x !== n) : [...chSel, n].sort(); store.set("k5b_exam_ch", chSel); renderStart(); };
$("#mute").onclick = () => { muted = !muted; store.set("k5b_swap_mute", muted); $("#mute").textContent = muted ? "🔇" : "🔊"; };

// ---------- the test ----------
let X = null;
function startTest(){
  try { actx().resume(); } catch {}
  X = { Q: buildTest(), i: 0, mode, combo: 0, t0: Date.now(), timer: 0, ended: false };
  $("#start").classList.add("hidden"); $("#exam").classList.remove("hidden"); $("#result").classList.add("hidden"); $("#mark").classList.add("hidden");
  $("#combo").classList.toggle("hidden", mode !== "practice"); $("#timer").classList.toggle("hidden", mode !== "exam");
  if (mode === "exam") { tickTimer(); X.timer = setInterval(tickTimer, 1000); }
  show();
}
function tickTimer(){
  const left = Math.max(0, 3600 - Math.floor((Date.now() - X.t0) / 1000));
  const el = $("#timer"); el.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"); el.classList.toggle("low", left < 300);
  if (!left && !X.ended) submit();
}
function secRange(q){ const same = X.Q.filter(x => x.sec === q.sec); return { a: same[0].num, b: same[same.length - 1].num }; }
function show(){
  const q = X.Q[X.i], r = secRange(q);
  $("#progFill").style.width = (100 * X.Q.filter(x => x.ans != null).length / X.Q.length) + "%";
  let h = `<div class="sec">${esc(q.sec.title.replace("{a}", r.a).replace("{b}", r.b))}</div>`;
  if (q.box) h += `<div class="box" lang="ko">${q.box.map(esc).join("<span style='color:#bbb'>·</span>")}</div>`;
  if (q.bogi && q.sec.id === "idiom") h += `<div class="bogi" lang="ko"><b>&lt;보기&gt;</b> A: <u>${esc(q.bogi.modelA)}</u><br>B: ${esc(q.bogi.b)}</div>`;
  h += `<div class="stem" lang="ko"><span class="qn">${q.num}.</span>`;
  if (q.type === "match") h += `${esc(q.left)} ⟶ ?</div>${matchHtml(q)}`;
  else if (q.sents) h += `</div><div class="opts">${q.sents.map((s, k) => `<button class="opt${q.ans === k ? " sel" : ""}" data-o="${k}" lang="ko"><span class="n">${k + 1}</span><span>${ul(s)}</span></button>`).join("")}</div>`;
  else if (q.conflict) h += `</div><div class="bogi dlg" lang="ko">${q.conflict.lines.map(l => `<div>${esc(l)}</div>`).join("")}</div><textarea class="ans" placeholder="A: …&#10;B: …&#10;A: …&#10;B: …" lang="ko">${esc(q.ans || "")}</textarea>`;
  else if (q.sec.id === "idiom") h += `</div><div class="dlg" lang="ko"><div>A: <span class="blank" style="min-width:200px"></span></div><div>B: ${esc(q.dlgB)}</div></div><input class="ans" lang="ko" placeholder="A: …" value="${esc(q.ans || "")}">`;
  else if (q.sec.id === "speak") h += `</div><div class="dlg" lang="ko"><div>A: ${esc(q.dlgA)}</div><div>B: ${esc(q.dlgBb).replace("___", '<span class="blank"></span>')}</div></div><input class="ans" lang="ko" value="${esc(q.ans || "")}">`;
  else if (q.sec.id === "simile") h += `</div><textarea class="ans" lang="ko" placeholder="A: …&#10;B: …&#10;A: …&#10;B: …">${esc(q.ans || "")}</textarea>`;
  else if (q.type === "write") h += `${esc(q.stem)}</div><textarea class="ans" lang="ko" style="min-height:70px">${esc(q.ans || "")}</textarea>`;
  else if (q.type === "type") h += `${q.long ? ul(q.stem) : q.stem}</div><${q.long ? "textarea" : "input"} class="ans" lang="ko" ${q.long ? 'style="min-height:70px"' : ""} placeholder="${q.long ? "→" : ""}"${q.long ? ">" + esc(q.ans || "") + "</textarea>" : ` value="${esc(q.ans || "")}">`}`;
  else if (q.type === "two") h += `${esc(q.stem)}</div><div class="two">${q.options.map(o => `<button class="opt${q.ans === o ? " sel" : ""}" data-o="${esc(o)}" lang="ko">${esc(o)}</button>`).join("")}</div>`;
  else if (q.type === "mc") h += `${q.boxed ? `</div><div class="bogi" lang="ko">${esc(q.stem)}</div><div>` : ul(q.stem)}</div><div class="opts">${q.options.map((o, k) => `<button class="opt${q.ans === o ? " sel" : ""}" data-o="${esc(o)}" lang="ko"><span class="n">${k + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  h += `<div id="fbx"></div>`;
  $("#paper").innerHTML = h;
  const inp = $("#paper .ans"); if (inp) inp.oninput = () => { q.ans = inp.value; dots(); };
  $("#prev").classList.toggle("hidden", X.mode === "practice" || X.i === 0);
  setNext(); dots();
  if (q.done) feedback(q, false);
}
function matchHtml(q){
  return `<div class="match"><div class="mcol">${X.Q.filter(x => x.set === q.set).map(x => `<div class="mi${x === q ? " sel" : ""}">${esc(x.left)}${x.ans ? ` <b style="color:var(--accent)">→ ${esc(x.ans)}</b>` : ""}</div>`).join("")}</div>
    <div class="mcol">${q.right.map(r => `<button class="mi${q.ans === r ? " sel" : ""}" data-o="${esc(r)}" lang="ko">${esc(r)}</button>`).join("")}</div></div>`;
}
$("#paper").onclick = e => {
  const b = e.target.closest("[data-o]"); if (!b) return; const q = X.Q[X.i]; if (q.done) return;
  q.ans = q.sents ? +b.dataset.o : b.dataset.o;
  if (X.mode === "practice") check(q, b); else { show(); }
};
function setNext(){
  const q = X.Q[X.i], last = X.i === X.Q.length - 1;
  if (X.mode === "practice") $("#next").textContent = q.done ? (last ? T("finish") : T("next") + " →") : T("check");
  else $("#next").textContent = last ? T("submit") : T("next") + " →";
}
function dots(){
  if (X.mode !== "exam") { $("#dots").innerHTML = ""; return; }
  $("#dots").innerHTML = X.Q.map((q, k) => `<button class="dot${q.ans != null && q.ans !== "" ? " done" : ""}${k === X.i ? " cur" : ""}" data-k="${k}">${q.sec.dlg ? "대" + q.num : q.num}</button>`).join("");
}
$("#dots").onclick = e => { const b = e.target.closest("[data-k]"); if (!b) return; X.i = +b.dataset.k; show(); };
$("#prev").onclick = () => { if (X.i > 0) { X.i--; show(); } };
$("#next").onclick = () => {
  const q = X.Q[X.i];
  if (X.mode === "practice" && !q.done) return check(q, $("#next"));
  if (X.i < X.Q.length - 1) { X.i++; show(); } else if (X.mode === "practice") endTest(); else submit();
};
$("#quit").onclick = () => { clearInterval(X && X.timer); $("#exam").classList.add("hidden"); $("#start").classList.remove("hidden"); renderStart(); };

// grading: auto for choices and typed words; writing is marked by the learner against the model answer
function grade(q){
  if (q.type === "write") return null;
  if (q.type === "type") return q.answers.some(a => norm(a) === norm(q.ans || "")) ? q.pts : 0;
  return q.ans === q.answer ? q.pts : 0;
}
function check(q, el){
  if (q.ans == null || q.ans === "") { el && el.animate && el.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], { duration: 250 }); return; }
  q.done = true; q.got = grade(q); feedback(q, true); setNext();
}
function feedback(q, fresh){
  const box = $("#fbx"); if (!box) return;
  const ok = q.got === q.pts, write = q.type === "write";
  // colour the choices
  for (const b of document.querySelectorAll("#paper [data-o]")) { const v = q.sents ? +b.dataset.o : b.dataset.o;
    if (v === q.answer) b.classList.add("right"); else if (v === q.ans) b.classList.add("wrong"); }
  let h = "";
  if (write) {
    h = `<div class="fb"><div class="h">${esc(T("model"))}</div><div class="model" lang="ko">${esc(q.model)}</div>${q.info ? `<div style="margin-top:6px;color:#5b5440">${esc(q.info)}</div>` : ""}
      <div style="margin-top:8px;font-weight:700">${esc(T("selfMark"))}</div><div class="marks" data-q="${X.Q.indexOf(q)}">
      ${[[q.pts, "✔ " + T("full")], [q.pts / 2, "△ " + T("half")], [0, "✖ " + T("none")]].map(([p, l]) => `<button data-p="${p}" class="${q.got === p ? "on" : ""}">${esc(l)} (${p})</button>`).join("")}</div></div>`;
  } else {
    const right = q.type === "type" ? q.answers[0] : q.sents ? (q.answer + 1) + "번" : q.answer;
    h = `<div class="fb ${ok ? "good" : "bad"}"><div class="h">${ok ? "✔ " + esc(T("right")) + " +" + q.pts : "✖ " + esc(T("wrong"))}</div>
      ${ok ? "" : `<div>${esc(T("answer"))}: <b lang="ko">${esc(right)}</b></div>`}${q.info ? `<div lang="ko">${esc(q.info)}</div>` : ""}${q.en ? `<div style="color:#5b5440">${esc(q.en)}</div>` : ""}
      ${!ok && q.type === "type" ? `<button class="override" id="ovr">${esc(T("override"))}</button>` : ""}</div>`;
  }
  box.innerHTML = h;
  if ($("#ovr")) $("#ovr").onclick = () => { q.got = q.pts; reward(q, true, $("#ovr")); feedback(q, false); };
  const mk = box.querySelector(".marks"); if (mk) mk.onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; const prev = q.got; q.got = +b.dataset.p; if (prev == null && q.got === q.pts) reward(q, true, b); feedback(q, false); };
  if (fresh && !write) reward(q, ok, box);
}
function reward(q, ok, el){
  if (X.mode !== "practice") return;
  const r = el.getBoundingClientRect();
  if (ok) { X.combo++; sndRight(X.combo); buzz(25); burst(r.left + r.width / 2, r.top + 20, 24 + Math.min(40, X.combo * 4), 1 + Math.min(.7, X.combo * .05)); floatText(r.left + r.width / 2, r.top, "+" + q.pts); }
  else { X.combo = 0; sndWrong(); buzz([60, 40, 60]); }
  $("#combo").textContent = "🔥" + X.combo;
}

// ---------- the end: mark the writing, then the score ----------
function submit(){
  X.ended = true; clearInterval(X.timer);
  for (const q of X.Q) if (q.type !== "write") q.got = grade(q);
  const toMark = X.Q.filter(q => q.type === "write");
  $("#exam").classList.add("hidden");
  const m = $("#mark"); m.classList.remove("hidden");
  m.innerHTML = `<div class="hero"><h2>${esc(T("markTitle"))}</h2><p>${esc(T("markSub"))}</p></div>` + toMark.map((q, k) => `<div class="paper" style="margin-bottom:12px">
      <div class="sec">${esc(q.sec.title.replace("{a}", q.num).replace("{b}", q.num))}</div><div class="stem" lang="ko"><span class="qn">${q.sec.dlg ? "대화 " : ""}${q.num}.</span>${esc(q.stem || (q.box ? q.box[0] : q.dlgB || ""))}</div>
      <div style="margin-top:8px;font-weight:700">${esc(T("yours"))}</div><div class="model" style="border-color:#9a927d" lang="ko">${esc(q.ans || "—")}</div>
      <div style="margin-top:8px;font-weight:700">${esc(T("model"))}</div><div class="model" lang="ko">${esc(q.model)}</div>
      <div class="marks" data-k="${X.Q.indexOf(q)}">${[[q.pts, "✔ " + T("full")], [q.pts / 2, "△ " + T("half")], [0, "✖ " + T("none")]].map(([p, l]) => `<button data-p="${p}"${(q.ans || "").trim() ? "" : (p === 0 ? ' class="on"' : "")}>${esc(l)} (${p})</button>`).join("")}</div></div>`).join("")
    + `<button class="go" id="seeScore">${esc(T("seeScore"))}</button>`;
  for (const q of toMark) if (!(q.ans || "").trim()) q.got = 0;
  m.onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; const box = b.parentElement; X.Q[+box.dataset.k].got = +b.dataset.p; for (const x of box.children) x.classList.toggle("on", x === b); };
  $("#seeScore").onclick = () => { const left = toMark.filter(q => q.got == null).length; if (left) { alertBox(T("markAll")); return; } endTest(); };
  scrollTo(0, 0);
}
function alertBox(t){ const d = document.createElement("div"); d.className = "float"; d.style.left = "50%"; d.style.top = "40%"; d.style.color = "#ff6b7a"; d.style.fontSize = "18px"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1200); }
function endTest(){
  clearInterval(X.timer);
  for (const q of X.Q) if (q.got == null) q.got = q.type === "write" ? 0 : grade(q);
  const total = Math.round(X.Q.reduce((s, q) => s + (q.got || 0), 0) * 2) / 2;
  const part1 = X.Q.filter(q => !q.sec.dlg).reduce((s, q) => s + (q.got || 0), 0), part2 = total - part1;
  H.tests++; H.last = total; H.best = H.best == null ? total : Math.max(H.best, total); H.hist = [...H.hist, { d: new Date().toISOString().slice(0, 10), s: total, m: X.mode }].slice(-30); store.set("k5b_exam", H);
  $("#exam").classList.add("hidden"); $("#mark").classList.add("hidden");
  const res = $("#result"); res.classList.remove("hidden");
  const pct = total / 60, grade = pct >= .9 ? T("g1") : pct >= .75 ? T("g2") : pct >= .6 ? T("g3") : T("g4");
  const bySec = SECS.map(s => { const qs = X.Q.filter(q => q.sec === s); return { s, got: qs.reduce((a, q) => a + (q.got || 0), 0), max: qs.reduce((a, q) => a + q.pts, 0) }; });
  res.innerHTML = `<div class="score"><div class="big" id="bigScore">0</div><div class="of">/ 60</div></div><div class="grade">${esc(grade)}</div>
    <div class="stats"><div class="stat"><b>${part1}</b><span>어휘·문법 / 30</span></div><div class="stat"><b>${part2}</b><span>대화 / 30</span></div><div class="stat"><b>${H.best}</b><span>${esc(T("best"))}</span></div></div>
    <div class="rows">${bySec.map(r => `<div class="row"><span lang="ko">${esc(r.s.title.replace(/※ |\(.*?\)|\[\{a\}(~\{b\})?\] /g, "").slice(0, 34))}</span><b style="color:${r.got === r.max ? "var(--good)" : r.got ? "var(--gold)" : "var(--bad)"}">${r.got} / ${r.max}</b></div>`).join("")}</div>
    <button class="go" id="again">${esc(T("again"))}</button><button class="ghost" id="menu">${esc(T("menu"))}</button>`;
  // count up the score, then celebrate
  let n = 0; const tgt = total, step = Math.max(.5, tgt / 40);
  const iv = setInterval(() => { n = Math.min(tgt, n + step); $("#bigScore").textContent = Math.round(n * 2) / 2; tone(400 + n * 12, 0, .04, "triangle", .06);
    if (n >= tgt) { clearInterval(iv); if (pct >= .6) { sndFanfare(); for (let k = 0; k < (pct >= .9 ? 6 : 3); k++) setTimeout(() => burst(innerWidth * (.2 + Math.random() * .6), innerHeight * (.15 + Math.random() * .3), 70, 1.4), k * 250); buzz([40, 50, 40, 50, 80]); } } }, 35);
  $("#again").onclick = startTest; $("#menu").onclick = () => { res.classList.add("hidden"); $("#start").classList.remove("hidden"); renderStart(); };
  scrollTo(0, 0);
}
$("#go").onclick = startTest;
renderStart();
</script>
</body>
</html>
