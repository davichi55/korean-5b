<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Korean 5B — 기말시험 연습</title>
<meta name="description" content="Sogang Korean 5B mock final exam: 5급 말하기 어휘·문법 + 대화, 39 questions, 60 points, a new test every time.">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="exam.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="5B 시험 연습">
<link rel="apple-touch-icon" href="icon-exam-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:#1c2740; --card2:#223052; --paper:#f7f4ec; --ink:#1d2230;
    --line:#2c3a5a; --txt:#eaf0fb; --dim:#96a3c2; --accent:#5b8cff; --gold:#ffcf5c; --good:#37d18f; --bad:#ff6b7a; --fire:#ff8a3d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Microsoft YaHei","PingFang SC","Leelawadee UI",Tahoma,Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -200px,#1b2747,transparent),linear-gradient(180deg,#0f1420,#0b0f18);color:var(--txt);min-height:100vh;overflow-x:hidden}
  .wrap{max-width:680px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--accent)}
  .hidden{display:none!important}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .home{border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--dim);text-decoration:none;font-size:14px}
  .top h1{font-size:19px;margin:0;flex:1}
  .iconbtn{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:16px}
  .chip{background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 12px;font-size:14px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .langs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
  .hero{background:linear-gradient(135deg,#23315a,#1a2440);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .hero h2{margin:0 0 4px;font-size:22px}
  .hero p{margin:0;color:var(--dim);font-size:14px;line-height:1.5}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:rgba(0,0,0,.18);border-radius:12px;padding:8px;text-align:center}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--dim)}
  .label{font-size:13px;color:var(--dim);margin:14px 0 6px}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mode{text-align:left;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2)}
  .mode b{display:block;font-size:16px}
  .mode small{color:var(--dim);font-size:12.5px;line-height:1.35;display:block;margin-top:3px}
  .mode.on{border-color:var(--accent);background:linear-gradient(135deg,rgba(91,140,255,.25),rgba(155,123,255,.18))}
  .chs{display:flex;flex-wrap:wrap;gap:6px}
  .go{display:block;width:100%;margin-top:18px;padding:16px;border:0;border-radius:16px;font-size:19px;font-weight:800;color:#fff;background:linear-gradient(135deg,#5b8cff,#8a6bff);box-shadow:0 10px 26px rgba(91,140,255,.35)}
  .go:disabled{opacity:.45}
  .note{color:var(--dim);font-size:12.5px;margin-top:14px;line-height:1.5}

  /* exam paper */
  .hud{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .prog{flex:1;height:10px;background:#0d1322;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),#7af0c0);transition:width .35s}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold);min-width:58px;text-align:right}
  .timer.low{color:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.5}}
  .combo{font-weight:800;color:var(--fire);min-width:44px;text-align:right}
  .paper{background:var(--paper);color:var(--ink);border-radius:14px;padding:18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);line-height:1.7}
  .sec{font-size:14.5px;font-weight:700;color:#3a3f52;border-bottom:1px dashed #cfc8b6;padding-bottom:8px;margin-bottom:12px}
  .qn{font-weight:800;margin-right:6px}
  .stem{font-size:18.5px;word-break:keep-all}
  .stem u{text-decoration-thickness:2px;text-underline-offset:4px}
  .box{border:1.6px solid #333;padding:10px 14px;margin:10px 0;display:flex;flex-wrap:wrap;gap:18px;justify-content:center;font-size:17px;font-weight:600}
  .bogi{border:1.4px solid #555;border-radius:10px;padding:10px 12px;margin:8px 0 12px;font-size:15.5px;background:#fffdf6}
  .opts{display:grid;gap:8px;margin-top:12px}
  .opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:#fff;border:1.5px solid #d7d0bf;border-radius:12px;padding:10px 12px;font-size:17px;color:var(--ink)}
  .opt .n{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #888;display:grid;place-items:center;font-size:13px;font-weight:700}
  .opt.sel{border-color:var(--accent);background:#e8eeff}
  .opt.sel .n{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt.right{border-color:var(--good);background:#dff7ec}
  .opt.wrong{border-color:var(--bad);background:#ffe6e9}
  .two{display:flex;gap:10px;margin-top:12px}
  .two .opt{justify-content:center}
  .blank{display:inline-block;min-width:110px;border-bottom:2px solid #333;margin:0 4px}
  input.ans,textarea.ans{width:100%;margin-top:12px;background:#fff;border:1.5px solid #c9c1ad;border-radius:10px;padding:10px 12px;font-size:17px;color:var(--ink)}
  textarea.ans{min-height:110px;resize:vertical;line-height:1.6}
  input.ans:focus,textarea.ans:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .dlg{margin:8px 0;font-size:16.5px}
  .dlg div{margin:3px 0}
  .match{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:12px}
  .mcol{display:grid;gap:8px;align-content:start}
  .mi{background:#fff;border:1.5px solid #d7d0bf;border-radius:10px;padding:9px 10px;font-size:16.5px;color:var(--ink);text-align:left;position:relative}
  .mi.sel{border-color:var(--accent);background:#e8eeff}
  .mi .tag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;border-radius:999px;padding:1px 7px;color:#fff}
  .mi.right{border-color:var(--good);background:#dff7ec}
  .mi.wrong{border-color:var(--bad);background:#ffe6e9}
  .fb{margin-top:12px;border-radius:12px;padding:10px 12px;background:#efe9da;font-size:15px;line-height:1.55}
  .fb .h{font-weight:800}
  .fb.good .h{color:#178a58}.fb.bad .h{color:#c23a4b}
  .model{white-space:pre-wrap;background:#fff;border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;margin-top:6px}
  .marks{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .marks button{flex:1;min-width:90px;padding:10px;border-radius:10px;border:1.5px solid #bdb5a2;background:#fff;color:var(--ink);font-weight:700}
  .marks button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .nav{display:flex;gap:10px;margin-top:12px}
  .nav button{flex:1;padding:13px;border-radius:14px;border:0;font-weight:800;font-size:16px}
  .nav .prev{background:var(--bg2);border:1px solid var(--line)}
  .nav .next{background:var(--accent);color:#fff}
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
  .dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);font-size:12px;color:var(--dim)}
  .dot.done{background:#2a3a63;color:var(--txt)}
  .dot.cur{outline:2px solid var(--gold)}
  .override{margin-top:8px;font-size:13.5px;background:none;border:1px dashed #9a927d;border-radius:8px;padding:6px 10px;color:#5b5440}
  /* results */
  .score{text-align:center;margin:8px 0}
  .score .big{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#ffcf5c,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .score .of{color:var(--dim);font-size:18px}
  .grade{text-align:center;font-size:20px;font-weight:800;margin-top:2px}
  .rows{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .row:first-child{border-top:0}
  .row b{font-variant-numeric:tabular-nums}
  .ghost{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);font-weight:700;font-size:16px}
  .float{position:fixed;pointer-events:none;font-weight:900;font-size:24px;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.6);z-index:30;animation:rise 1s ease-out forwards}
  @keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:29}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <a class="home" href="index.html">← 5B</a>
    <h1>📝 기말시험 연습 <span style="color:var(--dim);font-weight:500;font-size:14px">· Mock final</span></h1>
    <button class="iconbtn" id="mute">🔊</button>
  </div>

  <section id="start">
    <div class="langs" id="langs"></div>
    <div class="hero">
      <h2>5급 말하기 · 어휘·문법 / 대화</h2>
      <p id="tIntro"></p>
      <div class="stats">
        <div class="stat"><b id="sTests">0</b><span id="tTests"></span></div>
        <div class="stat"><b id="sBest">–</b><span id="tBest"></span></div>
        <div class="stat"><b id="sLast">–</b><span id="tLast"></span></div>
      </div>
    </div>
    <div class="label" id="tMode"></div>
    <div class="modes" id="modes"></div>
    <div class="label" id="tCh"></div>
    <div class="chs" id="chs"></div>
    <button class="go" id="go"></button>
    <p class="note" id="tNote"></p>
  </section>

  <section id="exam" class="hidden">
    <div class="hud">
      <button class="iconbtn" id="quit">✕</button>
      <div class="prog"><i id="progFill"></i></div>
      <div class="combo hidden" id="combo">🔥0</div>
      <div class="timer" id="timer"></div>
    </div>
    <div class="paper" id="paper"></div>
    <div class="nav">
      <button class="prev" id="prev">←</button>
      <button class="next" id="next"></button>
    </div>
    <div class="dots" id="dots"></div>
  </section>

  <section id="mark" class="hidden"></section>
  <section id="result" class="hidden"></section>
</div>

<script>
const DATA = {"chapters":[{"n":1,"title":"1과"},{"n":2,"title":"2과"},{"n":3,"title":"3과"},{"n":4,"title":"4과"},{"n":5,"title":"5과"},{"n":6,"title":"6과"},{"n":7,"title":"7과"},{"n":8,"title":"8과"}],"words":[{"kr":"기왕","ch":1,"s":"[[이미 정해진 일이니]] 가는 김에 좋은 호텔에서 자고 싶어요.","a":"기왕","w":["곧잘","괜히","자꾸"],"en":"Since we are going anyway, I want to sleep in a nice hotel.","gl":"anyway; since things are already this way"},{"kr":"적금","ch":1,"s":"저는 매달 월급의 절반을 [[일정한 기간 동안 은행에 조금씩 모으는 저축]]에 넣어요.","a":"적금","w":["주간지","손주","일자리"],"en":"Every month I put half of my salary into an installment savings account.","gl":"installment savings (account)"},{"kr":"빡빡하다","ch":1,"s":"이번 주는 일정이 [[여유 없이 꽉 차 있어서]] 약속을 잡기 어려워요.","a":"빡빡해서","w":["격렬해서","열악해서","한가해서"],"en":"My schedule is tight this week, so it is hard to make plans.","gl":"to be packed / tight (e.g. a schedule)"},{"kr":"주간지","ch":1,"s":"저는 매주 서점에서 [[7일마다 한 번씩 나오는 잡지]]도 사서 읽어요.","a":"주간지","w":["손주","일자리","말솜씨"],"en":"Every week I also buy and read a weekly magazine at the bookstore.","gl":"weekly magazine"},{"kr":"곧잘","ch":1,"s":"아이가 한국어를 배운 지 한 달밖에 안 됐는데 [[기대보다 훨씬 능숙하게]] 말해요.","a":"곧잘","w":["기왕","괜히","마침"],"en":"The child has only studied Korean for a month, but speaks it quite well.","gl":"quite well; readily; fairly often"},{"kr":"과음하다","ch":1,"s":"어제 회식에서 [[술을 너무 많이 마셔서]] 오늘 머리가 아파요.","a":"과음해서","w":["출연해서","홍보해서","선호해서"],"en":"I drank too much at the company dinner yesterday, so my head hurts today.","gl":"to drink too much (alcohol)"},{"kr":"접대","ch":1,"s":"저희 부서는 [[손님을 맞아 음식과 술을 대접하는 일]]도 많아서 힘들어요.","a":"접대","w":["달리기","방귀","말다툼"],"en":"Our department also has a lot of client entertaining, so it is tiring.","gl":"entertaining / receiving guests (esp. clients)"},{"kr":"괜히","ch":1,"s":"시험이 쉬웠는데 [[쓸데없이]] 걱정을 많이 했어요.","a":"괜히","w":["기왕","마침","방금"],"en":"The test was easy, but I worried a lot for nothing.","gl":"for no reason; needlessly; in vain"},{"kr":"타령","ch":1,"s":"어머니는 만날 결혼 [[같은 말을 끝없이 되풀이하는 것]]만 하세요.","a":"타령","w":["말다툼","논란","접대"],"en":"My mother does nothing but harp on about marriage all the time.","gl":"harping on about; a constant refrain"},{"kr":"손주","ch":1,"s":"할머니께서는 [[아들이나 딸이 낳은 아이]]도 보고 싶어 하세요.","a":"손주","w":["주간지","일자리","몸매"],"en":"My grandmother also wants to see her grandchildren.","gl":"grandchild"},{"kr":"간만","ch":1,"s":"저는 [[오랫동안 만나지 못하다가 시간이 많이 지난 뒤]]에 친구를 만났어요.","a":"간만","w":["동시","개봉","상영"],"en":"I met my friend after a long while.","gl":"a long while (since)"},{"kr":"표","ch":1,"s":"영화관 앞에서 [[극장에 들어가려고 돈을 내고 사는 종이]]만 사고 팝콘은 안 샀어요.","a":"표","w":["적금","손주","방귀"],"en":"In front of the cinema I bought only the tickets and not the popcorn.","gl":"(counter) unit / pack; ticket"},{"kr":"일자리","ch":1,"s":"요즘은 [[돈을 벌기 위해 일할 수 있는 곳]]도 많지 않아요.","a":"일자리","w":["주간지","적금","몸매"],"en":"These days there are not many jobs either.","gl":"job; employment position"},{"kr":"옜다","ch":1,"s":"할아버지는 \"[[자, 이거 받아라]], 이걸로 맛있는 거 사 먹어.\"라고 하시며 용돈을 주셨다.","a":"옜다","w":["글쎄","어머","아이고"],"en":"Grandfather gave me pocket money, saying \"Here, take it, and buy something tasty with this.\"","gl":"here (you go); take it (handing something over)"},{"kr":"보태다","ch":1,"s":"형이 차를 사는 데 부모님이 돈을 [[모자라는 부분을 채우려고 더 넣어]] 주셨다.","a":"보태","w":["가꿔","자랑해","키워"],"en":"My parents chipped in money to help my older brother buy a car.","gl":"to add (esp. money); chip in"},{"kr":"내밀다","ch":1,"s":"친구가 악수하려고 내게 손을 [[앞으로 쭉 뻗었다]].","a":"내밀었다","w":["자랑했다","홍보했다","출연했다"],"en":"My friend held out his hand to me to shake hands.","gl":"to stick out; hold out; push forward"},{"kr":"장사","ch":1,"s":"삼촌은 시장에서 일하시는데 [[물건을 사 와서 팔아 돈을 버는 일]]도 쉽지 않다고 하세요.","a":"장사","w":["달리기","립싱크","방귀"],"en":"My uncle works at the market and says that doing business is not easy either.","gl":"business; trade"},{"kr":"깨작깨작하다","ch":1,"s":"아이가 감기에 걸려서 밥을 [[조금씩 먹는 둥 마는 둥 하고]] 있어요.","a":"깨작깨작하고","w":["과음하고","선호하고","홍보하고"],"en":"The child has a cold and is just picking at his food.","gl":"to pick at (food); do half-heartedly"},{"kr":"눈치가 보이다","ch":1,"s":"회사에서 일찍 퇴 r forecast, it will snow tomorrow."},{"g":"bg-b105","ch":1,"title":"N에 의하면 / N에 따르면 -다고 하다","p":"친구 말 + 그 식당이 맛있다","a":"친구 말에 의하면 그 식당이 맛있다고 해요.","en":"According to my friend, that restaurant is delicious."},{"g":"bg-b105","ch":1,"title":"N에 의하면 / N에 따르면 -다고 하다","p":"뉴스 + 오늘 지하철이 파업하다","a":"뉴스에 의하면 오늘 지하철이 파업한다고 합니다.","en":"According to the news, the subway is on strike today."},{"g":"bg-b105","ch":1,"title":"N에 의하면 / N에 따르면 -다고 하다","p":"통계 + 혼자 사는 사람이 늘다","a":"통계에 따르면 혼자 사는 사람이 는다고 합니다.","en":"According to statistics, the number of people living alone is growing."},{"g":"bg-b105","ch":1,"title":"N에 의하면 / N에 따르면 -다고 하다","p":"조사 결과 + 학생들이 바쁘다","a":"조사 결과에 따르면 학생들이 바쁘다고 합니다.","en":"According to the survey results, students are busy."},{"g":"bg-b105","ch":1,"title":"N에 의하면 / N에 따르면 -다고 하다","p":"선생님 말씀 + 이번 시험이 어렵지 않다","a":"선생님 말씀에 따르면 이번 시험이 어렵지 않다고 해요.","en":"According to the teacher, this exam isn't difficult."},{"g":"bg-b105","ch":1,"title":"N에 의하면 / N에 따르면 -다고 하다","p":"기사 + 내년부터 요금이 오르다","a":"기사에 따르면 내년부터 요금이 오른다고 합니다.","en":"According to the article, fares will rise from next year."},{"g":"bg-b106","ch":1,"title":"-다면서 / -다니까 / -다는데 (인용의 준말)","p":"민수 씨가 다음 달에 이사하다 + 맞는지 묻다","a":"민수 씨가 다음 달에 이사한다면서요?","en":"I hear Minsu is moving next month, is that right?"},{"g":"bg-b106","ch":1,"title":"-다면서 / -다니까 / -다는데 (인용의 준말)","p":"내일 비가 오다 + 우산을 가져가세요","a":"내일 비가 온다는데 우산을 가져가세요.","en":"They say it will rain tomorrow, so take an umbrella."},{"g":"bg-b106","ch":1,"title":"-다면서 / -다니까 / -다는데 (인용의 준말)","p":"선생님이 괜찮다 + 걱정하지 마세요","a":"선생님이 괜찮다니까 걱정하지 마세요.","en":"The teacher says it's fine, so don't worry."},{"g":"bg-b106","ch":1,"title":"-다면서 / -다니까 / -다는데 (인용의 준말)","p":"이 식당이 맛있다 + 한번 가 보다","a":"이 식당이 맛있다는데 한번 가 봐요.","en":"They say this restaurant is delicious, so go and try it sometime."},{"g":"bg-b106","ch":1,"title":"-다면서 / -다니까 / -다는데 (인용의 준말)","p":"친구가 시험이 어렵다 + 많이 공부해야겠다","a":"친구가 시험이 어렵다는데 저도 많이 공부해야겠어요.","en":"My friend says the exam is hard, so I'd better study a lot to 4,"title":"그 밖에 -다는 의견도 있었습니다","p":"기타 의견 + 혼자 살다","a":"그 밖에 혼자 산다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that they live alone."},{"g":"bg-b332","ch":4,"title":"그 밖에 -다는 의견도 있었습니다","p":"기타 의견 + 버스가 자주 안 오다","a":"그 밖에 버스가 자주 안 온다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that the bus doesn't come often."},{"g":"bg-b332","ch":4,"title":"그 밖에 -다는 의견도 있었습니다","p":"기타 의견 + 월급이 너무 적다","a":"그 밖에 월급이 너무 적다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that the salary is too low."},{"g":"bg-b332","ch":4,"title":"그 밖에 -다는 의견도 있었습니다","p":"기타 의견 + 한국어가 어렵다","a":"그 밖에 한국어가 어렵다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that Korean is difficult."},{"g":"bg-b332","ch":4,"title":"그 밖에 -다는 의견도 있었습니다","p":"기타 의견 + 친구를 사귀기 힘들다","a":"그 밖에 친구를 사귀기 힘들다는 의견도 있었습니다.","en":"Besides that, there was also an opinion that it is hard to make friends."},{"g":"bg-b332","ch":4,"title":"그 밖에 -다는 의견도 있었습니다","p":"기타 의견 + 가격이 문제이다","a":"그 밖에 가격이 문제라는 의견도 있었습니다.","en":"Besides that, there was also an opinion that the price is the problem."},{"g":"bg-b333","ch":4,"title":"이러한 결과를 통해 -다는 것을 알 수 있었습니다","p":"설문 결과 + 학생들이 바쁘다","a":"결과를 통해 학생들이 바쁘다는 것을 알 수 있었습니다.","en":"From the results we could see that students are busy."},{"g":"bg-b333","ch":4,"title":"이러한 결과를 통해 -다는 것을 알 수 있었습니다","p":"이 조사 + 취미가 다르다","a":"이 조사를 통해 취미가 다르다는 것을 알 수 있었습니다.","en":"From this survey we could see that hobbies differ."},{"g":"bg-b333","ch":4,"title":"이러한 결과를 통해 -다는 것을 알 수 있었습니다","p":"설문 결과 + 사람들이 운동을 좋아하다","a":"결과를 통해 사람들이 운동을 좋아한다는 것을 알 수 있었습니다.","en":"From the results we could see that people like exercise."},{"g":"bg-b333","ch":4,"title":"이러한 결과를 통해 -다는 것을 알 수 있었습니다","p":"조사 결과 + 사용 시간이 길다","a":"결과를 통해 사용 시간이 길다는 것을 알 수 있었습니다.","en":"From the results we could see that the usage time is long."},{"g":"bg-b333","ch":4,"title":"이러한 결과를 통해 -다는 것을 알 수 있었습니다","p":"조사 + 학생들이 잠이 부족하다","a":"조사를 통해 학생들이 잠이 부족하다는 것을 알 수 있었습니다.","en":"From the survey we could see that students lack sleep."},{"g":"bg-b333","ch":4,"title":"이러한 결과를 통해 -다는 것을 알 수 있었습니다","p":"결과 + 문제가 시간이다","a":"결과를 통해 문제가 시간이라는 것을 알 수 있었습니다.","en":"From the results we could see that time is the problem."},{"g":"bg-b333","ch":4,"title":"이러한 결과를 통해 -다는 것을 알 수 있었습니다","p":"조사 + 물을 적게 마시다","a":"조사를 통해 물을 적게 마신다는 것을 알 수 있었습니다.","en":"From the survey we could see that people drink little water."},{"g":"bg-b333","ch":4,"title":"이러한 결과를 통해 -다는 것을 알 수 있었습니다","p":"결과 + 친구를 사귀기 어렵다","a":"결과를 통해 친구를 사귀기 어렵다는 것을 알 수 있었습니다.","en":"From the results we could see that it is hard to make friends."},{"g":"bg-b390","ch":5,"title":"말이 N(이)지","p":"이름은 휴가이다 + 사실은 일만 했다","a":"말이 휴가지, 사실은 일만 했어요.","en":"It was called a vacation, but I really just worked."},{"g":"bg-b390","ch":5,"title":"말이 N(이)지","p":"이름은 신혼여행이다 + 거의 싸우기만 했다","a":"말이 신혼여행이지, 거의 싸우기만 했어요.","en":"It was called a honeymoon, but we almost only fought."},{"g":"bg-b390","ch":5,"title":"말이 N(이)지","p":"이름은 아르바이트이다 + 하는 일은 정규직과 같다","a":"말이 아르바이트지, 하는 일은 정규직과 같아요.","en":"It's called a part-time job, but the work is the same as a full-timer's."},{"g":"bg-b390","ch":5,"title":"말이 N(이)지","p":"이름은 선물이다 + 사실은 뇌물이다","a":"말이 선물이지, 사실은 뇌물이에요.","en":"It's called a gift, but it's really a bribe."},{"g":"bg-b390","ch":5,"title":"말이 N(이)지","p":"이름은 회식이다 + 실제로는 회의의 연장이다","a":"말이 회식이지, 실제로는 회의의 연장이에요.","en":"It's called a company dinner, but really it's an extension of the meeting."},{"g":"bg-b390","ch":5,"title":"말이 N(이)지","p":"이름은 방학이다 + 학원 때문에 더 바쁘다","a":"말이 방학이지, 학원 때문에 더 바빠요.","en":"It's called a school break, but I'm busier because of cram school."},{"g":"bg-b390","ch":5,"title":"말이 N(이)지","p":"이름은 다이어트이다 + 저녁에는 라면을 먹었다","a":"말이 다이어트지, 저녁에는 라면을 먹었어요.","en":"It's called a diet, but I ate ramen for dinner."},{"g":"bg-b390","ch":5,"title":"말이 N(이)지","p":"이름은 도시락이다 + 밥에 김치뿐이다","a":"말이 도시락이지, 밥에 김치뿐이에요.","en":"It's called a lunchbox, but it's just rice and kimchi."},{"g":"bg-b391","ch":5,"title":"N을/를 통틀어(서)","p":"이번 여행 + 오늘이 가장 즐거웠다","a":"이번 여행을 통틀어 오늘이 가장 즐거웠어요.","en":"Out of this whole trip, today was the most fun."},{"g":"bg-b391","ch":5,"title":"N을/를 통틀어(서)","p":"평생 + 이런 음식은 처음이다","a":"평생을 통틀어 이런 음식은 처음이에요.","en":"In my whole life, this is the first time I've had this kind of food."},{"g":"bg-b391","ch":5,"title":"N을/를 통틀어(서)","p":"우리 반 + 한국어를 제일 잘하는 사람은 민수이다","a":"우리 반을 통틀어 한국어를 제일 잘하는 사람은 민수예요.","en":"Of our whole class, the best Korean speaker is Minsu."},{"g":"bg-b391","ch":5,"title":"N을/를 통틀어(서)","p":"지난 일 년 + 한 번도 쉬지 못했다","a":"지난 일 년을 통틀어 한 번도 쉬지 못했어요.","en":"In the whole past year, I couldn't rest even once."},{"g":"bg-b391","ch":5,"title":"N을/를 통틀어(서)","p":"이 책 + 제일 재미있는 부분은 마지막 장이다","a":"이 책을 통틀어 제일 재미있는 부분은 마지막 장이에요.","en":"In this whole book, the most interesting part is the last chapter."},{"g":"bg-b391","ch":5,"title":"N을/를 통틀어(서)","p":"학교생활 + 가장 행복한 때는 졸업식 날이다","a":"학교생활을 통틀어 가장 행복한 때는 졸업식 날이에요.","en":"Of my whole school life, the happiest time is graduation day."},{"g":"bg-b391","ch":5,"title":"N을/를 통틀어(서)","p":"한국의 도시 + 서울이 가장 인구가 많다","a":"한국의 도시를 통틀어 서울이 가장 인구가 많아요.","en":"Of all Korean cities, Seoul has the largest population."},{"g":"bg-b391","ch":5,"title":"N을/를 통틀어(서)","p":"우리 가족 + 요리를 제일 잘하는 사람은 어머니이다","a":"우리 가족을 통틀어 요리를 제일 잘하는 사람은 어머니예요.","en":"In our whole family, the best cook is my mother."},{"g":"bg-b505","ch":6,"title":"A/V-(으)므로","p":"출산율이 낮다 + 대책이 필요하다","a":"출산율이 낮으므로 대책이 필요합니다.","en":"Since the birth rate is low, countermeasures are needed."},{"g":"bg-b505","ch":6,"title":"A/V-(으)므로","p":"오늘은 휴일이다 + 은행이 문을 닫다","a":"오늘은 휴일이므로 은행이 문을 닫습니다.","en":"Today is a holiday, so the bank is closed."},{"g":"bg-b505","ch":6,"title":"A/V-(으)므로","p":"물가가 계속 오르다 + 생활비를 줄여야 하다","a":"물가가 계속 오르므로 생활비를 줄여야 합니다.","en":"Prices keep rising, so living costs must be cut."},{"g":"bg-b505","ch":6,"title":"A/V-(으)므로","p":"비가 많이 오다 + 행사를 취소하다","a":"비가 많이 오므로 행사를 취소합니다.","en":"Since it rains a lot, the event is canceled."},{"g":"bg-b505","ch":6,"title":"A/V-(으)므로","p":"시험이 어려웠다 + 평균 점수가 낮았다","a":"시험이 어려웠으므로 평균 점수가 낮았습니다.","en":"The exam was difficult, so the average score was low."},{"g":"bg-b505","ch":6,"title":"A/V-(으)므로","p":"고령 인구가 많다 + 복지 예산이 더 필요하다","a":"고령 인구가 많으므로 복지 예산이 더 필요합니다.","en":"The elderly population is large, so more welfare budget is needed."},{"g":"bg-b505","ch":6,"title":"A/V-(으)므로","p":"이 지역은 지진이 자주 일어나다 + 건물을 튼튼하게 지어야 하다","a":"이 지역은 지진이 자주 일어나므로 건물을 튼튼하게 지어야 합니다.","en":"Earthquakes are frequent in this region, so buildings must be built sturdily."},{"g":"bg-b505","ch":6,"title":"A/V-(으)므로","p":"그는 경험이 풍부하다 + 이 일에 적합한 사람이다","a":"그는 경험이 풍부하므로 이 일에 적합한 사람입니다.","en":"He is very experienced, so he is a suitable person for this job."},{"g":"bg-b506","ch":6,"title":"A/V-(으)ㄴ/는 데다가","p":"물가가 비싸다 + 집값도 높다","a":"물가가 비싼 데다가 집값도 높아요.","en":"Prices are high, and on top of that housing is expensive too."},{"g":"bg-b506","ch":6,"title":"A/V-(으)ㄴ/는 데다가","p":"비가 오다 + 바람도 불다","a":"비가 오는 데다가 바람도 불어요.","en":"It's raining, and on top of that it's windy too."},{"g":"bg-b506","ch":6,"title":"A/V-(으)ㄴ/는 데다가","p":"그 식당은 맛있다 + 값도 싸다","a":"그 식당은 맛있는 데다가 값도 싸요.","en":"That restaurant is tasty, and cheap on top of that."},{"g":"bg-b506","ch":6,"title":"A/V-(으)ㄴ/는 데다가","p":"어제는 늦게 일어났다 + 길도 막혔다","a":"어제는 늦게 일어난 데다가 길도 막혔어요.","en":"Yesterday I got up late and the roads were jammed too."},{"g":"bg-b506","ch":6,"title":"A/V-(으)ㄴ/는 데다가","p":"성격이 좋다 + 일도 잘한다","a":"성격이 좋은 데다가 일도 잘해요.","en":"He has a good personality and works well too."},{"g":"bg-b506","ch":6,"title":"A/V-(으)ㄴ/는 데다가","p":"오늘은 월급날이다 + 금요일이기도 하다","a":"오늘은 월급날인 데다가 금요일이기도 해요.","en":"Today is payday and also a Friday."},{"g":"bg-b506","ch":6,"title":"A/V-(으)ㄴ/는 데다가","p":"이 집은 역에서 가깝다 + 조용하기도 하다","a":"이 집은 역에서 가까운 데다가 조용하기도 해요.","en":"This house is close to the station and quiet too."},{"g":"bg-b506","ch":6,"title":"A/V-(으)ㄴ/는 데다가","p":"동생은 키가 크다 + 운동도 잘한다","a":"동생은 키가 큰 데다가 운동도 잘해요.","en":"My younger sibling is tall and good at sports too."},{"g":"bg-b507","ch":6,"title":"-다든지 -다든지 하다","p":"지원금을 늘리다 + 시설을 짓다","a":"지원금을 늘 f a fire, you must evacuate through the emergency exit."},{"g":"bg-b508","ch":6,"title":"만약 A/V-(으)ㄹ 경우","p":"배송이 늦어지다 + 환불해 드리다","a":"만약 배송이 늦어질 경우 환불해 드립니다.","en":"If delivery is delayed, we will refund you."},{"g":"bg-b508","ch":6,"title":"만약 A/V-(으)ㄹ 경우","p":"비밀번호를 잊어버리다 + 고객센터에 문의하다","a":"만약 비밀번호를 잊어버릴 경우 고객센터에 문의하십시오.","en":"If you forget your password, please contact customer service."},{"g":"bg-b508","ch":6,"title":"만약 A/V-(으)ㄹ 경우","p":"물건이 고장 나다 + 교환할 수 있다","a":"만약 물건이 고장 날 경우 교환할 수 있습니다.","en":"If the item breaks, it can be exchanged."},{"g":"bg-b574","ch":7,"title":"웬만해서는 V-는 일이 없다","p":"그는 화를 내다 + 아주 드물다","a":"그는 웬만해서는 화를 내는 일이 없어요.","en":"He hardly ever gets angry."},{"g":"bg-b574","ch":7,"title":"웬만해서는 V-는 일이 없다","p":"이 휴대폰은 튼튼하다 + 고장 나는 경우는 드물다","a":"이 휴대폰은 웬만해서는 고장 날 일이 없어요.","en":"This phone won't break down under normal use."},{"g":"bg-b574","ch":7,"title":"웬만해서는 V-는 일이 없다","p":"저는 아침을 거르다 + 거의 그런 적이 없다","a":"저는 웬만해서는 아침을 거르는 일이 없어요.","en":"I hardly ever skip breakfast."},{"g":"bg-b574","ch":7,"title":"웬만해서는 V-는 일이 없다","p":"동생은 울다 + 거의 그런 적이 없다","a":"동생은 웬만해서는 울 일이 없어요.","en":"My younger sibling hardly ever cries."},{"g":"bg-b574","ch":7,"title":"웬만해서는 V-는 일이 없다","p":"이 유리는 단단하다 + 깨지는 경우는 드물다","a":"이 유리는 웬만해서는 깨질 일이 없습니다.","en":"This glass won't break under normal circumstances."},{"g":"bg-b574","ch":7,"title":"웬만해서는 V-는 일이 없다","p":"그 가게는 문을 닫다 + 아주 드물다","a":"그 가게는 웬만해서는 문을 닫는 일이 없어요.","en":"That shop hardly ever closes."},{"g":"bg-b574","ch":7,"title":"웬만해서는 V-는 일이 없다","p":"할머니는 병원에 가다 + 거의 그런 적이 없다","a":"할머니는 웬만해서는 병원에 가는 일이 없으세요.","en":"My grandmother hardly ever goes to the hospital."},{"g":"bg-b574","ch":7,"title":"웬만해서는 V-는 일이 없다","p":"우리 팀은 야근을 하다 + 거의 그런 적이 없다","a":"우리 팀은 웬만해서는 야근을 하는 일이 없어요.","en":"Our team hardly ever works overtime."},{"g":"bg-b575","ch":7,"title":"V-(으)랴 V-(으)랴","p":"공부하다 + 아르바이트하다 + 정신이 없다","a":"요즘 공부하랴 아르바이트하랴 정신이 없어요.","en":"These days, between studying and my part-time job, I'm swamped."},{"g":"bg-b575","ch":7,"title":"V-(으)랴 V-(으)랴","p":"청소하다 + 빨래하다 + 하루가 모자라다","a":"청소하랴 빨래하랴 하루가 모자라요.","en":"Between cleaning and laundry, a day isn't enough."},{"g":"bg-b575","ch":7,"title":"V-(으)랴 V-(으)랴","p":"아이를 돌보다 + 일하다 + 힘들다","a":"아이를 돌보랴 일하랴 너무 힘들어요.","en":"Caring for the kids and working, it's really hard."},{"g":"bg-b575","ch":7,"title":"V-(으)랴 V-(으)랴","p":"밥을 먹다 + 전화를 받다 + 바쁘다","a":"밥을 먹으랴 전화를 받으랴 바빠요.","en":"I'm busy eating and answering the phone at once."},{"g":"bg-b575","ch":7,"title":"V-(으)랴 V-(으)랴","p":"이사하다 + 새 직장을 구하다 + 정신이 하나도 없다","a":"이사하랴 새 직장을 구하랴 정신이 하나도 없었어요.","en":"Moving and job-hunting, I was totally frazzled."},{"g":"bg-b575","ch":7,"title":"V-(으)랴 V-(으)랴","p":"어머니는 가게를 보시다 + 집안일을 하시다 + 쉴 틈이 없다","a":"어머니는 가게를 보시랴 집안일을 하시랴 쉴 틈이 없으세요.","en":"My mother is busy minding the shop and doing housework, with no time to rest."},{"g":"bg-b575","ch":7,"title":"V-(으)랴 V-(으)랴","p":"출장 가다 + 보고서 쓰다 + 바쁘다","a":"이번 주는 출장 가랴 보고서 쓰랴 바빴어요.","en":"This week I was busy with a business trip and writing reports."},{"g":"bg-b575","ch":7,"title":"V-(으)랴 V-(으)랴","p":"숙제를 하다 + 친구를 만나다 + 주말이 짧다","a":"숙제를 하랴 친구를 만나랴 주말이 너무 짧아요.","en":"Between homework and meeting friends, the weekend is too short."},{"g":"bg-b576","ch":7,"title":"N은/는 늘 뒷전이다","p":"일이 너무 바쁘다 + 건강은 가장 나중이다","a":"일이 너무 바빠서 건강은 늘 뒷전이에요.","en":"I'm so busy with work that my health always comes last."},{"g":"bg-b576","ch":7,"title":"N은/는 늘 뒷전이다","p":"엄마는 가족이 먼저이다 + 자신은 가장 나중이다","a":"엄마는 가족이 먼저라서 자신은 늘 뒷전이에요.","en":"Mom puts the family first, so she herself always comes last."},{"g":"bg-b576","ch":7,"title":"N은/는 늘 뒷전이다","p":"시험 기간이다 + 취미는 가장 나중이다","a":"시험 기간이라서 취미는 늘 뒷전이에요.","en":"It's exam season, so my hobbies always come last."},{"g":"bg-b576","ch":7,"title":"N은/는 늘 뒷전이다","p":"회사가 이익만 생각하다 + 직원 복지는 가장 나중이다","a":"회사가 이익만 생각해서 직원 복지는 늘 뒷전이에요.","en":"The company only thinks about profit, so employee welfare always comes last."},{"g":"bg-b576","ch":7,"title":"N은/는 늘 뒷전이다","p":"아이를 키우다 + 내 시간은 가장 나중이다","a":"아이를 키우느라 내 시간은 늘 뒷전이에요.","en":"Raising a child, my own time always comes last."},{"g":"bg-b576","ch":7,"title":"N은/는 늘 뒷전이다","p":"가게가 바쁘다 + 직원 식사는 가장 나중이다","a":"가게가 바빠서 직원 식사는 늘 뒷전이에요.","en":"The shop is busy, so staff meals always come last."},{"g":"bg-b576","ch":7,"title":"N은/는 늘 뒷전이다","p":"신제품 개발에 집중하다 + 고객 서비스는 가장 나중이다","a":"신제품 개발에 집중하느라 고객 서비스는 늘 뒷전이에요.","en":"Focusing on new products, customer service always comes last."},{"g":"bg-b576","ch":7,"title":"N은/는 늘 뒷전이다","p":"아빠는 가족을 위해 일하다 + 아빠의 취미는 가장 나중이다","a":"아빠는 가족을 위해 일하느라 취미는 늘 뒷전이에요.","en":"Dad works for the family, so his hobbies always come last."},{"g":"bg-b649","ch":8,"title":"V-(으)면 끝이 아니다","p":"쓰레기를 버리다 + 종류별로 나누어야 하다","a":"쓰레기를 버리면 끝이 아니라 종류별로 나누어야 해요.","en":"Throwing out trash isn't the end; you have to sort it by type."},{"g":"bg-b649","ch":8,"title":"V-(으)면 끝이 아니다","p":"원서를 내다 + 면접도 봐야 하다","a":"원서를 내면 끝이 아니라 면접도 봐야 해요.","en":"Submitting the application isn't the end; you also have to do the interview."},{"g":"bg-b649","ch":8,"title":"V-(으)면 끝이 아니다","p":"이삿짐을 옮기다 + 정리가 더 힘들다","a":"이삿짐을 옮기면 끝이 아니라 정리가 더 힘들어요.","en":"Moving the boxes isn't the end; organizing is harder."},{"g":"bg-b649","ch":8,"title":"V-(으)면 끝이 아니다","p":"계약서에 서명하다 + 돈을 내야 하다","a":"계약서에 서명하면 끝이 아니라 돈을 내야 해요.","en":"Signing the contract isn't the end; you also have to pay."},{"g":"bg-b649","ch":8,"title":"V-(으)면 끝이 아니다","p":"집을 사다 + 관리도 잘해야 하다","a":"집을 사면 끝이 아니라 관리도 잘해야 해요.","en":"Buying a house isn't the end; you also have to maintain it well."},{"g":"bg-b649","ch":8,"title":"V-(으)면 끝이 아니다","p":"바닥을 쓸다 + 창문도 닦아야 하다","a":"바닥을 쓸면 끝이 아니라 창문도 닦아야 해요.","en":"Sweeping the floor isn't the end; you also have to wipe the windows."},{"g":"bg-b649","ch":8,"title":"V-(으)면 끝이 아니다","p":"숙제를 하다 + 제출까지 해야 하다","a":"숙제는 하면 끝이 아니라 제출까지 해야 해요.","en":"Doing homework isn't the end; you also have to hand it in."},{"g":"bg-b649","ch":8,"title":"V-(으)면 끝이 아니다","p":"결혼식을 올리다 + 시작이다","a":"결혼은 식을 올리면 끝이 아니라 시작이에요.","en":"Marriage doesn't end with the ceremony; it begins there."}],"gpoints":[{"id":"bg-b020","ch":1,"title":"가뜩이나 A-(으)ㄴ데 / V-는데"},{"id":"bg-b105","ch":1,"title":"N에 의하면 / N에 따르면 -다고 하다"},{"id":"bg-b106","ch":1,"title":"-다면서 / -다니까 / -다는데 (인용의 준말)"},{"id":"bg-b058","ch":3,"title":"(○○ 씨) 말로는 ~대요"},{"id":"bg-b077","ch":4,"title":"V-는 게 어디 있어요? / A-(으)ㄴ 게 어디 있어요?"},{"id":"bg-b329","ch":4,"title":"N을/를 대상으로 N에 대해 설문 조사를 하다"},{"id":"bg-b330","ch":4,"title":"N이/가 N%로 가장 많았습니다"},{"id":"bg-b331","ch":4,"title":"그 다음으로는 A, B의 순이었습니다"},{"id":"bg-b332","ch":4,"title":"그 밖에 -다는 의견도 있었습니다"},{"id":"bg-b333","ch":4,"title":"이러한 결과를 통해 -다는 것을 알 수 있었습니다"},{"id":"bg-b390","ch":5,"title":"말이 N(이)지"},{"id":"bg-b391","ch":5,"title":"N을/를 통틀어(서)"},{"id":"bg-b505","ch":6,"title":"A/V-(으)므로"},{"id":"bg-b506","ch":6,"title":"A/V-(으)ㄴ/는 데다가"},{"id":"bg-b507","ch":6,"title":"-다든지 -다든지 하다"},{"id":"bg-b508","ch":6,"title":"만약 A/V-(으)ㄹ 경우"},{"id":"bg-b574","ch":7,"title":"웬만해서는 V-는 일이 없다"},{"id":"bg-b575","ch":7,"title":"V-(으)랴 V-(으)랴"},{"id":"bg-b576","ch":7,"title":"N은/는 늘 뒷전이다"},{"id":"bg-b649","ch":8,"title":"V-(으)면 끝이 아니다"}],"colloc":[{"pairs":[["밸런스를","맞추다"],["입장을","밝히다"],["영향을","미치다"],["문제를","일으키다"]],"extra":"틀어박히다"},{"pairs":[["적금을","들다"],["일자리를","구하다"],["돈을","보태다"],["장사가","잘되다"]],"extra":"지우다"},{"pairs":[["등급을","매기다"],["논란이","일어나다"],["대사를","외우다"],["방귀를","뀌다"]],"extra":"건너다"},{"pairs":[["기본기를","다지다"],["주연을","맡다"],["유언을","남기다"],["코를","훌쩍거리다"]],"extra":"부러뜨리다"},{"pairs":[["아이를","혼내다"],["집에서","쫓겨나다"],["재산을","물려받다"],["행복을","가져다주다"]],"extra":"떠내려가다"},{"pairs":[["모기에","물리다"],["열이","나다"],["무좀에","걸리다"],["화상을","입다"]],"extra":"헹구다"},{"pairs":[["종이를","구기다"],["얼룩을","제거하다"],["아이를","달래다"],["건전지를","갈다"]],"extra":"숨다"},{"pairs":[["결과를","좌우하다"],["호기심이","많다"],["틀에서","벗어나다"],["뇌를","자극하다"]],"extra":"비기다"},{"pairs":[["가뭄이","들다"],["황사가","심하다"],["자외선을","차단하다"],["홍수가","나다"]],"extra":"박히다"},{"pairs":[["줄을","치다"],["해일이","덮치다"],["매미가","울다"],["잠자리를","잡다"]],"extra":"건너다"},{"pairs":[["시간을","허비하다"],["위기에","대처하다"],["서류를","결재하다"],["관계를","맺다"]],"extra":"쬐다"},{"pairs":[["룰을","지키다"],["얼굴을","가리다"],["목소리가","쉬다"],["책임을","떠넘기다"]],"extra":"훑다"},{"pairs":[["손을","내밀다"],["팔짱을","끼다"],["고개를","끄덕이다"],["허리를","굽히다"]],"extra":"찍다"},{"pairs":[["턱을","괴다"],["입술을","다물다"],["손을","뻗다"],["얼굴을","찡그리다"]],"extra":"해석하다"},{"pairs":[["대책을","마련하다"],["설문 조사를","실시하다"],["걱정을","덜다"],["최저치를","기록하다"]],"extra":"닳다"},{"pairs":[["정체성을","갖추다"],["일리가","있다"],["안간힘을","쓰다"],["만족을","느끼다"]],"extra":"사라지다"},{"pairs":[["친근감을","느끼다"],["정이","들다"],["사랑에","빠지다"],["미움을","받다"]],"extra":"닳다"},{"pairs":[["대회에","출전하다"],["여론을","조사하다"],["1위를","차지하다"],["설문에","응답하다"]],"extra":"쫓다"},{"pairs":[["기에","눌리다"],["말을","아끼다"],["직책을","맡다"],["혀를","내두르다"]],"extra":"훑다"},{"pairs":[["가이드북을","훑다"],["시야를","넓히다"],["햇볕을","쬐다"],["밑창이","닳다"]],"extra":"쫓아내다"},{"pairs":[["쓰레기로","전락하다"],["실수를","저지르다"],["택배 상자를","뜯다"],["장을","보다"]],"extra":"비치다"},{"pairs":[["비웃음을","사다"],["몸짓을","해석하다"],["안색을","살피다"],["망신을","당하다"]],"extra":"굽히다"},{"pairs":[["마음의 병을","앓다"],["스트레스를","해소하다"],["그림을","감상하다"],["고향을","떠올리다"]],"extra":"숨다"},{"pairs":[["하느님께","빌다"],["구멍을","뚫다"],["호두를","까다"],["밧줄을","잡다"]],"extra":"달래다"}],"personality":[{"text":"정민 씨는 결정을 내리기 전에 몇 번이나 생각해요. 위험한 일은 절대 서두르지 않아요.","answer":"신중하다","options":["변덕스럽다","신중하다","시원시원하다","털털하다"],"en":"Jeongmin thinks several times before deciding and never rushes into risky things. -> careful / prudent."},{"text":"그분은 상을 많이 받았는데도 자기가 잘했다고 말하지 않아요. 항상 \"다른 분들 덕분이에요\"라고 해요.","answer":"겸손하다","options":["겸손하다","심술궂다","이기적이다","직선적이다"],"en":"Wins many prizes but never brags, always credits others. -> humble."},{"text":"우리 팀장님은 음식도 옷도 마음에 드는 것만 고르세요. 보고서에 작은 실수가 있어도 다시 해 오라고 하세요.","answer":"까다롭다","options":["털털하다","차분하다","까다롭다","단순하다"],"en":"Our team leader only accepts what suits them and sends reports back for small mistakes. -> picky / demanding."},{"text":"그는 서류에 틀린 글자가 없는지 세 번씩 확인해요. 책상 위의 물건도 항상 줄을 맞춰 정리해요.","answer":"꼼꼼하다","options":["변덕스럽다","털털하다","꼼꼼하다","시원시원하다"],"en":"Checks documents three times and lines everything up on the desk. -> meticulous."},{"text":"언니는 작은 일에 신경 쓰지 않고 누구하고든 편하게 지내요. 옷에 커피를 쏟아도 웃어넘겨요.","answer":"털털하다","options":["예민하다","털털하다","까다롭다","꼼꼼하다"],"en":"Doesn't sweat the small stuff, gets along with anyone, laughs off a coffee spill. -> easygoing."},{"text":"그 사람은 아침에는 기분이 좋다가 점심에는 화를 내요. 어제 한 말도 오늘은 바꿔 버려요.","answer":"변덕스럽다","options":["신중하다","변덕스럽다","차분하다","침착하다"],"en":"Good mood in the morning, angry by lunch, changes yesterday's words. -> fickle / moody."},{"text":"동생은 새 게임을 사면 사흘만 하고 또 다른 걸 사요. 책도 취미도 오래 가는 게 없어요.","answer":"싫증을 잘 내다","options":["꼼꼼하다","싫증을 잘 내다","신중하다","보수적이다"],"en":"Plays a new game for three days then buys another; no book or hobby lasts. -> gets bored easily."},{"text":"할아버지는 새로운 방식을 별로 좋아하지 않으세요. 옛날부터 해 온 대로만 하려고 하세요.","answer":"보수적이다","options":["융통성이 있다","보수적이다","예술 감각이 있다","시원시원하다"],"en":"Grandfather dislikes new ways and sticks to how things were always done. -> conservative."},{"text":"그녀는 그림도 잘 그리고 방을 꾸미는 감각도 남달라요. 색을 맞추는 걸 보면 누구나 감탄해요.","answer":"예술 감각이 있다","options":["단순하다","직선적이다","이성적이다","예술 감각이 있다"],"en":"Draws well, decorates with a special flair, people admire her colour sense. -> has an artistic sense."},{"text":"그는 계획이 바뀌어도 당황하지 않고 상황에 맞게 방법을 바꿔요. 규칙에 너무 얽매이지도 않아요.","answer":"융통성이 있다","options":["융통성이 있다","까다롭다","보수적이다","이기적이다"],"en":"When plans change he adapts to the situation and isn't tied to rules. -> flexible."},{"text":"민수 씨는 감정에 휩쓸리지 않고 사실과 자료를 보고 판단해요. 화가 나도 이유부터 따져 봐요.","answer":"이성적이다","options":["변덕스럽다","심술궂다","예술 감각이 있다","이성적이다"],"en":"Judges by facts and data, not emotion; analyses the reason even when angry. -> rational."},{"text":"저희 부장님은 마음에 안 들면 바로 말씀하세요. \"이 보고서는 별로예요\"라고 돌려 말하지 않으세요.","answer":"직선적이다","options":["차분하다","조신하다","겸손하다","직선적이다"],"en":"Says right away when they dislike something, no beating about the bush. -> blunt / direct."},{"text":"그 사람은 자기가 먼저 먹으려고 남의 것까지 가져가요. 다른 사람의 사정은 전혀 생각하지 않아요.","answer":"이기적이다","options":["순수하다","이기적이다","지혜롭다","겸손하다"],"en":"Takes others' food for themselves and ignores other people's situations. -> selfish."},{"text":"시험 전날에도 그의 목소리는 낮고 조용해요. 급한 일이 생겨도 서두르지 않고 천천히 말해요.","answer":"차분하다","options":["직선적이다","차분하다","변덕스럽다","시원시원하다"],"en":"Even the night before an exam his voice is low and quiet; speaks slowly in emergencies. -> calm / composed."},{"text":"제 친구는 복잡한 생각을 별로 안 해요. 기분 나쁜 일이 있어도 하룻밤 자고 나면 금방 잊어버려요.","answer":"단순하다","options":["예민하다","꼼꼼하다","신중하다","단순하다"],"en":"Doesn't overthink; forgets bad things after one night's sleep. -> simple-minded / uncomplicated."},{"text":"사람들 사이에 갈등이 생기면 그분이 나서요. 모두가 납득할 수 있는 방법을 찾아 줘요.","answer":"지혜롭다","options":["지혜롭다","어리석다","심술궂다","불성실하다"],"en":"When conflict arises she steps in and finds a solution everyone accepts. -> wise."}],"wrong":[{"sents":["친구와 시간을 [[맞춰서]] 약속을 잡았다.","음악에 [[맞춰]] 춤을 췄다.","일과 삶의 균형을 [[맞추고]] 싶다.","퀴즈 정답을 [[맞췄다]]."],"wrong":3,"fix":"맞혔다","why":"정답을 맞히다 (to hit the right answer); 맞추다 is to adjust/fit."},{"sents":["[[모처럼]] 쉬는 날인데 푹 쉬세요.","새 프로젝트가 요즘 [[잘되가요]].","서류를 [[꼼꼼하게]] 확인했다.","어려운 일을 결국 [[해냈다]]."],"wrong":1,"fix":"잘돼 가요","why":"되어 -> 돼, and 잘돼 가다 is written with a space before 가다."},{"sents":["물가가 비싼 [[데다가]] 집값도 높습니다.","그는 성실한 [[데다가]] 머리도 좋다.","길이 막히는[[데다가]] 비까지 와서 늦었다.","날씨가 더운 [[데다가]] 습기도 많다."],"wrong":2,"fix":"막히는 데다가","why":"-(으)ㄴ/는 데다가: 데 is a bound noun, so it is spaced from the verb."},{"sents":["그는 어떤 어려움에도 [[결코 포기하지]] 않았다.","이번 시험은 [[결코 쉽지]] 않았다.","나는 그 일을 [[결코 잊을]] 것이다.","그런 말은 [[결코 농담이]] 아니었다."],"wrong":2,"fix":"결코 잊지 않을","why":"결코 must be used with a negative ending."},{"sents":["[[통계]]에 따르면 인구가 줄었다.","[[지난 해]]보다 출산율이 떨어졌다.","[[사상]] 최저를 기록했다.","[[대책]] 마련이 시급하다."],"wrong":1,"fix":"지난해","why":"지난해 (last year) is one word."},{"sents":["독서는 생각의 폭을 [[넓이게]] 해 준다.","여행은 시야를 [[넓히는]] 좋은 방법이다.","그 방법은 오히려 [[소용이 없었다]].","방학에 [[어학연수]]를 다녀왔다."],"wrong":0,"fix":"넓히게","why":"넓히다 (to broaden) is the verb; 넓이 is a noun (area)."},{"sents":["[[오랜]] 우정을 지키고 싶다.","[[간만에]] 친구를 만났다.","[[모처럼]] 한가한 주말이었다.","[[오랜만에]] 가족과 집밥을 먹었다."],"wrong":3,"fix":"오랜만에","why":"Standard spelling is 오랜만에 (no 사이시옷)."},{"sents":["그는 시끄럽게 해서 가게에서 [[쫓겨났다]].","엄마가 화가 나서 동생을 집에서 [[쫓아냈다]].","삼촌은 빚 때문에 집에서 [[쫓아내졌다]].","도깨비가 사람들을 마을에서 [[쫓아냈다]]."],"wrong":2,"fix":"쫓겨났다","why":"Passive (be kicked out) is 쫓겨나다; 쫓아내다 + 지다 is wrong."},{"sents":["[[만약 정책이 실패할 경우]] 문제가 커질 수 있습니다.","지원금을 [[늘린다든지]] 시설을 짓는다든지 해야 합니다.","출산율이 [[낮으므로]] 대책이 필요합니다.","살림하[[려 육아하려]] 여유가 없습니다."],"wrong":3,"fix":"랴 육아하랴","why":"'busy doing A and B' is -(으)랴 -(으)랴, not -(으)려."},{"sents":["용기를 깨끗이 [[헹궈서]] 배출했다.","머리를 물로 [[헹구고]] 린스를 발랐다.","컵을 두 번 [[헹거서]] 말렸다.","빨래를 [[헹구는]] 데 오래 걸린다."],"wrong":2,"fix":"헹궈서","why":"Spelling: 헹구다 + 어서 -> 헹궈서."},{"sents":["모기에 [[물려서]] 너무 가렵다.","벌레가 내 다리를 [[물려서]] 부었다.","아이가 개에게 팔을 [[물렸다]].","강아지가 내 손가락을 [[물었다]]."],"wrong":1,"fix":"물어서","why":"The bug is the subject doing the biting, so active 물다; passive 물리다 needs the biter marked with 에/에게."},{"sents":["그 말도 [[일리가 있다]].","후회해도 [[소용이 없다]].","아무리 말해도 [[소귀에 경 읽기다]].","비가 와서 [[어쩔수 없이]] 취소했다."],"wrong":3,"fix":"어쩔 수 없이","why":"어쩔 수 없다 is written with spaces (수 is a bound noun)."},{"sents":["그 실수가 회사에 큰 문제를 [[일어났다]].","부모의 태도는 아이에게 큰 [[영향을 미친다]].","정부가 이 문제에 대한 공식 [[입장을 밝혔다]].","일과 삶의 [[밸런스를 맞추는]] 것이 중요해요."],"wrong":0,"fix":"일으켰다","why":"문제를 일으키다 (transitive); 일어나다 is intransitive."},{"sents":["늦게 일어난 [[덕에]] 버스를 놓쳤다.","어머님 [[덕에]] 무사히 졸업했습니다.","친구가 도와준 [[덕에]] 시험에 붙었다.","선생님 [[덕에]] 한국어가 늘었다."],"wrong":0,"fix":"탓에","why":"덕에 is for good results; use 탓에 for a bad result."},{"sents":["산책을 하니 스트레스가 [[해소됬다]].","[[차츰]] 마음이 안정되었다.","그 소식이 신문에 크게 [[보도되었다]].","숨은 의미가 [[드러났다]]."],"wrong":0,"fix":"해소됐다","why":"되었다 contracts to 됐다, never 됬다."},{"sents":["주말 내내 방에 [[틀어박혀]] 있었다.","비가 와서 하루 종일 집에 [[틀에 박혀]] 있었다.","머리에 [[박힌]] 생각이 쉽게 안 바뀐다.","그는 [[틀에 박힌]] 생각에서 벗어나지 못한다."],"wrong":1,"fix":"틀어박혀","why":"To shut oneself in is 틀어박히다; 틀에 박히다 means stereotyped."}],"pick":[{"s":"그는 성실한 ( 데다가 / 데도 ) 머리도 좋다.","answer":"데다가","en":"He is diligent and on top of that smart."},{"s":"우물에 내 얼굴이 ( 비쳤다 / 비췄다 ).","answer":"비쳤다","en":"My face was reflected in the well."},{"s":"스트레스는 건강에 나쁜 영향을 ( 미친다 / 맞춘다 ).","answer":"미친다","en":"Stress has a bad influence on health."},{"s":"가방 속에서 종이가 ( 구겼다 / 구겨졌다 ).","answer":"구겨졌다","en":"The paper got crumpled inside the bag."},{"s":"퀴즈 정답을 ( 맞혔다 / 맞췄다 ).","answer":"맞혔다","en":"I got the quiz answer right."},{"s":"아이가 장난으로 나뭇가지를 ( 부러졌다 / 부러뜨렸다 ).","answer":"부러뜨렸다","en":"The child snapped the branch for fun."},{"s":"모기에 ( 물었다 / 물렸다 ).","answer":"물렸다","en":"I got bitten by a mosquito."},{"s":"아이가 떠들어서 교실에서 ( 쫓겨났다 / 쫓아냈다 ).","answer":"쫓겨났다","en":"The kid was kicked out of the classroom for being noisy."},{"s":"( 오래 / 오랜 ) 경기 침체가 이어졌다.","answer":"오랜","en":"A long-standing economic slump continued."},{"s":"용기를 물에 ( 행궈서 / 헹궈서 ) 버렸다.","answer":"헹궈서","en":"I rinsed the container in water before throwing it away."},{"s":"어젯밤부터 열이 ( 났다 / 냈다 ).","answer":"났다","en":"I've had a fever since last night."},{"s":"네 ( 덕에 / 탓에 ) 시험에 합격했어. 고마워!","answer":"덕에","en":"Thanks to you I passed the exam."},{"s":"등이 ( 가려워서 / 가렵어서 ) 잠을 못 잤다.","answer":"가려워서","en":"My back was itchy so I couldn't sleep."},{"s":"( 매우 / 도무지 ) 무슨 말인지 모르겠다.","answer":"도무지","en":"I have no idea at all what that means."},{"s":"시계를 일곱 시에 ( 맞혔다 / 맞췄다 ).","answer":"맞췄다","en":"I set the clock to seven."},{"s":"오래 걸어서 신발 밑창이 ( 달았다 / 닳았다 ).","answer":"닳았다","en":"I walked a lot and the shoe soles wore out."},{"s":"오래 같이 살다 보니 정이 ( 들었다 / 들였다 ).","answer":"들었다","en":"After living together long, we grew attached."},{"s":"그 집은 웃음이 ( 끊이지 / 끊기지 ) 않는다.","answer":"끊이지","en":"Laughter never stops in that house."},{"s":"씨름꾼이 상대를 ( 넘어뜨렸다 / 넘어졌다 ).","answer":"넘어뜨렸다","en":"The wrestler knocked his opponent down."},{"s":"그 실수가 회사에 큰 문제를 ( 일어났다 / 일으켰다 ).","answer":"일으켰다","en":"That mistake caused big trouble for the company."},{"s":"그 일은 ( 결코 / 가끔 ) 잊지 못할 것이다.","answer":"결코","en":"I will never forget that."},{"s":"비가 ( 오므로 / 오니까 ) 우산을 가져가세요.","answer":"오니까","en":"It's raining, so take an umbrella (-(으)므로 can't take a command)."},{"s":"그 소식은 신문에 크게 ( 보도했다 / 보도되었다 ).","answer":"보도되었다","en":"The news was reported prominently in the paper."},{"s":"시야를 ( 넓이려고 / 넓히려고 ) 여행을 떠났다.","answer":"넓히려고","en":"I travelled to broaden my horizons."}],"idiom":[{"idiom":"걱정이 태산이다","b":"네, 걱정이 태산이에요. 밤을 새워도 모자랄 것 같아요.","modelA":"다음 주가 졸업 시험인데 아직 하나도 공부를 못 했다면서요?","en":"A: You haven't studied at all for next week's graduation exam? B: Yes, I'm worried sick. Even an all-nighter won't be enough."},{"idiom":"총대를 메다","b":"그럼 제가 총대를 메고 교수님께 말씀드릴게요.","modelA":"다들 교수님께 시험 날짜를 바꿔 달라고 말하고 싶어 하는데 아무도 먼저 나서지 않아요.","en":"A: Everyone wants to ask the professor to move the exam date, but nobody steps forward. B: Then I'll take the lead and talk to the professor."},{"idiom":"독 안에 든 쥐","b":"이제 그 도둑은 독 안에 든 쥐네요.","modelA":"경찰이 건물의 출구를 모두 막아서 도둑은 도망갈 곳이 없대요.","en":"A: The police blocked every exit, so the thief has nowhere to run. B: So now that thief is a rat in a jar (cornered)."},{"idiom":"소문난 잔치에 먹을 것 없다","b":"소문난 잔치에 먹을 것 없다더니 딱 그 말이네요.","modelA":"그 식당이 텔레비전에 나와서 세 시간이나 기다렸는데 음식은 별로였어요.","en":"A: That restaurant was on TV, so I waited three hours, but the food was nothing special. B: The much-hyped feast has nothing to eat, as they say - exactly that."},{"idiom":"두 마리 토끼를 다 잡다","b":"정말 대단하네요. 두 마리 토끼를 다 잡았군요.","modelA":"민수 씨는 이번 학기에 장학금도 받고 동아리 대회에서 우승도 했대요.","en":"A: Minsu got a scholarship and also won the club competition this semester. B: Wow. He caught two rabbits at once."},{"idiom":"첫눈에 반하다","b":"네, 그 사람을 보자마자 첫눈에 반했어요.","modelA":"소개팅에서 처음 만났는데 바로 사귀게 됐다면서요?","en":"A: You met on a blind date and started dating right away? B: Yes, I fell for him at first sight."},{"idiom":"정이 들다","b":"네, 2년 동안 살다 보니까 정이 많이 들었어요.","modelA":"다음 달에 하숙집을 떠나시는데 아쉽지 않으세요?","en":"A: You're leaving your boarding house next month - aren't you sad? B: Yes, after two years there I've grown very attached."},{"idiom":"가슴이 찡하다","b":"엄마가 아들을 기다리는 장면에서 가슴이 찡해서 눈물이 났어요.","modelA":"어제 본 영화에서 어느 장면이 제일 감동적이었어요?","en":"A: Which scene in the movie you saw yesterday was the most touching? B: The scene of the mother waiting for her son moved me deeply and I cried."},{"idiom":"말이 필요 없다","b":"말이 필요 없어요. 한번 드셔 보세요.","modelA":"이 집 불고기가 그렇게 맛있다고 하던데 정말이에요?","en":"A: People say the bulgogi here is that good - is it true? B: It goes without saying. Just try it."},{"idiom":"눈치가 보이다","b":"맞아요. 일이 끝나도 눈치가 보여서 먼저 못 가요.","modelA":"부장님이 퇴근을 안 하셨을 때 먼저 집에 가기가 어렵지 않아요?","en":"A: Isn't it hard to go home first while the department head is still there? B: Right. Even when my work is done, I feel self-conscious and can't leave first."},{"idiom":"손을 쓰다","b":"지금은 손을 쓸 수가 없어요. 다음 공연을 기다려야 할 것 같아요.","modelA":"내일 공연 표가 전부 매진됐는데 어떻게 하죠?","en":"A: Tomorrow's tickets are all sold out. What should we do? B: There's nothing we can do right now. We'll have to wait for the next show."},{"idiom":"여한이 없다","b":"이제 여한이 없어요. 원 없이 다녔거든요.","modelA":"오랫동안 꿈꾸던 세계 여행을 마치셨는데 기분이 어떠세요?","en":"A: You finished the world trip you dreamed of for so long - how do you feel? B: I have no regrets now. I traveled to my heart's content."},{"idiom":"어쩔 수 없다","b":"아쉽지만 어쩔 수 없죠. 다음에 가요.","modelA":"비가 너무 많이 와서 오늘 소풍이 취소됐대요.","en":"A: The picnic was cancelled today because of heavy rain. B: It's a shame but it can't be helped. Let's go next time."},{"idiom":"틀에 박히다","b":"너무 틀에 박힌 방식이네요. 새로운 아이디어가 필요해요.","modelA":"우리 회사는 매년 똑같은 방식으로 광고를 만들어요.","en":"A: Our company makes ads the same way every year. B: That's very stereotyped. You need new ideas."},{"idiom":"과언이 아니다","b":"한국에서 모르는 사람이 없다고 해도 과언이 아니에요.","modelA":"그 가수가 요즘 인기가 정말 많다면서요?","en":"A: I hear that singer is really popular these days? B: It's no exaggeration to say that everyone in Korea knows her."},{"idiom":"정을 쌓다","b":"같이 점심도 먹고 이야기도 하면서 정을 쌓아 보세요.","modelA":"새 회사에서 동료들과 빨리 친해지고 싶은데 어떻게 하면 좋을까요?","en":"A: I want to get close to my coworkers at the new company quickly - what should I do? B: Have lunch and talk together and build up a bond."},{"idiom":"녹초가 되다","b":"네, 완전히 녹초가 됐어요. 오늘은 일찍 자려고요.","modelA":"어제 밤늦게까지 야근하셨다면서요? 오늘 많이 피곤하시겠어요.","en":"A: You worked overtime until late last night? You must be very tired today. B: Yes, I'm completely wiped out. I plan to sleep early today."},{"idiom":"소귀에 경 읽기","b":"소귀에 경 읽기네요. 아무리 말해도 소용이 없어요.","modelA":"동생한테 일찍 자라고 백 번 말했는데 계속 게임만 해요.","en":"A: I told my little brother a hundred times to sleep early but he keeps playing games. B: It's preaching to deaf ears. Telling him is useless."},{"idiom":"혀를 내두르다","b":"정말 대단해요. 다들 혀를 내두르고 있어요.","modelA":"저 선배는 하루에 열다섯 시간씩 일하는데도 하나도 안 피곤해 보여요.","en":"A: That senior works fifteen hours a day yet doesn't look tired at all. B: He's amazing. Everyone is lost for words."},{"idiom":"믿는 도끼에 발등 찍힌다","b":"믿는 도끼에 발등 찍힌다더니, 정말 속상하시겠어요.","modelA":"제일 친한 친구가 제 비밀을 모든 사람에게 말해 버렸어요.","en":"A: My closest friend told everyone my secret. B: Betrayed by the one you trusted - you must be really upset."}],"speak":[{"grammar":"보자 보자 하니까","a":"너 왜 자꾸 내 물건을 허락도 없이 쓰는 거야?","b":"___ 너무하네. 이제 더는 못 참겠어.","answers":["보자 보자 하니까"],"en":"A: Why do you keep using my things without permission? B: I've let it slide so far, but this is too much. I can't stand it anymore."},{"grammar":"이래 봬도","a":"한식 요리를 잘하세요?","b":"제가 ___ 한식 조리사 자격증도 있어요.","answers":["이래 봬도"],"en":"A: Are you good at cooking Korean food? B: Despite how I look, I even have a Korean cooking license."},{"grammar":"-는 게 어디 있어요?","a":"민수 씨가 어제 갑자기 회사를 그만뒀대요.","b":"그래도 말도 없이 그만두는 ___?","answers":["게 어디 있어요","게 어디 있어","게 어디 있습니까"],"en":"A: Minsu suddenly quit the company yesterday. B: Still, how can he quit without a word?"},{"grammar":"말이 -(이)지","a":"이번 주말에 여행 간다면서요?","b":"말이 ___, 사실은 친척 결혼식에 가는 거예요.","answers":["여행이지"],"en":"A: You're going on a trip this weekend, right? B: It's called a trip, but really I'm going to a relative's wedding."},{"grammar":"가뜩이나 -은/는데","a":"요즘 왜 이렇게 기운이 없어요?","b":"___ 일이 많은데 시험 준비까지 해야 해서 힘들어요.","answers":["가뜩이나"],"en":"A: Why do you seem so low on energy lately? B: As it is I have a lot of work, and now I also have to prepare for exams, so it's hard."},{"grammar":"-에 따르면 -다고 하다","a":"내일 날씨가 어떻대요?","b":"뉴스___ 내일 비가 많이 온다고 해요.","answers":["에 따르면","에 의하면"],"en":"A: What's the weather going to be like tomorrow? B: According to the news, it will rain a lot tomorrow."},{"grammar":"덕에","a":"시험에 합격했다면서요? 축하해요!","b":"고마워요. 선생님이 도와주신 ___ 합격했어요.","answers":["덕에","덕분에"],"en":"A: I heard you passed the exam - congratulations! B: Thanks. I passed thanks to the teacher's help."},{"grammar":"(○○ 씨) 말로는 ~대요","a":"민수 씨 몸은 좀 괜찮대요?","b":"의사 선생님 ___ 이번 주만 쉬면 괜찮대요.","answers":["말로는"],"en":"A: Is Minsu feeling any better? B: According to the doctor, he'll be fine if he rests just this week."},{"grammar":"-을/를 통틀어(서)","a":"이번 유럽 여행에서 뭐가 제일 기억에 남아요?","b":"한 달 동안의 긴 여행을 ___ 그 노을 한 장면이 제일 기억에 남아요.","answers":["통틀어서","통틀어"],"en":"A: What do you remember most from your Europe trip? B: Out of the whole month-long trip, that one sunset scene stays with me the most."},{"grammar":"-(으)랴 -(으)랴","a":"요즘 많이 바쁘시죠?","b":"네, ___ 아이 키우랴 정신이 하나도 없어요.","answers":["일하랴","회사 다니랴","출근하랴","직장 다니랴"],"en":"A: You must be very busy lately. B: Yes, between working and raising my kid I have no time to breathe."},{"grammar":"웬만해서는 -는 일 없다","a":"이 가방은 튼튼해요?","b":"그럼요. ___ 망가질 일이 없어요.","answers":["웬만해서는","웬만해선"],"en":"A: Is this bag sturdy? B: Of course. It hardly ever breaks."},{"grammar":"뭐니 뭐니 해도","a":"직장에서 돈도 중요하지만 뭐가 제일 중요한 것 같아요?","b":"___ 같이 일하는 사람들이 좋은 게 최고죠.","answers":["뭐니 뭐니 해도"],"en":"A: Money matters at work, but what do you think is most important? B: When all is said and done, having good people to work with is the best."},{"grammar":"-(으)ㄴ/는 데다가","a":"그 식당이 왜 그렇게 인기가 많아요?","b":"음식이 맛있는 ___ 가격도 싸거든요.","answers":["데다가","데다"],"en":"A: Why is that restaurant so popular? B: On top of the food being delicious, the prices are cheap too."},{"grammar":"-(으)면 끝이 아니다","a":"분리수거함에 넣었으니까 이제 끝난 거죠?","b":"아니요, 그냥 버리___ 끝이 아니에요. 라벨도 떼어야 해요.","answers":["면","기만 하면"],"en":"A: I put it in the recycling bin, so that's done, right? B: No, it doesn't end with just throwing it away. You have to remove the label too."},{"grammar":"-을/를 대상으로 -에 대해 설문 조사하다","a":"이번 설문 조사는 누구를 대상으로 했어요?","b":"대학생 100명___ 아르바이트 경험에 대해 설문 조사했습니다.","answers":["을 대상으로"],"en":"A: Who was the survey targeted at? B: We surveyed 100 university students about part-time job experience."},{"grammar":"-이/가 -%로 가장 많았습니다","a":"아르바이트를 하는 이유로 어떤 의견이 가장 많았어요?","b":"용돈을 벌기 위해서라는 응답이 45%___.","answers":["로 가장 많았습니다","로 가장 많았어요"],"en":"A: What was the most common reason for working part-time? B: The answer 'to earn pocket money' was the most common at 45%."},{"grammar":"그 다음으로는 -의 순이었습니다","a":"그 다음으로는 어떤 의견이 많았어요?","b":"그 다음으로는 경험 쌓기, 친구 사귀기___.","answers":["의 순이었습니다","의 순이었어요"],"en":"A: What came next? B: Next came gaining experience, then making friends, in that order."},{"grammar":"그 밖에 -다는 의견도 있었습니다","a":"다른 의견도 있었나요?","b":"네, 그 ___ 시간이 남아서 한다는 의견도 있었습니다.","answers":["밖에"],"en":"A: Were there other opinions? B: Yes, there was also the opinion that people do it because they have spare time."},{"grammar":"이러한 결과를 통해 -을 알 수 있었습니다","a":"조사 결과를 보고 무엇을 알게 되었어요?","b":"이러한 결과를 ___ 많은 대학생이 경험을 쌓기 위해서도 일한다는 것을 알 수 있었습니다.","answers":["통해","통해서"],"en":"A: What did you learn from the survey results? B: Through these results we learned that many students also work to gain experience."},{"grammar":"만약 -(으)ㄹ 경우","a":"내일 비가 오면 소풍은 어떻게 해요?","b":"만약 비가 올 ___ 교실에서 게임을 할 거예요.","answers":["경우에는","경우에","경우"],"en":"A: What will we do for the picnic if it rains tomorrow? B: In the event that it rains, we'll play games in the classroom."}],"simile":[{"expr":"소귀에 경 읽기","meaning":"reading scripture to a cow's ear - talking to someone who won't listen, so it is useless","model":["A: 동생한테 매일 일찍 일어나라고 말하는데 전혀 듣지 않아요.","B: 아, 그야말로 소귀에 경 읽기네요. 정말 답답하시겠어요.","A: 네, 아무리 말해도 소용이 없어서 이제는 포기하고 싶어요.","B: 그래도 화내지 말고 동생이 왜 힘들어하는지 먼저 물어보세요."]},{"expr":"보기 좋은 떡이 먹기에 좋다","meaning":"good-looking rice cake is good to eat - things that look nice are also nicer to have/eat","model":["A: 이 케이크는 모양이 정말 예쁘네요. 맛은 어떨까요?","B: 보기 좋은 떡이 먹기에 좋다고 하잖아요. 맛있을 것 같아요.","A: 맞아요. 가게 안도 깨끗하고 포장도 예뻐서 기대돼요.","B: 그럼 하나 사서 같이 먹어 봐요."]},{"expr":"맹모삼천지교","meaning":"Mencius' mother moved three times - a parent who will do anything, even move house, for the child's education","model":["A: 아이 학교 때문에 다음 달에 이사를 가기로 했어요.","B: 맹모삼천지교라는 말이 있지만 정말 쉽지 않은 결정이었을 텐데요.","A: 네, 그래도 아이한테 좋은 환경을 만들어 주고 싶어서요.","B: 부모님의 마음이 느껴져요. 새로운 곳에서도 잘 적응하길 바랄게요."]},{"expr":"허파에 바람이 덜 빠지다","meaning":"the air hasn't fully left the lungs - being full of oneself, silly or too carefree for one's age","model":["A: 우리 오빠는 서른 살인데도 아직 철이 없고 장난만 쳐요.","B: 허파에 바람이 덜 빠졌나 봐요. 가족들이 걱정이 많으시겠어요.","A: 네, 이제 취직도 해야 하는데 놀 생각만 해요.","B: 진지하게 이야기해 보면 오빠도 달라질 수 있지 않을까요?"]},{"expr":"숨통이 트이다","meaning":"to get breathing room - to feel relief after a tight, stressful situation","model":["A: 시험이 모두 끝났는데 기분이 어때요?","B: 이제야 숨통이 트이는 것 같아요. 한 달 동안 정말 힘들었거든요.","A: 저도 그래요. 오늘은 맛있는 걸 먹으면서 좀 쉬어요.","B: 좋아요. 제가 맛집을 알고 있으니까 같이 가요."]},{"expr":"믿는 구석이 있다","meaning":"to have something to fall back on - a safety net that gives one confidence","model":["A: 회사를 그만두고 새로 사업을 시작하신다고요? 걱정되지 않으세요?","B: 믿는 구석이 있어서 괜찮아요. 가족이 도와주기로 했거든요.","A: 그렇군요. 그래도 처음에는 힘든 일이 많을 거예요.","B: 네, 조심해서 하나씩 준비해 볼게요. 걱정해 주셔서 고마워요."]},{"expr":"기에 눌리다","meaning":"to be overpowered by someone's presence - feeling intimidated by a strong person","model":["A: 새로 온 대표님 앞에서는 저도 모르게 말을 못 하겠어요.","B: 대표님의 기에 눌려 계신 것 같아요. 처음에는 누구나 그래요.","A: 네, 회의 때마다 긴장돼서 아무 말도 못 해요.","B: 천천히 조금씩 의견을 말해 보면 점점 편해질 거예요."]},{"expr":"이것저것 없는 게 없다","meaning":"to have everything under the sun - a place with every kind of thing","model":["A: 새로 생긴 마트에 가 보셨어요?","B: 네, 이것저것 없는 게 없어서 구경하는 것만으로도 재미있었어요.","A: 그래요? 저도 이번 주말에 가 봐야겠네요.","B: 사람이 많으니까 오전에 가는 게 좋아요."]}],"conflict":[{"title":"룸메이트의 설거지","lines":["친구1: 야, 또 설거지 안 했어? 싱크대에 그릇이 가득하잖아.","친구2: 오늘 너무 바빴어. 내일 하면 되지.","친구1: 맨날 내일, 내일 하면서 안 하잖아. 너 진짜 게을러.","친구2: 내가 게으르다고? 지난주에는 내가 다 했거든.","친구1: 그건 한 번뿐이었잖아. 나만 계속 치우는 게 어디 있어?","친구2: 그럼 네가 다 해. 나는 모르겠어."],"problem":"Friend 1 blames and labels the roommate (lines 1, 3: 'you're really lazy'); Friend 2 gets defensive and refuses (lines 2, 4, 6). Neither asks about the other's feelings or proposes a fair plan.","model":["A: 요즘 설거지 때문에 내가 좀 힘들었어. 혹시 이야기해도 괜찮아?","B: 응, 말해 봐. 요즘 내가 너무 바빴어. 미안해.","A: 바쁜 건 알아. 그래도 그릇이 쌓이면 나도 스트레스를 받아서 말하는 거야.","B: 네 마음을 이해해. 앞으로는 요일을 정해서 번갈아 가며 하면 어떨까?","A: 좋은 생각이야. 월수금은 내가 하고 화목토는 네가 하자.","B: 알겠어. 오늘은 내가 먼저 설거지할게. 말해 줘서 고마워."]},{"title":"조별 과제 무임승차","lines":["친구1: 발표 자료 언제 줄 거야? 내일이 발표인데 아직도 안 했어?","친구2: 요즘 아르바이트 때문에 시간이 없었어.","친구1: 핑계 대지 마. 우리는 다 밤새워서 했어.","친구2: 그럼 너희가 알아서 하면 되잖아. 나는 발표만 할게.","친구1: 발표만 하는 게 어디 있어? 너 때문에 점수 깎이면 책임질 거야?","친구2: 왜 나한테만 화를 내? 기분 나빠."],"problem":"Friend 1 accuses the teammate of making excuses and threatens blame over the grade (lines 3, 5); Friend 2 offers only to present and then feels attacked (lines 4, 6). Neither asks what the real constraint is or divides the remaining work.","model":["A: 내일이 발표라서 조금 걱정돼. 지금 자료 준비는 어떻게 돼 가고 있어?","B: 솔직히 아르바이트 때문에 거의 못 했어. 정말 미안해.","A: 많이 바빴구나. 그래도 팀 전체 점수가 걸려 있어서 같이 방법을 찾고 싶어.","B: 고마워. 지금 두 장 정도는 오늘 밤에 끝낼 수 있을 것 같아.","A: 좋아. 그럼 나머지는 우리가 나눠서 할게. 대신 발표 연습은 같이 하자.","B: 알겠어. 이번 일은 내가 꼭 만회할게. 이해해 줘서 고마워."]},{"title":"빌려 간 돈","lines":["친구1: 지난달에 빌려 간 돈 언제 줄 거야?","친구2: 아, 그거? 월급 받으면 줄게.","친구1: 지난주에도 똑같이 말했잖아. 너 일부러 안 주는 거지?","친구2: 일부러라니, 나를 의심하는 거야? 친구끼리 너무하네.","친구1: 돈 빌려 가고 연락도 잘 안 하는 게 어디 있어?","친구2: 알았어, 줄 테니까 그만 해. 짜증 나."],"problem":"Friend 1 suspects bad intent and uses an accusing tone (lines 3, 5); Friend 2 postpones vaguely and turns defensive (lines 2, 4, 6). Neither explains the real need or agrees on a concrete date.","model":["A: 저번에 빌려준 돈 이야기를 해도 괜찮을까? 말하기가 조금 불편해서.","B: 응, 괜찮아. 사실 나도 말을 못 해서 마음이 불편했어. 미안해.","A: 나도 요즘 월세 때문에 돈이 필요해서 말을 꺼내게 됐어.","B: 그랬구나. 몰랐어. 월급날이 25일이니까 그날 바로 보낼게.","A: 고마워. 혹시 한꺼번에 주기 어려우면 나눠서 줘도 괜찮아.","B: 배려해 줘서 고마워. 25일에 꼭 보내고 연락도 먼저 할게."]},{"title":"점심 메뉴 정하기","lines":["친구1: 오늘 점심은 무조건 한식이야. 다른 건 안 먹어.","친구2: 나는 어제도 한식 먹었는데. 오늘은 파스타 먹고 싶어.","친구1: 파스타는 비싸고 배도 안 불러. 너는 취향이 이상해.","친구2: 내 취향이 이상하다고? 너야말로 항상 네 마음대로잖아.","친구1: 그럼 너 혼자 가서 먹어. 나는 한식집 갈 거야.","친구2: 좋아, 그렇게 해. 이제 너랑 점심 안 먹어."],"problem":"Friend 1 insists on one menu and insults the friend's taste (lines 1, 3); Friend 2 counters with 'you always do what you want' (line 4). Both escalate to separating instead of compromising.","model":["A: 오늘 점심은 어디서 먹을까? 나는 한식이 먹고 싶은데 너는 어때?","B: 사실 어제 한식을 먹어서 오늘은 파스타가 먹고 싶어.","A: 그렇구나. 어제도 먹었으면 또 먹기 싫을 수 있겠다.","B: 이해해 줘서 고마워. 한식도 먹고 싶은데 내일은 어때?","A: 좋아. 그럼 오늘은 파스타를 먹고 내일은 내가 고른 한식집에 가자.","B: 알겠어. 오늘은 내가 파스타를 살게."]},{"title":"읽고 답이 없는 메시지","lines":["친구1: 나 어제 보낸 메시지 읽었으면서 왜 답장 안 해?","친구2: 바빠서 못 했어. 이게 그렇게 큰일이야?","친구1: 큰일이지. 나를 무시하는 거잖아.","친구2: 무시라니? 너는 늘 그런 식으로 오해해.","친구1: 오해라고? 너는 항상 네 일만 중요하지.","친구2: 하, 말이 안 통하네. 나중에 얘기해."],"problem":"Friend 1 interprets the late reply as disrespect and accuses ('you ignore me', 'only your things matter') (lines 1, 3, 5); Friend 2 minimizes the feeling and calls it a misunderstanding (lines 2, 4), then ends the conversation (line 6).","model":["A: 어제 보낸 메시지에 답이 없어서 조금 서운했어. 혹시 무슨 일 있었어?","B: 어제 정신이 없어서 답장을 못 했어. 서운하게 해서 미안해.","A: 아니야, 바쁜 건 이해해. 그냥 걱정돼서 물어본 거야.","B: 걱정해 줘서 고마워. 바쁠 때는 간단히 나중에 답한다고 보낼게.","A: 그렇게 해 주면 나도 안심이 될 것 같아.","B: 알겠어. 앞으로는 꼭 그렇게 할게. 이야기해 줘서 고마워."]},{"title":"여행 계획 갈등","lines":["친구1: 이번 여행은 내가 다 짜 놨어. 너는 따라오기만 하면 돼.","친구2: 나는 박물관도 가고 싶고 쉬는 시간도 있었으면 좋겠는데.","친구1: 시간이 없어서 박물관은 안 돼. 하루에 다섯 곳은 가야지.","친구2: 그건 여행이 아니라 극기 훈련이야. 나는 그렇게 못 해.","친구1: 계획도 안 세운 사람이 불만만 많네.","친구2: 그럼 나는 그냥 안 갈래."],"problem":"Friend 1 makes every decision alone and dismisses Friend 2's wishes, then criticizes the friend for not planning (lines 1, 3, 5); Friend 2 reacts by rejecting the whole trip (lines 4, 6) rather than negotiating priorities.","model":["A: 여행 계획을 미리 짜 봤는데 네 의견도 듣고 싶어. 어떤 걸 하고 싶어?","B: 고마워. 박물관도 가고 싶고 쉬는 시간도 조금 있었으면 좋겠어.","A: 그렇구나. 나는 가고 싶은 곳이 많아서 일정을 빡빡하게 짰어.","B: 가고 싶은 곳이 많은 마음은 이해해. 다만 하루에 세 곳 정도면 좋을 것 같아.","A: 좋아. 그럼 꼭 가고 싶은 곳만 고르고 하루 한 번은 쉬는 시간을 넣자.","B: 좋은 생각이야. 박물관은 오전에 가고 오후에는 쉬자."]}]};

  const W = DATA.words.filter(x => inCh(x.ch)), G = DATA.gram.filter(x => inCh(x.ch) || x.ch === "mid");
  const Q = []; let num = 0, dnum = 0;
  const push = (sec, q) => { const isD = sec.dlg; q.sec = sec; q.num = isD ? ++dnum : ++num; q.pts = sec.pts; q.ans = null; q.got = null; Q.push(q); };
  // 1-4 synonyms: the swap question in exam form
  for (const w of pick(W, 4)) push(SECS[0], { type: "mc", stem: w.s, options: shuffle([w.a, ...w.w]), answer: w.a, info: w.kr + " — " + w.gl, en: w.en });
  // 5-8 collocation matching (one set = 4 questions)
  { const set = pick(DATA.colloc, 1)[0]; const right = shuffle([...set.pairs.map(p => p[1]), set.extra]);
    set.pairs.forEach((p, k) => push(SECS[1], { type: "match", set, k, left: p[0], answer: p[1], right })); }
  // 9-13 / 18-21: a word box, write the right form
  const boxQs = pick(W.filter(w => w.kr.length > 1), 9);
  boxQs.slice(0, 5).forEach(w => push(SECS[2], { type: "type", box: [w.kr], stem: w.s.replace(/\[\[.+?\]\]/, "<span class=\"blank\"></span>"), answers: [w.a], info: w.kr + " — " + w.gl, en: w.en }));
  for (const p of pick(DATA.personality, 2)) push(SECS[3], { type: "mc", stem: p.text, boxed: true, options: shuffle(p.options.slice()), answer: p.answer, en: p.en });
  for (const p of pick(DATA.wrong, 2)) push(SECS[4], { type: "mc", sents: p.sents, options: p.sents.map((s, k) => k), answer: p.wrong, info: "→ " + p.fix + (p.why ? " · " + p.why : "") });
  boxQs.slice(5, 9).forEach(w => push(SECS[5], { type: "type", box: [w.kr], stem: w.s.replace(/\[\[.+?\]\]/, "<span class=\"blank\"></span>"), answers: [w.a], info: w.kr + " — " + w.gl, en: w.en }));
  for (const p of pick(DATA.pick, 4)) { const m = p.s.match(/\(\s*(.+?)\s*\/\s*(.+?)\s*\)/); push(SECS[6], { type: "two", stem: p.s.replace(m[0], "( ______ )"), options: [m[1], m[2]], answer: p.answer, en: p.en }); }
  // 26-28: rewrite with one of four grammar forms (underlined prompts only)
  { const rw = pick(G.filter(x => /\[\[/.test(x.p)), 3); const box = shuffle([...new Set([...rw.map(x => x.title), ...pick(DATA.gpoints.filter(p => !rw.some(r => r.title === p.title)), 1).map(p => p.title)])]);
    rw.forEach(x => push(SECS[7], { type: "type", long: true, box, stem: x.p, answers: [x.a], info: x.title, en: x.en })); }
  for (const g of pick(DATA.gpoints.filter(p => inCh(p.ch) || p.ch === "mid"), 3)) push(SECS[8], { type: "write", stem: g.title, model: (DATA.gram.find(x => x.g === g.id) || {}).a || "", lines: 2 });
  // 대화
  const bogi = pick(DATA.idiom, 1)[0];
  for (const d of pick(DATA.idiom.filter(x => x !== bogi), 4)) push(SECS[9], { type: "write", bogi, dlgB: d.b, model: "A: " + d.modelA + "\nB: " + d.b, lines: 2 });
  for (const s of pick(DATA.speak, 2)) push(SECS[10], { type: "type", box: [s.grammar], dlgA: s.a, dlgBb: s.b, answers: s.answers, en: s.en });
  { const s = pick(DATA.simile, 1)[0]; push(SECS[11], { type: "write", box: [s.expr], model: s.model.join("\n"), info: s.meaning, lines: 4 }); }
  { const c = pick(DATA.conflict, 1)[0]; push(SECS[12], { type: "write", conflict: c, model: c.model.join("\n"), info: c.problem, lines: 6 }); }
  return Q;
}

// ---------- start screen ----------
function renderStart(){
  document.documentElement.lang = lang === "en" ? "ko" : lang;
  $("#langs").innerHTML = LANGS.map(l => `<button class="chip${l.code === lang ? " on" : ""}" data-l="${l.code}">${esc(l.short)}</button>`).join("");
  $("#tIntro").textContent = T("intro");
  $("#sTests").textContent = H.tests; $("#tTests").textContent = T("tests");
  $("#sBest").textContent = H.best == null ? "–" : H.best + "/60"; $("#tBest").textContent = T("best");
  $("#sLast").textContent = H.last == null ? "–" : H.last + "/60"; $("#tLast").textContent = T("last");
  $("#tMode").textContent = T("modeLabel"); $("#tCh").textContent = T("chLabel"); $("#tNote").textContent = T("note");
  $("#modes").innerHTML = ["practice", "exam"].map(m => `<button class="mode${mode === m ? " on" : ""}" data-m="${m}"><b>${m === "practice" ? "🎯 연습 · " : "⏱ 실전 · "}${esc(T(m))}</b><small>${esc(T(m + "Sub"))}</small></button>`).join("");
  $("#chs").innerHTML = DATA.chapters.map(c => `<button class="chip${chSel.includes(c.n) ? " on" : ""}" data-c="${c.n}">${c.n}과</button>`).join("");
  $("#go").textContent = T("start") + "  →"; $("#go").disabled = !chSel.length;
  $("#mute").textContent = muted ? "🔇" : "🔊";
}
$("#langs").onclick = e => { const b = e.target.closest("[data-l]"); if (!b) return; lang = b.dataset.l; store.set("k5b_lang", lang); renderStart(); };
$("#modes").onclick = e => { const b = e.target.closest("[data-m]"); if (!b) return; mode = b.dataset.m; store.set("k5b_exam_mode", mode); renderStart(); };
$("#chs").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; const n = +b.dataset.c; chSel = chSel.includes(n) ? chSel.filter(x => x !== n) : [...chSel, n].sort(); store.set("k5b_exam_ch", chSel); renderStart(); };
$("#mute").onclick = () => { muted = !muted; store.set("k5b_swap_mute", muted); $("#mute").textContent = muted ? "🔇" : "🔊"; };

// ---------- the test ----------
let X = null;
function startTest(){
  try { actx().resume(); } catch {}
  X = { Q: buildTest(), i: 0, mode, combo: 0, t0: Date.now(), timer: 0, ended: false };
  $("#start").classList.add("hidden"); $("#exam").classList.remove("hidden"); $("#result").classList.add("hidden"); $("#mark").classList.add("hidden");
  $("#combo").classList.toggle("hidden", mode !== "practice"); $("#timer").classList.toggle("hidden", mode !== "exam");
  if (mode === "exam") { tickTimer(); X.timer = setInterval(tickTimer, 1000); }
  show();
}
function tickTimer(){
  const left = Math.max(0, 3600 - Math.floor((Date.now() - X.t0) / 1000));
  const el = $("#timer"); el.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"); el.classList.toggle("low", left < 300);
  if (!left && !X.ended) submit();
}
function secRange(q){ const same = X.Q.filter(x => x.sec === q.sec); return { a: same[0].num, b: same[same.length - 1].num }; }
function show(){
  const q = X.Q[X.i], r = secRange(q);
  $("#progFill").style.width = (100 * X.Q.filter(x => x.ans != null).length / X.Q.length) + "%";
  let h = `<div class="sec">${esc(q.sec.title.replace("{a}", r.a).replace("{b}", r.b))}</div>`;
  if (q.box) h += `<div class="box" lang="ko">${q.box.map(esc).join("<span style='color:#bbb'>·</span>")}</div>`;
  if (q.bogi && q.sec.id === "idiom") h += `<div class="bogi" lang="ko"><b>&lt;보기&gt;</b> A: <u>${esc(q.bogi.modelA)}</u><br>B: ${esc(q.bogi.b)}</div>`;
  h += `<div class="stem" lang="ko"><span class="qn">${q.num}.</span>`;
  if (q.type === "match") h += `${esc(q.left)} ⟶ ?</div>${matchHtml(q)}`;
  else if (q.sents) h += `</div><div class="opts">${q.sents.map((s, k) => `<button class="opt${q.ans === k ? " sel" : ""}" data-o="${k}" lang="ko"><span class="n">${k + 1}</span><span>${ul(s)}</span></button>`).join("")}</div>`;
  else if (q.conflict) h += `</div><div class="bogi dlg" lang="ko">${q.conflict.lines.map(l => `<div>${esc(l)}</div>`).join("")}</div><textarea class="ans" placeholder="A: …&#10;B: …&#10;A: …&#10;B: …" lang="ko">${esc(q.ans || "")}</textarea>`;
  else if (q.sec.id === "idiom") h += `</div><div class="dlg" lang="ko"><div>A: <span class="blank" style="min-width:200px"></span></div><div>B: ${esc(q.dlgB)}</div></div><input class="ans" lang="ko" placeholder="A: …" value="${esc(q.ans || "")}">`;
  else if (q.sec.id === "speak") h += `</div><div class="dlg" lang="ko"><div>A: ${esc(q.dlgA)}</div><div>B: ${esc(q.dlgBb).replace("___", '<span class="blank"></span>')}</div></div><input class="ans" lang="ko" value="${esc(q.ans || "")}">`;
  else if (q.sec.id === "simile") h += `</div><textarea class="ans" lang="ko" placeholder="A: …&#10;B: …&#10;A: …&#10;B: …">${esc(q.ans || "")}</textarea>`;
  else if (q.type === "write") h += `${esc(q.stem)}</div><textarea class="ans" lang="ko" style="min-height:70px">${esc(q.ans || "")}</textarea>`;
  else if (q.type === "type") h += `${q.long ? ul(q.stem) : q.stem}</div><${q.long ? "textarea" : "input"} class="ans" lang="ko" ${q.long ? 'style="min-height:70px"' : ""} placeholder="${q.long ? "→" : ""}"${q.long ? ">" + esc(q.ans || "") + "</textarea>" : ` value="${esc(q.ans || "")}">`}`;
  else if (q.type === "two") h += `${esc(q.stem)}</div><div class="two">${q.options.map(o => `<button class="opt${q.ans === o ? " sel" : ""}" data-o="${esc(o)}" lang="ko">${esc(o)}</button>`).join("")}</div>`;
  else if (q.type === "mc") h += `${q.boxed ? `</div><div class="bogi" lang="ko">${esc(q.stem)}</div><div>` : ul(q.stem)}</div><div class="opts">${q.options.map((o, k) => `<button class="opt${q.ans === o ? " sel" : ""}" data-o="${esc(o)}" lang="ko"><span class="n">${k + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  h += `<div id="fbx"></div>`;
  $("#paper").innerHTML = h;
  const inp = $("#paper .ans"); if (inp) inp.oninput = () => { q.ans = inp.value; dots(); };
  $("#prev").classList.toggle("hidden", X.mode === "practice" || X.i === 0);
  setNext(); dots();
  if (q.done) feedback(q, false);
}
function matchHtml(q){
  return `<div class="match"><div class="mcol">${X.Q.filter(x => x.set === q.set).map(x => `<div class="mi${x === q ? " sel" : ""}">${esc(x.left)}${x.ans ? ` <b style="color:var(--accent)">→ ${esc(x.ans)}</b>` : ""}</div>`).join("")}</div>
    <div class="mcol">${q.right.map(r => `<button class="mi${q.ans === r ? " sel" : ""}" data-o="${esc(r)}" lang="ko">${esc(r)}</button>`).join("")}</div></div>`;
}
$("#paper").onclick = e => {
  const b = e.target.closest("[data-o]"); if (!b) return; const q = X.Q[X.i]; if (q.done) return;
  q.ans = q.sents ? +b.dataset.o : b.dataset.o;
  if (X.mode === "practice") check(q, b); else { show(); }
};
function setNext(){
  const q = X.Q[X.i], last = X.i === X.Q.length - 1;
  if (X.mode === "practice") $("#next").textContent = q.done ? (last ? T("finish") : T("next") + " →") : T("check");
  else $("#next").textContent = last ? T("submit") : T("next") + " →";
}
function dots(){
  if (X.mode !== "exam") { $("#dots").innerHTML = ""; return; }
  $("#dots").innerHTML = X.Q.map((q, k) => `<button class="dot${q.ans != null && q.ans !== "" ? " done" : ""}${k === X.i ? " cur" : ""}" data-k="${k}">${q.sec.dlg ? "대" + q.num : q.num}</button>`).join("");
}
$("#dots").onclick = e => { const b = e.target.closest("[data-k]"); if (!b) return; X.i = +b.dataset.k; show(); };
$("#prev").onclick = () => { if (X.i > 0) { X.i--; show(); } };
$("#next").onclick = () => {
  const q = X.Q[X.i];
  if (X.mode === "practice" && !q.done) return check(q, $("#next"));
  if (X.i < X.Q.length - 1) { X.i++; show(); } else if (X.mode === "practice") endTest(); else submit();
};
$("#quit").onclick = () => { clearInterval(X && X.timer); $("#exam").classList.add("hidden"); $("#start").classList.remove("hidden"); renderStart(); };

// grading: auto for choices and typed words; writing is marked by the learner against the model answer
function grade(q){
  if (q.type === "write") return null;
  if (q.type === "type") return q.answers.some(a => norm(a) === norm(q.ans || "")) ? q.pts : 0;
  return q.ans === q.answer ? q.pts : 0;
}
function check(q, el){
  if (q.ans == null || q.ans === "") { el && el.animate && el.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], { duration: 250 }); return; }
  q.done = true; q.got = grade(q); feedback(q, true); setNext();
}
function feedback(q, fresh){
  const box = $("#fbx"); if (!box) return;
  const ok = q.got === q.pts, write = q.type === "write";
  // colour the choices
  for (const b of document.querySelectorAll("#paper [data-o]")) { const v = q.sents ? +b.dataset.o : b.dataset.o;
    if (v === q.answer) b.classList.add("right"); else if (v === q.ans) b.classList.add("wrong"); }
  let h = "";
  if (write) {
    h = `<div class="fb"><div class="h">${esc(T("model"))}</div><div class="model" lang="ko">${esc(q.model)}</div>${q.info ? `<div style="margin-top:6px;color:#5b5440">${esc(q.info)}</div>` : ""}
      <div style="margin-top:8px;font-weight:700">${esc(T("selfMark"))}</div><div class="marks" data-q="${X.Q.indexOf(q)}">
      ${[[q.pts, "✔ " + T("full")], [q.pts / 2, "△ " + T("half")], [0, "✖ " + T("none")]].map(([p, l]) => `<button data-p="${p}" class="${q.got === p ? "on" : ""}">${esc(l)} (${p})</button>`).join("")}</div></div>`;
  } else {
    const right = q.type === "type" ? q.answers[0] : q.sents ? (q.answer + 1) + "번" : q.answer;
    h = `<div class="fb ${ok ? "good" : "bad"}"><div class="h">${ok ? "✔ " + esc(T("right")) + " +" + q.pts : "✖ " + esc(T("wrong"))}</div>
      ${ok ? "" : `<div>${esc(T("answer"))}: <b lang="ko">${esc(right)}</b></div>`}${q.info ? `<div lang="ko">${esc(q.info)}</div>` : ""}${q.en ? `<div style="color:#5b5440">${esc(q.en)}</div>` : ""}
      ${!ok && q.type === "type" ? `<button class="override" id="ovr">${esc(T("override"))}</button>` : ""}</div>`;
  }
  box.innerHTML = h;
  if ($("#ovr")) $("#ovr").onclick = () => { q.got = q.pts; reward(q, true, $("#ovr")); feedback(q, false); };
  const mk = box.querySelector(".marks"); if (mk) mk.onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; const prev = q.got; q.got = +b.dataset.p; if (prev == null && q.got === q.pts) reward(q, true, b); feedback(q, false); };
  if (fresh && !write) reward(q, ok, box);
}
function reward(q, ok, el){
  if (X.mode !== "practice") return;
  const r = el.getBoundingClientRect();
  if (ok) { X.combo++; sndRight(X.combo); buzz(25); burst(r.left + r.width / 2, r.top + 20, 24 + Math.min(40, X.combo * 4), 1 + Math.min(.7, X.combo * .05)); floatText(r.left + r.width / 2, r.top, "+" + q.pts); }
  else { X.combo = 0; sndWrong(); buzz([60, 40, 60]); }
  $("#combo").textContent = "🔥" + X.combo;
}

// ---------- the end: mark the writing, then the score ----------
function submit(){
  X.ended = true; clearInterval(X.timer);
  for (const q of X.Q) if (q.type !== "write") q.got = grade(q);
  const toMark = X.Q.filter(q => q.type === "write");
  $("#exam").classList.add("hidden");
  const m = $("#mark"); m.classList.remove("hidden");
  m.innerHTML = `<div class="hero"><h2>${esc(T("markTitle"))}</h2><p>${esc(T("markSub"))}</p></div>` + toMark.map((q, k) => `<div class="paper" style="margin-bottom:12px">
      <div class="sec">${esc(q.sec.title.replace("{a}", q.num).replace("{b}", q.num))}</div><div class="stem" lang="ko"><span class="qn">${q.sec.dlg ? "대화 " : ""}${q.num}.</span>${esc(q.stem || (q.box ? q.box[0] : q.dlgB || ""))}</div>
      <div style="margin-top:8px;font-weight:700">${esc(T("yours"))}</div><div class="model" style="border-color:#9a927d" lang="ko">${esc(q.ans || "—")}</div>
      <div style="margin-top:8px;font-weight:700">${esc(T("model"))}</div><div class="model" lang="ko">${esc(q.model)}</div>
      <div class="marks" data-k="${X.Q.indexOf(q)}">${[[q.pts, "✔ " + T("full")], [q.pts / 2, "△ " + T("half")], [0, "✖ " + T("none")]].map(([p, l]) => `<button data-p="${p}"${(q.ans || "").trim() ? "" : (p === 0 ? ' class="on"' : "")}>${esc(l)} (${p})</button>`).join("")}</div></div>`).join("")
    + `<button class="go" id="seeScore">${esc(T("seeScore"))}</button>`;
  for (const q of toMark) if (!(q.ans || "").trim()) q.got = 0;
  m.onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; const box = b.parentElement; X.Q[+box.dataset.k].got = +b.dataset.p; for (const x of box.children) x.classList.toggle("on", x === b); };
  $("#seeScore").onclick = () => { const left = toMark.filter(q => q.got == null).length; if (left) { alertBox(T("markAll")); return; } endTest(); };
  scrollTo(0, 0);
}
function alertBox(t){ const d = document.createElement("div"); d.className = "float"; d.style.left = "50%"; d.style.top = "40%"; d.style.color = "#ff6b7a"; d.style.fontSize = "18px"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1200); }
function endTest(){
  clearInterval(X.timer);
  for (const q of X.Q) if (q.got == null) q.got = q.type === "write" ? 0 : grade(q);
  const total = Math.round(X.Q.reduce((s, q) => s + (q.got || 0), 0) * 2) / 2;
  const part1 = X.Q.filter(q => !q.sec.dlg).reduce((s, q) => s + (q.got || 0), 0), part2 = total - part1;
  H.tests++; H.last = total; H.best = H.best == null ? total : Math.max(H.best, total); H.hist = [...H.hist, { d: new Date().toISOString().slice(0, 10), s: total, m: X.mode }].slice(-30); store.set("k5b_exam", H);
  $("#exam").classList.add("hidden"); $("#mark").classList.add("hidden");
  const res = $("#result"); res.classList.remove("hidden");
  const pct = total / 60, grade = pct >= .9 ? T("g1") : pct >= .75 ? T("g2") : pct >= .6 ? T("g3") : T("g4");
  const bySec = SECS.map(s => { const qs = X.Q.filter(q => q.sec === s); return { s, got: qs.reduce((a, q) => a + (q.got || 0), 0), max: qs.reduce((a, q) => a + q.pts, 0) }; });
  res.innerHTML = `<div class="score"><div class="big" id="bigScore">0</div><div class="of">/ 60</div></div><div class="grade">${esc(grade)}</div>
    <div class="stats"><div class="stat"><b>${part1}</b><span>어휘·문법 / 30</span></div><div class="stat"><b>${part2}</b><span>대화 / 30</span></div><div class="stat"><b>${H.best}</b><span>${esc(T("best"))}</span></div></div>
    <div class="rows">${bySec.map(r => `<div class="row"><span lang="ko">${esc(r.s.title.replace(/※ |\(.*?\)|\[\{a\}(~\{b\})?\] /g, "").slice(0, 34))}</span><b style="color:${r.got === r.max ? "var(--good)" : r.got ? "var(--gold)" : "var(--bad)"}">${r.got} / ${r.max}</b></div>`).join("")}</div>
    <button class="go" id="again">${esc(T("again"))}</button><button class="ghost" id="menu">${esc(T("menu"))}</button>`;
  // count up the score, then celebrate
  let n = 0; const tgt = total, step = Math.max(.5, tgt / 40);
  const iv = setInterval(() => { n = Math.min(tgt, n + step); $("#bigScore").textContent = Math.round(n * 2) / 2; tone(400 + n * 12, 0, .04, "triangle", .06);
    if (n >= tgt) { clearInterval(iv); if (pct >= .6) { sndFanfare(); for (let k = 0; k < (pct >= .9 ? 6 : 3); k++) setTimeout(() => burst(innerWidth * (.2 + Math.random() * .6), innerHeight * (.15 + Math.random() * .3), 70, 1.4), k * 250); buzz([40, 50, 40, 50, 80]); } } }, 35);
  $("#again").onclick = startTest; $("#menu").onclick = () => { res.classList.add("hidden"); $("#start").classList.remove("hidden"); renderStart(); };
  scrollTo(0, 0);
}
$("#go").onclick = startTest;
renderStart();
</script>
