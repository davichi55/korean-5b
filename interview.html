<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>기말인터뷰 답변 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  :root{
    --bg:#f3f5f8; --paper:#ffffff; --ink:#1b2230; --muted:#5d6778; --line:#dfe3ea;
    --accent:#2c56c9; --accent-soft:#e7edfb; --hl:rgba(255,222,89,.55); --en:#4b5567;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#11141a; --paper:#1a1f28; --ink:#e7eaf0; --muted:#9aa3b3; --line:#2c3340;
      --accent:#8eaeff; --accent-soft:#232c40; --hl:rgba(255,210,70,.24); --en:#aab3c2;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#11141a; --paper:#1a1f28; --ink:#e7eaf0; --muted:#9aa3b3; --line:#2c3340;
    --accent:#8eaeff; --accent-soft:#232c40; --hl:rgba(255,210,70,.24); --en:#aab3c2;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);padding:0 16px 48px;
    font:16px/1.6 "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
  .wrap{max-width:760px;margin:0 auto}
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
    padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
  h1{font-size:22px;font-weight:700;margin:0;text-wrap:balance}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 10px}
  .modes{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content;max-width:100%;flex-wrap:wrap}
  .modes button{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:7px;padding:7px 12px;
    background:transparent;color:var(--muted);cursor:pointer}
  .modes button[aria-pressed="true"]{background:var(--accent);color:#fff}
  :root[data-theme="dark"] .modes button[aria-pressed="true"]{color:#11141a}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .modes button[aria-pressed="true"]{color:#11141a}}
  .jump{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .jump a{font-size:13px;font-weight:700;text-decoration:none;color:var(--accent);background:var(--accent-soft);
    border-radius:6px;min-width:30px;text-align:center;padding:3px 7px;font-variant-numeric:tabular-nums}
  article{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-bottom:16px;scroll-margin-top:150px}
  .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
  .meta b{color:var(--accent);font-size:13px;letter-spacing:.04em}
  .q{font-size:17px;font-weight:700;margin:6px 0 2px;text-wrap:balance}
  .qen{color:var(--en);font-size:14px;margin:0 0 14px}
  .ko{font-weight:700;line-height:1.95;margin:0}
  .pair{margin:0 0 12px}
  .pair .k{font-weight:700;line-height:1.8}
  .pair .e{color:var(--en);font-size:14.5px;line-height:1.55;margin-top:2px}
  ol.keys{margin:0;padding-left:26px;display:grid;gap:7px}
  ol.keys li{font-weight:700;line-height:1.6}
  ol.keys li::marker{color:var(--accent);font-variant-numeric:tabular-nums}
  ol.keys li.end span.tag{background:var(--hl);border-radius:4px;padding:0 4px}
  .tag{font-size:12.5px;color:var(--muted);margin-right:4px}
  details{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
  summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14px}
  details .ko{margin-top:8px;font-size:15px}
  .tip{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
  /* 🎧 듣기 */
  .speed{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
  .speed button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:6px;padding:3px 9px;cursor:pointer}
  .speed button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  .plays{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .play{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--accent-soft);color:var(--accent)}
  .play.on{background:var(--accent);color:var(--paper)}
  .sents{list-style:none;margin:0;padding:0;display:grid;gap:4px}
  .sent{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;
    border:0;border-radius:8px;padding:7px 8px;cursor:pointer}
  .sent:hover{background:var(--accent-soft)}
  .sent.on{background:var(--hl)}
  .sent .ic{color:var(--accent);font-size:12px;line-height:1.9;flex:none;width:14px}
  .sent .k{font-weight:700;line-height:1.75;display:block}
  .sent .e{color:var(--en);font-size:13.5px;line-height:1.5;display:block}
  .sent:disabled{cursor:default;opacity:.6}
  [hidden]{display:none!important}
  @media print{header .modes,header .jump,.tip{display:none} header{position:static} article{break-inside:avoid;border-color:#ccc}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>기말인터뷰 답변 노트</h1>
    <div class="sub">질문 12개 · 11월 19일 인터뷰 시험</div>
    <div class="modes" role="group" aria-label="보기">
      <button data-m="ko">한국어</button>
      <button data-m="koen">한국어 + English</button>
      <button data-m="keys">🔑 키워드</button>
      <button data-m="listen">🎧 듣기</button>
    </div>
    <div class="speed" id="speed" hidden>속도
      <button data-r="1">1×</button><button data-r="0.85">0.85×</button><button data-r="0.7">0.7×</button></div>
    <nav class="jump" id="jump"></nav>
  </header>
  <div class="tip" id="tip" hidden>키워드를 보면서 소리 내어 대답해 보고, 끝나면 「답변 확인」을 눌러 빠뜨린 부분을 확인하세요. 시작과 끝 문장은 그대로 외워 두기!</div>
  <main id="list"></main>
</div>
<script>
const ITEMS = [{"n":1,"tag":"5A_1","q":"여러분의 인생에서 가장 중요한 사건이나 경험, 인생의 전환점에 대해서 이야기해 주십시오.","qEn":"Tell us about the most important event or experience in your life, or a turning point in your life.","keys":["시작: 가장 큰 전환점 = 작년에 한국에 온 것","2019년부터 6년 · 통신 회사 · 재택근무 → 똑같은 생활 반복 → 지루","게다가 가족 중 한 명이 아픔 → '인생을 이렇게만 살아도 될까?'","원래 좋아하던 한국 → 한국어 공부 결심","그만두는 날 · 매니저와 동료들에게 한 명씩 전화 · 눈물","시원섭섭 · 한편으로는 후련 · 새 인생 → 마음이 들떴다","끝: 처음 혼자 → 불안 → 1년 후 한국어↑ · 익숙 → 뿌듯"],"ko":["제 인생의 가장 큰 전환점은 작년에 한국에 온 것이었습니다.","저는 2019년부터 6년 동안 네덜란드의 통신 회사에서 재택근무를 했는데요, 매일 똑같은 생활이 반복되다 보니 너무 지루하게 느껴졌어요.","게다가 가족 중 한 명이 아프게 되면서 '인생을 이렇게만 살아도 될까?' 하고 진지하게 생각하게 됐습니다.","그래서 원래 좋아하던 한국에 가서 한국어를 공부하기로 결심했어요.","회사를 그만두는 날, 매니저와 동료들에게 한 명씩 전화로 인사를 했는데 눈물이 계속 났어요.","정말 시원섭섭했지만, 한편으로는 후련했고, 새로운 인생이 시작된다는 생각에 마음이 들떴습니다.","태어나서 처음으로 혼자 살아 보는 것이라서 불안하기도 했지만, 1년이 지난 지금은 한국어도 많이 늘고 혼자 사는 것에도 익숙해져서 스스로가 정말 뿌듯합니다."],"en":["The biggest turning point in my life was coming to Korea last year.","From 2019 I worked from home for six years at a telecom company in the Netherlands, but as the same routine repeated every day, it started to feel really dull.","On top of that, one of my family members became ill, and I began seriously asking myself, 'Is it okay to keep living only like this?'","So I decided to go to Korea, a country I already loved, and study Korean.","On the day I quit, I said goodbye to my manager and coworkers one by one over the phone, and the tears kept coming.","It was truly bittersweet, but on the other hand I felt relieved, and the thought of a new life beginning made my heart flutter.","It was the first time in my life living alone, so I was anxious too, but a year later my Korean has improved a lot, I've gotten used to living alone, and I'm really proud of myself."],"min":1.7,"qa":"f1e806a23886c3.mp3","ka":["ff1292f7b8f8cc.mp3","da379efb930cd7.mp3","ca88d3b7548598.mp3","063db0c885bbbf.mp3","d322d4bc01854c.mp3","77c8b176667609.mp3","65a0b3520b31f4.mp3"]},{"n":2,"tag":"5A_2","q":"서울의 명소 중 한 곳을 골라서 소개해 주십시오.","qEn":"Choose one of Seoul's famous places and introduce it.","keys":["시작: 명소로는 ~을/를 들 수 있습니다 → 광화문 · 대한민국역사박물관","현대 역사를 한눈에 · ~(으)로 유명 · 세종대왕 동상 바로 근처","나: 역사를 좋아함 → 사람들이 어떻게 행동해 왔는지","전시가 잘 되어 있을 뿐만 아니라 입장료 무료","게다가 바로 옆 경복궁 · 광화문 광장 → 하루 종일","유럽의 비싼 박물관과 비교 → 부담 없이 · 형을 제일 먼저 데려가고 싶다","끝: 이것으로 소개를 마치고자 합니다"],"ko":["제가 소개하고 싶은 서울의 명소로는 광화문에 있는 대한민국역사박물관을 들 수 있습니다.","이곳은 한국의 현대 역사를 한눈에 볼 수 있는 곳으로 유명한데요, 세종대왕 동상 바로 근처에 있어서 찾아가기도 쉽습니다.","저는 역사를 아주 좋아하는데, 역사를 보면 사람들이 어떻게 행동해 왔는지 알 수 있기 때문입니다.","이 박물관은 전시가 잘 되어 있을 뿐만 아니라 입장료도 무료입니다.","게다가 바로 옆에 경복궁과 광화문 광장이 있어서 하루 종일 구경할 수 있어요.","유럽의 비싼 박물관들과 비교하면 부담 없이 즐길 수 있는 곳이라서, 나중에 형이 한국에 오면 제일 먼저 데려가고 싶습니다.","이것으로 소개를 마치고자 합니다."],"en":["The Seoul landmark I would like to introduce is the National Museum of Korean Contemporary History in Gwanghwamun.","It is famous as a place where you can see Korea's modern history at a glance, and it is right next to the King Sejong statue, so it is easy to find.","I love history very much, because when you look at history you can see how people have behaved.","This museum is not only well curated, but admission is also free.","What's more, Gyeongbokgung Palace and Gwanghwamun Square are right next door, so you can spend a whole day looking around.","Compared with Europe's expensive museums it is a place you can enjoy without any burden, so when my older brother comes to Korea I want to take him there first.","That concludes my introduction."],"min":1.5,"qa":"981b8cf1fc784d.mp3","ka":["81ed411addf779.mp3","efa38838221c76.mp3","1b2888eb8ae332.mp3","a354470b9b376a.mp3","4afbc58b3fdbf6.mp3","feef38077fc587.mp3","76a44e2fde5b9d.mp3"]},{"n":3,"tag":"5A_4","q":"배운 사자성어 중에서 기억에 남는 표현 한 가지를 선택해서 그 의미와 쓸 수 있는 상황을 설명해 주십시오.","qEn":"Choose one four-character idiom you learned that stayed with you, and explain what it means and when you can use it.","keys":["시작: 기억에 가장 남는 사자성어 = '대기만성'","뜻: 큰 그릇은 늦게 만들어진다 → 시간이 걸려도 언젠가 성공","쓸 때: 아직 아무것도 이루지 못한 사람에게 희망을 줄 때","십 대 때부터 다 아는 건 아니잖아요 · 사람마다 성공하는 시기가 다름","인생에서 큰일을 겪고 → 인생을 다시 생각","나: 서른 넘어 회사 그만둠 → 한국 · 새로운 도전 → 와닿았다","끝: '대기만성이라는 말이 있으니까 포기하지 마세요'"],"ko":["제 기억에 가장 남는 사자성어는 '대기만성'입니다.","이 말은 큰 그릇은 늦게 만들어진다는 뜻인데요, 큰 인물이 될 사람은 시간이 걸리더라도 언젠가는 성공한다는 의미입니다.","아직 아무것도 이루지 못한 사람에게 희망을 줄 때 쓸 수 있는 표현입니다.","모든 사람이 십 대 때부터 자기가 뭘 하고 싶은지 아는 것은 아니잖아요.","사람마다 성공하는 시기가 다른 것 같습니다.","어떤 사람들은 인생에서 큰일을 겪고 나서 자기 인생을 다시 생각하게 됩니다.","저도 서른이 넘어서 회사를 그만두고 한국에 와서 새로운 도전을 시작했는데요, 그래서 이 말이 저한테 정말 와닿았습니다.","저처럼 인생을 다시 시작하는 사람들에게 '대기만성이라는 말이 있으니까 포기하지 마세요'라고 말해 주고 싶습니다."],"en":["The four-character idiom that stays with me most is 'daegimanseong'.","It means that a great vessel is completed late: a person who will become someone great will succeed one day, even if it takes time.","It is an expression you can use to give hope to someone who has not achieved anything yet.","Not everyone knows what they want to do from their teens, right?","It seems the timing of success is different for each person.","Some people go through something major in life and then rethink their whole life.","I also quit my job past thirty and came to Korea to start a new challenge, so this saying really resonated with me.","To people restarting their lives like me, I want to say: 'There is a saying, daegimanseong, so don't give up.'"],"min":1.6,"qa":"f1a92311cc70a1.mp3","ka":["ac1be4c6cb303c.mp3","f7e4dfc781655b.mp3","8a65c42b56c4f7.mp3","a1401900ed6e3d.mp3","9574c2a23acf1e.mp3","b4f78bb7a6fd8c.mp3","39142746c64888.mp3","e6c3b2d7fb583f.mp3"]},{"n":4,"tag":"5A_7","q":"성공하는 삶이나 행복한 삶을 살 수 있는 방법, 또는 행복한 삶에서 가장 중요한 것에 대해 주장해 주십시오.","qEn":"Argue for a way to live a successful or happy life, or for what matters most in a happy life.","keys":["시작: 제 생각에는 행복한 삶이란 = 건강과 자유의 균형","이유: 제 경험 → 제 경험에 비추어 볼 때","안정적인 직장이라도 좋아하지 않는 일 반복 → 지루해지기 마련","6년 다닌 회사 그만둠 → 한국 → AI 사업 준비 · 주 60시간도 안 힘듦","자유 = 좋아하는 일 하기 · 건강 = 계속하기 위한 조건","옛말에 '건강을 잃으면 모든 것을 잃는다'","끝: 한마디로 요약하면 · 좋아하는 일을 오래 할 수 있는 몸과 마음이야말로 성공한 인생"],"ko":["제 생각에는 행복한 삶이란 건강과 자유의 균형입니다.","제가 그렇게 생각하는 이유는 제 경험 때문인데요.","제 경험에 비추어 볼 때, 아무리 안정적인 직장이 있어도 좋아하지 않는 일을 반복하면 삶이 지루해지기 마련입니다.","저는 6년 동안 다니던 회사를 그만두고 한국에 왔고, 지금은 AI로 사업을 준비하고 있는데요, 좋아하는 일이라서 일주일에 60시간을 일해도 힘들지 않습니다.","자유란 자기가 좋아하는 일을 하는 것이고, 건강은 그 일을 계속하기 위해서 꼭 필요한 조건이라고 생각합니다.","옛말에 '건강을 잃으면 모든 것을 잃는다'라는 말도 있잖아요.","한마디로 요약하면, 좋아하는 일을 오래 할 수 있는 몸과 마음이야말로 성공한 인생이라고 생각합니다."],"en":["In my opinion, a happy life is a balance between health and freedom.","The reason I think so comes from my own experience.","In light of my experience, no matter how stable your job is, if you keep repeating work you don't enjoy, life is bound to become dull.","I quit the company I had worked at for six years and came to Korea, and now I am preparing an AI business; because I love the work, even sixty hours a week doesn't feel hard.","Freedom means doing the work you love, and health, I believe, is the essential condition for continuing to do it.","As the old saying goes, 'lose your health and you lose everything.'","To sum it up in one line: a body and mind that let you do what you love for a long time, that is a successful life."],"min":1.5,"qa":"06f442b07d3ec9.mp3","ka":["725594d61c2035.mp3","a3b18399d76680.mp3","0b8b55468f59d4.mp3","b636924bc4f638.mp3","be530a8d09effb.mp3","9a05e49ff6a456.mp3","a89024823dc07f.mp3"]},{"n":5,"tag":"5A_8","q":"여러분 나라의 중요한 사건 하나를 설명해 주십시오.","qEn":"Explain one important event in your country's history.","keys":["시작: 중요한 사건 = '80년 전쟁'","80년 전쟁이란 ~을 말합니다 → 스페인 지배에서 벗어나려는 독립 전쟁","1500년대 중반 · 당시 스페인 왕: 무거운 세금 · 종교의 자유 X","억압으로 인해 · 1568년 · '오라녀 공 빌럼' → 전쟁 시작","고향 마스트리흐트도 점령당함","무려 80년 · 1648년 독립 인정 → 80년 만에 자유","독립 이후 '황금시대'","한국이 일본에게서 해방된 것처럼 → 네덜란드 사람에게 '자유'는 특별","끝: 국가 = 그 지도자에 대한 노래 · 주황색 유니폼 = 그 이름에서 유래"],"ko":["제 나라의 중요한 사건으로 '80년 전쟁'을 소개하고 싶습니다.","80년 전쟁이란 네덜란드가 스페인의 지배에서 벗어나기 위해 싸운 독립 전쟁을 말합니다.","1500년대 중반에 네덜란드는 스페인의 지배를 받고 있었는데요, 당시 스페인 왕은 네덜란드 사람들에게 무거운 세금을 내게 하고 종교의 자유도 주지 않았습니다.","이러한 억압으로 인해 1568년에 '오라녀 공 빌럼'이라는 지도자가 사람들을 모아 전쟁을 시작했습니다.","제 고향인 마스트리흐트도 그때 스페인 군대에게 점령당했습니다.","이 전쟁은 무려 80년이나 계속됐고, 1648년에 스페인이 드디어 네덜란드의 독립을 인정했습니다.","80년 만에 자유를 되찾은 것입니다.","독립 이후 네덜란드는 '황금시대'라고 불리는 번영의 시대를 맞게 되었습니다.","한국이 일본에게서 해방된 것처럼 네덜란드도 스페인에게서 해방된 거지요.","그래서 네덜란드 사람들에게 '자유'는 아주 특별한 의미가 있습니다.","이 사건과 관련해 생긴 것이 또 있는데요, 네덜란드의 국가는 바로 그 지도자에 대한 노래이고, 축구 국가대표팀이 주황색 유니폼을 입는 것도 그 사람의 이름에서 유래했습니다."],"en":["As an important event in my country, I would like to introduce the 'Eighty Years' War'.","The Eighty Years' War refers to the war of independence the Netherlands fought to escape Spanish rule.","In the mid-1500s the Netherlands was under Spain's control, and at the time the Spanish king made Dutch people pay heavy taxes and did not grant freedom of religion.","Because of this oppression, in 1568 a leader called William of Orange gathered the people and started the war.","My hometown, Maastricht, was also occupied by Spanish troops back then.","The war went on for no less than eighty years, and in 1648 Spain finally recognized Dutch independence.","We won our freedom back after eighty years.","After independence the Netherlands entered an era of prosperity called the Golden Age.","Just as Korea was liberated from Japan, the Netherlands was liberated from Spain.","That is why 'freedom' has a very special meaning for Dutch people.","There is something else connected to this event: the Dutch national anthem is a song about that very leader, and the fact that our national football team wears orange also comes from his name."],"min":2.4,"qa":"90b49f6196410a.mp3","ka":["99726f0cbb053f.mp3","23f13b51ece8be.mp3","4ad6bd2d729996.mp3","9b92df4709ff34.mp3","ea4888c12294dd.mp3","3c19e55ca649bd.mp3","d3bf82e2580d53.mp3","4468ef07ac9481.mp3","3ee41102471e14.mp3","92b44741b76c55.mp3","ed5c7ad4cfd570.mp3"]},{"n":6,"tag":"5B_1","q":"여러분이 최근 봤던 영화나 드라마에 대한 평을 이야기해 주십시오.","qEn":"Give your review of a film or drama you watched recently.","keys":["시작: 최근 본 영화 = 연상호 감독의 '군체'","~을/를 다루다 → 봉쇄된 서울 · 초고층 빌딩 · 살아남으려는 사람들","줄거리: 남자 · 바이러스를 자기 몸에 주사 → 물면 명령을 따름","개미 사회에 빗대어 · 냄새로 소통 → 하나의 시스템처럼","보통 좀비 영화는 무섭기만 한 반면에 → 설정이 독특 · 인간 사회를 다시 생각","개미 콘셉트 = 인상적 · 전지현 씨 유명한 데다가 연기도 훌륭","끝: 독특한 영화를 좋아하는 분들에게 꼭 추천"],"ko":["최근에 본 영화 중에서는 연상호 감독의 '군체'가 가장 기억에 남습니다.","이 영화는 봉쇄된 서울의 한 초고층 빌딩에서 살아남으려는 사람들의 이야기를 다루고 있습니다.","줄거리를 간단히 말씀드리면, 한 남자가 바이러스를 만들어 자신의 몸에 주사하고, 그 남자가 다른 사람을 물면 그 사람들이 그의 명령을 따르게 된다는 내용입니다.","이 영화는 인간 사회를 개미 사회에 빗대어 표현하고 있는데요, 개미들이 냄새로 서로 소통하는 것처럼 물린 사람들이 하나의 시스템처럼 움직입니다.","보통 좀비 영화는 그냥 무섭기만 한 반면에, 이 영화는 설정이 정말 독특해서 인간 사회에 대해 다시 생각하게 만듭니다.","저는 이 개미 콘셉트가 아주 인상적이었습니다.","주연 배우인 전지현 씨는 아주 유명한 데다가 연기도 훌륭했습니다.","독특한 영화를 좋아하는 분들에게 꼭 추천하고 싶습니다."],"en":["Of the films I've seen recently, director Yeon Sang-ho's 'Gunche' stays with me the most.","The film is about people trying to survive in a skyscraper in a locked-down Seoul.","To briefly tell the plot: a man creates a virus and injects it into his own body, and when he bites other people, they end up following his orders.","The film likens human society to an ant colony: just as ants communicate with each other through smell, the people who were bitten move like one system.","While ordinary zombie films are just scary, this film's setting is so unique that it makes you think again about human society.","I found this ant concept very impressive.","The lead actress, Jun Ji-hyun, is very famous, and on top of that her acting was excellent.","I definitely want to recommend it to people who like unusual films."],"min":1.8,"qa":"207c15697d31cb.mp3","ka":["ea11ae3ce0a2a2.mp3","caf4a4def7b57d.mp3","d184fcdd1b31d0.mp3","4757efa79b205e.mp3","cd2db647bf135b.mp3","2becf1043a5943.mp3","d05c71bc52bf24.mp3","136f8c942d1766.mp3"]},{"n":7,"tag":"5B_2","q":"전래 동화 '해님 달님', '청개구리 이야기', '흥부와 놀부' 중 하나의 줄거리를 이야기해 주십시오.","qEn":"Tell the plot of one of the folk tales 'The Sun and the Moon', 'The Green Frog' or 'Heungbu and Nolbu'.","keys":["시작: 흥부와 놀부 이야기","옛날 옛날에 형제 · 놀부 = 부자 + 욕심 / 흥부 = 가난 + 착함","그러던 어느 날 · 다리가 부러진 제비 → 정성껏 치료","다음 해 봄 · 박씨 → 금은보화 → 흥부 부자","놀부: 일부러 다리를 부러뜨림 → 박씨 → 도깨비 → 결국 재산을 잃고 말았다","착한 흥부: 용서 · 재산을 나눔 → 사이좋게 살게 되었다","끝: 교훈 = 착하게 살면 복을 받는다 · 예능에서 여러 번 봄"],"ko":["저는 흥부와 놀부 이야기를 하고 싶습니다.","옛날 옛날에 흥부와 놀부라는 형제가 살았습니다.","형 놀부는 부자였지만 욕심이 아주 많았고, 동생 흥부는 가난했지만 마음씨가 착했습니다.","그러던 어느 날 흥부는 다리가 부러진 제비를 발견하고 정성껏 치료해 줬습니다.","다음 해 봄에 그 제비가 박씨 하나를 물어다 줬는데, 박에서 금은보화가 나와서 흥부는 부자가 되었습니다.","이 소식을 들은 놀부는 일부러 제비의 다리를 부러뜨리고 나서 치료해 줬습니다.","놀부의 제비도 박씨를 가져다줬지만, 그 박에서는 도깨비가 나와서 놀부는 결국 모든 재산을 잃고 말았습니다.","하지만 착한 흥부는 형을 용서하고 재산을 나눠 줬고, 두 형제는 사이좋게 살게 되었습니다.","이 이야기는 착하게 살면 복을 받는다는 교훈을 줍니다.","한국 예능 프로그램에도 자주 나와서 저도 여러 번 봤습니다."],"en":["I would like to tell the story of Heungbu and Nolbu.","Once upon a time there lived two brothers named Heungbu and Nolbu.","The older brother Nolbu was rich but very greedy, while the younger brother Heungbu was poor but kind-hearted.","Then one day, Heungbu found a swallow with a broken leg and treated it with devoted care.","The next spring that swallow brought him a gourd seed, and gold and treasure came out of the gourds, so Heungbu became rich.","Hearing this news, Nolbu deliberately broke a swallow's leg and then treated it.","Nolbu's swallow also brought a gourd seed, but goblins came out of those gourds, and in the end Nolbu lost his entire fortune.","But kind Heungbu forgave his brother and shared his wealth, and the two brothers came to live in harmony.","This story teaches the lesson that if you live kindly, good fortune comes to you.","It appears often on Korean variety shows, so I have seen it many times too."],"min":1.8,"qa":"ebb9c9099ea6e6.mp3","ka":["b3a5da82bbe8aa.mp3","fea7d375fefa06.mp3","dfa6be23ee6917.mp3","f2c790b4a8fd17.mp3","26a31239be33f8.mp3","cef51273358965.mp3","bf54a17f5b57e8.mp3","46e4d715d49787.mp3","0c5188449f6929.mp3","b13f6190fd27a8.mp3"]},{"n":8,"tag":"5B_3","q":"머리가 좋아지는 방법에 대해 이야기해 주십시오.","qEn":"Talk about ways to become smarter.","keys":["시작: 머리가 좋아지려면 두 가지가 중요","첫째, 꾸준히 운동하는 것이 좋다","네덜란드: 주 3번 헬스장 · 일요일 시골길 1시간 → 스트레스↓ 머리 맑음 → 효율↑","둘째, 새로운 것에 계속 도전하는 것이 좋다","뇌도 익숙한 일만 반복 → 자극이 부족해지기 마련","한국어뿐만 아니라 노래 수업 → 머리가 젊어지는 느낌","끝: 한마디로 · 몸을 움직이고 뇌에 새로운 자극"],"ko":["저는 머리가 좋아지려면 두 가지가 중요하다고 생각합니다.","첫째, 꾸준히 운동을 하는 것이 좋습니다.","저는 네덜란드에 있을 때 일주일에 세 번 헬스장에 가고, 일요일마다 시골길을 한 시간씩 달렸는데요, 운동을 하면 스트레스가 풀리고 머리가 맑아져서 공부나 일의 효율이 훨씬 높아집니다.","둘째, 새로운 것에 계속 도전하는 것이 좋습니다.","뇌도 익숙한 일만 반복하면 자극이 부족해지기 마련이잖아요.","저는 한국에 와서 한국어뿐만 아니라 노래 수업도 받았는데, 새로운 것을 배울 때마다 머리가 젊어지는 느낌이 듭니다.","한마디로, 머리가 좋아지려면 몸을 움직이고 뇌에 새로운 자극을 주는 것이 제일 중요하다고 생각합니다."],"en":["I think two things matter if you want to become smarter.","First, it is good to exercise consistently.","When I was in the Netherlands I went to the gym three times a week and ran along country roads for an hour every Sunday; exercise relieves stress and clears the head, so studying and working become far more efficient.","Second, it is good to keep challenging yourself with new things.","Even the brain is bound to lack stimulation if it only repeats familiar tasks, right?","Since coming to Korea I have taken not only Korean classes but also singing lessons, and every time I learn something new my mind feels younger.","In a word, to become smarter, I think the most important thing is to move your body and give your brain new stimulation."],"min":1.5,"qa":"00bd9b47ed8629.mp3","ka":["04ea133a3ba54d.mp3","9ceb95cdda51d4.mp3","7c71a9eb7f8b4c.mp3","95cf9a7cdacef7.mp3","6897a33e584773.mp3","1a1192056de83f.mp3","cf7dd63f860e9f.mp3"]},{"n":9,"tag":"5B_4","q":"한국인들이 가진 '정'의 특징에 대해 이야기해 주십시오.","qEn":"Talk about the characteristics of the 'jeong' that Koreans have.","keys":["시작: 한국 사람들은 정말 정이 많다고 느낌","정이란 = 말로 표현하지 않아도 마음을 나누고 가까워지는 것","예를 들어 · 대방 · 매일 가던 식당 · 사장님 = 아버지 나이","한국어가 늘수록 대화↑ → 가족처럼 챙겨 주심","옆 편의점: 유통기한 얼마 안 남은 음식 공짜 · 가난한 유학생이라고?","매일 보다 보니까 정이 든 거지요","개인주의적인 네덜란드와 달리 → 모르는 사람과도 음식을 나눔","끝: 한국의 이런 정 문화가 정말 좋다"],"ko":["한국에 살면서 한국 사람들은 정말 정이 많다고 느꼈습니다.","제 생각에 '정'이란 말로 표현하지 않아도 서로 마음을 나누고 가까워지는 것입니다.","예를 들어, 제가 대방에 살 때 매일 가던 식당이 있었는데, 사장님이 저희 아버지와 비슷한 나이의 아저씨였어요.","제 한국어가 늘수록 대화도 많아졌고, 나중에는 가족처럼 저를 챙겨 주셨습니다.","그리고 그 옆 편의점에서 일하시는 분은 유통기한이 얼마 남지 않은 음식을 항상 공짜로 주셨어요.","아마 제가 가난한 유학생이라고 생각하셨나 봐요.","매일 보다 보니까 서로 정이 든 거지요.","개인주의적인 성향이 강한 네덜란드와 달리, 한국에서는 이렇게 모르는 사람과도 음식을 나누면서 가까워지는 문화가 있습니다.","저는 한국의 이런 정 문화가 정말 좋습니다."],"en":["Living in Korea, I have felt that Korean people really have a lot of jeong.","In my view, jeong means sharing your feelings and growing close without putting it into words.","For example, when I lived in Daebang there was a restaurant I went to every day, and the owner was a man about my father's age.","As my Korean improved our conversations grew, and later he looked after me like family.","And the person working at the convenience store next door always gave me food close to its expiration date for free.","He probably thought I was a poor international student.","Seeing each other every day, we naturally grew fond of one another.","Unlike the Netherlands, where individualistic tendencies are strong, Korea has this culture of growing close even to strangers by sharing food.","I really love this jeong culture of Korea."],"min":1.6,"qa":"140694bca5d112.mp3","ka":["586bf571f30021.mp3","e6ba9a7179bc00.mp3","94303169e7974c.mp3","6944f90be707ab.mp3","afdc918091323a.mp3","73c9c48a718c1a.mp3","41667798eea28d.mp3","0c6482a7704f24.mp3","b3bafdc685c244.mp3"]},{"n":10,"tag":"5B_5","q":"자신의 성격과 생활 방식에 대해 이야기해 주십시오.","qEn":"Talk about your personality and your lifestyle.","keys":["시작: MBTI INFJ → 내향적인 편 · 사람 만나는 것 자체는 좋아함","차분하고 이성적인 편 · 감정적으로 반응하기보다는 논리적으로","목표를 정하면 꾸준히 하는 편 → 네덜란드 주말은 항상 똑같음","토요일: 아침 헬스장 · 저녁 형과 게임 / 일요일: 달리기 + 풍경 사진","한국: 친구 만나는 날 하루 종일 밖 → 녹초 · 시간을 허비한 느낌","반대로 방에서 음악 · 게임 → 에너지 재충전","평일은 규칙적: 지하철역까지 걸어감 → 서강대 4시간 → 오후 AI 사업","끝: 좋아하는 일을 할 때는 시간 가는 줄 모르는 성격이거든요"],"ko":["제 MBTI는 INFJ라서 내향적인 편이지만, 사람 만나는 것 자체는 좋아합니다.","성격은 차분하고 이성적인 편입니다.","힘든 일이 있어도 감정적으로 반응하기보다는 논리적으로 생각하려고 합니다.","그리고 한번 목표를 정하면 꾸준히 하는 편인데요, 네덜란드에 있을 때는 주말이 항상 똑같았습니다.","토요일 아침에는 헬스장에 가고 저녁에는 형과 게임을 했고, 일요일마다 밖에서 달리면서 풍경 사진을 찍었습니다.","한국에서는 친구들을 만나는 날에는 하루 종일 밖에서 시간을 보내기 일쑤인데, 그런 날은 녹초가 되어서 시간을 허비했다는 느낌이 듭니다.","반대로 방에서 음악을 듣거나 게임을 하면 에너지가 재충전됩니다.","평일은 아주 규칙적입니다.","아침에 지하철역까지 걸어가서 서강대에서 네 시간 수업을 듣고, 오후에는 AI 사업을 준비합니다.","좋아하는 일을 할 때는 시간 가는 줄 모르는 성격이거든요."],"en":["My MBTI is INFJ, so I'm on the introverted side, but I do like meeting people.","My personality is on the calm and rational side.","Even when something hard happens, I try to think logically rather than react emotionally.","And once I set a goal I tend to stick with it; when I was in the Netherlands, my weekends were always the same.","On Saturday mornings I went to the gym and in the evening I played games with my brother, and every Sunday I ran outside and took landscape photos.","In Korea, on days I meet friends I often end up spending the whole day outside, and on those days I'm exhausted and feel like I've wasted my time.","On the other hand, listening to music or gaming in my room recharges my energy.","My weekdays are very regular.","In the morning I walk to the subway station, take four hours of classes at Sogang, and in the afternoon I work on my AI business.","That's because I'm the kind of person who loses track of time when I'm doing something I love."],"min":1.9,"qa":"50e6cdfe6d92f9.mp3","ka":["2f0693e6c445c8.mp3","647adf45c272e2.mp3","6a1385f156520f.mp3","6a8754063ccd1f.mp3","dbdaea1b187479.mp3","05490dcb0f6993.mp3","d395434f9ee534.mp3","c4695a84012654.mp3","5dd73278e02329.mp3","8bd89e13c80b03.mp3"]},{"n":11,"tag":"5B_6","q":"이번 학기에 토론한 주제, 사형제도, 길거리 흡연, 조기유학, 성형수술 중 하나에 대한 자신의 의견을 말씀해 주십시오.","qEn":"Give your opinion on one topic debated this semester: the death penalty, smoking on the street, studying abroad young, or plastic surgery.","keys":["시작: 토론 주제 = 사형제도 · 저는 반대하는 입장","물론 흉악한 범죄자에게 강한 벌 → 그 의견도 일리가 있다","하지만 제 생각에는 → 사형은 문제를 해결하지 못한다","사형 → 반성 · 변화 · 사회에 기여할 기회를 영원히 잃음","게다가 판결이 잘못됐을 경우 → 되돌릴 수 없으므로 무고한 사람이 죽을 수도","인간의 존엄성을 해치는 데다가 범죄 예방 효과도 불확실","끝: 그러므로 사형 대신 반성하고 변화할 기회를 주는 것이 옳다"],"ko":["저희 반에서는 사형제도에 대해 토론을 했는데, 저는 사형제도에 반대하는 입장이었습니다.","물론 흉악한 범죄자에게 강한 벌을 줘야 한다는 의견도 일리가 있습니다.","하지만 제 생각에는 사형은 문제를 해결하지 못합니다.","사형을 집행하면 그 사람은 자신의 잘못을 반성하고 더 나은 사람으로 변화하여 다시 사회에 기여할 기회를 영원히 잃게 됩니다.","게다가 만약 판결이 잘못됐을 경우, 사형은 되돌릴 수 없으므로 무고한 사람이 죽을 수도 있습니다.","사형제도는 인간의 존엄성을 해치는 데다가 범죄 예방 효과도 확실하지 않다는 의견이 있습니다.","그러므로 저는 사형 대신에 범죄자가 반성하고 변화할 수 있는 기회를 주는 것이 옳다고 생각합니다."],"en":["In our class we debated the death penalty, and I was on the side opposing it.","Of course, the opinion that heinous criminals deserve severe punishment also has a point.","But in my opinion, the death penalty does not solve the problem.","If an execution is carried out, that person forever loses the chance to reflect on their wrongdoing, change into a better person, and contribute to society again.","Moreover, if the verdict turns out to be wrong, an execution cannot be undone, so an innocent person could die.","There are also opinions that the death penalty harms human dignity and that its crime-prevention effect is not certain.","Therefore I believe it is right to give criminals the chance to reflect and change, instead of executing them."],"min":1.5,"qa":"a2c6b0c8c56f70.mp3","ka":["7072fcb5f630fc.mp3","b6b85e90471763.mp3","00e3281b4cdfa8.mp3","5c0bd02cf0948c.mp3","8e4b50a662dde1.mp3","c27d852ad6ccd1.mp3","942d23282e3334.mp3"]},{"n":12,"tag":"5B_7","q":"여러분 나라의 호칭이나 몸짓언어를 한국의 호칭, 몸짓언어와 비교해 주십시오.","qEn":"Compare forms of address or body language in your country with Korean forms of address and body language.","keys":["시작: 네덜란드의 호칭 체계 = 한국에 비해 아주 간단","회사: 매니저와 직원이 서로 이름 · 나이와 상관없이","반면에 한국: 직함이나 가족 호칭을 정확하게","전 여자친구 가족 여행 · '형부' 따라 부름 → 알고 보니 여자만 → '형님'","깨달음: 이름을 모르면 부르는 것조차 어렵다","몸짓언어: 네덜란드 = 악수 · 반면에 한국 = 고개를 숙여 인사","끝: 네덜란드와 달리 · 호칭과 몸짓에 상대방에 대한 존중이 담겨 있다"],"ko":["네덜란드의 호칭 체계는 한국에 비해 아주 간단합니다.","네덜란드에서는 회사에서 매니저와 직원이 서로 이름을 부릅니다.","나이와 상관없이 누구나 이름으로 부를 수 있어요.","반면에 한국에서는 직함이나 가족 호칭을 정확하게 써야 하잖아요.","저는 얼마 전에 전 여자친구의 가족 여행에 같이 갔는데, 전 여자친구가 언니의 남편을 '형부'라고 부르는 것을 듣고 저도 따라서 '형부'라고 불렀습니다.","그런데 알고 보니 그건 여자만 사용하는 호칭이고, 저는 '형님'이라고 불러야 한다고 하더라고요.","그때 한국에서는 상대방의 이름을 모르면 부르는 것조차 어렵다는 것을 깨달았습니다.","몸짓언어도 다릅니다.","네덜란드에서는 인사할 때 악수를 많이 하는 반면에, 한국에서는 고개를 숙여서 인사하는 것이 일반적입니다.","이렇게 네덜란드와 달리 한국의 호칭과 몸짓에는 상대방에 대한 존중이 담겨 있는 것 같습니다."],"en":["The Dutch system of address is very simple compared with Korea's.","In the Netherlands, managers and employees at a company call each other by name.","Regardless of age, anyone can be called by their name.","In Korea, on the other hand, you have to use job titles or family terms precisely.","Not long ago I went on my ex-girlfriend's family trip, and hearing her call her older sister's husband 'hyeongbu', I copied her and called him 'hyeongbu' too.","But it turned out that is a term only women use, and I should call him 'hyeongnim'.","That was when I realized that in Korea, if you don't know someone's name, even addressing them is hard.","Body language is different too.","In the Netherlands we often shake hands when greeting, whereas in Korea it is normal to bow your head.","In this way, unlike the Netherlands, Korean forms of address and gestures seem to carry respect for the other person."],"min":1.9,"qa":"c314bb0d153a6c.mp3","ka":["dad123ef15ee58.mp3","b7cb0f56eaa0c4.mp3","84484d2b15109e.mp3","2b19934a4d18c2.mp3","c2c1c40ec2c117.mp3","4a7041d9c4af98.mp3","59a404bc602e74.mp3","1cdd562b05629b.mp3","4282e60971e647.mp3","d38458339c60bd.mp3"]}];
const AUDIO = "audio/interview/";   // folder of the recorded clips (Seed voice "Pinky", made by build_coach_audio.js)
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MODES = ["ko","koen","keys","listen"];
let mode = "keys";
try { const v = localStorage.getItem("k5b_book_mode"); if (MODES.includes(v)) mode = v; } catch (e) {}
const h = location.hash.slice(1); if (MODES.includes(h)) mode = h;

document.getElementById("jump").innerHTML = ITEMS.map(it => `<a href="#q${it.n}">${it.n}</a>`).join("");

function keyLine(k, i, last) {
  const m = k.match(/^(시작|끝):\s*(.*)$/);
  if (m) return `<li class="end"><span class="tag">${m[1]}</span>${esc(m[2])}</li>`;
  return `<li>${esc(k)}</li>`;
}
function body(it) {
  if (mode === "ko") return `<p class="ko">${esc(it.ko.join(" "))}</p>`;
  if (mode === "listen") return `<div class="plays">
      <button class="play" data-q="${it.n}" ${it.qa ? "" : "disabled"}>▶ 질문</button>
      <button class="play" data-all="${it.n}">▶ 답변 전체</button></div>
    <ol class="sents">${it.ko.map((s, i) => `<li><button class="sent" data-n="${it.n}" data-i="${i}" ${it.ka[i] ? "" : "disabled"}>
      <span class="ic">▶</span><span><span class="k">${esc(s)}</span><span class="e">${esc(it.en[i] || "")}</span></span></button></li>`).join("")}</ol>`;
  if (mode === "koen") return it.ko.map((s, i) => `<div class="pair"><div class="k">${esc(s)}</div><div class="e">${esc(it.en[i] || "")}</div></div>`).join("");
  return `<ol class="keys">${it.keys.map(keyLine).join("")}</ol>
    <details><summary>답변 확인</summary><p class="ko">${esc(it.ko.join(" "))}</p></details>`;
}
function render() {
  document.getElementById("list").innerHTML = ITEMS.map(it => `
    <article id="q${it.n}">
      <div class="meta"><b>질문 ${it.n}</b><span>${it.tag}</span><span>말하기 약 ${it.min}분</span></div>
      <div class="q">${esc(it.q)}</div>
      <div class="qen">${esc(it.qEn)}</div>
      ${body(it)}
    </article>`).join("");
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === mode));
  document.getElementById("tip").hidden = mode !== "keys";
  document.getElementById("speed").hidden = mode !== "listen";
}

// ---------- 🎧 player: one clip at a time; "답변 전체" plays the sentences in order ----------
const player = new Audio();
let rate = 1, queue = [], playing = null;   // playing = {n, kind:"q"|"all"|"one", i}
try { const r = parseFloat(localStorage.getItem("k5b_book_rate")); if ([1, 0.85, 0.7].includes(r)) rate = r; } catch (e) {}
function mark() {
  document.querySelectorAll(".sent.on,.play.on").forEach(e => e.classList.remove("on"));
  document.querySelectorAll(".play[data-all]").forEach(b => b.textContent = "▶ 답변 전체");
  if (!playing) return;
  if (playing.kind === "q") document.querySelector(`.play[data-q="${playing.n}"]`)?.classList.add("on");
  if (playing.kind === "all") { const b = document.querySelector(`.play[data-all="${playing.n}"]`); if (b) { b.classList.add("on"); b.textContent = "⏹ 멈추기"; } }
  if (playing.i != null) document.querySelector(`.sent[data-n="${playing.n}"][data-i="${playing.i}"]`)?.classList.add("on");
}
function stop() { player.pause(); queue = []; playing = null; mark(); }
function next() {
  const step = queue.shift();
  if (!step) { playing = null; mark(); return; }
  playing = step; mark();
  player.src = AUDIO + step.file; player.playbackRate = rate;
  player.play().catch(() => stop());
}
player.onended = next;
player.onerror = () => next();
function start(steps) { player.pause(); queue = steps.filter(s => s.file); next(); }
document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const it = ITEMS[(+(b.dataset.q || b.dataset.all || b.dataset.n)) - 1]; if (!it) return;
  if (b.dataset.all) {
    if (playing && playing.kind === "all" && playing.n === it.n) return stop();
    start(it.ka.map((file, i) => ({ n: it.n, kind: "all", i, file })));
  } else if (b.dataset.q) start([{ n: it.n, kind: "q", file: it.qa }]);
  else start([{ n: it.n, kind: "one", i: +b.dataset.i, file: it.ka[+b.dataset.i] }]);
});
document.querySelectorAll(".speed button").forEach(b => {
  b.setAttribute("aria-pressed", +b.dataset.r === rate);
  b.onclick = () => {
    rate = +b.dataset.r; player.playbackRate = rate;
    try { localStorage.setItem("k5b_book_rate", rate); } catch (e) {}
    document.querySelectorAll(".speed button").forEach(x => x.setAttribute("aria-pressed", +x.dataset.r === rate));
  };
});

document.querySelectorAll(".modes button").forEach(b => b.onclick = () => {
  stop();
  mode = b.dataset.m;
  try { localStorage.setItem("k5b_book_mode", mode); } catch (e) {}
  render();
});
render();
</script>
</body>
</html>
