<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>쓰기 시험 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  :root{
    --bg:#f4f5f2; --paper:#ffffff; --ink:#1d2420; --muted:#5f6a63; --line:#dde2dc;
    --accent:#1f7a55; --accent-soft:#e3f1ea; --hl:rgba(255,222,89,.6); --en:#4f5a54; --a:#b8562f; --b:#2c56c9;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#111613; --paper:#1a211d; --ink:#e6ece8; --muted:#9aa69f; --line:#2b342f;
      --accent:#6fd1a4; --accent-soft:#1f2e27; --hl:rgba(255,210,70,.26); --en:#aab5ae; --a:#f0a07e; --b:#8eaeff;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111613; --paper:#1a211d; --ink:#e6ece8; --muted:#9aa69f; --line:#2b342f;
    --accent:#6fd1a4; --accent-soft:#1f2e27; --hl:rgba(255,210,70,.26); --en:#aab5ae; --a:#f0a07e; --b:#8eaeff;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);padding:0 16px 48px;
    font:16px/1.6 "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
  .wrap{max-width:760px;margin:0 auto}
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
  h1{font-size:22px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 10px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .modes{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px}
  .modes button{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:7px;padding:7px 12px;background:transparent;color:var(--muted);cursor:pointer}
  .modes button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
  .jump{display:flex;gap:6px;flex-wrap:wrap}
  .jump a{font-size:13px;font-weight:700;text-decoration:none;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:4px 9px}
  section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;scroll-margin-top:130px}
  .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:12.5px;color:var(--muted)}
  .meta b{color:var(--accent);font-size:13px;letter-spacing:.04em}
  h2{font-size:19px;margin:4px 0 0;text-wrap:balance}
  .s2{color:var(--muted);font-size:14px;margin:0 0 12px}
  .gram{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
  .gram li{font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 8px}
  .chart{display:grid;gap:6px;margin:0 0 16px;padding:12px;border:1px dashed var(--line);border-radius:10px}
  .row{display:grid;grid-template-columns:76px 1fr 92px;gap:8px;align-items:center;font-size:13.5px}
  .row .track{background:var(--accent-soft);border-radius:4px;height:14px;overflow:hidden}
  .row .fill{background:var(--accent);height:100%}
  .row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .chart .src{font-size:12px;color:var(--muted);margin-top:2px}
  .p{margin:0 0 14px}
  .p .k{font-weight:700;line-height:1.95}
  .p .e{color:var(--en);font-size:14.5px;line-height:1.6;margin-top:4px}
  .turn{display:grid;grid-template-columns:26px 1fr;gap:6px;margin:0 0 10px}
  .turn .who{font-weight:800;font-size:15px;line-height:1.9}
  .turn .who.A{color:var(--a)} .turn .who.B{color:var(--b)}
  .turn .k{font-weight:700;line-height:1.8}
  .turn .e{color:var(--en);font-size:14px;line-height:1.55}
  mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
  .count{font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}
  @media print{header .bar{display:none}header{position:static}section{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>쓰기 시험 노트</h1>
    <div class="sub">11월 17일 쓰기 시험 · 4과 설문 조사 · 5과 생활 방식 · 6과 토론</div>
    <div class="bar">
      <div class="modes" role="group" aria-label="보기">
        <button data-m="ko">한국어</button><button data-m="koen">한국어 + English</button>
      </div>
      <nav class="jump" id="jump"></nav>
    </div>
  </header>
  <main id="list"></main>
</div>
<script>
const PIECES = [{"id":"s4","ch":"4과","title":"설문 조사 결과","sub":"가장 많이 사용하는 AI — 서강대학교 학생 23명","survey":[["챗지피티",20],["제미나이",2],["클로드",1],["딥시크",0],["사용 안 함",0]],"grammar":["-을/를 대상으로 -에 대해 설문조사를 실시하였다","이 주제를 선택한 이유는 -기 때문이다","-기 전에는 -을 것으로 예상했는데","실제 결과도 예상과 비슷했다","결과는 다음과 같다","먼저 -이/가 -%로 가장 많았다","그 다음으로는 -의 순이었다","그 밖에 -다는 응답","흥미로운 점은 -다는 것이다","이러한 결과를 통해 -다는 것을 알 수 있었다"],"marks":["을 대상으로","에 대해 설문조사를 실시하였다","이 주제를 선택한 이유는","싶었기 때문이다","하기 전에는","것으로 예상했는데","실제 결과도 예상과 비슷했다","결과는 다음과 같다","먼저","로 가장 많았다","그 다음으로는","의 순이었다","그 밖에","흥미로운 점은","없었다는 것이다","이러한 결과를 통해","다는 것을 알 수 있었다","다는 것을 알 수 있다"],"ko":["나는 2026년에 서강대학교 학생 23명(남자 4명, 여자 19명)을 대상으로 가장 많이 사용하는 AI에 대해 설문조사를 실시하였다. 이 주제를 선택한 이유는 요즘 학생들이 어떤 AI를 가장 많이 사용하는지 알아보고 싶었기 때문이다. 설문조사를 하기 전에는 챗지피티가 가장 많을 것으로 예상했는데 실제 결과도 예상과 비슷했다. 설문조사 결과는 다음과 같다.","먼저 챗지피티가 87.0%(20명)로 가장 많았다. 그 다음으로는 제미나이가 8.7%(2명), 클로드가 4.3%(1명)의 순이었다. 그 밖에 딥시크를 사용한다는 응답은 한 명도 없었다. 흥미로운 점은 AI를 사용하지 않는다는 학생이 한 명도 없었다는 것이다.","이러한 결과를 통해 대부분의 학생이 챗지피티를 사용한다는 것을 알 수 있었다. 챗지피티를 이렇게 많이 쓰는 이유는 다른 AI보다 먼저 널리 알려졌고, 무료로 쉽게 쓸 수 있기 때문이라고 생각한다. 또한 모든 학생이 AI를 사용한다는 점에서 AI가 이제 학생들의 공부와 생활에 꼭 필요한 도구가 되었다는 것을 알 수 있다."],"en":["In 2026 I conducted a survey of 23 Sogang University students (4 men, 19 women) about which AI they use the most. The reason I chose this topic is that I wanted to find out which AI students use the most these days. Before the survey I expected ChatGPT to come out on top, and the actual result was similar to my expectation. The results of the survey are as follows.","First, ChatGPT was the most common answer at 87.0% (20 people). Next came Gemini at 8.7% (2 people) and Claude at 4.3% (1 person), in that order. Besides that, nobody answered that they use DeepSeek. An interesting point is that there was not a single student who does not use AI.","Through these results I could see that most students use ChatGPT. I think the reason ChatGPT is used this much is that it became widely known earlier than other AIs and can be used easily for free. Also, the fact that every student uses AI shows that AI has now become an essential tool in students' studies and daily lives."],"chars":524},{"id":"s5","ch":"5과","title":"주말을 보내는 방식","sub":"과제 5 · 나의 생활 방식","grammar":["-기란 쉽지 않다","-기 일쑤이다","-(이)란 -는 것이다","녹초가 되다 · 허비하다 · 재충전하다 · 나름대로 · 이상적"],"marks":["이상적인 주말이란","보내는 것이다","보내기란 쉽지 않다","돌아오기 일쑤이다","녹초가 되어","허비했다","재충전된","나름대로"],"ko":["나는 MBTI가 INFJ라서 내향적인 편이다. 그래서 시간이 있을 때는 보통 방에서 혼자 AI 프로젝트를 하거나 게임을 하거나 음악을 듣는다. 한국에 온 후에는 노래 수업을 듣기 시작해서 코인노래방에도 자주 간다. 나에게 이상적인 주말이란 집에서 게임을 하거나 음악을 듣거나 친구들과 온라인으로 게임을 하면서 편하게 보내는 것이다.","네덜란드에 있을 때 내 주말은 항상 똑같았다. 토요일 아침에는 헬스장에 가고, 오후에는 형이 집에 올 때까지 혼자 게임을 했다. 그리고 저녁에는 형과 같이 게임을 했다. 일요일에는 매주 밖에서 달리기를 하고, 걸으면서 풍경 사진을 찍거나 인생에 대해 생각했다. 그런데 한국에서는 친구들과 밖에 나가야 하는 주말도 있어서 네덜란드에서처럼 주말을 보내기란 쉽지 않다. 친구들을 만나는 날에는 하루 종일 밖에서 시간을 보내고 녹초가 되어 늦게 집에 돌아오기 일쑤이다.","이렇게 친구들과 너무 많은 시간을 보내면 시간을 허비했다는 느낌이 든다. 반대로 방에서 자고, 음악을 듣고, 게임을 하면서 주말을 보내면 에너지가 재충전된 것 같다. 그래서 앞으로는 네덜란드에 있을 때처럼 나름대로 주말을 보내고 싶다. 하지만 매번 같은 주말만 보내지 않도록 한 달에 적어도 한 번은 친구들과 시간을 보내려고 한다."],"en":["My MBTI is INFJ, so I am the introverted type. That's why, when I have time, I usually stay alone in my room working on AI projects, playing games or listening to music. Since coming to Korea I started taking singing lessons, so I also often go to the coin karaoke. For me, the ideal weekend is spending it comfortably at home, gaming, listening to music or playing games online with my friends.","When I was in the Netherlands, my weekends were always the same. On Saturday morning I went to the gym, and in the afternoon I played games alone until my older brother came home. Then in the evening I played games together with my brother. Every Sunday I went running outside, and while walking I took photos of the landscape or thought about life. But in Korea there are also weekends when I have to go out with friends, so spending my weekends the way I did in the Netherlands is not easy. On days when I meet friends, I often end up spending the whole day outside and coming home late, completely exhausted.","When I spend this much time with friends, I feel like I wasted my time. On the other hand, when I spend the weekend sleeping, listening to music and gaming in my room, I feel like my energy has been recharged. So from now on I want to spend my weekends in my own way, like when I was in the Netherlands. But so that I don't spend every weekend the same way, I plan to spend time with my friends at least once a month."],"chars":630},{"id":"s6","ch":"6과","title":"토론 — 사형 제도","sub":"A 찬성 · B 반대 (대화 형식) · 짧은 시험 버전 8줄","grammar":["-다고 봅니다","-에 따르면 / -에 의하면 -다고 합니다","-(으)므로","-는 데다가","만약 -(으)ㄹ 경우 -게 됩니다","-ㄴ다든지 -ㄴ다든지 하다","그렇긴 하지만","-다고 칩시다","그 점은 저도 인정합니다","일리는 있습니다"],"marks":["다고 봅니다","에 따르면","에 의하면","다고 합니다","되므로","살려야 하므로","막는 데다가","만약","집행할 경우","없게 됩니다","도입한다든지","없앤다든지 하는","그렇긴 하지만","찬성한다고 칩시다","그 점은 저도 인정합니다","일리는 있습니다"],"ko":["A: 저는 사형에 찬성합니다. 사형은 재범을 막는 데다가 다른 사람들에게 경고가 되므로 효과가 있다고 봅니다.","B: 저는 반대합니다. 연구에 따르면 사형이 있는 나라와 없는 나라의 범죄율은 비슷하다고 합니다.","A: 그래도 조사에 의하면 국민의 절반 이상이 사형에 찬성한다고 합니다.","B: 절반 이상이 찬성한다고 칩시다. 만약 잘못된 판결로 사형을 집행할 경우 되돌릴 수 없게 됩니다.","A: 그 점은 저도 인정합니다. 그렇다면 사형 대신 어떤 형벌을 주어야 합니까?","B: 종신형을 도입한다든지 특별 사면을 없앤다든지 하는 방법이 있습니다.","A: 그렇긴 하지만 종신형은 세금으로 범죄자를 평생 먹여 살려야 하므로 부담이 큽니다.","B: 일리는 있습니다. 하지만 중요한 것은 범죄를 예방하고 피해자를 보호하는 것입니다."],"en":["A: I support the death penalty. I think it works, because it stops repeat crimes and, on top of that, warns others.","B: I'm against it. According to research, crime rates are similar in countries with and without the death penalty.","A: Still, according to a survey, more than half of the citizens support the death penalty.","B: Let's say more than half support it. If someone is executed after a wrong verdict, it can't be undone.","A: I admit that point. Then what punishment should we give instead?","B: There are ways like introducing life imprisonment or abolishing special pardons.","A: That's true, but life imprisonment means feeding criminals for life with taxes, so the burden is big.","B: That makes sense. But what matters is preventing crime and protecting victims."],"chars":395}];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let mode = "ko";
try { const v = localStorage.getItem("k5b_writing_mode"); if (v === "ko" || v === "koen") mode = v; } catch (e) {}
document.getElementById("jump").innerHTML = PIECES.map(p => `<a href="#${p.id}">${p.ch}</a>`).join("");

function hl(text, marks) {   // highlight the target grammar (longest first, no overlaps)
  let h = esc(text);
  for (const m of [...marks].sort((a, b) => b.length - a.length)) {
    const e = esc(m);
    h = h.split(/(<mark>.*?<\/mark>)/).map(part => part.startsWith("<mark>") ? part : part.split(e).join(`<mark>${e}</mark>`)).join("");
  }
  return h;
}
function chart(p) {
  const total = p.survey.reduce((a, r) => a + r[1], 0);
  return `<div class="chart">${p.survey.map(([name, n]) => {
    const pct = (n / total * 100).toFixed(1);
    return `<div class="row"><span>${esc(name)}</span><span class="track"><span class="fill" style="display:block;width:${pct}%"></span></span><span class="v">${n}명 · ${pct}%</span></div>`;
  }).join("")}<div class="src">서강대학교 학생 23명 (남자 4명, 여자 19명) · 2026년 · 한 사람이 한 가지만 골랐습니다</div></div>`;
}
function body(p) {
  const showEn = mode === "koen";
  if (p.id === "s6") return p.ko.map((line, i) => {
    const m = line.match(/^([AB]):\s*(.*)$/) || [null, "", line];
    const en = (p.en[i] || "").replace(/^[AB]:\s*/, "");
    return `<div class="turn"><span class="who ${m[1]}">${m[1]}</span><div><div class="k">${hl(m[2], p.marks)}</div>${showEn && en ? `<div class="e">${esc(en)}</div>` : ""}</div></div>`;
  }).join("");
  return p.ko.map((para, i) => `<div class="p"><div class="k">${hl(para, p.marks)}</div>${showEn && p.en[i] ? `<div class="e">${esc(p.en[i])}</div>` : ""}</div>`).join("");
}
function render() {
  document.getElementById("list").innerHTML = PIECES.map(p => `
    <section id="${p.id}">
      <div class="meta"><b>${p.ch}</b><span>${p.chars}자 (공백 포함)</span></div>
      <h2>${esc(p.title)}</h2>
      <p class="s2">${esc(p.sub)}</p>
      <ul class="gram">${p.grammar.map(g => `<li>${esc(g)}</li>`).join("")}</ul>
      ${p.survey ? chart(p) : ""}
      ${body(p)}
    </section>`).join("");
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === mode));
}
document.querySelectorAll(".modes button").forEach(b => b.onclick = () => {
  mode = b.dataset.m; try { localStorage.setItem("k5b_writing_mode", mode); } catch (e) {}
  render();
});
render();
</script>
</body>
</html>
